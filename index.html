    {term:'Persuasion', def:'goal is to change the opinion of the other person.'},
    {term:'Aesthetic', def:'achieved when there is a deeper connection between sender and receiver.'},
    {term:'Therapeutic', def:'goal is to make the other person\'s feelings much better.'},
    {term:'Discussion/Argumentation', def:'a healthy exchange of ideas, working toward a solution.'},
    {term:'Cultural Promotion', def:'communicating in order to understand a person from a different cultural background.'}
  ], palace:[
    {stop:'Garage', image:'A referee whistle hangs on a hook, blasting every time someone walks by without permission, right next to a doctor\'s clipboard ordering a nurse around.', fact:'Regulation/Control: wanting others to manage their behavior or do what you want.'},
    {stop:'Backyard Table', image:'Two strangers forced to share one umbrella in the rain end up laughing and swapping stories, while teachers nearby giggle over lounge gossip.', fact:'Social Interaction: forming bonds/friendship.'},
    {stop:'Gym Corner', image:'A sales agent in a tracksuit hypes up a crowd with a megaphone while a coach benches an athlete to convince him to stay.', fact:'Motivation: persuading, convincing, or inspiring.'},
    {stop:'Doorstep', image:'A street child extends an open palm, eyes wide and pleading, while a terminated employee kneels beside them begging for a second chance.', fact:'Emotional Expression: appealing to others\' emotions.'},
    {stop:'Mailbox', image:'A stack of DOH reports spills out of the mailbox, covered in graphs and casualty numbers, next to a NASA telegram about a new planet.', fact:'Information: sharing facts, figures, statistics.'},
    {stop:'Kitchen Counter', image:'A note that says "I qualified for the tournament!" is taped over a hidden note underneath reading "...so please excuse my absence."', fact:'Primary vs. Secondary function: the real agenda (Regulation/Control) can hide behind a surface function (Information).'}
  ], summary:[
    {h:'Quick Recap: 5 Communication Functions', b:[
      'Regulation/Control — manage someone\'s behavior (teacher\'s instructions, referee\'s whistle).',
      'Social Interaction — form bonds/connection (classmates chatting, small talk with strangers).',
      'Motivation — persuade, convince, inspire (sales agent, coach).',
      'Emotional Expression — appeal to sympathy (asking for a deadline extension).',
      'Information — share verifiable facts (DOH report, NASA announcement).'
    ]},
    {h:'Primary vs. Secondary', b:[
      'Primary = your real agenda. Secondary = the function you use to help achieve it.',
      'Example: telling your teacher about a tournament (secondary: Information) so you can be excused for an absence (primary: Regulation/Control).'
    ]},
    {h:'Other Named Functions', b:[
      'Informative (equal-status speakers) vs. Instructive (unequal-status speakers).',
      'Persuasion — change someone\'s opinion. Aesthetic — deeper connection. Therapeutic — make someone feel better.'
    ]}
  ]},
  {id:'ecproc', title:'4. The Communication Process', content:[
    {h:'Communication as a Process', b:[
      'Communication undergoes a process — it has certain stages or phases that participants must go through in order for communication to be considered as having taken place.',
      'Based on Vizconde, Dayao, & Engracia\'s "Reading and Writing in the Academe and Workplace," the communication process has 6 stages, divided into two roles: the Sender of the Message and the Receiver of the Message.',
      'Three stages belong to the sender, and three belong to the receiver — both parties have an equal share of responsibility, which is why communication is often viewed as a two-way process.'
    ]},
    {h:'Visualizing the Process', svg:'<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Communication process loop diagram"> <defs> <marker id="arrProc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <text x="130" y="20" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--accent2)">SENDER</text> <text x="630" y="205" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--accent2)">RECEIVER</text> <rect x="20" y="40" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="120" y="65" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">1. Idea</text> <text x="120" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">Formulation</text> <rect x="280" y="40" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="380" y="75" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">2. Encoding</text> <rect x="540" y="40" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="640" y="75" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">3. Transmission</text> <rect x="540" y="220" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="640" y="255" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">4. Receiving</text> <rect x="280" y="220" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="380" y="255" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">5. Decoding</text> <rect x="20" y="220" width="200" height="60" rx="10" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="120" y="245" text-anchor="middle" font-size="12" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">6. Feedback</text> <line x1="220" y1="70" x2="275" y2="70" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrProc)"/> <line x1="480" y1="70" x2="535" y2="70" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrProc)"/> <line x1="700" y1="100" x2="700" y2="215" style="stroke:var(--muted);stroke-width:2" marker-end="url(#arrProc)"/> <line x1="540" y1="250" x2="485" y2="250" style="stroke:var(--accent2);stroke-width:2" marker-end="url(#arrProc)"/> <line x1="280" y1="250" x2="225" y2="250" style="stroke:var(--accent2);stroke-width:2" marker-end="url(#arrProc)"/> <line x1="60" y1="220" x2="60" y2="105" style="stroke:var(--muted);stroke-width:2;stroke-dasharray:5,4" marker-end="url(#arrProc)"/> <text x="30" y="165" font-size="10" font-style="italic" font-family="system-ui,sans-serif" style="fill:var(--muted)" transform="rotate(-90 30 165)">cycle can repeat</text> </svg>', b:[
      'The diagram above shows the process as a loop: the Sender\'s 3 stages run left-to-right on top, the message crosses over to the Receiver\'s side, and the Receiver\'s 3 stages run right-to-left on the bottom before the cycle can begin again.'
    ]},
    {h:'Stages on the Sender\'s Side', b:[
      '1. Idea Formulation: the sender thinks of a message to communicate and decides to share it.',
      '2. Encoding: the sender transforms the message using verbal and non-verbal communication.',
      '3. Transmission: the sender gives/sends out the message.'
    ]},
    {h:'Stages on the Receiver\'s Side', b:[
      '4. Receiving: the receiver gets the message.',
      '5. Decoding: the receiver processes the information.',
      '6. Feedback: the receiver responds to the message.'
    ]},
    {h:'Why This Matters', b:[
      'If any of the six stages breaks down (e.g. the message is poorly encoded, or the receiver fails to decode it correctly), communication as a whole can fail or be misunderstood.',
      'This process underlies most of the communication models you will study next — each model is really just a different expert\'s way of visualizing and explaining these same basic stages.'
    ]}
  
  ], quiz:[
    {q:'According to Vizconde, Dayao, & Engracia, the communication process is made up of how many stages?', c:['4','5','6','8'], a:2, e:'The communication process has 6 stages: idea formulation, encoding, transmission, receiving, decoding, and feedback.'},
    {q:'Out of the 6 stages of the communication process, how many belong to the Sender?', c:['2','3','4','6'], a:1, e:'3 stages belong to the sender (idea formulation, encoding, transmission) and 3 belong to the receiver (receiving, decoding, feedback).'},
    {q:'The stage where the sender thinks of a message and decides to share it is called:', c:['Encoding','Idea Formulation','Transmission','Receiving'], a:1, e:'Idea Formulation is the first stage — the sender conceives of a message and decides to share it.'},
    {q:'The stage where the sender transforms the message using verbal and non-verbal communication is called:', c:['Idea Formulation','Transmission','Encoding','Decoding'], a:2, e:'Encoding is when the sender turns the idea into a communicable form using verbal and non-verbal cues.'},
    {q:'The stage where the sender gives out the message is called:', c:['Transmission','Encoding','Feedback','Receiving'], a:0, e:'Transmission is when the sender actually sends/delivers the message.'},
    {q:'The stage where the receiver gets the message is called:', c:['Decoding','Feedback','Receiving','Encoding'], a:2, e:'Receiving is simply when the receiver gets the message that was sent.'},
    {q:'The stage where the receiver processes the information is called:', c:['Decoding','Receiving','Transmission','Idea Formulation'], a:0, e:'Decoding is when the receiver interprets/processes the message they received.'},
    {q:'The stage where the receiver responds to the message is called:', c:['Receiving','Decoding','Feedback','Encoding'], a:2, e:'Feedback is the receiver\'s response to the message.'},
    {q:'Which of the following is the correct order of the sender\'s stages?', c:['Encoding → Idea Formulation → Transmission','Idea Formulation → Encoding → Transmission','Transmission → Encoding → Idea Formulation','Idea Formulation → Transmission → Encoding'], a:1, e:'The sender\'s stages, in order, are: Idea Formulation, then Encoding, then Transmission.'},
    {q:'Which of the following is the correct order of the receiver\'s stages?', c:['Decoding → Receiving → Feedback','Feedback → Decoding → Receiving','Receiving → Decoding → Feedback','Receiving → Feedback → Decoding'], a:2, e:'The receiver\'s stages, in order, are: Receiving, then Decoding, then Feedback.'},
    {q:'Why is communication often described as a "two-way process" based on this model?', c:['Because it only happens between two people','Because both the sender and receiver each have three stages/responsibilities','Because feedback always happens twice','Because there are two channels used'], a:1, e:'Since three of the six stages belong to the sender and three to the receiver, both parties share the responsibility of making communication happen.'},
    {q:'A teacher explaining a lesson out loud to the class demonstrates which stage?', c:['Decoding','Transmission','Feedback','Receiving'], a:1, e:'Delivering the message out loud is Transmission — the sender giving the message.'},
    {q:'A student nodding in agreement while listening to the teacher demonstrates which stage?', c:['Encoding','Idea Formulation','Feedback','Transmission'], a:2, e:'The receiver\'s response (nodding) is Feedback.'},
    {q:'Choosing the right words and gestures to express your idea before speaking demonstrates which stage?', c:['Idea Formulation','Encoding','Transmission','Receiving'], a:1, e:'Encoding is transforming the idea into verbal/non-verbal form before sending it.'},
    {q:'Thinking "I want to tell my friend about my weekend" before actually saying anything demonstrates which stage?', c:['Idea Formulation','Encoding','Transmission','Decoding'], a:0, e:'This is Idea Formulation — the sender conceives the message and decides to share it.'},
    {q:'A listener trying to make sense of what was just said to them demonstrates which stage?', c:['Receiving','Decoding','Feedback','Transmission'], a:1, e:'Decoding is when the receiver processes/interprets the information.'},
    {q:'Which role in the communication process includes the stage of "Receiving"?', c:['Sender','Receiver','Both equally','Neither'], a:1, e:'Receiving is one of the three stages that belong to the Receiver.'},
    {q:'Which role in the communication process includes the stage of "Transmission"?', c:['Sender','Receiver','Both equally','Neither'], a:0, e:'Transmission is one of the three stages that belong to the Sender.'},
    {q:'If a message is poorly encoded by the sender, what is the most likely consequence?', c:['The receiver will always understand it perfectly anyway','The message may be misunderstood or communication may fail','Feedback becomes automatic','The transmission stage is skipped'], a:1, e:'Since encoding shapes how the message is expressed, poor encoding increases the risk of miscommunication.'},
    {q:'What is the source cited in the notes for this 6-stage explanation of the communication process?', c:['Aristotle','Shannon and Weaver','Vizconde, Dayao, & Engracia','Berlo'], a:2, e:'The 6-stage communication process explanation is credited to Vizconde, Dayao, & Engracia in "Reading and Writing in the Academe and Workplace."'},
    {q:'Which of these correctly pairs a stage with its role?', c:['Encoding — Receiver','Feedback — Sender','Decoding — Receiver','Transmission — Receiver'], a:2, e:'Decoding belongs to the Receiver\'s side of the process.'},
    {q:'Which of these correctly pairs a stage with its role?', c:['Idea Formulation — Receiver','Idea Formulation — Sender','Receiving — Sender','Feedback — Sender'], a:1, e:'Idea Formulation belongs to the Sender\'s side of the process.'},
    {q:'How many stages in total belong to the Receiver in the communication process?', c:['2','3','4','1'], a:1, e:'3 stages belong to the receiver: Receiving, Decoding, and Feedback.'},
    {q:'Communication is considered to have "taken place" when:', c:['The sender has finished speaking','Both the sender and receiver have gone through all their respective stages','Only the message has been transmitted','Only feedback has been given'], a:1, e:'Communication is complete once both sender-side stages and receiver-side stages have occurred.'},
    {type:'dual', s1:'Idea Formulation is the first stage of the communication process.', s2:'Feedback is the last stage of the communication process.', a:0, e:'Both statements are true — Idea Formulation starts the process on the sender\'s side, and Feedback closes it on the receiver\'s side.'},
    {type:'dual', s1:'Encoding belongs to the sender\'s side of the process.', s2:'Decoding belongs to the sender\'s side of the process as well.', a:2, e:'Statement 1 is true, but Statement 2 is false — Decoding belongs to the RECEIVER\'s side, not the sender\'s.'},
    {type:'dual', s1:'The communication process has 6 stages total.', s2:'All 6 stages belong equally to the sender.', a:2, e:'Statement 1 is true, but Statement 2 is false — only 3 of the 6 stages belong to the sender; the other 3 belong to the receiver.'},
    {type:'dual', s1:'Transmission is when the sender gives out the message.', s2:'Receiving is when the receiver gets the message.', a:0, e:'Both statements are true — these are the correct definitions of Transmission and Receiving.'},
    {type:'dual', s1:'Poor encoding by the sender has no effect on communication.', s2:'Communication can fail if any of the six stages breaks down.', a:3, e:'Statement 2 is true, but Statement 1 is false — poor encoding CAN cause miscommunication, since it shapes how the message is understood.'}
  ], glossary:[
    {term:'Idea Formulation', def:'the sender thinks of a message to communicate and decides to share it.'},
    {term:'Encoding', def:'the sender transforms the message using verbal and non-verbal communication.'},
    {term:'Transmission', def:'the sender gives/sends the message.'},
    {term:'Receiving', def:'the receiver gets the message.'},
    {term:'Decoding', def:'the receiver processes the information.'},
    {term:'Feedback', def:'the receiver responds to the message.'}
  ], palace:[
    {stop:'Front Door', image:'You stand at your front door forming a thought bubble above your head before saying anything out loud.', fact:'Idea Formulation: the sender thinks of a message and decides to share it.'},
    {stop:'Hallway Mirror', image:'You rehearse your words and practice your hand gestures in the mirror before stepping outside.', fact:'Encoding: the sender transforms the message using verbal and non-verbal cues.'},
    {stop:'Front Porch', image:'You finally shout your message across the yard to your neighbor.', fact:'Transmission: the sender gives/sends the message.'},
    {stop:'Neighbor\'s Gate', image:'Your neighbor perks up their ears the moment the sound reaches them.', fact:'Receiving: the receiver gets the message.'},
    {stop:'Neighbor\'s Porch', image:'Your neighbor tilts their head, visibly processing and translating what you just said.', fact:'Decoding: the receiver processes the information.'},
    {stop:'Neighbor\'s Doorway', image:'Your neighbor finally shouts a reply and waves back at you.', fact:'Feedback: the receiver responds to the message.'}
  ], summary:[
    {h:'6 Stages, Split Evenly', b:[
      'Sender: 1) Idea Formulation → 2) Encoding → 3) Transmission.',
      'Receiver: 4) Receiving → 5) Decoding → 6) Feedback.',
      'Equal 3-3 split between sender and receiver is why communication is a two-way process.'
    ]}
  ]},
  {id:'ec4', title:'5. Communication Models', content:[
    {h:'What Are Communication Models?', b:[
      'Conceptual frameworks to better understand the way of communicating; theories explaining our way of communicating with each other.',
      'Try to answer the 5 W\'s and 1 H (Who, What, When, Where, Why, How).',
      'Common elements: Source/Sender, Message, Channel, Receiver.',
      'Noise: communication barriers — internal (hungry, angry, stressed, headache) or external (cars honking, broken mic, loud people, heavy rain).'
    ]},
    {h:'Aristotle\'s Model (Before 300 BC)', svg:'<svg viewBox="0 0 760 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aristotle\'s model diagram"> <defs> <marker id="arrAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <circle cx="70" cy="90" r="55" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="70" y="95" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">Speaker</text> <circle cx="260" cy="90" r="55" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="260" y="95" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">Speech</text> <text x="260" y="20" text-anchor="middle" font-size="10" font-style="italic" font-family="system-ui,sans-serif" style="fill:var(--muted)">(on a specific Occasion)</text> <circle cx="500" cy="90" r="55" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="500" y="95" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">Audience</text> <circle cx="690" cy="90" r="55" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="690" y="95" text-anchor="middle" font-size="13" font-weight="bold" font-family="system-ui,sans-serif" style="fill:var(--ink)">Effect</text> <line x1="125" y1="90" x2="200" y2="90" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrAr)"/> <line x1="315" y1="90" x2="440" y2="90" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrAr)"/> <line x1="555" y1="90" x2="630" y2="90" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrAr)"/> </svg>', b:[
      'The father of communication models and one of the first and simplest; Speaker → Speech (on a specific Occasion) → Audience → Effect.',
      'Broadly divided into 5 primary elements: speaker, speech, occasion, audience, and effect. Uses ethos (credibility), pathos (emotional appeal), logos (logic).',
      'Considered very practical for Aristotle\'s time, which was characterized by play performances. Does not include direct feedback, only an "effect."'
    ]},
    {h:'Laswell\'s Model (1948)', svg:'<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laswell\'s model diagram"> <defs> <marker id="arrLa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <!-- box template: 130 wide, 70 tall, gaps of 30, 5 boxes --> <g font-family="system-ui,sans-serif"> <rect x="10" y="30" width="130" height="70" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="75" y="55" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Who</text> <text x="75" y="72" text-anchor="middle" font-size="10" style="fill:var(--muted)">Communicator</text> <rect x="170" y="30" width="130" height="70" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="235" y="50" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Says</text> <text x="235" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">What</text> <text x="235" y="82" text-anchor="middle" font-size="10" style="fill:var(--muted)">Message</text> <rect x="330" y="30" width="140" height="70" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="400" y="50" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">In Which</text> <text x="400" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Channel</text> <text x="400" y="82" text-anchor="middle" font-size="10" style="fill:var(--muted)">Medium</text> <rect x="500" y="30" width="130" height="70" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="565" y="50" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">To</text> <text x="565" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Whom</text> <text x="565" y="82" text-anchor="middle" font-size="10" style="fill:var(--muted)">Receiver</text> <rect x="660" y="30" width="130" height="70" rx="8" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="725" y="50" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">With What</text> <text x="725" y="65" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Effect?</text> <text x="725" y="82" text-anchor="middle" font-size="10" style="fill:var(--muted)">Outcome</text> </g> <line x1="140" y1="65" x2="165" y2="65" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrLa)"/> <line x1="300" y1="65" x2="325" y2="65" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrLa)"/> <line x1="470" y1="65" x2="495" y2="65" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrLa)"/> <line x1="630" y1="65" x2="655" y2="65" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrLa)"/> </svg>', b:[
      'Answers 5 questions — Who (the person who formulates the message/communicator), Says What (the content of the message), In Which Channel (the medium by which the message is communicated), To Whom (the person/persons who receive the message), With What Effect (the outcome of the message).',
      'Very similar to Aristotle\'s model except Laswell changed the variables and explicitly added the channel/medium — likely inspired by the rise of television and radio around that time. Still linear, one-way.'
    ]},
    {h:'Shannon-Weaver Model (1949)', svg:'<svg viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shannon-Weaver model diagram"> <defs> <marker id="arrSh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> <marker id="arrShNoise" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--warn)"/> </marker> </defs> <g font-family="system-ui,sans-serif"> <rect x="10" y="40" width="130" height="60" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="75" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Info</text> <text x="75" y="80" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Source</text> <rect x="180" y="40" width="130" height="60" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="245" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Trans-</text> <text x="245" y="80" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">mitter</text> <rect x="350" y="40" width="100" height="60" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="400" y="75" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Channel</text> <rect x="490" y="40" width="130" height="60" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="555" y="75" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Receiver</text> <rect x="660" y="40" width="130" height="60" rx="8" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="725" y="65" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Destin-</text> <text x="725" y="80" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">ation</text> <rect x="345" y="150" width="110" height="55" rx="8" style="fill:var(--card);stroke:var(--warn);stroke-width:2"/> <text x="400" y="172" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--warn)">Noise</text> <text x="400" y="188" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--warn)">Source</text> </g> <line x1="140" y1="70" x2="175" y2="70" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrSh)"/> <line x1="310" y1="70" x2="345" y2="70" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrSh)"/> <line x1="450" y1="70" x2="485" y2="70" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrSh)"/> <line x1="620" y1="70" x2="655" y2="70" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrSh)"/> <line x1="400" y1="148" x2="400" y2="103" style="stroke:var(--warn);stroke-width:3" marker-end="url(#arrShNoise)"/> <text x="230" y="25" text-anchor="middle" font-size="10" font-style="italic" font-family="system-ui,sans-serif" style="fill:var(--muted)">message</text> <text x="570" y="25" text-anchor="middle" font-size="10" font-style="italic" font-family="system-ui,sans-serif" style="fill:var(--muted)">message</text> </svg>', b:[
      'Sometimes considered the "mother of communication models," since many later models were created in response to what experts thought this model lacked.',
      'Introduces the concepts of Info Source, Transmitter, Channel, Receiver, and Destination — or more generally, sender, encoder, channel, decoder, receiver.',
      'It was the FIRST model to introduce the concept of a Noise Source (barriers to communication).'
    ]},
    {h:'Berlo\'s Model / S-M-C-R Model (1960)', svg:'<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Berlo\'s S-M-C-R model diagram"> <defs> <marker id="arrBe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <g font-family="system-ui,sans-serif"> <!-- Column headers --> <rect x="10" y="10" width="170" height="40" rx="8" style="fill:var(--accent);stroke:var(--accent);stroke-width:2"/> <text x="95" y="35" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#fff">SOURCE</text> <rect x="210" y="10" width="170" height="40" rx="8" style="fill:var(--accent2);stroke:var(--accent2);stroke-width:2"/> <text x="295" y="35" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#fff">MESSAGE</text> <rect x="410" y="10" width="170" height="40" rx="8" style="fill:var(--accent2);stroke:var(--accent2);stroke-width:2"/> <text x="495" y="35" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#fff">CHANNEL</text> <rect x="610" y="10" width="180" height="40" rx="8" style="fill:var(--accent);stroke:var(--accent);stroke-width:2"/> <text x="700" y="35" text-anchor="middle" font-size="14" font-weight="bold" style="fill:#fff">RECEIVER</text> <!-- Source column items --> <rect x="10" y="65" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="95" y="91" text-anchor="middle" font-size="11" style="fill:var(--ink)">Communication Skill</text> <rect x="10" y="113" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="95" y="139" text-anchor="middle" font-size="11" style="fill:var(--ink)">Attitudes</text> <rect x="10" y="161" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="95" y="187" text-anchor="middle" font-size="11" style="fill:var(--ink)">Knowledge</text> <rect x="10" y="209" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="95" y="235" text-anchor="middle" font-size="11" style="fill:var(--ink)">Social System</text> <rect x="10" y="257" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="95" y="283" text-anchor="middle" font-size="11" style="fill:var(--ink)">Culture</text> <!-- Message column items --> <rect x="210" y="65" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="295" y="91" text-anchor="middle" font-size="11" style="fill:var(--ink)">Content</text> <rect x="210" y="113" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="295" y="139" text-anchor="middle" font-size="11" style="fill:var(--ink)">Elements</text> <rect x="210" y="161" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="295" y="187" text-anchor="middle" font-size="11" style="fill:var(--ink)">Treatment</text> <rect x="210" y="209" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="295" y="235" text-anchor="middle" font-size="11" style="fill:var(--ink)">Structure</text> <rect x="210" y="257" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="295" y="283" text-anchor="middle" font-size="11" style="fill:var(--ink)">Code</text> <!-- Channel column items: the five senses --> <rect x="410" y="65" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="495" y="91" text-anchor="middle" font-size="11" style="fill:var(--ink)">Hearing</text> <rect x="410" y="113" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="495" y="139" text-anchor="middle" font-size="11" style="fill:var(--ink)">Seeing</text> <rect x="410" y="161" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="495" y="187" text-anchor="middle" font-size="11" style="fill:var(--ink)">Touching</text> <rect x="410" y="209" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="495" y="235" text-anchor="middle" font-size="11" style="fill:var(--ink)">Smelling</text> <rect x="410" y="257" width="170" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="495" y="283" text-anchor="middle" font-size="11" style="fill:var(--ink)">Tasting</text> <!-- Receiver column items (mirrors Source) --> <rect x="610" y="65" width="180" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="700" y="91" text-anchor="middle" font-size="11" style="fill:var(--ink)">Communication Skill</text> <rect x="610" y="113" width="180" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="700" y="139" text-anchor="middle" font-size="11" style="fill:var(--ink)">Attitudes</text> <rect x="610" y="161" width="180" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="700" y="187" text-anchor="middle" font-size="11" style="fill:var(--ink)">Knowledge</text> <rect x="610" y="209" width="180" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="700" y="235" text-anchor="middle" font-size="11" style="fill:var(--ink)">Social System</text> <rect x="610" y="257" width="180" height="42" rx="6" style="fill:var(--card);stroke:var(--border);stroke-width:1.5"/> <text x="700" y="283" text-anchor="middle" font-size="11" style="fill:var(--ink)">Culture</text> <text x="400" y="335" text-anchor="middle" font-size="12" font-style="italic" style="fill:var(--muted)">A Source encodes a Message for a Channel to reach a Receiver who decodes it — the S-M-C-R model.</text> </g> <line x1="180" y1="86" x2="205" y2="86" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrBe)"/> <text x="192" y="78" text-anchor="middle" font-size="9" font-family="system-ui,sans-serif" style="fill:var(--muted)">Encodes</text> <line x1="580" y1="86" x2="605" y2="86" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrBe)"/> <text x="592" y="78" text-anchor="middle" font-size="9" font-family="system-ui,sans-serif" style="fill:var(--muted)">Decodes</text> </svg>', b:[
      'A Source encodes a Message for a Channel to a Receiver who decodes the message.',
      'Both the Source and the Receiver share 5 factors that affect communication: Communication Skill, Attitudes, Knowledge, Social System, and Culture.',
      'The Message itself has its own factors: Content, Elements, Treatment, Structure, and Code.',
      'The Channel refers to the five senses used to perceive the message: hearing, seeing, touching, smelling, and tasting.',
      'This model received a lot of criticism for still being linear (reverting to the old, simple notion of communication), which prompted many experts to revise it by adding feedback and noise. Even so, it remains valuable because it specifies in detail what components make up each variable of the process.'
    ]},
    {h:'Schramm\'s Model (1954)', svg:'<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schramm\'s model diagram"> <defs> <marker id="arrSc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--ink)"/> </marker> </defs> <ellipse cx="270" cy="160" rx="230" ry="130" style="fill:var(--accent);opacity:0.12;stroke:var(--accent);stroke-width:2"/> <ellipse cx="430" cy="160" rx="230" ry="130" style="fill:var(--accent2);opacity:0.12;stroke:var(--accent2);stroke-width:2"/> <g font-family="system-ui,sans-serif"> <text x="180" y="60" text-anchor="middle" font-size="12" font-style="italic" style="fill:var(--accent)">Field of Experience</text> <text x="520" y="60" text-anchor="middle" font-size="12" font-style="italic" style="fill:var(--accent2)">Field of Experience</text> <rect x="90" y="140" width="90" height="40" rx="6" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="135" y="165" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Source</text> <polygon points="220,110 220,210 300,160" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="245" y="165" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Encoder</text> <rect x="320" y="140" width="60" height="40" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/> <text x="350" y="165" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Signal</text> <polygon points="480,110 480,210 400,160" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="450" y="165" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Decoder</text> <rect x="520" y="140" width="100" height="40" rx="6" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="570" y="165" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Destination</text> <text x="350" y="245" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)" text-decoration="underline">Field of Common Experience</text> <line x1="350" y1="252" x2="350" y2="200" style="stroke:var(--ink);stroke-width:1.5" marker-end="url(#arrSc)"/> </g> </svg>', b:[
      'Plainly compares the sender and receiver to two overlapping circles of a Venn Diagram, each with their own "field of experience."',
      'The overlapping/convergent area is the "Field of Common Experience" — the commonalities the sender and receiver share. The wider this shared field, the more successful the interaction tends to be.',
      'Unlike the first three linear models, Schramm\'s model is Interactive: the sender and receiver take turns assuming the roles of sender and receiver.'
    ]},
    {h:'Barnlund\'s Model (1970)', svg:'<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barnlund\'s transactional model diagram"> <defs> <marker id="arrBa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--warn)"/> </marker> <marker id="arrBa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <ellipse cx="240" cy="170" rx="210" ry="120" style="fill:var(--accent);opacity:0.10;stroke:var(--accent);stroke-width:2"/> <ellipse cx="480" cy="170" rx="210" ry="120" style="fill:var(--accent2);opacity:0.10;stroke:var(--accent2);stroke-width:2"/> <g font-family="system-ui,sans-serif"> <rect x="60" y="145" width="150" height="55" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="135" y="167" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Communicator</text> <text x="135" y="184" text-anchor="middle" font-size="10" style="fill:var(--muted)">(Sends &amp; Receives)</text> <rect x="510" y="145" width="150" height="55" rx="8" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="585" y="167" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Communicator</text> <text x="585" y="184" text-anchor="middle" font-size="10" style="fill:var(--muted)">(Sends &amp; Receives)</text> <rect x="300" y="150" width="120" height="45" rx="8" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/> <text x="360" y="177" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Message</text> <text x="360" y="135" text-anchor="middle" font-size="10" font-style="italic" style="fill:var(--muted)">Feedback ⇄ Channel(s)</text> <text x="360" y="295" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Sending &amp; receiving happen SIMULTANEOUSLY</text> </g> <line x1="210" y1="172" x2="295" y2="172" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrBa2)"/> <line x1="420" y1="184" x2="505" y2="184" style="stroke:var(--accent2);stroke-width:2" marker-end="url(#arrBa2)"/> <line x1="505" y1="160" x2="420" y2="160" style="stroke:var(--accent2);stroke-width:2;stroke-dasharray:4,3" marker-end="url(#arrBa2)"/> <line x1="295" y1="160" x2="210" y2="160" style="stroke:var(--accent);stroke-width:2;stroke-dasharray:4,3" marker-end="url(#arrBa2)"/> <!-- Noise arrows from all directions --> <line x1="60" y1="30" x2="105" y2="90" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="45" y="22" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> <line x1="240" y1="20" x2="240" y2="55" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="240" y="14" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> <line x1="480" y1="20" x2="480" y2="55" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="480" y="14" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> <line x1="660" y1="30" x2="615" y2="90" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="640" y="22" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> <line x1="70" y1="310" x2="115" y2="250" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="45" y="318" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> <line x1="650" y1="310" x2="605" y2="250" style="stroke:var(--warn);stroke-width:2" marker-end="url(#arrBa)"/> <text x="620" y="318" font-size="10" font-family="system-ui,sans-serif" style="fill:var(--warn)">Noise</text> </svg>', b:[
      'Offers a fresh, Transactional take — sending and receiving happen SIMULTANEOUSLY, meaning both communicators assume the role of sender and receiver at the same time.',
      'Communicators respond to and decode messages while also encoding and sending their own — with noise (external and internal) surrounding the entire interaction throughout.'
    ]},
    {h:'Julia Wood\'s Model (2009)', b:[
      'Similar to Schramm\'s Model but adds the element of TIME (t1, t2, t3...) — showing that the shared field of experience expands and evolves the longer two people continue communicating with each other.'
    ]},
    {h:'E-Mediated Communication Model (2016)', svg:'<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="E-mediated communication model diagram"> <defs> <marker id="arrEm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <g font-family="system-ui,sans-serif"> <rect x="20" y="20" width="160" height="55" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="100" y="42" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">SENDER /</text> <text x="100" y="58" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">RECEIVER</text> <rect x="20" y="110" width="160" height="55" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="100" y="142" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">MESSAGE</text> <rect x="270" y="65" width="220" height="70" rx="8" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="380" y="88" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">MEDIUM / CHANNEL</text> <text x="380" y="105" text-anchor="middle" font-size="9" style="fill:var(--muted)">Facebook, Twitter, Instagram, Skype,</text> <text x="380" y="119" text-anchor="middle" font-size="9" style="fill:var(--muted)">Line, Messenger, email, blogs, calls</text> <rect x="270" y="170" width="220" height="70" rx="8" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="380" y="193" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">FEEDBACK</text> <text x="380" y="212" text-anchor="middle" font-size="9" style="fill:var(--muted)">Emojis, emoticons,</text> <text x="380" y="226" text-anchor="middle" font-size="9" style="fill:var(--muted)">reactions, replies</text> <rect x="560" y="65" width="150" height="70" rx="8" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="635" y="88" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">CONTEXT</text> <text x="635" y="107" text-anchor="middle" font-size="9" style="fill:var(--muted)">Environment</text> <text x="635" y="121" text-anchor="middle" font-size="9" style="fill:var(--muted)">Time · Situation</text> </g> <line x1="100" y1="75" x2="100" y2="105" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrEm)"/> <line x1="180" y1="100" x2="265" y2="100" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrEm)"/> <line x1="380" y1="135" x2="380" y2="165" style="stroke:var(--accent2);stroke-width:2" marker-end="url(#arrEm)"/> <path d="M 270 205 C 220 205 195 130 195 47 L 185 47" style="fill:none;stroke:var(--accent2);stroke-width:2" marker-end="url(#arrEm)"/> <line x1="490" y1="100" x2="555" y2="100" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrEm)"/> </svg>', b:[
      'Explains how individuals engage and exchange information through cyberspace — a framework especially relevant to a generation immersed in technology.',
      'Sender/Receiver: interchange roles as they constantly shift between conveying and interpreting messages.',
      'Message: the idea, comment, thought, or expression being communicated, which must be transmitted clearly to avoid miscommunication.',
      'Medium/Channel: the cyberspace platforms used — such as Facebook, Twitter, Instagram, Skype, Line, Messenger, email, blogs, and video calls.',
      'Feedback: the receiver\'s response, often in the form of emojis, emoticons, reactions, or written replies.',
      'Context: includes the environment, time, and situation of both sender and receiver (e.g. being aware of different time zones or emotional states).',
      'The model adapts depending on the platform: it behaves more like an Interactive model on turn-taking platforms like email, chat, or blogs (where users wait for a response before continuing), and more like a Transactional model on real-time platforms like video calls (where sending, receiving, and feedback happen almost simultaneously).'
    ]},
    {h:'Generalization: 5 Characteristics of Communication', b:[
      'Since different experts interpret the communication process differently, their models end up reflecting 5 broad characteristics that communication can have:',
      'Linear: a one-way process (e.g. Aristotle\'s and Laswell\'s models).',
      'Interactive: a two-way process, but participants take turns (e.g. Schramm\'s model).',
      'Transactional: sending and receiving happen simultaneously (e.g. Barnlund\'s model).',
      'Recursive: the sender and receiver might find themselves going back to a previous stage to correct or clarify something.',
      'Cyclical: communication is a never-ending process — it doesn\'t simply stop once a message is sent and received.'
    ]}
  
  ], quiz:[
    {q:'Which characteristic describes communication as a one-way process, like Aristotle\'s or Laswell\'s models?', c:['Interactive','Linear','Transactional','Cyclical'], a:1, e:'Linear communication is a one-way process, as seen in the earliest models (Aristotle, Laswell).'},
    {q:'Which characteristic describes communication where sending and receiving happen at the exact same time?', c:['Linear','Interactive','Transactional','Recursive'], a:2, e:'Transactional communication, like in Barnlund\'s model, has sending and receiving occurring simultaneously.'},
    {q:'Which characteristic describes a sender/receiver going back to a previous stage to correct or clarify a message?', c:['Cyclical','Recursive','Interactive','Linear'], a:1, e:'Recursive communication involves participants returning to a previous stage of the process to fix or clarify something.'},
    {q:'Which characteristic emphasizes that communication is a never-ending process?', c:['Linear','Transactional','Cyclical','Interactive'], a:2, e:'Cyclical communication reflects the idea that communication doesn\'t just stop — it\'s a continuous, never-ending process.'},
    {q:'Who is considered the "father of communication models"?', c:['Shannon-Weaver','Aristotle','Berlo','Schramm'], a:1, e:'Aristotle is considered the father of communication models, with the oldest and simplest model (before 300 BC).'},
    {q:'Which model uses the sequence: Speaker → Speech → Occasion → Audience → Effect?', c:['Laswell\'s Model','Aristotle\'s Model','Berlo\'s Model','Schramm\'s Model'], a:1, e:'Aristotle\'s Model uses this exact sequence, alongside ethos, pathos, and logos.'},

    {q:'Aristotle\'s Model is considered especially practical for his time because that era was characterized by:', c:['Television broadcasts','Play performances','Social media','Telegraphs'], a:1, e:'Aristotle\'s time was characterized by play/theatrical performances, making the speaker-speech-audience-effect model very fitting.'},
    {q:'In Laswell\'s Model, "In Which Channel" refers to:', c:['The content of the message','The medium by which the message is communicated','The person who receives the message','The outcome of the message'], a:1, e:'"In Which Channel" refers to the medium — how the message is being communicated.'},
    {q:'In Laswell\'s Model, "To Whom" refers to:', c:['The communicator','The content of the message','The person(s) who receive the message','The outcome of the message'], a:2, e:'"To Whom" refers to the receiver — the person or persons who receive the message.'},
    {q:'What likely inspired Laswell to add the "channel/medium" variable to his model?', c:['The invention of the printing press','The rise of television and radio','The invention of the internet','The spread of the telegraph'], a:1, e:'Laswell\'s model was conceptualized around the time television and radio were becoming prominent.'},
    {q:'Which model is described as the "mother of communication models" because many later models were created in response to its perceived shortcomings?', c:['Aristotle\'s Model','Laswell\'s Model','Shannon-Weaver Model','Berlo\'s Model'], a:2, e:'The Shannon-Weaver Model (1949) is called the "mother of communication models" for this exact reason.'},
    {q:'Which model was the FIRST to introduce the concept of a "Noise Source"?', c:['Aristotle\'s Model','Laswell\'s Model','Shannon-Weaver Model','Schramm\'s Model'], a:2, e:'The Shannon-Weaver Model was the first to introduce noise as a barrier to communication.'},
    {q:'In the Shannon-Weaver Model, which component comes right after the "Transmitter"?', c:['Info Source','Channel','Receiver','Destination'], a:1, e:'The sequence is: Info Source → Transmitter → Channel (with Noise Source affecting it) → Receiver → Destination.'},
    {q:'Berlo\'s Model is also known as which acronym-based model?', c:['S-M-C-R Model','W-W-C-W-E Model','S-E-C-D-R Model','A-I-D-A Model'], a:0, e:'Berlo\'s Model (1960) is known as the S-M-C-R (Source-Message-Channel-Receiver) Model.'},
    {q:'In Berlo\'s Model, which of the following is NOT one of the 5 factors shared by BOTH the Source and the Receiver?', c:['Communication Skill','Attitudes','Treatment','Culture'], a:2, e:'"Treatment" is a factor of the Message, not of the Source/Receiver. The Source/Receiver factors are: Communication Skill, Attitudes, Knowledge, Social System, and Culture.'},
    {q:'In Berlo\'s Model, which of the following is one of the 5 factors of the MESSAGE?', c:['Culture','Social System','Structure','Attitudes'], a:2, e:'The Message factors in Berlo\'s Model are: Content, Elements, Treatment, Structure, and Code.'},
    {q:'In Berlo\'s Model, the "Channel" refers to:', c:['Social media platforms','The five human senses (hearing, seeing, touching, smelling, tasting)','TV, radio, and print only','The receiver\'s attitude'], a:1, e:'Berlo\'s Model treats the Channel as the five senses through which a message can be perceived.'},
    {q:'Why did Berlo\'s Model receive a lot of criticism?', c:['It was too transactional','It reverted to the old, linear notion of communication','It failed to mention the message at all','It ignored the receiver completely'], a:1, e:'Despite its detail, Berlo\'s Model was criticized for going back to a purely linear view of communication, prompting revisions that added feedback and noise.'},

    {q:'In Schramm\'s Model, the overlapping area of the two circles is called the:', c:['Noise Zone','Field of Common Experience','Channel','Encoder Zone'], a:1, e:'The overlapping/convergent area represents the Field of Common Experience — the commonalities shared by sender and receiver.'},
    {q:'Why is Schramm\'s Model considered Interactive rather than Linear?', c:['Because sending and receiving happen at the exact same time','Because the sender and receiver take turns assuming each other\'s roles','Because there is no receiver','Because it doesn\'t use a channel'], a:1, e:'Interactive models like Schramm\'s involve turn-taking between the roles of sender and receiver, unlike strictly linear, one-way models.'},

    {q:'In Barnlund\'s Model, noise is depicted as:', c:['Occurring only once, at the very start','Absent entirely','Surrounding both communicators throughout the interaction','Only affecting the receiver'], a:2, e:'In Barnlund\'s Model, noise (both internal and external) surrounds and affects the entire ongoing interaction.'},
    {q:'Julia Wood\'s Model (2009) is similar to Schramm\'s Model but adds which additional variable?', c:['Noise','Time','Channel','Effect'], a:1, e:'Julia Wood\'s Model adds time (t1, t2, t3...) — the shared field of experience expands as communicators continue interacting over time.'},
    {q:'Which model specifically involves cyberspace/technology like SNS, email, and video calls?', c:['Berlo\'s Model','E-Mediated Communication Model','Aristotle\'s Model','Shannon-Weaver Model'], a:1, e:'The E-Mediated Communication Model (2016) makes use of cyberspace/technology as the medium of communication.'},
    {q:'In the E-Mediated Communication Model, which component includes platforms like Facebook, Skype, and email?', c:['Message','Context','Medium/Channel','Feedback'], a:2, e:'The Medium/Channel component covers the cyberspace platforms used to transmit the message.'},
    {q:'In the E-Mediated Communication Model, "Feedback" often comes in the form of:', c:['Formal written letters','Emojis, emoticons, reactions, or replies','Only silence','Handwritten notes'], a:1, e:'Feedback in e-mediated communication is often expressed through emojis, emoticons, reactions, and replies.'},

    {q:'According to the E-Mediated Communication Model, communicating through email or blogs (where users wait for a response) behaves more like a(n) ___ model, while video calls behave more like a(n) ___ model.', c:['Transactional; Interactive','Interactive; Transactional','Linear; Interactive','Transactional; Linear'], a:1, e:'Turn-taking platforms like email/blogs behave more like Interactive models, while real-time platforms like video calls behave more like Transactional models.'},

    {q:'Communication models generally try to answer which set of questions?', c:['If, Then, Else','5 W\'s and 1 H (Who, What, When, Where, Why, How)','True or False questions only','Cause and Effect only'], a:1, e:'Communication models are conceptual frameworks that try to answer the 5 W\'s and 1 H.'},
    {type:'dual', s1:'Aristotle\'s Model is considered linear.', s2:'The Shannon-Weaver Model was the first to introduce the concept of Noise.', a:0, e:'Both statements are true — Aristotle\'s Model is indeed linear, and Shannon-Weaver was the first to introduce Noise as a barrier.'},
