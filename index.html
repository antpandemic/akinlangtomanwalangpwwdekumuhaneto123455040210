      'Behavior and Manners: what is polite/rude varies (e.g. taking home leftovers is normal in PH, rude elsewhere).',
      'Gestures and Body Language: same gesture means different things across cultures (e.g. the "OK" sign).',
      'Legal and Ethical: differences in law (e.g. innocent until proven guilty in PH vs. reverse in Turkey).',
      'Corporate Cultural Differences: work culture differs between companies (e.g. Jollibee vs. McDonald\'s).'
    ]},
    {h:'World Englishes', b:[
      'A relatively new branch in linguistics; suggests any nation using English "owns" it.',
      'Proverbs reflect culture (e.g. Philippine proverbs/sayings).'
    ]},
    {h:'Developmental Model of Intercultural Sensitivity', b:[
      'Denial: does not recognize/acknowledge other cultures.',
      'Defense: acknowledges but thinks highly of one\'s own culture.',
      'Minimization: acknowledges but asserts universality (downplays differences).',
      'Acceptance: starts to appreciate other cultures.',
      'Adaptation: starts to imitate/mimic other cultures.',
      'Integration: starts to reflect and incorporate other cultures into one\'s own identity.'
    ]}
  ], quiz:[
    {q:'Believing your own race/ethnicity is superior to others is called:', c:['Stereotyping','Ethnocentrism','Tolerance','Minimization'], a:1, e:'Ethnocentrism is the belief that one\'s own race/ethnicity is superior to others.'},
    {q:'Generalizing that "Singaporeans are good at math" is an example of:', c:['Ethnocentrism','Stereotyping','Tolerance','Adaptation'], a:1, e:'This generalization about a group of people based on nationality is a classic example of stereotyping.'},
    {q:'High-context cultures rely mostly on:', c:['Explicit spoken words only','Non-verbal, contextual, and shared cultural meanings','Written contracts exclusively','Random behavior'], a:1, e:'High-context cultures rely heavily on non-verbal cues, context, and shared cultural meaning rather than explicit words.'},
    {q:'Low-context cultures convey meaning mainly through:', c:['What is said, rather than how it is said','Non-verbal gestures only','Silence','Random symbols'], a:0, e:'In low-context cultures, meaning depends primarily on the explicit content of what is said.'},
    {q:'Differences in whether one is expected to decide quickly or take time to consult others reflect differences in:', c:['Decision-Making Customs','Personal Space','Legal and Ethical norms','Gestures'], a:0, e:'Decision-Making Customs cover differences in the time and process cultures use to reach decisions (e.g. Canadians vs. Japanese).'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which stage involves NOT recognizing another culture at all?', c:['Defense','Denial','Minimization','Acceptance'], a:1, e:'Denial is the stage where a person does not acknowledge or recognize other people\'s culture.'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which stage involves a person starting to IMITATE another culture?', c:['Acceptance','Adaptation','Integration','Defense'], a:1, e:'Adaptation is when a person starts to imitate or mimic aspects of another culture.'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which is the FINAL stage, involving reflection?', c:['Denial','Minimization','Adaptation','Integration'], a:3, e:'Integration is the final stage, where a person reflects on and incorporates cultural understanding into their identity.'},
    {q:'The idea that "any nation that uses the English language owns it" is associated with:', c:['World Englishes','Ethnocentrism','High-context culture','G.R.E.P.S.'], a:0, e:'World Englishes is a branch of linguistics suggesting that any nation using English has ownership/legitimacy over its own variety of the language.'}
  ], glossary:[
    {term:'Ethnocentrism', def:'thinking your race/ethnicity is superior to others.'},
    {term:'Stereotyping', def:'generalizing people based on group identity.'},
    {term:'High-context / Low-context culture', def:'High relies on non-verbal/shared meaning; Low relies on explicit spoken/written words.'},
    {term:'Developmental Model of Intercultural Sensitivity', def:'Denial → Defense → Minimization → Acceptance → Adaptation → Integration.'}
  ]},
  {id:'ec8', title:'8. Defining Reading', content:[
    {h:'Understanding Reading', b:[
      'Not Just a Basic Skill: the most basic definition is assigning names to symbols, but true reading is more.',
      'A Complex Process: undergoes a series of stages, requiring different strategies for different texts.',
      'Situationally Bound: being good at reading one type of text doesn\'t guarantee skill in others.',
      'Not the Same as Decoding: reading comes with understanding, not just symbol recognition.',
      'Proficiency Requires Both: Accuracy (ability to understand what is read) + Fluency (ability to read smoothly) = Proficiency.'
    ]},
    {h:'Characteristics of a Good Reader', b:[
      'Strategic in monitoring interactive processes that assist comprehension — using two or more strategies (e.g. annotating).',
      'Motivated to read and learn — has a goal in mind.',
      'Socially active around reading tasks — shares insights, applies lessons to daily life.',
      'Mentally engaged — mind is actively part of the process.'
    ]},
    {h:'Psychological Process of Reading', b:[
      'The brain is the tangible organ; the mind is the abstract way of thinking.',
      'Schemata: background knowledge — finding connections between your schema and the new idea being taught.'
    ]},
    {h:'3 Ways of Processing Information When Reading', b:[
      'Bottom-Up Theory: relying heavily on the text itself — no schema yet (e.g. reading Harry Potter for the first time with no prior knowledge).',
      'Top-Down Theory: relying heavily on your schema/background knowledge — constructing meaning based on what you already know.',
      'Interactive Theory: using BOTH your schema and information found in the text.'
    ]}
  ], quiz:[
    {q:'According to the notes, "proficiency" in reading requires the combination of:', c:['Speed and volume','Accuracy and Fluency','Memory and Vocabulary','Grammar and Spelling'], a:1, e:'Proficiency = Accuracy (understanding what is read) + Fluency (reading smoothly).'},
    {q:'"Being good at reading social media posts doesn\'t mean you\'ll be good at reading textbooks" illustrates which characteristic of reading?', c:['Not the Same as Decoding','Situationally Bound','A Complex Process','Not Just a Basic Skill'], a:1, e:'This illustrates that reading is Situationally Bound — skill in one type of text doesn\'t guarantee skill in another.'},
    {q:'Which characteristic of a good reader involves using two or more strategies (like annotating) to comprehend a text?', c:['Motivated to read','Strategic in monitoring comprehension processes','Mentally engaged','Socially active'], a:1, e:'Being strategic in monitoring the interactive processes that assist comprehension means using varied strategies like annotating to understand better.'},
    {q:'"Schemata" in the psychological process of reading refers to:', c:['The physical structure of the brain','Background knowledge','A type of reading disorder','The speed of reading'], a:1, e:'Schemata refers to a reader\'s background knowledge, which connects to new ideas being read.'},
    {q:'Reading Harry Potter for the first time with no prior knowledge, relying heavily on the text itself, illustrates which theory?', c:['Top-Down Theory','Bottom-Up Theory','Interactive Theory','Schema Theory'], a:1, e:'Bottom-Up Theory involves relying heavily on the text because there is no relevant schema/background knowledge yet.'},
    {q:'Constructing meaning primarily based on your existing background knowledge describes which theory?', c:['Bottom-Up Theory','Top-Down Theory','Interactive Theory','Discriminative Theory'], a:1, e:'Top-Down Theory relies heavily on the reader\'s schema/background knowledge to construct meaning.'},
    {q:'Using BOTH your schema and the information in the text describes which theory?', c:['Bottom-Up Theory','Top-Down Theory','Interactive Theory','None of these'], a:2, e:'Interactive Theory combines both schema (background knowledge) and information found directly in the text.'},
    {q:'The distinction between the brain and the mind, as discussed in the psychological process of reading, is that the brain is ___ while the mind is ___.', c:['Abstract; tangible','Tangible; abstract','Both tangible','Both abstract'], a:1, e:'The brain is the tangible physical organ, while the mind is the abstract way of thinking.'}
  ], glossary:[
    {term:'Accuracy + Fluency', def:'= Proficiency in reading.'},
    {term:'Schemata', def:'background knowledge connected to new ideas being read.'},
    {term:'Bottom-Up Theory', def:'relying heavily on the text itself, with little/no schema.'},
    {term:'Top-Down Theory', def:'relying heavily on schema/background knowledge.'},
    {term:'Interactive Theory', def:'using both schema and information in the text.'}
  ]}
]},
{id:'gensci', name:'GenSci: General Science', lessons:[
{id:'gs1', title:'1. Characteristics of Life', content:[
    {h:'Overview', b:['Explores the 7 requirements that determine if something is "living" or nonliving: Metabolism, Reproduction, Homeostasis, Growth & Development, Movement, Heredity, Evolution.']},
    {h:'Metabolism & Reproduction', b:[
      'Metabolism: encompasses all chemical reactions necessary for life; converts food/nutrients into energy and building blocks; an organism cannot grow, reproduce, or respond to its environment without it.',
      'Reproduction: passing of genetic material to offspring, via sexual or asexual means.',
      'Asexual (1 organism): Budding (a "bud" grows on the parent, matures, may detach); Binary fission (DNA duplicates, undergoes mitosis, splits into 2 genetically identical organisms).',
      'Sexual (2 organisms): Gametogenesis (creates sperm/ovum via meiosis, halving the 46 chromosomes in humans); Fertilization (sperm + ovum join to form a zygote).'
    ]},
    {h:'Homeostasis, Growth, Movement', b:[
      'Homeostasis: ability to maintain a stable internal environment (pH, temperature) despite external changes (e.g. sweating when hot).',
      'Growth: increase in size or mass. Development: broader change — physical, mental, behavioral.',
      'Movement: ability to change position or form; visible in animals, plants (e.g. sunflowers following the sun), and response to stimuli.'
    ]},
    {h:'Heredity & Evolution', b:[
      'Heredity: passing of traits from parents to offspring; explains why organisms are both different and similar.',
      'Evolution: change of heritable traits within a species to enhance survival/reproduction in an environment; crucial for survival and diversification of life.',
      'Theory of Use and Disuse: the less a trait is used, the less prominent it becomes over generations; the more it\'s used, the bigger it becomes (e.g. the wrist ligament humans no longer strongly need).'
    ]}
  ], quiz:[
    {q:'How many requirements/characteristics determine if something is "living"?', c:['5','7','9','10'], a:1, e:'The notes explore 7 characteristics of life: Metabolism, Reproduction, Homeostasis, Growth & Development, Movement, Heredity, and Evolution.'},
    {q:'Which asexual reproduction process involves a "bud" growing on the parent that may later detach?', c:['Binary fission','Budding','Gametogenesis','Fertilization'], a:1, e:'Budding involves a growth (bud) forming on the parent body, which matures and may detach to live independently.'},
    {q:'Which asexual reproduction process involves DNA duplication followed by mitosis, splitting into two genetically identical organisms?', c:['Budding','Binary fission','Gametogenesis','Fertilization'], a:1, e:'Binary fission is essentially self-duplication — DNA duplicates, undergoes mitosis, and splits into two identical organisms.'},
    {q:'Gametogenesis uses which process to halve the 46 chromosomes in humans?', c:['Mitosis','Meiosis','Binary fission','Budding'], a:1, e:'Gametogenesis creates gametes (sperm/ovum) using meiosis, which halves the chromosome number.'},
    {q:'Sweating to cool down the body when it\'s hot is an example of which characteristic of life?', c:['Metabolism','Homeostasis','Growth','Heredity'], a:1, e:'This is Homeostasis — maintaining a stable internal environment (temperature) despite external changes.'},
    {q:'A sunflower turning to follow the direction of the sun illustrates which characteristic of life?', c:['Movement','Metabolism','Reproduction','Heredity'], a:0, e:'This illustrates Movement — the ability to change position/form, including plant responses to stimuli.'},
    {q:'The "Theory of Use and Disuse" explains that:', c:['Traits used more become bigger, traits used less fade over generations','All traits stay exactly the same forever','Only new traits can evolve','Traits are inherited randomly with no pattern'], a:0, e:'The Theory of Use and Disuse states that frequently used traits become more prominent, while rarely used ones diminish over generations.'}
  ], glossary:[
    {term:'Metabolism', def:'all chemical reactions necessary for life; converts food into energy and building blocks.'},
    {term:'Budding', def:'a "bud" grows on the parent, matures, and may detach to live independently.'},
    {term:'Binary fission', def:'DNA duplicates, undergoes mitosis, splits into 2 genetically identical organisms.'},
    {term:'Gametogenesis', def:'creates sperm/ovum via meiosis, halving chromosome number.'},
    {term:'Theory of Use and Disuse', def:'traits used more become more prominent; traits used less fade over generations.'}
  ]},
  {id:'gs2', title:'2. Biological Organization', content:[
    {h:'Overview & Biological Systems', b:[
      'Discusses the "layers," structures, and functions of living things (organelles, cells, etc.).',
      'Living organisms, from the smallest cell to the largest organism, are composed of interacting parts.',
      'A biological system: a group of organs/parts working together to perform a job that keeps the organism alive.',
      'These systems are intertwined through a hierarchy called biological organization.'
    ]},
    {h:'Structure & Function, Chemical & Cellular Levels', b:[
      '"Form Follows Function": the structure of a biological component is directly related to its function.',
      'Chemical Level: atoms & molecules are the simple building blocks of life (Atoms → Cells). DNA dictates genetic information — the "blueprint" predetermining traits.',
      'Cellular Level: cells are the basic unit of life; organelles are sub-systems within cells (Cells → Tissues). Examples: blood cells (erythrocytes, carry oxygen), nerve cells (neurons, always active), immune cells (macrophages, fight infection).'
    ]},
    {h:'Tissues, Organs, Organ Systems, Organisms', b:[
      'Tissues: groups of similar cells working together for a specific action (e.g. muscle tissue) — Tissues → Organs.',
      'Organs: tissues working together for specific functions (e.g. lungs, leaves) — Organs → Organ System.',
      'Organ Systems: groups of organs working together (e.g. digestive system, nervous system) — Organ Systems → Organisms.',
      'Organisms: the complete living being (humans, animals, plants).',
      'Beyond the organism: Population → Community → Ecosystem → Biosphere.'
    ]}
  ], quiz:[
    {q:'What principle states that a biological structure\'s form is directly related to its function?', c:['Cell Theory','"Form Follows Function"','Theory of Use and Disuse','Homeostasis'], a:1, e:'"Form Follows Function" is the principle that a biological component\'s structure directly relates to its function.'},
    {q:'At the Chemical Level of organization, which molecule is described as the "blueprint" that predetermines traits?', c:['ATP','DNA','Glucose','Cellulose'], a:1, e:'DNA dictates genetic information — it is the "blueprint" of an organism, predetermining traits and internal states.'},
    {q:'Which cell type is responsible for carrying oxygen throughout the blood system?', c:['Neurons','Erythrocytes (blood cells)','Macrophages','Muscle cells'], a:1, e:'Erythrocytes (red blood cells) travel through the blood system to deliver oxygen.'},
    {q:'Which cell type is part of the immune system, fighting viral and bacterial infections?', c:['Erythrocytes','Neurons','Macrophages','Osteocytes'], a:2, e:'Macrophages are immune cells that work daily to fight against viral and bacterial infections.'},
    {q:'What comes immediately after "Tissues" in the hierarchy of biological organization?', c:['Cells','Organs','Organ Systems','Organisms'], a:1, e:'The hierarchy proceeds: Tissues → Organs (tissues working together for specific functions).'},
    {q:'What is the correct order of levels ABOVE the organism in biological organization?', c:['Population → Community → Ecosystem → Biosphere','Community → Population → Biosphere → Ecosystem','Ecosystem → Population → Community → Biosphere','Biosphere → Ecosystem → Community → Population'], a:0, e:'Beyond the organism, the hierarchy proceeds: Population → Community → Ecosystem → Biosphere.'},
    {q:'A group of organs working together, like the digestive system, is classified as a(n):', c:['Tissue','Organ','Organ System','Organism'], a:2, e:'An Organ System is a group of organs working together, such as the digestive or nervous system.'}
  ], glossary:[
    {term:'Form Follows Function', def:'the structure of a biological component is directly related to its function.'},
    {term:'Biological organization hierarchy', def:'Atoms → Cells → Tissues → Organs → Organ Systems → Organisms → Population → Community → Ecosystem → Biosphere.'}
  ]},
{id:'gs3', title:'3. Cellular Processes: Energy & Enzymes', content:[
    {h:'How Cells Harness Power', b:[
      'Cells are the basic units of life; energy is a fundamental requirement to carry out cellular functions and ensure organism survival.',
      'Food consists of organic (carbon-containing) molecules storing energy in chemical bonds. Cells break these bonds to release energy and build new compounds; both energy and materials pass from producer to consumer.',
      'Two of the most important energy-carrying molecules: Glucose and ATP (adenosine triphosphate).'
    ]},
    {h:'Glucose vs. ATP', b:[
      'Glucose: the energy-rich product of photosynthesis, a universal food for life; the primary form your bloodstream uses to deliver energy to all cells ("blood sugar").',
      'Hyperglycemia = high blood sugar; Hypoglycemia = low blood sugar.',
      'ATP: stores smaller quantities of energy but releases just the right amount for cellular work; made during the first half of photosynthesis, used during the second half (when glucose is made).',
      'Why organisms need BOTH: glucose has more chemical energy and is more stable (better for storage/transport) but is "too powerful" for direct cell use; ATP has just the right amount of usable energy for cell processes.',
      'ATP → (breaks a phosphate bond, releases energy) → ADP; ADP + phosphate → ATP again (recycling). Breaking down = release energy; building up = use energy. This full cycle = metabolism.'
    ]},
    {h:'Enzymes', b:[
      'Enzymes act like a "can opener": they help start/change a reaction, do NOT change themselves, and can be reused again and again.',
      'Enzymes are reusable helpers for chemical reactions in cells; they can also cause molecules to JOIN, not just come apart.',
      'Without the right enzyme, a chemical reaction in a cell cannot take place — each reaction requires a SPECIFIC enzyme (like a can opener only works on cans, not bottles).',
      'Enzymes help in both catabolism (breaking down) and anabolism (building up).'
    ]}
  ], quiz:[
    {q:'Which two molecules are described as the most important energy-carrying molecules in the notes?', c:['DNA and RNA','Glucose and ATP','Protein and Fat','Oxygen and Carbon Dioxide'], a:1, e:'Glucose and ATP (adenosine triphosphate) are highlighted as the two most important energy-carrying molecules.'},
    {q:'High blood sugar is medically termed:', c:['Hypoglycemia','Hyperglycemia','Homeostasis','Glycolysis'], a:1, e:'Hyperglycemia ("hyper" = high) refers to high blood sugar levels.'},
    {q:'Low blood sugar is medically termed:', c:['Hyperglycemia','Hypoglycemia','Metabolism','Anabolism'], a:1, e:'Hypoglycemia ("hypo" = low) refers to low blood sugar levels.'},
    {q:'Why do organisms need glucose AND ATP, rather than just one?', c:['Glucose is for storage/transport (stable, more energy); ATP provides the right amount of usable energy for cell work','They are actually the exact same molecule','Only ATP is needed; glucose is unnecessary','Only glucose is needed; ATP is unnecessary'], a:0, e:'Glucose is stable and energy-dense (good for storage/transport) but too powerful for direct use; ATP releases just the right amount of usable energy for cellular work.'},
    {q:'When ATP loses a phosphate group, it becomes:', c:['ADP, releasing energy','Glucose','A new enzyme','Water'], a:0, e:'When a high-energy bond in ATP breaks, it loses a phosphate and becomes ADP, releasing energy for cell use.'},
    {q:'The analogy of a "can opener" is used in the notes to explain:', c:['ATP','Glucose','Enzymes','Metabolism'], a:2, e:'Enzymes are compared to a can opener — they help a reaction happen without being changed or used up themselves, and can be reused.'},
    {q:'Why can\'t a "can opener" (enzyme) open a bottle, according to the analogy?', c:['Enzymes have no real specificity','Enzymes are specific — each one only works on certain substances/reactions','Enzymes only work once','Enzymes destroy themselves after use'], a:1, e:'This analogy illustrates enzyme specificity — each enzyme is specific to certain substances/reactions, just as a can opener only works on cans.'},
    {q:'Enzymes assist in which two general types of metabolic reactions?', c:['Catabolism and Anabolism','Photosynthesis and Respiration only','Glycolysis and Fermentation only','Mitosis and Meiosis'], a:0, e:'Enzymes help in both catabolism (breaking down) and anabolism (building up) reactions.'}
  ], glossary:[
    {term:'Glucose', def:'energy-rich product of photosynthesis, universal food for life, delivers energy via blood.'},
    {term:'ATP (adenosine triphosphate)', def:'releases just the right amount of usable energy for cellular work.'},
    {term:'Hyperglycemia / Hypoglycemia', def:'high / low blood sugar levels.'},
    {term:'Enzyme', def:'a reusable, specific "helper" that speeds up a chemical reaction without being changed itself.'}
  ]},
{id:'gs4', title:'4. Photosynthesis', content:[
    {h:'Introduction: Producers & Consumers', b:[
      'Living things divide into Producers (make their own food, e.g. plants) and Consumers (rely on prey/other consumers).',
      'Producers convert light energy into chemical energy via photosynthesis, using light energy to make sugars used as food.',
      'When you eat plants, you are eating stored sunlight energy — plants turning light into food fuels all life on Earth.'
    ]},
    {h:'The Photosynthesis Equation', b:[
      '6CO2 + 6H2O + Light energy → C6H12O6 + 6O2.',
      'Reactants (ingredients): Carbon dioxide (from air), Water (from soil), Sunlight.',
      'Products: Glucose (C6H12O6 — food/energy) and Oxygen (O2 — released into air).'
    ]},
    {h:'Stage 1: Light-Dependent Reactions', b:[
      'Where: Thylakoid membranes of the chloroplast (contains chlorophyll, giving plants their green color).',
      'Inputs: sunlight, water (H2O), ADP, NADP+.',
      'Process: thylakoids absorb light and water; water is split (photolysis), releasing oxygen; ADP → ATP; NADP+ → NADPH.',
      'Key idea: water is OXIDIZED (becomes O2); NADP+ is REDUCED (becomes NADPH) — oxidation and reduction happen together.',
      'Outputs: O2 + ATP + NADPH. Process flow: Photosystem II → Electron Transport Chain (ETC) → Photosystem I → ATP synthase.'
    ]},
    {h:'Stage 2: Light-Independent Reactions (Calvin Cycle)', b:[
      'Where: Stroma of the chloroplast.',
      'Inputs: CO2, ATP, NADPH (from Stage 1).',
      'Carbon Fixation: CO2 combines with RuBP (Ribulose-1,5-bisphosphate) via the enzyme RuBisCo.',
      'Reduction: energy from ATP & NADPH builds glucose molecules; ATP → ADP, NADPH → NADP+.',
      'Regeneration of RuBP: RuBP is recycled so the cycle continues.',
      'Outputs: Glucose + ADP + NADP+ (the used carriers ADP & NADP+ return to Stage 1 for reuse).'
    ]},
    {h:'Photosynthetic Organisms', b:[
      'Microalgae: primary producers of oxygen on Earth; foundation of aquatic food webs (produce the MOST oxygen among all groups).',
      'Plants: primary terrestrial photosynthetic organisms; sustain life and regulate climate.',
      'Macroalgae: habitat/food for marine organisms; contribute to ecological balance.',
      'Bacteria: some cyanobacteria perform photosynthesis, essential for the carbon and oxygen cycle.'
    ]}
  ], quiz:[
    {q:'What are organisms that make their own food, like plants, called?', c:['Consumers','Producers','Decomposers','Heterotrophs'], a:1, e:'Producers are organisms that make their own food, such as plants, through photosynthesis.'},
    {q:'In the photosynthesis equation, which of the following is a REACTANT (ingredient)?', c:['Glucose','Oxygen','Carbon dioxide','ATP'], a:2, e:'Carbon dioxide (along with water and light energy) is a reactant/ingredient in photosynthesis; glucose and oxygen are the products.'},
    {q:'Where do the light-dependent reactions of photosynthesis take place?', c:['Stroma','Thylakoid membranes','Mitochondrial matrix','Cytoplasm'], a:1, e:'The light-dependent reactions occur in the thylakoid membranes of the chloroplast, where chlorophyll is located.'},
    {q:'During the light-dependent reactions, what happens to water?', c:['It is reduced','It is oxidized, releasing oxygen','It becomes glucose directly','It has no role'], a:1, e:'Water is oxidized (split) during the light-dependent reactions, releasing oxygen as a byproduct.'},
    {q:'During the light-dependent reactions, what happens to NADP+?', c:['It is oxidized','It is reduced, becoming NADPH','It becomes glucose','It splits into oxygen'], a:1, e:'NADP+ is reduced to become NADPH, an energy carrier used in the next stage.'},
    {q:'Where does the Calvin Cycle (light-independent reactions) take place?', c:['Thylakoid membranes','Stroma of the chloroplast','Mitochondrial matrix','Nucleus'], a:1, e:'The Calvin Cycle (light-independent reactions) occurs in the stroma, the fluid-filled space of the chloroplast.'},
    {q:'Which enzyme fixes carbon dioxide into organic compounds during the Calvin Cycle?', c:['ATP synthase','RuBisCo','Chlorophyll','Pyruvate kinase'], a:1, e:'RuBisCo is the enzyme that fixes CO2 by attaching it to RuBP (Ribulose-1,5-bisphosphate) during carbon fixation.'},
    {q:'What is the main output of the light-independent reactions (Calvin Cycle)?', c:['Oxygen','Glucose','Water','Light energy'], a:1, e:'The main output of the Calvin Cycle is glucose, built using CO2 and the energy from ATP and NADPH.'},
    {q:'Which group of photosynthetic organisms produces the MOST oxygen on Earth, according to the notes?', c:['Plants','Macroalgae','Microalgae','Bacteria'], a:2, e:'Microalgae are noted as the primary producers of oxygen, producing the most among all photosynthetic organism groups.'},
    {q:'Which molecules produced in Stage 1 (light-dependent reactions) are used as inputs for Stage 2 (Calvin Cycle)?', c:['Glucose and Oxygen','ATP and NADPH','CO2 and Water','RuBP and Chlorophyll'], a:1, e:'ATP and NADPH, produced in the light-dependent reactions, are used as energy carriers to power the Calvin Cycle in Stage 2.'}
  ], glossary:[
    {term:'Photosynthesis equation', def:'6CO2 + 6H2O + Light energy → C6H12O6 + 6O2.'},
    {term:'Light-dependent reactions', def:'in the thylakoid; light + water → O2 + ATP + NADPH.'},
    {term:'Calvin Cycle (light-independent)', def:'in the stroma; uses ATP/NADPH + CO2 → glucose.'},
    {term:'RuBisCo', def:'enzyme that fixes CO2 onto RuBP during carbon fixation.'},
    {term:'Producers / Consumers', def:'organisms that make their own food (via photosynthesis) vs. those that rely on others for food.'}
  ]},
  {id:'gs5', title:'5. Cellular Respiration', content:[
    {h:'Respiration Overview', b:[
      'During respiration, chemical reactions break down food molecules into simpler substances and release stored energy.',
      'Key idea: Food + O2 → energy (ATP) + CO2 + heat. Enzymes help every step of respiration.',
      'Respiration of carbohydrates begins in the cytoplasm: carbohydrates break into glucose, then glucose breaks into two simpler molecules (releasing energy).',
      'The two simpler molecules break down further in the mitochondria, using oxygen, releasing much more energy, and producing CO2 and water as waste (exhaled).'
    ]},
    {h:'3 Major Stages of Cellular Respiration', b:[
      '1. Glycolysis: Glucose → 2 pyruvate (in the cytoplasm). "Glyco" = sugar, "lysis" = breakdown.',
      '2. Krebs Cycle (Citric Acid Cycle): Pyruvate → CO2 + electron carriers (in the mitochondrial matrix).',
      '3. Electron Transport Chain (ETC): Electrons → ATP production (in the inner mitochondrial membrane) — where the LARGEST amount of ATP is generated.'
    ]},
    {h:'Glycolysis Details', b:[
      'Anaerobic (doesn\'t need oxygen); same step in both aerobic and anaerobic respiration.',
      'Glucose (6C) splits into two 3C pyruvate molecules.',
      'Investment phase: spends 2 ATP. Payoff phase: gains 4 ATP + 2 NADH.',
      'Net Gain: 2 ATP + 2 NADH (gross: 4 ATP, 2 NADH, 2 pyruvate).'
    ]},
    {h:'Krebs Cycle & Electron Transport Chain', b:[
      'Krebs Cycle: Aerobic (requires oxygen indirectly). Pyruvate → Acetyl-CoA (releasing CO2 + producing NADH); Acetyl-CoA + Oxaloacetate → Citric Acid; series of reactions release CO2, transfer electrons to NADH & FADH2, regenerate Oxaloacetate.',
      'Products per glucose (2 pyruvate = 2 cycles): 6 CO2, 2 ATP, 8 NADH, 2 FADH2.',
      'ETC: NADH & FADH2 donate electrons; electrons pass through protein complexes, pumping protons (H+) across the membrane, creating a proton gradient; oxygen is the FINAL electron acceptor, forming water.',
      'Proton gradient drives ATP synthase, producing approximately 34 ATP per glucose — the highest-yield stage.'
    ]},
    {h:'Fermentation', b:[
      'When oxygen is insufficient (e.g. muscles during hard exercise), cells switch to fermentation (anaerobic respiration).',
      'Still starts with glycolysis in the cytoplasm (produces 2 ATP + pyruvate); since there\'s no oxygen, pyruvate stays in the cytoplasm instead of entering the mitochondria.',
      'Humans (muscle cells): lactic acid fermentation → lactic acid → causes muscle soreness.',
      'Yeast: fermentation → alcohol + CO2 → used in baking/brewing.',
      'Bacteria (yogurt/cheese): fermentation → lactic acid → solidifies milk, gives sour flavor.',
      'Fermentation is much less efficient than aerobic respiration and produces waste products (lactic acid or alcohol).'
    ]},
    {h:'Importance & Plant vs. Animal Comparison', b:[
      'Cellular respiration provides energy for muscle movement, brain function, cell repair/growth, and homeostasis; without it, cells die from lack of energy.',
      'Photosynthesis and respiration are near-opposites: photosynthesis produces sugar/oxygen which respiration then uses; CO2/water from respiration are used in photosynthesis.',
      'Plants: autotrophs, store food as starch, respire through stomata, mostly rooted/immobile, reproduce via budding/pollination.',
      'Animals: heterotrophs, store food as glycogen, exchange gases via lungs/gills/skin, mostly mobile, mostly reproduce sexually, have well-developed nervous systems for fast stimulus response.'
    ]}
  ], quiz:[
    {q:'In which part of the cell does glycolysis take place?', c:['Mitochondrial matrix','Cytoplasm','Inner mitochondrial membrane','Nucleus'], a:1, e:'Glycolysis, the breakdown of glucose into pyruvate, occurs in the cytoplasm.'},
    {q:'What is the net ATP gain from glycolysis?', c:['0 ATP','2 ATP (plus 2 NADH)','4 ATP','34 ATP'], a:1, e:'Glycolysis has a gross yield of 4 ATP but requires an investment of 2 ATP, for a NET gain of 2 ATP (plus 2 NADH).'},
    {q:'Which stage of cellular respiration produces the LARGEST amount of ATP?', c:['Glycolysis','Krebs Cycle','Electron Transport Chain (ETC)','Fermentation'], a:2, e:'The Electron Transport Chain (ETC) produces the largest amount of ATP — approximately 34 ATP per glucose.'},
    {q:'In the ETC, which molecule acts as the FINAL electron acceptor, forming water?', c:['Glucose','Pyruvate','Oxygen','Carbon dioxide'], a:2, e:'Oxygen is the final electron acceptor in the ETC, combining with electrons and protons to form water.'},
    {q:'Approximately how much ATP is produced by the Electron Transport Chain per glucose molecule?', c:['2 ATP','8 ATP','34 ATP','100 ATP'], a:2, e:'The ETC produces approximately 34 ATP per glucose molecule, driven by the proton gradient powering ATP synthase.'},
    {q:'When muscles run out of sufficient oxygen during hard exercise, cells switch to which process?', c:['The Krebs Cycle','Fermentation (anaerobic respiration)','Photosynthesis','The ETC only'], a:1, e:'When oxygen is insufficient, cells switch to fermentation, which does not require oxygen.'},
    {q:'In human muscle cells, fermentation produces which waste product that causes muscle soreness?', c:['Alcohol','Lactic acid','Carbon dioxide only','Glucose'], a:1, e:'Human muscle cells undergo lactic acid fermentation when oxygen is low, and the buildup of lactic acid causes muscle soreness.'},
    {q:'In yeast, fermentation produces which products, useful in baking and brewing?', c:['Lactic acid only','Alcohol and CO2','Water and oxygen','Glucose and ATP only'], a:1, e:'Yeast fermentation produces alcohol and CO2, which is why it\'s used in baking (CO2 makes bread rise) and brewing (alcohol).'},
    {q:'Plants store their food primarily in the form of:', c:['Glycogen','Starch','Protein','Fat'], a:1, e:'Plants store food as starch, while animals store food as glycogen — both made of glucose, though glycogen is more complex.'},
    {q:'Which of the following is TRUE about plants compared to animals, according to the comparison table?', c:['Plants are heterotrophs; animals are autotrophs','Plants are autotrophs and prepare their own food; animals are heterotrophs','Both are exactly the same in nutrition','Plants have a well-developed digestive system'], a:1, e:'Plants are autotrophs, preparing their own food via photosynthesis, while animals are heterotrophs, depending on plants/other animals for food.'}
  ], glossary:[
    {term:'Glycolysis', def:'Glucose → 2 pyruvate, in the cytoplasm; anaerobic; net 2 ATP + 2 NADH.'},
    {term:'Krebs Cycle (Citric Acid Cycle)', def:'Pyruvate → CO2 + electron carriers (NADH, FADH2), in the mitochondrial matrix.'},
    {term:'Electron Transport Chain (ETC)', def:'electrons → ATP production (~34 ATP), in the inner mitochondrial membrane; oxygen is the final electron acceptor.'},
    {term:'Fermentation', def:'anaerobic energy release when oxygen is low; produces lactic acid (humans/bacteria) or alcohol+CO2 (yeast).'}
  ]},
{id:'gs6', title:'6. Interconnected Biological Systems', content:[
    {h:'Plant & Animal Systems: Distinctions & Shared Principles', b:[
      'Plants (Autotrophs): produce their own food via photosynthesis; rigid cellulose cell walls; generally sessile (fixed in place).',
      'Animals (Heterotrophs): consume other organisms for energy; lack cell walls (allows flexibility/movement); typically motile.',
      'Shared: Homeostasis (both maintain stable internal conditions); Material Transport (plants: xylem/phloem; animals: circulatory/respiratory systems); Response to Stimuli via receptors (plants: pattern response/immunity, e.g. makahiya adapting to repeated stimuli; animals: nervous system + white blood cells destroying pathogens).'
    ]},
    {h:'Plant System: Transporting Essential Materials', b:[
      'Roots (Absorption): anchor the plant; absorb water/minerals through root hairs (increase surface area) via osmosis and active transport.',
      'Leaves (Photosynthesis): site of photosynthesis; Transpiration — evaporation of water from leaves creates "transpirational pull," drawing water up through the xylem.',
      'Stem (Conduction & Support): main transport highway. Xylem — transports water/minerals UNIDIRECTIONALLY (roots → leaves). Phloem — transports sugars BIDIRECTIONALLY to all parts of the plant.'
    ]},
    {h:'Impact of Damage: Torn ACL & Asthma Attack (Case Studies)', b:[
      'ACL (Anterior Cruciate Ligament): connects femur to tibia; prevents tibia from sliding forward, provides rotational knee stability. A tear ("Total ACL Rapture") causes acute pain/swelling/instability; poor blood flow to the ligament means it heals poorly — fastest healing time is 6 months; requires structured rehabilitation.',
      'Asthma Attack: bronchoconstriction (sudden tightening of airway muscles) + airway inflammation/excess mucus obstruct airflow; triggers include allergens, emotional stress, severe physical activity, colds/flu; affects the circulatory system too since oxygen delivery is disrupted.'
    ]},
    {h:'Collaboration: Thermoregulation', b:[
      'Thermoregulation: maintaining stable core body temperature (~37°C/98.6°F) via homeostasis, vital for optimal enzyme activity.',
      'Nervous System: Thermoreceptors detect temperature changes; Hypothalamus is the command center, triggering sweating (cool down) or shivering (generate heat) — IMMEDIATE response.',
      'Endocrine System: provides LONG-TERM control via metabolic regulation; Thyroid hormones (T3/T4) increase cellular metabolism/heat; stress hormones (epinephrine/norepinephrine) boost metabolic rate and promote shivering during cold stress.'
    ]},
    {h:'Vaccines: Harnessing the Immune System', b:[
      'Vaccines introduce a harmless piece of a pathogen (antigen) to mimic infection without illness, triggering a "primary immune response."',
      'This creates long-lived "memory cells" — if the real pathogen invades later, they launch a fast, powerful "secondary immune response" for long-term protection.',
      'Community/Herd Immunity: when a high % of the population is vaccinated, it reduces pathogen spread, protecting those who cannot be vaccinated (immunocompromised).',
      'Lymphatic System: collects lymph from tissues; lymph nodes/spleen filter out pathogens, letting immune cells detect and respond.',
      'Common vaccines: TB/BCG, Hepatitis B, DTP (Diphtheria, Tetanus, Pertussis), Flu, Polio (injection & oral), Meningitis, Pneumococcal, MMR (Measles, Mumps, Rubella).'
    ]}
  ], quiz:[
    {q:'Plants are classified as autotrophs because they:', c:['Consume other organisms for energy','Produce their own food via photosynthesis','Lack cell walls','Are always motile'], a:1, e:'Autotrophs, like plants, produce their own food through photosynthesis, unlike heterotrophs (animals) which consume other organisms.'},
    {q:'Which structure creates a "transpirational pull" that draws water up through the xylem?', c:['Roots','Evaporation of water from leaves (transpiration)','The stem alone','Phloem'], a:1, e:'Transpiration — the evaporation of water from the leaves — creates a pull that draws water upward through the xylem from the roots.'},
    {q:'Xylem transports water and minerals in which direction?', c:['Bidirectionally','Unidirectionally, from roots to leaves','Unidirectionally, from leaves to roots','It does not transport anything'], a:1, e:'Xylem transports water and minerals unidirectionally — only upward from roots to leaves.'},
    {q:'Phloem transports sugars in which direction?', c:['Unidirectionally upward only','Unidirectionally downward only','Bidirectionally to all parts of the plant','It does not transport sugars'], a:2, e:'Phloem transports sugars bidirectionally, distributing them to all parts of the plant for use or storage.'},
    {q:'The ACL (Anterior Cruciate Ligament) connects which two bones?', c:['Femur and tibia','Humerus and radius','Skull and spine','Pelvis and femur'], a:0, e:'The ACL connects the femur (thigh bone) to the tibia (shin bone), providing knee stability.'},
    {q:'Why does the ACL heal poorly after injury, according to the notes?', c:['It has excellent blood flow','It has poor blood flow to the ligament','It is not connected to any bones','It never actually gets injured'], a:1, e:'The ACL has poor blood flow, which limits the body\'s healing cascade — making recovery slow, with 6 months being the fastest healing time.'},
    {q:'During an asthma attack, "bronchoconstriction" refers to:', c:['Widening of the airways','Sudden tightening of muscles around the airways','Increased oxygen supply','A type of vaccine reaction'], a:1, e:'Bronchoconstriction is the sudden tightening of the muscles around the airways (bronchi), narrowing the passage and making breathing difficult.'},
    {q:'Which body system acts as the IMMEDIATE responder to temperature changes via thermoreceptors and the hypothalamus?', c:['Endocrine system','Nervous system','Skeletal system','Lymphatic system'], a:1, e:'The nervous system provides the immediate response to temperature changes — thermoreceptors detect changes, and the hypothalamus triggers sweating or shivering.'},
    {q:'Which body system provides LONG-TERM control of body temperature through metabolic regulation (e.g. thyroid hormones)?', c:['Nervous system','Endocrine system','Skeletal system','Muscular system'], a:1, e:'The endocrine system provides long-term control via hormones like thyroid hormones (T3/T4), which regulate metabolic rate and heat generation.'},
    {q:'A vaccine works primarily by:', c:['Curing an existing infection instantly','Introducing a harmless antigen to trigger an immune response and create memory cells','Removing the need for an immune system','Directly killing all pathogens in the body'], a:1, e:'Vaccines introduce a harmless piece of a pathogen (antigen), triggering a primary immune response and creating memory cells for future protection.'},
    {q:'"Community immunity" (herd immunity) occurs when:', c:['No one in a population is vaccinated','A high percentage of the population is vaccinated, reducing pathogen spread','Only children are vaccinated','Vaccines are banned'], a:1, e:'Community immunity occurs when a high percentage of a population is vaccinated, reducing overall pathogen spread and protecting those who can\'t be vaccinated.'},
    {q:'Which organs act as filters in the lymphatic system, removing pathogens?', c:['Lungs and heart','Lymph nodes and the spleen','Kidneys and liver only','Stomach and intestines'], a:1, e:'Lymph nodes and the spleen act as filters in the lymphatic system, removing pathogens and allowing immune cells to respond.'}
  ], glossary:[
    {term:'Xylem', def:'transports water/minerals unidirectionally, roots to leaves.'},
    {term:'Phloem', def:'transports sugars bidirectionally to all parts of the plant.'},
    {term:'Thermoregulation', def:'maintaining stable core body temperature (~37°C) via homeostasis.'},
    {term:'Herd/Community immunity', def:'when a high % of a population is vaccinated, reducing pathogen spread and protecting the unvaccinated.'}
  ]},
  {id:'gs7', title:'7. Philippine Ecosystems', content:[
    {h:'Ecosystem Overview', b:[
      'An ecosystem is a geographic area where a community of living organisms interacts with each other and their physical environment.',
      'Includes biotic (living) and abiotic (nonliving) factors, forming a complex web of relationships.',
      '2 major divisions: Terrestrial (on land) and Aquatic (in bodies of water).'
    ]},
    {h:'Terrestrial Ecosystems', b:[
      'Forest: biodiverse, high humidity/rainfall; acts as defense against typhoons. Locations: Cordillera, Zambales, Sierra Madre (~40% of remaining forest cover), Mt. Makiling, Mt. Banahaw. Organisms: Philippine Eagle, Philippine Mouse Deer, Tamaraw (Mindoro).',
      'Grasslands: dominated by grasses/herbaceous plants; moderate rainfall (not enough for forests). Locations: Mt. Pulag, Lantawan Grassland (Zamboanga). Organisms: cogon grass, wildflowers, rats, insects, snakes, birds.'
    ]},
    {h:'Aquatic Ecosystems', b:[
      'Freshwater: Lakes (large body surrounded by land), Rivers (flow toward the sea), Swamps (permanently saturated low-lying land), Estuaries (freshwater meets salty ocean — mangroves). Locations: Laguna de Bay (largest lake), Taal Lake, Cagayan River (longest/largest river), Candaba Swamp, Pasig River. Organisms: mangroves, Sardinella tawilis (freshwater sardine exclusive to PH).',
      'Coral Reefs: natural habitat of fish/marine organisms; PH owns 5% of the world\'s coral reefs, part of the "Coral Triangle"; made of calcium carbonate deposits (very delicate ecosystems). Locations: Verde Island Passage, Batangas ("Center of the Center of Marine Shorefish Biodiversity"); Tubbataha Reef, Sulu Sea (UNESCO World Heritage Site, sea turtle nesting ground). Organisms: Hawksbill Sea Turtle, coral species.'
    ]}
  ], quiz:[
    {q:'An ecosystem is best defined as a geographic area where:', c:['Only plants live','A community of living organisms interacts with each other and their physical environment','Only humans reside','No interactions occur'], a:1, e:'An ecosystem is a geographic area where a community of organisms interacts with each other and their physical environment.'},
    {q:'What are the two major divisions of ecosystems?', c:['Tropical and Temperate','Terrestrial and Aquatic','Urban and Rural','Natural and Artificial'], a:1, e:'Ecosystems are divided into Terrestrial (on land) and Aquatic (in water).'},
    {q:'Which mountain range contains approximately 40% of the Philippines\' remaining forest cover?', c:['Cordillera','Zambales','Sierra Madre','Mt. Banahaw'], a:2, e:'The Sierra Madre Mountain Range contains approximately 40% of the country\'s remaining forest cover.'},
    {q:'Which lake is described as the largest in the Philippines?', c:['Taal Lake','Laguna de Bay','Candaba Swamp','Pasig River'], a:1, e:'Laguna de Bay is described as the largest lake in the Philippines.'},
    {q:'Which is described as the longest and largest river in the Philippines?', c:['Pasig River','Cagayan River','Candaba Swamp','Laguna de Bay'], a:1, e:'The Cagayan River is described as the longest and largest river in the Philippines.'},
    {q:'Which freshwater fish species is noted as exclusive to the Philippines?', c:['Bangus','Sardinella tawilis','Tilapia','Dalag'], a:1, e:'Sardinella tawilis, a freshwater sardine, is found exclusively in the Philippines (in Taal Lake).'},
    {q:'What percentage of the world\'s coral reefs does the Philippines own, according to the notes?', c:['1%','5%','25%','50%'], a:1, e:'The Philippines owns about 5% of the world\'s total coral reefs and is part of the "Coral Triangle."'},
    {q:'Which coral reef location is a UNESCO World Heritage Site and a nesting ground for sea turtles?', c:['Verde Island Passage','Tubbataha Reef, Sulu Sea','Laguna de Bay','Candaba Swamp'], a:1, e:'Tubbataha Reef in the Sulu Sea is a UNESCO World Heritage Site and serves as a nesting ground for the critically endangered sea turtle.'},
    {q:'Verde Island Passage in Batangas is known as the:', c:['"Coral Triangle" itself','"Center of the Center of Marine Shorefish Biodiversity"','Largest lake in the Philippines','Site of the Sierra Madre'], a:1, e:'Verde Island Passage, Batangas is known as the "Center of the Center of Marine Shorefish Biodiversity."'}
  ], glossary:[
    {term:'Biotic / Abiotic', def:'living factors / nonliving factors in an ecosystem.'},
    {term:'Estuary', def:'area where freshwater rivers meet the salty ocean, creating brackish water (mangroves).'},
    {term:'Coral Triangle', def:'region including the Philippines, home to 5% of the world\'s coral reefs.'}
  ]},
  {id:'gs8', title:'8. Climate Change', content:[
    {h:'What is Climate Change?', b:[
      'Long-term shifts in temperatures and weather patterns.',
      'While there are natural causes, human activities have been the MAIN driver, primarily burning fossil fuels (coal, oil, gas).',
      'Burning fossil fuels generates greenhouse gas emissions, acting like a blanket trapping the sun\'s heat, raising global temperatures.',
      'Sources of greenhouse gas emissions: Transportation, Agriculture and land, Factories/industrial processes.',
      'Warning signs: rising global temperatures, shrinking ice sheets/glaciers, decreasing snow cover, rising sea level, extreme weather events, ocean warming/acidification.'
    ]},
    {h:'Impacts on Philippine Ecosystems', b:[
      'The Philippines is vulnerable due to accelerating environmental deterioration, unsustainable development, and population growth.',
      'Forest impacts: change in forest composition, shifting geographic range, disrupted species life cycles, droughts affecting food webs, pollinators at risk, loss of habitat/species.',
      'Marine/coastal impacts: oceans absorb 90%+ of excess heat → coral bleaching; higher CO2 levels → more acidic oceans, harming marine life/reefs; loss of coral disrupts predator-prey balance; sea level rise destroys coastal habitats, affecting species AND humans who rely on them.'
    ]},
    {h:'Adaptation and Mitigation Strategies', b:[
      'Adaptation: actions helping people/species/ecosystems COPE with climate change effects — directly confronting impact (e.g. climate-smart flood control) or building resilience (e.g. climate-resilient rice varieties).',
      'Mitigation: actions to REDUCE man-made climate change — reducing GHG emissions (bike lanes, green buildings, solar panels) or increasing GHG sequestration (reforestation, reducing fossil fuel use, green energy, windmills).'
    ]},
    {h:'Philippine National Climate Change Action Plan (2011-2028)', b:[
      'The country\'s strategic framework for addressing climate impacts and strengthening resilience, aligned with the Climate Change Act of 2009 (RA 9729).',
      '7 Key Priorities: Water Sufficiency, Food Security, Ecological and Environmental Stability, Sustainable Energy, Climate-smart Industries and Services, Human Security, Knowledge and Capacity Development.',
      'Ecological and Environmental Stability specifically focuses on increasing the resilience of natural ecosystems to climate change.'
    ]}
  ], quiz:[
    {q:'What is the MAIN driver of climate change, according to the notes?', c:['Natural volcanic activity alone','Human activities, primarily burning fossil fuels','Ocean currents alone','Solar radiation changes alone'], a:1, e:'While natural causes exist, human activities — primarily burning fossil fuels like coal, oil, and gas — are the main driver of climate change.'},
    {q:'Which of the following is NOT listed as a major source of greenhouse gas emissions?', c:['Transportation','Agriculture and land','Factories and industrial processes','Ocean tides'], a:3, e:'The notes list Transportation, Agriculture and land, and Factories/industrial processes as major sources — ocean tides are not listed.'},
    {q:'Coral bleaching is primarily caused by:', c:['Ocean warming, as oceans absorb over 90% of excess heat','Too much rainfall','Cold ocean temperatures','Overfishing alone'], a:0, e:'Oceans absorb over 90% of excess heat from climate change, leading to ocean warming and coral bleaching.'},
    {q:'Climate-resilient rice varieties are an example of climate change:', c:['Mitigation','Adaptation','Neither','Both equally'], a:1, e:'Climate-resilient rice varieties are an example of Adaptation — building resilience to current/future climate risks.'},
    {q:'Constructing bike lanes and installing solar panels are examples of climate change:', c:['Adaptation','Mitigation','Neither','Both equally'], a:1, e:'These are examples of Mitigation — actions that reduce greenhouse gas emissions.'},
    {q:'Reforestation is an example of which mitigation approach?', c:['Reducing GHG emissions','Increasing GHG sequestration','Adaptation only','Neither reduces nor sequesters GHGs'], a:1, e:'Reforestation increases GHG sequestration — absorbing greenhouse gases already in the atmosphere.'},
    {q:'The Philippine National Climate Change Action Plan is aligned with which law?', c:['RA 9729 (Climate Change Act of 2009)','RA 11036','RA 7877','RA 9003'], a:0, e:'The National Climate Change Action Plan (2011-2028) is aligned with the Climate Change Act of 2009 (RA 9729).'},
    {q:'How many Key Priorities are outlined in the Philippine National Climate Change Action Plan?', c:['5','7','10','12'], a:1, e:'There are 7 Key Priorities: Water Sufficiency, Food Security, Ecological and Environmental Stability, Sustainable Energy, Climate-smart Industries and Services, Human Security, and Knowledge and Capacity Development.'},
    {q:'Which Key Priority specifically focuses on increasing the resilience of natural ecosystems?', c:['Water Sufficiency','Food Security','Ecological and Environmental Stability','Human Security'], a:2, e:'Ecological and Environmental Stability is the priority focused specifically on increasing the resilience of natural ecosystems to climate change.'}
  ], glossary:[
    {term:'Adaptation', def:'actions helping people/species/ecosystems cope with climate change effects.'},
    {term:'Mitigation', def:'actions that reduce man-made climate change (reduce emissions or increase sequestration).'},
    {term:'RA 9729', def:'the Climate Change Act of 2009, basis for the Philippine National Climate Change Action Plan.'},
    {term:'7 Key Priorities', def:'Water Sufficiency, Food Security, Ecological/Environmental Stability, Sustainable Energy, Climate-smart Industries/Services, Human Security, Knowledge/Capacity Development.'}
  ]}
]},
{id:'bionotes', name:'Biology (1st Sem)', lessons:[
{id:'bn1', title:'1. Biomolecules (Carbohydrates, Lipids, Proteins, Nucleic Acids, Enzymes)', content:[
    {h:'Overview', b:[
      'Biomolecules (biological molecules): the essential building blocks of all living organisms; also called macromolecules (organic).',
      '4 Major Types: Carbohydrates, Lipids, Proteins, Nucleic Acids — all are polymers built from monomers EXCEPT lipids.',
      'Dehydration Reaction (Condensation): the process of synthesis/building of macromolecules. Hydrolysis: water is added to a polymer, breaking its covalent bonds.',
      'Malnutrition: deficiencies OR excesses in body intake — both overweight and underweight individuals are classified as malnourished; possible at any age/gender.',
      'Memory aid for elemental composition: CHO, CHO, CHON, CHONP = Carbohydrates, Lipids, Proteins, Nucleic Acids (respectively).'
    ]},
    {h:'Carbohydrates', b:[
      'Primary source of energy; monomer is the monosaccharide; made entirely of Carbon, Hydrogen, Oxygen.',
      'Natural Sugars: found in whole, unprocessed foods (e.g. fructose in apples/oranges, lactose in milk). Refined Sugars: processed and added to foods (e.g. soda, fruit juices, energy drinks).',
      'Monosaccharide: simplest form/simple sugar (CH2O); glucose is used in cellular respiration to make ATP; has a carbonyl group (C=O) and multiple hydroxyl groups (-OH). Types: Glucose, Galactose, Fructose, Ribose, Deoxyribose.',
      'Aldehyde: carbonyl group at the END of a carbon chain. Ketone: carbonyl group in the MIDDLE of a carbon chain.',
      'Sugar sizes: 3-carbon = trioses, 4-carbon = tetroses, 5-carbon = pentoses.',
      'Disaccharide (2 monosaccharides via glycosidic linkage): Sucrose = Glucose + Fructose (table sugar); Maltose = Glucose + Glucose (grains/cereals); Lactose = Glucose + Galactose (dairy).',
      'Polysaccharide: large, complex carbs of long monosaccharide chains; main functions are ENERGY STORAGE and STRUCTURAL SUPPORT. Starch (plants, stored in plastids), Glycogen (animals/fungi, stored in liver/muscle/fat cells), Cellulose (plant cell walls, most abundant organic compound on Earth), Chitin (arthropod exoskeletons, fungal cell walls).'
    ]},
    {h:'Lipids', b:[
      'Composed mostly of hydrogen and carbon (nonpolar C-C/C-H bonds); HYDROPHOBIC, won\'t dissolve in water.',
      'Composed of carbon, hydrogen, and oxygen; key components: glycerol and fatty acids, which combine to form Triglycerides, Phospholipids, and Steroids.',
      'Triglyceride: glycerol backbone + 3 fatty acids, joined by ester bonds via dehydration synthesis. Saturated fatty acids (in fats): all single bonds, many H atoms. Unsaturated fatty acids (in oils): have double/triple bonds.',
      'Phospholipids (cell membrane): glycerol + 2 fatty acids + a phosphate group. Polar Head = phosphate+glycerol (hydrophilic). Non-Polar Tail = 2 fatty acid tails (hydrophobic).',
      'Steroids: composed of FOUR carbon rings. Cholesterol (normal cell membrane component; used by the liver to make bile — excess can crystallize into gallstones), Estrogen/Estradiol (female sex hormone, synthesized from cholesterol), Testosterone (male sex hormone, synthesized from cholesterol).',
      'Soaps/Detergents: lipids with a hydrophilic head and hydrophobic tail (surfactants); Waxes: esters of fatty acids with long-chain monohydric carbons.'
    ]},
    {h:'Lipid-Related Disorders', b:[
      'Type 2 Diabetes: body can\'t produce enough insulin, blood sugar builds up; symptoms include thirst/hunger/urination, weight loss, tiredness, blurred vision, slow-healing sores.',
      'MASLD (formerly nonalcoholic fatty liver disease): fat accumulates in the liver from obesity/high blood sugar/high cholesterol; symptoms include fatigue, abdominal pain, jaundice.',
      'Gout: inflammatory arthritis from urate crystal buildup (often in the big toe); sudden severe joint pain, hot/swollen/red skin.',
      'Phenylketonuria (PKU): inherited disorder increasing phenylalanine levels in blood; treated with a low-phenylalanine diet.'
    ]},
    {h:'Proteins', b:[
      'Sources: meat, seafood, dairy, nuts/seeds, grains; build and repair tissues; produced by ribosomes.',
      'Bonded to 4 groups: Amino group (-NH2), Acidic carboxyl group (-COOH), Hydrogen atom, Variable side chain (R group).',
      'Peptide bond: forms between the carboxyl end of one amino acid and the amino end of the next. Polypeptide: polymer of 3-100 amino acids. Protein: polypeptide LONGER than 100 amino acids, with complex structure/function.',
      'Protein shape matters because it determines (1) interaction with other molecules and (2) their particular function.',
      '4 Levels: Primary (amino acid sequence, stabilized by peptide bonds), Secondary (alpha helix/beta pleated sheets, stabilized by hydrogen bonds), Tertiary (overall 3D shape of a single polypeptide, stabilized by disulfide + hydrogen bonds), Quaternary (2+ polypeptide chains associated, e.g. hemoglobin).'
    ]},
    {h:'Roles of Proteins & Enzymes', b:[
      '8 Roles: Storage (embryo\'s main protein source), Transport (hemoglobin, cell membrane proteins), Hormonal (insulin), Receptor (cell response to stimuli), Enzymatic (digestive enzymes), Contractile/Motor (actin/myosin — muscle contraction), Structural (keratin, collagen), Defensive (antibodies).',
      'Enzymes: proteins that act as CATALYSTS to speed up reactions; NOT permanently changed in the process.',
      'Activation energy: the minimum energy required to start a reaction (enzymes lower this).',
      'Induced Fit: a change in the configuration of an enzyme\'s active site (involves H+ and ionic bonds).',
      'What affects enzymes: (1) Environmental conditions — extreme temperatures can denature them, pH usually 6-8 (near neutral), ionic concentration; (2) Cofactors/Coenzymes — inorganic substances (zinc, iron) and vitamins needed for activity; (3) Enzyme Inhibitors — Competitive (resemble the substrate, compete for the active site) and Noncompetitive (bind elsewhere, altering the active site\'s shape).'
    ]},
    {h:'Nucleic Acids', b:[
      'Two types: DNA (deoxyribonucleic acid) and RNA (ribonucleic acid). DNA contains instructions for producing RNA; RNA contains instructions for producing proteins. Flow: DNA → RNA → Proteins.',
      'Monomer: Nucleotide, made of a 5-carbon sugar (linked via phosphodiester bonds), a nitrogenous base, and a phosphate group.',
      '4 Nitrogenous Bases: Adenine, Thymine, Cytosine, Guanine (DNA); RNA replaces Thymine with Uracil.',
      'DNA contains: Deoxyribose sugar + bases Adenine, Thymine, Cytosine, Guanine.',
      'RNA contains: Ribose sugar + bases Adenine, Guanine, Cytosine, Uracil.',
      '3 Parts of each Nucleotide: Nitrogenous base (carries genetic info), Pentose Sugar (backbone), Phosphate Group (makes it acidic, links nucleotides together).',
      'Why important: most genetic info as nucleic acids is needed for coding traits, growth, reproduction, and cellular processes.'
    ]}
  ], quiz:[
    {q:'Which of the 4 major biomolecule types does NOT form a true polymer?', c:['Carbohydrates','Lipids','Proteins','Nucleic Acids'], a:1, e:'Biomolecules are polymers built from monomers EXCEPT lipids, which do not form true polymers.'},
    {q:'Malnutrition is classified as:', c:['Only being underweight','Only being overweight','Both overweight and underweight, at any age or gender','Only a childhood condition'], a:2, e:'Malnutrition covers both deficiencies and excesses — both overweight and underweight individuals are considered malnourished, at any age or gender.'},
    {q:'Sucrose is formed from which two monosaccharides?', c:['Glucose + Glucose','Glucose + Fructose','Glucose + Galactose','Fructose + Galactose'], a:1, e:'Sucrose (table sugar) is composed of Glucose + Fructose, joined by a glycosidic linkage.'},
    {q:'Maltose is formed from which two monosaccharides, and is found in grains/cereals?', c:['Glucose + Fructose','Glucose + Galactose','Glucose + Glucose','Fructose + Fructose'], a:2, e:'Maltose is Glucose + Glucose, commonly found in grains, cereals, corn, rye, and wheat.'},
    {q:'Which polysaccharide is described as the most abundant organic compound on Earth?', c:['Starch','Glycogen','Cellulose','Chitin'], a:2, e:'Cellulose, a major structural component of plant cell walls, is the most abundant organic compound on Earth.'},
    {q:'In the human body, glycogen is primarily stored in the:', c:['Brain','Liver, muscle, and fat cells','Lungs','Skin'], a:1, e:'Glycogen is found in animals and fungi, stored primarily in the liver, as well as muscle and fat cells.'},
    {q:'Lipids are described as hydrophobic mainly because their bonds are:', c:['Ionic','Nonpolar (carbon-carbon and carbon-hydrogen bonds)','Highly polar','Radioactive'], a:1, e:'Lipids contain large regions of nonpolar carbon-carbon and carbon-hydrogen bonds, making them hydrophobic and unable to dissolve in water.'},
    {q:'A triglyceride is composed of a glycerol backbone joined to fatty acids via which type of bond?', c:['Peptide bond','Ester bond','Glycosidic linkage','Phosphodiester bond'], a:1, e:'A triglyceride is formed by an ester bond between glycerol and 3 fatty acids, via dehydration synthesis.'},
    {q:'In a phospholipid, the "polar head" (phosphate + glycerol) is:', c:['Hydrophobic','Hydrophilic (water-soluble)','Neither hydrophilic nor hydrophobic','Made of fatty acids only'], a:1, e:'The polar head of a phospholipid (phosphate + glycerol) is hydrophilic, meaning it is water-soluble.'},
    {q:'How many carbon rings compose a steroid?', c:['2','3','4','6'], a:2, e:'Steroids are composed of FOUR carbon rings, as seen in cholesterol, estrogen, and testosterone.'},
    {q:'Excess cholesterol used to make bile in the liver can crystallize and form:', c:['Kidney stones','Gallstones','Blood clots','Muscle knots'], a:1, e:'Excess cholesterol in bile can crystallize and form gallstones.'},
    {q:'Which lipid-related disorder is caused by a buildup of urate crystals, often in the big toe?', c:['Type 2 Diabetes','MASLD','Gout','Phenylketonuria'], a:2, e:'Gout is a type of inflammatory arthritis caused by urate crystal buildup, often in the big toe or other lower limbs.'},
    {q:'A polypeptide is defined as a polymer of how many amino acids?', c:['1-2','3-100','101-500','Unlimited, always over 1,000'], a:1, e:'A polypeptide is a polymer of 3-100 amino acids; a protein is a polypeptide LONGER than 100 amino acids with complex structure/function.'},
    {q:'Which level of protein structure is stabilized by disulfide and hydrogen bonds, creating the overall 3D shape of a single polypeptide?', c:['Primary','Secondary','Tertiary','Quaternary'], a:2, e:'Tertiary structure is the overall three-dimensional shape of a single polypeptide, stabilized by disulfide and hydrogen bonds.'},
    {q:'Hemoglobin, formed from 2+ associated polypeptide chains, is an example of which protein structure level?', c:['Primary','Secondary','Tertiary','Quaternary'], a:3, e:'Quaternary structure involves 2 or more polypeptide chains associating, as seen in hemoglobin.'},
    {q:'Actin and myosin, responsible for muscle contraction, exemplify which role of proteins?', c:['Storage','Hormonal','Contractile and motor proteins','Defensive proteins'], a:2, e:'Actin and myosin are contractile/motor proteins, responsible for the contraction of muscles.'},
    {q:'What is the minimum amount of energy required to start a chemical reaction called?', c:['Kinetic energy','Activation energy','Potential energy','Thermal energy'], a:1, e:'Activation energy is the minimum amount of energy required to start a reaction; enzymes work by lowering this requirement.'},
    {q:'Which type of enzyme inhibitor resembles the normal substrate and competes for the active site?', c:['Noncompetitive inhibitor','Competitive inhibitor','Cofactor','Coenzyme'], a:1, e:'Competitive inhibitors resemble an enzyme\'s normal substrate and compete with it for the active site.'},
    {q:'Which type of enzyme inhibitor binds to a different part of the enzyme, altering the active site\'s shape indirectly?', c:['Competitive inhibitor','Noncompetitive inhibitor','Cofactor','Substrate'], a:1, e:'Noncompetitive inhibitors bind to a part of the enzyme OTHER than the active site, changing the enzyme\'s shape and altering the active site.'},
    {q:'Which nitrogenous base is found in RNA but NOT in DNA?', c:['Adenine','Guanine','Cytosine','Uracil'], a:3, e:'RNA uses Uracil in place of Thymine, which is found only in DNA.'},
    {q:'The flow of genetic information, as described in the notes, follows which order?', c:['Protein → RNA → DNA','DNA → RNA → Protein','RNA → DNA → Protein','Protein → DNA → RNA'], a:1, e:'DNA contains the instructions for producing RNA, and RNA contains the instructions for producing proteins: DNA → RNA → Proteins.'},
    {q:'Which of the 3 parts of a nucleotide carries genetic information?', c:['Pentose Sugar','Phosphate Group','Nitrogenous Base','None of these'], a:2, e:'The Nitrogenous Base is the nitrogen-containing molecule that carries genetic information within a nucleotide.'}

{id:'bn2', title:'2. Cells: Theory, Prokaryotic & Eukaryotic Structure', content:[
    {h:'The Cell Theory: Historical Development', b:[
      '1590 — Hans Jansen, Zacharias Jansen, and Hans Lippershey: 3 Dutch spectacle makers credited with creating the compound microscope.',
      '1665 — Robert Hooke: introduced the term "cell." 1673 — Antoine van Leeuwenhoek: observed "very little animacules" (microorganisms).',
      '1838 — Theodor Schwann and Matthias Schleiden: proposed the classical cell theory — all organisms are made of cells; cells are the basic unit of life.',
      '1858 — Rudolf Virchow: cells come from pre-existing cells that have multiplied.',
      'Modern Cell Theory adds: DNA is passed between cells during cell division; cells of all organisms within a similar species are mostly the same.'
    ]},
    {h:'Shared Features & Prokaryotic Cells', b:[
      'A cell is greater than the sum of its parts. ALL cells share: Cell membrane, Cytoplasm, DNA, Ribosomes.',
      'Prokaryotes: lack a true nucleus and other membrane-enclosed organelles; DNA concentrated in an unenclosed region called the nucleoid; simpler internal structure (Bacteria and Archaea).',
      'Parts of a prokaryotic cell: Fimbriae (attachment structures, not visible on TEM), Nucleoid (region with DNA, not membrane-enclosed), Ribosomes (protein synthesis), Plasma membrane (encloses cytoplasm), Cell wall (rigid structure outside the plasma membrane), Glycocalyx (outer coating/capsule/slime layer), Flagella (locomotion organelles).',
      'Cell size and plasma membrane shape affect surface area and volume; microvilli can increase a cell\'s surface area.'
    ]},
    {h:'Eukaryotic Cells: Cell Wall, Membrane, Cytoplasm, Nucleus', b:[
      'Eukaryotes: possess a TRUE nucleus; more complex organisms (animal and plant cells).',
      'Cell wall: found in plant cells (not animal); also in prokaryotes, fungi, some unicellular eukaryotes. Protects the cell, maintains shape, prevents excessive water uptake. Composition: cellulose (plants), chitin (fungi).',
      'Cell/plasma membrane: found in plant AND animal cells; exhibits SELECTIVE PERMEABILITY. Composition: phospholipid bilayer (hydrophilic + hydrophobic regions), described as a "fluid mosaic" of lipids and proteins.',
      'Cytoplasm: everything inside the cell except the nucleus; composed of cytosol (gel-like fluid); contains organelles with specialized functions.',
      'Nucleus: contains most of the cell\'s DNA (some genes are in mitochondria/chloroplasts). Nuclear envelope encloses it, perforated by pores; Pore complex regulates entry/exit of proteins, RNAs, macromolecule complexes. Nuclear lamina: protein filaments maintaining nuclear shape (called intermediate filaments in animal cells). Nuclear matrix: protein fibers throughout the nuclear interior.',
      'Chromosomes: one long DNA molecule + many proteins. Chromatin: diffuse mass appearance when the cell isn\'t dividing. Nucleolus: mass of densely stained granules/fibers where ribosomal RNA is synthesized.'
    ]},
    {h:'Ribosomes & The Endomembrane System', b:[
      'Ribosomes: found in plant and animal cells; site of protein synthesis; NOT membrane-bound (not considered true organelles). Free ribosomes (suspended in cytosol, make cytosol-functioning proteins) vs. Bound ribosomes (attached to ER/nuclear envelope, make proteins for membrane insertion).',
      'Endomembrane system: regulates protein traffic, performs metabolic functions. Includes: Plasma membrane, ER, Golgi apparatus, Lysosome, Vesicles & vacuoles.',
      'Endoplasmic Reticulum (ER): "endoplasmic" = within cytoplasm, "reticulum" = Latin "little net"; continuous with the nuclear envelope. Cisternae = network of membranous tubules; ER lumen = cisternal space.',
      'Smooth ER (SER): lacks ribosomes; synthesizes lipids, metabolizes carbohydrates, detoxifies drugs/poisons, stores calcium ions.',
      'Rough ER (RER): studded with ribosomes; makes secretory proteins (many are glycoproteins); the "membrane factory" of the cell; secretory proteins leave via transport vesicles.',
      'Golgi Apparatus: found in both plant/animal cells; where ER products are modified, stored, then sent onward. Structure: cisternae (flattened membranous sacs). Cis face (receiving side) and Trans face (opposite/dispatching side).',
      'Lysosomes: found in animal cells, less prominent in plant cells; contain hydrolytic enzymes that digest (hydrolyze) macromolecules.',
      'Vacuoles: large vesicles derived from the ER and Golgi. Food vacuoles (for phagocytosis); Contractile vacuoles (pump out excess water, can hold poison/pigments in plants); Central vacuole (plant cells only, holds cell sap, main repository of ions like potassium/chloride).'
    ]},
    {h:'Mitochondria, Chloroplast, Peroxisome, Cytoskeleton', b:[
      'Mitochondria & Chloroplast: convert energy into forms cells can use for work (Endosymbiotic Theory explains their origin).',
      'Mitochondria: found in plant AND animal cells; converts glucose to ATP; number correlates with a cell\'s metabolic activity level. Parts: Outer membrane (protective barrier), Inner membrane (ETC proteins), Intermembrane space, Cristae (folded surfaces, increase surface area), Matrix (enzymes, mitochondrial DNA, ribosomes).',
      'Chloroplast: found ONLY in plant cells; contains chlorophyll; site of photosynthesis; a specialized plastid. Other plastids: Amyloplast (colorless, stores starch), Chromoplast (gives fruits/flowers orange/yellow hues). Parts: Outer/inner membrane, Intermembrane space, Thylakoid (interconnected sacs, stacked into grana), Lumen (space inside thylakoid), Stroma (chloroplast DNA + free ribosomes + enzymes).',
      'Peroxisome: found in plant and animal cells; cooperates with chloroplast/mitochondria; removes hydrogen atoms from substrates, transfers them to O2, producing hydrogen peroxide (H2O2) as a byproduct.',
      'Cytoskeleton: found in plant and animal cells; extends throughout the cell, gives mechanical support/shape. Components: Microtubules (thickest, hollow tubes), Microfilaments (thinnest, solid fibers), Intermediate filaments — all attach to each other and to glycoproteins in the plasma membrane.'
    ]},
    {h:'Centrosomes, Cilia & Flagella', b:[
      'Centrosomes/Centrioles: found in animal cells (plant cells have centrosome-like MTOCs but usually lack centrioles); used for microtubule assembly.',
      'Cilia & Flagella: special microtubule arrangements, present in animal cells but NOT plant cells.',
      'Cilia: for locomotion, usually occur in large numbers on the cell surface.',
      'Flagella: for locomotion, usually just one or a few per cell, and LONGER than cilia.'
    ]}
  ], quiz:[
    {q:'Who is credited with introducing the term "cell" in 1665?', c:['Theodor Schwann','Robert Hooke','Antoine van Leeuwenhoek','Rudolf Virchow'], a:1, e:'Robert Hooke introduced the term "cell" in 1665.'},
    {q:'Who proposed that cells come from pre-existing cells that have multiplied?', c:['Robert Hooke','Theodor Schwann','Matthias Schleiden','Rudolf Virchow (1858)'], a:3, e:'Rudolf Virchow (1858) proposed that cells come from pre-existing cells that have multiplied.'},
    {q:'Which two scientists proposed the classical cell theory in 1838, stating all organisms are made of cells?', c:['Hooke and Leeuwenhoek','Schwann and Schleiden','Virchow and Hooke','Jansen and Lippershey'], a:1, e:'Theodor Schwann and Matthias Schleiden proposed the classical cell theory in 1838.'},
    {q:'Which feature is shared by ALL cells (prokaryotic and eukaryotic)?', c:['A true nucleus','Cell membrane, cytoplasm, DNA, ribosomes','Chloroplasts','A cell wall made of cellulose'], a:1, e:'All cells share a cell membrane, cytoplasm, DNA, and ribosomes, regardless of being prokaryotic or eukaryotic.'},
    {q:'In prokaryotic cells, DNA is concentrated in an unenclosed region called the:', c:['Nucleus','Nucleoid','Nucleolus','Chromatin'], a:1, e:'In prokaryotes, DNA is concentrated in the nucleoid, a region NOT enclosed by a membrane (unlike the true nucleus in eukaryotes).'},
    {q:'Which structure in prokaryotic cells serves as an attachment structure, not visible on TEM?', c:['Flagella','Fimbriae','Glycocalyx','Nucleoid'], a:1, e:'Fimbriae are attachment structures on the surface of some prokaryotes, not visible via TEM.'},
    {q:'A plant cell wall is primarily composed of:', c:['Chitin','Cellulose','Peptidoglycan','Keratin'], a:1, e:'Plant cell walls are composed of cellulose, while fungal cell walls are composed of chitin.'},
    {q:'The cell/plasma membrane is described as exhibiting "selective permeability," meaning:', c:['It blocks everything equally','It allows some substances to cross more easily than others','It allows nothing to pass','It is identical to the cell wall'], a:1, e:'Selective permeability means the membrane allows some substances to cross more easily than others.'},
    {q:'Which structure regulates the entry and exit of proteins, RNAs, and macromolecule complexes through the nuclear envelope?', c:['Nuclear lamina','Pore complex','Nuclear matrix','Nucleolus'], a:1, e:'The pore complex lines each nuclear pore and regulates the passage of proteins, RNAs, and macromolecule complexes.'},
    {q:'Ribosomal RNA is synthesized in which structure?', c:['The nuclear lamina','The nucleolus','The Golgi apparatus','The lysosome'], a:1, e:'The nucleolus is the mass of densely stained granules/fibers where ribosomal RNA is synthesized.'},
    {q:'Why are ribosomes NOT considered true organelles?', c:['They are too small to matter','They are not membrane-bound','They contain no RNA','They are only found in plants'], a:1, e:'Ribosomes are not membrane-bound, which is why they are not classified as true organelles despite their essential function.'},
    {q:'Which type of Endoplasmic Reticulum is studded with ribosomes and makes secretory proteins?', c:['Smooth ER (SER)','Rough ER (RER)','Golgi ER','Nuclear ER'], a:1, e:'Rough ER (RER) is studded with ribosomes and is known as the "membrane factory" for making secretory proteins.'},
    {q:'Which type of Endoplasmic Reticulum synthesizes lipids and detoxifies drugs/poisons?', c:['Rough ER (RER)','Smooth ER (SER)','Golgi ER','Ribosomal ER'], a:1, e:'Smooth ER (SER) lacks ribosomes and is responsible for lipid synthesis, carbohydrate metabolism, and detoxification.'},
    {q:'The Golgi apparatus\'s "cis face" is best described as:', c:['The side that dispatches finished products','The receiving side, where ER products first arrive','A type of vacuole','A type of ribosome'], a:1, e:'The cis face of the Golgi apparatus is the receiving side, on the same side as incoming ER products; the trans face dispatches them.'},
    {q:'Lysosomes contain which type of enzymes, used to digest macromolecules?', c:['Hydrolytic enzymes','Digestive enzymes only in plants','Photosynthetic enzymes','Enzymes exclusive to mitochondria'], a:0, e:'Lysosomes contain hydrolytic enzymes that digest (hydrolyze) macromolecules.'},
    {q:'Which type of vacuole is specific to plant cells, holding cell sap and acting as the main repository for ions like potassium and chloride?', c:['Food vacuole','Contractile vacuole','Central vacuole','Golgi vacuole'], a:2, e:'The central vacuole, found in plant cells, contains cell sap and serves as the main repository of inorganic ions.'},
    {q:'Which organelle converts glucose to ATP, with its number correlating to a cell\'s metabolic activity level?', c:['Chloroplast','Mitochondria','Peroxisome','Golgi apparatus'], a:1, e:'Mitochondria convert glucose to ATP, and cells with higher metabolic activity tend to have more mitochondria.'},
    {q:'Which folded structure inside the mitochondria increases its surface area?', c:['Cristae','Stroma','Thylakoid','Cisternae'], a:0, e:'Cristae are the highly folded inner membrane surfaces of the mitochondria, increasing surface area for the electron transport chain.'},
    {q:'Which plastid is colorless and stores starch (amylose)?', c:['Chloroplast','Chromoplast','Amyloplast','Leucoplast (general, unnamed)'], a:2, e:'The Amyloplast is a colorless plastid that stores starch (amylose).'},
    {q:'Which plastid gives fruits and flowers their orange and yellow hues?', c:['Amyloplast','Chromoplast','Chloroplast','Mitochondria'], a:1, e:'The Chromoplast is responsible for giving fruits and flowers their orange and yellow colors.'},
