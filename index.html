      'Proteins act as transport channels and are highly selective about what passes through; specialized proteins also enable cellular communication.',
      'Cholesterol provides stability and helps maintain the cell\'s shape.',
      'Cell Wall: a rigid, protective layer composed of carbohydrates, found OUTSIDE the cell membrane in some organisms (like plants, fungi, and bacteria) — NOT all organisms have one (animal cells, for example, don\'t).'
    ]},
    {h:'Passive vs. Active Transport', b:[
      'Any movement of particles is broadly called diffusion; when water is the substance moving, it\'s specifically called osmosis.',
      'Passive transport requires NO energy: diffusion (particles move from high to low concentration through the membrane) and facilitated diffusion (same direction, but needs a specific transport protein to pass through).',
      'Active transport REQUIRES energy (ATP): transport proteins move substances against their concentration gradient (low → high), and bulk transport (endocytosis/exocytosis) also requires ATP.',
      'The goal of passive transport is equilibrium — equal parts in and out of the cell.'
    ]},
    {h:'Active Transport: Moving Against the Gradient', b:[
      'Sodium: cells actively pump sodium against its gradient, and this uses ATP (ATP → ADP) to power the transport protein.',
      'Potassium transport, by contrast, does not require the same active energy investment in this system — illustrating that not all ions cross the membrane the same way.',
      'Active transport lets a cell keep specific concentrations of ions inside vs. outside that diffusion alone could never maintain.'
    ]},
    {h:'Bulk Transport: Endocytosis & Exocytosis', b:[
      'Endocytosis: the cell membrane folds inward to bring materials INTO the cell ("entrance"); requires ATP.',
      'Exocytosis: the cell membrane pushes materials OUT of the cell ("exits"); requires ATP.',
      'Phagocytosis ("cell eating"): a more specific form of endocytosis where white blood cells engulf and digest substances like bacteria.',
      'Pinocytosis ("cell drinking"): a smaller-scale movement of materials/fluids into the cell.',
      'Receptor-Mediated Endocytosis: specific receptor proteins on the cell surface recognize and bind a target material before it is brought inside.',
      'Viruses (like COVID-19) are infectious partly because their surface protein coat resembles the human body\'s own protein coat — this similarity lets them slip past recognition, so the immune system doesn\'t flag them as foreign and the virus more easily invades.'
    ]},
    {h:'Cell Tonicity & Osmosis', b:[
      'Solute = the substance that dissolves; Solvent = the substance that does the dissolving. Water always flows toward the area with MORE solute.',
      'Hypotonic solution: more solute INSIDE the cell than outside → water moves INTO the cell → the cell swells → too much water causes lysis (rupture).',
      'Isotonic solution: solute concentration is balanced inside and outside → the cell stays at equilibrium, no net water movement.',
      'Hypertonic solution: more solute OUTSIDE the cell → water moves OUT of the cell (e.g., skin after swimming draws out moisture, a dehydration process) → the cell shrinks, a process called crenation.'
    ]},
    {h:'Kidneys & Osmoregulation', b:[
      'The kidneys filter waste out of the blood; blood delivers oxygen and picks up waste from different parts of the body, then red blood cells travel to the kidneys.',
      'Nephrons are the kidney\'s small blood-vessel-rich filtering units — waste is squeezed out of the blood there, and the cleaned blood is released.',
      'Nephrons contain loops that create different concentration gradients, which act as an attractor pulling water back in (reabsorption).',
      'If the kidneys are not working properly, solute is left inside red blood cells, causing them to swell/get bigger and eventually become damaged — diet changes can help manage this.'
    ]}
  ], quiz:[
    {q:'What is the primary role of the cell membrane (plasma membrane)?', c:['To generate ATP for the cell','To act as a selective barrier regulating passage between the interior and exterior','To store the cell\'s genetic material','To break down glucose into pyruvate'], a:1, e:'The cell membrane surrounds the cell and acts as a selective barrier, regulating the passage of substances like nutrients and waste.'},
    {q:'The cell membrane is composed of which three main components?', c:['DNA, RNA, and ribosomes','Phospholipids, proteins, and cholesterol','Glucose, ATP, and enzymes','Chlorophyll, starch, and cellulose'], a:1, e:'The cell membrane is composed of phospholipids (forming the bilayer), proteins (for transport/communication), and cholesterol (for stability).'},
    {q:'In the phospholipid bilayer, which part of each phospholipid faces the watery environment?', c:['The hydrophobic tail','The hydrophilic head','Neither part interacts with water','Both parts equally avoid water'], a:1, e:'The hydrophilic ("water-loving") heads face outward toward the watery environment, while the hydrophobic tails face inward, away from water.'},
    {q:'What role does cholesterol play in the cell membrane?', c:['It transports glucose across the membrane','It provides stability and helps maintain the cell\'s shape','It generates energy for active transport','It stores genetic information'], a:1, e:'Cholesterol embedded in the membrane provides stability and helps maintain the cell\'s shape.'},
    {q:'Which type of transport does NOT require any energy (ATP) from the cell?', c:['Active transport','Bulk transport (endocytosis)','Passive transport','Exocytosis'], a:2, e:'Passive transport (diffusion, facilitated diffusion, osmosis) requires no energy — substances move down their concentration gradient naturally.'},
    {q:'Facilitated diffusion differs from simple diffusion in that it:', c:['Moves substances from low to high concentration','Requires a specific transport protein for particles to pass through','Always requires ATP','Only occurs with water molecules'], a:1, e:'Facilitated diffusion moves substances the same direction as diffusion (high to low concentration) but needs a specific protein channel to cross the membrane.'},
    {q:'When a cell actively pumps sodium against its concentration gradient, what happens to ATP?', c:['ATP is created from ADP','ATP is converted to ADP, releasing energy to power the pump','ATP has no role in this process','ATP is stored, unchanged'], a:1, e:'Active transport of sodium uses ATP, which is converted to ADP as its energy is released to power the transport protein.'},
    {q:'What is the general GOAL of passive transport processes like diffusion?', c:['To use as much ATP as possible','To reach equilibrium — equal concentration inside and outside the cell','To pump all particles out of the cell','To destroy old cell membranes'], a:1, e:'Passive transport processes work toward equilibrium, where concentrations inside and outside the cell become equal.'},
    {q:'"Cell eating," where white blood cells engulf and digest bacteria, is specifically called:', c:['Pinocytosis','Phagocytosis','Facilitated diffusion','Osmosis'], a:1, e:'Phagocytosis ("to devour") is the process where cells like white blood cells engulf substances such as bacteria and digest them.'},
    {q:'"Cell drinking," involving smaller-scale movement of fluids into the cell, is called:', c:['Phagocytosis','Pinocytosis','Exocytosis','Crenation'], a:1, e:'Pinocytosis ("cell drinking") describes the smaller-scale intake of fluids/materials into the cell.'},
    {q:'In Receptor-Mediated Endocytosis, what allows the cell to bring in a specific target material?', c:['Random diffusion','Receptor proteins on the surface that recognize the material before it is brought inside','A concentration gradient only','The nucleus signaling the membrane'], a:1, e:'Receptor-Mediated Endocytosis relies on receptor proteins on the cell surface that specifically recognize the incoming material.'},
    {q:'According to the notes, a virus like COVID-19 can infect cells more easily partly because:', c:['It has no protein coat at all','Its protein coat resembles the human body\'s own protein coat, so it isn\'t easily flagged as foreign','It destroys the cell membrane instantly','It only affects plant cells'], a:1, e:'The similarity between the virus\'s protein coat and the body\'s own protein coat makes it harder for the immune system to recognize the virus as foreign, allowing easier invasion.'},
    {q:'Exocytosis is best described as the process where the cell membrane:', c:['Brings materials into the cell','Pushes materials out of the cell','Breaks down glucose','Splits water into hydrogen and oxygen'], a:1, e:'Exocytosis ("exits") is when the cell membrane pushes materials out of the cell; like endocytosis, it requires ATP.'},
    {q:'In cell tonicity, water always moves toward the area with:', c:['Less solute','More solute','Equal solute only','No solute at all'], a:1, e:'Water follows solute concentration — it moves toward the area that has MORE solute (higher solute concentration).'},
    {q:'A red blood cell placed in a HYPOTONIC solution will:', c:['Shrink (crenation)','Stay exactly the same size','Swell with water, potentially leading to lysis (rupture)','Immediately dissolve into the solution'], a:2, e:'In a hypotonic solution, there is more solute inside the cell than outside, so water rushes IN, causing the cell to swell and potentially rupture (lysis).'},
    {q:'A red blood cell placed in a HYPERTONIC solution will:', c:['Swell and rupture','Shrink, undergoing crenation','Stay in perfect equilibrium','Multiply rapidly'], a:1, e:'In a hypertonic solution, there is more solute outside the cell, so water moves OUT of the cell, causing it to shrink — a process called crenation.'},
    {q:'In an ISOTONIC solution, a cell will:', c:['Swell until it bursts','Shrink until it withers','Stay at equilibrium, with no net water movement','Immediately undergo phagocytosis'], a:2, e:'An isotonic solution has balanced solute concentrations inside and outside the cell, so the cell stays at equilibrium.'},
    {q:'After swimming, skin can feel dehydrated because pool water (with fewer solutes than skin cells) draws moisture OUT — this is an example of skin cells being in a:', c:['Hypotonic environment','Isotonic environment','Hypertonic environment','Neutral environment with no tonicity'], a:2, e:'When more solute is outside the cells (relative to the surrounding water), water is drawn out, dehydrating the skin — a hypertonic-type effect described in the notes.'},
    {q:'What is the main function of nephrons in the kidney?', c:['To produce red blood cells','To filter waste out of the blood and reabsorb what the body needs','To store bile for digestion','To synthesize proteins from mRNA'], a:1, e:'Nephrons are the kidney\'s functional filtering units — they filter waste out of the blood and use concentration gradients to reabsorb needed substances like water.'},
    {q:'If the kidneys are not functioning properly, what can happen to red blood cells, according to the notes?', c:['They shrink and disappear','Solute is left inside them, causing them to swell and eventually get damaged','They immediately turn into white blood cells','They stop carrying oxygen entirely'], a:1, e:'Poor kidney function can leave excess solute inside red blood cells, causing them to swell and eventually sustain damage — diet changes can help manage this.'},
    {q:'The rigid, protective, carbohydrate-based layer found OUTSIDE the cell membrane in plants, fungi, and bacteria (but not animal cells) is called the:', c:['Cell wall','Cytoskeleton','Nuclear envelope','Golgi apparatus'], a:0, e:'The cell wall is a protective layer made of carbohydrates, found outside the cell membrane in organisms like plants, fungi, and bacteria — not all organisms (e.g. animals) have one.'}
  ], glossary:[
    {term:'Phospholipid bilayer', def:'two layers of phospholipids (hydrophilic heads out, hydrophobic tails in) forming the cell membrane.'},
    {term:'Passive transport', def:'movement of substances requiring no energy (diffusion, facilitated diffusion, osmosis).'},
    {term:'Active transport', def:'movement of substances against their gradient, requiring ATP.'},
    {term:'Osmosis', def:'diffusion specifically of water, always toward the area with more solute.'},
    {term:'Phagocytosis / Pinocytosis', def:'"cell eating" of larger particles / "cell drinking" of fluids, both forms of endocytosis.'},
    {term:'Hypotonic / Isotonic / Hypertonic', def:'more solute inside cell (water in, may lyse) / balanced (equilibrium) / more solute outside cell (water out, crenation).'},
    {term:'Nephron', def:'the kidney\'s functional filtering unit; uses concentration gradients to reabsorb water.'},
    {term:'Cell Wall', def:'a rigid, protective, carbohydrate-based layer outside the cell membrane in plants/fungi/bacteria; not present in animal cells.'}
  ], palace:[
    {stop:'Front Door (Bilayer Curtain)', image:'A two-layer curtain hangs at the door, with little "heads" pointing outward toward the rain and "tails" tucked safely inside, dry.', fact:'Phospholipid bilayer: hydrophilic heads face out, hydrophobic tails face in.'},
    {stop:'Turnstile in the Hallway', image:'One turnstile spins freely with no effort (passive transport), while another needs a coin (ATP) dropped in before it will turn (active transport).', fact:'Passive transport needs no energy; active transport requires ATP.'},
    {stop:'Kitchen Sponge in the Sink', image:'A red sponge floating in salty water shrivels up and wrinkles, while the same sponge in plain water puffs up like a balloon.', fact:'Hypertonic solution shrinks cells (crenation); hypotonic solution swells cells (risk of lysis).'},
    {stop:'Water Filter Under the Sink', image:'A tiny filter with looping tubes squeezes gunk out of a stream of water, then pulls clean water back in through the loops.', fact:'Nephrons filter waste from blood and use loops to reabsorb water via concentration gradients.'}
  ]},
  {id:'gs10', title:'10. Protein Synthesis: DNA, RNA & Ribosomes', content:[
    {h:'Why Protein Synthesis Matters', b:[
      'Protein synthesis is the process of building and repairing cellular structures, regulating biological processes, and expressing the specific characteristics of each organism.',
      'DNA → Proteins: proteins are used for structural support, communication, and enzymes.',
      'The "Central Dogma" of molecular biology: DNA (in the nucleus) → mRNA → Ribosomes → Proteins.'
    ]},
    {h:'Step 1: DNA Replication', b:[
      'DNA unwinds and makes a new complementary partner strand by adding the appropriate nucleotide, following base-pairing rules.',
      'Key enzymes: Helicase (unwinds the DNA double helix) and Polymerase (binds and adds new nucleotides to build the new strand).'
    ]},
    {h:'Step 2: Transcription (DNA → mRNA)', b:[
      'Transcription works much like DNA replication, but Thymine is replaced by Uracil in the new strand.',
      'Base pairing in transcription: Adenine pairs with Uracil (A-U), and Guanine pairs with Cytosine (G-C).',
      'The result is a strand of messenger RNA (mRNA) that carries the genetic instructions out of the nucleus.'
    ]},
    {h:'Step 3: Translation (mRNA → Protein)', b:[
      'Translation involves amino acids, codons, and anti-codons, and takes place at the ribosome.',
      'The mRNA is used as a template to determine the sequence of tRNA (transfer RNA).',
      'The tRNA sequence determines the sequence of amino acids, which are linked together in a chain to produce a polypeptide/protein molecule.'
    ]},
    {h:'Ribosomes', b:[
      'Ribosomes are the main organelle responsible for the production of proteins.',
      'They are essential organelles for overall cellular functioning and survival.',
      'Ribosomes synthesize proteins using the genetic information carried by mRNA, which is crucial for cellular structure, function, and regulation.',
      'Ribosomes are located in the cytoplasm and on the surface of the rough endoplasmic reticulum (Rough ER).'
    ]},
    {h:'DNA Expression', b:[
      'Even though every cell in an organism carries the same DNA, each cell can produce a different protein / express its DNA differently.',
      'Which genes get expressed depends on the specific need of that cell — this is why, for example, a muscle cell and a skin cell (with identical DNA) look and function so differently.'
    ]}
  ], quiz:[
    {q:'What is the correct order of the "Central Dogma" of molecular biology?', c:['Proteins → mRNA → DNA → Ribosomes','DNA → mRNA → Ribosomes → Proteins','mRNA → DNA → Proteins → Ribosomes','Ribosomes → DNA → mRNA → Proteins'], a:1, e:'The Central Dogma flows: DNA (nucleus) → mRNA → Ribosomes → Proteins.'},
    {q:'Proteins produced through protein synthesis are used for which purposes?', c:['Structural support, communication, and enzymes','Only as a backup energy source','Exclusively for photosynthesis','Only for DNA replication'], a:0, e:'Proteins serve many roles, including structural support, cellular communication, and functioning as enzymes.'},
    {q:'During DNA replication, which enzyme UNWINDS the DNA double helix?', c:['Polymerase','Helicase','RuBisCo','Amylase'], a:1, e:'Helicase is the enzyme responsible for unwinding the DNA double helix during replication.'},
    {q:'During DNA replication, which enzyme BINDS and adds new nucleotides to build the new strand?', c:['Helicase','Polymerase','Lipase','Protease'], a:1, e:'Polymerase binds to the unwound DNA strand and adds the appropriate nucleotides to build the new complementary strand.'},
    {q:'What is the key difference between DNA replication and Transcription, according to the notes?', c:['Transcription happens in the cytoplasm only','In transcription, Thymine is replaced with Uracil','Transcription does not involve base pairing','Transcription produces new DNA instead of RNA'], a:1, e:'Transcription is similar to DNA replication, but Thymine is replaced by Uracil in the resulting RNA strand.'},
    {q:'In Transcription, which base pairs with Adenine?', c:['Thymine','Uracil','Cytosine','Guanine'], a:1, e:'In transcription, Adenine pairs with Uracil (A-U) instead of Thymine, since Thymine is replaced by Uracil in RNA.'},
    {q:'What is the product of Transcription?', c:['A new protein','A strand of messenger RNA (mRNA)','A duplicated DNA molecule','A ribosome'], a:1, e:'Transcription converts a DNA sequence into a complementary strand of messenger RNA (mRNA).'},
    {q:'Which process converts RNA into a Protein?', c:['Replication','Transcription','Translation','Photosynthesis'], a:2, e:'Translation is the process where RNA (mRNA) is used to build a protein, involving amino acids, codons, and anti-codons.'},
    {q:'Where does Translation take place?', c:['In the nucleus','At the ribosome','In the mitochondria','In the chloroplast'], a:1, e:'Translation takes place at the ribosome, where mRNA is used as a template to build a protein.'},
    {q:'During Translation, what determines the sequence of tRNA used?', c:['The mRNA sequence, used as a template','A random selection process','The DNA sequence directly, bypassing mRNA','The type of enzyme present in the cytoplasm'], a:0, e:'The mRNA sequence is used as a template to determine the sequence of tRNA that will be recruited during translation.'},
    {q:'What does the sequence of tRNA ultimately determine during Translation?', c:['The sequence of amino acids linked together to form a protein','The rate of DNA replication','The number of ribosomes produced','The color of the cell membrane'], a:0, e:'The tRNA sequence determines the sequence of amino acids, which are linked in a chain to form a polypeptide/protein molecule.'},
    {q:'What is the MAIN organelle responsible for the production of proteins?', c:['Mitochondria','Ribosome','Chloroplast','Nucleus'], a:1, e:'Ribosomes are the main organelle responsible for producing proteins, using genetic information from mRNA.'},
    {q:'Where are ribosomes located within the cell?', c:['Only inside the nucleus','In the cytoplasm and on the surface of the rough endoplasmic reticulum','Only inside mitochondria','Only inside chloroplasts'], a:1, e:'Ribosomes are located in the cytoplasm and on the surface of the rough ER (which is why it\'s called "rough").'},
    {q:'Why are ribosomes considered essential for cellular survival?', c:['They generate all of the cell\'s ATP','They synthesize proteins crucial for cellular structure, function, and regulation','They store the cell\'s genetic material','They control cell tonicity'], a:1, e:'Ribosomes synthesize proteins using genetic info from mRNA, which is crucial for cellular structure, function, and regulation — essential for functioning and survival.'},
    {q:'"DNA Expression" refers to the idea that:', c:['All cells produce the exact same proteins at all times','Each cell can produce a different protein / express its DNA differently, depending on need','Only reproductive cells contain DNA','DNA expression never changes throughout an organism\'s life'], a:1, e:'DNA Expression means that although each cell contains the same DNA, each cell can express that DNA differently and produce different proteins depending on its specific need.'},
    {q:'What determines WHICH proteins a specific cell expresses from its DNA?', c:['The cell\'s specific need','Random chance with no pattern','The size of the cell only','The temperature of the environment only'], a:0, e:'According to the notes, gene/DNA expression in a given cell depends on that cell\'s specific need.'},
    {q:'Which molecule carries the genetic code OUT of the nucleus to the ribosomes?', c:['tRNA','mRNA','rRNA only','DNA polymerase'], a:1, e:'Messenger RNA (mRNA) is transcribed from DNA in the nucleus and carries the genetic code out to the ribosomes in the cytoplasm.'},
    {q:'A codon on the mRNA is matched by which complementary structure during Translation?', c:['A helicase enzyme','An anti-codon on tRNA','Another codon on mRNA','A phospholipid'], a:1, e:'During translation, codons on the mRNA pair with complementary anti-codons carried by tRNA molecules.'},
    {q:'Which of the following correctly lists the 3 main steps of protein synthesis, in order?', c:['Translation, Transcription, Replication','DNA Replication, Transcription, Translation','Transcription, Replication, Translation','Translation, Replication, Transcription'], a:1, e:'The correct order is: 1. DNA Replication, 2. Transcription (DNA → mRNA), 3. Translation (RNA → Protein).'},
    {q:'The final product of protein synthesis — a chain of linked amino acids — is called a:', c:['Nucleotide','Polypeptide/protein molecule','Ribosome','Codon'], a:1, e:'The chain of amino acids linked together during translation forms a polypeptide, or protein molecule.'},
    {q:'DNA\'s twisted, two-strand structure that splits apart to form base pairs during replication is called the:', c:['Central Dogma','Double Helix','Golgi apparatus','Calvin Cycle'], a:1, e:'DNA\'s double helix is its twisted two-strand structure; it splits and forms new base pairs during replication.'}
  ], glossary:[
    {term:'Central Dogma', def:'DNA → mRNA → Ribosomes → Proteins.'},
    {term:'Helicase', def:'enzyme that unwinds the DNA double helix during replication.'},
    {term:'DNA Polymerase', def:'enzyme that binds and adds nucleotides to build a new DNA strand.'},
    {term:'Transcription', def:'DNA → mRNA; same base-pairing as replication, but Thymine is replaced by Uracil.'},
    {term:'Translation', def:'mRNA → Protein; uses codons/anti-codons and tRNA to link amino acids into a protein.'},
    {term:'Ribosome', def:'main organelle for protein production; located in the cytoplasm and on the rough ER.'},
    {term:'DNA Expression', def:'each cell may express its identical DNA differently / produce different proteins depending on need.'},
    {term:'DNA Double Helix', def:'DNA\'s twisted two-strand structure; splits and base-pairs (A-T, G-C) during replication.'},
    {term:'Codon / Anti-codon', def:'a 3-base sequence on mRNA (codon) that pairs with a matching sequence on tRNA (anti-codon) during translation.'}
  ], palace:[
    {stop:'Front Hallway (Copy Machine)', image:'A copy machine unzips a long scroll (DNA), then two little robot arms — one labeled Helicase, one labeled Polymerase — unwind it and print a fresh matching copy.', fact:'DNA Replication: Helicase unwinds, Polymerase adds nucleotides to build a new strand.'},
    {stop:'Mailroom', image:'A DNA scroll gets photocopied onto thinner "memo" paper, except every "T" stamp is swapped for a "U" stamp before it\'s mailed out of the building (nucleus).', fact:'Transcription: DNA → mRNA, Thymine replaced by Uracil.'},
    {stop:'Assembly Line in the Garage (Ribosome)', image:'A conveyor belt reads a memo strip (mRNA) one 3-letter code at a time, and little delivery trucks (tRNA) dock in with matching puzzle-piece parts (amino acids) to snap onto a growing chain.', fact:'Translation at the ribosome: mRNA codons match tRNA anti-codons, building a protein chain.'},
    {stop:'Costume Closet', image:'Identical twin mannequins (same DNA) are dressed in completely different outfits depending on which room of the house they stand in.', fact:'DNA Expression: cells with identical DNA can express different genes/produce different proteins depending on need.'}
  ]},
  {id:'gs11', title:'11. Plant Anatomy & Human Body Systems', content:[
    {h:'Root Systems: Structure & Function', b:[
      'Roots grow underground, anchor the plant firmly, and absorb water and nutrients.',
      'Taproot: a primary root that grows deep into the soil, with smaller lateral roots branching off.',
      'Fibrous Roots: a network of thin roots that spread out from the base of the stem, helping with anchoring.',
      'Root Cap: the protective structure at the tip of the root that helps it penetrate the soil and lubricates its path through it.',
      'Meristematic tissue/region: where rapid cell division happens; crucial for growth.'
    ]},
    {h:'The Shoot System: Stem & Leaves', b:[
      'Most plants have two main systems: the root system (grows below ground) and the shoot system (grows above ground).',
      'The shoot system includes the stem, leaves, flowers, and fruits.',
      'The stem supports the plant and keeps it standing upright as it grows.'
    ]},
    {h:'Xylem Cell Types', b:[
      'Xylem primarily transports water and mineral nutrients from the roots to the rest of the plant, and also provides physical support.',
      'Mature xylem is dead tissue; the presence of lignin fibers keeps it waterproof and keeps it from collapsing under pressure. Fluid only moves upward, powered by negative pressure.',
      'Tracheids: conducting cells; water does not flow continuously through a single cell — instead, roots and leaves are connected through a series of tracheid cells with pitted walls.',
      'Vessel elements: long, wide, hollow tubes that connect continuously, stretching directly from the roots to the leaves.',
      'Xylem fibers: supporting structures that add strength.',
      'Xylem parenchyma: the only LIVING cells of the xylem; they help with food storage.',
      'Xylem sclerenchyma: another type of supporting cell in mature xylem tissue, adding rigidity alongside the fibers.'
    ]},
    {h:'Phloem Cell Types & Translocation', b:[
      'Phloem transports manufactured substances (like sucrose and amino acids) from the green parts of the plant (like leaves) to other parts of the plant — a process called "translocation."',
      'Phloem is living tissue overall, although sieve tube cells themselves lack nuclei and have little cytoplasm.',
      'Sieve tube: a single row of elongated, thin-walled cells with walls perforated by minute pores; a mature sieve cell has a thin layer of cytoplasm which conducts manufactured food from one cell to another.',
      'Companion cell: has everything the sieve tube cell lacks (abundant cytoplasm and a nucleus); has an extremely thin but flexible cell wall.',
      'Fiber cell (also called a bast fiber): helps give structural support to the phloem tissue.',
      'Parenchyma cell: stores food and other substances. Intermediary cells are a specialized type of phloem parenchyma involved in loading sugars into the sieve tubes.'
    ]},
    {h:'What Pulls Water Up a Tree?', b:[
      'Root Pressure: pressure generated in the roots can contribute to water movement upward.',
      'Cohesion: water molecules stick to one another, helping form a continuous column of water.',
      'Transpirational Pull: water evaporating from the leaves creates tension that helps pull water upward through the xylem.'
    ]},
    {h:'The Circulatory & Respiratory Connection', b:[
      'Arteries carry blood AWAY from the heart; Veins carry blood TOWARD the heart; Capillaries are tiny vessels where exchange occurs.',
      'Important nuance: an artery is not ALWAYS oxygenated, and a vein is not ALWAYS deoxygenated (e.g., in the pulmonary circuit).',
      'The circulatory system transports oxygen and nutrients to cells, removes carbon dioxide and waste, helps maintain body pH levels, and supports the immune system by distributing white blood cells and antibodies.',
      'Respiratory + Circulatory connection: air (oxygen drawn from rich air) → travels down the trachea into the bronchi/lungs → alveoli (thin-walled, surrounded by a network of capillaries) → oxygen passes from the alveoli into the bloodstream → the heart pumps this blood efficiently throughout the body → blood returns to the lungs now carrying carbon dioxide, released back to the atmosphere.'
    ]},
    {h:'The Digestive System: A Closer Look', b:[
      'Digestion involves mechanical digestion (chewing, swallowing, peristaltic mixing) and chemical digestion (enzymes), working together.',
      'Esophagus: moves food via peristalsis (wave-like muscular movement); the ground-up food mass is called a "bolus."',
      'Amylase, found in saliva, targets carbohydrates.',
      'Small Intestine: very long, to maximize the absorption of nutrients. It has three parts:',
      '1. Duodenum: receives pancreatic enzymes — amylase (converts carbs to simple sugars), lipase (breaks fats into fatty acids/glycerol), and proteases (break proteins into shorter peptides) — plus bile, which is produced by the liver, stored in the gallbladder, and used as an emulsifier for fats.',
      '2. Jejunum: the main site of nutrient absorption; lined with microvilli to efficiently absorb small, already-digested molecules. Disaccharides are broken down into monosaccharides, and peptidases break down peptides into amino acids.',
      '3. Ileum: handles final absorption/recycling, including Vitamin B12.',
      'Absorption mechanisms used along the way include passive diffusion and facilitated diffusion.'
    ]},
    {h:'The Musculoskeletal System', b:[
      'Support: the skeleton provides a framework that supports the body and cradles vital organs.',
      'Movement: muscles are connected to bones via tendons, allowing for movement as muscles contract; joints enable flexibility and a range of motion.',
      'Protection: the skeletal system protects vital organs, such as the skull protecting the brain and the ribcage protecting the heart and lungs.',
      'Mineral Storage: bones store important minerals, particularly calcium and phosphorus, releasing them into the bloodstream as needed.',
      'Blood Cell Production: bone marrow (found in certain bones) is responsible for producing red blood cells, white blood cells, and platelets.',
      'Energy Storage: bone tissue can store lipids in adipocytes, serving as an energy reserve.'
    ]}
  ], quiz:[
    {q:'What is the main function of the Root Cap?', c:['To perform photosynthesis','A protective structure at the root tip that helps it penetrate and lubricate its path through soil','To produce flowers','To store sugars for the whole plant'], a:1, e:'The root cap is the protective structure at the tip of the root, helping it penetrate the soil and lubricating its path.'},
    {q:'Which root type is a single primary root that grows deep into the soil with smaller lateral roots?', c:['Fibrous roots','Taproot','Root cap','Rhizome'], a:1, e:'A taproot is a primary root that grows deep into the soil, with smaller lateral roots branching from it.'},
    {q:'Fibrous roots are best described as:', c:['A single deep root with no branches','A network of thin roots spreading out from the base of the stem, aiding anchoring','Roots that grow only above ground','Roots found only in aquatic plants'], a:1, e:'Fibrous roots form a network of thin roots that spread out from the stem\'s base and help anchor the plant.'},
    {q:'Where does rapid cell division occur in a root, which is crucial for growth?', c:['The root cap only','The meristematic region','The xylem','The phloem'], a:1, e:'The meristematic region/tissue is where rapid cell division happens, and it is crucial for plant growth.'},
    {q:'The shoot system of a plant includes which structures?', c:['Only the roots','The stem, leaves, flowers, and fruits','Only the flowers','Only the root hairs'], a:1, e:'The shoot system grows above ground and includes the stem, leaves, flowers, and fruits.'},
    {q:'What substance strengthens xylem cells and keeps them waterproof and resistant to collapsing under pressure?', c:['Cellulose','Lignin','Chlorophyll','Chitin'], a:1, e:'Lignin fibers strengthen xylem cells, keeping mature xylem waterproof and preventing it from collapsing under pressure.'},
    {q:'Which xylem cell type consists of long, wide, hollow tubes that connect continuously from roots to leaves?', c:['Tracheids','Vessel elements','Xylem fibers','Xylem parenchyma'], a:1, e:'Vessel elements are long, wide, hollow tubes connected continuously, stretching from the roots all the way to the leaves.'},
    {q:'Which xylem cell type is described as a conducting cell where water moves through a series of pitted-wall cells, rather than one continuous tube?', c:['Vessel elements','Tracheids','Fiber cells','Parenchyma cells'], a:1, e:'Tracheids are conducting cells; water moves continuously from roots to leaves through a series of tracheid cells connected via pitted walls.'},
    {q:'Which xylem cell type is the ONLY living cell type in the xylem, and helps with food storage?', c:['Tracheids','Vessel elements','Xylem fibers','Xylem parenchyma'], a:3, e:'Xylem parenchyma cells are the only living cells of the xylem and help with food storage.'},
    {q:'What is the process by which phloem transports manufactured sugars/amino acids to other parts of the plant called?', c:['Photosynthesis','Translocation','Transpiration','Fermentation'], a:1, e:'"Translocation" is the term for phloem transporting manufactured substances like sucrose and amino acids from leaves to other plant parts.'},
    {q:'Which phloem cell type has abundant cytoplasm and a nucleus — everything the sieve tube cell lacks?', c:['Sieve tube','Companion cell','Fiber cell','Parenchyma cell'], a:1, e:'The companion cell has abundant cytoplasm and a nucleus, providing everything the neighboring sieve tube cell lacks.'},
    {q:'Which phloem cell type conducts manufactured food from one cell to another through walls perforated by minute pores?', c:['Sieve tube','Companion cell','Fiber cell','Parenchyma cell'], a:0, e:'The sieve tube is a row of elongated, thin-walled cells with pore-perforated walls that conduct manufactured food between cells.'},
    {q:'Which of the following is NOT one of the three forces described that pull water up a tree?', c:['Root Pressure','Cohesion','Transpirational Pull','Active phloem pumping'], a:3, e:'The three forces described are Root Pressure, Cohesion, and Transpirational Pull — active phloem pumping is not one of them.'},
    {q:'Which statement about arteries and veins is CORRECT, per the notes?', c:['Arteries are always oxygenated and veins are always deoxygenated','An artery is not always oxygenated, and a vein is not always deoxygenated','Both always carry deoxygenated blood','Both always carry oxygenated blood'], a:1, e:'A key nuance from the notes: an artery is not always oxygenated, and a vein is not always deoxygenated (as in the pulmonary circuit).'},
    {q:'In the respiratory-circulatory connection, where does oxygen pass from the air into the bloodstream?', c:['The trachea','The alveoli','The esophagus','The stomach'], a:1, e:'Oxygen passes from the alveoli — thin-walled sacs surrounded by capillaries — into the bloodstream.'},
    {q:'What movement pattern moves the "bolus" (ground-up food) down the esophagus?', c:['Osmosis','Peristalsis','Facilitated diffusion','Translocation'], a:1, e:'Peristalsis is the wave-like muscular movement of the esophagus that moves the bolus toward the stomach.'},
    {q:'Which digestive organ produces bile, which is then stored in the gallbladder and used to emulsify fats?', c:['Pancreas','Liver','Stomach','Small intestine'], a:1, e:'Bile is produced by the liver, then stored in the gallbladder, and used as an emulsifier for fats.'},
    {q:'Which part of the small intestine is the MAIN site of nutrient absorption, lined with microvilli?', c:['Duodenum','Jejunum','Ileum','Esophagus'], a:1, e:'The jejunum is the main site of nutrient absorption, lined with microvilli to efficiently absorb digested nutrients.'},
    {q:'Which part of the small intestine handles final absorption/recycling, including Vitamin B12?', c:['Duodenum','Jejunum','Ileum','Stomach'], a:2, e:'The ileum handles final absorption and recycling, including the absorption of Vitamin B12.'},
    {q:'Which function of the musculoskeletal system involves bone marrow producing red blood cells, white blood cells, and platelets?', c:['Support','Movement','Blood Cell Production','Energy Storage'], a:2, e:'Blood Cell Production is the function where bone marrow, found in certain bones, produces red blood cells, white blood cells, and platelets.'},
    {q:'A phloem fiber cell providing structural support is also known by which alternate name?', c:['Tracheid','Bast fiber','Vessel element','Sclerenchyma of the xylem'], a:1, e:'A phloem fiber cell is also called a bast fiber, and it helps give structural support to phloem tissue.'}
  ], glossary:[
    {term:'Taproot / Fibrous roots', def:'a single deep primary root with laterals / a spreading network of thin roots for anchoring.'},
    {term:'Root Cap', def:'protective structure at the root tip; helps penetrate and lubricate its path through soil.'},
    {term:'Tracheid / Vessel element', def:'conducting xylem cells connected via pitted walls / continuous long hollow tubes, root to leaf.'},
    {term:'Xylem parenchyma', def:'the only living cells of the xylem; helps with food storage.'},
    {term:'Sieve tube / Companion cell', def:'thin-walled, pore-perforated food-conducting cell / cell with abundant cytoplasm & nucleus supporting it.'},
    {term:'Translocation', def:'phloem transport of manufactured sucrose/amino acids from leaves to other plant parts.'},
    {term:'Peristalsis', def:'wave-like muscular movement that moves the bolus through the esophagus.'},
    {term:'Duodenum / Jejunum / Ileum', def:'small intestine sections: receives pancreatic enzymes & bile / main nutrient absorption via microvilli / final absorption (e.g. Vit B12).'},
    {term:'Xylem sclerenchyma', def:'a supporting cell type in mature xylem tissue, adding rigidity alongside xylem fibers.'},
    {term:'Bast fiber / Intermediary cell', def:'another name for a supportive phloem fiber cell / a specialized phloem parenchyma cell that loads sugar into sieve tubes.'}
  ], palace:[

    {stop:'Garden Hose Reel', image:'A stiff, waterproofed hose (xylem, strengthened by lignin) runs one-way uphill through a chain of pitted connector joints (tracheids) and one giant continuous pipe (vessel element).', fact:'Lignin waterproofs/strengthens xylem; tracheids connect via pitted walls, vessel elements form continuous tubes.'},

{id:'bionotes', name:'Biology (1st Sem)', lessons:[
{id:'bn1', title:'1. Biomolecules (Carbohydrates, Lipids, Proteins, Nucleic Acids, Enzymes)', content:[
    {h:'Overview', b:[
      'Biomolecules (biological molecules): the essential building blocks of all living organisms; also called macromolecules (organic).',
      '4 Major Types: Carbohydrates, Lipids, Proteins, Nucleic Acids — all are polymers built from monomers EXCEPT lipids.',
      'Dehydration Reaction (Condensation): the process of synthesis/building of macromolecules. Hydrolysis: water is added to a polymer, breaking its covalent bonds.',
      'Malnutrition: deficiencies OR excesses in body intake — both overweight and underweight individuals are classified as malnourished; possible at any age/gender.',
      'Memory aid for elemental composition: CHO, CHO, CHON, CHONP = Carbohydrates, Lipids, Proteins, Nucleic Acids (respectively).'
    ]},
    {h:'Carbohydrates', b:[
      'Primary source of energy; monomer is the monosaccharide; made entirely of Carbon, Hydrogen, Oxygen.',
      'Natural Sugars: found in whole, unprocessed foods (e.g. fructose in apples/oranges, lactose in milk). Refined Sugars: processed and added to foods (e.g. soda, fruit juices, energy drinks).',
      'Monosaccharide: simplest form/simple sugar (CH2O); glucose is used in cellular respiration to make ATP; has a carbonyl group (C=O) and multiple hydroxyl groups (-OH). Types: Glucose, Galactose, Fructose, Ribose, Deoxyribose.',
      'Aldehyde: carbonyl group at the END of a carbon chain. Ketone: carbonyl group in the MIDDLE of a carbon chain.',
      'Sugar sizes: 3-carbon = trioses, 4-carbon = tetroses, 5-carbon = pentoses.',
      'Disaccharide (2 monosaccharides via glycosidic linkage): Sucrose = Glucose + Fructose (table sugar); Maltose = Glucose + Glucose (grains/cereals); Lactose = Glucose + Galactose (dairy).',
      'Polysaccharide: large, complex carbs of long monosaccharide chains; main functions are ENERGY STORAGE and STRUCTURAL SUPPORT. Starch (plants, stored in plastids), Glycogen (animals/fungi, stored in liver/muscle/fat cells), Cellulose (plant cell walls, most abundant organic compound on Earth), Chitin (arthropod exoskeletons, fungal cell walls).'
    ]},
    {h:'Lipids', b:[
      'Composed mostly of hydrogen and carbon (nonpolar C-C/C-H bonds); HYDROPHOBIC, won\'t dissolve in water.',
      'Composed of carbon, hydrogen, and oxygen; key components: glycerol and fatty acids, which combine to form Triglycerides, Phospholipids, and Steroids.',
      'Triglyceride: glycerol backbone + 3 fatty acids, joined by ester bonds via dehydration synthesis. Saturated fatty acids (in fats): all single bonds, many H atoms. Unsaturated fatty acids (in oils): have double/triple bonds.',
      'Phospholipids (cell membrane): glycerol + 2 fatty acids + a phosphate group. Polar Head = phosphate+glycerol (hydrophilic). Non-Polar Tail = 2 fatty acid tails (hydrophobic).',
      'Steroids: composed of FOUR carbon rings. Cholesterol (normal cell membrane component; used by the liver to make bile — excess can crystallize into gallstones), Estrogen/Estradiol (female sex hormone, synthesized from cholesterol), Testosterone (male sex hormone, synthesized from cholesterol).',
      'Soaps/Detergents: lipids with a hydrophilic head and hydrophobic tail (surfactants); Waxes: esters of fatty acids with long-chain monohydric carbons.'
    ]},
    {h:'Lipid-Related Disorders', b:[
      'Type 2 Diabetes: body can\'t produce enough insulin, blood sugar builds up; symptoms include thirst/hunger/urination, weight loss, tiredness, blurred vision, slow-healing sores.',
      'MASLD (formerly nonalcoholic fatty liver disease): fat accumulates in the liver from obesity/high blood sugar/high cholesterol; symptoms include fatigue, abdominal pain, jaundice.',
      'Gout: inflammatory arthritis from urate crystal buildup (often in the big toe); sudden severe joint pain, hot/swollen/red skin.',
      'Phenylketonuria (PKU): inherited disorder increasing phenylalanine levels in blood; treated with a low-phenylalanine diet.'
    ]},
    {h:'Proteins', b:[
      'Sources: meat, seafood, dairy, nuts/seeds, grains; build and repair tissues; produced by ribosomes.',
      'Bonded to 4 groups: Amino group (-NH2), Acidic carboxyl group (-COOH), Hydrogen atom, Variable side chain (R group).',
      'Peptide bond: forms between the carboxyl end of one amino acid and the amino end of the next. Polypeptide: polymer of 3-100 amino acids. Protein: polypeptide LONGER than 100 amino acids, with complex structure/function.',
      'Protein shape matters because it determines (1) interaction with other molecules and (2) their particular function.',
      '4 Levels: Primary (amino acid sequence, stabilized by peptide bonds), Secondary (alpha helix/beta pleated sheets, stabilized by hydrogen bonds), Tertiary (overall 3D shape of a single polypeptide, stabilized by disulfide + hydrogen bonds), Quaternary (2+ polypeptide chains associated, e.g. hemoglobin).'
    ]},
    {h:'Roles of Proteins & Enzymes', b:[
      '8 Roles: Storage (embryo\'s main protein source), Transport (hemoglobin, cell membrane proteins), Hormonal (insulin), Receptor (cell response to stimuli), Enzymatic (digestive enzymes), Contractile/Motor (actin/myosin — muscle contraction), Structural (keratin, collagen), Defensive (antibodies).',
      'Enzymes: proteins that act as CATALYSTS to speed up reactions; NOT permanently changed in the process.',
      'Activation energy: the minimum energy required to start a reaction (enzymes lower this).',
      'Induced Fit: a change in the configuration of an enzyme\'s active site (involves H+ and ionic bonds).',
      'What affects enzymes: (1) Environmental conditions — extreme temperatures can denature them, pH usually 6-8 (near neutral), ionic concentration; (2) Cofactors/Coenzymes — inorganic substances (zinc, iron) and vitamins needed for activity; (3) Enzyme Inhibitors — Competitive (resemble the substrate, compete for the active site) and Noncompetitive (bind elsewhere, altering the active site\'s shape).'
    ]},
    {h:'Nucleic Acids', b:[
      'Two types: DNA (deoxyribonucleic acid) and RNA (ribonucleic acid). DNA contains instructions for producing RNA; RNA contains instructions for producing proteins. Flow: DNA → RNA → Proteins.',
      'Monomer: Nucleotide, made of a 5-carbon sugar (linked via phosphodiester bonds), a nitrogenous base, and a phosphate group.',
      '4 Nitrogenous Bases: Adenine, Thymine, Cytosine, Guanine (DNA); RNA replaces Thymine with Uracil.',
      'DNA contains: Deoxyribose sugar + bases Adenine, Thymine, Cytosine, Guanine.',
      'RNA contains: Ribose sugar + bases Adenine, Guanine, Cytosine, Uracil.',
      '3 Parts of each Nucleotide: Nitrogenous base (carries genetic info), Pentose Sugar (backbone), Phosphate Group (makes it acidic, links nucleotides together).',
      'Why important: most genetic info as nucleic acids is needed for coding traits, growth, reproduction, and cellular processes.'
    ]}
  ], quiz:[
    {q:'Which of the 4 major biomolecule types does NOT form a true polymer?', c:['Carbohydrates','Lipids','Proteins','Nucleic Acids'], a:1, e:'Biomolecules are polymers built from monomers EXCEPT lipids, which do not form true polymers.'},
    {q:'Malnutrition is classified as:', c:['Only being underweight','Only being overweight','Both overweight and underweight, at any age or gender','Only a childhood condition'], a:2, e:'Malnutrition covers both deficiencies and excesses — both overweight and underweight individuals are considered malnourished, at any age or gender.'},
    {q:'Sucrose is formed from which two monosaccharides?', c:['Glucose + Glucose','Glucose + Fructose','Glucose + Galactose','Fructose + Galactose'], a:1, e:'Sucrose (table sugar) is composed of Glucose + Fructose, joined by a glycosidic linkage.'},
    {q:'Maltose is formed from which two monosaccharides, and is found in grains/cereals?', c:['Glucose + Fructose','Glucose + Galactose','Glucose + Glucose','Fructose + Fructose'], a:2, e:'Maltose is Glucose + Glucose, commonly found in grains, cereals, corn, rye, and wheat.'},
    {q:'Which polysaccharide is described as the most abundant organic compound on Earth?', c:['Starch','Glycogen','Cellulose','Chitin'], a:2, e:'Cellulose, a major structural component of plant cell walls, is the most abundant organic compound on Earth.'},
    {q:'In the human body, glycogen is primarily stored in the:', c:['Brain','Liver, muscle, and fat cells','Lungs','Skin'], a:1, e:'Glycogen is found in animals and fungi, stored primarily in the liver, as well as muscle and fat cells.'},
    {q:'Lipids are described as hydrophobic mainly because their bonds are:', c:['Ionic','Nonpolar (carbon-carbon and carbon-hydrogen bonds)','Highly polar','Radioactive'], a:1, e:'Lipids contain large regions of nonpolar carbon-carbon and carbon-hydrogen bonds, making them hydrophobic and unable to dissolve in water.'},
    {q:'A triglyceride is composed of a glycerol backbone joined to fatty acids via which type of bond?', c:['Peptide bond','Ester bond','Glycosidic linkage','Phosphodiester bond'], a:1, e:'A triglyceride is formed by an ester bond between glycerol and 3 fatty acids, via dehydration synthesis.'},
    {q:'In a phospholipid, the "polar head" (phosphate + glycerol) is:', c:['Hydrophobic','Hydrophilic (water-soluble)','Neither hydrophilic nor hydrophobic','Made of fatty acids only'], a:1, e:'The polar head of a phospholipid (phosphate + glycerol) is hydrophilic, meaning it is water-soluble.'},
    {q:'How many carbon rings compose a steroid?', c:['2','3','4','6'], a:2, e:'Steroids are composed of FOUR carbon rings, as seen in cholesterol, estrogen, and testosterone.'},
    {q:'Excess cholesterol used to make bile in the liver can crystallize and form:', c:['Kidney stones','Gallstones','Blood clots','Muscle knots'], a:1, e:'Excess cholesterol in bile can crystallize and form gallstones.'},
    {q:'Which lipid-related disorder is caused by a buildup of urate crystals, often in the big toe?', c:['Type 2 Diabetes','MASLD','Gout','Phenylketonuria'], a:2, e:'Gout is a type of inflammatory arthritis caused by urate crystal buildup, often in the big toe or other lower limbs.'},
    {q:'A polypeptide is defined as a polymer of how many amino acids?', c:['1-2','3-100','101-500','Unlimited, always over 1,000'], a:1, e:'A polypeptide is a polymer of 3-100 amino acids; a protein is a polypeptide LONGER than 100 amino acids with complex structure/function.'},
    {q:'Which level of protein structure is stabilized by disulfide and hydrogen bonds, creating the overall 3D shape of a single polypeptide?', c:['Primary','Secondary','Tertiary','Quaternary'], a:2, e:'Tertiary structure is the overall three-dimensional shape of a single polypeptide, stabilized by disulfide and hydrogen bonds.'},
    {q:'Hemoglobin, formed from 2+ associated polypeptide chains, is an example of which protein structure level?', c:['Primary','Secondary','Tertiary','Quaternary'], a:3, e:'Quaternary structure involves 2 or more polypeptide chains associating, as seen in hemoglobin.'},
    {q:'Actin and myosin, responsible for muscle contraction, exemplify which role of proteins?', c:['Storage','Hormonal','Contractile and motor proteins','Defensive proteins'], a:2, e:'Actin and myosin are contractile/motor proteins, responsible for the contraction of muscles.'},
    {q:'What is the minimum amount of energy required to start a chemical reaction called?', c:['Kinetic energy','Activation energy','Potential energy','Thermal energy'], a:1, e:'Activation energy is the minimum amount of energy required to start a reaction; enzymes work by lowering this requirement.'},
    {q:'Which type of enzyme inhibitor resembles the normal substrate and competes for the active site?', c:['Noncompetitive inhibitor','Competitive inhibitor','Cofactor','Coenzyme'], a:1, e:'Competitive inhibitors resemble an enzyme\'s normal substrate and compete with it for the active site.'},
    {q:'Which type of enzyme inhibitor binds to a different part of the enzyme, altering the active site\'s shape indirectly?', c:['Competitive inhibitor','Noncompetitive inhibitor','Cofactor','Substrate'], a:1, e:'Noncompetitive inhibitors bind to a part of the enzyme OTHER than the active site, changing the enzyme\'s shape and altering the active site.'},
    {q:'Which nitrogenous base is found in RNA but NOT in DNA?', c:['Adenine','Guanine','Cytosine','Uracil'], a:3, e:'RNA uses Uracil in place of Thymine, which is found only in DNA.'},
    {q:'The flow of genetic information, as described in the notes, follows which order?', c:['Protein → RNA → DNA','DNA → RNA → Protein','RNA → DNA → Protein','Protein → DNA → RNA'], a:1, e:'DNA contains the instructions for producing RNA, and RNA contains the instructions for producing proteins: DNA → RNA → Proteins.'},
    {q:'Which of the 3 parts of a nucleotide carries genetic information?', c:['Pentose Sugar','Phosphate Group','Nitrogenous Base','None of these'], a:2, e:'The Nitrogenous Base is the nitrogen-containing molecule that carries genetic information within a nucleotide.'},
    {q:'A long molecule made of many repeated smaller building-block units is called a:', c:['Monomer','Polymer','Nucleotide','Enzyme'], a:1, e:'A polymer is a long molecule built from many repeated smaller units, called monomers.'},
    {q:'The covalent bond that joins two monosaccharides together to form a disaccharide is called a:', c:['Peptide bond','Glycosidic linkage','Phosphodiester bond','Ester bond'], a:1, e:'A glycosidic linkage is the bond that joins monosaccharides together via dehydration synthesis, forming disaccharides or polysaccharides.'},
    {q:'The covalent bond joining the carboxyl end of one amino acid to the amino end of the next is called a:', c:['Glycosidic linkage','Ester bond','Peptide bond','Phosphodiester bond'], a:2, e:'A peptide bond joins amino acids together into chains (polypeptides), forming between the carboxyl end of one amino acid and the amino end of the next.'}
  ], glossary:[
    {term:'Dehydration Reaction (Condensation)', def:'the process of synthesis/building of macromolecules.'},
    {term:'Hydrolysis', def:'water molecules added to a polymer, breaking covalent bonds.'},
    {term:'CHO, CHO, CHON, CHONP', def:'elemental memory aid for Carbohydrates, Lipids, Proteins, Nucleic Acids respectively.'},
    {term:'Monosaccharide types', def:'Glucose, Galactose, Fructose, Ribose, Deoxyribose.'},
    {term:'Disaccharides', def:'Sucrose (Glu+Fru), Maltose (Glu+Glu), Lactose (Glu+Gal).'},
    {term:'Polysaccharides', def:'Starch (plants), Glycogen (animals/fungi), Cellulose (plant cell walls), Chitin (arthropod exoskeletons/fungal walls).'},
    {term:'Triglyceride', def:'glycerol + 3 fatty acids via ester bonds.'},
    {term:'Phospholipid', def:'glycerol + 2 fatty acids + phosphate group; polar head (hydrophilic), nonpolar tail (hydrophobic).'},
    {term:'Steroid', def:'4 carbon rings; cholesterol, estrogen, testosterone.'},
    {term:'4 Levels of Protein Structure', def:'Primary (sequence), Secondary (helix/sheet), Tertiary (3D shape), Quaternary (multiple polypeptides).'},
    {term:'Enzyme', def:'a protein catalyst that speeds up reactions without being permanently changed.'},
    {term:'Induced Fit', def:'a change in the configuration of an enzyme\'s active site.'},
    {term:'Competitive / Noncompetitive Inhibitor', def:'competes for the active site / binds elsewhere, altering the active site shape.'},
    {term:'Nucleotide', def:'monomer of nucleic acids: nitrogenous base + pentose sugar + phosphate group.'},
    {term:'Polymer / Monomer', def:'a long molecule of repeated similar units (polymer) built from its smaller single building-block units (monomers).'},
    {term:'Glycosidic Linkage', def:'the covalent bond joining two monosaccharides together (forms disaccharides/polysaccharides) via dehydration synthesis.'},
    {term:'Peptide Bond', def:'the covalent bond joining the carboxyl end of one amino acid to the amino end of the next.'}
  ], palace:[

{id:'bn2', title:'2. Cells: Theory, Prokaryotic & Eukaryotic Structure', content:[
    {h:'The Cell Theory: Historical Development', b:[
      '1590 — Hans Jansen, Zacharias Jansen, and Hans Lippershey: 3 Dutch spectacle makers credited with creating the compound microscope.',
      '1665 — Robert Hooke: introduced the term "cell." 1673 — Antoine van Leeuwenhoek: observed "very little animacules" (microorganisms).',
      '1838 — Theodor Schwann and Matthias Schleiden: proposed the classical cell theory — all organisms are made of cells; cells are the basic unit of life.',
      '1858 — Rudolf Virchow: cells come from pre-existing cells that have multiplied.',
      'Modern Cell Theory adds: DNA is passed between cells during cell division; cells of all organisms within a similar species are mostly the same.'
    ]},
    {h:'Shared Features & Prokaryotic Cells', b:[
      'A cell is greater than the sum of its parts. ALL cells share: Cell membrane, Cytoplasm, DNA, Ribosomes.',
      'Prokaryotes: lack a true nucleus and other membrane-enclosed organelles; DNA concentrated in an unenclosed region called the nucleoid; simpler internal structure (Bacteria and Archaea).',
      'Parts of a prokaryotic cell: Fimbriae (attachment structures, not visible on TEM), Nucleoid (region with DNA, not membrane-enclosed), Ribosomes (protein synthesis), Plasma membrane (encloses cytoplasm), Cell wall (rigid structure outside the plasma membrane), Glycocalyx (outer coating/capsule/slime layer), Flagella (locomotion organelles).',
      'Cell size and plasma membrane shape affect surface area and volume; microvilli can increase a cell\'s surface area.'
    ]},
    {h:'Eukaryotic Cells: Cell Wall, Membrane, Cytoplasm, Nucleus', b:[
      'Eukaryotes: possess a TRUE nucleus; more complex organisms (animal and plant cells).',
      'Cell wall: found in plant cells (not animal); also in prokaryotes, fungi, some unicellular eukaryotes. Protects the cell, maintains shape, prevents excessive water uptake. Composition: cellulose (plants), chitin (fungi).',
      'Cell/plasma membrane: found in plant AND animal cells; exhibits SELECTIVE PERMEABILITY. Composition: phospholipid bilayer (hydrophilic + hydrophobic regions), described as a "fluid mosaic" of lipids and proteins.',
      'Cytoplasm: everything inside the cell except the nucleus; composed of cytosol (gel-like fluid); contains organelles with specialized functions.',
      'Nucleus: contains most of the cell\'s DNA (some genes are in mitochondria/chloroplasts). Nuclear envelope encloses it, perforated by pores; Pore complex regulates entry/exit of proteins, RNAs, macromolecule complexes. Nuclear lamina: protein filaments maintaining nuclear shape (called intermediate filaments in animal cells). Nuclear matrix: protein fibers throughout the nuclear interior.',
      'Chromosomes: one long DNA molecule + many proteins. Chromatin: diffuse mass appearance when the cell isn\'t dividing. Nucleolus: mass of densely stained granules/fibers where ribosomal RNA is synthesized.'
    ]},
    {h:'Ribosomes & The Endomembrane System', b:[
      'Ribosomes: found in plant and animal cells; site of protein synthesis; NOT membrane-bound (not considered true organelles). Free ribosomes (suspended in cytosol, make cytosol-functioning proteins) vs. Bound ribosomes (attached to ER/nuclear envelope, make proteins for membrane insertion).',
      'Endomembrane system: regulates protein traffic, performs metabolic functions. Includes: Plasma membrane, ER, Golgi apparatus, Lysosome, Vesicles & vacuoles.',
      'Endoplasmic Reticulum (ER): "endoplasmic" = within cytoplasm, "reticulum" = Latin "little net"; continuous with the nuclear envelope. Cisternae = network of membranous tubules; ER lumen = cisternal space.',
      'Smooth ER (SER): lacks ribosomes; synthesizes lipids, metabolizes carbohydrates, detoxifies drugs/poisons, stores calcium ions.',
      'Rough ER (RER): studded with ribosomes; makes secretory proteins (many are glycoproteins); the "membrane factory" of the cell; secretory proteins leave via transport vesicles.',
      'Golgi Apparatus: found in both plant/animal cells; where ER products are modified, stored, then sent onward. Structure: cisternae (flattened membranous sacs). Cis face (receiving side) and Trans face (opposite/dispatching side).',
      'Lysosomes: found in animal cells, less prominent in plant cells; contain hydrolytic enzymes that digest (hydrolyze) macromolecules.',
      'Vacuoles: large vesicles derived from the ER and Golgi. Food vacuoles (for phagocytosis); Contractile vacuoles (pump out excess water, can hold poison/pigments in plants); Central vacuole (plant cells only, holds cell sap, main repository of ions like potassium/chloride).'
    ]},
    {h:'Mitochondria, Chloroplast, Peroxisome, Cytoskeleton', b:[
      'Mitochondria & Chloroplast: convert energy into forms cells can use for work (Endosymbiotic Theory explains their origin).',
      'Mitochondria: found in plant AND animal cells; converts glucose to ATP; number correlates with a cell\'s metabolic activity level. Parts: Outer membrane (protective barrier), Inner membrane (ETC proteins), Intermembrane space, Cristae (folded surfaces, increase surface area), Matrix (enzymes, mitochondrial DNA, ribosomes).',
      'Chloroplast: found ONLY in plant cells; contains chlorophyll; site of photosynthesis; a specialized plastid. Other plastids: Amyloplast (colorless, stores starch), Chromoplast (gives fruits/flowers orange/yellow hues). Parts: Outer/inner membrane, Intermembrane space, Thylakoid (interconnected sacs, stacked into grana), Lumen (space inside thylakoid), Stroma (chloroplast DNA + free ribosomes + enzymes).',
      'Peroxisome: found in plant and animal cells; cooperates with chloroplast/mitochondria; removes hydrogen atoms from substrates, transfers them to O2, producing hydrogen peroxide (H2O2) as a byproduct.',
      'Cytoskeleton: found in plant and animal cells; extends throughout the cell, gives mechanical support/shape. Components: Microtubules (thickest, hollow tubes), Microfilaments (thinnest, solid fibers), Intermediate filaments — all attach to each other and to glycoproteins in the plasma membrane.'
    ]},
    {h:'Centrosomes, Cilia & Flagella', b:[
      'Centrosomes/Centrioles: found in animal cells (plant cells have centrosome-like MTOCs but usually lack centrioles); used for microtubule assembly.',
      'Cilia & Flagella: special microtubule arrangements, present in animal cells but NOT plant cells.',
      'Cilia: for locomotion, usually occur in large numbers on the cell surface.',
      'Flagella: for locomotion, usually just one or a few per cell, and LONGER than cilia.'
    ]}
  ], quiz:[
    {q:'Who is credited with introducing the term "cell" in 1665?', c:['Theodor Schwann','Robert Hooke','Antoine van Leeuwenhoek','Rudolf Virchow'], a:1, e:'Robert Hooke introduced the term "cell" in 1665.'},
    {q:'Who proposed that cells come from pre-existing cells that have multiplied?', c:['Robert Hooke','Theodor Schwann','Matthias Schleiden','Rudolf Virchow (1858)'], a:3, e:'Rudolf Virchow (1858) proposed that cells come from pre-existing cells that have multiplied.'},
    {q:'Which two scientists proposed the classical cell theory in 1838, stating all organisms are made of cells?', c:['Hooke and Leeuwenhoek','Schwann and Schleiden','Virchow and Hooke','Jansen and Lippershey'], a:1, e:'Theodor Schwann and Matthias Schleiden proposed the classical cell theory in 1838.'},
    {q:'Which feature is shared by ALL cells (prokaryotic and eukaryotic)?', c:['A true nucleus','Cell membrane, cytoplasm, DNA, ribosomes','Chloroplasts','A cell wall made of cellulose'], a:1, e:'All cells share a cell membrane, cytoplasm, DNA, and ribosomes, regardless of being prokaryotic or eukaryotic.'},
    {q:'In prokaryotic cells, DNA is concentrated in an unenclosed region called the:', c:['Nucleus','Nucleoid','Nucleolus','Chromatin'], a:1, e:'In prokaryotes, DNA is concentrated in the nucleoid, a region NOT enclosed by a membrane (unlike the true nucleus in eukaryotes).'},
    {q:'Which structure in prokaryotic cells serves as an attachment structure, not visible on TEM?', c:['Flagella','Fimbriae','Glycocalyx','Nucleoid'], a:1, e:'Fimbriae are attachment structures on the surface of some prokaryotes, not visible via TEM.'},
    {q:'A plant cell wall is primarily composed of:', c:['Chitin','Cellulose','Peptidoglycan','Keratin'], a:1, e:'Plant cell walls are composed of cellulose, while fungal cell walls are composed of chitin.'},
    {q:'The cell/plasma membrane is described as exhibiting "selective permeability," meaning:', c:['It blocks everything equally','It allows some substances to cross more easily than others','It allows nothing to pass','It is identical to the cell wall'], a:1, e:'Selective permeability means the membrane allows some substances to cross more easily than others.'},
    {q:'Which structure regulates the entry and exit of proteins, RNAs, and macromolecule complexes through the nuclear envelope?', c:['Nuclear lamina','Pore complex','Nuclear matrix','Nucleolus'], a:1, e:'The pore complex lines each nuclear pore and regulates the passage of proteins, RNAs, and macromolecule complexes.'},
    {q:'Ribosomal RNA is synthesized in which structure?', c:['The nuclear lamina','The nucleolus','The Golgi apparatus','The lysosome'], a:1, e:'The nucleolus is the mass of densely stained granules/fibers where ribosomal RNA is synthesized.'},
    {q:'Why are ribosomes NOT considered true organelles?', c:['They are too small to matter','They are not membrane-bound','They contain no RNA','They are only found in plants'], a:1, e:'Ribosomes are not membrane-bound, which is why they are not classified as true organelles despite their essential function.'},
    {q:'Which type of Endoplasmic Reticulum is studded with ribosomes and makes secretory proteins?', c:['Smooth ER (SER)','Rough ER (RER)','Golgi ER','Nuclear ER'], a:1, e:'Rough ER (RER) is studded with ribosomes and is known as the "membrane factory" for making secretory proteins.'},
    {q:'Which type of Endoplasmic Reticulum synthesizes lipids and detoxifies drugs/poisons?', c:['Rough ER (RER)','Smooth ER (SER)','Golgi ER','Ribosomal ER'], a:1, e:'Smooth ER (SER) lacks ribosomes and is responsible for lipid synthesis, carbohydrate metabolism, and detoxification.'},
    {q:'The Golgi apparatus\'s "cis face" is best described as:', c:['The side that dispatches finished products','The receiving side, where ER products first arrive','A type of vacuole','A type of ribosome'], a:1, e:'The cis face of the Golgi apparatus is the receiving side, on the same side as incoming ER products; the trans face dispatches them.'},
    {q:'Lysosomes contain which type of enzymes, used to digest macromolecules?', c:['Hydrolytic enzymes','Digestive enzymes only in plants','Photosynthetic enzymes','Enzymes exclusive to mitochondria'], a:0, e:'Lysosomes contain hydrolytic enzymes that digest (hydrolyze) macromolecules.'},
    {q:'Which type of vacuole is specific to plant cells, holding cell sap and acting as the main repository for ions like potassium and chloride?', c:['Food vacuole','Contractile vacuole','Central vacuole','Golgi vacuole'], a:2, e:'The central vacuole, found in plant cells, contains cell sap and serves as the main repository of inorganic ions.'},
    {q:'Which organelle converts glucose to ATP, with its number correlating to a cell\'s metabolic activity level?', c:['Chloroplast','Mitochondria','Peroxisome','Golgi apparatus'], a:1, e:'Mitochondria convert glucose to ATP, and cells with higher metabolic activity tend to have more mitochondria.'},
    {q:'Which folded structure inside the mitochondria increases its surface area?', c:['Cristae','Stroma','Thylakoid','Cisternae'], a:0, e:'Cristae are the highly folded inner membrane surfaces of the mitochondria, increasing surface area for the electron transport chain.'},
    {q:'Which plastid is colorless and stores starch (amylose)?', c:['Chloroplast','Chromoplast','Amyloplast','Leucoplast (general, unnamed)'], a:2, e:'The Amyloplast is a colorless plastid that stores starch (amylose).'},
    {q:'Which plastid gives fruits and flowers their orange and yellow hues?', c:['Amyloplast','Chromoplast','Chloroplast','Mitochondria'], a:1, e:'The Chromoplast is responsible for giving fruits and flowers their orange and yellow colors.'},
    {q:'Peroxisomes produce which byproduct when transferring hydrogen atoms to oxygen?', c:['Carbon dioxide','Hydrogen peroxide (H2O2)','Glucose','ATP'], a:1, e:'Peroxisomes remove hydrogen atoms from substrates and transfer them to O2, producing hydrogen peroxide (H2O2) as a byproduct.'},
    {q:'Which cytoskeleton component is described as the THICKEST, consisting of tiny hollow tubes?', c:['Microfilaments','Microtubules','Intermediate filaments','Cristae'], a:1, e:'Microtubules are the thickest cytoskeletal components, consisting of tiny hollow tubes.'},
    {q:'Which cytoskeleton component is described as the THINNEST, consisting of thin solid fibers?', c:['Microtubules','Intermediate filaments','Microfilaments','Cisternae'], a:2, e:'Microfilaments are the thinnest cytoskeletal components, made of thin solid fibers.'},
    {q:'Centrioles, used for microtubule assembly, are typically found in which type of cell?', c:['Plant cells only','Animal cells (plants usually lack centrioles)','Neither plant nor animal cells','Bacteria only'], a:1, e:'Centrioles are found in animal cells; plant cells have centrosome-like MTOCs but usually lack centrioles.'},
    {q:'Which structure for locomotion is LONGER and typically limited to just one or a few per cell, compared to the other?', c:['Cilia','Flagella','Microvilli','Fimbriae'], a:1, e:'Flagella are longer than cilia and are usually limited to just one or a few per cell, while cilia occur in large numbers.'},
    {q:'Which group of prokaryotes is known for living in extreme environments?', c:['Eubacteria','Archaebacteria','Eukaryotes','Protozoa'], a:1, e:'Archaebacteria are prokaryotes known for living in extreme environments, as opposed to Eubacteria which live under normal conditions.'},
    {q:'Fimbriae, which help a cell stick to surfaces and host cells, are made of small protein subunits called:', c:['Pilin','Keratin','Cristae','Chlorophyll'], a:0, e:'Fimbriae are bristle-like protein structures made of small protein subunits called pilin.'}
  ], glossary:[
    {term:'Cell Theory (key figures)', def:'Hooke (named "cell"), Leeuwenhoek (animacules), Schwann & Schleiden (cells = basic unit), Virchow (cells from pre-existing cells).'},
    {term:'Nucleoid', def:'unenclosed region in prokaryotes where DNA is concentrated.'},
    {term:'Archaebacteria / Eubacteria', def:'the two prokaryote groups — Archaebacteria live in extreme environments; Eubacteria live under normal conditions (both unicellular).'},
    {term:'Pilin', def:'the small protein subunit that makes up fimbriae, the bristle-like structures helping cells stick to surfaces/host cells.'},
    {term:'Selective permeability', def:'the membrane allows some substances to cross more easily than others.'},
    {term:'Free vs. Bound Ribosomes', def:'Free — suspended in cytosol; Bound — attached to ER/nuclear envelope.'},
    {term:'Smooth ER / Rough ER', def:'Smooth: lipid synthesis, detoxification; Rough: studded with ribosomes, makes secretory proteins.'},
    {term:'Cis face / Trans face', def:'Golgi apparatus receiving side / dispatching side.'},
    {term:'Cristae', def:'folded inner mitochondrial membrane, increases surface area.'},
    {term:'Amyloplast / Chromoplast', def:'colorless starch-storing plastid / plastid giving fruits/flowers color.'},
    {term:'Cilia vs. Flagella', def:'Cilia: many, short, for locomotion. Flagella: few (1-2), longer, for locomotion.'}
  ], palace:[
