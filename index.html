{id:'bn3', title:'3. Microscopy', content:[
    {h:'Types of Microscopes', b:[
      'Compound Light Microscope: has ocular lenses (binocular eyepiece) and objective lenses; max total magnification 1000x; BOTH objective and ocular lenses provide magnification.',
      'Stereoscope (Dissecting Microscope): capable of performing dissection; has bigger working space; specimen must be immobilized but can be the ACTUAL specimen; max total magnification 100x.',
      'Electron Microscope: uses a beam of electrons to magnify; high image resolution (magnifies in nanometers); specimens used must be preserved/dead.',
      'Transmission Electron Microscope (TEM): detects electrons that PASSED THROUGH the sample; gives a 2D image.',
      'Scanning Electron Microscope (SEM): detects REFLECTED electrons; gives more detailed images; gives a 3D image.',
      'Atomic Force Microscope: uses a stylus to detect the sample surface; sees the ACTUAL MOVEMENT of the specimen; can use both live AND preserved specimens.',
      'Confocal Microscope: produces an image of a thin plane on a thick specimen; couples a laser source to a fluorescent microscope; widely used in microbial ecology.'
    ]},
    {h:'Parts of a Compound Microscope: Mechanical Parts', b:[
      'Mechanical parts provide support and protection to the microscope.',
      'Base: supports the entire microscope.',
      'Arm: the vertical framework ascending from the base along the back of the microscope.',
      'Revolving nosepiece: holds the objectives in place, allows changing of objectives.',
      'Stage and stage clip: where the glass slide with the specimen is placed.',
      'Coarse adjustment knob: moves the objective closer so magnification can be achieved. Fine adjustment knob: moves the objective closer to the stage so BETTER RESOLUTION can be achieved.'
    ]},
    {h:'Magnifying & Illuminating Parts', b:[
      'Magnifying parts enlarge the produced image. Objective (lens): magnifies the specimen. Ocular/eyepiece: where the specimen is viewed; provides a SMALL amount of magnification (5x-10x).',
      'Illuminating parts transmit light. Iris diaphragm/mirror: adjusts the amount of light passing through the specimen. Light source: provides the light passing through the specimen.'
    ]},
    {h:'Care, Storage & Wet Mount Preparation', b:[
      'Caring for a microscope: hold with both hands (one on the arm, one on the base); clean in a circular motion; use only microscope-intended immersion oil; wipe off oil after using the objective.',
      'Storing a microscope: cover with a dust bag before storing; store in a cool, dry place.',
      'Making a Wet Mount: (1) Collect sample, (2) Add to slide, (3) Place cover slip on sample.'
    ]}
  ], quiz:[
    {q:'What is the maximum total magnification of a Compound Light Microscope?', c:['100x','1000x','10,000x','No limit'], a:1, e:'A Compound Light Microscope has a maximum total magnification of 1000x, achieved through both objective and ocular lenses.'},
    {q:'What is the maximum total magnification of a Stereoscope (dissecting microscope)?', c:['100x','1000x','10x','No limit'], a:0, e:'A Stereoscope has a maximum total magnification of 100x, but allows for dissection with a bigger working space.'},
    {q:'Which type of microscope can use the ACTUAL specimen for dissection?', c:['Compound Light Microscope','Stereoscope','Electron Microscope','Confocal Microscope'], a:1, e:'The Stereoscope allows the actual specimen (immobilized) to be used and dissected under it.'},
    {q:'Specimens used in an Electron Microscope must be:', c:['Alive and moving','Preserved/dead','Transparent only','Colored with dye'], a:1, e:'Electron microscopes require preserved/dead specimens, unlike light microscopes which can observe living samples.'},
    {q:'Which electron microscope detects electrons that PASS THROUGH the sample, giving a 2D image?', c:['SEM','TEM','Atomic Force Microscope','Confocal Microscope'], a:1, e:'The Transmission Electron Microscope (TEM) detects electrons passing through the sample, producing a 2D image.'},
    {q:'Which electron microscope detects REFLECTED electrons, giving a more detailed 3D image?', c:['TEM','SEM','Confocal Microscope','Stereoscope'], a:1, e:'The Scanning Electron Microscope (SEM) detects reflected electrons, giving a detailed 3D image of the surface.'},
    {q:'Which type of microscope uses a stylus to detect the sample surface and can see the ACTUAL MOVEMENT of a specimen?', c:['Confocal Microscope','Atomic Force Microscope','Compound Light Microscope','TEM'], a:1, e:'The Atomic Force Microscope uses a stylus and can observe the actual movement of a specimen, using either live or preserved samples.'},
    {q:'Which type of microscope couples a laser source to a fluorescent microscope, widely used in microbial ecology?', c:['Confocal Microscope','Stereoscope','TEM','Atomic Force Microscope'], a:0, e:'The Confocal Microscope couples a laser source with fluorescence and is widely used in microbial ecology to image thin planes of thick specimens.'},
    {q:'Which mechanical part of a compound microscope holds the objectives in place and allows for changing them?', c:['Base','Arm','Revolving nosepiece','Stage'], a:2, e:'The revolving nosepiece holds the objective lenses and allows the user to switch between them.'},
    {q:'Which adjustment knob moves the objective closer to achieve BETTER RESOLUTION, rather than just magnification?', c:['Coarse adjustment knob','Fine adjustment knob','Iris diaphragm','Ocular lens'], a:1, e:'The fine adjustment knob moves the objective closer to the stage to achieve better resolution, as opposed to the coarse knob which is used for basic magnification/focus.'},
    {q:'How much magnification does the ocular/eyepiece typically provide?', c:['1x-2x','5x-10x','100x-500x','1000x+'], a:1, e:'The ocular/eyepiece typically provides a small amount of magnification, around 5x to 10x.'},
    {q:'Which illuminating part allows the user to adjust the amount of light passing through the specimen?', c:['Light source','Iris diaphragm/mirror','Objective lens','Revolving nosepiece'], a:1, e:'The iris diaphragm/mirror is used to adjust the amount of light that passes through the specimen.'},
    {q:'When caring for a microscope, how should it be held?', c:['With one hand only, on the base','With both hands, one on the arm and one on the base','By the ocular lens only','By the stage clip only'], a:1, e:'Proper microscope handling requires both hands — one supporting the arm and one supporting the base.'},
    {q:'How should a microscope be stored when not in use?', c:['Uncovered, in direct sunlight','Covered with a dust bag, in a cool dry place','Submerged in immersion oil','Left on the stage with a slide in place'], a:1, e:'A microscope should be covered with a dust bag and stored in a cool, dry place to protect it from damage.'},
    {q:'What is the correct order of steps for making a wet mount?', c:['Place cover slip → Collect sample → Add to slide','Collect sample → Add to slide → Place cover slip on sample','Add to slide → Collect sample → Place cover slip','Place cover slip → Add to slide → Collect sample'], a:1, e:'The correct order for a wet mount is: Collect sample, Add to slide, then Place cover slip on sample.'},
    {q:'Which objective lens provides 40x magnification?', c:['Scanner','LPO (Low Power)','HPO (High Power)','OIO (Oil Immersion)'], a:2, e:'The HPO (High Power Objective) provides 40x magnification, between LPO (10x) and OIO (100x).'},
    {q:'If the ocular lens is 10x and you switch to the HPO objective (40x), what is the total magnification?', c:['50x','400x','4x','4000x'], a:1, e:'Total magnification = ocular lens power × objective lens power = 10x × 40x = 400x.'}
  ], glossary:[
    {term:'Compound Light Microscope', def:'ocular + objective lenses; max 1000x magnification.'},
    {term:'Stereoscope (Dissecting Microscope)', def:'for dissection; can use the actual specimen; max 100x.'},
    {term:'TEM', def:'Transmission Electron Microscope — detects electrons passing through the sample; 2D image.'},
    {term:'SEM', def:'Scanning Electron Microscope — detects reflected electrons; 3D image.'},
    {term:'Atomic Force Microscope', def:'uses a stylus; sees actual specimen movement; live or preserved.'},
    {term:'Confocal Microscope', def:'laser + fluorescent microscope; images thin planes of thick specimens.'},
    {term:'Coarse vs. Fine adjustment knob', def:'Coarse — for magnification/focus; Fine — for better resolution.'},
    {term:'Objective Lens Magnifications', def:'Scanner = 4x, LPO (Low Power) = 10x, HPO (High Power) = 40x, OIO (Oil Immersion) = 100x.'},
    {term:'Total Magnification Formula', def:'Ocular lens power × Objective lens power (e.g. 10x ocular × 40x HPO = 400x total).'}
  ], palace:[
    {stop:'Study Desk', image:'A microscope sits with a sticky note reading "1000x MAX" taped to the eyepiece, right next to a bulkier dissecting scope labeled "100x MAX — but you can cut things."', fact:'Compound Light Microscope: max 1000x. Stereoscope: max 100x, allows dissection.'},
    {stop:'Lab Cabinet', image:'Two glowing electron guns sit side by side — one shoots straight THROUGH a thin dead bug (flat 2D shadow appears on the wall), the other bounces OFF a dead bug\'s surface (a glowing 3D shape appears).', fact:'TEM: electrons pass through, 2D image. SEM: electrons reflect off, 3D image.'},
    {stop:'Windowsill', image:'A tiny robotic finger (stylus) pokes gently at a live, wriggling specimen, tracing every bump without hurting it.', fact:'Atomic Force Microscope: uses a stylus, can observe live specimen movement.'},
    {stop:'Supply Drawer', image:'Two knobs sit on a control panel — a big chunky one that yanks the lens closer FAST, and a tiny delicate one that nudges it a hair\'s width for a crisper picture.', fact:'Coarse adjustment = magnification/focus. Fine adjustment = better resolution.'}
  ]},
{
  id: 'bn4',
  title: '4. The Cell Cycle',
  content: [
    {h:'Overview of the Cell Cycle', b:[
      'The cell cycle is the ordered series of events a cell goes through as it grows and divides into two daughter cells.',
      'It has two main phases: Interphase (the cell grows and copies its DNA) and the Mitotic (M) Phase (the cell divides its nucleus and cytoplasm).',
      'Interphase makes up about 90% of the cell cycle\'s total time — most of a cell\'s "life" is actually spent NOT dividing.'
    ]},
    {h:'Interphase: G1, S, G2', b:[
      'G1 (Gap 1): the cell grows in size, makes new proteins and organelles, and carries out its normal functions.',
      'S (Synthesis): the cell replicates (copies) its entire DNA, so each chromosome now consists of two identical sister chromatids joined at the centromere.',
      'G2 (Gap 2): the cell continues to grow and makes final preparations (proteins/organelles needed for division) before entering mitosis.',
      'G0 (Gap 0): a resting phase some cells enter where they exit the cycle and stop dividing (e.g. most mature neurons and muscle cells stay in G0 permanently).'
    ]},
    {h:'Mitosis (M Phase): Prophase to Telophase', b:[
      'Prophase: chromatin condenses into visible chromosomes (each with 2 sister chromatids); the nuclear envelope starts to break down; spindle fibers begin to form.',
      'Metaphase: chromosomes line up along the metaphase plate (the cell\'s equator), attached to spindle fibers from opposite poles.',
      'Anaphase: sister chromatids are pulled apart toward opposite poles of the cell — each chromatid is now considered its own full chromosome.',
      'Telophase: two new nuclear envelopes form around each set of chromosomes; chromosomes decondense back into chromatin; the spindle breaks down.',
      'Mnemonic: "PMAT" — Prophase, Metaphase, Anaphase, Telophase, in that order.'
    ]},
    {h:'Cytokinesis', b:[
      'Cytokinesis is the division of the cytoplasm, producing two separate daughter cells; it usually overlaps with telophase.',
      'In animal cells: a cleavage furrow pinches the cell membrane inward until it splits into two cells.',
      'In plant cells: a cell plate forms in the middle of the cell (since the rigid cell wall can\'t pinch inward) and develops into a new cell wall separating the two cells.'
    ]},
    {h:'Cell Cycle Checkpoints and Cancer', b:[
      'Checkpoints are control points where the cell "checks" if conditions are right to continue to the next phase — they prevent cells with damaged DNA from dividing.',
      'G1 Checkpoint (Restriction Point): checks cell size, nutrients, and DNA integrity before committing to DNA replication (S phase).',
      'G2 Checkpoint: checks that DNA replication was completed correctly and without damage before entering mitosis.',
      'M (Spindle) Checkpoint: checks that all chromosomes are properly attached to spindle fibers before allowing anaphase to proceed.',
      'Cancer occurs when checkpoint controls fail and cells divide uncontrollably despite DNA damage or other problems — this is why cell cycle regulation is critical to health.'
    ]}
  ],
  quiz: [
    {q:'What are the two main phases of the cell cycle?', c:['Mitosis and Meiosis','Interphase and the Mitotic (M) Phase','G1 and G2','Prophase and Telophase'], a:1, e:'The cell cycle consists of Interphase (growth and DNA replication) and the Mitotic (M) Phase (division of nucleus and cytoplasm).'},
    {q:'Approximately what percentage of the cell cycle is spent in Interphase?', c:['10%','50%','90%','100%'], a:2, e:'Interphase makes up about 90% of the total cell cycle — most of a cell\'s time is spent growing, not dividing.'},
    {q:'During which phase of Interphase does the cell replicate its DNA?', c:['G1','S (Synthesis)','G2','G0'], a:1, e:'DNA replication occurs during the S (Synthesis) phase of interphase.'},
    {q:'After S phase, each chromosome consists of:', c:['A single strand of unreplicated DNA','Two identical sister chromatids joined at the centromere','Four chromatids','No DNA at all'], a:1, e:'After replication in S phase, each chromosome has two identical sister chromatids joined at a centromere.'},
    {q:'Which phase involves the cell growing and making final preparations before mitosis?', c:['G1','S','G2','Cytokinesis'], a:2, e:'G2 (Gap 2) is when the cell makes final preparations — proteins and organelles needed for division — before entering mitosis.'},
    {q:'A mature neuron that has permanently stopped dividing is said to be in:', c:['S phase','G0 phase','Anaphase','Cytokinesis'], a:1, e:'G0 is a resting phase where certain cells (like most mature neurons) exit the cell cycle and stop dividing.'},
    {q:'What is the correct order of the phases of mitosis?', c:['Metaphase, Prophase, Anaphase, Telophase','Prophase, Metaphase, Anaphase, Telophase','Prophase, Anaphase, Metaphase, Telophase','Telophase, Anaphase, Metaphase, Prophase'], a:1, e:'The order is Prophase, Metaphase, Anaphase, Telophase — remembered with the mnemonic "PMAT."'},
    {q:'During which phase of mitosis does the nuclear envelope begin to break down?', c:['Metaphase','Anaphase','Prophase','Telophase'], a:2, e:'During Prophase, chromatin condenses into chromosomes and the nuclear envelope starts breaking down.'},
    {q:'During which phase do chromosomes line up along the metaphase plate?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:1, e:'In Metaphase, chromosomes align along the metaphase plate (the cell\'s equator).'},
    {q:'During which phase are sister chromatids pulled apart toward opposite poles?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:2, e:'In Anaphase, sister chromatids are separated and pulled to opposite poles — each is now its own chromosome.'},
    {q:'During which phase do two new nuclear envelopes re-form around the separated chromosomes?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:3, e:'In Telophase, new nuclear envelopes form around each set of chromosomes, which then decondense back into chromatin.'},
    {q:'What is cytokinesis?', c:['The replication of DNA','The division of the cytoplasm to form two daughter cells','The condensation of chromatin','The breakdown of the nuclear envelope'], a:1, e:'Cytokinesis is the division of the cytoplasm that produces two separate daughter cells, usually overlapping with telophase.'},
    {q:'In animal cells, cytokinesis occurs through the formation of a:', c:['Cell plate','Cleavage furrow','Metaphase plate','Nuclear envelope'], a:1, e:'Animal cells divide via a cleavage furrow that pinches the cell membrane inward.'},
    {q:'Why do plant cells use a cell plate instead of a cleavage furrow during cytokinesis?', c:['Plant cells don\'t undergo cytokinesis','The rigid cell wall prevents the membrane from pinching inward','Plant cells have no cytoplasm','Plant cells divide faster than animal cells'], a:1, e:'Because plant cells have a rigid cell wall, they can\'t pinch inward like animal cells — instead, a cell plate forms and develops into a new cell wall.'},
    {q:'What is the purpose of cell cycle checkpoints?', c:['To speed up cell division', 'To check that conditions are right before the cell proceeds to the next phase, preventing damaged cells from dividing', 'To destroy healthy cells', 'To skip mitosis entirely'], a:1, e:'Checkpoints act as control points ensuring the cell is ready to safely proceed — they prevent cells with damaged DNA from continuing to divide.'},
    {q:'The G1 checkpoint (Restriction Point) checks for all of these EXCEPT:', c:['Cell size','Nutrient availability','DNA integrity','Whether spindle fibers are attached'], a:3, e:'The G1 checkpoint checks cell size, nutrients, and DNA integrity — checking spindle fiber attachment is the job of the M (Spindle) checkpoint.'},
    {q:'Which checkpoint ensures DNA replication was completed correctly before mitosis begins?', c:['G1 checkpoint','G2 checkpoint','M checkpoint','S checkpoint'], a:1, e:'The G2 checkpoint verifies that DNA replication was completed correctly and without damage before the cell enters mitosis.'},
    {q:'Which checkpoint ensures all chromosomes are properly attached to spindle fibers before anaphase begins?', c:['G1 checkpoint','G2 checkpoint','M (Spindle) checkpoint','S checkpoint'], a:2, e:'The M (Spindle) checkpoint verifies proper chromosome attachment to spindle fibers before allowing anaphase to proceed.'},
    {q:'What can happen when cell cycle checkpoints fail?', c:['The cell cycle simply stops permanently','Cells may divide uncontrollably despite DNA damage, potentially leading to cancer','The cell immediately dies','Nothing significant happens'], a:1, e:'When checkpoint controls fail, damaged cells may continue to divide uncontrollably — this uncontrolled division is a hallmark of cancer.'},
    {q:'What does the mnemonic "PMAT" help you remember?', c:['The stages of interphase','The order of mitotic phases: Prophase, Metaphase, Anaphase, Telophase','The parts of a chromosome','The types of cell transport'], a:1, e:'"PMAT" is a mnemonic for the four phases of mitosis, in order: Prophase, Metaphase, Anaphase, Telophase.'},
    {type:'dual', s1:'Interphase includes the G1, S, and G2 phases.', s2:'Most of a cell\'s time in the cell cycle is spent in the Mitotic (M) phase.', a:2, e:'Statement 1 is true, but Statement 2 is false — most of the cell cycle (about 90%) is actually spent in Interphase, not the M phase.'},
    {type:'dual', s1:'DNA replication occurs during the S phase of interphase.', s2:'After S phase, each chromosome has two sister chromatids.', a:0, e:'Both statements are true — this is exactly what happens during and after S phase.'},
    {type:'dual', s1:'Animal cells use a cell plate to divide during cytokinesis.', s2:'Plant cells use a cleavage furrow to divide during cytokinesis.', a:1, e:'Both statements are false — it\'s the reverse: animal cells use a cleavage furrow, and plant cells use a cell plate.'},
    {type:'dual', s1:'The G2 checkpoint checks that DNA replication was completed correctly.', s2:'The M checkpoint checks that chromosomes are properly attached to spindle fibers.', a:0, e:'Both statements are true — these are the correct roles of the G2 and M checkpoints respectively.'},
    {type:'dual', s1:'Cancer can result when cell cycle checkpoints fail to catch DNA damage.', s2:'Cells in G0 phase are actively dividing.', a:2, e:'Statement 1 is true, but Statement 2 is false — cells in G0 have exited the cycle and are NOT dividing; that\'s the defining feature of G0.'},
    {q:'The protective cap at the ends of a chromosome, which carries no genetic information itself, is called the:', c:['Centromere','Telomere','Nucleoid','Sister chromatid'], a:1, e:'The telomere is the protective cap at each end of a chromosome; it doesn\'t carry genetic information but protects the chromosome.'},
    {q:'If DNA damage isn\'t repaired by the G2 checkpoint, one possible outcome is:', c:['Apoptosis (programmed cell death), to avoid passing on damaged DNA','The cell skips mitosis entirely and lives forever','The cell automatically becomes cancerous','Nothing — checkpoints have no effect on this'], a:0, e:'If a problem at the G2 checkpoint can\'t be fixed, the cell may undergo apoptosis (programmed cell death) rather than pass on damaged DNA.'}
  ],
  glossary: [
    {term:'Interphase', def:'the growth phase of the cell cycle (G1, S, G2), making up ~90% of the total cycle.'},
    {term:'S Phase', def:'the phase of interphase where DNA replication occurs.'},
    {term:'Mitosis', def:'division of the nucleus into two identical nuclei, via Prophase, Metaphase, Anaphase, Telophase.'},
    {term:'Cytokinesis', def:'division of the cytoplasm, producing two separate daughter cells.'},
    {term:'Checkpoint', def:'a control point in the cell cycle that verifies conditions are right before proceeding to the next phase.'},
    {term:'G0 Phase', def:'a resting phase where some cells permanently exit the cell cycle.'},
    {term:'Sister Chromatids', def:'two identical copies of a chromosome joined at the centromere after DNA replication.'},
    {term:'Centromere', def:'the constricted region of a chromosome that joins two sister chromatids together.'},
    {term:'Telomere', def:'the protective cap at each end (top/bottom) of a chromosome; carries no genetic information, only protects it.'},
    {term:'Chromosome Arms (p/q)', def:'the short arm (p) and long arm (q) of a chromosome, extending out from the centromere.'},
    {term:'Apoptosis', def:'programmed cell death; can be triggered if DNA damage isn\'t fixed by G2, preventing damaged DNA from passing to daughter cells.'}
  ],
  palace: [
    {stop:'Front Yard', image:'A tiny sapling grows taller and taller in the yard, sprouting new leaves and roots (but not yet splitting).', fact:'G1 phase: the cell grows in size and makes new proteins/organelles.'},
    {stop:'Photocopy Room', image:'A copy machine spits out an exact duplicate of every document in the room, stapled together in pairs.', fact:'S phase: DNA is replicated, forming sister chromatids joined at the centromere.'},
    {stop:'Packing Station', image:'Boxes are being taped shut and labeled "FRAGILE — READY FOR SHIPPING" all around the room.', fact:'G2 phase: final preparations are made before mitosis begins.'},
    {stop:'Hallway Mirror Row', image:'A row of thick, twisted ropes (chromosomes) appears in the hallway as the ceiling (nuclear envelope) starts crumbling.', fact:'Prophase: chromatin condenses into chromosomes, nuclear envelope breaks down.'},
    {stop:'Center of the Room', image:'All the twisted ropes line up perfectly along a chalk line drawn across the middle of the floor.', fact:'Metaphase: chromosomes align along the metaphase plate.'},
    {stop:'Tug-of-War Pit', image:'Two teams yank the twisted ropes apart, each half flying to opposite ends of the room.', fact:'Anaphase: sister chromatids are pulled apart to opposite poles.'},
    {stop:'Two New Rooms', image:'A wall rebuilds itself around each pile of rope on either end, forming two separate rooms.', fact:'Telophase: new nuclear envelopes form around each set of chromosomes.'},
    {stop:'Garage Divider', image:'A zipper pulls shut down the middle of the garage (animal), while next door a fresh drywall panel (plant) splits another garage cleanly in half.', fact:'Cytokinesis: cleavage furrow in animal cells, cell plate in plant cells.'},
    {stop:'Security Checkpoint at the Door', image:'A guard stops everyone at three separate gates, checking ID (size/DNA), a stamped form (replication), and a rope harness (spindle attachment) before letting anyone through.', fact:'Cell cycle checkpoints (G1, G2, M) verify conditions before allowing the cycle to proceed — failure can lead to cancer.'}
  ]
},
{
  id: 'bn5',
  title: '5. Cell Transport',
  content: [
    {h:'The Cell Membrane and Selective Permeability', b:[
      'The cell membrane (plasma membrane) is selectively permeable — it allows some substances to pass through freely while restricting others.',
      'It is built as a phospholipid bilayer: hydrophilic ("water-loving") heads face outward toward water on both sides, while hydrophobic ("water-fearing") tails face inward, away from water.',
      'Small, nonpolar, or uncharged molecules (like O2 and CO2) can pass directly through the bilayer; large, polar, or charged molecules (like glucose and ions) need help from membrane proteins.'
    ]},
    {h:'Passive Transport (No Energy Required)', b:[
      'Passive transport moves substances DOWN their concentration gradient (from high to low concentration) and does NOT require the cell to use energy (ATP).',
      'Simple Diffusion: small or nonpolar molecules move directly across the lipid bilayer from high to low concentration (e.g. oxygen and carbon dioxide).',
      'Facilitated Diffusion: larger or charged molecules move across the membrane through specific transport proteins (channel proteins or carrier proteins), still moving from high to low concentration.',
      'Osmosis: the diffusion of WATER specifically, moving across a selectively permeable membrane from an area of low solute concentration to high solute concentration.'
    ]},
    {h:'Tonicity and Osmosis in Cells', b:[
      'Hypotonic solution: lower solute concentration OUTSIDE the cell than inside — water moves INTO the cell, causing it to swell (and potentially lyse/burst in animal cells).',
      'Hypertonic solution: higher solute concentration OUTSIDE the cell than inside — water moves OUT of the cell, causing it to shrink (crenation in animal cells, plasmolysis in plant cells).',
      'Isotonic solution: equal solute concentration inside and outside the cell — no net movement of water, and the cell maintains its normal shape.',
      'Plant cells in a hypotonic solution become turgid (firm, healthy) rather than bursting, because the rigid cell wall resists the swelling pressure.'
    ]},
    {h:'Active Transport (Energy Required)', b:[
      'Active transport moves substances AGAINST their concentration gradient (from low to high concentration) and REQUIRES the cell to spend energy, usually in the form of ATP.',
      'Carrier proteins called pumps bind to the substance and use energy from ATP to change shape and move it across the membrane.',
      'The Sodium-Potassium Pump (Na+/K+ pump) is a classic example: it pumps 3 sodium ions OUT of the cell and 2 potassium ions INTO the cell, both against their gradients, using one ATP per cycle.'
    ]},
    {h:'Bulk Transport: Endocytosis and Exocytosis', b:[
      'Bulk transport moves large molecules or particles that are too big to cross the membrane through channels or pumps — it requires energy and involves the membrane itself changing shape.',
      'Endocytosis: the cell membrane engulfs material from OUTSIDE the cell, forming a vesicle that brings the material INTO the cell.',
      'Phagocytosis ("cell eating"): endocytosis of large solid particles (e.g. white blood cells engulfing bacteria).',
      'Pinocytosis ("cell drinking"): endocytosis of liquids/dissolved substances in small vesicles.',
      'Exocytosis: a vesicle from INSIDE the cell fuses with the cell membrane, releasing its contents OUTSIDE the cell (e.g. secreting hormones or neurotransmitters).'
    ]}
  ],
  quiz: [
    {q:'What does it mean for the cell membrane to be "selectively permeable"?', c:['It blocks everything from passing through','It allows some substances through while restricting others','It allows all substances through equally','It has no effect on what enters or exits the cell'], a:1, e:'Selectively permeable means the membrane allows certain substances to pass freely while restricting others.'},
    {q:'In the phospholipid bilayer, which part of the phospholipid faces the watery environment?', c:['The hydrophobic tails','The hydrophilic heads','Both equally','Neither — phospholipids avoid water entirely'], a:1, e:'The hydrophilic ("water-loving") heads face outward toward water on both sides of the membrane, while hydrophobic tails face inward.'},
    {q:'Which type of transport requires NO cellular energy (ATP)?', c:['Active transport','Passive transport','Exocytosis','Phagocytosis'], a:1, e:'Passive transport moves substances down their concentration gradient and does not require energy.'},
    {q:'Simple diffusion allows which type of molecules to cross the membrane directly?', c:['Large, charged ions','Small, nonpolar molecules like O2 and CO2','Whole bacteria','Large proteins'], a:1, e:'Small, nonpolar molecules like oxygen and carbon dioxide can diffuse directly across the lipid bilayer.'},
    {q:'What is the key difference between simple diffusion and facilitated diffusion?', c:['Facilitated diffusion requires ATP, simple diffusion does not','Facilitated diffusion uses transport proteins to move larger/charged molecules, while simple diffusion does not need proteins','Simple diffusion moves substances against the gradient','There is no difference'], a:1, e:'Facilitated diffusion relies on channel or carrier proteins to move larger or charged molecules, while simple diffusion happens directly through the lipid bilayer.'},
    {q:'Osmosis specifically refers to the diffusion of:', c:['Glucose','Water','Oxygen','Sodium ions'], a:1, e:'Osmosis is the diffusion of water across a selectively permeable membrane.'},
    {q:'In osmosis, water moves from an area of:', c:['High solute concentration to low solute concentration','Low solute concentration to high solute concentration','Equal concentration only','No predictable direction'], a:1, e:'Water moves from an area of low solute concentration to an area of high solute concentration during osmosis.'},
    {q:'A cell placed in a hypotonic solution will:', c:['Shrink','Swell (and possibly burst)','Stay exactly the same','Immediately die'], a:1, e:'In a hypotonic solution, water moves INTO the cell (since solute concentration is lower outside), causing it to swell.'},
    {q:'A cell placed in a hypertonic solution will:', c:['Swell','Shrink (crenation in animal cells, plasmolysis in plant cells)','Stay exactly the same','Immediately divide'], a:1, e:'In a hypertonic solution, water moves OUT of the cell, causing it to shrink — called crenation in animal cells and plasmolysis in plant cells.'},
    {q:'In an isotonic solution, what happens to a cell?', c:['It swells dramatically','It shrinks dramatically','There is no net movement of water, and the cell keeps its normal shape','It bursts immediately'], a:2, e:'In an isotonic solution, solute concentration is equal inside and outside, so there\'s no net water movement.'},
    {q:'Why don\'t plant cells burst when placed in a hypotonic solution?', c:['They have no water inside them','The rigid cell wall resists the swelling pressure, making the cell turgid instead','They actively pump out all the water','Plant cells cannot absorb water'], a:1, e:'The rigid cell wall of plant cells resists the pressure of swelling, so the cell becomes turgid (firm) rather than bursting.'},
    {q:'Active transport moves substances:', c:['Down their concentration gradient, using no energy','Against their concentration gradient, using energy (ATP)','Only through simple diffusion','Only during cell division'], a:1, e:'Active transport moves substances against their concentration gradient (low to high) and requires energy, usually ATP.'},
    {q:'In the Sodium-Potassium Pump, how many sodium ions are pumped OUT and how many potassium ions are pumped IN per cycle?', c:['2 sodium out, 3 potassium in','3 sodium out, 2 potassium in','1 sodium out, 1 potassium in','3 sodium out, 3 potassium in'], a:1, e:'The Na+/K+ pump moves 3 sodium ions out of the cell and 2 potassium ions into the cell per cycle, using one ATP.'},
    {q:'What type of protein performs active transport by changing shape to move substances across the membrane?', c:['Channel protein','Carrier protein (pump)','Structural protein','Enzyme only'], a:1, e:'Carrier proteins called pumps use energy from ATP to change shape and move substances against their gradient.'},
    {q:'What is endocytosis?', c:['The cell membrane engulfing material from outside and bringing it into the cell via a vesicle','A vesicle releasing material outside the cell','Diffusion of water only','Passive movement of ions'], a:0, e:'Endocytosis is when the cell membrane engulfs external material, forming a vesicle that brings it into the cell.'},
    {q:'What is exocytosis?', c:['The cell membrane engulfing material from outside', 'A vesicle from inside the cell fusing with the membrane to release its contents outside', 'Diffusion of gases only', 'The process of cell division'], a:1, e:'Exocytosis is when an internal vesicle fuses with the cell membrane to release its contents to the outside (e.g. secreting hormones).'},
    {q:'"Cell eating," or the endocytosis of large solid particles, is called:', c:['Pinocytosis','Phagocytosis','Osmosis','Facilitated diffusion'], a:1, e:'Phagocytosis ("cell eating") is the endocytosis of large solid particles, such as white blood cells engulfing bacteria.'},
    {q:'"Cell drinking," or the endocytosis of liquids/dissolved substances, is called:', c:['Phagocytosis','Pinocytosis','Exocytosis','Active transport'], a:1, e:'Pinocytosis ("cell drinking") is the endocytosis of liquids or dissolved substances in small vesicles.'},
    {q:'Which of the following requires the cell to use energy?', c:['Simple diffusion','Osmosis','Active transport','Facilitated diffusion'], a:2, e:'Active transport (and bulk transport like endo-/exocytosis) require energy, unlike passive transport methods like diffusion and osmosis.'},
    {q:'White blood cells engulfing bacteria is a specific example of:', c:['Pinocytosis','Phagocytosis','Simple diffusion','Osmosis'], a:1, e:'This is phagocytosis — the endocytosis of large solid particles, in this case bacteria.'},
    {type:'dual', s1:'Simple diffusion requires the cell to use ATP.', s2:'Facilitated diffusion moves molecules against their concentration gradient.', a:1, e:'Both statements are false — simple diffusion does NOT require ATP, and facilitated diffusion (like simple diffusion) moves molecules WITH the gradient, not against it.'},
    {type:'dual', s1:'Osmosis is the diffusion of water across a selectively permeable membrane.', s2:'Water moves from low solute concentration to high solute concentration during osmosis.', a:0, e:'Both statements are true — this is exactly how osmosis works.'},
    {type:'dual', s1:'A cell in a hypertonic solution will swell.', s2:'A cell in a hypotonic solution will shrink.', a:1, e:'Both statements are false — it\'s the reverse: hypertonic solutions cause cells to shrink, and hypotonic solutions cause cells to swell.'},
    {type:'dual', s1:'The Sodium-Potassium pump is an example of active transport.', s2:'It moves substances down their concentration gradient without using energy.', a:2, e:'Statement 1 is true, but Statement 2 is false — the Na+/K+ pump moves ions AGAINST their gradient and DOES require energy (ATP), which is what makes it active transport.'},
    {type:'dual', s1:'Endocytosis brings material into the cell.', s2:'Exocytosis brings material into the cell as well.', a:2, e:'Statement 1 is true, but Statement 2 is false — exocytosis RELEASES material out of the cell, not into it.'}
  ],
  glossary: [
    {term:'Selectively Permeable', def:'a membrane property that allows some substances through while restricting others.'},
    {term:'Passive Transport', def:'movement of substances down their concentration gradient, requiring no energy.'},
    {term:'Active Transport', def:'movement of substances against their concentration gradient, requiring energy (ATP).'},
    {term:'Osmosis', def:'diffusion of water across a selectively permeable membrane, from low to high solute concentration.'},
    {term:'Hypotonic', def:'a solution with lower solute concentration outside the cell — water moves in, cell swells.'},
    {term:'Hypertonic', def:'a solution with higher solute concentration outside the cell — water moves out, cell shrinks.'},
    {term:'Isotonic', def:'a solution with equal solute concentration inside and outside — no net water movement.'},
    {term:'Endocytosis', def:'the cell membrane engulfing material to bring it into the cell.'},
    {term:'Exocytosis', def:'a vesicle fusing with the membrane to release material out of the cell.'}
  ],
  palace: [
    {stop:'Front Gate', image:'A picky bouncer at the gate lets small, quiet guests slide right in but stops large or rowdy guests unless they show a special pass (protein).', fact:'Selectively permeable membrane: small/nonpolar molecules pass freely; large/charged ones need help.'},
    {stop:'Swimming Pool Deck', image:'People happily lounge with their heads poking out of the water on both sides of a floating pool noodle, while their feet (tails) stay hidden underwater.', fact:'Phospholipid bilayer: hydrophilic heads face water, hydrophobic tails face inward.'},
    {stop:'Open Field', image:'A crowd casually strolls downhill from a packed stadium into an empty field, no ushers needed.', fact:'Passive transport (diffusion): movement down the concentration gradient, no energy required.'},
    {stop:'Turnstile Gate', image:'A special turnstile only lets people wearing a certain badge (protein) through, still moving from the packed side to the empty side.', fact:'Facilitated diffusion: uses transport proteins, still moves down the gradient.'},
    {stop:'Sponge in the Sink', image:'A dry sponge placed in a salty bowl of water visibly shrivels up, while one in plain water puffs up like a balloon.', fact:'Hypertonic solution shrinks a cell; hypotonic solution makes it swell.'},
    {stop:'Greenhouse Window', image:'A wilted plant perks up and stands firm and tall after its pot is watered, thanks to its sturdy stems (cell walls).', fact:'Plant cells become turgid, not burst, in a hypotonic solution because of the rigid cell wall.'},
    {stop:'Escalator Going Up', image:'A tired worker pushes a cart of heavy boxes UP a downward-moving escalator, sweating and burning calories with every step.', fact:'Active transport: moves substances against the gradient, using energy (ATP).'},
    {stop:'Revolving Door (3-in, 2-out)', image:'A revolving door only ever lets exactly 3 people out one side and 2 people in the other side, over and over, powered by a hidden motor.', fact:'Sodium-Potassium Pump: 3 Na+ out, 2 K+ in, per cycle, using ATP.'},
    {stop:'Loading Dock', image:'A giant crane arm reaches out, scoops up an entire shipping container from outside, and hauls it into the warehouse.', fact:'Endocytosis: the membrane engulfs material and brings it into the cell.'},
    {stop:'Delivery Truck Departing', image:'A sealed delivery truck backs up to a warehouse door, opens its back doors, and dumps its whole shipment out onto the street.', fact:'Exocytosis: a vesicle fuses with the membrane and releases contents outside the cell.'}
  ]
}
]},
{id:'funfaith', name:'FunFaith: Religion', lessons:[
  {id:'ff1', title:'1. Divine Revelation', content:[
    {h:'Revelation', b:[
      'Revelare: to lift the veil, to disclose, to uncover.',
      'God, out of His infinite love for humankind, decided to make Himself known to us (1 John 4:7-21).',
      'The ultimate purpose of God\'s free act of self-disclosing to us is nothing else but salvation.',
      'With his whole being, man gives his assent to God the revealer.',
      'God\'s Love in Revelation: God\'s personal loving communication of who He is and His plan to save us all in His love — God reaching out to us in friendship.'
    ]},
    {h:'Our Human Limitation & Language', b:[
      'St. Thomas Aquinas: "There is nothing in the mind that is not first in the senses" — all human knowledge originates from sensory experience.',
      '1 John 4:12: "No one has ever seen God..." — God is a Spirit, a Mystery, and cannot be perceived by the senses.',
      'God\'s love can be seen/experienced through the love shown between believers (love as reflection of God, evidence of His presence).',
      'Language about God is analogical and symbolic, since language is a product of human sensory experience.',
      'Anthropomorphism: Anthropos (man) + morphe (form) — attribution of human qualities to non-human beings, including God.',
      'Example — Creation of Man: God took soil and breathed on it, and it became a person; "breathing" is the anthropomorphic detail here, since breathing is a physical human attribute being linked to God.',
      'Limitation of Anthropomorphism: since it\'s our own creation, we tend to attribute only POSITIVE qualities to God through it, which can give an incomplete picture.'
    ]},
    {h:'Image of God', b:[
      'Images are signs that point to a greater reality; they have both strengths and limitations, and can be misleading or manipulated.',
      'We cannot do away with images — they\'re all we\'ve got.',
      'God is a Mother: Positive — makes God approachable, caring, loving. Negative — may weaken God\'s image due to negative feminine attributes from patriarchal cultural conditioning.',
      'God is a Friend: Positive — shows God\'s immanence, involvement in daily life. Negative — may cause over-familiarity, lack of reverence.'
    ]},
    {h:'4 Types of Revelation', b:[
      'Natural Revelation: knowing God through the created world; we are stewards of God\'s creation, invited to give praise and glory for His generosity.',
      'Special Revelation: "supernatural revelation," unknown without God\'s intervention through chosen messengers; St. Thomas equates this with the Bible.',
      'Private Revelation: apparitions/mystical experiences, examined by the Magisterium based on Public Revelation, offering guidance (e.g. Our Lady of Fatima, 1917, to three shepherd children).',
      'Public Revelation: revelation of God through Jesus Christ; imposes obligation of faith, final and complete; invites us to be Christ-centered.',
      'The Challenge Before Us: revelation invites us to KNOW Him more clearly (reading the Bible), LOVE Him more deeply (practicing Charity), WORSHIP Him more sincerely (responding to His revelation).'
    ]}
  ], quiz:[
    {q:'What does "Revelare" mean?', c:['To hide, to conceal','To lift the veil, to disclose, to uncover','To worship','To condemn'], a:1, e:'"Revelare" means to lift the veil, to disclose, to uncover — the root of the English word "revelation."'},
    {q:'According to St. Thomas Aquinas, all human knowledge and concepts originate from:', c:['Divine intervention alone','Sensory experience','Pure reason with no senses needed','Instinct'], a:1, e:'St. Thomas Aquinas taught "there is nothing in the mind that is not first in the senses" — knowledge originates from sensory experience.'},
    {q:'Which type of revelation is equated with the Bible by St. Thomas?', c:['Natural','Special','Private','Public'], a:1, e:'Special Revelation, described as "supernatural revelation," is equated by St. Thomas with the Bible.'},
    {q:'The apparition of the Virgin Mary at Fatima in 1917 is an example of which type of revelation?', c:['Natural','Special','Private','Public'], a:2, e:'The Fatima apparition to three shepherd children is a classic example of Private Revelation, examined by the Magisterium.'},
    {q:'Which type of revelation is described as "final and complete in the person of Jesus" and imposes an obligation of faith?', c:['Natural','Special','Private','Public'], a:3, e:'Public Revelation, through Jesus Christ, is final and complete, and imposes the obligation of faith on all believers.'},
    {q:'Attributing human qualities to non-human beings, including God, is called:', c:['Anthropomorphism','Theomorphism','Iconography','Personification only'], a:0, e:'Anthropomorphism (Anthropos = man, morphe = form) is the attribution of human qualities to non-human beings, including God.'},
    {q:'In the account of God creating man from soil and breathing on it, what is the anthropomorphic detail?', c:['The soil itself','God breathing on it','The color of the soil','The location of creation'], a:1, e:'"Breathing" is a physical human attribute, so attributing it to God in this account is the anthropomorphic detail.'},
    {q:'What is a key LIMITATION of using anthropomorphism to describe God?', c:['It makes God seem too distant','It tends to attribute only POSITIVE human qualities to God, giving an incomplete picture','It is only used in the Old Testament','It removes all mystery from God'], a:1, e:'Because anthropomorphic images are human-made, they tend to highlight only positive qualities, which can give an incomplete picture of God.'},
    {q:'The "Positive" aspect of the "God is a Mother" image is that it:', c:['Makes God more approachable, caring, and loving','Weakens God\'s image entirely','Has no positive aspect','Only applies to non-Christians'], a:0, e:'Describing God as a Mother positively makes Him more approachable and presents Him as caring and loving.'},
    {q:'A potential negative of the "God is a Friend" image is that it may lead to:', c:['Increased reverence','Over-familiarity and a lack of reverence','Complete rejection of God','Better understanding of the Trinity'], a:1, e:'Describing God as a Friend can risk over-familiarity, potentially leading to a lack of reverence.'},
    {q:'The three-part challenge from Divine Revelation is to KNOW, LOVE, and:', c:['Fear Him','Worship Him more sincerely','Avoid Him','Question Him'], a:1, e:'The three challenges are to KNOW God more clearly, LOVE Him more deeply, and WORSHIP Him more sincerely.'},
    {q:'"KNOW" as part of the 3-part challenge specifically entails:', c:['Practicing Charity','Reading the Bible','Attending daily Mass only','Avoiding Church teaching'], a:1, e:'KNOW entails reading the Bible to grow in clearer knowledge of God.'}
  ], glossary:[
    {term:'Revelare', def:'Latin: to lift the veil, to disclose, to uncover.'},
    {term:'Anthropomorphism', def:'Anthropos (man) + morphe (form) — attribution of human qualities to non-human beings, including God.'},
    {term:'Limitation of Anthropomorphism', def:'since it\'s a human-made image, it tends to attribute only POSITIVE human qualities to God, giving an incomplete picture.'},
    {term:'Natural Revelation', def:'knowing God through the created world.'},
    {term:'Special Revelation', def:'"supernatural revelation," equated with the Bible.'},
    {term:'Private Revelation', def:'apparitions/mystical experiences, examined by the Magisterium.'},
    {term:'Public Revelation', def:'revelation through Jesus Christ; final, complete, imposes obligation of faith.'}
  ], palace:[
    {stop:'Front Curtain', image:'A heavy velvet curtain is being lifted by an unseen hand, revealing a glowing figure behind it — "Revelare: to lift the veil."', fact:'Revelare means to lift the veil, to disclose, to uncover.'},
    {stop:'Family Photo Wall', image:'A family portrait shows God depicted as both a warm Mother figure and a close Friend, with sticky notes on each: one saying "approachable," the other "watch the over-familiarity."', fact:'God as Mother/Friend: positive (approachable/immanent) and negative (weakens image/over-familiarity) aspects.'},
    {stop:'Bookshelf of Four Volumes', image:'Four books stand in a row: a leafy green one (Nature), a golden one (Special/Bible), a shimmering ghostly one (Private/apparitions), and a bright shining one glowing brighter than the rest (Public/Christ).', fact:'4 Types of Revelation: Natural, Special, Private, Public.'},
    {stop:'Prayer Corner', image:'Three candles are lit in a row, labeled KNOW (an open Bible), LOVE (two clasped hands), WORSHIP (a bowed head).', fact:'The 3-part challenge: Know Him more clearly, Love Him more deeply, Worship more sincerely.'}
  ]},
  {id:'ff2', title:'2. Transmission of Faith', content:[
    {h:'Faith', b:[
      '"Fides" (Latin): trust, loyalty. Ob-Audire: obedience, to hear or to listen.',
      'Faith is a virtue and a gift — submitting freely to the word as its truth is guaranteed by God.',
      'The nature of faith is in the conscience, but not coerced; unmerited, given from the goodness of the giver.',
      '5 Characteristics of Faith: Total and Absolute (like Christ\'s Passion/Death/Resurrection), Trinitarian (belief in Father, Son, Holy Spirit), Loving/Maturing/Missionary (bearing witness), Informed and Communitarian (via Scripture/Tradition), Inculturated (lived in daily relationships).'
    ]},
    {h:'The Great Commissioning', b:[
      'Matthew 28:16-20: "All authority in heaven and on earth has been given to me. Therefore, go make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit."',
      'St. Peter: "And I tell you that you are Peter, and on this rock, I will build my Church" — first Pope, commissioned the apostles to continue Christ\'s mission.',
      'Apostles fulfilled their mission through oral preaching, examples, and observances handed on by Christ.',
      'Lt. Tradare: to pass on, to hand over — initially shared through Oral Tradition, eventually some put into Written Tradition.'
    ]},
    {h:'Sacred Tradition: Deposit of Faith', b:[
      'Doctrinal Traditions: the LIVING and LIVED faith of the Church — can NEVER be changed/modified without harming the integrity of the Christian Faith.',
      'Cultural Tradition: by contrast, CAN be changed or modified without harming the integrity of the Christian faith (e.g. customs/practices tied to a specific time or culture, unlike core doctrine).',
      'Apostolic Succession: the unbroken chain of ordination and teaching authority passed down from Jesus Christ, to St. Peter (the first Pope), all the way down to the current Pope — safeguarding the Magisterium\'s authority.',
      'Dei Verbum: Sacred Tradition and Sacred Scripture form ONE sacred deposit of the Word of God, committed to the Church — they are inseparable.',
      'Sola Scriptura (Reformers): "scripture only" — the Bible, not tradition or the Church, is the final authority; the Bible itself (John 20:30) shows this is incomplete, since not everything Jesus did was recorded.',
      'Sacred Scripture originated from Oral Tradition; not all Tradition was written down — the Bible does not contain the entire revelation, and Tradition continues in the life of the Church.'
    ]},
    {h:'The Tripod of Catholic Faith', b:[
      'Sacred Tradition: the living transmission of the Gospel message, passed down through apostles/bishops.',
      'Sacred Scripture: the Bible, inspired by the Word of God.',
      'Magisterium: the Church\'s teaching authority, entrusted to the Pope and bishops, responsible for interpreting and safeguarding revealed truth.',
      'Interconnectedness: the three elements work together, supporting and enriching each other, guided by the Holy Spirit — e.g. Trinity, infant baptism, Bible inerrancy, purgatory, Mary\'s perpetual virginity are most clearly taught through Tradition, though implicitly present in the Bible.'
    ]}
  ], quiz:[
    {q:'What does the Latin word "Fides" mean?', c:['Fear','Trust, loyalty','Sacrifice','Command'], a:1, e:'"Fides" is Latin for trust, loyalty — the root of the word "faith."'},
    {q:'Which characteristic of faith describes belief in Father, Son, and Holy Spirit?', c:['Total and Absolute','Trinitarian','Inculturated','Informed and Communitarian'], a:1, e:'The Trinitarian characteristic describes faith as a personal conviction in God the Father, revealed by Jesus Christ, and present through the Holy Spirit.'},
    {q:'Which characteristic of faith describes it as lived in daily relationships like family and friends?', c:['Total and Absolute','Loving, Maturing, Missionary','Inculturated','Trinitarian'], a:2, e:'Inculturated faith is lived out in daily relationships — family, friends, classmates.'},
    {q:'Who is described as the first Pope of the Church?', c:['St. Paul','St. Peter','St. John','St. Thomas'], a:1, e:'St. Peter was the first Pope, commissioned by Christ to continue His mission of sharing the message of salvation.'},
    {q:'What does the Latin term "Tradare" mean?', c:['To pass on; to hand over','To write down','To baptize','To worship'], a:0, e:'"Tradare" means to pass on or hand over — the root of the word "tradition."'},
    {q:'According to Dei Verbum, Sacred Tradition and Sacred Scripture:', c:['Are two separate, competing sources','Form ONE sacred deposit of the Word of God','Have no relationship to each other','Are only relevant to bishops'], a:1, e:'Dei Verbum states that Sacred Tradition and Sacred Scripture together form one sacred deposit of the Word of God, committed to the Church.'},
    {q:'"Sola Scriptura" is the belief of the Reformers that:', c:['Only the Bible, not tradition or the Church, is the final authority','Tradition is more important than Scripture','The Church has no authority at all','The Bible was written entirely by one apostle'], a:0, e:'Sola Scriptura is the belief that the Bible alone is the final authority, not Tradition or the Church.'},
    {q:'Which of the following is NOT one of the "Tripod of Catholic Faith"?', c:['Sacred Tradition','Sacred Scripture','Magisterium','Sola Scriptura'], a:3, e:'The Tripod consists of Sacred Tradition, Sacred Scripture, and the Magisterium — Sola Scriptura is the Reformers\' opposing position.'},
    {q:'Which teaching authority is entrusted to the Pope and bishops to interpret and safeguard revealed truth?', c:['Sacred Tradition','Sacred Scripture','The Magisterium','Sola Scriptura'], a:2, e:'The Magisterium is the Church\'s teaching authority, entrusted to the Pope and bishops in communion with him.'},
    {q:'Which doctrines are given as examples of teachings most clearly taught through Tradition, though only implicit in the Bible?', c:['The Trinity, infant baptism, Bible inerrancy, purgatory, Mary\'s perpetual virginity','Only the Ten Commandments','Only the Beatitudes','None — everything is explicit in the Bible'], a:0, e:'The notes give the Trinity, infant baptism, biblical inerrancy, purgatory, and Mary\'s perpetual virginity as apostolic teachings most clearly taught through Tradition, though only implicitly present in Scripture.'},
    {q:'Unlike Doctrinal Tradition, Cultural Tradition:', c:['Can never be changed under any circumstance','CAN be changed or modified without harming the integrity of the faith','Is identical to Sacred Scripture','Was written down by St. Peter'], a:1, e:'Cultural Tradition (customs tied to a particular time/culture) can be changed without harming the integrity of the Christian faith, unlike Doctrinal Tradition.'},
    {q:'The unbroken chain of teaching authority passed from Jesus Christ, to St. Peter, down to the current Pope, is called:', c:['Sola Scriptura','Apostolic Succession','Cultural Tradition','Dei Verbum'], a:1, e:'Apostolic Succession is the unbroken chain of ordination/teaching authority from Christ, through St. Peter, down to the current Pope.'}
  ], glossary:[
    {term:'Fides', def:'Latin for trust, loyalty — root of "faith."'},
    {term:'Tradare', def:'Latin: to pass on; to hand over — root of "tradition."'},
    {term:'Sola Scriptura', def:'Reformers\' belief that Scripture alone is the final authority.'},
    {term:'Tripod of Catholic Faith', def:'Sacred Tradition, Sacred Scripture, and the Magisterium — working together.'},
    {term:'Cultural Tradition', def:'customs/practices that CAN be changed without harming the integrity of the faith, unlike Doctrinal Tradition.'},
    {term:'Apostolic Succession', def:'the unbroken chain of teaching authority from Jesus Christ, to St. Peter, down to the current Pope.'}
  ], palace:[
    {stop:'Handshake at the Door', image:'Two hands clasp firmly, one labeled "Fides" (trust/loyalty), the other whispering "ob-audire" (to listen).', fact:'Fides = trust, loyalty. Ob-Audire = obedience, to hear/listen.'},
    {stop:'Keys on the Hook', image:'A giant set of keys hangs labeled "PETER," with a cornerstone behind it reading "on this rock I will build my Church."', fact:'St. Peter, the first Pope, was commissioned by Christ.'},
    {stop:'Relay Race Baton on the Table', image:'A baton passes hand to hand down a long line of runners, first spoken aloud (Oral Tradition), then eventually written on a scroll (Written Tradition).', fact:'Tradare = to pass on/hand over; Oral Tradition came first, Written Tradition followed.'},
    {stop:'Three-Legged Stool in the Corner', image:'A stool with exactly three legs — one carved "Tradition," one "Scripture," one "Magisterium" — falls over if any leg is removed.', fact:'The Tripod of Catholic Faith: Sacred Tradition, Sacred Scripture, Magisterium.'}
  ]},
  {id:'ff3', title:'3. Faith, Creed, and the Holy Trinity', content:[
    {h:'Faith: Fides Qua and Fides Quae', b:[
      'Faith is a free assent to the whole truth God has revealed — "I believe" = "We believe."',
      'Fides Qua ("the faith BY WHICH one believes") — the act of believing: Worship (going to Mass), Morals (charities), Doctrine (Bible study).',
      'Fides Quae ("the faith WHICH is believed") — the content of faith: Worship (Liturgical Creed), Morals (Decalogue and Beatitudes), Doctrine (Trinitarian and Christological Dogmas).'
    ]},
    {h:'The Paralyses of Faith', b:[
      'A "paralysis" of faith happens when one or two of the three dimensions (Believing/Doctrine, Doing/Morality, Trusting/Worship) is left out of a person\'s lived faith.',
      'Ideological Activism: believes the right things and does what is good, but hardly prays or goes to Church — missing Worship.',
      'Pious Dogmatism: believes the right things and always goes to church, but lives a questionable Christian life — missing Morality.',
      'Idealistic Activism: does good to others and goes to church often, but doesn\'t really know what he/she believes in — missing Doctrine.',
      'Missing 2 dimensions at once results in an even more extreme imbalance: Ritualism (only Worship remains — no doctrine, no morals), Activism (only Morality remains — no worship, no doctrine), Idealism (only Doctrine remains — no worship, no morals).'
    ]},
    {h:'Creed', b:[
      '"Credo" (Latin): I believe.',
      'Catholic beliefs (CFC 233): communicating the Christian message, grounding insight into Christ\'s truth, uniting Catholics in commitment to Christ, inter-religious dialogue.',
      'Apostles\' Creed: no single author, developed over time; an ancient Roman baptismal symbol; the oldest authoritative doctrinal formulation of belief in the Holy Trinity.',
      'Nicene Creed: arose out of a defensive struggle against the heresy of Arianism (which denied the full divinity of Jesus and the Holy Spirit); it affirms that the Holy Spirit is divine, together with the Son and the Father.',
      'Dogmas themselves do not change — rather, the Church\'s understanding of them deepens over time. The Nicene Creed doesn\'t contradict the Apostles\' Creed; it simply gives a deeper explanation to address the Arian heresy.'
    ]},
    {h:'The Most Holy Trinity', b:[
      'God the Father, God the Son (Jesus Christ), and God the Holy Spirit — the most fundamental mystery of the Catholic faith, revealed by Jesus Christ.',
      'The Trinity is a mystery that goes beyond our human capacity to fully understand — even St. Augustine, a great Doctor of the Church, could not fully comprehend it: legend tells of him seeing a boy on the beach trying to pour the entire ocean into a small hole in the sand, symbolizing how impossible it is to fully contain/comprehend the mystery of the Trinity with a finite human mind. We embrace it through faith rather than full comprehension.',
      'In Sacred Scripture: Creation, The Annunciation, The Baptism of Jesus, The Advocate, The Great Commission, Peter\'s Epistle, Paul\'s Epistle.',
      'Dogma: truths revealed by God Himself, expressed by the Church\'s teaching authority — the Trinity is One, the divine persons are really distinct, the divine persons are relative to one another.'
    ]},
    {h:'The Trinity Is One', b:[
      'By nature: the Trinity does not "share" divine substance among themselves — they are co-equal, co-eternal, and consubstantial.',
      'By relation of origin: the Trinity has the same substance but with three distinct divine persons.',
      '3 Divine Persons: The Father (origin without an origin), The Son (begotten by the Father), Holy Spirit (proceeds from the Father and Son).'
    ]}
  ], quiz:[
    {q:'"Fides Qua" refers to:', c:['The content of what is believed','The act of believing','A type of dogma','A Church council'], a:1, e:'Fides Qua ("the faith by which one believes") refers to the act of believing itself.'},
    {q:'"Fides Quae" refers to:', c:['The act of believing','The content of what is believed (creeds, dogmas)','A type of Mass','The Magisterium'], a:1, e:'Fides Quae ("the faith which is believed") refers to the actual content of belief — such as the Liturgical Creed and Trinitarian Dogmas.'},
    {q:'A person who believes the right things and does good works, but hardly prays or attends Church, exhibits which paralysis of faith?', c:['Pious Dogmatism','Ideological Activism','Idealistic Activism','Ritualism'], a:1, e:'Ideological Activism is missing the Worship/Trusting dimension — the person believes and acts well, but neglects prayer and church attendance.'},
    {q:'A person who believes correctly and always attends church, but lives a morally questionable life, exhibits which paralysis of faith?', c:['Ideological Activism','Idealistic Activism','Pious Dogmatism','Activism'], a:2, e:'Pious Dogmatism is missing the Doing/Morality dimension — correct belief and worship, but a life that doesn\'t match it.'},
    {q:'A person who does good deeds and worships often, but doesn\'t really know what they believe in, exhibits which paralysis of faith?', c:['Pious Dogmatism','Ideological Activism','Idealistic Activism','Idealism'], a:2, e:'Idealistic Activism is missing the Believing/Doctrine dimension — good actions and worship without a clear grasp of belief.'},
    {q:'If a person has ONLY the Worship dimension of faith — no doctrine and no morals — this extreme imbalance is called:', c:['Activism','Idealism','Ritualism','Ideological Activism'], a:2, e:'Ritualism describes having only Worship, with no doctrine or morality grounding it.'},
    {q:'The Nicene Creed arose specifically as a defense against which heresy?', c:['Gnosticism','Arianism','Pelagianism','Donatism'], a:1, e:'The Nicene Creed arose out of a defensive struggle against Arianism, which denied the full divinity of Jesus and the Holy Spirit.'},
    {q:'Which statement about Dogma is TRUE?', c:['Dogmas change frequently as culture changes','Dogmas themselves don\'t change, but the Church\'s understanding of them deepens over time','Dogmas were all created in the 21st century','The Nicene Creed contradicts the Apostles\' Creed'], a:1, e:'Dogmas do not change; rather, the Church\'s understanding of them deepens over time — the Nicene Creed adds depth to, rather than contradicts, the Apostles\' Creed.'},
    {q:'Under Fides Qua, "Worship" is exemplified by:', c:['The Liturgical Creed','Going to Mass','The Decalogue','Trinitarian Dogmas'], a:1, e:'Under Fides Qua (the act of believing), Worship is exemplified by the act of going to Mass.'},
    {q:'Under Fides Quae, "Doctrine" is exemplified by:', c:['Bible study','Charities','Trinitarian and Christological Dogmas','Going to Mass'], a:2, e:'Under Fides Quae (the content believed), Doctrine is exemplified by Trinitarian and Christological Dogmas.'},
    {q:'What does the Latin word "Credo" mean?', c:['I doubt','I believe','I worship','I obey'], a:1, e:'"Credo" is Latin for "I believe" — the root of the word "creed."'},
    {q:'The Apostles\' Creed is described as:', c:['Written by a single identified author','An ancient Roman baptismal symbol, developed over time','A 21st-century document','Only used by Protestants'], a:1, e:'The Apostles\' Creed has no single author, developed over time, and is an ancient Roman baptismal symbol.'},
    {q:'The doctrine of the Trinity refers to:', c:['Three separate gods','God the Father, God the Son, and God the Holy Spirit as one God','Only Jesus Christ','A concept unrelated to Christianity'], a:1, e:'The Trinity is the Christian doctrine of God the Father, God the Son (Jesus), and God the Holy Spirit — three persons, one God.'},
    {q:'Which Trinitarian person is described as "the origin without an origin"?', c:['The Father','The Son','The Holy Spirit','None of these'], a:0, e:'The Father is described as the origin without an origin — not begotten or proceeding from anyone else.'},
    {q:'Which Trinitarian person is described as "begotten by the Father"?', c:['The Father','The Son','The Holy Spirit','All three equally'], a:1, e:'The Son is described as begotten by the Father.'},
    {q:'The Trinity being "co-equal, co-eternal, and consubstantial" reflects their unity by:', c:['Relation of origin','Nature','Physical appearance','Historical timeline'], a:1, e:'By nature, the three Persons of the Trinity are co-equal, co-eternal, and consubstantial (sharing the same substance).'},
    {q:'The legend of a boy trying to pour the ocean into a small hole in the sand illustrates:', c:['The vastness of God\'s creation','The incomprehensibility of the Trinity to the finite human mind','The story of Noah\'s Ark','The parable of the mustard seed'], a:1, e:'This story, associated with St. Augustine, illustrates how impossible it is to fully comprehend the mystery of the Trinity with our finite human minds — we embrace it through faith.'}
  ], glossary:[
    {term:'Fides Qua', def:'the act of believing (Worship, Morals, Doctrine as lived practice).'},
    {term:'Fides Quae', def:'the content of what is believed (Creed, Decalogue, Dogmas).'},
    {term:'Credo', def:'Latin: "I believe" — root of "creed."'},
    {term:'Consubstantial', def:'sharing the same divine substance — describes the unity of the Trinity by nature.'},
    {term:'Paralyses of Faith', def:'Ideological Activism (no worship), Pious Dogmatism (no morality), Idealistic Activism (no doctrine) — imbalances when a dimension of faith is missing.'},
    {term:'Nicene Creed', def:'arose against the heresy of Arianism; affirms the Holy Spirit is divine, together with the Son and Father.'}
  ], palace:[
    {stop:'Twin Mirrors in the Hallway', image:'One mirror shows you actively doing something (going to Mass), the other shows the reflection\'s written content (the Creed itself) — same moment, two different views.', fact:'Fides Qua = the act of believing. Fides Quae = the content believed.'},
    {stop:'Baptismal Font by the Entrance', image:'An ancient stone basin has "CREDO" carved deep into its rim, with no signature — nobody knows who first wrote it.', fact:'Credo = "I believe"; the Apostles\' Creed has no single author.'},
    {stop:'Stained Glass Window', image:'Three glowing figures merge into one seamless beam of light shining through the glass — impossible to tell where one ends and the next begins.', fact:'The Holy Trinity: Father, Son, Holy Spirit — one God, three Persons.'},
    {stop:'Family Tree on the Wall', image:'A tree with one root (the Father, unbegotten), one branch begotten FROM that root (the Son), and a wind blowing FROM both onto everything else (the Spirit).', fact:'Father = origin without origin. Son = begotten by the Father. Holy Spirit = proceeds from Father and Son.'}
  ]},
  {id:'ff4', title:'4. The Bible: Old and New Testament', content:[
    {h:'The Bible', b:[
      'A faith-book written by and for believers; records events seen as designed/influenced by God; an EVENT of community.',
      'Composed of: Narratives, Genealogies, Laws, Prophetic Oracles, Poetry, Epistles, Drama, Apocalypses, Sayings, Biographical-sketches.',
      'Greek: Byblos (papyrus). Codex: papyrus stacked and bound together. Biblion: scroll/book (plural: biblia).',
      'How to distinguish Catholic books: Nihil Obstat ("nothing hinders," given by a Censor Librorum), Imprimi Potest ("it may be printed," given by the major religious superior), Imprimatur ("let it be printed," given by the author\'s diocesan bishop).'
    ]},
    {h:'Biblical Inspiration and Inerrancy', b:[
      'Inspiration (Latin, "to breathe into"): NOT ecstatic, NOT verbal/mechanical dictation, NOT subsequent approbation, NOT simply negative assistance, NOT mere ideological — the authors were not possessed; God was involved in the entire writing process, and every word was inspired.',
      'Biblical Inspiration: special influence of the Holy Spirit upon human authors so they write what God wanted (Dei Verbum, CCC 104, Pope Leo XIII\'s Providentissimus Deus).',
      'Biblical Inerrancy: freedom from error — the Bible contains error but teaches NO error; it teaches only the SAVING TRUTH.'
    ]},
    {h:'Formation and Canon of Scripture', b:[
      'Formation: Events and Experiences → Oral Tradition → Written Tradition (oral continued alongside) → Edited Tradition (authors refined/combined stories) → Canon of Scriptures (Church discerned which writings to include via apostolic Tradition).',
      'Canon: the official list of inspired books; means "measuring stick."',
      'Roman Catholic Bible: 73 (72) books — 46 Old Testament (45 if Jeremiah & Lamentations counted as one), 27 New Testament.',
      'Non-Catholic Bible: 66 books — 39 Old Testament, 27 New Testament.',
      'Apocrypha (Greek: "veiled or secret"): did not pass criteria for canonicity, considered heretical/irrelevant, cannot be used as standards of faith/morality, no apostolic guarantee.',
      'Deuterocanonicals ("second canon"): Catholics consider these equally inspired as the Protocanonicals — finalized at the Council of Trent, after which the Canon was closed.'
    ]},
    {h:'Unity of the Old and New Testament', b:[
      'The "Testament" is a solemn agreement (covenant) between God and Israel, fulfilled and universalized by Jesus.',
      'Old Testament: lesson on faithfulness through laws, stories, prophecies, wisdom literature; sacrifice = lamb; written primarily in Hebrew (some Greek).',
      'New Testament: tells of Jesus\' passion, life, death, resurrection; sacrifice = Jesus; written primarily in Greek (some Aramaic).'
    ]}
  ], quiz:[
    {q:'The Greek word "Byblos," root of "Bible," originally referred to:', c:['A scroll','Papyrus','A book cover','A type of ink'], a:1, e:'"Byblos" is the Greek word for papyrus, the material from which early books/scrolls were made.'},
    {q:'Which certification means "nothing hinders" and is given by a Censor Librorum?', c:['Imprimatur','Imprimi Potest','Nihil Obstat','Deuterocanonical'], a:2, e:'Nihil Obstat ("nothing hinders") is given by a Censor Librorum, attesting a book contains nothing damaging to faith or morals.'},
    {q:'Which certification, meaning "let it be printed," is given by the author\'s diocesan bishop?', c:['Nihil Obstat','Imprimatur','Imprimi Potest','Canon'], a:1, e:'Imprimatur ("let it be printed") is given by the author\'s diocesan bishop or the bishop of the place where the book is published.'},
    {q:'What does the Latin word "Inspiration" literally mean?', c:['To write down','To breathe into','To translate','To canonize'], a:1, e:'"Inspiration" comes from Latin meaning "to breathe into" — giving life or evidence of life.'},
    {q:'Biblical inspiration is NOT which of the following?', c:['Special influence of the Holy Spirit','Verbal or mechanical dictation','Guided by God throughout the process','Every word inspired by God'], a:1, e:'Biblical inspiration is explicitly NOT verbal or mechanical dictation — the authors were not possessed and went through the normal writing process, guided by God.'},
    {q:'Biblical inerrancy means the Bible:', c:['Has never had any surface-level discrepancies','Contains no errors at all in any subject, including science','Contains error but teaches no error — it teaches only the saving truth','Was dictated word-for-word by an angel'], a:2, e:'Biblical inerrancy means the Bible may contain surface-level inconsistencies, but it teaches NO error in matters necessary for salvation — the saving truth.'},
    {q:'How many books are in the Roman Catholic Bible?', c:['39','66','73','80'], a:2, e:'The Roman Catholic Bible has 73 (or 72, if Jeremiah & Lamentations are counted as one) books — 46 Old Testament, 27 New Testament.'},
    {q:'How many books are in the Non-Catholic Bible?', c:['39','66','73','27'], a:1, e:'The Non-Catholic Bible has 66 books — 39 Old Testament, 27 New Testament.'},
    {q:'"Deuterocanonical" literally means:', c:['First canon','Second canon','No canon','Ancient canon'], a:1, e:'"Deuterocanonical" means "second canon," referring to the second set of canonized books that Catholics consider equally inspired.'},
    {q:'Which council formally closed the Canon of the Bible, meaning no other books would be added?', c:['Council of Nicaea','Council of Trent','Second Vatican Council','Council of Jerusalem'], a:1, e:'The Council of Trent finalized and closed the Canon of Scripture, after which no further books would be added.'},
    {q:'What symbolic sacrifice is associated with the Old Testament?', c:['Jesus','A lamb','Bread and wine','Incense'], a:1, e:'The Old Testament\'s symbolic sacrifice is the lamb, later fulfilled by Jesus\' sacrifice in the New Testament.'},
    {q:'The New Testament was written primarily in which language?', c:['Hebrew','Greek','Latin','Aramaic'], a:1, e:'The New Testament was written primarily in Greek, with some parts in Aramaic.'}
  ], glossary:[

{id:'lcs', name:'LCS: Life Career Skills', lessons:[
{id:'lc1', title:'1. Human Development: Foundations', content:[
    {h:'Self-Concept & Development', b:[
      'Self-Concept: our cognition of ourselves — what we think/know about our identity, personality, individuality; a subjective description filtered by our own perceptions; purely/mostly informational.',
      'Ideal self and actual self are two broad categories of self-concept.',
      'Development: the pattern of change beginning at conception and continuing through the lifespan; involves both growth AND decline (e.g. morality may improve with age while physical ability declines).'
    ]},
    {h:'Nature vs. Nurture', b:[
      'Nature: biological/genetic predispositions (e.g. inheriting a parent\'s illness like diabetes or cancer).',
      'Nurture: influences of learning and environment (e.g. lifestyle, secondhand smoke exposure).',
      'Nature is largely uncontrollable, but a stable, supportive environment (nurture) can help manage genetic risk.'
    ]},
    {h:'Individual Differences & Factors Affecting Development', b:[
      'Age, Gender, and Ethnic Background may affect the developmental process.',
      'Risk Factors: internal and external conditions that NEGATIVELY affect development (e.g. smoking, poor sleep, not studying).',
      'Protective Factors: internal and external conditions that POSITIVELY affect development (e.g. friends who encourage studying).',
      'The same factor (like your social circle) can be protective or a risk factor depending on the influence it has on you.'
    ]},
    {h:'The 4 Domains of Developmental Stages', b:['Physical Development, Psycho-social Development, Cognitive Development, Moral Development.']}
  ], quiz:[
    {q:'Which term refers to our cognition of ourselves — what we think/know about our identity, personality, and individuality?', c:['Self-esteem','Self-concept','Self-regulation','Self-actualization'], a:1, e:'Self-concept is defined as a subjective description of who we think we are, filtered by our own perceptions.'},
    {q:'What are the two broad categories of self-concept?', c:['Ideal self and Actual self','Public self and Private self','Nature self and Nurture self','Physical self and Mental self'], a:0, e:'The two broad categories of self-concept are the ideal self and the actual self.'},
    {q:'Development is best described as:', c:['Only growth, with no decline','A pattern of change involving both growth and decline across the lifespan','A fixed state that never changes','Only relevant to childhood'], a:1, e:'Development is a pattern of change beginning at conception, involving both growth and decline (e.g. physical decline with age, even as morality/wisdom grows).'},
    {q:'Inheriting a parent\'s predisposition to a disease like diabetes is an example of:', c:['Nurture','Nature','A protective factor only','Individual differences only'], a:1, e:'This is an example of Nature — biological/genetic predispositions.'},
    {q:'Growing up exposed to secondhand smoke is an example of:', c:['Nature','Nurture','Neither nature nor nurture','A cognitive stage'], a:1, e:'This is an example of Nurture — the influence of environment and learning/exposure.'},
    {q:'Friends who encourage you to study are functioning as a:', c:['Risk factor','Protective factor','Nature factor','Individual difference'], a:1, e:'Friends who positively influence your development, like encouraging studying, act as a protective factor.'},
    {q:'Which of the following is NOT one of the 4 domains of developmental stages listed?', c:['Physical Development','Psycho-social Development','Financial Development','Moral Development'], a:2, e:'The 4 domains are Physical, Psycho-social, Cognitive, and Moral Development — "Financial Development" is not one of them.'}
  ], glossary:[
    {term:'Self-Concept', def:'our cognition of ourselves — what we think/know about our identity, personality, individuality.'},
    {term:'Nature', def:'biological/genetic predispositions.'},
    {term:'Nurture', def:'influences of learning and environment.'},
    {term:'Risk Factors', def:'internal/external conditions that negatively affect development.'},
    {term:'Protective Factors', def:'internal/external conditions that positively affect development.'}
  ], palace:[
    {stop:'Bathroom Mirror', image:'Two reflections argue in the mirror — one calling itself "Actual Self," the other "Ideal Self" — slowly inching closer together.', fact:'Healthy self-concept forms when actual self and ideal self are close together.'},
    {stop:'Family Photo Album', image:'One photo shows your face, the other shows a strand of DNA wearing your face too, arguing over whose fault your allergies are.', fact:'Nature = genetic predisposition. Nurture = environmental influence.'},
    {stop:'Two Doors Side by Side', image:'One door has a warning sign covered in red flags (Risk Factors); the other has a shield glowing gold (Protective Factors) — same hallway, opposite effects.', fact:'Risk factors negatively affect development; protective factors positively affect it.'}
  ]},
