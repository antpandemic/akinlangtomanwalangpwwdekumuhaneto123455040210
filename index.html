  {id:'pk10', title:'10. Kababaihan Noong Panahon ng Amerikano', content:[
    {h:'Paghahabi/Paghahanapbuhay', b:[
      'Paghahabi at pagbuburda ay kapaki-pakinabang na negosyo ng kababaihan; naging isa sa pangunahing eksport ng Pilipinas.',
      'Nagbukas ang panahon ng Amerikano ng oportunidad para makapagtapos ng kolehiyo at matuto ng negosyo.',
      'Naempleyo sa mga posisyong managerial: tela, alahas, burda, sanglaan, bigas, panaderya, real estate, transportasyon, retail.',
      'Hindi pa sila makaboto noong panahong ito; nagbago lamang noong panahon ni Quezon.'
    ]},
    {h:'Edukasyon', b:[
      'Naghanda sa kababaihan upang tumugon sa pangangailangan ng burukrasya at ekonomiyang kolonyal.',
      'Sa pagtaas ng literasiya, mas marami ang nagkaroon ng akses sa bagong uri ng trabaho, gaya ng batas at agham (Sobritchea, 1996).'
    ]}
  ], quiz:[
    {q:'Isang babae noong panahon ng Amerikano ang kumita sa pampublikong pamilihan gamit ang kanyang kasanayan sa tela. Ano ang kanyang hanapbuhay?', c:['Paghahabi/Pagbuburda','Pagmimina','Pagsasaka ng palay','Panggagatong'], a:0},
    {q:'Pahayag A: Nakaboto na ang kababaihan noong unang dumating ang mga Amerikano. Pahayag B: Nagbago lamang ito noong panahon ni Quezon. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','A ay mali, B ay tama'], a:3},
    {q:'Ayon kay Sobritchea (1996), ano ang naging resulta ng pagtaas ng literasiya ng kababaihan?', c:['Higit na akses sa bagong trabaho gaya ng batas at agham','Bawal silang mag-aral','Wala silang naging oportunidad','Nabawasan ang kanilang kalayaan'], a:0},
    {q:'Alin sa mga sumusunod ang HINDI kabilang sa mga larangang pinamunuan ng kababaihan bilang managerial?', c:['Tela at katutubong damit','Alahas at burda','Real estate at transportasyon','Batas militar'], a:3},
    {q:'Isang kabataang babae noong panahong iyon ang nag-aral ng batas dahil sa bagong akses sa edukasyon. Anong salik ang nagbigay-daan dito?', c:['Pagtaas ng literasiya','Pagbagsak ng Bataan','Encomienda System','Reduccion'], a:0},
    {q:'Pahayag A: Ang pagbuburda ay naging isa sa pangunahing eksport ng Pilipinas noong panahon ng Amerikano. Pahayag B: Ang kababaihan ay hindi pinayagang mag-empleyo sa negosyo. Alin ang tama?', c:['Parehong tama','A lamang ang tama','B lamang ang tama','Parehong mali'], a:1},
    {q:'Ano ang naging epekto ng pagbubukas ng edukasyon sa kababaihan noong panahon ng Amerikano?', c:['Nakapagtapos sila ng kolehiyo at natuto ng negosyo','Wala silang natutunan','Bawal na silang mag-aral','Nawalan sila ng access sa negosyo'], a:0},
    {q:'Ang edukasyon noong panahon ng Amerikano ay naghanda sa kababaihan upang:', c:['Tumugon sa pangangailangan ng burukrasya at ekonomiyang kolonyal','Manatili sa bahay lamang','Sumali sa militar','Magtayo ng simbahan'], a:0},
    {q:'Anong larangan ang HINDI kabilang sa negosyong pinamunuan ng kababaihan noong Amerikano?', c:['Sanglaan','Panaderya','Batas militar','Retail'], a:2},
    {q:'Kailan lamang nagkaroon ng karapatang bumoto ang kababaihan sa Pilipinas?', c:['Sa unang pagdating ng Amerikano','Sa panahon ni Quezon','Sa panahon ng Espanyol','Hindi pa hanggang ngayon'], a:1}
  ],
  glossary:[
    {term:'Naempleyo sa mga posisyong managerial', def:'tela, alahas, burda, sanglaan, bigas, panaderya, real estate, transportasyon, retail.'}
  ]},
  {id:'pk11', title:'11. Hamon ng Okupasyong Hapones', content:[
    {h:'Pearl Harbor at Pagbagsak ng Bataan', b:[
      'Dec. 7, 1941 — dinaasahang aerial attack ng Hapon na nagdala ng WW2.',
      'Dec. 8, 1941 — binomba ng Hapon ang Maynila; idineklara itong "open city" ni Gen. Douglas MacArthur.',
      'Bataan Death March — maraming namatay sa Capas, Tarlac; may nagpanggap na patay para makatakas at sumapi sa Hukbalahap.'
    ]},
    {h:'Co-Prosperity Sphere at Gerilya', b:[
      'Konseptong nagtuturo ng wika at kulturang Hapones; binawasan ang impluwensya ng Amerika.',
      'Unang kinanta ang Pambansang Awit sa Tagalog dahil gusto ng mga Amerikano na Ingles ito.',
      'Mas brutal ang mga Hapones kaysa sa mga Amerikano.',
      'Guerilla Warfare — maraming sundalong nakatakas ay sumapi sa organisasyong gerilya (hal. Hunters Guerilla), pinadali ang pagbalik ni MacArthur.'
    ]}

    {q:'Pahayag A: Sinalakay ng Hapon ang Pearl Harbor noong Dec. 7, 1941. Pahayag B: Kinabukasan, binomba na rin ang Maynila. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Upang mailigtas ang Maynila sa pagkawasak noong dumating ang Hapon, ano ang ginawang deklarasyon ni Gen. MacArthur?', c:['Martial Law','Open City','Ceasefire','Surrender'], a:1},
    {q:'Isang programang pangkultura ang itinuro ng Hapon upang bawasan ang impluwensya ng Amerika sa Pilipinas. Ano ito?', c:['La Solidaridad','Co-Prosperity Sphere','Propaganda Movement','Cofradia de San Jose'], a:1},
    {q:'Alin sa mga sumusunod ang HINDI totoo tungkol sa okupasyong Hapones?', c:['Unang kinanta ang Pambansang Awit sa Tagalog noon','Mas brutal ang mga Hapones kaysa Amerikano','Walang gerilyang Pilipino noong panahong ito','Tinulungan ni MacArthur ang pagbabalik gamit ang gerilya'], a:2},
    {q:'Maraming sundalong nakatakas mula sa "Death March" mula Bataan at Corregidor ay:', c:['Sumuko agad sa Hapon','Sumapi o nagtatag ng organisasyong gerilya','Umuwi sa Espanya','Nagtayo ng bagong pamahalaan'], a:1},
    {q:'Pahayag A: Ang "Hunters Guerilla" ay isang organisasyong gerilya. Pahayag B: Pinadali nito ang pagbabalik ni MacArthur sa Pilipinas. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Anong petsa binomba ng Hapon ang Pearl Harbor?', c:['Dec. 7, 1941','Dec. 8, 1941','Jan. 1, 1942','Feb. 25, 1945'], a:0},
    {q:'Saan naganap ang malaking bilang ng kamatayan sa Bataan Death March?', c:['Capas, Tarlac','Corregidor','Maynila','Cavite'], a:0},
    {q:'Ang Co-Prosperity Sphere ay layuning ituro ang:', c:['Wika at kulturang Hapones','Wikang Ingles','Doktrinang Katoliko','Sistemang Espanyol'], a:0},
    {q:'Bakit unang kinanta ang Pambansang Awit sa Tagalog sa panahon ng Hapon?', c:['Dahil ayaw ng Amerikano na Ingles ito noon','Dahil sinabi ng Hapon','Dahil walang alam na Ingles','Wala sa mga ito'], a:0}
  ],
  glossary:[
    {term:'Bataan Death March', def:'maraming namatay sa Capas, Tarlac; may nagpanggap na patay para makatakas at sumapi sa Hukbalahap.'},
    {term:'Guerilla Warfare', def:'maraming sundalong nakatakas ay sumapi sa organisasyong gerilya (hal. Hunters Guerilla), pinadali ang pagbalik ni MacArthur.'}
  ]}

{id:'effcom1', name:'EffCom1: Communication', lessons:[
  {id:'ec1', title:'1. Communication Basics & Verbal/Nonverbal', content:[
    {h:'Communication', b:[
      'From Latin "communicare" (to share). 2-way process between sender and receiver.',
      '2 levels of meaning: content and relationship.'
    ]},
    {h:'Verbal Communication', b:[
      'Rule-specific — almost always planned, unlike spontaneous non-verbal cues. Language is its most important aspect.',
      'Language is Arbitrary (no natural connection between a word and what it represents — meaning exists only because people agree on it), Conventional (follows shared rules and social agreement), and Living/Evolving (changes over time).',
      'Example: Saying "Good morning, ma\'am. May I ask a question?" before speaking in class is planned, rule-following verbal communication.'
    ]},
    {h:'Verbal Communication Principles (CAVE B)', b:[
      'Appropriateness — the message fits the context/situation. Example: using formal language in a job interview instead of casual slang.',
      'Brevity — simple but precise and meaningful; no unnecessary words. Example: "Meeting moved to 3 PM" instead of a long, wordy explanation.',
      'Clarity — the message is understandable. Example: "Turn left at the second intersection" instead of a vague "just go that way."',
      'Ethics — consider G-R-E-P-S (Gender, Roles, Ethnicity, Preference, and Status) when delivering a message. Example: avoiding culturally insensitive jokes when addressing a diverse audience.',
      'Vividness — focus on concrete rather than abstract language. Example: describing "a blazing orange sky over calm waters" instead of just saying "it was pretty."'
    ]},
    {h:'Non-Verbal Communication', b:[
      'Unstructured, spontaneous — facial expressions, gestures, body language.',
      'Proxemics: Intimate (1-1.5ft), Personal (1.5-4ft), Social (4-12ft), Public (12ft+).',
      'Paralinguistics: intonation, voice quality, stress, tone, volume.',
      'Haptics (touch), appearance, eye gaze.'
    ]},
    {h:'9 Communication Principles', b:['Congruency','Conciseness','Clarity','Consistency','Consider the audience','Content','Checking for understanding','Choosing the right medium','Common Language']}
  ], quiz:[

    {q:'"Communicare" is a Latin word meaning:', c:['To argue','To share','To listen','To command'], a:1},
    {q:'Which proxemic zone covers 1.5-4 feet, used for friendly/casual interaction?', c:['Intimate','Personal','Social','Public'], a:1},
    {q:'A shaky voice during a speech is an example of:', c:['Haptics','Paralinguistics (voice quality)','Proxemics','Kinesics'], a:1},
    {q:'The principle "CAVE B" excludes which of the following?', c:['Clarity','Vividness','Brevity','Consistency'], a:3},
    {q:'A student saying "Just pass it there later" without specifying what violates:', c:['Conciseness','Clarity','Congruency','Consistency'], a:1},
    {q:'Communication having "content" and "relationship" refers to:', c:['Types of channels','2 levels of meaning','Types of noise','Types of feedback'], a:1},
    {q:'Which proxemic zone covers a distance of 1-1.5 ft?', c:['Personal','Public','Intimate','Social'], a:2},
    {q:'Two people are interacting e.g. hugging a close family member or whispering to a partner, roughly 1-1.5 ft apart. Which proxemic zone is this?', c:['Personal','Public','Intimate','Social'], a:2},
    {q:'Which proxemic zone covers a distance of 1.5-4 ft?', c:['Public','Intimate','Personal','Social'], a:2},
    {q:'Two people are interacting e.g. chatting comfortably with a close friend or coworker, roughly 1.5-4 ft apart. Which proxemic zone is this?', c:['Public','Intimate','Personal','Social'], a:2},
    {q:'Which proxemic zone covers a distance of 4-12 ft?', c:['Social','Intimate','Public','Personal'], a:0},
    {q:'Two people are interacting e.g. a job interview or a conversation with a new acquaintance, roughly 4-12 ft apart. Which proxemic zone is this?', c:['Social','Intimate','Public','Personal'], a:0},
    {q:'Which proxemic zone covers a distance of 12+ ft?', c:['Public','Social','Personal','Intimate'], a:0},
    {q:'Two people are interacting e.g. a teacher lecturing a class or a speaker addressing an audience, roughly 12+ ft apart. Which proxemic zone is this?', c:['Public','Social','Personal','Intimate'], a:0},
    {q:'Which distance range corresponds to the Intimate proxemic zone?', c:['Personal (1.5-4 ft)','Social (4-12 ft)','Intimate (1-1.5 ft)','Public (12+ ft)'], a:2},
    {q:'Which distance range corresponds to the Personal proxemic zone?', c:['Personal (1.5-4 ft)','Social (4-12 ft)','Intimate (1-1.5 ft)','Public (12+ ft)'], a:0},
    {q:'Which distance range corresponds to the Social proxemic zone?', c:['Intimate (1-1.5 ft)','Social (4-12 ft)','Public (12+ ft)','Personal (1.5-4 ft)'], a:1},
    {q:'A speaker addresses a large audience from the front of an auditorium, well over 12 feet away. Which proxemic zone applies?', c:['Personal (1.5-4 ft)','Social (4-12 ft)','Intimate (1-1.5 ft)','Public (12+ ft)'], a:3},
    {q:'Which of the 9 communication principles refers to: "verbal and nonverbal messages align with each other"?', c:['Congruency','Checking for understanding','Clarity','Consistency'], a:0},
    {q:'Which of the 9 communication principles refers to: "stating the message in the fewest words needed without losing meaning"?', c:['Clarity','Consistency','Content','Conciseness'], a:3},
    {q:'Which of the 9 communication principles refers to: "the message is easily understood, free of ambiguity"?', c:['Clarity','Common Language','Congruency','Content'], a:0},
    {q:'Which of the 9 communication principles refers to: "messages do not contradict each other over time"?', c:['Clarity','Common Language','Consistency','Choosing the right medium'], a:2},
    {q:'Which of the 9 communication principles refers to: "adapting the message to fit the audience\'s background and needs"?', c:['Congruency','Consider the audience','Checking for understanding','Common Language'], a:1},
    {q:'Which of the 9 communication principles refers to: "the actual information or subject matter being conveyed"?', c:['Consistency','Consider the audience','Content','Common Language'], a:2},
    {q:'Which of the 9 communication principles refers to: "verifying that the receiver correctly understood the message"?', c:['Choosing the right medium','Content','Checking for understanding','Common Language'], a:2},
    {q:'Which of the 9 communication principles refers to: "selecting the best channel/platform to deliver a message"?', c:['Common Language','Clarity','Content','Choosing the right medium'], a:3},
    {q:'Which of the 9 communication principles refers to: "using words and terms that both parties understand"?', c:['Common Language','Congruency','Clarity','Consistency'], a:0},
    {q:'A manager says "I\'m not upset" while clenching their fists and avoiding eye contact, sending a mixed signal. Which principle is being VIOLATED here?', c:['Conciseness','Congruency','Common Language','Clarity'], a:1},
    {q:'A student writes a three-paragraph email when a two-sentence message would have delivered the same request. Which principle is being VIOLATED here?', c:['Common Language','Consider the audience','Conciseness','Choosing the right medium'], a:2},
    {q:'A teacher gives an assignment instruction so vague that half the class interprets it differently. Which principle is being VIOLATED here?', c:['Choosing the right medium','Consistency','Clarity','Content'], a:2},
    {q:'A supervisor tells one employee the deadline is Friday and another employee the deadline is Monday for the same task. Which principle is being VIOLATED here?', c:['Clarity','Checking for understanding','Choosing the right medium','Consistency'], a:3},
    {q:'A doctor explains a diagnosis using complex medical jargon to a young child patient. Which principle is being VIOLATED here?', c:['Consider the audience','Conciseness','Choosing the right medium','Common Language'], a:0},
    {q:'A trainer finishes a demonstration and immediately moves on without asking if anyone has questions. Which principle is being VIOLATED here?', c:['Congruency','Consider the audience','Checking for understanding','Consistency'], a:2},
    {q:'An urgent safety alert is sent via a slow-moving printed newsletter instead of a text message. Which principle is being VIOLATED here?', c:['Congruency','Conciseness','Choosing the right medium','Consistency'], a:2},

  glossary:[
    {term:'Proxemics', def:'Intimate (1-1.5ft), Personal (1.5-4ft), Social (4-12ft), Public (12ft+).'},
    {term:'Paralinguistics', def:'intonation, voice quality, stress, tone, volume.'},
    {term:'Appropriateness (CAVE B)', def:'The message fits the context/situation. Example: using formal language in a job interview instead of casual slang.'},
    {term:'Brevity (CAVE B)', def:'Simple but precise and meaningful; no unnecessary words. Example: "Meeting moved to 3 PM" instead of a long explanation.'},
    {term:'Clarity (CAVE B)', def:'The message is understandable. Example: "Turn left at the second intersection" instead of a vague direction.'},
    {term:'Ethics (CAVE B / GREPS)', def:'Consider Gender, Roles, Ethnicity, Preference, and Status when delivering a message. Example: avoiding culturally insensitive jokes for a diverse audience.'},
    {term:'Vividness (CAVE B)', def:'Focus on concrete rather than abstract language. Example: "a blazing orange sky over calm waters" instead of "it was pretty."'},
    {term:'Arbitrary (Language)', def:'No natural connection between a word and what it represents — meaning exists only because people agree on it.'},
    {term:'Conventional (Language)', def:'Language follows shared rules and social agreement.'}
  ]},

  {id:'ec7', title:'7. Mga Kakayahang Komunikatibo (Pragmatiko, Strategic, Sosyolinggwistiko)', content:[
    {h:'Pragmatiko', b:[
      'Kakayahang maunawaan ang iba\'t ibang kontekstong panlipunan at makabuo ng tamang interpretasyon.',
      'Speech Act Theory (John Austin, 1962): Locutionary Act (linggwistikong pahayag), Illocutionary Act (intensyon/gamit), Perlocutionary Act (epekto).',
      'Pagpapahiwatig (Maggay 2002): hindi tuwirang pagpapahayag na nauunawaan dahil sa matalas na pakiramdam.',
      'Eupemismo — paggamit ng kaaya-ayang pahayag imbis na diretso (hal. "pumanaw" imbis na "namatay").'
    ]},
    {h:'Strategic', b:[
      'Pag-ayos/pagtama sa gamit ng wika bilang remedyo o interbensyon; blocking and transitional devices.'
    ]},
    {h:'Berbal (Linggwistiko)', b:[
      'Kahusayan sa wastong gamit ng wika batay sa ponema, morpema, semantika, sintaksis.',
      'NG — kasunod na salita ay pangngalan o pang-uri. NANG — katumbas ng "noong"/"when", pariralang pang-abay, sa pagitan ng inuulit na pandiwa (tahol NANG tahol), katumbas ng "upang/para".',
      'MAY — kasunod ay pangngalan, pang-uri, pandiwa, pang-abay, "mga". MAYROON — panghalip panao, pagsagot sa tanong.'
    ]},
    {h:'Sosyolinggwistiko at Diskorsal', b:[
      'Sosyolinggwistiko — gamit ng wika batay sa kultura at konteksto (kaangkupan).',
      'SPEAKING framework (Dell Hymes, 1974): Setting, Participant, Ends, Act sequence, Keys, Instrumentalities, Norms, Genre.',
      'Diskorsal — paglahok sa talakayan sa anyo ng pasulat, pasalita, pakikinig, panonood, pagbasa (produktibo vs. receptibo).'
    ]}
  ], quiz:[
    {q:'Pahayag A: Ang Speech Act Theory ay iniugnay kay John Austin. Pahayag B: Ang SPEAKING framework ay iniugnay kay Dell Hymes. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},

    {q:'Alin sa mga sumusunod ang HINDI kasama sa SPEAKING framework ni Dell Hymes?', c:['Setting','Ends','Genre','Grammar'], a:3},
    {q:'Isang estudyante ang nanonood ng dokumentaryo at nakikinig sa lecture. Anong uri ng kasanayan ang kanyang ginagamit?', c:['Produktibo','Receptibo','Strategic','Pragmatiko'], a:1},
    {q:'Ang Locutionary Act sa Speech Act Theory ay tumutukoy sa:', c:['Aktwal na sinabing salita/pahayag','Intensyon sa likod ng pahayag','Epekto ng pahayag sa nakikinig','Kaangkupan sa kultura'], a:0},
    {q:'Ang Perlocutionary Act ay tumutukoy sa:', c:['Aktwal na pahayag','Layunin ng nagsasalita','Epekto ng pahayag sa tagapakinig','Gamit ng salitang NANG'], a:2},
    {q:'Alin sa mga sumusunod ang tamang paggamit ng "MAY"?', c:['May aso sa bahay','Mayroon ako','Tahol NANG tahol','Pumunta NANG maaga'], a:0},
    {q:'Ang kakayahang pragmatiko ay tumutukoy sa:', c:['Kahusayan sa gramatika lamang','Pag-unawa sa konteksto at tamang interpretasyon','Kakayahang magsalita ng maraming wika','Kaalaman sa panitikan'], a:1},
    {q:'Ang Sosyolinggwistiko na kakayahan ay may kinalaman sa:', c:['Kaangkupan ng wika batay sa kultura at konteksto','Bilang ng salitang alam ng tao','Bilis ng pagsasalita','Uri ng panitikan'], a:0},
    {q:'Sino ang bumuo ng Speech Act Theory noong 1962?', c:['Dell Hymes','John Austin','Maggay','Kenneth Goodman'], a:1},
    {q:'Ang "Keys" sa SPEAKING framework ay tumutukoy sa:', c:['Tono o himig ng pagsasalita','Setting ng usapan','Layunin ng usapan','Kasanayan sa pagbasa'], a:0},
    {q:'Ang diskorsal na kasanayan ay may dalawang uri: produktibo at:', c:['Interaktibo','Receptibo','Pragmatiko','Sosyal'], a:1},
    {q:'Ang paggamit ng eupemismo ay may layuning:', c:['Gawing mas kaaya-aya ang isang diretsahang pahayag','Palitan ang tunay na kahulugan ng salita','Lituhin ang tagapakinig','Ipakita ang kapangyarihan'], a:0}
  ],
  glossary:[
    {term:'Pagpapahiwatig (Maggay 2002)', def:'hindi tuwirang pagpapahayag na nauunawaan dahil sa matalas na pakiramdam.'},
    {term:'Eupemismo', def:'paggamit ng kaaya-ayang pahayag imbis na diretso (hal. "pumanaw" imbis na "namatay").'},
    {term:'NG', def:'kasunod na salita ay pangngalan o pang-uri. NANG — katumbas ng "noong"/"when", pariralang pang-abay, sa pagitan ng inuulit na pandiwa (tahol NANG tahol), katumbas ng "upang/para".'},
    {term:'MAY', def:'kasunod ay pangngalan, pang-uri, pandiwa, pang-abay, "mga". MAYROON — panghalip panao, pagsagot sa tanong.'},
    {term:'Sosyolinggwistiko', def:'gamit ng wika batay sa kultura at konteksto (kaangkupan).'},
    {term:'Diskorsal', def:'paglahok sa talakayan sa anyo ng pasulat, pasalita, pakikinig, panonood, pagbasa (produktibo vs. receptibo).'}
  ]},
  {id:'ec8', title:'8. Mabisang Pagbasa', content:[
    {h:'Pagbasa: Batayang Kaalaman', b:[
      '"Becoming a Nation of Readers" (Anderson et al., 1985) — proseso ng pagbuo ng kahulugan mula sa nakasulat na teksto.',
      'Psycholinguistic guessing game (Kenneth Goodman); Pagtatanong at pagsagot (Frank Smith); Interaksyon ng kaalaman, impormasyon, at konteksto (Wixson et al., 1987).'
    ]},
    {h:'Yugto at Gawain', b:[
      'Bago — pisikal at sikolohikal na paghahanda; inisyal na pagsiyasat, pagtingin sa index, pagbuo ng tanong/prediksyon.',
      'Habang — pagproseso tungo sa pagkakaunawa; biswalisasyon, paghihinuha, pagsubaybay sa komprehensyon, graphic organizer.',
      'Pagkatapos — pagtiyak sa pagkaunawa; pagbubuod, sintesis, ebalwasyon.'
    ]},
    {h:'Mga Mahalagang Termino', b:[
      'Paraphrase — muling pagpapahayag ng ideya sa ibang pamamaraan.',
      'Abstract — buod ng pananaliksik o pag-aaral. Review — kritisismong pampanitikan batay sa nilalaman, estilo, anyo.'
    ]},
    {h:'Mga Hakbang sa Pagbabasa', b:[
      'Persepsyon — pagkilala at pagbigkas nang wasto sa mga simbolo.',
      'Komprehensyon — pagproseso ng impormasyon o kaisipang ipinapahayag sa binabasa.'
    ]}
  ], quiz:[
    {q:'Pahayag A: Si Kenneth Goodman ang nag-ugnay sa pagbasa bilang "psycholinguistic guessing game." Pahayag B: Si Frank Smith ang bumuo ng "pagtatanong at pagsagot." Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Bago pa man buksan ng isang mag-aaral ang aklat, sinuri na niya ang pabalat at nagtanong sa sarili tungkol sa nilalaman nito. Anong yugto ito?', c:['Bago magbasa','Habang nagbabasa','Pagkatapos magbasa','Diskorsal'], a:0},
    {q:'Isang mananaliksik ang gumawa ng maikling buod ng kanyang pag-aaral bago ang kumperensya. Tawag dito ay:', c:['Paraphrase','Abstract','Review','Persepsyon'], a:1},
    {q:'Muling isinulat ng isang estudyante ang ideya ng may-akda gamit ang sariling salita upang mas maunawaan ito. Anong ginagawa niya?', c:['Paraphrase','Abstract','Review','Komprehensyon'], a:0},
    {q:'Alin sa mga sumusunod ang HINDI kabilang sa mga hakbang sa pagbabasa?', c:['Persepsyon','Komprehensyon','Sosyalisasyon','Wala sa nabanggit — pareho'], a:2},
    {q:'Isang guro ang nagpasagot sa mga estudyante ng mga tanong pagkatapos nilang magbasa upang tiyakin ang kanilang pagkaunawa. Anong yugto ito?', c:['Bago','Habang','Pagkatapos','Diskorsal lamang'], a:2},
    {q:'Sino ang may-akda ng "Becoming a Nation of Readers" (1985)?', c:['Anderson et al.','Kenneth Goodman','Frank Smith','Wixson et al.'], a:0},
    {q:'Sino ang nag-ugnay sa pagbasa bilang "psycholinguistic guessing game"?', c:['Frank Smith','Kenneth Goodman','Anderson','Wixson'], a:1},
    {q:'Ang biswalisasyon at paghihinuha ay ginagawa sa aling yugto ng pagbasa?', c:['Bago','Habang','Pagkatapos','Wala'], a:1},
    {q:'Ang pagbubuod at ebalwasyon ay ginagawa sa aling yugto ng pagbasa?', c:['Bago','Habang','Pagkatapos','Persepsyon'], a:2},
    {q:'Ang Komprehensyon bilang hakbang sa pagbabasa ay tumutukoy sa:', c:['Pagkilala at pagbigkas ng simbolo','Pagproseso ng impormasyon o kaisipan','Pagsulat ng balangkas','Pagsasalin ng wika'], a:1},
    {q:'Ang Persepsyon bilang hakbang sa pagbabasa ay tumutukoy sa:', c:['Pagkilala at wastong pagbigkas ng mga simbolo','Pagbubuod ng teksto','Pagsusuri ng estilo','Pagpapahiwatig'], a:0},
    {q:'Ang paggamit ng graphic organizer ay ginagawa sa aling yugto?', c:['Bago','Habang','Pagkatapos','Diskorsal'], a:1},
    {q:'Ang "Review" bilang termino sa pagbasa ay tumutukoy sa:', c:['Buod ng pananaliksik','Kritisismong pampanitikan batay sa nilalaman, estilo, anyo','Muling pagsasalaysay','Pagsasalin sa ibang wika'], a:1},
    {q:'Ang pagtingin sa index bago basahin ang buong aklat ay bahagi ng aling yugto?', c:['Bago magbasa','Habang nagbabasa','Pagkatapos magbasa','Diskorsal'], a:0}
  ],

    {term:'Persepsyon', def:'pagkilala at pagbigkas nang wasto sa mga simbolo.'},

{id:'gensci', name:'GenSci', lessons:[
  {id:'gs1', title:'1. The Unifying Themes of Life', content:[
    {h:'Viruses', b:['Obligatory intracellular organisms, like parasites; can\'t metabolize on their own — bridge between living and non-living.']},
    {h:'Metabolism', b:['Anabolic (build): photosynthesis.','Catabolic (break): alcohol fermentation, lactic acid production.']},
    {h:'Reproduction', b:['Asexual: budding (hydra), binary fission (E. coli, ~20 min generation time).','Sexual: gametogenesis, fertilization via chemotaxis, zona pellucida, cortical reaction.']},
    {h:'Homeostasis', b:['Maintenance of internal stability (temperature, pH, nutrients). Sweating & shivering regulate temperature; hypothalamus regulates temp & osmotic pressure; pancreas regulates blood sugar.']},
    {h:'Other Themes', b:['Growth & Development, Movement (phototropism, chemotaxis), Heredity, Evolution (natural selection, Darwin\'s theory).']}
  ], quiz:[
    {q:'Why are viruses considered the "bridge between living and non-living"?', c:['They can fly','They cannot metabolize on their own','They have no DNA','They are visible to the naked eye'], a:1},
    {q:'Binary fission, seen in E. coli, has a generation time of about:', c:['20 seconds','20 minutes','20 hours','20 days'], a:1},
    {q:'The process where sperm follow chemical signals to the egg is called:', c:['Chemotaxis','Phototropism','Osmoregulation','Homeostasis'], a:0},
    {q:'Which organ regulates body temperature and osmotic pressure?', c:['Pancreas','Hypothalamus','Kidney','Liver'], a:1},
    {q:'Fever is best described as:', c:['A sickness','An immune response to foreign invaders','A random event','A digestive process'], a:1},
    {q:'Photosynthesis is an example of a(n) __ process.', c:['Catabolic','Anabolic','Osmotic','Homeostatic'], a:1},
    {q:'Alcohol fermentation is an example of a(n) __ process.', c:['Anabolic','Catabolic','Osmotic','Genetic'], a:1},
    {q:'Budding, seen in organisms like hydra, is a form of:', c:['Sexual reproduction','Asexual reproduction','Fermentation','Homeostasis'], a:1},
    {q:'Which structure protects the egg during fertilization and prevents multiple sperm from entering?', c:['Zona pellucida','Mitochondria','Chloroplast','Nucleolus'], a:0},
    {q:'Sweating and shivering are both mechanisms the body uses to maintain:', c:['Digestion','Temperature homeostasis','Reproduction','Growth'], a:1},
    {q:'The movement of plant leaves toward sunlight is called:', c:['Chemotaxis','Phototropism','Osmoregulation','Fermentation'], a:1},
    {q:'Which theory explains how species change their heritable traits over generations?', c:['Cell Theory','Theory of Evolution','Germ Theory','Big Bang Theory'], a:1},
    {q:'Viruses are considered "obligatory intracellular" because they:', c:['Can only live and replicate inside a host cell','Live only in water','Can survive without any host','Are always harmless'], a:0},
    {q:'Which of the following is NOT one of the unifying themes of life discussed?', c:['Metabolism','Reproduction','Homeostasis','Photosynthesis alone'], a:3},
    {q:'The passing of traits from parents to offspring is called:', c:['Heredity','Homeostasis','Metabolism','Chemotaxis'], a:0, e:'Heredity is the passing of genetic information/traits from parents to offspring, contributing to diversity and evolution.'},
    {q:'Cellular respiration is best classified as a(n) __ process.', c:['Anabolic','Catabolic','Osmotic','Non-metabolic'], a:1, e:'Cellular respiration breaks down glucose to release energy, making it a catabolic process, just like fermentation.'},
    {q:'Building large molecules from smaller ones, like assembling glucose during photosynthesis, is called:', c:['Catabolism','Anabolism','Osmoregulation','Chemotaxis'], a:1, e:'Anabolic reactions build larger molecules from smaller ones (e.g. photosynthesis assembling glucose from CO2 and water).'},
    {q:'Metabolism is best defined as:', c:['Only the breakdown of molecules','All the chemical reactions in an organism necessary to maintain life','Only the process of reproduction','Only movement of an organism'], a:1, e:'Metabolism encompasses ALL chemical reactions in an organism needed to maintain life — both anabolic (building) and catabolic (breaking down).'},
    {q:'Without metabolism, an organism cannot:', c:['Grow, reproduce, or respond to its environment','Only reproduce','Only grow','Only respond to stimuli, but can still grow'], a:0, e:'The notes state metabolism is essential — without it, an organism cannot grow, reproduce, or respond to its environment.'},
    {q:'Yeast performing alcohol fermentation is best described as what kind of organism?', c:['Aerobic only','Anaerobic','Photosynthetic','Multicellular only'], a:1, e:'Yeast is an anaerobic organism, meaning it can survive and generate energy (via fermentation) without oxygen.'},
    {q:'Alcohol fermentation breaks down sugar into 2 molecules of carbon dioxide and:', c:['Water','Ethanol (ATP)','Lactic acid','Oxygen'], a:1, e:'Alcohol fermentation breaks down sugar into 2 molecules of CO2 and ethanol, releasing usable energy (ATP) in the process.'},
    {q:'Lactic acid is produced when glucose breaks down into 2 molecules of pyruvate, and then into:', c:['Ethanol','Lactate','Oxygen','Water only'], a:1, e:'In lactic acid fermentation, pyruvate (from glucose breakdown) is converted into lactate, which is the body\'s temporary energy source when oxygen is limited.'},
    {q:'Why does respiration rate increase when a person is working out or playing sports?', c:['To slow down all metabolism','To replenish oxygen and support cellular respiration','To stop cellular respiration entirely','To reduce lactic acid production only'], a:1, e:'Physical activity increases the body\'s oxygen demand; a higher respiration rate helps replenish oxygen to sustain cellular respiration (energy production).'},
    {q:'Which of the following describes "budding" as a mode of reproduction?', c:['Two organisms combine genetic material','A new organism grows from a bud that may stay attached or detach, resulting from mitotic cell division','A single cell splits into two identical halves rapidly','Only occurs in humans'], a:1, e:'Budding, seen in organisms like hydra, results from mitotic cell division, forming a new organism that may remain attached or detach from the parent.'},
    {q:'Binary fission is described in the notes as a "rapid type of reproduction" — which organism is used as the example?', c:['Hydra','E. coli','Yeast','Amoeba'], a:1, e:'E. coli, a bacterium, reproduces via binary fission with a very short generation time of about 20 minutes, making it a rapid form of reproduction.'},
    {q:'Where does sperm fertilization typically occur in the human body?', c:['The ovary','The fallopian tube','The uterus lining','The cervix'], a:1, e:'Fertilization typically occurs in the fallopian tube, where sperm cells travel toward the egg via chemotaxis.'},
    {q:'What triggers the sperm to move toward the egg during fertilization?', c:['Random movement with no direction','Chemical signals released by the oocyte (chemotaxis)','Light signals (phototaxis)','Physical push from the uterus'], a:1, e:'Sperm cells navigate toward the egg through chemotaxis — following chemical signals released by the oocyte.'},
    {q:'What is the "cortical reaction" during fertilization?', c:['A reaction that hardens the zona pellucida to prevent polyspermy once one sperm enters','A reaction that attracts more sperm','A process unrelated to fertilization','A reaction that destroys the egg'], a:0, e:'Once a single sperm successfully enters the egg, the "cortical reaction" hardens the zona pellucida to prevent polyspermy (multiple sperm fertilizing the same egg).'},
    {q:'What genetic events during meiosis (in gametogenesis) create genetic diversity in the resulting zygote?', c:['Crossing over, genetic combination, and independent assortment','Only mitosis','Random mutation exclusively','Binary fission'], a:0, e:'During meiosis in gametogenesis, crossing over, genetic combination, and independent assortment work together to create a genetically diverse zygote.'},
    {q:'Monozygotic (identical) twins form when:', c:['Two separate eggs are fertilized by two sperm','A single zygote randomly splits into two separate embryos early in development','Sperm cells combine before fertilization','A zygote fails to develop'], a:1, e:'Monozygotic twins result from a random developmental event where a single fertilized zygote splits into two separate embryos during early development.'},
    {q:'Gametogenesis refers to spermatogenesis in the testes and __ in the ovary.', c:['Fertilization','Oogenesis','Chemotaxis','Cortical reaction'], a:1, e:'Gametogenesis includes spermatogenesis (sperm production in the testes) and oogenesis (egg production in the ovary).'},
    {q:'Which of the following BEST defines homeostasis?', c:['The process of reproduction','Maintenance of internal stability despite external changes','The breakdown of glucose','The passing of genetic traits'], a:1, e:'Homeostasis is the maintenance of internal stability (like temperature, pH, nutrient levels) despite changes in the external environment.'},
    {q:'What is the average human body temperature mentioned in the notes?', c:['35°C','37°C','40°C','32°C'], a:1, e:'The notes state that 37°C is the average human body temperature, maintained through homeostatic mechanisms.'},
    {q:'Which organ produces insulin to regulate blood sugar as part of homeostasis?', c:['Kidney','Pancreas','Liver','Hypothalamus'], a:1, e:'The pancreas produces insulin, which helps regulate blood sugar levels as part of the body\'s homeostatic processes.'},
    {q:'Which organ maintains water balance through osmoregulation?', c:['Pancreas','Kidney','Hypothalamus','Skeletal muscles'], a:1, e:'The kidney maintains the body\'s water balance through osmoregulation, filtering and regulating fluid levels.'},
    {q:'Which structure contracts and releases heat as part of temperature regulation?', c:['Skeletal muscles','Pancreas','Kidney','Hypothalamus'], a:0, e:'Skeletal muscles contract and release heat (as in shivering), helping to regulate body temperature as part of homeostasis.'},
    {q:'Which health conditions are linked to consumption of salty foods and red meat, according to the notes?', c:['Only common colds','CKD, gallstones, and atherosclerosis','Only allergies','Only fever'], a:1, e:'The notes link excessive consumption of salty foods and red meat to conditions like CKD (chronic kidney disease), gallstones, and atherosclerosis.'},
    {q:'What can damage the myelin sheath, according to the notes?', c:['Regular exercise','Pagpupuyat (sleep deprivation) and stress','Drinking water','Eating vegetables'], a:1, e:'The notes mention that the myelin sheath can be damaged ("nasira") due to sleep deprivation (pagpupuyat) and stress.'},
    {q:'Growth and development is characterized as which type of characteristic?', c:['Qualitative only','Quantitative (increase in size or mass)','Unrelated to size','Only behavioral'], a:1, e:'Growth and development involves progression from simpler to more complex states, marked by a quantitative increase in size or mass, along with physical/mental/behavioral changes.'},
    {q:'Which of the following is an example of "movement" as a unifying theme of life?', c:['Photosynthesis','Phototropism (plant movement toward light)','Fever response','Osmoregulation'], a:1, e:'Movement includes plant movement like phototropism (growing toward sunlight), animal movement, and cellular movement/response to stimuli.'},
    {q:'What does "chemotaxis" refer to in the broader context of cellular movement?', c:['Movement toward light','Movement in response to chemical signals','Random, undirected movement','Movement caused by temperature change'], a:1, e:'Chemotaxis is movement in response to chemical stimuli/signals — seen both in sperm movement toward an egg and general cellular movement.'},
    {q:'Charles Darwin is most associated with which unifying theme of life?', c:['Metabolism','Theory of Evolution','Homeostasis','Reproduction'], a:1, e:'Charles Darwin is credited with the Theory of Evolution, which explains how species change their heritable traits over generations through natural selection.'},
    {q:'Natural selection favors traits that:', c:['Reduce survival chances','Enhance survival and reproduction in a given environment','Have no effect on survival','Only appear in plants'], a:1, e:'Natural selection favors traits that enhance an organism\'s survival and reproduction chances within its specific environment.'},
    {q:'How long can evolutionary change generally take, according to the notes?', c:['A few days','A few years','Thousands to millions of years','It happens instantly'], a:2, e:'Evolution, driven by natural selection, is described as a process that can take thousands to millions of years.'},
    {q:'Which evolutionary trend is mentioned regarding early human ancestors?', c:['Decrease in brain size','Bipedalism, increased brain size, decreased jaw and teeth','No changes over time','Loss of bipedalism'], a:1, e:'The notes mention bipedalism, an increase in brain size, and a decrease in jaw and teeth size as key evolutionary trends in human ancestry.'},
    {q:'The example of finch beaks becoming smaller due to environmental pressure illustrates:', c:['Random mutation with no cause','Natural selection responding to available food resources','Homeostasis','Fermentation'], a:1, e:'The notes describe finch beaks becoming smaller ("lumiit") due to environmental pressure, as available food sources changed — a classic natural selection example.'},
    {q:'Viruses cannot be clearly classified as living because they:', c:['Have no genetic material at all','Cannot metabolize independently outside a host','Are too large to see','Have no effect on hosts'], a:1, e:'Viruses can\'t metabolize on their own, which is why they are considered a "bridge" between living and non-living things — they need a host cell to replicate.'},
    {q:'Which unifying theme of life is most directly illustrated by a plant converting sunlight into stored chemical energy?', c:['Homeostasis','Metabolism (specifically anabolism/photosynthesis)','Heredity','Movement'], a:1, e:'Photosynthesis, an anabolic metabolic process, is the plant\'s way of converting light energy into stored chemical energy (glucose).'},
    {q:'Which of these is the correct pairing of reproduction TYPE and EXAMPLE?', c:['Asexual — gametogenesis','Sexual — binary fission','Asexual — budding (hydra)','Sexual — budding (hydra)'], a:2, e:'Budding in hydra is a classic example of asexual reproduction, alongside binary fission in bacteria like E. coli.'},
    {q:'Which of these is the correct pairing of reproduction TYPE and EXAMPLE?', c:['Sexual — gametogenesis and fertilization','Asexual — fertilization','Sexual — binary fission','Asexual — gametogenesis'], a:0, e:'Gametogenesis and fertilization are hallmark processes of sexual reproduction, generating genetic diversity through meiosis and combination of parental genetic material.'},
    {q:'A microbiologist notes that a virus is "obligatory intracellular." What does this term mean?', c:['It lives freely without needing a host','It can only survive and replicate while inside a host cell','It never interacts with cells','It only exists outside of any cell'], a:1, e:'"Obligatory intracellular" means the virus can only live and replicate while inside a host cell — it cannot survive independently like true living organisms.'},
    {q:'Sweating helps regulate body temperature primarily through which physical process?', c:['Chemical reaction with skin oils','Evaporation of water from the skin','Muscle contraction','Blood clotting'], a:1, e:'Sweating regulates temperature through the evaporation of water from the skin surface, which cools the body.'},
    {q:'Shivering helps maintain body temperature by:', c:['Evaporating sweat','Muscle contraction that generates heat','Releasing insulin','Filtering blood'], a:1, e:'Shivering involves rapid muscle contractions that generate heat, helping the body maintain stable temperature in cold conditions.'},
    {q:'Which of the following would be classified as a catabolic process?', c:['Photosynthesis','Building proteins from amino acids','Breaking down glucose during fermentation','Assembling DNA strands'], a:2, e:'Breaking down glucose (as in fermentation or respiration) is a catabolic process — catabolism breaks larger molecules into smaller ones, releasing energy.'},
    {q:'Fever, as discussed in the notes, indicates:', c:['A serious, always dangerous illness','An immune response to foreign invaders, not sickness itself','A digestive disorder','A homeostatic failure with no biological purpose'], a:1, e:'The notes clarify that fever is an immune response to foreign invaders (like pathogens), not a sickness in itself.'},
    {q:'Which structure regulates both temperature and osmotic pressure in the body?', c:['Kidney','Hypothalamus','Pancreas','Liver'], a:1, e:'The hypothalamus regulates both body temperature and changes in osmotic pressure, coordinating multiple homeostatic functions.'},
    {q:'Which of the following would most likely disrupt homeostasis if malfunctioning?', c:['The kidney (water balance)','A single skin cell','A strand of hair','A fingernail'], a:0, e:'The kidney plays a central role in maintaining water balance (osmoregulation); malfunction would significantly disrupt the body\'s homeostasis.'},
    {q:'Heredity contributes to which broader biological processes, according to the notes?', c:['Only reproduction','Diversity and evolution','Only metabolism','Only homeostasis'], a:1, e:'Heredity, the passing of genetic information, contributes to diversity and evolution within populations over time.'},
    {q:'A key difference between asexual and sexual reproduction is that sexual reproduction:', c:['Produces genetically identical offspring','Involves genetic combination from two parents, increasing diversity','Cannot occur in animals','Only occurs in bacteria'], a:1, e:'Sexual reproduction involves gametogenesis and fertilization from two parents, creating genetic diversity through crossing over and combination — unlike asexual reproduction, which typically produces genetically identical offspring.'},
    {q:'Which of the following best explains why E. coli can reproduce so rapidly?', c:['It uses sexual reproduction','Its binary fission generation time is only about 20 minutes','It relies on gametogenesis','It reproduces only once per year'], a:1, e:'E. coli reproduces via binary fission with a very short generation time of about 20 minutes, allowing for extremely rapid population growth.'},
    {q:'A biology student notices a plant\'s leaves bending toward a window with sunlight. Which unifying theme of life is being demonstrated?', c:['Homeostasis','Movement (phototropism)','Metabolism','Heredity'], a:1, e:'This is phototropism, an example of the "movement" theme — plants moving/growing toward light sources.'},
    {q:'A student observes a hydra forming a small growth on its side that eventually detaches into a new organism. Which reproduction type is this?', c:['Sexual reproduction via gametogenesis','Asexual reproduction via budding','Binary fission','Fertilization'], a:1, e:'This describes budding, a form of asexual reproduction common in hydra, resulting from mitotic cell division.'},
    {q:'Why is fermentation considered important for organisms like yeast that lack access to oxygen?', c:['It allows them to generate energy anaerobically','It prevents them from reproducing','It converts them into aerobic organisms','It has no real function'], a:0, e:'Fermentation allows organisms like yeast to generate usable energy (ATP) even without oxygen, since yeast is anaerobic.'},
    {q:'Which best summarizes why viruses are described as "the bridge between the living and the non-living"?', c:['They exhibit some traits of life (genetic material, reproduction with a host) but cannot independently metabolize like living organisms','They are entirely non-living with no biological traits','They are fully living, identical to bacteria','They have no connection to biology at all'], a:0, e:'Viruses have some traits of life (genetic material, ability to "reproduce" with host help) but lack independent metabolism, placing them in an ambiguous position between living and non-living.'},
    {q:'Which of the following pairs the correct fermentation TYPE with its main energy-related byproduct?', c:['Alcohol fermentation — ethanol','Lactic acid fermentation — oxygen','Alcohol fermentation — lactate','Lactic acid fermentation — ethanol'], a:0, e:'Alcohol fermentation breaks sugar down into CO2 and ethanol, which carries usable chemical energy (ATP produced in the process).'},
    {q:'A student says: "Lactic acid is only produced when oxygen is abundant." Is this statement accurate?', c:['Yes, always','No — lactic acid fermentation happens when oxygen is limited, such as during intense exercise','Yes, but only in plants','It has nothing to do with oxygen levels'], a:1, e:'Lactic acid fermentation occurs when oxygen supply cannot keep up with demand, such as during intense physical activity, allowing continued energy production without oxygen.'},
    {q:'Which best distinguishes anabolic from catabolic reactions?', c:['Anabolic builds larger molecules; catabolic breaks them down','Anabolic breaks down molecules; catabolic builds them','Both build molecules with no difference','Both break down molecules with no difference'], a:0, e:'Anabolic reactions build larger molecules from smaller ones (e.g. photosynthesis), while catabolic reactions break larger molecules down into smaller ones, releasing energy (e.g. fermentation).'},
    {q:'A researcher observes a single-celled organism splitting into two genetically identical cells within 20 minutes. Which process and organism does this most likely describe?', c:['Budding in hydra','Binary fission in E. coli','Gametogenesis in humans','Fermentation in yeast'], a:1, e:'This matches binary fission in E. coli, a rapid asexual reproduction process with a generation time of about 20 minutes.'},
    {q:'Which unifying theme of life would best explain why a wound triggers inflammation and eventually healing?', c:['Homeostasis (restoring internal stability after injury)','Heredity','Movement','Metabolism alone, unrelated to homeostasis'], a:0, e:'Healing and inflammation are part of the body\'s effort to maintain/restore homeostasis — internal stability — after a disruption like injury.'},
    {q:'Which of the following would NOT be considered part of maintaining homeostasis?', c:['Regulating body temperature','Regulating blood sugar','Regulating water balance','Randomly mutating DNA for no functional reason'], a:3, e:'Random, non-functional DNA mutation is not a homeostatic mechanism; homeostasis specifically involves regulating factors like temperature, blood sugar, and water balance.'},
    {q:'A plant grown in a dark room with a single light source on one side will most likely grow:', c:['Away from the light','Toward the light source (phototropism)','Straight upward regardless of light','Not at all'], a:1, e:'Plants exhibit phototropism, growing toward a light source to maximize photosynthesis — a movement-related unifying theme of life.'},
    {q:'Which best explains the evolutionary significance of "crossing over" during meiosis?', c:['It has no significance','It increases genetic diversity in offspring by exchanging genetic material between chromosomes','It prevents fertilization from occurring','It is unrelated to reproduction'], a:1, e:'Crossing over exchanges genetic material between homologous chromosomes during meiosis, increasing genetic diversity in the resulting gametes and offspring.'},
    {q:'Which best explains "independent assortment" during meiosis?', c:['Chromosomes always separate in a fixed, unchanging pattern','Chromosomes are randomly distributed into gametes, increasing genetic variety','It only happens in asexual reproduction','It refers to virus reproduction'], a:1, e:'Independent assortment refers to the random distribution of chromosomes into gametes during meiosis, contributing to genetic diversity, alongside crossing over.'},
    {q:'Which best illustrates the connection between metabolism and energy?', c:['Metabolism has no connection to energy','Metabolic reactions (anabolic and catabolic) build and break down molecules, managing the flow of energy in an organism','Only catabolic reactions involve energy','Only anabolic reactions involve energy'], a:1, e:'Both anabolic (energy-storing, building) and catabolic (energy-releasing, breaking down) reactions are part of metabolism, together managing how an organism uses and stores energy.'},
    {q:'Which best explains why maintaining a stable body temperature (around 37°C) matters for homeostasis?', c:['It has no real biological importance','Many biological processes, like enzyme function, work best within a narrow temperature range','Temperature has no effect on enzymes','The body has no mechanism to regulate temperature'], a:1, e:'Stable body temperature is crucial because many biological processes (like enzyme activity) function optimally only within a narrow temperature range — hence the importance of homeostasis.'},
    {q:'A biology exam asks for an example of a catabolic process related to muscle activity during exercise. The best answer is:', c:['Photosynthesis','Lactic acid fermentation (breakdown of glucose during intense activity)','DNA replication','Protein synthesis'], a:1, e:'Lactic acid fermentation, which breaks down glucose into pyruvate and then lactate, is a catabolic process that occurs in muscles during intense exercise when oxygen is limited.'},
    {q:'Which best describes how evolution and heredity are related?', c:['They are unrelated concepts','Heredity (passing of traits) provides the genetic variation upon which natural selection (evolution) acts over generations','Evolution stops heredity from occurring','Heredity only applies to bacteria'], a:1, e:'Heredity provides the genetic variation between individuals, and natural selection (the mechanism of evolution) acts on that variation over generations, favoring traits that improve survival/reproduction.'},
    {q:'A doctor explains that a patient\'s fever is the body\'s way of fighting an infection, not a disease itself. Which unifying theme of life does this best relate to?', c:['Movement','Homeostasis (immune response maintaining internal balance against pathogens)','Heredity','Reproduction'], a:1, e:'Fever is part of the body\'s homeostatic and immune response to foreign invaders, working to restore healthy internal conditions — not a disease itself.'},
    {q:'Which best completes: "Viruses need a host cell mainly because they cannot ___ independently."', c:['Move','Metabolize','Exist in any form','Have genetic material'], a:1, e:'Viruses cannot metabolize independently — they rely entirely on a host cell\'s machinery to replicate and "survive," which is why they occupy an ambiguous position between living and non-living things.'},
    {q:'In summary, which set best represents ALL the unifying themes of life discussed in this lesson?', c:['Metabolism, Reproduction, Homeostasis, Growth & Development, Movement, Heredity, Evolution','Only Metabolism and Reproduction','Only Homeostasis and Evolution','Photosynthesis, Respiration, and Fermentation only'], a:0, e:'The full set of unifying themes of life covered are: Metabolism, Reproduction, Homeostasis, Growth & Development, Movement, Heredity, and Evolution.'}
  ],
  glossary:[
    {term:'Anabolic (build)', def:'photosynthesis.'},
    {term:'Catabolic (break)', def:'alcohol fermentation, lactic acid production.'},
    {term:'Asexual', def:'budding (hydra), binary fission (E. coli, ~20 min generation time).'},
    {term:'Sexual', def:'gametogenesis, fertilization via chemotaxis, zona pellucida, cortical reaction.'},
    {term:'Homeostasis', def:'maintenance of internal stability despite external changes (temperature, pH, nutrients).'},
    {term:'Chemotaxis', def:'movement/navigation in response to chemical signals (e.g. sperm toward the egg).'},
    {term:'Zona pellucida', def:'protective glycoprotein matrix around the egg that prevents polyspermy after the cortical reaction.'}
  ]},
  {id:'gs2', title:'2. Biological Organization', content:[
    {h:'Levels (smallest to largest)', b:['Chemical (atoms/molecules) → Cellular → Tissues → Organ → Organ System → Organism → Population → Community → Ecosystem → Biosphere.']},
    {h:'Key Notes', b:[
      'Population = same species, same habitat.',
      'Community = different species, same habitat.',
      'Ecosystem = interaction of biotic and abiotic factors.',
      'Biosphere = the global ecosystem.'
    ]}
  ], quiz:[
    {q:'A group of the same species living in the same habitat is called a:', c:['Community','Population','Ecosystem','Biosphere'], a:1},
    {q:'Which level comes directly after "Tissues" in biological organization?', c:['Organ','Cellular','Organism','Organ System'], a:0},
    {q:'Different species living in the same habitat form a:', c:['Population','Community','Biosphere','Organ system'], a:1},
    {q:'The interaction between living (biotic) and non-living (abiotic) factors defines a(n):', c:['Organism','Ecosystem','Tissue','Population'], a:1},
    {q:'The largest level of biological organization is the:', c:['Ecosystem','Community','Biosphere','Population'], a:2},
    {q:'Which level of organization comes right BEFORE "Organism" in the hierarchy?', c:['Tissue','Organ System','Population','Cellular'], a:1},
    {q:'The smallest level of biological organization discussed is the:', c:['Cellular level','Chemical level (atoms/molecules)','Tissue level','Organ level'], a:1},
    {q:'A heart is an example of which level of biological organization?', c:['Tissue','Organ','Organ System','Population'], a:1},
    {q:'The digestive system, made up of several organs working together, is an example of a(n):', c:['Organ','Organ System','Tissue','Ecosystem'], a:1},
    {q:'All the fish of the same species living in one lake represent a:', c:['Community','Population','Ecosystem','Biosphere'], a:1},
    {q:'All the different species (fish, plants, insects) living in one lake together represent a:', c:['Population','Community','Organ system','Biosphere'], a:1},
    {q:'Which level of organization includes both biotic and abiotic components interacting together?', c:['Population','Community','Ecosystem','Organism'], a:2},
    {q:'Muscle tissue is an example of which level of organization?', c:['Cellular','Tissue','Organ','Organ System'], a:1},
    {q:'The biosphere is best described as:', c:['A single ecosystem','The sum of all ecosystems on Earth','Only the ocean','Only the atmosphere'], a:1}
  ],
  glossary:[
    {term:'Biological Organization', def:'the hierarchical levels at which living systems are structured, from atoms to the biosphere.'},
    {term:'Cell', def:'the basic structural and functional unit of all living organisms.'},
    {term:'Tissue', def:'a group of similar cells working together to perform a specific function.'},
    {term:'Organ', def:'a structure made of different tissues working together to perform a specific function.'},
    {term:'Organ System', def:'a group of organs working together to carry out major body functions.'},
    {term:'Population', def:'a group of individuals of the same species living in the same area.'},
    {term:'Ecosystem', def:'a community of organisms interacting with each other and their physical environment.'},
    {term:'Biosphere', def:'the global sum of all ecosystems on Earth.'}
  ]},
  {id:'gs3', title:'3. Cellular Processes', content:[
    {h:'Glucose vs ATP', b:['Glucose: long-term, stable energy storage.','ATP: immediate, usable cellular energy (battery-like).']},
    {h:'Photosynthesis', b:[
      '6CO2 + 6H2O + light → C6H12O6 + 6O2.',
      'Light-dependent reaction (thylakoid): produces ATP, NADPH, O2.',
      'Calvin Cycle / light-independent (stroma): fixes CO2 into glucose using ATP & NADPH.'
    ]},
    {h:'Cellular Respiration', b:[
      'Glycolysis (cytoplasm, anaerobic): glucose → 2 pyruvate, net 2 ATP + 2 NADH.',
      'Krebs Cycle (mitochondrial matrix): produces CO2, ATP, NADH, FADH2.',
      'Electron Transport Chain (inner mitochondrial membrane): produces ~32-34 ATP; oxygen is final electron acceptor.',
      'Total ATP yield: ~38 ATP per glucose.'
    ]},
    {h:'Fermentation', b:['Occurs without enough oxygen; produces lactic acid or alcohol + CO2; begins in cytoplasm like respiration.']}
  ], quiz:[
    {q:'Which molecule is best suited for long-term energy storage?', c:['ATP','Glucose','NADH','FADH2'], a:1},
    {q:'The light-dependent reactions of photosynthesis occur in the:', c:['Stroma','Mitochondria','Thylakoid membranes','Cytoplasm'], a:2},
    {q:'Glycolysis takes place in the:', c:['Mitochondrial matrix','Cytoplasm','Thylakoid','Nucleus'], a:1},
    {q:'The final electron acceptor in the electron transport chain is:', c:['Glucose','Oxygen','Carbon dioxide','ATP'], a:1},
    {q:'Approximately how many total ATP are produced per glucose molecule in cellular respiration?', c:['2','4','38','100'], a:2},
    {q:'Fermentation occurs when cells lack sufficient:', c:['Glucose','Oxygen','Water','Carbon dioxide'], a:1},
    {q:'The Calvin Cycle (light-independent reactions) takes place in the:', c:['Thylakoid','Stroma','Mitochondria','Cytoplasm'], a:1},
    {q:'The Krebs Cycle takes place in the:', c:['Cytoplasm','Mitochondrial matrix','Thylakoid','Nucleus'], a:1},
    {q:'Glycolysis converts one glucose molecule into how many pyruvate molecules?', c:['1','2','4','6'], a:1},
    {q:'What is the net ATP gain from glycolysis alone?', c:['0 ATP','2 ATP','10 ATP','38 ATP'], a:1},
    {q:'Which byproduct of the light-dependent reactions is released into the atmosphere?', c:['Carbon dioxide','Oxygen','Nitrogen','Glucose'], a:1},
    {q:'The overall equation for photosynthesis produces glucose and:', c:['Nitrogen','Oxygen','Methane','Ozone'], a:1},
    {q:'Where does the electron transport chain occur in cellular respiration?', c:['Cytoplasm','Inner mitochondrial membrane','Thylakoid','Nucleus'], a:1},
    {q:'Lactic acid fermentation is common in which type of cells when oxygen is low?', c:['Plant cells only','Muscle cells','Bacteria only','Viruses'], a:1},
    {q:'ATP is best compared to which everyday analogy?', c:['A savings account','A battery/immediate usable energy','A warehouse','A seed'], a:1}
  ],
  glossary:[
    {term:'Glucose', def:'long-term, stable energy storage.'},
    {term:'ATP', def:'immediate, usable cellular energy (battery-like).'},
    {term:'Light-dependent reaction (thylakoid)', def:'produces ATP, NADPH, O2.'},
    {term:'Calvin Cycle / light-independent (stroma)', def:'fixes CO2 into glucose using ATP & NADPH.'},
    {term:'Krebs Cycle (mitochondrial matrix)', def:'produces CO2, ATP, NADH, FADH2.'},
    {term:'Total ATP yield', def:'~38 ATP per glucose.'}
  ]},
  {id:'gs4', title:'4. Interconnected Biological Systems', content:[
    {h:'Plants vs Animals', b:[
      'Plants: autotrophs, photosynthesis, rigid cellulose cell walls, generally sessile.',
      'Animals: heterotrophs, consumers/decomposers, lack cell walls, typically motile.'
    ]},
    {h:'Shared Principles', b:[
      'Both rely on ATP for metabolism.',
      'Both maintain homeostasis and osmoregulation (prevent lysis and shrinkage).',
      'Both have material transport systems: plants use xylem/phloem; animals use circulatory/respiratory systems.'
    ]}
  ], quiz:[
    {q:'Which structure transfers water and minerals upward from the roots in plants?', c:['Phloem','Xylem','Chloroplast','Mitochondria'], a:1},
    {q:'Phloem transports:', c:['Water only','Sugars/organic molecules from source to sink','Oxygen','Carbon dioxide'], a:1},
    {q:'Osmotic lysis occurs when a cell:', c:['Loses too much water','Bursts from too much water concentration inside','Has too little glucose','Lacks a nucleus'], a:1},
    {q:'Which of these is generally sessile (fixed in place)?', c:['Animals','Plants','Bacteria only','None of these'], a:1},
    {q:'Both plants and animals rely on __ to sustain metabolic processes.', c:['Chlorophyll','ATP','Cellulose','Melanin'], a:1},
    {q:'Which of the following is TRUE about plant cells but NOT typical animal cells?', c:['They contain a nucleus','They have rigid cellulose cell walls','They contain cytoplasm','They can undergo mitosis'], a:1},
    {q:'Which system do animals use to transport materials, unlike plants?', c:['Xylem','Phloem','Circulatory system','Chloroplast system'], a:2},
    {q:'Preventing a cell from bursting due to excess water is called preventing:', c:['Osmotic lysis','Photosynthesis','Chemotaxis','Fermentation'], a:0},
    {q:'Which organisms are classified as heterotrophs?', c:['Plants','Animals','Algae','Cyanobacteria'], a:1},
    {q:'Which organisms are classified as autotrophs?', c:['Animals','Fungi','Plants','Bacteria that decompose'], a:2},
    {q:'Xylem is responsible for transporting:', c:['Sugars from leaves to roots','Water and minerals from roots upward','Oxygen throughout the plant','Waste products out of the plant'], a:1},
    {q:'Which of the following best describes "motile" organisms?', c:['Fixed in place','Capable of movement','Unable to reproduce','Lacking cells'], a:1},
    {q:'Homeostasis in both plants and animals refers to:', c:['Maintaining internal stability','Producing offspring','Photosynthesizing','Decomposing organic matter'], a:0},
    {q:'Both plant and animal transport systems ultimately support which shared process?', c:['Metabolism','Extinction','Fossilization','Petrification'], a:0}
  ],
  glossary:[
    {term:'Plants', def:'autotrophs, photosynthesis, rigid cellulose cell walls, generally sessile.'},
    {term:'Animals', def:'heterotrophs, consumers/decomposers, lack cell walls, typically motile.'},

  ]},

  {id:'gs6', title:'6. The Lasting Impact of Chemists on Society', content:[
    {h:'Foundations of Modern Chemistry', b:[
      'Alchemy (past) — blend of philosophy, mysticism, early chemistry; aimed at transmutation and the elixir of life; trial-and-error, limited systematic measurement.',
      'Transition — rise of reason, precise measuring tools (balance), systematic experimentation.',
      'Modern chemistry — quantitative, systematic, open (peer-reviewed); understands matter through evidence-based laws and theories.'
    ]},
    {h:'Key Figures', b:[
      'Antoine Lavoisier — father of modern chemistry; Law of Conservation of Mass; Chemical Nomenclature; disproved Phlogiston Theory (combustion/respiration involve oxygen).',
      'John Dalton — first modern atomic theory (indivisible atoms with specific atomic weights).',
      'Dimitri Mendeleev — created the periodic table, arranged by atomic weight; predicted undiscovered elements.'
    ]},
    {h:'Human Health & Medicine', b:[
      'Louis Pasteur — Germ Theory; pasteurization; disproved spontaneous generation; sterilization and vaccines (rabies, anthrax).',
      'Alexander Fleming — discovered antibiotics (Penicillium notatum, 1928), bridging biology and chemistry.',
      'Marie Curie — first woman to win a Nobel Prize; discovered radium and polonium with Pierre Curie; foundation for nuclear chemistry and medical imaging.'
    ]}
  ], quiz:[

  glossary:[
    {term:'Alchemy (past)', def:'blend of philosophy, mysticism, early chemistry; aimed at transmutation and the elixir of life; trial-and-error, limited systematic measurement.'},
    {term:'Transition', def:'rise of reason, precise measuring tools (balance), systematic experimentation.'},
    {term:'Modern chemistry', def:'quantitative, systematic, open (peer-reviewed); understands matter through evidence-based laws and theories.'},
    {term:'Antoine Lavoisier', def:'father of modern chemistry; Law of Conservation of Mass; Chemical Nomenclature; disproved Phlogiston Theory (combustion/respiration involve oxygen).'},
    {term:'John Dalton', def:'first modern atomic theory (indivisible atoms with specific atomic weights).'},
    {term:'Dimitri Mendeleev', def:'created the periodic table, arranged by atomic weight; predicted undiscovered elements.'},
    {term:'Louis Pasteur', def:'Germ Theory; pasteurization; disproved spontaneous generation; sterilization and vaccines (rabies, anthrax).'},
    {term:'Alexander Fleming', def:'discovered antibiotics (Penicillium notatum, 1928), bridging biology and chemistry.'},
    {term:'Marie Curie', def:'first woman to win a Nobel Prize; discovered radium and polonium with Pierre Curie; foundation for nuclear chemistry and medical imaging.'}
  ]},

  {id:'gs9', title:'9. Chemical Reactions in Daily Lives & Solutions in the Environment', content:[
    {h:'Types of Chemical Reactions', b:[
      'Combination/Synthesis: A + B → AB. Decomposition: AB → A + B.',
      'Single Replacement: AB + C → AC + B. Double Replacement: AB + CD → AD + BC.'
    ]},
    {h:'Cooking & Cleaning', b:[
      'Cooking: caramelization (breakdown of sucrose when heated); dehydration of glucose/fructose yields caramelans.',
      'Bread making: yeast (Saccharomyces cerevisiae) converts sugar to ethanol + CO2 via fermentation, inflating the dough.',
      'Cleaning: saponification — fat (triglyceride) + 3 NaOH (lye) → soap + glycerol + water.'
    ]},
    {h:'Environmental Reactions', b:[
      'Volcanic eruptions: SO2 + water → sulfuric acid; contributes to acid rain (sulfuric + nitric acid).',
      'Photosynthesis: CO2 + water + sunlight → sugars + oxygen; ~70% of atmospheric oxygen comes from ocean algae/cyanobacteria.',
      'Ozone depletion: CFCs break down and destroy ozone (O3) in a repeating chlorine-catalyzed cycle; Montreal Agreement banned CFCs.',
      'Cellular respiration: Glucose + Oxygen → CO2 + Water + energy (ATP); occurs in cytoplasm (glycolysis) and mitochondria (Krebs cycle).',
      'Glycolysis produces 2 ATP + 2 NADH; Krebs cycle produces 2 CO2, 1 GTP, 1 FADH2, 3 NADH.'
    ]},
    {h:'Solutions', b:['A solution is a homogeneous mixture where one substance dissolves in another.']}
  ], quiz:[
    {q:'A student observes a compound splitting into two simpler substances during an experiment. What type of reaction is this?', c:['Combination','Decomposition','Single replacement','Double replacement'], a:1},

    {q:'A soap maker mixes triglycerides with lye (NaOH) and lets the mixture cure. What byproducts, besides soap, form in this process?', c:['Ethanol and CO2','Glycerol and water','Ammonia and nitrogen','Ozone and oxygen'], a:1},

    {q:'Statement A: The Montreal Agreement banned CFCs to protect the ozone layer. Statement B: About 70% of atmospheric oxygen comes from ocean algae. Which is correct?', c:['Both statements are true','A is true, B is false','A is false, B is true','Both statements are false'], a:0},
    {q:'A biology student traces glucose breakdown and finds it occurs in the cytoplasm, producing 2 ATP and 2 NADH. Which process is this?', c:['Krebs cycle','Glycolysis','Photosynthesis','Fermentation only'], a:1},

{id:'bionotes', name:'Biology Notes (IG notes)', lessons:[
  {id:'bn1', title:'1. Biomolecules (Carbohydrates, Lipids, Proteins, Nucleic Acids)', content:[
    {h:'Biomolecules & Polymers', b:[
      'Biomolecules (macromolecules): Carbohydrates, Lipids, Proteins, Nucleic Acids — made of polymers (Greek: polys = many, meris = part).',
      'Polymer: long molecule of many similar/identical monomers linked by covalent bonds. Not all biomolecules have a definite monomer (lipids don\'t).',
      'Monomers by type: Carbohydrate → Monosaccharide; Lipid → Glycerol, fatty acid; Protein → Amino acid; Nucleic acid → Nucleotide.',
      'Dehydration reaction (synthesis) — removes a water molecule to join monomers into a longer polymer.',
      'Hydrolysis (breakdown) — adds a water molecule to break a bond, splitting a polymer into monomers. The body can only absorb monomers, so digestion (chewing + enzymes) breaks polymers down.'
    ]},
    {h:'Carbohydrates', b:[
      'Monomer: Monosaccharide. Structure: CHO. Example: glucose (C6H12O6), used in ATP production; most common monosaccharide.',
      'Monosaccharide < Disaccharide < Polysaccharide. Disaccharide = 2 monosaccharides joined by a glycosidic linkage (LSM: Lactose, Sucrose, Maltose common examples).',
      'Aldoses — carbonyl group at the end of the molecule. Ketoses — carbonyl group embedded within the molecule.',
      'Storage polysaccharides: Starch (plants, all-glucose, stored in plastids) and Glycogen (animals, stored in liver/muscle).',
      'Structural polysaccharides: Cellulose (plant cell walls, polymer of β-glucose, indigestible fiber for humans) and Chitin (arthropod exoskeletons, fungal cell walls).',
      'Starch = α-glucose 1-4 linkages (same side); Cellulose = β-glucose 1-4 linkages (alternating).'
    ]},
    {h:'Lipids', b:[
      'Lack a true monomer; structure is CHO but hydrogen-heavy; mostly hydrophobic due to nonpolar hydrocarbon chains.',
      'Fats (triacylglycerol) — glycerol + 3 fatty acids joined by ester linkages; major function is energy storage (stored in adipose cells).',
      'Saturated fats — no double bonds, solid at room temperature, linked to cardiovascular disease. Unsaturated fats — have double bonds (cis bends the chain), liquid at room temperature.',
      'Phospholipids — form the cell membrane\'s phospholipid bilayer; hydrophilic head faces water, hydrophobic tail faces inward.',
      'Steroids — four fused carbon rings; Cholesterol is a key steroid that maintains membrane fluidity and is a precursor for steroid hormones (testosterone, estradiol, cortisol).'
    ]},
    {h:'Proteins', b:[
      'Monomer: Amino acid. Structure: CHON. Each amino acid has an amino group (NH2), carboxyl group, α-carbon, and a variable R group (side chain) that determines its identity — there are 20 amino acids.',
      'Peptide bond — links the carboxyl end (C-terminus) of one amino acid to the amino end (N-terminus) of another; a polypeptide is a chain of many amino acids.',
      'Four levels of protein structure: Primary (amino acid sequence) → Secondary (α helix/β pleated sheet via hydrogen bonds) → Tertiary (R-group interactions, disulfide bridges) → Quaternary (multiple polypeptides forming one functional protein).',
      'Denaturation — loss of a protein\'s native structure/shape from heat, acids, bases, salts, or agitation, making it biologically inactive (primary structure itself stays unchanged).',
      'Protein functions: hormonal (insulin), receptor, contractile/motor (actin/myosin), structural (keratin, collagen), enzymatic, defensive (antibodies), storage (casein, ovalbumin), transport (hemoglobin).'
    ]},
    {h:'Nucleic Acids', b:[
      'Monomer: Nucleotide. Structure: CHONP — a nitrogenous base (A/G/C/T/U), a pentose sugar (deoxyribose or ribose), and a phosphate group.',
      'DNA stores genetic information (double-stranded, antiparallel, deoxyribose sugar). RNA carries out instructions for protein synthesis (single-stranded, ribose sugar).',
      'Base pairing: DNA A-T, C-G; RNA A-U, C-G. Purines (Adenine, Guanine) are double-ringed; Pyrimidines (Cytosine, Thymine, Uracil) are single-ringed.',
      'Types of RNA: mRNA (carries DNA\'s message to ribosomes), rRNA (structural component of ribosomes), tRNA (brings amino acids to match mRNA codons).'
    ]}
  ], quiz:[
    {q:'A short polymer loses a water molecule when a new monomer is added, forming a longer chain. Which process is this?', c:['Hydrolysis','Dehydration (synthesis) reaction','Denaturation','Glycosidic cleavage'], a:1},
    {q:'Statement A: The body can absorb polymers directly without breaking them down. Statement B: Hydrolysis adds a water molecule to break a bond in a polymer. Which is correct?', c:['Both statements are true','A is true, B is false','A is false, B is true','Both statements are false'], a:2},
    {q:'A cow can digest grass efficiently while a human cannot, even though both eat cellulose. What explains this?', c:['Cows lack stomachs','Cows host cellulase-producing microbes that humans lack','Humans have more stomachs than cows','Cellulose is not a polysaccharide in cows'], a:1},

    {q:'Cellulose is made of glucose units linked by which type of bond?', c:['α-glucose 1-4 linkages','β-glucose 1-4 linkages','Phosphodiester bonds','Glycosidic peptide bonds'], a:1},
