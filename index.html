    {term:'Skill-related Fitness Components', def:'Speed, Coordination, Balance, Reaction-time, Power.'},
    {term:'Philippines Physical Activity Pyramid', def:'Everyday Activities (base) → 4-6x/week → 2-3x/week vigorous → Cut Down sedentary behavior (top).'}
  ], palace:[
    {stop:'Couch in the Living Room', image:'A couch potato slowly turns into a stiff joint and a racing heartbeat, with a sign taped to the remote: "hypo = low, kinetic = movement."', fact:'Hypokinetic diseases come from lack of physical activity (e.g. hypertension, diabetes).'},
    {stop:'Backyard Pyramid Structure', image:'A stone pyramid stands in the yard — walking/chores at the wide base, biking/sports on the next level up, HIIT/strength training near the top, and a "cut down screen time" flag at the very peak.', fact:'Philippines Physical Activity Pyramid, base to top.'},
    {stop:'Gym Equipment Rack', image:'Four labeled machines line the wall: a body-scanner, a stretchy band, a weight rack, a treadmill — all under a sign reading "HEALTH-related."', fact:'Health-related fitness: Body Composition, Flexibility, Muscular Fitness, Cardiovascular Fitness.'}
  ]},
{id:'lc12', title:'12. Recreational Activities & Mindfulness', content:[
    {h:'Recreational Activities: Passive vs. Active', b:[
      'Passive Recreation: relaxed, low physical demand, relaxation-focused (e.g. Reading, Watching Movies/TV, Listening to Music/Podcasts, Nature Observation, Arts and Crafts, Socializing). Benefits: Stress Relief, Mental Stimulation, Social Connections.',
      'Active Recreation: involves physical exertion/movement (e.g. non-competitive sports, Hiking, Biking, Gym Workouts, Dance, Rock Climbing, Water Sports, Frisbee, Tag). Benefits: Physical Health, Mental Well-Being (releases endorphins), Social Interaction (teamwork), Skill Development (coordination/balance).'
    ]},
    {h:'What is Mindfulness?', b:[
      'The basic human ability to be fully present, aware of where we are and what we\'re doing, and not overly reactive/overwhelmed by our surroundings.',
      'A quality every human already possesses — not something to conjure up, just something to learn how to ACCESS.',
      'Applied in therapeutic interventions: mindfulness-based cognitive behavior therapy, mindfulness-based stress reduction, mindfulness meditation.',
      'Key points: NOT all in your head (begins/ends in the body); NOT obscure/exotic; NOT a special added thing; you don\'t need to change to practice it; it\'s a way of living, evidence-based, and sparks innovation; anyone can do it.'
    ]},
    {h:'Why Practice Mindfulness?', b:[
      'Reduces stress; enhances performance/productivity; gains insight/awareness through observing one\'s own mind.',
      'Increases attention to others\' well-being; suspends judgment to practice natural curiosity; approaches experience with warmth/kindness to self and others.'
    ]},
    {h:'Common Mindfulness Exercises', b:[
      'Breathing Techniques: Box Breathing/4-4-4-4 Method (inhale 4, hold 4, exhale 4, hold 4); 4-7-8 Breathing (inhale 4, hold 7, exhale 8); Lion\'s Breath (inhale through nose, exhale forcefully through mouth with "ha" sound).',
      'Mindful Walking: walking slowly/deliberately, noticing feet touching ground, breathing, body movement, and surroundings.',
      'Body Scan Relaxation: mentally scanning the body head-to-toe, noticing/releasing tension.',
      'Other exercises: Five Senses Check-In (5-4-3-2-1: see, touch, hear, smell, taste), Mindful Eating, Mindful Listening, Mindful Stretching, Mindful Journaling, Mindful Visualization.',
      'Mindful Pause (STOP Technique): S = Stop what you\'re doing; T = Take a breath; O = Observe thoughts/feelings; P = Proceed with awareness.'
    ]}
  ], quiz:[
    {q:'Which type of recreation is characterized by low physical demand and a relaxation focus, like reading or watching movies?', c:['Active Recreation','Passive Recreation','Adventure Sports','Competitive Sports'], a:1, e:'Passive Recreation involves low physical demand and focuses on relaxation, such as reading, watching movies, or listening to music.'},
    {q:'Which type of recreation is associated with releasing endorphins and improving fitness components, like hiking or dance?', c:['Passive Recreation','Active Recreation','Mindful Journaling','Body Scan'], a:1, e:'Active Recreation involves physical exertion and is linked to releasing endorphins, improving physical health, and skill development.'},
    {q:'Mindfulness is best described as:', c:['A rare, exotic skill only some people have','A basic human ability to be fully present, that everyone already possesses','Something you must completely change your beliefs to practice','Only useful for athletes'], a:1, e:'Mindfulness is described as a quality every human being already possesses — you just need to learn how to access it.'},
    {q:'According to the notes, mindfulness "begins and ends" in the:', c:['Mind only','Body','Heart only','Environment'], a:1, e:'The notes specifically state that mindfulness is not "all in your head" — it begins and ends in the body.'},
    {q:'In Box Breathing (4-4-4-4 Method), how many counts do you hold your breath after inhaling?', c:['2 counts','4 counts','7 counts','8 counts'], a:1, e:'Box Breathing follows a 4-4-4-4 pattern: inhale for 4, hold for 4, exhale for 4, hold for 4.'},
    {q:'In 4-7-8 Breathing, how many seconds do you exhale for?', c:['4 seconds','7 seconds','8 seconds','10 seconds'], a:2, e:'The 4-7-8 Breathing technique involves inhaling for 4 seconds, holding for 7 seconds, and exhaling for 8 seconds.'},
    {q:'Which breathing technique involves sticking out your tongue and exhaling forcefully with a "ha" sound?', c:['Box Breathing','4-7-8 Breathing','Lion\'s Breath','Mindful Breathing'], a:2, e:'Lion\'s Breath involves inhaling deeply, then opening the mouth wide, sticking out the tongue, and exhaling forcefully with a "ha" sound.'},
    {q:'In the "STOP" technique for a mindful pause, what does the "O" stand for?', c:['Open your eyes','Observe your thoughts and/or feelings','Organize your schedule','Overcome your fears'], a:1, e:'In the STOP technique, O stands for "Observe your thoughts and/or feelings," following S (Stop) and T (Take a breath), before P (Proceed with awareness).'},
    {q:'The "Five Senses Check-In" mindfulness exercise follows which counting pattern?', c:['1-2-3-4-5','5-4-3-2-1 (see, touch, hear, smell, taste)','10-8-6-4-2','3-3-3-3-3'], a:1, e:'The Five Senses Check-In involves noticing 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, and 1 you can taste.'},
    {q:'Which mindfulness exercise involves mentally scanning your body from head to toe, releasing tension as you go?', c:['Mindful Walking','Body Scan Relaxation','Lion\'s Breath','Five Senses Check-In'], a:1, e:'Body Scan Relaxation involves mentally scanning the body from head to toe, noticing and releasing areas of tension.'}
  ], glossary:[
    {term:'Passive Recreation', def:'low physical demand, relaxation-focused activities (reading, movies, music).'},
    {term:'Active Recreation', def:'activities involving physical exertion/movement (hiking, dance, sports).'},
    {term:'Mindfulness', def:'the basic human ability to be fully present and aware, without being overly reactive.'},
    {term:'Box Breathing (4-4-4-4)', def:'inhale 4, hold 4, exhale 4, hold 4.'},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================= EXPORT HIGHLIGHTS ============================= */
function exportAllHighlights(){
  const lines = ['# My Highlights', ''];
  let foundAny = false;

  DATA.forEach(subj=>{
    let subjHeaderWritten = false;
    subj.lessons.forEach(les=>{
      ['study','summary'].forEach(mode=>{
        let raw = null;
        try{ raw = localStorage.getItem('reviewer_hl__' + subj.id + '__' + les.id + '__' + mode); }catch(e){ raw = null; }
        if(!raw) return;
        const tmp = document.createElement('div');
        tmp.innerHTML = raw;
        const marks = Array.from(tmp.querySelectorAll('mark.user-hl')).map(m=>m.textContent.trim()).filter(Boolean);
        if(!marks.length) return;

        if(!subjHeaderWritten){
          lines.push('## ' + subj.name, '');
          subjHeaderWritten = true;
        }
        lines.push('### ' + les.title + ' (' + (mode==='study' ? 'Study' : 'Summary') + ')', '');
        marks.forEach(m=> lines.push('- ' + m));
        lines.push('');
        foundAny = true;
      });
    });
  });

  if(!foundAny){
    alert('No highlights saved yet. Select some text in a lesson\'s Study or Summary tab and click "Highlight" first.');
    return;
  }

  const blob = new Blob([lines.join('\n')], { type:'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my-highlights.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================= HIDDEN LESSONS ============================= */
const HIDDEN_LESSONS_KEY = 'reviewer_hidden_lessons';

function getHiddenLessonsMap(){
  try{
    const raw = localStorage.getItem(HIDDEN_LESSONS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return {};
}

function saveHiddenLessonsMap(map){
  try{ localStorage.setItem(HIDDEN_LESSONS_KEY, JSON.stringify(map)); }catch(e){ /* storage full/unavailable */ }
}

function hiddenLessonKey(subjectId, lessonId){
  return subjectId + '::' + lessonId;
}

function isLessonHidden(subjectId, lessonId){
  const map = getHiddenLessonsMap();
  return !!map[hiddenLessonKey(subjectId, lessonId)];
}

function toggleLessonHidden(subjectId, lessonId){
  const map = getHiddenLessonsMap();
  const key = hiddenLessonKey(subjectId, lessonId);
  if(map[key]) delete map[key];
  else map[key] = true;
  saveHiddenLessonsMap(map);
}

/* ============================= QUIZ STATS / MASTERY ============================= */
function statsKey(subjectId, lessonId){
  return 'reviewer_stats__' + subjectId + '__' + lessonId;
}

function getStats(subjectId, lessonId){
  try{
    const raw = localStorage.getItem(statsKey(subjectId, lessonId));
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return { questions:{}, attempts:[] };
}

function saveStats(subjectId, lessonId, stats){
  try{ localStorage.setItem(statsKey(subjectId, lessonId), JSON.stringify(stats)); }catch(e){ /* storage full/unavailable */ }
}

// Stable identity for a question regardless of type — used for stats keys and repeat-avoidance.
function qKey(q){
  return q.q || (q.type==='dual' ? ('DUAL::' + q.s1 + '::' + q.s2) : JSON.stringify(q));
}

function recordAnswer(subjectId, lessonId, questionKey, wasCorrect){
  const stats = getStats(subjectId, lessonId);
  if(!stats.questions[questionKey]) stats.questions[questionKey] = { correct:0, wrong:0 };
  if(wasCorrect) stats.questions[questionKey].correct++;
  else stats.questions[questionKey].wrong++;
  saveStats(subjectId, lessonId, stats);
}

function recordAttempt(subjectId, lessonId, score, total){
  const stats = getStats(subjectId, lessonId);
  stats.attempts.push({ ts: Date.now(), score, total, pct: total ? Math.round((score/total)*100) : 0 });
  if(stats.attempts.length > 20) stats.attempts = stats.attempts.slice(-20);
  saveStats(subjectId, lessonId, stats);
  touchStreak();
}

/* ============================= STUDY STREAK ============================= */
function dateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getStreakData(){
  try{
    const raw = localStorage.getItem('reviewer_streak');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { lastDate: null, current: 0, longest: 0 };
}
function saveStreakData(data){
  try{ localStorage.setItem('reviewer_streak', JSON.stringify(data)); }catch(e){}
}
// Call whenever the person does a meaningful study action (finishes a quiz, rates a flashcard).
// Increments the streak once per calendar day, resets it if a day was skipped.
function touchStreak(){
  const data = getStreakData();
  const today = dateStr(new Date());
  if(data.lastDate === today) { renderStreakBadge(); return; } // already counted today
  const yesterday = dateStr(new Date(Date.now() - 86400000));
  if(data.lastDate === yesterday){
    data.current += 1;
  } else {
    data.current = 1; // streak broken (or first-ever study action)
  }
  data.lastDate = today;
  if(data.current > data.longest) data.longest = data.current;
  saveStreakData(data);
  renderStreakBadge();
}
function renderStreakBadge(){
  const el = document.getElementById('streakBadge');
  if(!el) return;
  const data = getStreakData();
  if(!data.lastDate || data.current <= 0){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'inline-flex';
  el.innerHTML = `🔥 ${data.current}-day streak` + (data.longest > data.current ? ` <span style="opacity:0.75;font-weight:normal;">(best: ${data.longest})</span>` : '');
}

// Returns a rounded mastery % based on the average of the last up to 3 attempts, or null if never attempted.
function getMasteryPct(subjectId, lessonId){
  const stats = getStats(subjectId, lessonId);
  if(!stats.attempts.length) return null;
  const recent = stats.attempts.slice(-3);
  const avg = recent.reduce((s,a)=>s+a.pct,0) / recent.length;
  return Math.round(avg);
}

// Weighted random sampling without replacement (Efraimidis-Spirakis algorithm).
// Questions the learner has missed more than gotten right are weighted much higher,
// so they resurface more often ("spaced repetition"); mastered questions show up less.
function weightedSample(items, weights, k){
  const keyed = items.map((it,i)=>({
    it,
    key: Math.pow(Math.random(), 1 / Math.max(weights[i], 0.0001))
  }));
  keyed.sort((a,b)=>b.key-a.key);
  return keyed.slice(0, k).map(x=>x.it);
}

function weightedQuizSample(pool, count, subjectId, lessonId){
  const stats = getStats(subjectId, lessonId);
  const weights = pool.map(q=>{
    const s = stats.questions[qKey(q)];
    if(!s || (s.correct+s.wrong)===0) return 2.2;      // never seen — see it at a normal-ish rate
    if(s.wrong > s.correct) return 4 + s.wrong;          // missed more than got right — resurface often
    if(s.wrong === s.correct) return 2;                  // shaky — normal rate
    return 1;                                            // mastered — show less often
  });
  return weightedSample(pool, weights, count);
}

// Fixed answer set for dual-statement ("Statement 1 / Statement 2") questions.
const DUAL_CHOICES = [
  'Both statements are TRUE.',
  'Both statements are FALSE.',
  'Statement 1 is TRUE, but Statement 2 is FALSE.',
  'Statement 2 is TRUE, but Statement 1 is FALSE.'
];

function buildQuizQuestion(q){
  const statKey = qKey(q);
  const statsLessonId = q._statsLessonId || null; // per-question override, used by Weak Spots drilling
  if(q.type === 'dual'){
    return { type:'dual', s1:q.s1, s2:q.s2, choices: DUAL_CHOICES.slice(), answer: q.a, explanation: q.e || null, source: q._src || null, statKey, statsLessonId };
  }
  const idxs = shuffle(q.c.map((_,i)=>i));
  const choices = idxs.map(i=>q.c[i]);
  const answer = idxs.indexOf(q.a);
  return { type:'mc', q:q.q, choices, answer, explanation: q.e || null, source: q._src || null, statKey, statsLessonId };
}

// Picks a weighted subset from a lesson's pool and starts a fresh quiz attempt in state.quiz.
function startQuiz(lesson, servedCount, statsSubjectId, statsLessonId){
  const poolSize = lesson.quiz.length;
  const served = Math.min(servedCount, poolSize);
  let picked;
  let attempts = 0;
  do{
    picked = weightedQuizSample(lesson.quiz, served, statsSubjectId, statsLessonId);
    attempts++;
  } while(
    attempts < 6 &&
    poolSize > served &&
    lesson._lastPickSignature &&
    picked.map(qKey).join('|') === lesson._lastPickSignature
  );
  lesson._lastPickSignature = picked.map(qKey).join('|');

  state.quiz = {
    questions: picked.map(buildQuizQuestion),
    current: 0,
    score: 0,
    selected: null,
    locked: false,
    confirming: false,
    attemptRecorded: false,
    statsSubjectId, statsLessonId
  };
}

function formatMasteryBadge(pct){
  if(pct===null) return { label:'New', cls:'mastery-new' };
  if(pct>=85) return { label:pct+'%', cls:'mastery-high' };
  if(pct>=60) return { label:pct+'%', cls:'mastery-mid' };
  return { label:pct+'%', cls:'mastery-low' };
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  DATA.forEach(subj=>{
    const btn = document.createElement('button');
    btn.className = 'subject-btn' + (state.subjectId===subj.id ? ' active' : '');
    btn.textContent = subj.name;
    btn.onclick = ()=>{
      if(state.subjectId===subj.id){
        state.subjectId = null;
        state.mixedReview = false;
        state.mixedSetup = null;
        state.weakSpots = false;
      } else {
        state.subjectId = subj.id;
      }
      renderSidebar();
    };
    sb.appendChild(btn);

    const ul = document.createElement('ul');
    ul.className = 'lesson-list' + (state.subjectId===subj.id ? ' open' : '');

    if(subj.lessons.length > 1){
      const mixLi = document.createElement('li');
      const mixBtn = document.createElement('button');
      mixBtn.className = 'lesson-btn mixed-review-btn' + (state.subjectId===subj.id && state.mixedReview ? ' active' : '');
      mixBtn.innerHTML = ICONS.dice + ' Mixed Review (All Lessons)';
      mixBtn.onclick = ()=>{
        state.subjectId = subj.id;
        state.lessonId = null;
        state.mixedReview = true;
        state.mixedSetup = null;
        state.weakSpots = false;
        state.quiz = null;
        renderSidebar();
        renderMain();
      };
      mixLi.appendChild(mixBtn);
      ul.appendChild(mixLi);

      const weakLi = document.createElement('li');
      const weakBtn = document.createElement('button');
      weakBtn.className = 'lesson-btn weak-spots-btn' + (state.subjectId===subj.id && state.weakSpots ? ' active' : '');
      weakBtn.innerHTML = '⚠️ Weak Spots';
      weakBtn.onclick = ()=>{
        state.subjectId = subj.id;
        state.lessonId = null;
        state.mixedReview = false;
        state.weakSpots = true;
        state.quiz = null;
        renderSidebar();
        renderMain();
      };
      weakLi.appendChild(weakBtn);
      ul.appendChild(weakLi);
    }

    const revealed = !!state.revealHidden[subj.id];
    const selectModeOn = !!state.selectMode[subj.id];
    if(!state.selectedForHide[subj.id]) state.selectedForHide[subj.id] = new Set();
    const selectedSet = state.selectedForHide[subj.id];

    const visibleLessons = [];
    const hiddenLessons = [];
    subj.lessons.forEach(les=>{
      (isLessonHidden(subj.id, les.id) ? hiddenLessons : visibleLessons).push(les);
    });

    if(subj.lessons.length > 1){
      const selectLi = document.createElement('li');
      const selectBtn = document.createElement('button');
      selectBtn.className = 'hidden-toggle-btn select-mode-btn' + (selectModeOn ? ' active' : '');
      selectBtn.innerHTML = (selectModeOn ? ICONS.cross : ICONS.eyeOff) + (selectModeOn ? 'Cancel selecting' : 'Select lessons to hide');
      selectBtn.onclick = ()=>{
        state.selectMode[subj.id] = !selectModeOn;
        state.selectedForHide[subj.id] = new Set();
        renderSidebar();
      };
      selectLi.appendChild(selectBtn);
      ul.appendChild(selectLi);
    }

    function buildLessonRow(les, hidden){
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'lesson-row' + (hidden ? ' hidden-lesson-row' : '');

      const lbtn = document.createElement('button');
      lbtn.className = 'lesson-btn' + (state.lessonId===les.id && state.subjectId===subj.id && !state.mixedReview ? ' active' : '');
      const titleSpan = document.createElement('span');
      titleSpan.textContent = les.title;
      lbtn.appendChild(titleSpan);
      if(les.quiz && les.quiz.length){
        const pct = getMasteryPct(subj.id, les.id);
        const badgeInfo = formatMasteryBadge(pct);
        const badge = document.createElement('span');
        badge.className = 'mastery-badge ' + badgeInfo.cls;
        badge.textContent = badgeInfo.label;
        lbtn.appendChild(badge);
      }

      if(selectModeOn && !hidden){
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'lesson-select-checkbox';
        cb.checked = selectedSet.has(les.id);
        cb.onchange = ()=>{
          if(cb.checked) selectedSet.add(les.id); else selectedSet.delete(les.id);
          renderSidebar();
        };
        row.appendChild(cb);
        lbtn.onclick = ()=>{
          if(selectedSet.has(les.id)) selectedSet.delete(les.id); else selectedSet.add(les.id);
          renderSidebar();
        };
      } else if(hidden){
        const hideBtn = document.createElement('button');
        hideBtn.className = 'hide-lesson-btn';
        hideBtn.title = 'Unhide this lesson';
        hideBtn.innerHTML = ICONS.eye;
        hideBtn.onclick = (e)=>{
          e.stopPropagation();
          toggleLessonHidden(subj.id, les.id);
          renderSidebar();
        };
        row.appendChild(hideBtn);
        lbtn.onclick = (e)=>{ e.preventDefault(); };
      } else {
        lbtn.onclick = ()=>{
          state.subjectId = subj.id;
          state.lessonId = les.id;
          state.mode = 'study';
          state.quiz = null;
          state.mixedReview = false;
          state.mixedSetup = null;
          state.weakSpots = false;
          state.termsOrder = null;
          state.termsPracticeMode = false;
          state.practiceSession = null;
          renderSidebar();
          renderMain();
        };
      }

      row.appendChild(lbtn);
      li.appendChild(row);
      return li;
    }

    visibleLessons.forEach(les=> ul.appendChild(buildLessonRow(les, false)));

    if(selectModeOn){
      const actionLi = document.createElement('li');
      const actionBtn = document.createElement('button');
      actionBtn.className = 'hidden-toggle-btn bulk-hide-btn';
      actionBtn.disabled = selectedSet.size === 0;
      actionBtn.innerHTML = ICONS.eyeOff + 'Hide ' + selectedSet.size + ' selected';
      actionBtn.onclick = ()=>{
        selectedSet.forEach(id=>{
          toggleLessonHidden(subj.id, id);
          if(state.lessonId===id && state.subjectId===subj.id) state.lessonId = null;
        });
        state.selectedForHide[subj.id] = new Set();
        state.selectMode[subj.id] = false;
        renderSidebar();
      };
      actionLi.appendChild(actionBtn);
      ul.appendChild(actionLi);
    }

    if(hiddenLessons.length){
      const toggleLi = document.createElement('li');
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'hidden-toggle-btn';
      toggleBtn.innerHTML = (revealed ? ICONS.eyeOff : ICONS.eye) + (revealed ? 'Hide' : 'Show') + ' ' + hiddenLessons.length + ' hidden lesson' + (hiddenLessons.length===1 ? '' : 's');
      toggleBtn.onclick = ()=>{
        state.revealHidden[subj.id] = !revealed;
        renderSidebar();
      };
      toggleLi.appendChild(toggleBtn);
      ul.appendChild(toggleLi);

      if(revealed){
        hiddenLessons.forEach(les=> ul.appendChild(buildLessonRow(les, true)));
      }
    }

    sb.appendChild(ul);
  });
}

  const palaceBtn = document.createElement('button');
  palaceBtn.innerHTML = ICONS.palace + 'Memory Palace';
  palaceBtn.className = state.mode==='palace' ? 'active' : '';
  palaceBtn.onclick = ()=>{ state.mode='palace'; state.quiz=null; renderMain(); };
  toggle.appendChild(studyBtn); toggle.appendChild(termsBtn); toggle.appendChild(quizBtn); toggle.appendChild(palaceBtn);
  if(lesson.summary && lesson.summary.length){
    const summaryBtn = document.createElement('button');
    summaryBtn.innerHTML = ICONS.bulb + 'Summary';
    summaryBtn.className = state.mode==='summary' ? 'active' : '';
    summaryBtn.onclick = ()=>{ state.mode='summary'; state.quiz=null; renderMain(); };
    toggle.appendChild(summaryBtn);
  }
  headerDiv.appendChild(toggle);
  main.appendChild(headerDiv);

  if(state.mode==='study'){
    renderHighlightableContent(lesson, main, 'study', lesson.content, '');
  } else if(state.mode==='terms'){
    renderTerms(lesson, main);
  } else if(state.mode==='palace'){
    renderPalace(lesson, main);
  } else if(state.mode==='summary'){
    renderHighlightableContent(lesson, main, 'summary', lesson.summary || [], 'summary-card');
  } else {
    renderQuiz(lesson, main);
  }
}

/* ============================= HIGHLIGHTING ============================= */
function hlStorageKey(lessonId, mode){
  return 'reviewer_hl__' + state.subjectId + '__' + lessonId + '__' + mode;
}

function renderHighlightableContent(lesson, main, mode, sections, extraCardClass){
  const key = hlStorageKey(lesson.id, mode);

  const toolbar = document.createElement('div');
  toolbar.className = 'hl-hint';

  if(state.undoHighlight && state.undoHighlight.key === key){
    toolbar.innerHTML = `<span>${ICONS.bulb} Highlights cleared.</span>`;
    const undoBtn = document.createElement('button');
    undoBtn.className = 'hl-clear-btn';
    undoBtn.textContent = 'Undo';
    undoBtn.onclick = ()=>{
      try{ localStorage.setItem(key, state.undoHighlight.value); }catch(e){}
      state.undoHighlight = null;
      renderMain();
    };
    toolbar.appendChild(undoBtn);
  } else {
    toolbar.innerHTML = `<span>${ICONS.bulb} Select any text below to highlight it.</span>`;
    const clearBtn = document.createElement('button');
    clearBtn.className = 'hl-clear-btn';
    clearBtn.textContent = 'Clear Highlights';
    clearBtn.onclick = ()=>{
      const prevValue = localStorage.getItem(key);
      localStorage.removeItem(key);
      state.undoHighlight = prevValue ? { key, value: prevValue } : null;
      renderMain();
    };
    toolbar.appendChild(clearBtn);
  }
  main.appendChild(toolbar);

  const container = document.createElement('div');
  container.className = 'hl-container';

  let saved = null;
  try{ saved = localStorage.getItem(key); }catch(e){ saved = null; }

  if(saved){
    container.innerHTML = saved;
  } else {
    sections.forEach(sec=>{
      const card = document.createElement('div');
      card.className = 'content-card' + (extraCardClass ? ' '+extraCardClass : '');
      const h3 = document.createElement('h3'); h3.textContent = sec.h;
      card.appendChild(h3);
      if(sec.svg){
        const diagramWrap = document.createElement('div');
        diagramWrap.className = 'diagram-wrap';
        diagramWrap.innerHTML = sec.svg;
        card.appendChild(diagramWrap);
      }
      const ul = document.createElement('ul');
      sec.b.forEach(pt=>{
        const li = document.createElement('li'); li.textContent = pt; ul.appendChild(li);
      });
      card.appendChild(ul);
      container.appendChild(card);
    });
  }

  main.appendChild(container);
  attachHighlighting(container, key);
}

function attachHighlighting(container, storageKey){
  let floatBtn = null;

  function removeFloatBtn(){
    if(floatBtn){ floatBtn.remove(); floatBtn = null; }
  }

  function saveSnapshot(){
    try{ localStorage.setItem(storageKey, container.innerHTML); }catch(e){ /* storage full or unavailable */ }
  }

  function wrapRange(range){
    const mark = document.createElement('mark');
    mark.className = 'user-hl';
    try{
      range.surroundContents(mark);
    }catch(e){
      const frag = range.extractContents();
      mark.appendChild(frag);
      range.insertNode(mark);
    }
  }

  container.addEventListener('mouseup', (ev)=>{
    // Clicking an existing highlight removes it
    if(ev.target.closest && ev.target.closest('mark.user-hl')){
      const mark = ev.target.closest('mark.user-hl');
      const parent = mark.parentNode;
      while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      parent.normalize();
      saveSnapshot();
      removeFloatBtn();
      return;
    }
    const sel = window.getSelection();
    removeFloatBtn();
    if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    if(!container.contains(range.commonAncestorContainer)) return;
    const rect = range.getBoundingClientRect();
    if(rect.width===0 && rect.height===0) return;

    floatBtn = document.createElement('button');
    floatBtn.className = 'hl-float-btn';
    floatBtn.innerHTML = ICONS.bulb + 'Highlight';
    document.body.appendChild(floatBtn);
    const btnWidth = floatBtn.offsetWidth || 100;
    let left = rect.left + rect.width/2;
    left = Math.max(btnWidth/2 + 8, Math.min(left, window.innerWidth - btnWidth/2 - 8));
    let top = rect.top - 34;
    if(top < 8) top = rect.bottom + 8; // flip below the selection if there's no room above
    floatBtn.style.left = left + 'px';
    floatBtn.style.top = top + 'px';
    floatBtn.onmousedown = (e)=>{ e.preventDefault(); }; // keep selection alive
    floatBtn.onclick = ()=>{
      wrapRange(range);
      sel.removeAllRanges();
      saveSnapshot();
      removeFloatBtn();
    };
  });

  document.addEventListener('mousedown', (ev)=>{
    if(floatBtn && !(ev.target.closest && ev.target.closest('.hl-float-btn'))) removeFloatBtn();
  });
}

/* ============================= FLASHCARD PRACTICE (TERMS) ============================= */
function termStatsKey(subjectId, lessonId){
  return 'reviewer_termstats__' + subjectId + '__' + lessonId;
}
function getTermStats(subjectId, lessonId){
  try{
    const raw = localStorage.getItem(termStatsKey(subjectId, lessonId));
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return {};
}
function setTermRating(subjectId, lessonId, term, rating){
  const stats = getTermStats(subjectId, lessonId);
  stats[term] = rating; // 'known' | 'learning'
  try{ localStorage.setItem(termStatsKey(subjectId, lessonId), JSON.stringify(stats)); }catch(e){}
  touchStreak();
}

function renderTermsPractice(lesson, terms, main){
  if(!state.practiceSession){
    state.practiceSession = { order: shuffle(terms.map((_,i)=>i)), pos: 0, flipped: false, known: 0, learning: 0 };
  }
  const sess = state.practiceSession;

  if(sess.pos >= sess.order.length){
    const box = document.createElement('div');
    box.className = 'practice-complete';
    box.innerHTML = `
      <div class="big">${sess.known} / ${sess.order.length}</div>
      <p>Marked as known this round. ${sess.learning} still need review.</p>
    `;
    const restart = document.createElement('button');
    restart.className = 'retry-btn';
    restart.innerHTML = ICONS.refresh + 'Practice Again';
    restart.onclick = ()=>{
      state.practiceSession = { order: shuffle(terms.map((_,i)=>i)), pos: 0, flipped: false, known: 0, learning: 0 };
      renderMain();
    };
    box.appendChild(restart);
    main.appendChild(box);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'practice-session';

  const progress = document.createElement('div');
  progress.className = 'practice-progress';
  progress.innerHTML = `<span>Card ${sess.pos+1} of ${sess.order.length}</span>`;
  wrap.appendChild(progress);

  const tally = document.createElement('div');
  tally.className = 'practice-tally';
  tally.innerHTML = `<span>✅ Known: ${sess.known}</span><span>🔁 Learning: ${sess.learning}</span>`;
  wrap.appendChild(tally);

  const t = terms[sess.order[sess.pos]];
  const card = document.createElement('div');
  card.className = 'practice-card' + (sess.flipped ? ' flipped' : '');
  card.innerHTML = `
    <div class="practice-card-inner">
      <div class="practice-face practice-front">
        <span class="flashcard-tag">TERM</span>
        <div class="practice-term">${t.term}</div>
        <span class="flashcard-hint">tap to reveal definition</span>
      </div>
      <div class="practice-face practice-back">
        <span class="flashcard-tag">DEFINITION</span>
        <div class="practice-def">${t.def}</div>
      </div>
    </div>`;
  card.onclick = ()=>{ sess.flipped = !sess.flipped; renderMain(); };
  wrap.appendChild(card);

  const rateRow = document.createElement('div');
  rateRow.className = 'practice-rate-row';
  const learningBtn = document.createElement('button');
  learningBtn.className = 'practice-rate-btn practice-rate-learning';
  learningBtn.textContent = '🔁 Still Learning';
  learningBtn.onclick = ()=>{
    setTermRating(state.subjectId, lesson.id, t.term, 'learning');
    sess.learning++;
    sess.pos++;
    sess.flipped = false;
    renderMain();
  };
  const knownBtn = document.createElement('button');
  knownBtn.className = 'practice-rate-btn practice-rate-known';
  knownBtn.textContent = '✅ Got It';
  knownBtn.onclick = ()=>{
    setTermRating(state.subjectId, lesson.id, t.term, 'known');
    sess.known++;
    sess.pos++;
    sess.flipped = false;
    renderMain();
  };
  rateRow.appendChild(learningBtn);
  rateRow.appendChild(knownBtn);
  wrap.appendChild(rateRow);

  const nav = document.createElement('div');
  nav.className = 'practice-nav';
  const skipBtn = document.createElement('button');
  skipBtn.textContent = 'Skip without rating →';
  skipBtn.onclick = ()=>{ sess.pos++; sess.flipped = false; renderMain(); };
  nav.appendChild(document.createElement('span'));
  nav.appendChild(skipBtn);
  wrap.appendChild(nav);

  main.appendChild(wrap);
}

function renderWeakSpots(main){
  const subj = getSubject(state.subjectId);
  main.innerHTML = '';

  const headerDiv = document.createElement('div');
  headerDiv.className = 'lesson-header';
  headerDiv.innerHTML = `<h2>⚠️ Weak Spots — ${subj.name}</h2>`;
  const exitBtn = document.createElement('button');
  exitBtn.className = 'hl-clear-btn';
  exitBtn.textContent = 'Back to Lessons';
  exitBtn.onclick = ()=>{ state.weakSpots = false; renderSidebar(); renderMain(); };
  headerDiv.appendChild(exitBtn);
  main.appendChild(headerDiv);

  // Gather every question across every lesson in this subject, along with its per-question stats.
  const weakItems = [];
  subj.lessons.forEach(les=>{
    const stats = getStats(subj.id, les.id);
    (les.quiz||[]).forEach(q=>{
      const key = qKey(q);
      const s = stats.questions && stats.questions[key];
      if(s && s.wrong > 0 && s.wrong >= s.correct){
        weakItems.push({
          q, lessonTitle: les.title, lessonId: les.id,
          correct: s.correct, wrong: s.wrong
        });
      }
    });
  });

  weakItems.sort((a,b)=> (b.wrong - b.correct) - (a.wrong - a.correct));

  if(weakItems.length===0){
    const empty = document.createElement('div');
    empty.className = 'welcome';
    empty.innerHTML = `No weak spots found yet in ${subj.name}.<br><br>Take some quizzes first — any question you miss more than you get right will show up here so you can drill it specifically.`;
    main.appendChild(empty);
    return;
  }

  const intro = document.createElement('div');
  intro.className = 'hl-hint';
  intro.innerHTML = `<span>${ICONS.bulb} ${weakItems.length} question${weakItems.length===1?'':'s'} you\'ve missed more than you\'ve gotten right, across ${subj.name}.</span>`;
  main.appendChild(intro);

  const drillBtn = document.createElement('button');
  drillBtn.className = 'start-mixed-btn';
  drillBtn.innerHTML = ICONS.dice + `Drill These ${weakItems.length} Weak Questions`;
  drillBtn.style.marginBottom = '18px';
  drillBtn.onclick = ()=>{
    const pool = weakItems.map(item => Object.assign({}, item.q, { _src: item.lessonTitle, _statsLessonId: item.lessonId }));
    const virtualLesson = { id:'weakdrill', title:'Weak Spots Drill — ' + subj.name, quiz: pool };
    startQuiz(virtualLesson, pool.length, subj.id, 'weakdrill');
    state.weakSpots = false;
    state.mixedReview = true;   // reuse the mixed-review quiz display shell
    state.mixedSetup = { selected: new Set(), count: pool.length }; // not used since state.quiz already set
    renderSidebar();
    renderMain();
  };
  main.appendChild(drillBtn);

  const list = document.createElement('div');
  list.className = 'content-card';
  weakItems.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'weak-item-row';
    const qText = item.q.type === 'dual'
      ? `S1: ${item.q.s1} — S2: ${item.q.s2}`
      : item.q.q;
    row.innerHTML = `
      <div class="weak-item-text">${qText}</div>
      <div class="weak-item-meta">
        <span class="source-tag">${item.lessonTitle}</span>
        <span class="weak-item-score">✅ ${item.correct} · ❌ ${item.wrong}</span>
      </div>`;
    list.appendChild(row);
  });
  main.appendChild(list);
}

function renderMixedReview(main){
  const subj = getSubject(state.subjectId);
  main.innerHTML = '';

  const quizzableLessons = subj.lessons.filter(l=>l.quiz && l.quiz.length);
  if(quizzableLessons.length===0){
    const empty = document.createElement('div');
    empty.className = 'welcome';
    empty.textContent = 'No quiz questions found in this subject yet.';
    main.appendChild(empty);
    return;
  }

  if(!state.mixedSetup){
    const totalAll = quizzableLessons.reduce((s,l)=>s+l.quiz.length,0);
    state.mixedSetup = {
      selected: new Set(quizzableLessons.map(l=>l.id)),
      count: Math.max(1, Math.min(20, totalAll))
    };
  }

  const headerDiv = document.createElement('div');
  headerDiv.className = 'lesson-header';
  headerDiv.innerHTML = `<h2>${ICONS.dice}Mixed Review — ${subj.name}</h2>`;
  const exitBtn = document.createElement('button');
  exitBtn.className = 'hl-clear-btn';
  exitBtn.textContent = 'Exit Mixed Review';
  exitBtn.onclick = ()=>{
    state.mixedReview = false;
    state.mixedSetup = null;
    state.quiz = null;
    renderSidebar();
    renderMain();
  };
  headerDiv.appendChild(exitBtn);
  main.appendChild(headerDiv);

  if(!state.quiz){
    renderMixedSetupPanel(subj, quizzableLessons, main);
    return;
  }

  // A quiz is already in progress (or just finished) — just display it.
  renderQuiz({ id:'mixed', title:'Mixed Review — ' + subj.name, quiz:[] }, main, {
    statsSubjectId: subj.id,
    statsLessonId: 'mixed',
    isMixed: true
  });
}

function renderMixedSetupPanel(subj, quizzableLessons, main){
  const setup = state.mixedSetup;
  const panel = document.createElement('div');
  panel.className = 'mixed-setup-panel';

  const lessonSection = document.createElement('div');
  lessonSection.className = 'mixed-setup-section';
  const lsTitle = document.createElement('h4');
  lsTitle.textContent = 'Choose lessons to include:';
  lessonSection.appendChild(lsTitle);

  const quickRow = document.createElement('div');
  quickRow.className = 'mixed-quick-row';
  const allBtn = document.createElement('button');
  allBtn.type = 'button'; allBtn.className = 'hl-clear-btn'; allBtn.textContent = 'Select All';
  const noneBtn = document.createElement('button');
  noneBtn.type = 'button'; noneBtn.className = 'hl-clear-btn'; noneBtn.textContent = 'Select None';
  quickRow.appendChild(allBtn); quickRow.appendChild(noneBtn);
  lessonSection.appendChild(quickRow);

  const checklist = document.createElement('div');
  checklist.className = 'mixed-lesson-checklist';

  const countInput = document.createElement('input');
  countInput.type = 'number';
  countInput.min = '1';
  countInput.className = 'mixed-count-input';

  const countHint = document.createElement('div');
  countHint.className = 'mixed-count-hint';

  const startBtn = document.createElement('button');
  startBtn.className = 'start-mixed-btn';
  startBtn.innerHTML = ICONS.dice + 'Start Mixed Review';

  function updateCountBounds(){
    const total = quizzableLessons
      .filter(l=>setup.selected.has(l.id))
      .reduce((s,l)=>s+l.quiz.length,0);
    countInput.max = String(Math.max(1, total));
    if(total === 0){
      countHint.textContent = 'Select at least one lesson to continue.';
      startBtn.disabled = true;
    } else {
      if(setup.count > total) setup.count = total;
      countInput.value = setup.count;
      countHint.textContent = `Combined pool: ${total} question${total===1?'':'s'} across ${setup.selected.size} lesson${setup.selected.size===1?'':'s'} selected.`;
      startBtn.disabled = false;
    }
  }

  quizzableLessons.forEach(les=>{
    const row = document.createElement('label');
    row.className = 'mixed-lesson-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = setup.selected.has(les.id);
    cb.onchange = ()=>{
      if(cb.checked) setup.selected.add(les.id);
      else setup.selected.delete(les.id);
      updateCountBounds();
    };
    const span = document.createElement('span');
    span.textContent = `${les.title} (${les.quiz.length} question${les.quiz.length===1?'':'s'})`;
    row.appendChild(cb);
    row.appendChild(span);
    checklist.appendChild(row);
  });
  lessonSection.appendChild(checklist);

  allBtn.onclick = ()=>{
    quizzableLessons.forEach(l=>setup.selected.add(l.id));
    renderMain();
  };
  noneBtn.onclick = ()=>{
    setup.selected.clear();
    renderMain();
  };

  const countSection = document.createElement('div');
  countSection.className = 'mixed-setup-section';
  const countLabel = document.createElement('h4');
  countLabel.textContent = 'How many questions?';
  countSection.appendChild(countLabel);
  countInput.value = setup.count;
  countInput.onchange = ()=>{
    const max = parseInt(countInput.max,10) || 1;
    let v = parseInt(countInput.value,10) || 1;
    v = Math.max(1, Math.min(max, v));
    countInput.value = v;
    setup.count = v;
    countHint.textContent = countHint.textContent.replace(/^Combined pool: \d+/, `Combined pool: ${max}`);
  };
  countSection.appendChild(countInput);
  countSection.appendChild(countHint);

  startBtn.onclick = ()=>{
    const combined = [];
    quizzableLessons.forEach(les=>{
      if(!setup.selected.has(les.id)) return;
      les.quiz.forEach(q=> combined.push(Object.assign({}, q, { _src: les.title })));
    });
    if(combined.length===0) return;
    const virtualLesson = { id:'mixed', title:'Mixed Review — ' + subj.name, quiz: combined };
    startQuiz(virtualLesson, setup.count, subj.id, 'mixed');
    renderMain();
  };

  panel.appendChild(lessonSection);
  panel.appendChild(countSection);
  panel.appendChild(startBtn);
  main.appendChild(panel);

  updateCountBounds();
}

function renderQuiz(lesson, main, opts){
  opts = opts || {};
  const statsSubjectId = opts.statsSubjectId || state.subjectId;
  const statsLessonId = opts.statsLessonId || lesson.id;
  const QUIZ_LENGTH = opts.servedOverride || 20; // number of questions served per attempt, drawn from the pool

  if(!state.quiz){
    const panel = document.createElement('div');
    panel.className = 'start-quiz-panel';
    const poolSize = lesson.quiz.length;
    const served = Math.min(QUIZ_LENGTH, poolSize);
    const mastery = getMasteryPct(statsSubjectId, statsLessonId);
    const masteryLine = mastery===null
      ? ''
      : `<div class="mastery-line">Your recent average on this ${opts.isMixed ? 'mixed review' : 'quiz'}: <strong>${mastery}%</strong></div>`;
    panel.innerHTML = `<div>This ${opts.isMixed ? 'review pulls from' : 'lesson has'} a pool of ${poolSize} question${poolSize===1?'':'s'}. Each attempt serves ${served} of them — weighted so questions you've missed before show up more often, and ones you've mastered show up less. Freshly shuffled every time you start.</div>${masteryLine}<div class="mastery-line">⌨️ Tip: press 1-4 to pick an answer, Enter to confirm/continue, Esc to change your pick.</div>`;
    const btn = document.createElement('button');
    btn.innerHTML = ICONS.dice + (opts.isMixed ? 'Start Mixed Review' : 'Start Quiz');
    btn.onclick = ()=>{
      startQuiz(lesson, served, statsSubjectId, statsLessonId);
      renderMain();
    };
    panel.appendChild(btn);
    main.appendChild(panel);
    return;
  }

  const quiz = state.quiz;
  if(quiz.current >= quiz.questions.length){
    if(!quiz.attemptRecorded){
      recordAttempt(quiz.statsSubjectId, quiz.statsLessonId, quiz.score, quiz.questions.length);
      quiz.attemptRecorded = true;
      renderSidebar(); // refresh mastery badges now that this attempt is saved
    }
    const box = document.createElement('div');
    box.className = 'quiz-box score-screen';
    const pct = Math.round((quiz.score/quiz.questions.length)*100);
    const overallMastery = getMasteryPct(quiz.statsSubjectId, quiz.statsLessonId);
    box.innerHTML = `
      <div class="big">${quiz.score} / ${quiz.questions.length}</div>
      <p>You scored ${pct}%</p>
      ${overallMastery!==null ? `<p class="mastery-line">Recent average: <strong>${overallMastery}%</strong></p>` : ''}
    `;
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.innerHTML = ICONS.refresh + 'Retry with shuffled questions';
    retry.onclick = ()=>{ state.quiz = null; renderMain(); };
    box.appendChild(retry);
    if(opts.isMixed){
      const exitBtn = document.createElement('button');
      exitBtn.className = 'retry-btn';
      exitBtn.innerHTML = ICONS.arrowLeft ? (ICONS.arrowLeft+'Exit Mixed Review') : 'Exit Mixed Review';
      exitBtn.onclick = ()=>{ state.quiz=null; state.mixedReview=false; renderSidebar(); renderMain(); };
      box.appendChild(exitBtn);
    }
    main.appendChild(box);
    return;
  }

  const q = quiz.questions[quiz.current];
  const box = document.createElement('div');
  box.className = 'quiz-box';

  const meta = document.createElement('div');
  meta.className = 'quiz-meta';
  meta.innerHTML = `<span>Question ${quiz.current+1} of ${quiz.questions.length}</span><span>Score: ${quiz.score}</span>`;
  box.appendChild(meta);

  const pbar = document.createElement('div');
  pbar.className = 'progress-bar';
  const pfill = document.createElement('div');
  pfill.className = 'progress-fill';
  pfill.style.width = ((quiz.current)/quiz.questions.length*100)+'%';
  pbar.appendChild(pfill);
  box.appendChild(pbar);

  if(q.source){
    const srcTag = document.createElement('div');
    srcTag.className = 'source-tag';
    srcTag.textContent = 'From: ' + q.source;
    box.appendChild(srcTag);
  }

  if(q.type === 'dual'){
    const dualWrap = document.createElement('div');
    dualWrap.className = 'dual-statement-wrap';

    const s1div = document.createElement('div');
    s1div.className = 'statement-block';
    const s1label = document.createElement('span');
    s1label.className = 'statement-label';
    s1label.textContent = 'Statement 1: ';
    s1div.appendChild(s1label);
    s1div.appendChild(document.createTextNode(q.s1));

    const s2div = document.createElement('div');
    s2div.className = 'statement-block';
    const s2label = document.createElement('span');
    s2label.className = 'statement-label';
    s2label.textContent = 'Statement 2: ';
    s2div.appendChild(s2label);
    s2div.appendChild(document.createTextNode(q.s2));

    dualWrap.appendChild(s1div);
    dualWrap.appendChild(s2div);
    box.appendChild(dualWrap);
  } else {
    const qt = document.createElement('div');
    qt.className = 'question-text';
    qt.textContent = q.q;
    box.appendChild(qt);
  }

  q.choices.forEach((choice, i)=>{
    const cbtn = document.createElement('button');
    cbtn.className = 'choice';
    cbtn.textContent = choice;
    if(quiz.locked){
      cbtn.disabled = true;
      if(i===q.answer) cbtn.classList.add('correct');
      else if(i===quiz.selected) cbtn.classList.add('wrong');
    } else if(quiz.confirming){
      cbtn.disabled = true;
      if(i===quiz.selected) cbtn.classList.add('selected-pending');
    }
    cbtn.onclick = ()=>{
      if(quiz.locked || quiz.confirming) return;
      quiz.selected = i;
      quiz.confirming = true;
      renderMain();
    };
    box.appendChild(cbtn);
  });

  if(quiz.confirming && !quiz.locked){
    const confirmBox = document.createElement('div');
    confirmBox.className = 'confirm-box';
    confirmBox.innerHTML = `<p>Are you sure about that answer?</p>`;
    const yesBtn = document.createElement('button');
    yesBtn.className = 'confirm-yes';
    yesBtn.textContent = 'Yes, lock it in';
    yesBtn.onclick = ()=>{
      quiz.locked = true;
      quiz.confirming = false;
      const wasCorrect = quiz.selected===q.answer;
      if(wasCorrect) quiz.score++;
      recordAnswer(quiz.statsSubjectId, q.statsLessonId || quiz.statsLessonId, q.statKey, wasCorrect);
      if(q.statsLessonId) renderSidebar(); // weak-spot drills can touch several lessons' badges mid-session
      renderMain();
    };
    const noBtn = document.createElement('button');
    noBtn.className = 'confirm-no';
    noBtn.textContent = 'No, let me change it';
    noBtn.onclick = ()=>{
      quiz.selected = null;
      quiz.confirming = false;
      renderMain();
    };
    confirmBox.appendChild(yesBtn);
    confirmBox.appendChild(noBtn);
    box.appendChild(confirmBox);
  }

  if(quiz.locked){
    const wasCorrect = quiz.selected === q.answer;
    const expBox = document.createElement('div');
    expBox.className = 'explain-box ' + (wasCorrect ? 'explain-correct' : 'explain-wrong');
    const headerLine = wasCorrect
      ? (ICONS.check || '') + 'Correct!'
      : (ICONS.cross || '') + 'Not quite — here\'s why:';
    let bodyLine;
    if(q.explanation){
      bodyLine = q.explanation;
    } else if(wasCorrect){
      bodyLine = 'Nice work — that\'s the right answer.';
    } else {
      bodyLine = `The correct answer is "${q.choices[q.answer]}." Review this lesson's Study tab for the full context.`;
    }
    expBox.innerHTML = `<div class="explain-head">${headerLine}</div><div class="explain-body">${bodyLine}</div>`;
    box.appendChild(expBox);
  }

  const nav = document.createElement('div');
  nav.className = 'quiz-nav';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = (quiz.current === quiz.questions.length-1) ? 'See Results' : 'Next Question →';
  nextBtn.disabled = !quiz.locked;
  nextBtn.onclick = ()=>{
    quiz.current++;
    quiz.selected = null;
    quiz.locked = false;
    quiz.confirming = false;
    renderMain();
  };
  nav.appendChild(nextBtn);
  box.appendChild(nav);

  main.appendChild(box);
}

renderSidebar();
renderMain();
renderStreakBadge();

/* ============================= QUIZ KEYBOARD SHORTCUTS ============================= */
// Number keys pick an answer, Enter confirms/advances, Escape backs out of the confirm step.
// Self-guards on current DOM/state each keypress, so it's safe to attach just once.
function handleQuizKeydown(e){
  if(!state.quiz) return;
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const quiz = state.quiz;
  if(quiz.current >= quiz.questions.length) return; // score screen — no shortcuts there
  const choiceButtons = Array.from(document.querySelectorAll('.quiz-box .choice'));
  if(!choiceButtons.length) return;

  if(e.key >= '1' && e.key <= '9'){
    const idx = parseInt(e.key, 10) - 1;
    if(idx < choiceButtons.length && !quiz.locked && !quiz.confirming){
      e.preventDefault();
      choiceButtons[idx].click();
    }
  } else if(e.key === 'Enter'){
    if(quiz.confirming && !quiz.locked){
      e.preventDefault();
      const yesBtn = document.querySelector('.confirm-yes');
      if(yesBtn) yesBtn.click();
    } else if(quiz.locked){
      e.preventDefault();
      const nextBtn = Array.from(document.querySelectorAll('.quiz-box button'))
        .find(b => b.textContent.includes('Next Question') || b.textContent.includes('See Results'));
      if(nextBtn) nextBtn.click();
    }
  } else if(e.key === 'Escape'){
    if(quiz.confirming && !quiz.locked){
      e.preventDefault();
      const noBtn = document.querySelector('.confirm-no');
      if(noBtn) noBtn.click();
    }
  }
}
document.addEventListener('keydown', handleQuizKeydown);
</script>
