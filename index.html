    {q:'Which of the following would require the MOST careful discernment by the Magisterium before being accepted, even partially?', c:['A claim of a new apparition of the Virgin Mary','The Gospel of John','The Nicene Creed','Public Revelation through Christ'], a:0, e:'Claims of new apparitions fall under Private Revelation and require careful examination by the Magisterium, unlike already-established Public Revelation or canonical Scripture.'},
    {q:'The phrase "God reaching out to us in friendship" primarily emphasizes which quality of divine revelation?', c:['Its distant, impersonal nature','Its relational, personal nature, inviting a response of love','Its purely legal/contractual nature','Its purely punitive nature'], a:1, e:'This phrase emphasizes that divine revelation is deeply relational and personal — God reaching out in friendship, inviting humanity into a loving relationship, not simply issuing commands.'},
    {q:'Which type of revelation would a scientist studying the intricate design of a living cell be indirectly engaging with, from a faith perspective?', c:['Natural Revelation','Special Revelation','Private Revelation','None — science has no connection to revelation'], a:0, e:'From a faith perspective, studying the order and complexity of creation (like a living cell) can be seen as engaging with Natural Revelation — knowing God through the world He made.'},
    {q:'Which best explains the Church\'s caution around treating a specific statue as if it were magical or literally divine?', c:['The Church encourages this practice','The Church cautions against this because images are signs pointing to God, not God Himself, avoiding idolatry','The Church has no opinion on this practice','This concern only applies to non-Catholic traditions'], a:1, e:'The Church teaches that images are signs pointing to a greater reality; treating them as literally divine or magical risks idolatry, missing their true symbolic purpose.'},
    {q:'A person reads the Bible regularly to grow closer to God and learn salvation history. This practice is most connected to responding to:', c:['Natural Revelation','Special Revelation','Private Revelation only','No form of revelation'], a:1, e:'Special Revelation, equated with the Bible, specifically invites believers to develop a habit of reading Scripture to learn the history of salvation.'},
    {q:'Which of these BEST reflects why Public Revelation is described as "final"?', c:['Because no further teaching or interpretation is possible','Because the fullness of God\'s self-disclosure is complete in Jesus Christ, even though the Church continues to grow in understanding it','Because it happened only once in a single moment with no lasting effect','Because it excludes the Old Testament entirely'], a:1, e:'Public Revelation is "final" in the sense that the fullness of God\'s self-disclosure is complete in Christ — though the Church continues to deepen its understanding of that same revelation over time.'},
    {q:'Which best explains the connection between "Gift of Intellect" and understanding revelation?', c:['Intellect has no role in understanding revelation','The gift of intellect allows humans to reason, reflect on, and respond to God\'s self-disclosure','Only angels have intellect','Intellect is only useful for science, not faith'], a:1, e:'The "Gift of Intellect" is what allows humans to reason about, reflect on, and meaningfully respond to God\'s revelation — a unique capacity among God\'s creation.'},
    {q:'Which of the following would be classified as Special Revelation rather than Natural Revelation?', c:['Admiring a starry night sky','Reading a passage from the Gospel of Luke','Watching ocean waves','Observing a mountain range'], a:1, e:'Reading Scripture (like the Gospel of Luke) falls under Special Revelation, which is equated with the Bible — distinct from Natural Revelation gained through observing creation.'},
    {q:'Which of the following would be classified as Natural Revelation rather than Special Revelation?', c:['Reading the Book of Genesis','Observing the complexity and order of the natural world and inferring a Creator','Reading St. Paul\'s letters','Studying Church councils'], a:1, e:'Observing creation and inferring the existence of a Creator is Natural Revelation, distinct from Special Revelation, which is specifically equated with the Bible.'},
    {q:'The teaching that faith is "with his whole being" (CCC 143) suggests that responding to revelation involves:', c:['Only intellectual assent, with no emotional or willed component','A total response involving mind, heart, and will, not just partial or superficial agreement','No real commitment at all','Only physical actions, like church attendance'], a:1, e:'CCC 143\'s phrase "with his whole being" emphasizes that faith is a total human response — engaging mind, heart, and will — not merely intellectual or superficial agreement.'},
    {q:'A student is asked which type of revelation is "final and complete" and imposes an obligation of faith. The correct answer is:', c:['Natural Revelation','Special Revelation','Private Revelation','Public Revelation'], a:3, e:'Public Revelation, made known through Jesus Christ, is described as final and complete, imposing an obligation of faith on all believers.'},
    {q:'A student is asked which type of revelation "imposes no obligation of faith." The correct answer is:', c:['Public Revelation','Private Revelation','Special Revelation','Natural Revelation'], a:1, e:'Private Revelation (apparitions, mystical experiences) imposes no obligation of faith — believers are invited to discern rather than required to accept every claim.'},
    {q:'Which best reflects why the Church distinguishes clearly between what is "binding" (Public Revelation) and what is "optional" (Private Revelation)?', c:['To protect the core, essential truths of the faith while allowing room for personal spiritual experiences to be discerned individually','To confuse ordinary believers','To eliminate the value of personal spiritual experiences entirely','Because Private Revelation is considered more important than Public Revelation'], a:0, e:'This distinction protects the essential, core truths of the faith (which all Catholics must hold) while still allowing room for personal spiritual experiences to be respected but individually discerned.'},
    {q:'Considering all four types of revelation together, which theme unites them, according to the notes?', c:['They all serve God\'s ultimate purpose of communicating Himself for the sake of humanity\'s salvation','They have no common theme','They only apply to ordained clergy','They exist independently with no relationship to each other'], a:0, e:'All four types of revelation — Natural, Special, Private, and Public — ultimately serve God\'s purpose of communicating Himself and drawing humanity toward salvation.'},
    {q:'Which best describes how the notes frame the relationship between "knowing God" and "loving God"?', c:['They are unrelated goals','Knowing God more clearly is presented as a step that should lead toward loving Him more deeply','Loving God requires no knowledge at all','Knowing God is impossible, so love is the only path'], a:1, e:'The notes present these as connected challenges from revelation: knowing God more clearly (through reading Scripture) is meant to lead toward loving Him more deeply (through charity/love in action).'},
    {q:'A person claims they don\'t need to attend church or read the Bible because they feel connected to God simply through nature. How would the notes on the 4 types of revelation respond to this view?', c:['This view is fully correct and complete','While Natural Revelation is valid, it is not the same as Special or Public Revelation, which offer fuller, more complete knowledge of God through Scripture and Christ','Natural Revelation is worthless and should be dismissed','There is no difference between the types of revelation'], a:1, e:'While Natural Revelation (through creation) is a valid form of knowing God, the notes emphasize that Special Revelation (Scripture) and Public Revelation (Christ) provide a fuller and more complete self-disclosure of God, which Natural Revelation alone does not offer.'},
    {q:'Which of these questions would be most directly answered by studying "Special Revelation"?', c:['What does the night sky teach us about God?','What does the Bible teach us about salvation history?','What miracle occurred at a specific shrine?','What is the final, complete revelation of God?'], a:1, e:'Special Revelation is specifically equated with the Bible, so questions about what Scripture teaches regarding salvation history fall directly under this category.'},
    {q:'Which of these questions would be most directly answered by studying "Public Revelation"?', c:['What does a specific apparition mean?','What can nature teach us about God\'s existence?','What is the final and complete self-disclosure of God to humanity?','What historical claim needs Magisterium review?'], a:2, e:'Public Revelation specifically addresses the final, complete self-disclosure of God to humanity through Jesus Christ.'},
    {q:'A catechist explains that some apparitions have devoted followers even though the Magisterium has not approved them. How should a well-formed Catholic approach this situation, based on the notes?', c:['Automatically believe and follow any popular apparition','Exercise discernment, recognizing that Private Revelation is not binding and should be evaluated by proper Church authority','Reject the Catholic faith entirely','Ignore all Church guidance on the matter'], a:1, e:'The notes emphasize that Private Revelation invites believers to be discerning, recognizing it is not binding, and to look to the Magisterium\'s guidance for authentic evaluation of such claims.'},
    {q:'Which best captures the overall theological point of "The Divine Revelation" lesson as a whole?', c:['God has revealed Himself to humanity in multiple ways, all ultimately oriented toward inviting humans into a relationship of knowledge, love, and salvation','God has never revealed Himself to humanity','Only priests can receive divine revelation','Revelation is purely a historical curiosity with no relevance today'], a:0, e:'The overarching theme is that God has revealed Himself through Natural, Special, Private, and Public means, all oriented toward inviting humanity into a relationship of knowledge, love, and ultimately salvation.'},
    {q:'If someone asked you to summarize "Anthropomorphism" in one sentence, which would be most accurate?', c:['It is the scientific study of ancient humans','It is the attribution of human qualities or form to non-human beings, including God','It is a synonym for atheism','It is a Church council from the 4th century'], a:1, e:'Anthropomorphism is the attribution of human qualities or form (Anthropos = man, Morphe = form) to non-human beings, including how humans often describe God using human-like terms.'},
    {q:'In one sentence, how would you define "Divine Revelation" as covered in this lesson?', c:['God\'s free, gradual self-disclosure to humanity, out of love, for the purpose of our salvation','A random historical event with no spiritual meaning','A purely human invention with no divine origin','A single, one-time event limited to ancient times only'], a:0, e:'Divine Revelation is God\'s free, loving, and gradual self-disclosure to humanity — reaching out in friendship, ultimately for the purpose of humanity\'s salvation.'}
  ],
  glossary:[
    {term:'Natural', def:'knowing God through creation/the world.'},
    {term:'Special', def:'supernatural revelation, equated with the Bible.'},
    {term:'Private', def:'apparitions, mystical experiences; examined by the Magisterium; imposes no obligation of faith.'},
    {term:'Public', def:'revelation through Jesus Christ; final, complete, binds all — imposes obligation of faith.'},
    {term:'Anthropomorphism', def:'the attribution of human qualities to non-human beings, including God (Greek: Anthropos = man, Morphe = form).'},
    {term:'Revelare', def:'Latin: to lift the veil, to disclose, to uncover — root of "revelation."'}
  ]},
  {id:'ff2', title:'2. Transmission of Faith', content:[
    {h:'Faith', b:['From Latin "Fides" (trust, loyalty). Faith is a virtue infused by God — unmerited, given from His goodness.'] },
    {h:'Sacred Tradition', b:[
      'Oral tradition passed on first, written tradition co-existed alongside it.',
      'Doctrinal Tradition can never be changed/modified without harming Christian faith integrity.',
      'Dei Verbum 10: Sacred Tradition & Scripture form ONE sacred deposit of the Word of God.'
    ]},
    {h:'Sola Scriptura (Reformers)', b:['Belief that Scripture alone is authoritative — considered a wrong understanding in Catholic teaching, since tradition continued even after scripture was written.']},
    {h:'Magisterium', b:['The teaching authority of the Church, exercised by the Pope. The "unshakable tripod": Scripture, Tradition, Magisterium.']}
  ], quiz:[
    {q:'The Latin word "Fides" means:', c:['Fear','Trust, loyalty','Sacrifice','Command'], a:1},
    {q:'According to Dei Verbum 10, Sacred Tradition and Scripture form:', c:['Two separate deposits','One sacred deposit of the Word of God','Competing authorities','Optional teachings'], a:1},
    {q:'"Sola Scriptura" is the belief that:', c:['Only tradition matters','Only the Bible is the final authority','The Magisterium is supreme','Faith requires no scripture'], a:1},
    {q:'The Magisterium is best defined as:', c:['A book of the Bible','The teaching authority of the Church exercised by the Pope','A type of sacrament','A Church building'], a:1},
    {q:'The "unshakable tripod" of Catholic faith consists of Scripture, Tradition, and:', c:['Liturgy','Magisterium','Canon Law','Sacraments'], a:1},
    {q:'Which came first, oral tradition or written tradition, according to the notes?', c:['Written tradition','Oral tradition','They emerged at the same time','Neither existed'], a:1},
    {q:'Doctrinal Tradition, according to the Church, can be:', c:['Freely changed at any time','Never changed/modified without harming Christian faith integrity','Only followed by priests','Ignored if inconvenient'], a:1},
    {q:'Faith, as described in the notes, is best characterized as:', c:['Something earned through good works alone','A virtue infused by God, unmerited','A purely human invention','Optional for salvation'], a:1},
    {q:'The Reformers who promoted "Sola Scriptura" believed authority rests SOLELY in:', c:['The Pope','The Bible','Sacred Tradition','Church councils'], a:1},
    {q:'Why is "Sola Scriptura" considered a wrong understanding in Catholic teaching?', c:['Because tradition continued even after scripture was written','Because the Bible is false','Because tradition is more important than scripture','Because the Pope wrote the Bible'], a:0},
    {q:'Who exercises the Magisterium\'s teaching authority in the Catholic Church?', c:['The Pope','Individual believers','Protestant reformers','Local mayors'], a:0},
    {q:'The word "Fides" specifically comes from which language?', c:['Greek','Latin','Hebrew','Aramaic'], a:1},
    {q:'Dei Verbum 10 emphasizes that Scripture and Tradition are:', c:['Two separate, competing sources of truth','Combined into ONE sacred deposit of God\'s Word','Irrelevant to modern faith','Only for clergy to study'], a:1},
    {q:'Which of the following is NOT part of the "unshakable tripod" of Catholic faith?', c:['Scripture','Tradition','Magisterium','Sola Scriptura'], a:3},
    {q:'The virtue of Faith, as discussed, is described as being given from God\'s:', c:['Anger','Pure goodness','Judgment','Indifference'], a:1},
    {q:'Which best describes "unmerited" as applied to the gift of Faith?', c:['Earned through years of study','Not something a person can earn through their own effort','Only given to priests','Purchased through donations'], a:1},
    {q:'Sacred Tradition, as taught by the Church, is described as living and:', c:['Frozen','Lived (the ongoing life of the Church)','Irrelevant today','Only historical'], a:1},
    {q:'Which best explains why written tradition did not replace oral tradition?', c:['They existed side by side, with oral tradition continuing even after writing began','Oral tradition stopped completely once writing was invented','Written tradition came first historically','The Church banned oral tradition'], a:0},
    {q:'The teaching that Doctrinal Tradition "can never be changed" protects the:', c:['Church\'s finances','Integrity of the Christian faith','Political influence of bishops','Size of church buildings'], a:1},
    {q:'Dei Verbum is best described as a document of which Church council?', c:['Council of Trent','Second Vatican Council','Council of Nicaea','Council of Jerusalem'], a:1},
    {q:'The number "10" in "Dei Verbum 10" refers to:', c:['A chapter/section number in the document','A date','A Bible verse','A saint\'s feast day'], a:0},
    {q:'Which group of Reformers historically promoted the principle of "Sola Scriptura"?', c:['Catholic bishops','Protestant Reformers','Eastern Orthodox patriarchs','Jewish rabbis'], a:1},
    {q:'The Catholic Church\'s critique of Sola Scriptura centers on the claim that:', c:['The Bible has no authority at all','Tradition is unnecessary','Scripture alone cannot be separated from the living Tradition that transmitted and interpreted it','The Pope wrote every book of the Bible'], a:2},
    {q:'Who, according to the notes, exercises the Magisterium\'s authority?', c:['The Pope','A committee of theologians only','Each individual believer','The government'], a:0},
    {q:'The word "Magisterium" is most closely related to which root meaning?', c:['To teach/master','To build','To sing','To travel'], a:0},
    {q:'Which of these best completes: "Scripture, Tradition, and Magisterium form the ___ of Catholic faith"?', c:['Optional add-ons','Unshakable tripod','Least important elements','Historical footnotes'], a:1},
    {q:'The transmission of faith, as a broader theme, refers to how:', c:['Faith is passed down and preserved through generations','Faith disappears over time','Faith is invented anew each century','Faith is only private and never shared'], a:0},
    {q:'"Trust, loyalty" is the definition of which key Latin term discussed?', c:['Magisterium','Fides','Dogma','Credo'], a:1},
    {q:'Which best reflects the relationship between Sacred Tradition and Sacred Scripture per Dei Verbum 10?', c:['They compete for authority','They together form a single sacred deposit of God\'s Word','Tradition overrides Scripture entirely','Scripture overrides Tradition entirely'], a:1},
    {q:'A believer who holds that the Bible is the ONLY authoritative source of faith, rejecting Church Tradition, is following the principle of:', c:['Sola Fide','Sola Scriptura','Sola Gratia','Sola Ecclesia'], a:1},
    {q:'According to Catholic teaching, faith is a virtue that is:', c:['Infused by God','Manufactured by human reason alone','Irrelevant to salvation','Optional and unnecessary'], a:0},
    {q:'The term "Doctrinal Tradition" specifically refers to teachings that are:', c:['Casual suggestions','Central and unchangeable without harming the faith\'s integrity','Only for scholars','Regional customs only'], a:1},
    {q:'Which best explains why the Magisterium is considered part of the "unshakable tripod"?', c:['It has no real function','It authoritatively interprets and safeguards Scripture and Tradition','It replaces the need for Scripture','It is a recent 21st-century invention'], a:1},
    {q:'A theologian argues that the Bible itself emerged from a longer, living process of oral proclamation and Church life. This best supports which teaching?', c:['Sola Scriptura','That Tradition and Scripture are interconnected, not separable','That the Magisterium is unnecessary','That faith requires no historical basis'], a:1},
    {q:'The phrase "unmerited, given from the pure goodness of the giver" describes which concept?', c:['The nature of Faith as a gift from God','The nature of the Magisterium','The definition of Sola Scriptura','The role of the Pope'], a:0},
    {q:'Which best reflects why Catholic teaching holds Tradition as authoritative alongside Scripture?', c:['Because Tradition preserves the fullness of the apostolic faith, including practices/interpretations not exhaustively written down','Because Scripture is considered false','Because the Reformers agreed with this view','Because Tradition is newer than Scripture'], a:0},
    {q:'A Catholic student explains that faith cannot be purchased, demanded, or fully earned through effort alone. This reflects the teaching that faith is:', c:['A reward for wealth','A virtue infused by God, unmerited','A skill learned in school','A legal requirement'], a:1},
    {q:'The Church teaches that oral and written tradition existed:', c:['In total conflict with each other','Side-by-side, continuing together','Only oral tradition ever existed','Only written tradition ever existed'], a:1},
    {q:'Which best describes what would happen if Doctrinal Tradition were arbitrarily changed, according to Church teaching?', c:['Nothing significant','It would harm the integrity of the Christian faith','It would strengthen the faith','It would have no effect on doctrine'], a:1},
    {q:'The teaching authority "exercised by the Pope" refers to which of the three pillars discussed?', c:['Scripture','Tradition','Magisterium','None of these'], a:2},
    {q:'A person who insists that only the written Bible carries authority, with no role for the Church\'s living Tradition, is best described as holding to:', c:['Catholic teaching on the unshakable tripod','The Reformers\' principle of Sola Scriptura','The concept of the Magisterium','Doctrinal Tradition'], a:1},
    {q:'The Catholic response to Sola Scriptura emphasizes that the canon of Scripture itself was determined by:', c:['Individual readers','The Church\'s Tradition and authority over time','A vote among all Reformers','Random selection'], a:1},
    {q:'Which best summarizes the purpose of Dei Verbum 10?', c:['To separate the Bible from the Church','To unify Sacred Scripture and Sacred Tradition as one deposit of God\'s Word entrusted to the Church','To abolish the Magisterium','To promote Sola Scriptura'], a:1},
    {q:'Faith being described as a "virtue" places it in the same broad category as which other qualities in Catholic teaching?', c:['Hope and Charity (the theological virtues)','Physical strength','Wealth and status','Intelligence alone'], a:0},
    {q:'Which best explains "the teaching authority of the Church" as it relates to the Magisterium?', c:['It has the role of authentically interpreting the Word of God, whether written or handed on','It creates entirely new doctrines unrelated to Scripture','It has no connection to Scripture or Tradition','It only applies to canon law'], a:0},
    {q:'The notes describe the "unshakable tripod" using which metaphor for stability?', c:['A tripod (three-legged support)','A single pillar','A circle','A pyramid'], a:0},
    {q:'A key reason Sacred Tradition is trusted alongside Scripture is that it represents:', c:['A modern invention','The living, lived faith of the Church passed down through generations','A minority opinion','An optional custom'], a:1},
    {q:'Which best reflects the Catholic understanding of how faith is transmitted across generations?', c:['Only through personal, private reading of the Bible','Through Scripture, Tradition, and the Magisterium working together','Through the Reformers\' teachings exclusively','Through random cultural customs'], a:1},
    {q:'The Church teaches that Sacred Tradition is best understood as the:', c:['Personal opinions of individual priests','Living transmission of the apostolic faith across generations','Only ancient customs no longer practiced','Rules created only in the last century'], a:1},
    {q:'A student explains that faith cannot simply be "figured out" through logic alone but is received as a gift. This reflects the Church\'s teaching that faith is:', c:['A purely intellectual achievement','Infused by God, not self-generated','Irrelevant to reason','Only for the highly educated'], a:1},
    {q:'The phrase "trust, loyalty" as the root meaning of "Fides" highlights that faith involves:', c:['Blind, irrational belief with no relationship to God','A relational trust in God, not merely intellectual assent','Legal contracts with the Church','Financial commitment'], a:1},
    {q:'Which best distinguishes Sacred Scripture from Sacred Tradition, even though both form one deposit of faith?', c:['Scripture is the written Word of God; Tradition is the living transmission of that same faith, both handed on and interpreted through the Church','Scripture is newer than Tradition','Tradition replaces Scripture entirely','They are entirely unrelated bodies of teaching'], a:0},
    {q:'A Reformer in the 16th century argues the Church added unnecessary rules beyond what the Bible states. Which principle does this reflect?', c:['Magisterium','Sola Scriptura','Doctrinal Tradition','Dei Verbum'], a:1},
    {q:'Which of these BEST explains why Catholic teaching does not accept "Sola Scriptura" as sufficient?', c:['Because the Bible was compiled and its books recognized as canonical through the Church\'s living Tradition','Because Catholics reject the Bible entirely','Because Tradition is newer and more accurate than Scripture','Because Scripture has no spiritual value'], a:0},
    {q:'Which of the following would be an appropriate example of "Sacred Tradition" as taught by the Church?', c:['A modern trend on social media','The consistent teaching and practice of the Church handed down since the apostles','A personal preference in prayer style','A secular philosophy'], a:1},
    {q:'A theology teacher explains that even before the New Testament was written down, the early Church was already worshiping, teaching, and living out the faith. This best illustrates:', c:['That Scripture existed before the Church','That oral Tradition and lived faith preceded and shaped the writing of Scripture','That the Church had no faith before the Bible was written','That the Magisterium came before Christianity itself'], a:1},
    {q:'Which of the following is the best definition of "unmerited" as it relates to Faith being a gift from God?', c:['Something a person must pay for','Something not earned by human effort but freely given','A punishment for wrongdoing','A skill developed only through years of schooling'], a:1},
    {q:'The Magisterium\'s role of "teaching authority" is best compared to which function in a well-run institution?', c:['A referee that overrides all rules randomly','An authoritative body that interprets and safeguards core teaching consistently','A ceremonial role with no real function','A financial auditor only'], a:1},
    {q:'Which best reflects why the Church considers doctrinal teaching unchangeable, even as its expression can develop over time?', c:['Changing core doctrine would compromise the integrity and continuity of the faith received from the apostles','Doctrine has never been discussed by theologians','Doctrine is only for a small group of specialists','Doctrine changes yearly by popular vote'], a:0},
    {q:'A person new to Catholic teaching asks why both the Bible AND Church teaching matter. The best answer, based on Dei Verbum 10, is:', c:['Only the Bible matters; Church teaching is optional','Scripture and Tradition together form one sacred deposit of God\'s Word entrusted to the Church','Church teaching replaces the Bible entirely','Neither is considered authoritative today'], a:1},
    {q:'Which term describes the Church\'s teaching office as exercised specifically by the Pope and bishops in communion with him?', c:['Sola Scriptura','The Magisterium','Doctrinal Tradition (as distinct from Magisterium)','Dei Verbum'], a:1},
    {q:'A person says, "I believe what I read in the Bible, and nothing the Church says can add to that." This person is closest to holding:', c:['Catholic teaching on the tripod of faith','The Reformers\' Sola Scriptura position','The concept of Sacred Tradition','Church Magisterium'], a:1},
    {q:'Which best reflects the Catholic teaching on the origin of the New Testament canon (the list of accepted books)?', c:['It fell from the sky fully formed','It was recognized and affirmed by the Church through its living Tradition and authority over centuries','It was written entirely by one person','It has never been formally settled'], a:1},
    {q:'The word "transmission" in the lesson title "Transmission of Faith" most closely refers to:', c:['The passing down and handing on of the faith across generations','A mechanical car part','A one-time event with no ongoing process','A secret, hidden practice'], a:0},
    {q:'Which best completes: "Faith is a ___ infused by God"?', c:['Skill','Virtue','Contract','Punishment'], a:1},
    {q:'A key implication of Sacred Tradition being "living" is that it:', c:['Continues to be understood, taught, and lived by the Church today, not frozen in the past','Stopped completely after the apostles died','Has no connection to today\'s Church','Only existed for a short time'], a:0},
    {q:'Which best explains the relationship between the "unshakable tripod" and how a Catholic comes to know and hold their faith?', c:['Only one of the three (Scripture, Tradition, Magisterium) is needed at a time','All three work together to faithfully hand on and interpret the faith to the Church','They constantly contradict one another','None of the three has any real authority'], a:1},
    {q:'A student is asked to summarize the Reformers\' key theological principle discussed. The best one-word/phrase answer is:', c:['Magisterium','Sola Scriptura','Dei Verbum','Doctrinal Tradition'], a:1},
    {q:'Which statement correctly reflects Catholic teaching about how Scripture and Tradition relate to each other?', c:['They are two totally separate and competing sources of revelation','They flow from the same divine wellspring and form one sacred deposit of faith','Scripture came first and made Tradition unnecessary','Tradition is human-made and has no connection to God\'s revelation'], a:1},

  {id:'ff3', title:'3. Faith, Creed, and the Holy Trinity', content:[

      'Apostles\' Creed: oldest doctrinal formulation, ancient Roman baptismal symbol.',

    ]},
    {h:'The Trinitarian Dogma', b:['1 God in 3 Divine Persons — the central dogma of the Christian faith. Illustrated by St. Augustine\'s parable of the child digging a hole to hold the sea.']}

  {id:'ff4', title:'4. The Bible: Old and New Testament', content:[
    {h:'Origins', b:[
      'Bible from Greek "Biblion" (scroll/book). St. Jerome translated it into Latin (Vulgate), commissioned by Pope St. Damascus.',
      'Chapters divided by Archbishop Stephen Langton; verses divided by Robert Estienne.'
    ]},
    {h:'Canon of Scripture', b:[
      'Canon = "measuring stick" used to judge divinely inspired writings.',
      'Roman Catholic Bible: 73 books (46 OT + 27 NT). Non-Catholic Bible: 66 books (39 OT + 27 NT).',
      'Deuterocanonical books = "second canon," accepted by Catholics as equally inspired.'
    ]},
    {h:'Biblical Inspiration & Inerrancy', b:[
      'Inspiration: the Holy Spirit is the principal cause, the human author the instrumental cause.',
      'Inerrancy: freedom from error in what the Bible teaches for salvation, though it may contain surface differences (e.g., Gospel accounts of Judas\' death).'
    ]}

    {q:'Who commissioned St. Jerome to produce the Latin Vulgate?', c:['Pope St. Damascus','Constantine','Archbishop Langton','Robert Estienne'], a:0},
    {q:'How many books are in a typical Protestant/Non-Catholic Bible?', c:['46','66','73','80'], a:1},
    {q:'How many Old Testament books are in the Roman Catholic Bible?', c:['39','46','66','27'], a:1},
    {q:'The term "Canon" of Scripture literally means:', c:['A weapon','A measuring stick','A type of scroll','A church council'], a:1},
    {q:'In biblical inspiration, the human author serves as the:', c:['Principal cause','Instrumental cause','Final cause','Only cause'], a:1},
    {q:'Deuterocanonical books are also referred to as the:', c:['First canon','Second canon','Non-canonical texts','Apocalyptic literature'], a:1},
    {q:'Biblical inerrancy specifically guarantees freedom from error regarding:', c:['Every historical date mentioned','Matters necessary for salvation','Scientific facts','Geographic measurements'], a:1},
    {q:'Who divided the Bible into chapters?', c:['Robert Estienne','St. Jerome','Archbishop Stephen Langton','Pope St. Damascus'], a:2}
  ],
  glossary:[
    {term:'Roman Catholic Bible', def:'73 books (46 OT + 27 NT). Non-Catholic Bible: 66 books (39 OT + 27 NT).'},

  ]}

  {id:'lc6', title:'6. Establishing Healthy Relationships', content:[

  {id:'lc7', title:'7. Mental Health and Well-Being', content:[

  {id:'lc8', title:'8. Interpersonal Effectiveness (DBT: DEARMAN, GIVE, FAST)', content:[
    {h:'DBT (Marsha Linehan) — Three Effectiveness Types', b:[
      'Objective Effectiveness — getting needs met; Skill: DEARMAN.',
      'Relationship Effectiveness — maintaining harmony/trust; Skill: GIVE.',
      'Self-Respect Effectiveness — preserving dignity/boundaries; Skill: FAST.'
    ]},
    {h:'DEARMAN (Objective Effectiveness)', b:[
      'Describe situation, Express feelings, Assert clearly, Reinforce benefits, Mindful (don\'t derail), Appear confident, Negotiate.',
      'Main rules: separate people from the problem; focus on interests not positions; invent options for mutual gain; use objective criteria (Principled Negotiation, Fisher & Ury).'
    ]},
    {h:'GIVE (Relationship Effectiveness) & FAST (Self-Respect)', b:[
      'GIVE: Gentle (respectful tone), Interested (attentive), Validated (show feelings make sense), Easy manner (calm, not defensive).',
      'FAST: Fair (to others and self), (no) Apologies for existing, Stick to values, Truthful (no exaggeration/manipulation).',
      'FAST protects against toxic hiya and self-abandoning politeness.'
    ]},
    {h:'Conflict Styles (Thomas-Kilmann)', b:[
      'Avoiding (low importance/cooling time), Accommodating (relationship > issue), Competing (urgent/safety), Compromising (half-half), Collaborating (best for long-term fairness).'
    ]}

    {q:'Which conflict style is considered BEST for long-term fairness, especially in most school projects?', c:['Avoiding','Competing','Collaborating','Accommodating'], a:2},

    {q:'Which conflict style prioritizes the relationship over the issue at hand?', c:['Accommodating','Competing','Avoiding','Collaborating'], a:0},
    {q:'"Compromising" as a conflict style typically results in:', c:['One side getting everything','A half-half solution where both sides give something up','Complete avoidance of the issue','Total collaboration only'], a:1},
    {q:'Principled Negotiation (Fisher & Ury) recommends focusing on interests rather than:', c:['Objective criteria','Positions','Mutual gain','People'], a:1}

  {id:'lc9', title:'9. Unpacking Concepts: Empathy, Prosocial Behavior & Other-Centeredness', content:[
    {h:'Empathy', b:[
      'Ability to know, understand, and "feel" another person\'s feelings and lived experiences (Greek: empatheia; German: einfühlung, "to feel into").',
      'Empathy builds on self-awareness; reading nonverbal channels (tone, gesture, facial expression) is key (Goleman, 2017).'
    ]},
    {h:'Prosocial Behavior & Morality', b:[
      'Doing something good for other people/society; builds relationships. Includes conformity, obedience, cooperation, forgiveness, helping, kindness.',
      'Factors that encourage it: Rule of Law, Fairness and Justice, being in the actual/perceived presence of others (Hawthorne Effect).',
      'Motives for helping: Egoism (self-centered) vs Altruism (other-centered).'
    ]},
    {h:'Other-Centeredness (Philosophers)', b:[
      'Emmanuel Levinas — ethics begins at the "face of the Other"; responsibility for the Other precedes self-interest, is pre-rational.',
      'Martin Buber — I-Thou relationship (viewing others as subjects) vs I-It relationship (treating others as objects).',
      'St. Thomas Aquinas — the human person is a rational and social animal.'
    ]},
    {h:'Filipino Integration', b:[
      'Empathy: Pakikiramdam, Pag-unawa, Pakikisangkot, Pakikibagay.',
      'Prosocial: Bayanihan, Pakikiramay, Pakikipagdamayan, Positive Pakikisama.',
      'Other-Centeredness: Kapwa, Pagpapakatao, Respeto, Pagkalinga.',
      'John Rawls — "Justice as Fairness," the Veil of Ignorance, Liberty Principle and Difference Principle.'
    ]}

    {q:'John Rawls\' concept of imagining fairness without knowing your own position in society is called the:', c:['Difference Principle','Liberty Principle','Veil of Ignorance','Social Contract'], a:2},

  key: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>',
  dice: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle class="icon-solid" cx="8" cy="8" r="1.3"/><circle class="icon-solid" cx="12" cy="12" r="1.3"/><circle class="icon-solid" cx="16" cy="16" r="1.3"/></svg>',
  refresh: '<svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  cross: '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  bulb: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.5.4.9 1 1 1.8V17h6v-.5c.1-.8.5-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>',
  flip: '<svg class="icon" viewBox="0 0 24 24"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.2v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.8v2a4 4 0 0 1-4 4H3"/></svg>'
};

/* ============================= THEME ============================= */
let isDark = false;
function toggleTheme(){
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeToggle').innerHTML = (isDark ? ICONS.sun : ICONS.moon) + (isDark ? ' Light Mode' : ' Dark Mode');
}

/* ============================= APP LOGIC ============================= */
let state = { subjectId:null, lessonId:null, mode:'study', quiz:null };

function getSubject(id){ return DATA.find(s=>s.id===id); }
function getLesson(subId, lesId){ return getSubject(subId).lessons.find(l=>l.id===lesId); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  DATA.forEach(subj=>{
    const btn = document.createElement('button');
    btn.className = 'subject-btn' + (state.subjectId===subj.id ? ' active' : '');
    btn.textContent = subj.name;
    btn.onclick = ()=>{
      if(state.subjectId===subj.id){
        state.subjectId = null;
      } else {
        state.subjectId = subj.id;
      }
      renderSidebar();
    };
    sb.appendChild(btn);

    const ul = document.createElement('ul');
    ul.className = 'lesson-list' + (state.subjectId===subj.id ? ' open' : '');
    subj.lessons.forEach(les=>{
      const li = document.createElement('li');
      const lbtn = document.createElement('button');
      lbtn.className = 'lesson-btn' + (state.lessonId===les.id && state.subjectId===subj.id ? ' active' : '');
      lbtn.textContent = les.title;
      lbtn.onclick = ()=>{
        state.subjectId = subj.id;
        state.lessonId = les.id;
        state.mode = 'study';
        state.quiz = null;
        state.termsOrder = null;
        renderSidebar();
        renderMain();
      };
      li.appendChild(lbtn);
      ul.appendChild(li);
    });
    sb.appendChild(ul);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  if(!state.subjectId || !state.lessonId){
    main.innerHTML = `<div class="welcome"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Pick a subject, then a lesson, to start studying or take its quiz.</div>`;
    return;
  }
  const lesson = getLesson(state.subjectId, state.lessonId);
  main.innerHTML = '';

  const headerDiv = document.createElement('div');
  headerDiv.className = 'lesson-header';
  headerDiv.innerHTML = `<h2>${lesson.title}</h2>`;
  const toggle = document.createElement('div');
  toggle.className = 'mode-toggle';
  const studyBtn = document.createElement('button');
  studyBtn.innerHTML = ICONS.bookOpen + 'Study';
  studyBtn.className = state.mode==='study' ? 'active' : '';
  studyBtn.onclick = ()=>{ state.mode='study'; state.quiz=null; renderMain(); };
  const termsBtn = document.createElement('button');
  termsBtn.innerHTML = ICONS.bookmark + 'Terms';
  termsBtn.className = state.mode==='terms' ? 'active' : '';
  termsBtn.onclick = ()=>{ state.mode='terms'; state.quiz=null; renderMain(); };
  const quizBtn = document.createElement('button');
  quizBtn.innerHTML = ICONS.edit + 'Quiz';
  quizBtn.className = state.mode==='quiz' ? 'active' : '';
  quizBtn.onclick = ()=>{ state.mode='quiz'; state.quiz=null; renderMain(); };
  toggle.appendChild(studyBtn); toggle.appendChild(termsBtn); toggle.appendChild(quizBtn);
  headerDiv.appendChild(toggle);
  main.appendChild(headerDiv);

  if(state.mode==='study'){
    lesson.content.forEach(sec=>{
      const card = document.createElement('div');
      card.className = 'content-card';
      const h3 = document.createElement('h3'); h3.textContent = sec.h;
      const ul = document.createElement('ul');
      sec.b.forEach(pt=>{
        const li = document.createElement('li'); li.textContent = pt; ul.appendChild(li);
      });
      card.appendChild(h3); card.appendChild(ul);
      main.appendChild(card);
    });
  } else if(state.mode==='terms'){
    renderTerms(lesson, main);
  } else {
    renderQuiz(lesson, main);
  }
}

function renderTerms(lesson, main){
  const terms = lesson.glossary || [];
  if(terms.length===0){
    const empty = document.createElement('div');
    empty.className = 'welcome';
    empty.textContent = 'No standalone key terms extracted for this lesson yet — check the Study tab for full definitions in context.';
    main.appendChild(empty);
    return;
  }
  const headerRow = document.createElement('div');
  headerRow.className = 'terms-header-row';
  headerRow.innerHTML = `<h3>${ICONS.key}Key Terms (${terms.length}) — tap a card to flip it</h3>`;
  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'shuffle-terms-btn';
  shuffleBtn.innerHTML = ICONS.flip + 'Shuffle order';
  shuffleBtn.onclick = ()=>{ state.termsOrder = shuffle(terms.map((_,i)=>i)); renderMain(); };
  headerRow.appendChild(shuffleBtn);
  main.appendChild(headerRow);

  if(!state.termsOrder || state.termsOrder.length !== terms.length){
    state.termsOrder = terms.map((_,i)=>i);
  }

  const grid = document.createElement('div');
  grid.className = 'flashcard-grid';
  state.termsOrder.forEach(idx=>{
    const t = terms[idx];
    const card = document.createElement('div');
    card.className = 'flashcard-3d';
    card.innerHTML = `
      <div class="flashcard-inner">
        <div class="flashcard-face flashcard-front">
          <span class="flashcard-tag">TERM</span>
          <div class="flashcard-term">${t.term}</div>
          <span class="flashcard-hint">tap to reveal</span>
        </div>
        <div class="flashcard-face flashcard-back">
          <span class="flashcard-tag">DEFINITION</span>
          <div class="flashcard-def">${t.def}</div>
        </div>
      </div>`;
    card.onclick = ()=> card.classList.toggle('flipped');
    grid.appendChild(card);
  });
  main.appendChild(grid);
}

function renderQuiz(lesson, main){
  const QUIZ_LENGTH = 20; // number of questions served per attempt, drawn from the lesson's full pool
  if(!state.quiz){
    const panel = document.createElement('div');
    panel.className = 'start-quiz-panel';
    const poolSize = lesson.quiz.length;
    const served = Math.min(QUIZ_LENGTH, poolSize);
    panel.innerHTML = `<div>This lesson has a pool of ${poolSize} question${poolSize===1?'':'s'}. Each attempt serves ${served} of them, randomly picked and freshly shuffled every time you start — the rest sit in reserve so you rarely see the same set twice in a row.</div>`;
    const btn = document.createElement('button');
    btn.innerHTML = ICONS.dice + 'Start Quiz';
    btn.onclick = ()=>{
      // Pick a fresh subset, avoiding the exact same picks used last attempt when the pool is large enough to vary.
      let picked;
      let attempts = 0;
      do{
        picked = shuffle(lesson.quiz).slice(0, served);
        attempts++;
      } while(
        attempts < 6 &&
        poolSize > served &&
        lesson._lastPickSignature &&
        picked.map(q=>q.q).join('|') === lesson._lastPickSignature
      );
      lesson._lastPickSignature = picked.map(q=>q.q).join('|');

      state.quiz = {
        questions: picked.map(q=>{
          // shuffle choices, track correct index
          const idxs = shuffle(q.c.map((_,i)=>i));
          const choices = idxs.map(i=>q.c[i]);
          const answer = idxs.indexOf(q.a);
          return { q:q.q, choices, answer, explanation: q.e || null };
        }),
        current: 0,
        score: 0,
        selected: null,   // choice the user has tapped but not yet locked in
        locked: false,    // true once the user confirms "yes, lock this in"
        confirming: false // true while showing the "are you sure?" prompt
      };
      renderMain();
    };
    panel.appendChild(btn);
    main.appendChild(panel);
    return;
  }

  const quiz = state.quiz;
  if(quiz.current >= quiz.questions.length){
    const box = document.createElement('div');
    box.className = 'quiz-box score-screen';
    const pct = Math.round((quiz.score/quiz.questions.length)*100);
    box.innerHTML = `
      <div class="big">${quiz.score} / ${quiz.questions.length}</div>
      <p>You scored ${pct}%</p>
    `;
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.innerHTML = ICONS.refresh + 'Retry with shuffled questions';
    retry.onclick = ()=>{ state.quiz = null; renderMain(); };
    box.appendChild(retry);
    main.appendChild(box);
    return;
  }

  const q = quiz.questions[quiz.current];
  const box = document.createElement('div');
  box.className = 'quiz-box';

  const meta = document.createElement('div');
  meta.className = 'quiz-meta';
  meta.innerHTML = `<span>Question ${quiz.current+1} of ${quiz.questions.length}</span><span>Score: ${quiz.score}</span>`;
  box.appendChild(meta);

  const pbar = document.createElement('div');
  pbar.className = 'progress-bar';
  const pfill = document.createElement('div');
  pfill.className = 'progress-fill';
  pfill.style.width = ((quiz.current)/quiz.questions.length*100)+'%';
  pbar.appendChild(pfill);
  box.appendChild(pbar);

  const qt = document.createElement('div');
  qt.className = 'question-text';
  qt.textContent = q.q;
  box.appendChild(qt);

  q.choices.forEach((choice, i)=>{
    const cbtn = document.createElement('button');
    cbtn.className = 'choice';
    cbtn.textContent = choice;
    if(quiz.locked){
      cbtn.disabled = true;
      if(i===q.answer) cbtn.classList.add('correct');
      else if(i===quiz.selected) cbtn.classList.add('wrong');
    } else if(quiz.confirming){
      cbtn.disabled = true;
      if(i===quiz.selected) cbtn.classList.add('selected-pending');
    }
    cbtn.onclick = ()=>{
      if(quiz.locked || quiz.confirming) return;
      quiz.selected = i;
      quiz.confirming = true;
      renderMain();
    };
    box.appendChild(cbtn);
  });

  if(quiz.confirming && !quiz.locked){
    const confirmBox = document.createElement('div');
    confirmBox.className = 'confirm-box';
    confirmBox.innerHTML = `<p>Are you sure about that answer?</p>`;
    const yesBtn = document.createElement('button');
    yesBtn.className = 'confirm-yes';
    yesBtn.textContent = 'Yes, lock it in';
    yesBtn.onclick = ()=>{
      quiz.locked = true;
      quiz.confirming = false;
      if(quiz.selected===q.answer) quiz.score++;
      renderMain();
    };
    const noBtn = document.createElement('button');
    noBtn.className = 'confirm-no';
    noBtn.textContent = 'No, let me change it';
    noBtn.onclick = ()=>{
      quiz.selected = null;
      quiz.confirming = false;
      renderMain();
    };
    confirmBox.appendChild(yesBtn);
    confirmBox.appendChild(noBtn);
    box.appendChild(confirmBox);
  }

  if(quiz.locked){
    const wasCorrect = quiz.selected === q.answer;
    const expBox = document.createElement('div');
    expBox.className = 'explain-box ' + (wasCorrect ? 'explain-correct' : 'explain-wrong');
    const headerLine = wasCorrect
      ? (ICONS.check || '') + 'Correct!'
      : (ICONS.cross || '') + 'Not quite — here\'s why:';
    let bodyLine;
    if(q.explanation){
      bodyLine = q.explanation;
    } else if(wasCorrect){
      bodyLine = 'Nice work — that\'s the right answer.';
    } else {
      bodyLine = `The correct answer is "${q.choices[q.answer]}." Review this lesson's Study tab for the full context.`;
    }
    expBox.innerHTML = `<div class="explain-head">${headerLine}</div><div class="explain-body">${bodyLine}</div>`;
    box.appendChild(expBox);
  }

  const nav = document.createElement('div');
  nav.className = 'quiz-nav';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = (quiz.current === quiz.questions.length-1) ? 'See Results' : 'Next Question →';
  nextBtn.disabled = !quiz.locked;
  nextBtn.onclick = ()=>{
    quiz.current++;
    quiz.selected = null;
    quiz.locked = false;
    quiz.confirming = false;
    renderMain();
  };
  nav.appendChild(nextBtn);
  box.appendChild(nav);

  main.appendChild(box);
}

renderSidebar();
renderMain();
</script>

</html>
