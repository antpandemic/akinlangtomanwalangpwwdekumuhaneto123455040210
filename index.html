<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Subject Reviewer</title>
<style>
  :root{
    --bg:#f5f3ec; --card:#ffffff; --ink:#1f2430; --muted:#666f7f;
    --accent:#1b3a6b; --accent2:#1c8c7c; --warn:#c0392b; --good:#1c8c7c;
    --border:#e3ded0; --hover:#f0ede2; --choice-bg:#fafafa; --sidebar-bg:#ffffff;
    --active-lesson-bg:#e3ecf5;
  }
  body.dark{
    --bg:#14161c; --card:#1d2029; --ink:#e7e9ee; --muted:#9aa1b0;
    --accent:#5b8dd6; --accent2:#3fbfa4; --warn:#e0685c; --good:#3fbfa4;
    --border:#2c303c; --hover:#262a35; --choice-bg:#232631; --sidebar-bg:#1a1d25;
    --active-lesson-bg:#232c40;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .2s,color .2s;}
  header{
    background:linear-gradient(135deg,#1b3a6b,#12284d);color:#fff;
    padding:18px 20px;text-align:center;position:relative;
  }
  body.dark header{background:linear-gradient(135deg,#0e1526,#080b14);}
  header h1{margin:0;font-size:1.5rem;}
  header p{margin:4px 0 0;font-size:0.85rem;color:#cfd8ea;}
  .theme-toggle{
    position:absolute;top:16px;right:18px;background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:20px;
    padding:7px 14px;font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.22);}

  .layout{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 80px);}
  .sidebar{
    width:250px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);
    padding:14px 10px;
  }
  .subject-btn{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:0.88rem;font-weight:bold;
    color:var(--ink);margin-bottom:4px;
  }
  .subject-btn:hover{background:var(--hover);}
  .subject-btn.active{background:var(--accent);color:#fff;}
  .lesson-list{margin:0 0 10px 6px;padding-left:0;list-style:none;display:none;}
  .lesson-list.open{display:block;}
  .lesson-list li{margin:2px 0;}
  .lesson-btn{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:7px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;color:var(--muted);
  }
  .lesson-btn:hover{background:var(--hover);color:var(--ink);}
  .lesson-btn.active{background:var(--active-lesson-bg);color:var(--accent);font-weight:bold;}

  main{flex:1;padding:22px 26px;}
  .welcome{color:var(--muted);text-align:center;margin-top:60px;font-size:0.95rem;}

  .lesson-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .lesson-header h2{margin:0;color:var(--accent);font-size:1.3rem;}
  .mode-toggle{display:flex;gap:6px;}
  .mode-toggle button{
    padding:7px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--card);
    color:var(--accent);font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  .mode-toggle button.active{background:var(--accent);color:#fff;}

  .content-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:18px 22px;margin-bottom:16px;
  }
  .content-card h3{color:var(--accent2);font-size:1rem;margin:0 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .content-card ul{margin:0 0 4px 18px;padding:0;font-size:0.9rem;line-height:1.55;}
  .content-card li{margin-bottom:4px;}
  .terms-header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .terms-header-row h3{margin:0;color:var(--accent2);font-size:1rem;display:flex;align-items:center;}
  .shuffle-terms-btn{
    display:flex;align-items:center;padding:7px 14px;border-radius:20px;border:1px solid var(--accent2);
    background:#fff;color:var(--accent2);font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  body.dark .shuffle-terms-btn{background:#1a1e28;}
  .flashcard-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
  }
  .flashcard-3d{
    perspective:1000px;height:150px;cursor:pointer;
  }
  .flashcard-inner{
    position:relative;width:100%;height:100%;text-align:center;transition:transform .5s;
    transform-style:preserve-3d;
  }
  .flashcard-3d.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
    border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .flashcard-front{background:linear-gradient(150deg,var(--accent),var(--accent-dark,#12284d));color:#fff;}
  .flashcard-back{background:#fff8ec;border:2px solid #d98c2b;color:var(--ink);transform:rotateY(180deg);overflow-y:auto;}
  body.dark .flashcard-back{background:#241d10;color:#e8e8ea;}
  .flashcard-tag{font-size:0.62rem;letter-spacing:1.5px;opacity:0.75;font-weight:bold;margin-bottom:6px;}
  .flashcard-term{font-weight:bold;font-size:1rem;line-height:1.3;}
  .flashcard-hint{font-size:0.68rem;margin-top:8px;opacity:0.75;font-style:italic;}
  .flashcard-def{font-size:0.82rem;line-height:1.45;}

  /* Quiz styles */
  .quiz-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;}
  .quiz-meta{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);margin-bottom:10px;}
  .progress-bar{height:6px;background:var(--hover);border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--accent2);transition:width .3s;}
  .question-text{font-size:1.05rem;font-weight:bold;margin-bottom:16px;}
  .choice{
    display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;
    border:1px solid var(--border);border-radius:8px;background:var(--choice-bg);cursor:pointer;font-size:0.9rem;
    color:var(--ink);
  }
  .choice:hover{background:var(--hover);}
  .choice.correct{background:#dff5ef;border-color:var(--good);color:#0b5c4c;font-weight:bold;}
  .choice.wrong{background:#fbe4e1;border-color:var(--warn);color:#8a291d;font-weight:bold;}
  body.dark .choice.correct{background:#123a30;color:#7fe9cf;}
  body.dark .choice.wrong{background:#3a1a17;color:#f3a89e;}
  body.dark .choice.selected-pending{background:#1c2c47;border-color:#5b8fd6;color:#a9c6f0;}
  body.dark .confirm-box{background:#2b230f;border-color:#8a6323;}
  body.dark .confirm-no{background:#2a2d36;color:#e8e8ea;}
  .choice[disabled]{cursor:default;}
  .choice.selected-pending{background:#eaf0fa;border-color:var(--accent);color:var(--accent);font-weight:bold;}
  .confirm-box{
    background:#fff8ec;border:1px dashed #d98c2b;border-radius:8px;
    padding:12px 16px;margin-top:6px;text-align:center;
  }
  .confirm-box p{margin:0 0 10px;font-weight:bold;font-size:0.9rem;}
  .confirm-box button{
    padding:8px 16px;border-radius:20px;border:none;font-weight:bold;font-size:0.82rem;cursor:pointer;margin:0 5px;
  }
  .confirm-yes{background:var(--accent2);color:#fff;}
  .confirm-no{background:#eee;color:var(--ink);}
  .explain-box{
    border-radius:8px;padding:12px 16px;margin-top:10px;font-size:0.88rem;line-height:1.5;
    border-left:4px solid;animation:slideIn .25s ease-out;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .explain-correct{background:#eafaf4;border-color:var(--good);}
  .explain-wrong{background:#fdecea;border-color:var(--warn);}
  .explain-head{font-weight:bold;display:flex;align-items:center;margin-bottom:4px;}
  .explain-correct .explain-head{color:#0b5c4c;}
  .explain-wrong .explain-head{color:#8a291d;}
  .explain-body{color:var(--ink);}
  body.dark .explain-correct{background:#0f2b23;}
  body.dark .explain-wrong{background:#2b1512;}
  body.dark .explain-correct .explain-head{color:#7fe9cf;}
  body.dark .explain-wrong .explain-head{color:#f3a89e;}
  .quiz-nav{display:flex;justify-content:flex-end;margin-top:12px;}
  .quiz-nav button{
    padding:8px 18px;border-radius:20px;border:none;background:var(--accent);color:#fff;
    font-weight:bold;cursor:pointer;font-size:0.85rem;
  }
  .quiz-nav button:disabled{background:#ccc;cursor:not-allowed;}
  body.dark .quiz-nav button:disabled{background:#3a3d47;color:#8a8f9c;}

  .score-screen{text-align:center;padding:20px;}
  .score-screen .big{font-size:2.4rem;font-weight:bold;color:var(--accent);}
  .score-screen p{color:var(--muted);}
  .retry-btn{
    margin-top:14px;padding:10px 22px;border-radius:22px;border:none;background:var(--accent2);
    color:#fff;font-weight:bold;cursor:pointer;font-size:0.9rem;
  }

  .start-quiz-panel{text-align:center;padding:40px 20px;color:var(--muted);}
  .start-quiz-panel button{
    margin-top:14px;padding:12px 26px;border-radius:24px;border:none;background:var(--accent);
    color:#fff;font-weight:bold;cursor:pointer;font-size:0.95rem;
  }

  .icon{width:1em;height:1em;vertical-align:-0.15em;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-solid{fill:currentColor;stroke:none;}
  h1 .icon{width:1.15em;height:1.15em;}
  .welcome .icon{width:1.1em;height:1.1em;margin-right:8px;}

  @media(max-width:800px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
    .theme-toggle{position:static;display:inline-block;margin-top:10px;}
  }
</style>
</head>
<body>

<header>
  <h1><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Multi-Subject Reviewer</h1>
  <p>GenMath · PKLP1 · EffCom1 · GenSci · Biology Notes · FunFaith · LCS — with randomized per-lesson quizzes</p>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main">
    <div class="welcome"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Pick a subject, then a lesson, to start studying or take its quiz.</div>
  </main>
</div>

<script>
/* ============================= DATA ============================= */
const DATA = [

{id:'gm2', title:'2. Mean & Standard Deviation', content:[
    {h:'Mean (Expected Value)', b:[
      'μ = E(X) = Σ[X · P(X)] — represents the long-run average outcome.',
      'Example: 3 free throws, μ = (0)(.06)+(1)(.3)+(2)(.4)+(3)(.24) = 1.82.'
    ]},
    {h:'Standard Deviation', b:[
      'σ = √[Σ(X²·P(X)) − μ²] — measures spread of outcomes from the mean.',
      'Example above: σ = √(4.06 − 1.82²) = 0.86.'
    ]},
    {h:'Expected Value (Gains/Losses)', b:[
      'Used to evaluate whether a game or decision is favorable.',
      'Example: pay ₱1, win ₱3 on a 5. Expected value = 0.34 − 0.84 = −0.5 (expect to lose 50 centavos per game).'
    ]},
    {h:'Applications of Standard Deviation', b:['Finance (stock volatility)','Market Research (trend analysis)','Project Management (cost/timeline variability)','Customer Satisfaction (consistency)']}
  ], quiz:[
    {q:'Given X: 1, 2, 3 with P(X): 0.2, 0.5, 0.3 — find the mean μ.', c:['1.8','2.0','2.1','2.5'], a:2},
    {q:'Using the same distribution (X: 1,2,3, P(X): 0.2,0.5,0.3), Σ[X²·P(X)] = 4.9. Find the standard deviation σ. (μ = 2.1)', c:['0.49','0.7','0.9','1.4'], a:1},
    {q:'A raffle ticket costs ₱10. You win ₱50 with probability 0.05 (and win nothing otherwise). Find the expected net gain/loss per ticket.', c:['+₱2.50','−₱7.50','−₱10.00','+₱40.00'], a:1},
    {q:'Given P(X=0)=0.1, P(X=1)=0.4, P(X=2)=0.5, find the mean μ.', c:['1.0','1.2','1.4','1.5'], a:2},
    {q:'For the free-throw example, μ = 1.82 and Σ(X²·P(X)) = 4.06. Find σ² (the variance).', c:['0.55','0.75','0.86','1.82'], a:1},
    {q:'A game has an expected value of +₱2 per play. Over many plays, this indicates:', c:['The player will always lose','The player is expected to gain money on average','The game is unfair to the house','It cannot be determined'], a:1},
    {q:'Given X: 2, 4, 6 with P(X): 0.3, 0.4, 0.3 — find the mean μ.', c:['3.6','4.0','4.4','5.0'], a:1},
    {q:'μ = E(X) is also commonly called the:', c:['Variance','Expected value','Standard deviation','Sample space'], a:1},
    {q:'A raffle costs ₱20 and pays ₱200 with probability 0.05. Find the expected net gain/loss.', c:['−₱10','−₱9','+₱10','+₱180'], a:1},
    {q:'Which field uses standard deviation to measure the volatility of stock prices?', c:['Finance','Astronomy','Linguistics','Botany'], a:0},
    {q:'Which application of standard deviation relates to gauging consistency of customer experiences?', c:['Project Management','Customer Satisfaction','Finance','Market Research'], a:1},
    {q:'A distribution with a very LOW standard deviation means the outcomes are:', c:['Highly spread out from the mean','Clustered closely around the mean','Impossible to compute','Always equal to zero'], a:1},
    {q:'If σ = 0 for a random variable, this means:', c:['Every outcome has a different value','There is no data at all','Every outcome equals the mean (no variability)','The mean is also 0'], a:2},
    {q:'The formula Σ(X²·P(X)) − μ² gives which value directly (before taking the square root)?', c:['The mean','The variance (σ²)','The sample space','The probability'], a:1},
    {q:'A ticket costs ₱15; you win ₱100 with probability 0.1. What is the expected value of playing?', c:['−₱5','−₱4','+₱5','+₱10'], a:0},
    {q:'Standard deviation applied to project management is used to measure:', c:['Employee attendance','Variability in project timeline and costs','Customer satisfaction only','Stock market crashes'], a:1}
  ]},
  {id:'gm3', title:'3. Normal Distribution', content:[
    {h:'Key Properties', b:[
      'Normally distributed data forms a bell-shaped curve when graphed as a histogram.',
      'The curve is continuous, symmetric about the mean, and never touches the x-axis.',
      'Total area under the curve = 1 (100%).',
      'Mean = Median = Mode.'
    ]},
    {h:'Standard Normal Distribution (Z)', b:[
      'Z has mean 0 and standard deviation 1.',
      'Use z-table to find area (probability) under the curve.',
      'Calculator: use P for area to the left, R for area to the right, Q(x)+Q(y) for the middle.'
    ]},
    {h:'Inverse Normal Distribution', b:[
      'Also called the quantile/percentile point function — the reverse of the normal distribution.',
      'Example: the 75th percentile corresponds to Z ≈ 0.67.'
    ]}
  ], quiz:[
    {q:'A test has scores with μ = 75 and σ = 5. A student scores X = 82. Find the z-score.', c:['1.0','1.2','1.4','1.6'], a:2},
    {q:'A test has μ = 100 and σ = 10. If a student\'s z-score is −1.5, what is their raw score?', c:['80','85','90','95'], a:1},
    {q:'Using the empirical rule, find the approximate percentage of data within 1 standard deviation of the mean (between Z = −1 and Z = 1).', c:['50%','68%','95%','99.7%'], a:1},
    {q:'A class has μ = 80 and σ = 6. A student scored 92. Find their z-score.', c:['1','1.5','2','2.5'], a:2},
    {q:'If P(Z < 1.00) ≈ 0.8413, what is P(Z > 1.00)?', c:['0.1587','0.3413','0.5000','0.8413'], a:0},
    {q:'The Z-score for the 75th percentile is approximately 0.67. What does this mean?', c:['75% of scores fall below Z = 0.67','67% of scores fall below Z = 0.75','Z = 0.67 is the mean score','75% of scores fall above Z = 0.67'], a:0},
    {q:'A test has μ = 60 and σ = 8. Find the z-score of a student who scored 68.', c:['0.5','1.0','1.5','2.0'], a:1},
    {q:'In a normal distribution, approximately what % of data falls within 2 standard deviations of the mean?', c:['50%','68%','95%','99.7%'], a:2},
    {q:'What shape does a normal distribution always form when graphed?', c:['A skewed curve','A bell-shaped curve','A straight line','A U-shaped curve'], a:1},
    {q:'On the calculator, which mode gives the area to the RIGHT of a z-value?', c:['P','Q','R','L'], a:2},
    {q:'For the middle area between two z-values, which calculator notation is used?', c:['P(x)−P(y)','Q(x)+Q(y)','R(x)×R(y)','None of these'], a:1},
    {q:'A z-score of 0 corresponds to a raw score that is:', c:['The lowest possible score','Exactly equal to the mean','Two SDs above the mean','Undefined'], a:1},
    {q:'The total area under any normal curve always equals:', c:['0','0.5','1','Depends on σ'], a:2},
    {q:'If a score has a NEGATIVE z-score, this means the score is:', c:['Above the mean','Below the mean','Equal to the mean','Impossible to interpret'], a:1},
    {q:'The inverse normal distribution is used when you already know the __ and want to find the raw score or z-value.', c:['Standard deviation only','Percentile/probability','Sample size','Mode'], a:1}
  ],
  glossary:[
    {term:'Normal Distribution', def:'a symmetric, bell-shaped probability distribution where mean, median, and mode are all equal.'},
    {term:'Z-score', def:'a standardized value showing how many standard deviations a raw score is from the mean; z = (X − μ)/σ.'},
    {term:'Standard Normal Distribution', def:'a normal distribution with mean 0 and standard deviation 1.'},
    {term:'Empirical Rule (68-95-99.7)', def:'in a normal distribution, about 68% of data falls within 1 SD, 95% within 2 SD, and 99.7% within 3 SD of the mean.'},
    {term:'Percentile', def:'the percentage of data points that fall below a given value in a distribution.'},
    {term:'Calculator', def:'use P for area to the left, R for area to the right, Q(x)+Q(y) for the middle.'},
    {term:'Also called the quantile/percentile point function', def:'the reverse of the normal distribution.'}
  ]},
  {id:'gm4', title:'4. Sampling Methods', content:[
    {h:'Probability Sampling', b:[
      'Simple Random: equal chance for everyone (lottery, fishbowl draw).',
      'Systematic: selecting every nth member.',
      'Stratified: population split into strata (similar within, different between); every stratum represented.',
      'Cluster: grouping by location/geography (different within, similar between clusters).',
      'Multistage: clusters formed, then random selection within them (PSU & SSU).'
    ]},
    {h:'Non-Probability Sampling', b:[
      'Convenience: easily accessible participants.',
      'Purposive: intentionally chosen based on criteria.',
      'Quota: purposive sampling continued until a quota is reached.'
    ]}
  ], quiz:[
    {q:'A researcher wants a systematic sample of 50 people from a population of 1,000. What sampling interval k should they use (select every kth person)?', c:['10','20','25','50'], a:1},
    {q:'A school has 1,200 students and wants a systematic sample of 100. What sampling interval should they use?', c:['10','12','15','20'], a:1},
    {q:'A survey splits a population into groups by grade level (Grade 7-12) then randomly samples from each grade so every level is represented. Which method is this?', c:['Cluster','Stratified','Systematic','Convenience'], a:1},
    {q:'A researcher surveys entire barangays chosen at random rather than individuals scattered across the city. Which method is this?', c:['Stratified','Cluster','Quota','Simple random'], a:1},
    {q:'A researcher interviews shoppers at a single mall entrance simply because it\'s easy to access. Which method is this?', c:['Purposive sampling','Convenience sampling','Cluster sampling','Multistage sampling'], a:1},
    {q:'A pollster keeps interviewing people matching specific criteria (e.g., women aged 18-25) until reaching exactly 100 respondents. Which method is this?', c:['Simple random','Systematic','Quota sampling','Cluster sampling'], a:2},
    {q:'Which sampling method uses tools like a fishbowl draw or a random number table?', c:['Simple Random Sampling','Systematic Sampling','Quota Sampling','Purposive Sampling'], a:0},
    {q:'In stratified sampling, members within the same stratum should be:', c:['As different as possible','As similar as possible','Randomly unrelated','Ignored'], a:1},
    {q:'Multistage sampling typically involves which two unit types?', c:['PSU and SSU','Alpha and Beta units','Primary and Tertiary groups','Control and Test groups'], a:0},
    {q:'A researcher selects participants simply because they responded first to an online post. This is:', c:['Stratified sampling','Convenience sampling','Systematic sampling','Cluster sampling'], a:1},
    {q:'Choosing participants because they meet specific expert criteria (e.g., licensed doctors only) is:', c:['Purposive sampling','Convenience sampling','Simple random sampling','Systematic sampling'], a:0},
    {q:'Which of the following is a NON-probability sampling method?', c:['Stratified','Cluster','Convenience','Multistage'], a:2},
    {q:'A survey samples every 10th customer who enters a store. This is:', c:['Systematic sampling','Stratified sampling','Cluster sampling','Purposive sampling'], a:0},
    {q:'Between clusters in cluster sampling, the groups should ideally be:', c:['Very different from each other','Similar to each other (homogeneous)','Impossible to compare','Always unequal in size'], a:1},
    {q:'Which sampling method gives every member of the population an EQUAL chance of selection?', c:['Purposive Sampling','Simple Random Sampling','Quota Sampling','Convenience Sampling'], a:1}
  ],
  glossary:[
    {term:'Simple Random', def:'equal chance for everyone (lottery, fishbowl draw).'},
    {term:'Systematic', def:'selecting every nth member.'},
    {term:'Stratified', def:'population split into strata (similar within, different between); every stratum represented.'},
    {term:'Cluster', def:'grouping by location/geography (different within, similar between clusters).'},
    {term:'Multistage', def:'clusters formed, then random selection within them (PSU & SSU).'},
    {term:'Convenience', def:'easily accessible participants.'},
    {term:'Purposive', def:'intentionally chosen based on criteria.'},
    {term:'Quota', def:'purposive sampling continued until a quota is reached.'}
  ]},

  {id:'gm6', title:'6. Surface Area & Volume of Solid Figures', content:[
    {h:'Prisms', b:[
      'A prism is a 3D solid with two parallel, congruent polygonal bases; the other faces are parallelograms.',
      'Right Prism: Lateral Area = Perimeter of base × Lateral Edge; Surface Area = Lateral Area + 2(Area of one base); Volume = Area of one base × Altitude.',
      'Cube: LA = 4a², SA = 6a², V = a³. Rectangular Prism: LA = (2a+2b)×c, SA = c(2a+2b)+2ab, V = abc.',
      'Triangular Prism: LA = (S₁+S₂+S₃)×l; SA = LA + 2(Heron\'s area of base); V = l√[s(s−S₁)(s−S₂)(s−S₃)].',
      'Hexagonal Prism: LA = 6a×l; SA = 6al + 2(3√3a²/2); V = l(3√3a²/2).'
    ]},
    {h:'Faces, Edges, Vertices (Prisms)', b:[
      'Triangular: 5 faces, 9 edges, 6 vertices. Square: 6 faces, 12 edges, 8 vertices.',
      'Rectangular: 6 faces, 12 edges, 8 vertices. Pentagonal: 7 faces, 15 edges, 10 vertices.',
      'Hexagonal: 8 faces, 18 edges, 12 vertices. Octagonal: 10 faces, 24 edges, 16 vertices.'
    ]},
    {h:'Pyramid', b:[
      'Polyhedron with a polygonal base and triangular lateral faces meeting at an apex.',
      'Right pyramid: apex directly above the center. Oblique: apex not directly above center.',
      'Lateral Area = sum of areas of lateral faces; Surface Area = LA + Base Area; Volume = 1/3 × Base Area × Altitude.'
    ]},
    {h:'Cylinder, Cone & Sphere', b:[
      'Cylinder: LA = 2πrh; SA = 2πrh + 2πr²; V = πr²h. Right cylinder has axis perpendicular to bases.',
      'Cone: LA = πrs (s = slant height); SA = πr(r+s); V = 1/3πr²h.',
      'Sphere: Surface Area = 4πr²; Volume = 4/3πr³.'
    ]}
  ], quiz:[
    {q:'Find the volume of a cube with side length 4 cm.', c:['16 cm³','32 cm³','48 cm³','64 cm³'], a:3},

    {q:'Find the surface area of a sphere with radius 5. (Use π ≈ 3.14, SA = 4πr²)', c:['78.5','157','314','628'], a:2},
    {q:'Find the volume of a rectangular prism with a = 4, b = 3, c = 5 (V = abc).', c:['12','35','60','75'], a:2},
    {q:'Find the volume of a cone with radius 3 and height 7. (Use π ≈ 3.14, V = 1/3πr²h)', c:['21.98','43.96','65.94','98.91'], a:2},
    {q:'Find the volume of a pyramid with a square base of side 6 and altitude 9.', c:['54','108','162','216'], a:1},

    {q:'Which formula gives the volume of a right prism?', c:['V = Perimeter × Height','V = Area of one base × Altitude','V = 1/3 × Base Area × Altitude','V = 4/3πr³'], a:1},
    {q:'Find the lateral area of a cylinder with radius 4 and height 10. (LA = 2πrh, π≈3.14)', c:['125.6','188.4','251.2','314.0'], a:2},
    {q:'Find the surface area of a cube with side length 3 cm. (SA = 6a²)', c:['18 cm²','36 cm²','54 cm²','72 cm²'], a:2},
    {q:'What shape are the lateral faces of a pyramid?', c:['Rectangles','Triangles','Circles','Trapezoids'], a:1},
    {q:'A right cylinder has its axis:', c:['Parallel to its bases','Perpendicular to its bases','At a slant to its bases','Undefined'], a:1},
    {q:'Find the volume of a sphere with radius 3. (V = 4/3πr³, π≈3.14)', c:['37.68','75.36','113.04','150.72'], a:2},
    {q:'How many edges does a hexagonal prism have?', c:['12','15','18','24'], a:2}
  ],
  glossary:[
    {term:'Right Prism', def:'Lateral Area = Perimeter of base × Lateral Edge; Surface Area = Lateral Area + 2(Area of one base); Volume = Area of one base × Altitude.'},
    {term:'Cube', def:'LA = 4a², SA = 6a², V = a³. Rectangular Prism: LA = (2a+2b)×c, SA = c(2a+2b)+2ab, V = abc.'},
    {term:'Triangular Prism', def:'LA = (S₁+S₂+S₃)×l; SA = LA + 2(Heron\'s area of base); V = l√[s(s−S₁)(s−S₂)(s−S₃)].'},
    {term:'Hexagonal Prism', def:'LA = 6a×l; SA = 6al + 2(3√3a²/2); V = l(3√3a²/2).'},
    {term:'Triangular', def:'5 faces, 9 edges, 6 vertices. Square: 6 faces, 12 edges, 8 vertices.'},
    {term:'Rectangular', def:'6 faces, 12 edges, 8 vertices. Pentagonal: 7 faces, 15 edges, 10 vertices.'},
    {term:'Hexagonal', def:'8 faces, 18 edges, 12 vertices. Octagonal: 10 faces, 24 edges, 16 vertices.'},
    {term:'Right pyramid', def:'apex directly above the center. Oblique: apex not directly above center.'},
    {term:'Cylinder', def:'LA = 2πrh; SA = 2πrh + 2πr²; V = πr²h. Right cylinder has axis perpendicular to bases.'},
    {term:'Cone', def:'LA = πrs (s = slant height); SA = πr(r+s); V = 1/3πr²h.'},
    {term:'Sphere', def:'Surface Area = 4πr²; Volume = 4/3πr³.'}
  ]}
]},

{id:'pklp1', name:'PKLP1: Elitism, Dynasty & Diktadura', lessons:[
  {id:'pk1', title:'1. Local Elitism sa Pilipinas', content:[
    {h:'Depinisyon', b:[
      'Dominasyon ng makapangyarihang pamilya/indibidwal sa lokal na komunidad, batay sa lupa, kayamanan, edukasyon, at ugnayan sa gobyerno.',
      'Nag-ugat noong pre-kolonyal, lumakas noong kolonisasyon ng Espanya at Amerika.'
    ]},
    {h:'Kasaysayan', b:[
      'Pre-kolonyal: Datu/Rajah/Sultan namamana ang kapangyarihan, dynastic rule.',
      'Espanyol: Sistemang Reduccion, pinamunuan ng principalia (political clan).',
      'Amerikano: Halalan pabor lamang sa principalia (limitadong karapatang bumoto).',
      'Batas Militar: Umasa ang mga elite sa cronies ni Marcos; lumakas ang economic monopolies.'
    ]},
    {h:'Katangian', b:[
      'Patronage Politics (patron-client system, reciprocal obligation).',
      'Dominasyon ng Political Dynasties.',
      'Personalistic at Family-Driven Politics.',
      'Pagpigil sa Political Participation ng Masa.'
    ]}
  ], quiz:[
    {q:'Ano ang batayan ng kapangyarihan ng local elite?', c:['Lupa, kayamanan, edukasyon, ugnayan sa gobyerno','Kulay ng balat','Relihiyon lamang','Wala sa mga nabanggit'], a:0},
    {q:'Sino ang pinamunuan ang sistemang reduccion noong panahon ng Espanyol?', c:['Datu','Principalia','Cronies','Ilustrado'], a:1},
    {q:'Ano ang tawag sa relasyon kung saan ang elite ay nagbibigay ng pabor at ang mamamayan ay nagbabalik ng katapatan?', c:['Cronyism','Nepotism','Patronage politics','Meritocracy'], a:2},
    {q:'Sino ang tinatawag na "cronies" sa panahon ng Batas Militar?', c:['Mga kaalyado at loyal na pamilya kay Marcos','Mga rebelde','Mga dayuhang mamumuhunan','Mga simpleng magsasaka'], a:0},
    {q:'Ayon sa Konstitusyon, ipinagbabawal ang political dynasty ngunit kailangan itong:', c:['I-abolish ang Kongreso','I-define by law (enabling law)','Ipasa sa Simbahan','Isali sa referendum agad'], a:1},
    {q:'Saan nag-ugat ang local elitism sa Pilipinas?', c:['Panahon lamang ng mga Espanyol','Pre-kolonyal na panahon','Panahon ng EDSA','Panahon ni Duterte'], a:1},
    {q:'Sino ang namuno bago dumating ang mga Espanyol, na may namamanang kapangyarihan?', c:['Principalia','Datu/Rajah/Sultan','Ilustrado','Cronies'], a:1},
    {q:'Ano ang pangunahing katangian ng "Personalistic at Family-Driven Politics"?', c:['Batay sa plataporma o prinsipyo','Batay sa pamilya, kamag-anak, at personal na relasyon','Batay sa meritocracy','Batay sa botong popular lamang'], a:1},
    {q:'Sa panahon ng Amerikano, sino lamang ang may karapatang bumoto?', c:['Lahat ng mamamayan','Mga kababaihan lamang','Mga mayaman at marunong bumasa/sumulat (principalia)','Mga magsasaka lamang'], a:2},
    {q:'Ano ang tawag sa dominasyon ng iisang pamilya sa lokal na pamahalaan?', c:['Local elitism','Diktadura','Sampling bias','Ecofeminism'], a:0},
    {q:'Ang "reciprocal obligation" sa patronage politics ay tumutukoy sa:', c:['Pagbabalik-balik ng pabor sa pagitan ng elite at mamamayan','Batas laban sa dynasty','Sistema ng edukasyon','Uri ng sampling'], a:0},
    {q:'Anong mekanismo ang lumakas noong panahon ng Batas Militar dahil sa mga cronies?', c:['Economic monopolies','Universal suffrage','Agraryong reporma','Anti-corruption laws'], a:0},
    {q:'Ang "pagpigil sa political participation ng masa" ay isa sa mga:', c:['Uri ng diktadura','Katangian ng local elitism','Batas Militar decrees','SDG goals'], a:1},
    {q:'Sa panahon ng Espanyol, ang principalia ay binigyan ng kapangyarihan kapalit ng:', c:['Pagiging tapat sa pamahalaang kolonyal','Pagsuporta sa rebolusyon','Pagtatatag ng simbahan','Pagbabayad ng buwis lamang'], a:0, e:'Ang principalia (kabesa de baranggay) ay binigyan ng lokal na kapangyarihan bilang kapalit ng kanilang katapatan sa pamahalaang kolonyal ng Espanya.'},
    {q:'Ano ang pangkalahatang layunin ng sistemang Reduccion?', c:['Pagpapakalat ng mamamayan sa maraming maliliit na baryo','Pagtitipon ng mamamayan sa sentral na bayan para mas madaling makontrol at masingil ng buwis','Pagbibigay ng lupa sa lahat ng mamamayan','Pagpapalaya sa mga alipin'], a:1, e:'Ang Reduccion ay dinisenyo upang itipon ang mga katutubo sa sentral na pueblo, ginagawang mas madali ang pangongolekta ng buwis at pagpapalaganap ng Kristiyanismo.'},
    {q:'Ang salitang "elitism" ay pangunahing tumutukoy sa:', c:['Pantay na pamamahagi ng kapangyarihan','Dominasyon ng iilang makapangyarihang grupo o indibidwal','Sistema ng demokrasya','Kawalan ng anumang pamunuan'], a:1, e:'Elitism ay tumutukoy sa dominasyon o kontrol ng iilang makapangyarihang grupo/indibidwal sa lipunan, kabaligtaran ng pantay na representasyon.'},
    {q:'Alin sa sumusunod ang HINDI bahagi ng batayan ng kapangyarihan ng local elite?', c:['Lupa','Kayamanan','Edukasyon','Kulay ng buhok'], a:3, e:'Ayon sa notes, ang batayan ng kapangyarihan ng elite ay lupa, kayamanan, edukasyon, at ugnayan sa gobyerno — hindi kulay ng buhok.'},
    {q:'Sino ang pumipili ng bagong pinuno kapag walang direktang tagapagmana sa isang angkan ng Datu?', c:['Council of leaders','Simbahang Katoliko','Pamahalaang Amerikano','Kongreso'], a:0, e:'Sa pre-kolonyal na panahon, kung walang malinaw na tagapagmana, isang council of leaders (konseho ng matatanda/pinuno) ang pumipili ng bagong pinuno.'},
    {q:'Ang "reciprocal obligations" sa pagitan ng Datu at kanyang mga nasasakupan ay tumutukoy sa:', c:['Palitan ng tungkulin at proteksiyon','Pagbabawal sa kalakalan','Sapilitang paglilingkod na walang kapalit','Kawalan ng ugnayan'], a:0, e:'Pinapanatili ng Datu ang kapangyarihan sa pamamagitan ng "reciprocal obligations" — palitan ng tungkulin at proteksiyon sa pagitan niya at ng kanyang mga tauhan.'},
    {q:'Ang "dynastic rule" sa pre-kolonyal na panahon ay tumutukoy sa:', c:['Random na pagpili ng pinuno','Isang grupo ng tao na nakakaangat at namumuno, karaniwang minamana','Sistema ng halalan','Panunumpa ng katapatan sa Espanya'], a:1, e:'Dynastic rule ay ang pagpapatuloy ng pamumuno sa loob ng isang angkan o grupong nakakaangat, karaniwang minamana mula sa isang henerasyon patungo sa susunod.'},
    {q:'Bakit itinuturing na "toxic" ang ilang aspeto ng patronage politics ayon sa notes?', c:['Dahil ito ay ganap na positibo','Dahil nakasanayan na natin ito kahit may negatibong epekto sa lipunan','Dahil ipinagbabawal na ito','Dahil hindi ito umiiral sa Pilipinas'], a:1, e:'Tinawag itong "Toxic Filipino Culture" dahil kahit may negatibong epekto ito sa lipunan (gaya ng utang na loob at pagtangi sa malalaking pamilya), ito ay nakasanayan at itinuturing na normal.'},
    {q:'Ano ang naging epekto ng maluwag na paggasta sa halalan noong 1969 sa ekonomiya?', c:['Pagbaba ng presyo ng bilihin','Matinding inflation','Pagtaas ng sahod ng mga manggagawa','Walang epekto'], a:1, e:'Ang labis na paggastos ni Marcos sa kampanya noong halalan ng 1969 ay nagdulot ng matinding inflation, na sumira sa ekonomiya ng bansa.'},
    {q:'Alin sa mga sumusunod ang tamang pagkakasunod-sunod ng mga panahon sa kasaysayan ng local elitism?', c:['Amerikano → Pre-kolonyal → Espanyol → Batas Militar','Pre-kolonyal → Espanyol → Amerikano → Batas Militar','Batas Militar → Espanyol → Amerikano → Pre-kolonyal','Espanyol → Pre-kolonyal → Batas Militar → Amerikano'], a:1, e:'Ang tamang pagkakasunod-sunod, batay sa kasaysayan, ay Pre-kolonyal, sinundan ng Espanyol, tapos Amerikano, at Batas Militar.'},
    {q:'Ano ang tawag sa mga katutubong pinuno tulad ng Datu, Rajah, o Sultan?', c:['Cronies','Traditional/hereditary leaders','Ilustrado','Insulares'], a:1, e:'Sila ay traditional o hereditary leaders (namamana ang kapangyarihan), kaiba sa mga posisyong hinirang sa panahon ng kolonyal.'},
    {q:'Bakit itinuturing na malalim ang pagkakaugat ng local elitism sa kasaysayan ng Pilipinas?', c:['Dahil nagsimula lamang ito noong 1986','Dahil lumitaw ito noong pre-kolonyal at napaigting pa noong kolonisasyon','Dahil ito ay bagong konsepto lamang','Dahil hindi ito kailanman naganap'], a:1, e:'Ang local elitism ay may malalim na ugat mula pre-kolonyal na panahon at napaigting pa noong kolonisasyon ng Espanya at Amerika.'},
    {q:'Alin sa mga sumusunod ang HALIMBAWA ng "personalistic politics" batay sa notes?', c:['Pagboto batay sa plataporma ng kandidato','Pagboto batay sa pagkamag-anak o personal na relasyon sa kandidato','Pagboto batay sa detalyadong platform ng partido','Pagboto batay lamang sa kwalipikasyon'], a:1, e:'Personalistic politics ay batay sa pamilya, kamag-anak, compadre system, at personal na relasyon, hindi sa prinsipyo o plataporma.'},
    {q:'Alin sa mga sumusunod ang isang epekto ng "pagpigil sa political participation ng masa"?', c:['Lumalakas ang demokrasya','Ang eleksyon ay nananatiling elite-dominated', 'Nagiging pantay ang representasyon','Tumataas ang paglahok ng mamamayan'], a:1, e:'Kahit may eleksyon, ang proseso ay nananatiling elite-dominated — "Elections merely legitimize the transfer of power from one elite to another."'},
    {q:'Ano ang ibig sabihin ng "Elections merely legitimize the transfer of power from one elite to another"?', c:['Ang halalan ay palaging patas','Ang halalan ay isang paraan lamang para lumipat ang kapangyarihan sa pagitan ng mga elite, hindi tunay na pagbabago','Walang kaugnayan ang halalan sa elite','Ang halalan ay nagpapatalsik lagi sa mga elite'], a:1, e:'Ang kritisismong ito ay nagsasaad na kahit may halalan, ang resulta ay madalas isang paglipat lamang ng kapangyarihan mula sa isang elite tungo sa isa pang elite, hindi tunay na demokratikong pagbabago.'},
    {q:'Ano ang naging papel ng Simbahan sa panahon ng Espanyol na may kaugnayan sa local elitism?', c:['Walang kaugnayan','Bahagi ng sistema ng kontrol sa pamamagitan ng mga prayle at Reduccion','Laban sa lahat ng anyo ng elitismo','Nagtatag ng demokrasya'], a:1, e:'Ang Simbahan, sa pamamagitan ng mga prayle, ay bahagi ng sistema ng kontrol noong panahon ng Espanyol, kasabay ng Reduccion at principalia.'},
    {q:'Alin sa mga sumusunod ang tamang kahulugan ng "kabesa de baranggay"?', c:['Isang uri ng sampling method','Lokal na elitistang pamilyang binigyan ng kapangyarihan bilang principalia','Isang batas laban sa dynasty','Uri ng diktadura'], a:1, e:'Ang kabesa de baranggay ay tumutukoy sa mga miyembro ng principalia — lokal na elitistang pamilyang binigyan ng kapangyarihang mamuno kapalit ng katapatan sa kolonyal na pamahalaan.'},
    {q:'Alin sa mga sumusunod ang HINDI kabilang sa "katangian ng local elitism" na nabanggit sa notes?', c:['Patronage Politics','Dominasyon ng Political Dynasties','Universal Basic Income','Pagpigil sa political participation ng masa'], a:2, e:'Ang Universal Basic Income ay hindi kabilang sa mga katangiang nabanggit; ang mga tunay na katangian ay Patronage Politics, Dominasyon ng Dynasties, Personalistic Politics, at Pagpigil sa Participation.'},
    {q:'Bakit mahalaga ang "ugnayan sa gobyerno" bilang batayan ng kapangyarihan ng elite?', c:['Wala itong epekto sa kanilang kapangyarihan','Nagbibigay ito ng access sa access sa resources, proteksiyon, at impluwensiya sa patakaran','Nagpapahina lamang ito sa kanilang katayuan','Ito ay hindi kailanman ginamit ng mga elite'], a:1, e:'Ang ugnayan sa gobyerno ay nagbibigay sa mga elite ng access sa mga desisyon, resources, at proteksiyon, na nagpapalakas sa kanilang kapangyarihan sa lokal na antas.'},
    {q:'Alin sa sumusunod ang naglalarawan sa "1st Quarter Storm" (1970)?', c:['Isang kapayapaang kasunduan','Simbolo ng lumalakas na pagtutol ng mga estudyante sa pamahalaan','Isang batas laban sa political dynasty','Isang uri ng sampling method'], a:1, e:'Ang 1st Quarter Storm ay naging simbolo ng lumalakas na student activism at pagtutol sa pamahalaan noong 1970, resulta ng matinding inflation at kagalitan ng mamamayan.'},
    {q:'Ano ang naging dahilan ng vote buying noong 1969 ayon sa notes?', c:['Gustong masigurado ni Marcos na mananalo ulit siya sa halalan','Kawalan ng pondo ng pamahalaan','Pagbabawal sa halalan','Batas laban sa korapsyon'], a:0, e:'Nais ni Marcos na masigurado na siya ang mananalo muli sa kanyang ikalawang termino, kaya naging talamak ang vote buying noong halalan ng 1969.'},
    {q:'Sa konteksto ng notes, ano ang kaugnayan ng "edukasyon" sa kapangyarihan ng elite?', c:['Walang kaugnayan sa kapangyarihan','Isa sa mga batayan ng kapangyarihan, kadalasang eksklusibo sa mga mayayaman','Ito ay ipinagbabawal para sa mga elite','Ito ay pantay para sa lahat noong kolonyal na panahon'], a:1, e:'Ang edukasyon ay isa sa mga batayan ng kapangyarihan ng elite; sa maraming yugto ng kasaysayan, ang access sa edukasyon ay eksklusibo lamang sa mayayaman/principalia.'},
    {q:'Alin sa sumusunod ang pinakamahusay na naglalarawan sa mekanismo ng "patron-client system"?', c:['Ang client ay nagbibigay ng boto/katapatan, ang patron ay nagbibigay ng proteksiyon/pabor','Parehong panig ay hindi nagbibigay ng anuman','Ang batas lamang ang nagtatakda ng relasyon','Ito ay eksklusibo lamang sa modernong panahon'], a:0, e:'Sa patron-client system, ang lokal na elite (patron) ay nagbibigay ng pabor, proteksiyon, at yaman, habang ang mamamayan (client) ay nagbabalik ng loyalty, boto, at serbisyo.'},
    {q:'Ang "napansin ng mamamayan, magsasaka, may negosyo, at student activist" noong 1965-1969 ay tumutukoy sa:', c:['Kanilang pagtutol sa mataas na paggastos at problema sa kampanya ni Marcos','Kanilang suporta lamang kay Marcos','Kawalan ng interes sa pulitika','Kanilang paglilingkod sa Simbahan'], a:0, e:'Napansin ng iba\'t ibang sektor ang mga problemang kaakibat ng ikalawang termino ni Marcos, partikular ang labis na paggasta sa kampanya at kagalitan ng lipunan.'},
    {q:'Ayon sa notes, ano ang naging papel ng mga "ilustrado" sa kasaysayan ng Pilipinas?', c:['Sila ay walang anumang papel','Nakapag-aral sa ibang bansa at naging bahagi ng elitistang uri','Sila ay purong magsasaka','Sila ay laging kalaban ng Simbahan'], a:1, e:'Ang mga ilustrado ay mga Pilipinong nakapag-aral sa ibang bansa (kadalasang mayaman/mestizo), na naging bahagi ng lipunang elitista noong panahon ng Espanyol.'},
    {q:'Ang "indio" sa panahon ng Espanyol ay tumutukoy sa:', c:['Kastilang ipinanganak sa Espanya','Sinaunang katutubo ng Pilipinas','Anak ng Kastila at Pilipino','Prayleng Espanyol'], a:1, e:'Ang "Indio" ay ang termino para sa sinaunang katutubong Pilipino sa ilalim ng sistemang panlipunan ng Espanyol.'},
    {q:'Bakit itinuturing na malaki ang kapangyarihan ng principalia sa ilalim ng Espanyol?', c:['Dahil sila ang direktang pumili ng Punong Kastila','Dahil sila ang lokal na tagapamahala na kumukolekta ng buwis at nagpapatupad ng batas kolonyal','Dahil sila ang tanging may karapatang mag-aral','Dahil sila ay laging kalaban ng Espanyol'], a:1, e:'Ang principalia, bilang lokal na tagapamahala, ay may malaking kapangyarihan dahil sila ang nangongolekta ng buwis at nagpapatupad ng batas ng pamahalaang kolonyal sa antas ng baranggay/bayan.'},
    {q:'Alin sa sumusunod ang tamang paglalarawan ng "council of leaders" sa pre-kolonyal na sistema?', c:['Isang grupo na pumipili ng bagong pinuno kung walang direktang tagapagmana','Isang moderno demokratikong institusyon','Isang batas laban sa dynasty','Isang uri ng buwis'], a:0, e:'Kung walang malinaw na tagapagmana sa isang angkan ng Datu, isang council of leaders ang siyang pumipili ng susunod na pinuno.'},
    {q:'Ano ang kahalagahan ng pag-unawa sa local elitism sa pag-aaral ng kasalukuyang pulitika ng Pilipinas?', c:['Walang kaugnayan ang kasaysayan sa kasalukuyan','Tumutulong itong ipaliwanag kung bakit patuloy na umiiral ang political dynasties ngayon','Ito ay isyu lamang noong nakaraan','Tumutulong lamang ito sa pag-aaral ng agrikultura'], a:1, e:'Ang pag-unawa sa kasaysayan ng local elitism ay tumutulong ipaliwanag kung paano at bakit patuloy na umiiral ang political dynasties at patronage politics sa kasalukuyang pulitika.'},
    {q:'Ayon sa notes, saang panahon unang lumitaw ang local elitism?', c:['Panahon ng Amerikano','Pre-kolonyal na panahon','Panahon ng Batas Militar','Panahon ng EDSA'], a:1, e:'Malalim na nakaugat ang local elitism sa kasaysayan ng Pilipinas at lumitaw ito noong pre-kolonyal na panahon, bago pa man dumating ang mga mananakop.'},
    {q:'Alin sa sumusunod ang HINDI naging dahilan ng lumalakas na kilusang paggawa/magsasaka/estudyante noong huling bahagi ng 1960s?', c:['Matinding inflation dahil sa labis na paggasta sa kampanya','Kagalitan sa problema ng bansa','Suporta sa mabuting pamamahala ni Marcos','Kawalan ng kasiyahan sa sistemang pampulitika'], a:2, e:'Ang mga kilusan noong panahong ito ay lumakas dahil sa hindi kasiyahan sa problema ng bansa at inflation — hindi ito dahil sa suporta kay Marcos.'},
    {q:'Ang "1969 vote buying" ay isang halimbawa ng anong katangian ng local elitism?', c:['Patronage Politics/paggamit ng yaman para manalo sa halalan','Meritocracy','Ecofeminism','Sampling bias'], a:0, e:'Ang paggamit ng malaking halaga ng pera para bumili ng boto ay isang klasikong halimbawa ng patronage politics, kung saan ang yaman ay ginagamit para makuha at mapanatili ang kapangyarihan.'},
    {q:'Ang "kayamanan" bilang batayan ng kapangyarihan ay nagbibigay-daan sa elite na:', c:['Bumili ng suporta/impluwensiya at magpatakbo ng negosyo/lupain','Awtomatikong maging mabuting pinuno','Mawalan ng anumang kapangyarihan','Sumunod lamang sa batas'], a:0, e:'Ang kayamanan ay nagbibigay-daan sa elite na kontrolin ang ekonomiya, bumili ng impluwensiya/boto, at magpatakbo ng malalaking negosyo o lupain, na nagpapatibay ng kanilang kapangyarihan.'},
    {q:'Sa anong yugto ng kasaysayan unang lumitaw ang terminong "principalia"?', c:['Pre-kolonyal','Espanyol','Amerikano','Batas Militar'], a:1, e:'Ang "principalia" bilang uri ng lokal na pinuno ay lumitaw sa panahon ng Espanyol, sa ilalim ng sistemang Reduccion.'},
    {q:'Bakit itinuturing na "limitado" ang karapatang bumoto noong panahon ng Amerikano?', c:['Dahil bawal ang halalan noon','Dahil ang pagboto ay para lamang sa mayayaman at marunong bumasa/sumulat','Dahil lahat ay may karapatang bumoto','Dahil ipinagbawal ang halalan para sa lalaki'], a:1, e:'Noong panahon ng Amerikano, limitado lamang sa mga mayayaman at marunong bumasa/sumulat (kadalasang mula sa principalia) ang karapatang bumoto.'},
    {q:'Ano ang kahulugan ng "kagaluhan" sa konteksto ng unang termino ni Marcos?', c:['Kaguluhan/kawalang-kasiyahan ng mamamayan','Kasiyahan ng mamamayan','Kapayapaan sa bansa','Pagtataas ng sahod'], a:0, e:'Ang "kagaluhan" ay tumutukoy sa kaguluhan o kawalang-kasiyahan ng mamamayan noong unang termino ni Marcos dahil sa iba\'t ibang problema sa lipunan.'},
    {q:'Sa notes, sino ang binanggit bilang halimbawa ng mga taong napansin ang problema noong 1965-1969?', c:['Mamamayan, magsasaka, negosyante, at student activist','Mga banyagang mamumuhunan lamang','Mga sundalo lamang','Mga prayle lamang'], a:0, e:'Napansin ng mamamayan, magsasaka, may negosyo, at student activist ang mga problemang kaakibat ng termino ni Marcos.'},
    {q:'Ano ang pangunahing dahilan kung bakit nagkaroon ng "matinding inflation" noong 1969?', c:['Labis na paggasta sa kampanyang elektoral','Digmaan sa ibang bansa','Kawalan ng agrikultura','Pagbaba ng populasyon'], a:0, e:'Ang labis na paggastos noong eleksyon ng 1969, partikular sa vote buying, ay nagdulot ng matinding inflation.'},
    {q:'Alin sa mga sumusunod ang HALIMBAWA ng "economic monopolies" sa ilalim ng mga cronies?', c:['Pagbibigay ng pantay na oportunidad sa lahat ng negosyante','Pagkontrol ng iilang loyal na pamilya sa mga industriya/likas-yaman','Pag-alis ng lahat ng negosyo','Pagbibigay ng lupa sa magsasaka'], a:1, e:'Sa ilalim ng Batas Militar, lumakas ang economic monopolies kung saan kinontrol ng iilang cronies ang mga malalaking industriya at likas-yaman.'},
    {q:'Bakit itinuturing na "sagabal sa malayang partisipasyon ng masa" ang local elitism, ayon sa notes?', c:['Dahil pinapayagan nito ang lahat na lumahok sa pulitika','Dahil kinokontrol ng iilang pamilya ang mga posisyon at desisyon, hindi nabibigyan ng tunay na tinig ang karaniwang mamamayan','Dahil ipinagbabawal ang halalan','Dahil ito ay demokratiko'], a:1, e:'Ang local elitism ay naging sagabal dahil kinokontrol ng iilang pamilya ang mga posisyon at desisyon sa gobyerno, kaya limitado ang tunay na partisipasyon ng ordinaryong mamamayan.'},
    {q:'Ang pagtugon ng mamamayan sa elitism ay nag-udyok din ng:', c:['Kawalang pakialam','Iba\'t ibang kilusang panlipunan (people power, farmers movement, labor unions)','Pagsuko sa kapangyarihan ng elite','Pagbabawal sa lahat ng kilusan'], a:1, e:'Ang karanasan ng mamamayan sa paghaharap sa elitism ay nag-udyok ng iba\'t ibang kilusang panlipunan tulad ng people power, farmers movement, at labor unions.'},
    {q:'Ano ang tumutukoy sa terminong "Toxic Filipino Culture" sa konteksto ng patronage politics?', c:['Mga kaugaliang positibo lamang tulad ng bayanihan','Nakasanayang gawi na may negatibong epekto sa lipunan gaya ng labis na utang na loob','Isang batas laban sa korapsyon','Isang uri ng sampling'], a:1, e:'Ito ay tumutukoy sa mga kaugaliang nakasanayan na (gaya ng labis na utang na loob, pagtangi sa malalaking pamilya) na itinuturing na normal kahit may negatibong epekto sa lipunan.'},
    {q:'Bakit mahalagang pag-aralan ang buong kasaysayan ng local elitism mula pre-kolonyal hanggang ngayon?', c:['Para maunawaan kung paano nabuo at nagpatuloy ang mga estruktura ng kapangyarihan sa Pilipinas','Dahil ito ay hindi na umiiral ngayon','Dahil hindi ito nakakaapekto sa kasalukuyang pulitika','Dahil ito ay hiwalay sa paksa ng political dynasty'], a:0, e:'Ang pag-aaral ng buong kasaysayan ay mahalaga upang maunawaan kung paano nabuo, lumakas, at nagpatuloy ang mga estruktura ng kapangyarihan ng elite hanggang sa kasalukuyan.'},
    {q:'Alin sa sumusunod ang naglalarawan sa katangiang "pare-pareho" ng principalia sa iba\'t ibang panahon?', c:['Palaging nagbabago ang kanilang katayuan','Nananatiling nasa posisyon ng kapangyarihan sa iba\'t ibang yugto ng kasaysayan sa pamamagitan ng pagbagay','Wala silang kapangyarihan kahit kailan','Sila lamang ang walang kaugnayan sa gobyerno'], a:1, e:'Ang mga elitistang pamilya ay may kakayahang mag-adapt at manatili sa posisyon ng kapangyarihan sa iba\'t ibang yugto ng kasaysayan — mula Datu, hanggang principalia, hanggang modernong political dynasty.'},
    {q:'Ano ang naging papel ng "vote buying" sa pagpapanatili ng kapangyarihan ng mga elite?', c:['Nagpapahina ito sa kapangyarihan ng elite','Tumutulong itong masigurado ang kanilang panalo sa halalan','Ipinagbabawal ito noong 1969','Walang kaugnayan sa elitismo'], a:1, e:'Ang vote buying ay isang paraan ng patronage politics na tumutulong sa mga elite na masigurado ang kanilang panalo sa halalan sa pamamagitan ng pagbili ng boto.'},
    {q:'Alin sa sumusunod ang HINDI kabilang sa mga sanhi ng lumalakas na kilusang paggawa noong late 1960s?', c:['Matinding inflation','Kagalitan sa pamahalaan','Pagsang-ayon sa lahat ng patakaran ni Marcos','Kawalang-kasiyahan ng estudyante'], a:2, e:'Ang lumalakas na kilusan ay bunga ng inflation, kagalitan, at kawalang-kasiyahan — hindi ito bunga ng pagsang-ayon sa mga patakaran ni Marcos.'},
    {q:'Ang mga "cronies" sa panahon ng Batas Militar ay may access sa anong uri ng benepisyo?', c:['Wala silang anumang benepisyo','Espesyal na pabor sa negosyo, lupain, at kontrata ng gobyerno','Pantay na oportunidad lamang tulad ng iba','Pagbabawal sa kanilang negosyo'], a:1, e:'Ang mga cronies ni Marcos ay nakinabang sa espesyal na pabor tulad ng monopolyo sa negosyo, access sa lupain, at kontrata ng gobyerno.'},
    {q:'Bakit sinasabing "napakalim ang kompetensya sa politika" noong panahon ng Batas Militar?', c:['Dahil marami ang pumasok sa pulitika','Dahil kinontrol ng pangulo at ng kanyang mga kaalyado ang karamihan ng posisyon at desisyon','Dahil ipinagbabawal ang lahat ng partido maliban sa isa lamang na opisyal','Dahil ang lahat ay pantay ang oportunidad'], a:1, e:'Lumiit ang kompetensya sa politika dahil kinontrol ng pangulo at ng iilang kaalyadong pamilya ang karamihan ng mahahalagang posisyon at desisyon sa gobyerno.'},
    {q:'Ang salitang "rent-seeking behavior" na binanggit sa konteksto ng Batas Militar ay tumutukoy sa:', c:['Pagpapaupa ng bahay','Pagsisikap na kumita nang walang tunay na produktibong kontribusyon, sa pamamagitan ng koneksyon o pribilehiyo','Pagbabayad ng buwis nang maayos','Isang uri ng agrikultura'], a:1, e:'Rent-seeking behavior ay ang pagsisikap na makinabang nang malaki (kumita) sa pamamagitan ng koneksyon o pribilehiyo, hindi sa pamamagitan ng tunay na produktibong trabaho o inobasyon.'},
    {q:'Ang "lumalawak na kapangyarihan ng piling pamilya kaysa sa Estado" ay isa sa mga:', c:['Positibong epekto ng demokrasya','Negatibong epekto ng Batas Militar/diktadura','Layunin ng SDGs','Batayan ng sampling'], a:1, e:'Isa sa mga negatibong epekto ng Batas Militar ay ang paglawak ng kapangyarihan ng iilang piling pamilya (cronies) kaysa sa institusyon mismo ng Estado.'},
    {q:'Ano ang naging resulta ng pagsasama-sama ng lupa, kayamanan, at edukasyon bilang batayan ng kapangyarihan?', c:['Pagkakapantay-pantay sa lipunan','Konsentrasyon ng kapangyarihan sa iilang pamilya sa mahabang panahon','Kaagad na pagbagsak ng lahat ng elite','Kawalan ng anumang epekto'], a:1, e:'Ang pagsasama-sama ng lupa, kayamanan, at edukasyon bilang batayan ng kapangyarihan ay humantong sa konsentrasyon ng kapangyarihan sa iilang pamilya sa loob ng mahabang panahon.'},
    {q:'Bakit binabanggit ang "1st Quarter Storm" bilang mahalagang pangyayari sa kasaysayan ng local elitism?', c:['Dahil ito ay naging simbolo ng lumalakas na pagtutol laban sa problemang panlipunan na kaugnay ng elitismo/korapsyon','Dahil ito ay isang kapayapaang kasunduan','Dahil ito ay pormal na batas laban sa dynasty','Dahil wala itong kaugnayan sa paksa'], a:0, e:'Ang 1st Quarter Storm ay naging simbolo ng lumalakas na pagtutol ng mamamayan (lalo na ng mga estudyante) laban sa mga problemang kaugnay ng korapsyon at elitismo sa pamahalaan.'},
    {q:'Alin sa sumusunod ang tamang paglalarawan ng transisyon mula Datu patungo sa principalia?', c:['Parehong sistema, walang pagbabago','Ang tradisyonal, namamanang pamumuno ng Datu ay pinalitan ng pinuno na hinirang ng mga Espanyol ngunit mula pa rin sa lokal na elitistang uri','Ang principalia ay galing sa Espanya mismo','Walang koneksyon ang dalawa'], a:1, e:'Sa transisyon patungo sa kolonyal na sistema, ang tradisyonal na Datu ay pinalitan ng principalia — mga hinirang na lokal na pinuno, ngunit kadalasang mula pa rin sa umiiral nang elitistang uri.'},
    {q:'Ano ang naging kahalagahan ng "edukasyon" para sa mga ilustrado noong panahon ng Espanyol?', c:['Nagbigay ito sa kanila ng access sa modernong kaalaman at nagpalakas ng kanilang katayuan sa lipunan','Wala itong naidulot na benepisyo','Ito ay eksklusibo lamang sa mga Espanyol','Bawal itong pag-aralan ng mga Pilipino'], a:0, e:'Ang edukasyon (kadalasan sa ibang bansa) ay nagbigay sa mga ilustrado ng access sa modernong kaalaman, na nagpalakas sa kanilang katayuan at impluwensiya sa lipunan.'},
    {q:'Ayon sa notes, paano nakaimpluwensya ang "ugnayan sa gobyerno" sa katatagan ng kapangyarihan ng isang pamilya?', c:['Walang epekto ito','Ang malapit na ugnayan sa gobyerno ay nagpapalakas at nagpapanatili sa kanilang kapangyarihan sa mahabang panahon','Nagpapahina lamang ito sa kanilang kapangyarihan','Awtomatiko itong nawawala kapag may bagong pangulo'], a:1, e:'Ang malapit na ugnayan sa gobyerno ay isa sa mahahalagang salik na nagpapalakas at nagpapanatili sa kapangyarihan ng isang elitistang pamilya sa mahabang panahon.'},
    {q:'Bakit hindi kaagad naipapasa ang enabling law laban sa political dynasty ayon sa notes?', c:['Dahil walang interes ang publiko','Dahil ang Kongreso mismo ay pinamumunuan ng maraming miyembro ng political dynasty','Dahil ipinagbabawal ito ng Simbahan','Dahil hindi na kailangan ang batas na ito'], a:1, e:'Hirap maipasa ang enabling law dahil ang Kongreso mismo — ang siyang dapat magpasa nito — ay pinamumunuan ng maraming miyembro ng political dynasty na may interes na panatilihin ang status quo.'},
    {q:'Aling termino ang pinakaangkop sa paglalarawan ng "iisang malaking angkan na kumokontrol sa lokal na ekonomiya, politika, at trabaho"?', c:['Democratic governance','Local elitism/political dynasty','SDG framework','Sampling method'], a:1, e:'Ito ay klasikong paglalarawan ng local elitism/political dynasty, kung saan iisang malaking angkan ang kumokontrol sa maraming aspeto ng buhay sa isang lugar.'},
    {q:'Bakit binabanggit ang "student activism" bilang mahalagang bahagi ng tugon sa local elitism?', c:['Dahil ito ay walang epekto sa lipunan','Dahil ito ay naging isa sa mga pangunahing puwersa ng pagtutol laban sa mga problemang dulot ng elitismo/korapsyon','Dahil ipinagbabawal ito ng batas','Dahil ito ay nagpapalakas lamang sa mga elite'], a:1, e:'Ang student activism, tulad ng nakita sa 1st Quarter Storm, ay naging isa sa mga pangunahing puwersa ng pagtutol laban sa mga problemang dulot ng korapsyon at elitismo.'},
    {q:'Ano ang kaugnayan ng "kalakalan" (trade/commerce) sa kapangyarihan ng mga elite noong kolonyal na panahon?', c:['Walang kaugnayan sa kanilang kapangyarihan','Ang kontrol sa kalakalan ay nagbibigay-daan sa akumulasyon ng kayamanan, isa sa batayan ng kanilang kapangyarihan','Ipinagbabawal sa kanila ang anumang kalakalan','Ito ay eksklusibo lamang sa mga karaniwang mamamayan'], a:1, e:'Ang kontrol sa kalakalan ay nagbibigay-daan sa mga elite na mag-ipon ng kayamanan, na isa sa pangunahing batayan ng kanilang kapangyarihan sa lipunan.'},
    {q:'Sa pangkalahatan, paano nauugnay ang "personalistic politics" sa mahinang institusyong pampulitika?', c:['Pinapalakas nito ang mga institusyon','Kapag batay sa personal na relasyon ang katapatan (hindi sa prinsipyo), humihina ang tiwala sa mga institusyon mismo','Walang kaugnayan ang dalawa','Palaging pinapabuti nito ang institusyon'], a:1, e:'Kapag ang katapatan sa pulitika ay nakabatay sa personal na relasyon sa halip na sa prinsipyo o plataporma, humihina ang tiwala at bisa ng mga institusyong pampulitika.'},
    {q:'Ano ang naging papel ng "council of leaders" kumpara sa "namamanang Datu" sa pagpili ng bagong pinuno?', c:['Pareho lang sila, walang pagkakaiba','Ang namamanang Datu ay awtomatikong minamana; ang council of leaders ay pumipili kapag walang tuwirang tagapagmana','Ang council of leaders ang laging nagpapasya, hindi ang mana','Walang ganitong sistema noong pre-kolonyal'], a:1, e:'Sa normal na kalagayan, ang pamumuno ng Datu ay namamana; ngunit kung walang malinaw na tagapagmana, ang council of leaders ang siyang pumipili ng susunod na pinuno.'},
    {q:'Bakit itinuturing na kumplikado ang usapin ng political dynasty sa Pilipinas hanggang ngayon?', c:['Dahil walang anumang batas na kaugnay nito','Dahil bagamat ipinagbabawal ng Konstitusyon, walang enabling law pa rin na nagdedepine at nagpapatupad nito','Dahil hindi na ito isyu sa kasalukuyan','Dahil lahat ay sumasang-ayon dito'], a:1, e:'Kumplikado ang usapin dahil kahit ipinagbabawal ng 1987 Constitution ang political dynasty, kailangan pa rin ito ng "enabling law" na hanggang ngayon ay hindi naipapasa.'},
    {q:'Ano ang tinutukoy ng "walang pormal na depinisyon ng political dynasty sa batas" na problema?', c:['Nangangahulugan itong hindi na kailangan ng batas','Nagpapahirap itong panagutin o limitahan legal ang mga political dynasty dahil walang malinaw na batayan','Nangangahulugan itong ipinagbabawal na ito ng batas','Wala itong kinalaman sa Konstitusyon'], a:1, e:'Dahil walang malinaw na legal na depinisyon ng "political dynasty," nahihirapang panagutin o limitahan ng batas ang mga umiiral na dynasty kahit ipinagbabawal ito sa prinsipyo ng Konstitusyon.'},
    {q:'Bakit sinasabing "cyclical" ang relasyon sa pagitan ng elitismo at mahinang institusyon?', c:['Dahil hindi sila magkakaugnay','Dahil pinapalakas ng mahinang institusyon ang elitismo, at ang elitismo naman ay lalo pang nagpapahina sa institusyon','Dahil awtomatikong nawawala ang elitismo pagkatapos ng isang termino','Dahil ang mahinang institusyon ay palaging nagpapalakas sa demokrasya'], a:1, e:'Ang elitismo at mahinang institusyon ay nasa isang cycle: pinapalakas ng mahinang institusyon ang elitismo, at ang patuloy na elitismo naman ay lalo pang nagpapahina sa mga institusyon.'},
    {q:'Sa buod, ano ang pangunahing aral na dapat matutunan mula sa kasaysayan ng local elitism sa Pilipinas?', c:['Walang aral na dapat matutunan dito','Ang malalim na ugat ng elitismo ay nagpapaliwanag kung bakit patuloy itong hinahamon sa demokratikong pag-unlad ng bansa','Ang elitismo ay hindi kailanman naging isyu','Ang elitismo ay palaging naging positibo para sa bansa'], a:1, e:'Ang pag-unawa sa malalim na ugat ng local elitism ay nagpapaliwanag kung bakit patuloy itong nagiging hamon sa tunay na demokratikong partisipasyon at pag-unlad ng Pilipinas.'},
    {q:'Alin sa sumusunod ang HINDI naging batayan ng kapangyarihan ng mga Datu noong pre-kolonyal na panahon?', c:['Lupa','Kayamanan','Digital media platform','Kinship groups'], a:2, e:'Digital media platform ay hindi umiral pa noong pre-kolonyal na panahon; ang kapangyarihan noon ay nakabatay sa lupa, kayamanan, at ugnayan sa angkan (kinship groups).'},
    {q:'Sa pinakamadaling paraan, ano ang buod ng terminong "local elitism"?', c:['Pantay na oportunidad para sa lahat sa lokal na pamahalaan','Dominasyon ng iilang makapangyarihang pamilya sa lokal na antas ng pamahalaan/ekonomiya','Isang uri ng sistema ng pagsusuri','Batas na nagbabawal sa lahat ng elite'], a:1, e:'Sa pinakasimpleng paraan, ang local elitism ay ang dominasyon ng iilang makapangyarihang pamilya o indibidwal sa lokal na komunidad, ekonomiya, at pamahalaan.'}
  ],
  glossary:[
    {term:'Pre-kolonyal', def:'Datu/Rajah/Sultan namamana ang kapangyarihan, dynastic rule.'},
    {term:'Espanyol', def:'Sistemang Reduccion, pinamunuan ng principalia (political clan).'},
    {term:'Amerikano', def:'Halalan pabor lamang sa principalia (limitadong karapatang bumoto).'},
    {term:'Batas Militar', def:'Umasa ang mga elite sa cronies ni Marcos; lumakas ang economic monopolies.'},
    {term:'Reciprocal obligations', def:'palitan ng tungkulin at proteksiyon sa pagitan ng Datu at kanyang mga nasasakupan.'},
    {term:'Dynastic rule', def:'grupo ng tao na nakakaangat at namumuno, karaniwang minamana.'},
    {term:'Principalia', def:'lokal na elitistang pamilyang binigyan ng kapangyarihang mamuno (political clan) kapalit ng katapatan sa pamahalaang kolonyal.'}
  ]},
  {id:'pk2', title:'2. Political Dynasty', content:[
    {h:'Depinisyon', b:[
      'Pamilya kung saan 2 o higit pa ang humahawak ng halal na posisyon nang sabay-sabay o sunod-sunod.'
    ]},
    {h:'3 Uri', b:[
      'Thin Dynasty: isang posisyon, sequential succession (hal. Cory Aquino → Benigno Aquino Jr.)',
      'Fat Dynasty: dalawa o higit pang miyembro sabay-sabay sa iba\'t ibang antas (hal. Duterte sa Davao).',
      'Obese Dynasty: 4+ miyembro sabay-sabay, over-concentration of power (hal. Marcos, Duterte).'
    ]},
    {h:'5 Mekanismo na Nagpapatuloy sa Dynasty', b:[
      'Max out term limits',
      'Humanap ng mas mataas na posisyon o magpalitan ng pwesto',
      'Lumawak sa ibang lugar (obese)',
      'Intra-family rivalry',
      'Party-list system bilang backdoor'
    ]},
    {h:'Nepotism vs Cronyism', b:['Nepotism: batay sa kamag-anak/kinship.','Cronyism: batay sa pagkakaibigan.']}
  ], quiz:[
    {q:'Aling uri ng dynasty ang may 4 o higit pang miyembrong sabay-sabay may hawak na posisyon?', c:['Thin','Fat','Obese','Solo'], a:2},
    {q:'Ang Cory Aquino hanggang Benigno Aquino Jr. ay halimbawa ng:', c:['Fat dynasty','Obese dynasty','Thin dynasty','Walang dynasty'], a:2},
    {q:'Ang paggamit ng party-list system bilang "backdoor" ay isa sa:', c:['Mekanismong nagpapatuloy sa political dynasty','Uri ng diktadura','Batas sa paggawa','Uri ng sampling'], a:0},
    {q:'Ang pagbibigay-pabor batay sa kamag-anak ay tinatawag na:', c:['Cronyism','Nepotism','Patronage','Cronology'], a:1},
    {q:'Ilang eleksyon ang kailangan bago matawag na "political dynasty" ang isang pamilya?', c:['Isa lamang','Hindi bababa sa dalawa','Lima','Sampu'], a:1},
    {q:'Alin sa sumusunod ang isa sa 5 mekanismo na nagpapatuloy sa political dynasty?', c:['Max out term limits','Pagbubuo ng bagong partido lamang','Pagbabawal sa halalan','Pagpapatupad ng term limits nang mahigpit'], a:0},
    {q:'Ang "intra-family rivalry" bilang mekanismo ng dynasty ay tumutukoy sa:', c:['Away o kompetisyon sa loob mismo ng pamilya','Away sa pagitan ng magkaibang partido','Rebolusyon laban sa gobyerno','Batas laban sa nepotism'], a:0},
    {q:'Ang paglawak ng impluwensiya ng isang pamilya sa ibang lugar (hindi lang sa sariling distrito) ay katangian ng:', c:['Thin dynasty','Fat dynasty','Obese dynasty','Walang dynasty'], a:2},
    {q:'Alin ang HALIMBAWA ng Fat Dynasty ayon sa notes?', c:['Cory Aquino hanggang Benigno Aquino Jr.','Duterte sa Davao','Isang pamilyang walang miyembrong tumakbo','Isang senador na walang kamag-anak sa gobyerno'], a:1},
    {q:'Ang paggamit ng party-list system bilang paraan para makapasok pa rin sa gobyerno ay tinatawag na:', c:['Legitimate na eleksyon','"Backdoor" na mekanismo ng dynasty','Uri ng sampling','Diktadura'], a:1},
    {q:'Ang cronyism ay nakabatay sa:', c:['Kamag-anak/kinship','Pagkakaibigan','Relihiyon','Kayamanan lamang'], a:1},
    {q:'Ilang miyembro ng pamilya ang karaniwang hawak ang posisyon sa isang Obese Dynasty?', c:['1','2-3','4 o higit pa','Wala'], a:2},
    {q:'Ang "humanap ng mas mataas na posisyon o magpalitan ng pwesto" ay estratehiya para:', c:['Iwasan ang term limits at manatili sa kapangyarihan','Bumaba sa ranggo','Lumipat ng bansa','Tumigil sa pulitika'], a:0},
    {q:'Alin sa mga sumusunod ang HINDI kabilang sa 3 uri ng political dynasty?', c:['Thin','Fat','Obese','Solo'], a:3}
  ],

  ]},
  {id:'pk3', title:'3. Diktadura at Martial Law (Marcos)', content:[
    {h:'Diktadura: Depinisyon', b:[
      'Kapangyarihan ay nakapokus sa isang lider/grupo, hindi nakabatay sa malaya, patas, regular na eleksyon.',
      'Uri: Monarchic, Military, Civilian (Personalist / Dominant-party).'
    ]},
    {h:'Proclamation 1081 (Set. 21, 1972)', b:[
      '1972-1986: panahon ng diktadura sa Pilipinas.',
      'Katwiran: 1st Quarter Storm, Plaza Miranda bombing, ambush kay Enrile (kalaunang inamin na scripted), CPP-NPA threat, Jabidah Massacre/Mindanao tension.',
      'Epekto: pag-alis ng human rights protections, tortyur, pagsupil sa relihiyon at edukasyon.'
    ]},
    {h:'EDSA People Power 1 (1986)', b:[
      'Wakas ng 20 taong diktadura; non-violent revolution.',
      'Pangyayari bago EDSA: Asasinasyon ni Ninoy Aquino (1983), Snap Elections (1986), papel ng Cardinal Sin at CBCP.'
    ]},

    {q:'Kailan idineklara ang Proclamation 1081?', c:['Set. 21, 1972','Peb. 25, 1986','Mayo 23, 2017','Agosto 21, 1983'], a:0},
    {q:'Anong pangyayari ang naging agarang dahilan (bagamat scripted) ng deklarasyon ng Batas Militar?', c:['Ambush kay Enrile','Snap Elections','Jabidah Massacre','EDSA Revolution'], a:0},
    {q:'Sino ang pumatay kay Ninoy Aquino ayon sa opisyal na salaysay?', c:['Rolando Galman','Fidel Ramos','Juan Ponce Enrile','Nur Misuari'], a:0},
    {q:'Ano ang uri ng diktadura kung saan nakasentro ang kapangyarihan sa isang personalidad (hal. Marcos)?', c:['Military Dictatorship','Personalist Dictatorship','Monarchic Dictatorship','Dominant-party Dictatorship'], a:1},
    {q:'Ang 2017 Martial Law sa Mindanao ay idineklara laban saan?', c:['Maute Group / ISIS-inspired militants','NPA','MNLF','Cronies ni Marcos'], a:0},
    {q:'Ano ang naganap sa EDSA People Power 1?', c:['Digmaang sibil','Non-violent revolution laban sa diktadura','Pagpapalawak ng Batas Militar','Referendum para sa Cha-cha'], a:1},
    {q:'Kailan naganap ang EDSA People Power 1?', c:['1972','1981','1983','1986'], a:3},

  {id:'pk5', title:'5. Likas-Kayang Pag-unlad (Sustainable Development)', content:[
    {h:'Kahulugan', b:[
      'Balanse sa pagpaplanong panlipunan, pang-ekonomiya, at pangkapaligiran.',

      'The Limits to Growth (Club of Rome, 1972): babala laban sa overconsumption.',
      'Brundtland Report / Our Common Future (1987): unang nagbigay ng konsepto ng sustainable development.',
      'Earth Summit (1992): UNFCCC framework; Agenda 21.',
      'Kyoto Protocol: karaniwang 5% pagbawas ng emisyon.',
      'Paris Agreement (2015): unang pandaigdigang kasunduan, target: mababa sa 2°C.',
      'MDGs (2000-2015) → SDGs (2015-2030, 17 goals, 193 bansa).'
    ]}
  ], quiz:[
    {q:'Ilang pillars mayroon ang 5 Pillars of Sustainable Development?', c:['3','5','7','17'], a:1},

    {q:'Anong taon ginanap ang Earth Summit na nagresulta sa UNFCCC framework?', c:['1972','1987','1992','2015'], a:2},
    {q:'Ang Kyoto Protocol ay tumatarget ng karaniwang pagbawas ng emisyon na:', c:['5%','20%','50%','100%'], a:0},
    {q:'Ang Paris Agreement ay may target na panatilihing mababa sa:', c:['1°C','2°C','5°C','10°C'], a:1},
    {q:'Ang Sustainable Development Goals (SDGs) ay dapat matapos sa taong:', c:['2020','2025','2030','2050'], a:2},
    {q:'Ang Brundtland Report ay kilala rin sa pangalang:', c:['Agenda 21','Our Common Future','Limits to Growth','Kyoto Protocol'], a:1},
    {q:'Ilan ang bilang ng SDG goals?', c:['5','10','17','20'], a:2},

  {id:'pk6', title:'6. Katarungang Panlipunan at Kritikal na Lente', content:[
    {h:'Equality vs Equity', b:['Equality: pare-parehong bagay sa lahat.','Equity: batay sa pangangailangan ng bawat isa.']},
    {h:'3 Aspeto ng Katarungan', b:['Pamamahagi (distributive)','Katarungang prosedyural (procedural)','Katarungang interaksiyunal (interactional)']},
    {h:'Mga Kritikal na Lente', b:[
      'Marxismo: pantay-pantay na pagbabahagi ng likas-yaman; kritikal sa Global North/kapitalismo.',
      'Postkolonyal: hirarkiya ng "maunlad" vs "hindi pa maunlad" na bansa.',
      'Feminismo: kulturang patriyarkal; ecofeminism ay nag-uugnay ng dominasyon sa kalikasan at kababaihan.',
      'Katutubo (Indigenous lens): pagkawala ng lupang ninuno, IKSP, "ang lupa ay buhay".'
    ]}

    {q:'Aling lente ang kritikal sa "hirarkiya ng mga bansa" pagkatapos ng WW2?', c:['Postkolonyal','Marxismo','Feminismo','Katutubo'], a:0},
    {q:'Ang pagbibigay ng lupa sa mga magsasaka batay sa batas ay halimbawa ng katarungang:', c:['Interaksiyunal','Distributive/Pamamahagi','Prosedyural','Wala sa mga ito'], a:1}

  {id:'pk7', title:'7. Kalinangang Pilipino: Paniniwala at Pananampalataya', content:[
    {h:'Dimensyon ng Buhay', b:[
      'Paniniwala sa hiyas, anting-anting, at ginhawa/life force; anting-anting ay paniniwalang Kristiyano dahil nabuo noong panahon ng Kastila.',
      'ANIMISMO — paniniwala na ang lahat ng bagay ay may taglay na espiritwal o mahiwagang kapangyarihan.',
      'FOLK CATHOLICISM — paghalo ng katutubong paniniwala at paniniwala ng relihiyong Katoliko.',
      'BUL-OL/BULUL (Hilagang Luzon) — tirahan ng anito gaya ni Kabunian at Lumawig, kaugnay ng kaginhawahan at matagumpay na ani.'
    ]},
    {h:'Dimensyon ng Kabilang Buhay (Bangka)', b:[
      'Ang BANGKA ay may malalim na teknolohiya at ritwal na kaugnay ng kaluluwa at paglalakbay sa kabilang buhay.',
      'KIBANG (Tagalog) at GUIBANG (Bisaya) — pag-uga ng bangka para humingi ng magandang senyales sa pangangayaw/pangingisda.',
      'BACALAG (Visayas) — sakripisyo sa paglulunsad ng bangka para maging "matapang" ito laban sa kaaway.',
      'BANGKANG KABAONG — kabaong na iwinawangis sa bangka bilang simbolo ng paglalakbay sa kabilang buhay.',
      'MANUNUNGGUL JAR — tapayang libingan mula Tabon Cave, Palawan (Neolithic Period, 710 BK); may tatlong mukha sa takip — kaluluwa, tagasagwan, bangka.'
    ]},
    {h:'Katutubo at Tradisyonal na Pamamaraan ng Pagpapagaling', b:[
      'Babaylan/Catalonan — tagapamagitan ng tao sa diwata; kadalasan babae na may bantay na eunuch.',
      'Hilot — pag-aayos ng pilay/bali at pagpapaanak. Tawas — pagtatasa ng sakit gamit ang kristal.',
      'Tutho — herbal na lunas para sa sakit ng ulo. Pausok — panlinis laban sa masamang espiritu. Kamangyan — insenso mula sa dagta ng puno.',
      'RA 8423 (T.A.M.A. 1997) — nagpapatibay sa halamang gamot tulad ng lagundi, bayabas, sambong, ampalaya, akapulko, bawang, ulasimang bato, yerba buena.'
    ]}
  ], quiz:[
    {q:'Pahayag A: Ang animismo ay paniniwalang nagmula sa Kastila. Pahayag B: Ang mga sinaunang Pilipino ay naniniwala na may espiritwal na kapangyarihan ang lahat ng bagay. Alin ang tama?', c:['Parehong tama','A lamang ang tama','B lamang ang tama','Parehong mali'], a:2},
    {q:'Isang mananaliksik ang natagpuan ang isang sinaunang tapayang libingan sa isang kuweba sa Palawan na may ukit na kaluluwa, tagasagwan, at bangka sa takip. Ano ito?', c:['Butuan Wooden Coffin','Manunggul Jar','Banton Boat Coffin','Bul-ol'], a:1},
    {q:'Alin sa mga sumusunod ang HINDI kabilang sa katutubong pamamaraan ng panggagamot?', c:['Hilot','Tawas','Encomienda','Tutho'], a:2},
    {q:'Isang pasyenteng may sakit ang nilapitan ng isang babaylan na gumamit ng kristal upang malaman ang sanhi ng karamdaman. Anong pamamaraan ito?', c:['Pausok','Tawas','Kamangyan','Hilot'], a:1},
    {q:'Kung nais ng isang barangay na gumamit ng mga halamang-gamot na inaprubahan ng DOH ayon sa batas, aling batas ang kanilang susundin?', c:['RA 9003','RA 6969','RA 8423','RA 9711'], a:2},
    {q:'Pahayag A: Ang Kibang ay ritwal na Tagalog. Pahayag B: Ang Guibang ay ritwal na Bisaya. Alin ang tama?', c:['A lamang','B lamang','Parehong tama','Parehong mali'], a:2},
    {q:'Ang Folk Catholicism ay tumutukoy sa:', c:['Purong Katolisismo lamang','Paghalo ng katutubong paniniwala at Katolisismo','Islam sa Mindanao','Paganismo lamang'], a:1},
    {q:'Ang Bul-ol/Bulul ay may kaugnayan sa alin sa mga sumusunod?', c:['Kaginhawahan at matagumpay na ani','Digmaan','Kalakalan','Batas Militar'], a:0},
    {q:'Ang Bacalag ay sakripisyo na ginagawa upang:', c:['Maging matapang ang bangka laban sa kaaway','Magbigay ng buwis','Mapatawad ang kasalanan','Magpagaling ng sakit'], a:0},
    {q:'Saan matatagpuan ang Manunggul Jar?', c:['Bohol','Tabon Cave, Palawan','Cavite','Ilocos'], a:1},
    {q:'Ilan ang mukha na nakaukit sa takip ng Manunggul Jar?', c:['1','2','3','4'], a:2},
    {q:'Ang Babaylan/Catalonan ay tagapamagitan ng tao sa:', c:['Gobyerno','Diwata','Kalaban','Simbahang Katoliko'], a:1},
    {q:'Ang Tawas ay pamamaraan ng pagtatasa ng sakit gamit ang:', c:['Kristal','Insenso','Halaman','Bato'], a:0},
    {q:'Ang RA 8423 (T.A.M.A. 1997) ay nagpapatibay sa paggamit ng:', c:['Modernong gamot lamang','Halamang gamot tulad ng lagundi at bayabas','Ritwal na Bacalag','Sistema ng Reduccion'], a:1},
    {q:'Ang Pausok ay ginagamit bilang panlinis laban sa:', c:['Masamang espiritu','Sakit sa ngipin','Baha','Digmaan'], a:0}

  {id:'pk8', title:'8. Pakikibaka (Resistance sa Kasaysayan ng Pilipinas)', content:[
    {h:'Pakikibaka: Depinisyon', b:[
      'Pakikitunggali, paglaban, at kolektibong pagkilos na nakaugat sa kamalayan ng mga Pilipino; hindi makasarili kundi mula sa malalim na damdamin.',
      'Sumasalamin sa Resilience at kakayahang dumiskarte para maka-survive.'
    ]},
    {h:'Mga Yugto ng Pakikibaka', b:[
      'Battle of Mactan (1521) — Lapulapu vs Magellan; pansamantalang pag-urong ng mga Espanyol.',
      'Pag-aaklas ni Tamblot (1621-22, Bohol) at Rebelyong Dagohoy (1744-1829, Bohol, 85 taon).',
      'Hermano Puli (1841) — Cofradia de San Jose sa Timog Katagalugan.',
      'Diego at Gabriela Silang (1762-63) — Ilocos; si Gabriela ang unang babaeng namuno ng himagsikan.',
      'Cavite Mutiny (1872) — dahilan ng pagbitay kina Gomburza.',
      'La Solidaridad (1889-95) at mga Nobela ni Rizal (Noli/Fili) — Kilusang Propaganda.',
      'Himagsikang Pilipino/KKK (1896-98) — itinatag ni Bonifacio; Aguinaldo sa Cavite.',
      'Hukbalahap (1942-54) — mga magsasaka sa Gitnang Luzon; natapos sa pamumuno ni Magsaysay.',
      'MNLF (1969, ni Nur Misuari) — kilusang separatistang Muslim sa Mindanao.',
      'Lumad — pakikibaka para sa karapatan sa lupang ninuno laban sa pagmimina at militarisasyon.',
      'People Power Revolution (1986) — nagwakas sa diktadurya ni Marcos.'
    ]}
  ], quiz:[
    {q:'Isang pinuno ang pinangunahan ang matagumpay na pakikidigma laban sa hukbong Espanyol ni Magellan noong 1521. Sino siya?', c:['Rajah Humabon','Datu Lapulapu','Andres Bonifacio','Diego Silang'], a:1},
    {q:'Pahayag A: Si Diego Silang ang unang namuno ng himagsikan sa Ilocos. Pahayag B: Si Gabriela Silang ang unang babaeng namuno ng himagsikan sa Pilipinas. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Isang grupo ng kawal ang nag-alsa sa arsenal ng Cavite noong 1872, at ang kanilang pagkabitay ay isinisi kina Gomburza. Anong pangyayari ito?', c:['La Solidaridad','Cavite Mutiny','Battle of Mactan','Rebelyong Dagohoy'], a:1},

  {id:'pk9', title:'9. Isyu sa Panahon ng Kolonyalismong Espanyol', content:[
    {h:'Isyung Panlipunan', b:[
      'Paglaganap ng Katolisismo — sumira sa katutubong paniniwala; dahas kapag hindi naniniwala.',
      'Edukasyon para lamang sa mayaman — peninsulares, insulares, mestizo.',
      'Social Classes: Peninsulares (Kastilang ipinanganak sa Spain), Insulares (Kastilang ipinanganak sa Pinas), Mestizo/Creole, Indio (Pilipino).',
      'Frailocracy — malawak na kontrol ng mga prayle sa lupa, edukasyon, pamahalaan, simbahan.'
    ]},
    {h:'Isyung Ekonomiko', b:[
      'Encomienda System (1594) — piyudal na pagbibigay ng lupa/paggawa; nagbunga ng sapilitang paggawa.',
      'Polo y Servicio — 40 araw na sapilitang paggawa (edad 16-60); maaaring makaligtas sa pagbabayad ng falla.',
      'Tributo — buwis para sa kolonya. Kalakalang Galyon — 250-taong ruta sa pagitan ng Maynila at Acapulco.',
      'Government Monopolies (1782) — monopolyo ng tabako sa ilalim ni Gobernador Basco.'
    ]},
    {h:'Isyung Politikal', b:[
      'Reduccion/Pueblo System — pamimilit na manirahan sa iisang baryo para sa mas madaling pamamahala.',
      'Social Stratification — walang pantay na representasyon ang mga Pilipino sa pamahalaan.'
    ]}
  ], quiz:[
    {q:'Isang mag-aaral na Pilipino ang sinabihan na kayang makapag-aral dahil siya ay anak ng Kastila at Pilipino. Anong social class ito?', c:['Peninsulares','Insulares','Mestizo/Creole','Indio'], a:2},
    {q:'Pahayag A: Ang Encomienda System ay itinatag noong 1594. Pahayag B: Ito ay nagresulta sa sapilitang paggawa at mapaniil na paniningil ng buwis. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Isang lalaking Pilipino, edad 25, ang iniatas na magtrabaho nang walang bayad sa pagtatayo ng simbahan sa loob ng 40 araw. Anong sistema ito?', c:['Tributo','Polo y Servicio','Encomienda','Reduccion'], a:1},
    {q:'Alin sa mga sumusunod ang HINDI bahagi ng Kalakalang Galyon?', c:['Ruta sa pagitan ng Maynila at Acapulco','Monopolyo ng pamahalaan at simbahan','250-taong ruta','Direktang kalakalan sa Estados Unidos'], a:3},
    {q:'Pahayag A: Ang Frailocracy ay tumutukoy sa malawak na kontrol ng mga prayle sa lupa at edukasyon. Pahayag B: Ito ay ginamit ni Del Pilar upang batikusin ang mga pari. Alin ang tama?', c:['Parehong tama','A lamang','B lamang','Parehong mali'], a:0},
    {q:'Isang pamilya ang pinilit lumipat mula sa liblib na lugar patungo sa isang sentral na baryo para mas madali silang mapamahalaan. Anong sistema ito?', c:['Tributo','Reduccion/Pueblo System','Galyon','Falla'], a:1},
    {q:'Ang Polo y Servicio ay tumutukoy sa sapilitang paggawa sa loob ng:', c:['20 araw','40 araw','60 araw','100 araw'], a:1},
    {q:'Sino ang gobernador na nagtatag ng monopolyo ng tabako noong 1782?', c:['Gobernador Basco','Gobernador Bustamante','Gobernador Weyler','Gobernador Anda'], a:0},
    {q:'Ang Falla ay tumutukoy sa:', c:['Bayad upang makaligtas sa Polo y Servicio','Uri ng lupa','Ranggo sa gobyerno','Sistema ng edukasyon'], a:0},
    {q:'Ang Tributo ay isang uri ng:', c:['Buwis para sa kolonya','Sistema ng edukasyon','Uri ng bangka','Batas Militar'], a:0},
    {q:'Ilang taon tumakbo ang Kalakalang Galyon sa pagitan ng Maynila at Acapulco?', c:['50 taon','100 taon','250 taon','300 taon'], a:2},
    {q:'Sino ang mga anak ng Kastila na ipinanganak sa Espanya?', c:['Insulares','Peninsulares','Mestizo','Indio'], a:1},
    {q:'Ang Encomienda System ay nagbunga ng:', c:['Malayang paggawa','Sapilitang paggawa','Kalayaan sa relihiyon','Modernong edukasyon'], a:1},
    {q:'Sino ang tinatawag na "Indio" sa panahon ng Espanyol?', c:['Kastilang ipinanganak sa Espanya','Kastilang ipinanganak sa Pilipinas','Katutubong Pilipino','Anak ng Kastila at Pilipino'], a:2},
    {q:'Ang Social Stratification noong panahon ng Espanyol ay nagresulta sa:', c:['Pantay na representasyon ng mga Pilipino','Kawalan ng pantay na representasyon sa pamahalaan','Kalayaan ng bansa','Modernisasyon ng ekonomiya'], a:1}
