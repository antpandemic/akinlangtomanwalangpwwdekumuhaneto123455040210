<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Subject Reviewer</title>
<style>
  :root{
    --bg:#f5f3ec; --card:#ffffff; --ink:#1f2430; --muted:#666f7f;
    --accent:#1b3a6b; --accent2:#1c8c7c; --warn:#c0392b; --good:#1c8c7c;
    --border:#e3ded0; --hover:#f0ede2; --choice-bg:#fafafa; --sidebar-bg:#ffffff;
    --active-lesson-bg:#e3ecf5;
  }
  body.dark{
    --bg:#14161c; --card:#1d2029; --ink:#e7e9ee; --muted:#9aa1b0;
    --accent:#5b8dd6; --accent2:#3fbfa4; --warn:#e0685c; --good:#3fbfa4;
    --border:#2c303c; --hover:#262a35; --choice-bg:#232631; --sidebar-bg:#1a1d25;
    --active-lesson-bg:#232c40;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .2s,color .2s;}
  header{
    background:linear-gradient(135deg,#1b3a6b,#12284d);color:#fff;
    padding:18px 20px;text-align:center;position:relative;
  }
  body.dark header{background:linear-gradient(135deg,#0e1526,#080b14);}
  header h1{margin:0;font-size:1.5rem;}
  header p{margin:4px 0 0;font-size:0.85rem;color:#cfd8ea;}
  .theme-toggle{
    position:absolute;top:16px;right:18px;background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:20px;
    padding:7px 14px;font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.22);}

  .layout{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 80px);}
  .sidebar{
    width:250px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);
    padding:14px 10px;
  }
  .subject-btn{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:0.88rem;font-weight:bold;
    color:var(--ink);margin-bottom:4px;
  }
  .subject-btn:hover{background:var(--hover);}
  .subject-btn.active{background:var(--accent);color:#fff;}
  .lesson-list{margin:0 0 10px 6px;padding-left:0;list-style:none;display:none;}
  .lesson-list.open{display:block;}
  .lesson-list li{margin:2px 0;}
  .lesson-btn{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:7px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;color:var(--muted);
  }
  .lesson-btn:hover{background:var(--hover);color:var(--ink);}
  .lesson-btn.active{background:var(--active-lesson-bg);color:var(--accent);font-weight:bold;}

  main{flex:1;padding:22px 26px;}
  .welcome{color:var(--muted);text-align:center;margin-top:60px;font-size:0.95rem;}

  .lesson-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .lesson-header h2{margin:0;color:var(--accent);font-size:1.3rem;}
  .mode-toggle{display:flex;gap:6px;}
  .mode-toggle button{
    padding:7px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--card);
    color:var(--accent);font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  .mode-toggle button.active{background:var(--accent);color:#fff;}

  .content-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:18px 22px;margin-bottom:16px;
  }
  .content-card h3{color:var(--accent2);font-size:1rem;margin:0 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .content-card ul{margin:0 0 4px 18px;padding:0;font-size:0.9rem;line-height:1.55;}
  .content-card li{margin-bottom:4px;}
  .terms-header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .terms-header-row h3{margin:0;color:var(--accent2);font-size:1rem;display:flex;align-items:center;}
  .shuffle-terms-btn{
    display:flex;align-items:center;padding:7px 14px;border-radius:20px;border:1px solid var(--accent2);
    background:#fff;color:var(--accent2);font-size:0.8rem;font-weight:bold;cursor:pointer;
  }
  body.dark .shuffle-terms-btn{background:#1a1e28;}
  .flashcard-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
  }
  .flashcard-3d{
    perspective:1000px;height:150px;cursor:pointer;
  }
  .flashcard-inner{
    position:relative;width:100%;height:100%;text-align:center;transition:transform .5s;
    transform-style:preserve-3d;
  }
  .flashcard-3d.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
    border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .flashcard-front{background:linear-gradient(150deg,var(--accent),var(--accent-dark,#12284d));color:#fff;}
  .flashcard-back{background:#fff8ec;border:2px solid #d98c2b;color:var(--ink);transform:rotateY(180deg);overflow-y:auto;}
  body.dark .flashcard-back{background:#241d10;color:#e8e8ea;}
  .flashcard-tag{font-size:0.62rem;letter-spacing:1.5px;opacity:0.75;font-weight:bold;margin-bottom:6px;}
  .flashcard-term{font-weight:bold;font-size:1rem;line-height:1.3;}
  .flashcard-hint{font-size:0.68rem;margin-top:8px;opacity:0.75;font-style:italic;}
  .flashcard-def{font-size:0.82rem;line-height:1.45;}

  /* Quiz styles */
  .quiz-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;}
  .quiz-meta{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);margin-bottom:10px;}
  .progress-bar{height:6px;background:var(--hover);border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--accent2);transition:width .3s;}
  .question-text{font-size:1.05rem;font-weight:bold;margin-bottom:16px;}
  .choice{
    display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;
    border:1px solid var(--border);border-radius:8px;background:var(--choice-bg);cursor:pointer;font-size:0.9rem;
    color:var(--ink);
  }
  .choice:hover{background:var(--hover);}
  .choice.correct{background:#dff5ef;border-color:var(--good);color:#0b5c4c;font-weight:bold;}
  .choice.wrong{background:#fbe4e1;border-color:var(--warn);color:#8a291d;font-weight:bold;}
  body.dark .choice.correct{background:#123a30;color:#7fe9cf;}
  body.dark .choice.wrong{background:#3a1a17;color:#f3a89e;}
  body.dark .choice.selected-pending{background:#1c2c47;border-color:#5b8fd6;color:#a9c6f0;}
  body.dark .confirm-box{background:#2b230f;border-color:#8a6323;}
  body.dark .confirm-no{background:#2a2d36;color:#e8e8ea;}
  .choice[disabled]{cursor:default;}
  .choice.selected-pending{background:#eaf0fa;border-color:var(--accent);color:var(--accent);font-weight:bold;}
  .confirm-box{
    background:#fff8ec;border:1px dashed #d98c2b;border-radius:8px;
    padding:12px 16px;margin-top:6px;text-align:center;
  }
  .confirm-box p{margin:0 0 10px;font-weight:bold;font-size:0.9rem;}
  .confirm-box button{
    padding:8px 16px;border-radius:20px;border:none;font-weight:bold;font-size:0.82rem;cursor:pointer;margin:0 5px;
  }
  .confirm-yes{background:var(--accent2);color:#fff;}
  .confirm-no{background:#eee;color:var(--ink);}
  .explain-box{
    border-radius:8px;padding:12px 16px;margin-top:10px;font-size:0.88rem;line-height:1.5;
    border-left:4px solid;animation:slideIn .25s ease-out;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .explain-correct{background:#eafaf4;border-color:var(--good);}
  .explain-wrong{background:#fdecea;border-color:var(--warn);}
  .explain-head{font-weight:bold;display:flex;align-items:center;margin-bottom:4px;}
  .explain-correct .explain-head{color:#0b5c4c;}
  .explain-wrong .explain-head{color:#8a291d;}
  .explain-body{color:var(--ink);}
  body.dark .explain-correct{background:#0f2b23;}
  body.dark .explain-wrong{background:#2b1512;}
  body.dark .explain-correct .explain-head{color:#7fe9cf;}
  body.dark .explain-wrong .explain-head{color:#f3a89e;}
  .quiz-nav{display:flex;justify-content:flex-end;margin-top:12px;}
  .quiz-nav button{
    padding:8px 18px;border-radius:20px;border:none;background:var(--accent);color:#fff;
    font-weight:bold;cursor:pointer;font-size:0.85rem;
  }
  .quiz-nav button:disabled{background:#ccc;cursor:not-allowed;}
  body.dark .quiz-nav button:disabled{background:#3a3d47;color:#8a8f9c;}

  .score-screen{text-align:center;padding:20px;}
  .score-screen .big{font-size:2.4rem;font-weight:bold;color:var(--accent);}
  .score-screen p{color:var(--muted);}
  .retry-btn{
    margin-top:14px;padding:10px 22px;border-radius:22px;border:none;background:var(--accent2);
    color:#fff;font-weight:bold;cursor:pointer;font-size:0.9rem;
  }

  .start-quiz-panel{text-align:center;padding:40px 20px;color:var(--muted);}
  .start-quiz-panel button{
    margin-top:14px;padding:12px 26px;border-radius:24px;border:none;background:var(--accent);
    color:#fff;font-weight:bold;cursor:pointer;font-size:0.95rem;
  }

  .icon{width:1em;height:1em;vertical-align:-0.15em;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-solid{fill:currentColor;stroke:none;}
  h1 .icon{width:1.15em;height:1.15em;}
  .welcome .icon{width:1.1em;height:1.1em;margin-right:8px;}

  @media(max-width:800px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
    .theme-toggle{position:static;display:inline-block;margin-top:10px;}
  }
</style>
</head>
<body>

<header>
  <h1><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Multi-Subject Reviewer</h1>
  <p>GenMath · PKLP1 · EffCom1 · GenSci · Biology Notes · FunFaith · LCS — with randomized per-lesson quizzes</p>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main">
    <div class="welcome"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Pick a subject, then a lesson, to start studying or take its quiz.</div>
  </main>
</div>

<script>
/* ============================= DATA ============================= */
const DATA = [

{id:'gm2', title:'2. Mean & Standard Deviation', content:[
    {h:'Mean (Expected Value)', b:[
      'μ = E(X) = Σ[X · P(X)] — represents the long-run average outcome.',
      'Example: 3 free throws, μ = (0)(.06)+(1)(.3)+(2)(.4)+(3)(.24) = 1.82.'
    ]},
    {h:'Standard Deviation', b:[
      'σ = √[Σ(X²·P(X)) − μ²] — measures spread of outcomes from the mean.',
      'Example above: σ = √(4.06 − 1.82²) = 0.86.'
    ]},
    {h:'Expected Value (Gains/Losses)', b:[
      'Used to evaluate whether a game or decision is favorable.',
      'Example: pay ₱1, win ₱3 on a 5. Expected value = 0.34 − 0.84 = −0.5 (expect to lose 50 centavos per game).'
    ]},
    {h:'Applications of Standard Deviation', b:['Finance (stock volatility)','Market Research (trend analysis)','Project Management (cost/timeline variability)','Customer Satisfaction (consistency)']}
  ], quiz:[
    {q:'Given X: 1, 2, 3 with P(X): 0.2, 0.5, 0.3 — find the mean μ.', c:['1.8','2.0','2.1','2.5'], a:2},
    {q:'Using the same distribution (X: 1,2,3, P(X): 0.2,0.5,0.3), Σ[X²·P(X)] = 4.9. Find the standard deviation σ. (μ = 2.1)', c:['0.49','0.7','0.9','1.4'], a:1},
    {q:'A raffle ticket costs ₱10. You win ₱50 with probability 0.05 (and win nothing otherwise). Find the expected net gain/loss per ticket.', c:['+₱2.50','−₱7.50','−₱10.00','+₱40.00'], a:1},
    {q:'Given P(X=0)=0.1, P(X=1)=0.4, P(X=2)=0.5, find the mean μ.', c:['1.0','1.2','1.4','1.5'], a:2},
    {q:'For the free-throw example, μ = 1.82 and Σ(X²·P(X)) = 4.06. Find σ² (the variance).', c:['0.55','0.75','0.86','1.82'], a:1},
    {q:'A game has an expected value of +₱2 per play. Over many plays, this indicates:', c:['The player will always lose','The player is expected to gain money on average','The game is unfair to the house','It cannot be determined'], a:1},
    {q:'Given X: 2, 4, 6 with P(X): 0.3, 0.4, 0.3 — find the mean μ.', c:['3.6','4.0','4.4','5.0'], a:1},
    {q:'μ = E(X) is also commonly called the:', c:['Variance','Expected value','Standard deviation','Sample space'], a:1},
    {q:'A raffle costs ₱20 and pays ₱200 with probability 0.05. Find the expected net gain/loss.', c:['−₱10','−₱9','+₱10','+₱180'], a:1},
    {q:'Which field uses standard deviation to measure the volatility of stock prices?', c:['Finance','Astronomy','Linguistics','Botany'], a:0},
    {q:'Which application of standard deviation relates to gauging consistency of customer experiences?', c:['Project Management','Customer Satisfaction','Finance','Market Research'], a:1},
    {q:'A distribution with a very LOW standard deviation means the outcomes are:', c:['Highly spread out from the mean','Clustered closely around the mean','Impossible to compute','Always equal to zero'], a:1},
    {q:'If σ = 0 for a random variable, this means:', c:['Every outcome has a different value','There is no data at all','Every outcome equals the mean (no variability)','The mean is also 0'], a:2},
    {q:'The formula Σ(X²·P(X)) − μ² gives which value directly (before taking the square root)?', c:['The mean','The variance (σ²)','The sample space','The probability'], a:1},
    {q:'A ticket costs ₱15; you win ₱100 with probability 0.1. What is the expected value of playing?', c:['−₱5','−₱4','+₱5','+₱10'], a:0},
    {q:'Standard deviation applied to project management is used to measure:', c:['Employee attendance','Variability in project timeline and costs','Customer satisfaction only','Stock market crashes'], a:1}
  ]},
  {id:'gm3', title:'3. Normal Distribution', content:[
    {h:'Key Properties', b:[
      'Normally distributed data forms a bell-shaped curve when graphed as a histogram.',
      'The curve is continuous, symmetric about the mean, and never touches the x-axis.',
      'Total area under the curve = 1 (100%).',
      'Mean = Median = Mode.'
    ]},
    {h:'Standard Normal Distribution (Z)', b:[
      'Z has mean 0 and standard deviation 1.',
      'Use z-table to find area (probability) under the curve.',
      'Calculator: use P for area to the left, R for area to the right, Q(x)+Q(y) for the middle.'
    ]},
    {h:'Inverse Normal Distribution', b:[
      'Also called the quantile/percentile point function — the reverse of the normal distribution.',
      'Example: the 75th percentile corresponds to Z ≈ 0.67.'
    ]}
  ], quiz:[
    {q:'A test has scores with μ = 75 and σ = 5. A student scores X = 82. Find the z-score.', c:['1.0','1.2','1.4','1.6'], a:2},
    {q:'A test has μ = 100 and σ = 10. If a student\'s z-score is −1.5, what is their raw score?', c:['80','85','90','95'], a:1},
    {q:'Using the empirical rule, find the approximate percentage of data within 1 standard deviation of the mean (between Z = −1 and Z = 1).', c:['50%','68%','95%','99.7%'], a:1},
    {q:'A class has μ = 80 and σ = 6. A student scored 92. Find their z-score.', c:['1','1.5','2','2.5'], a:2},
    {q:'If P(Z < 1.00) ≈ 0.8413, what is P(Z > 1.00)?', c:['0.1587','0.3413','0.5000','0.8413'], a:0},
    {q:'The Z-score for the 75th percentile is approximately 0.67. What does this mean?', c:['75% of scores fall below Z = 0.67','67% of scores fall below Z = 0.75','Z = 0.67 is the mean score','75% of scores fall above Z = 0.67'], a:0},
    {q:'A test has μ = 60 and σ = 8. Find the z-score of a student who scored 68.', c:['0.5','1.0','1.5','2.0'], a:1},
    {q:'In a normal distribution, approximately what % of data falls within 2 standard deviations of the mean?', c:['50%','68%','95%','99.7%'], a:2},
    {q:'What shape does a normal distribution always form when graphed?', c:['A skewed curve','A bell-shaped curve','A straight line','A U-shaped curve'], a:1},
    {q:'On the calculator, which mode gives the area to the RIGHT of a z-value?', c:['P','Q','R','L'], a:2},
    {q:'For the middle area between two z-values, which calculator notation is used?', c:['P(x)−P(y)','Q(x)+Q(y)','R(x)×R(y)','None of these'], a:1},
    {q:'A z-score of 0 corresponds to a raw score that is:', c:['The lowest possible score','Exactly equal to the mean','Two SDs above the mean','Undefined'], a:1},
    {q:'The total area under any normal curve always equals:', c:['0','0.5','1','Depends on σ'], a:2},
    {q:'If a score has a NEGATIVE z-score, this means the score is:', c:['Above the mean','Below the mean','Equal to the mean','Impossible to interpret'], a:1},
    {q:'The inverse normal distribution is used when you already know the __ and want to find the raw score or z-value.', c:['Standard deviation only','Percentile/probability','Sample size','Mode'], a:1}
  ],
  glossary:[
    {term:'Normal Distribution', def:'a symmetric, bell-shaped probability distribution where mean, median, and mode are all equal.'},
    {term:'Z-score', def:'a standardized value showing how many standard deviations a raw score is from the mean; z = (X − μ)/σ.'},
    {term:'Standard Normal Distribution', def:'a normal distribution with mean 0 and standard deviation 1.'},
    {term:'Empirical Rule (68-95-99.7)', def:'in a normal distribution, about 68% of data falls within 1 SD, 95% within 2 SD, and 99.7% within 3 SD of the mean.'},
    {term:'Percentile', def:'the percentage of data points that fall below a given value in a distribution.'},
    {term:'Calculator', def:'use P for area to the left, R for area to the right, Q(x)+Q(y) for the middle.'},
    {term:'Also called the quantile/percentile point function', def:'the reverse of the normal distribution.'}
  ]},
  {id:'gm4', title:'4. Sampling Methods', content:[
    {h:'Probability Sampling', b:[
      'Simple Random: equal chance for everyone (lottery, fishbowl draw).',
      'Systematic: selecting every nth member.',
      'Stratified: population split into strata (similar within, different between); every stratum represented.',
      'Cluster: grouping by location/geography (different within, similar between clusters).',
      'Multistage: clusters formed, then random selection within them (PSU & SSU).'
    ]},
    {h:'Non-Probability Sampling', b:[
      'Convenience: easily accessible participants.',
      'Purposive: intentionally chosen based on criteria.',
      'Quota: purposive sampling continued until a quota is reached.'
    ]}
  ], quiz:[
    {q:'A researcher wants a systematic sample of 50 people from a population of 1,000. What sampling interval k should they use (select every kth person)?', c:['10','20','25','50'], a:1},
    {q:'A school has 1,200 students and wants a systematic sample of 100. What sampling interval should they use?', c:['10','12','15','20'], a:1},
    {q:'A survey splits a population into groups by grade level (Grade 7-12) then randomly samples from each grade so every level is represented. Which method is this?', c:['Cluster','Stratified','Systematic','Convenience'], a:1},
    {q:'A researcher surveys entire barangays chosen at random rather than individuals scattered across the city. Which method is this?', c:['Stratified','Cluster','Quota','Simple random'], a:1},
    {q:'A researcher interviews shoppers at a single mall entrance simply because it\'s easy to access. Which method is this?', c:['Purposive sampling','Convenience sampling','Cluster sampling','Multistage sampling'], a:1},
    {q:'A pollster keeps interviewing people matching specific criteria (e.g., women aged 18-25) until reaching exactly 100 respondents. Which method is this?', c:['Simple random','Systematic','Quota sampling','Cluster sampling'], a:2},
    {q:'Which sampling method uses tools like a fishbowl draw or a random number table?', c:['Simple Random Sampling','Systematic Sampling','Quota Sampling','Purposive Sampling'], a:0},
    {q:'In stratified sampling, members within the same stratum should be:', c:['As different as possible','As similar as possible','Randomly unrelated','Ignored'], a:1},
    {q:'Multistage sampling typically involves which two unit types?', c:['PSU and SSU','Alpha and Beta units','Primary and Tertiary groups','Control and Test groups'], a:0},
    {q:'A researcher selects participants simply because they responded first to an online post. This is:', c:['Stratified sampling','Convenience sampling','Systematic sampling','Cluster sampling'], a:1},
    {q:'Choosing participants because they meet specific expert criteria (e.g., licensed doctors only) is:', c:['Purposive sampling','Convenience sampling','Simple random sampling','Systematic sampling'], a:0},
    {q:'Which of the following is a NON-probability sampling method?', c:['Stratified','Cluster','Convenience','Multistage'], a:2},
    {q:'A survey samples every 10th customer who enters a store. This is:', c:['Systematic sampling','Stratified sampling','Cluster sampling','Purposive sampling'], a:0},
    {q:'Between clusters in cluster sampling, the groups should ideally be:', c:['Very different from each other','Similar to each other (homogeneous)','Impossible to compare','Always unequal in size'], a:1},
    {q:'Which sampling method gives every member of the population an EQUAL chance of selection?', c:['Purposive Sampling','Simple Random Sampling','Quota Sampling','Convenience Sampling'], a:1}
  ],
  glossary:[
    {term:'Simple Random', def:'equal chance for everyone (lottery, fishbowl draw).'},
    {term:'Systematic', def:'selecting every nth member.'},
    {term:'Stratified', def:'population split into strata (similar within, different between); every stratum represented.'},
    {term:'Cluster', def:'grouping by location/geography (different within, similar between clusters).'},
    {term:'Multistage', def:'clusters formed, then random selection within them (PSU & SSU).'},
    {term:'Convenience', def:'easily accessible participants.'},
    {term:'Purposive', def:'intentionally chosen based on criteria.'},
    {term:'Quota', def:'purposive sampling continued until a quota is reached.'}
  ]},

  {id:'gm6', title:'6. Surface Area & Volume of Solid Figures', content:[
    {h:'Prisms', b:[
      'A prism is a 3D solid with two parallel, congruent polygonal bases; the other faces are parallelograms.',
      'Right Prism: Lateral Area = Perimeter of base × Lateral Edge; Surface Area = Lateral Area + 2(Area of one base); Volume = Area of one base × Altitude.',
      'Cube: LA = 4a², SA = 6a², V = a³. Rectangular Prism: LA = (2a+2b)×c, SA = c(2a+2b)+2ab, V = abc.',
      'Triangular Prism: LA = (S₁+S₂+S₃)×l; SA = LA + 2(Heron\'s area of base); V = l√[s(s−S₁)(s−S₂)(s−S₃)].',
      'Hexagonal Prism: LA = 6a×l; SA = 6al + 2(3√3a²/2); V = l(3√3a²/2).'
    ]},
    {h:'Faces, Edges, Vertices (Prisms)', b:[
      'Triangular: 5 faces, 9 edges, 6 vertices. Square: 6 faces, 12 edges, 8 vertices.',
      'Rectangular: 6 faces, 12 edges, 8 vertices. Pentagonal: 7 faces, 15 edges, 10 vertices.',
      'Hexagonal: 8 faces, 18 edges, 12 vertices. Octagonal: 10 faces, 24 edges, 16 vertices.'
    ]},
    {h:'Pyramid', b:[
      'Polyhedron with a polygonal base and triangular lateral faces meeting at an apex.',
      'Right pyramid: apex directly above the center. Oblique: apex not directly above center.',
      'Lateral Area = sum of areas of lateral faces; Surface Area = LA + Base Area; Volume = 1/3 × Base Area × Altitude.'
    ]},
    {h:'Cylinder, Cone & Sphere', b:[
      'Cylinder: LA = 2πrh; SA = 2πrh + 2πr²; V = πr²h. Right cylinder has axis perpendicular to bases.',
      'Cone: LA = πrs (s = slant height); SA = πr(r+s); V = 1/3πr²h.',
      'Sphere: Surface Area = 4πr²; Volume = 4/3πr³.'
    ]}
  ], quiz:[
    {q:'Find the volume of a cube with side length 4 cm.', c:['16 cm³','32 cm³','48 cm³','64 cm³'], a:3},

    {q:'Find the surface area of a sphere with radius 5. (Use π ≈ 3.14, SA = 4πr²)', c:['78.5','157','314','628'], a:2},
    {q:'Find the volume of a rectangular prism with a = 4, b = 3, c = 5 (V = abc).', c:['12','35','60','75'], a:2},
    {q:'Find the volume of a cone with radius 3 and height 7. (Use π ≈ 3.14, V = 1/3πr²h)', c:['21.98','43.96','65.94','98.91'], a:2},
    {q:'Find the volume of a pyramid with a square base of side 6 and altitude 9.', c:['54','108','162','216'], a:1},

    {q:'Which formula gives the volume of a right prism?', c:['V = Perimeter × Height','V = Area of one base × Altitude','V = 1/3 × Base Area × Altitude','V = 4/3πr³'], a:1},
    {q:'Find the lateral area of a cylinder with radius 4 and height 10. (LA = 2πrh, π≈3.14)', c:['125.6','188.4','251.2','314.0'], a:2},
    {q:'Find the surface area of a cube with side length 3 cm. (SA = 6a²)', c:['18 cm²','36 cm²','54 cm²','72 cm²'], a:2},
    {q:'What shape are the lateral faces of a pyramid?', c:['Rectangles','Triangles','Circles','Trapezoids'], a:1},
    {q:'A right cylinder has its axis:', c:['Parallel to its bases','Perpendicular to its bases','At a slant to its bases','Undefined'], a:1},
    {q:'Find the volume of a sphere with radius 3. (V = 4/3πr³, π≈3.14)', c:['37.68','75.36','113.04','150.72'], a:2},
    {q:'How many edges does a hexagonal prism have?', c:['12','15','18','24'], a:2}
  ],
  glossary:[
    {term:'Right Prism', def:'Lateral Area = Perimeter of base × Lateral Edge; Surface Area = Lateral Area + 2(Area of one base); Volume = Area of one base × Altitude.'},
    {term:'Cube', def:'LA = 4a², SA = 6a², V = a³. Rectangular Prism: LA = (2a+2b)×c, SA = c(2a+2b)+2ab, V = abc.'},
    {term:'Triangular Prism', def:'LA = (S₁+S₂+S₃)×l; SA = LA + 2(Heron\'s area of base); V = l√[s(s−S₁)(s−S₂)(s−S₃)].'},
    {term:'Hexagonal Prism', def:'LA = 6a×l; SA = 6al + 2(3√3a²/2); V = l(3√3a²/2).'},
    {term:'Triangular', def:'5 faces, 9 edges, 6 vertices. Square: 6 faces, 12 edges, 8 vertices.'},
    {term:'Rectangular', def:'6 faces, 12 edges, 8 vertices. Pentagonal: 7 faces, 15 edges, 10 vertices.'},
    {term:'Hexagonal', def:'8 faces, 18 edges, 12 vertices. Octagonal: 10 faces, 24 edges, 16 vertices.'},
    {term:'Right pyramid', def:'apex directly above the center. Oblique: apex not directly above center.'},
    {term:'Cylinder', def:'LA = 2πrh; SA = 2πrh + 2πr²; V = πr²h. Right cylinder has axis perpendicular to bases.'},
    {term:'Cone', def:'LA = πrs (s = slant height); SA = πr(r+s); V = 1/3πr²h.'},
    {term:'Sphere', def:'Surface Area = 4πr²; Volume = 4/3πr³.'}
  ]}
]},

{id:'pklp1', name:'PKLP1: Kamalayang Pangkasaysayan', lessons:[
  {id:'pk1', title:'1. Kasaysayan: Kahulugan at Kahalagahan', content:[
    {h:'Kasaysayan', b:[
      'Kasaysayan: isang sanaysay na isinasalaysay na may saysay na magpapabago sa lipunan ngayon.',
      'Historia/Historie: mula sa salitang Griyego, nangangahulugang pagkatuto, pagtatanong sa pag-aaral o pag-iimbestiga (pinakamahalaga).',
      'Herodotus ng Gresya: tinaguriang "Ama ng Kasaysayan"; nagpasimula ng pamamaraan ng pag-aaral ng nakalipas na pangyayari, tinawag itong "historiya" (imbestigasyon).'
    ]},
    {h:'Tradisyunal vs. Makabagong Kahulugan', b:[
      'Tradisyunal: kasaysayan bilang talaan ng nakaraan (records of the past); kahinaan — batay lamang sa nakasulat na dokumento ("walang nakasulat na tala, walang kasaysayan").',
      'Makabago/Moderno: muling pagbubuo ng nakaraan gamit ang nakasulat na tala, oral history, at cultural artifacts (tangible objects na nagrerepresenta sa nakaraan).'
    ]},
    {h:'Mahalagang Gawain ng Historyador', b:[
      'Tamang interpretasyon at pagbuhay muli sa nakalipas sa pamamagitan ng artifacts sa maayos at sistematikong paraan.',
      'Historical Revisionism: pagbabago/pag-rerevise ng kasaysayan para maging mas accurate.',
      'Historical Distortion: MALI — intensyonal na pagbabago ng tala sa personal na antas.',
      'Leopold Von Ranke: Ama ng kasaysayang siyentipiko.'
    ]},
    {h:'Kahalagahan ng Kasaysayan', b:[
      'Gabay at tulay sa pagitan ng kasalukuyan at nakaraan.',
      'Naipapaliwanag ang mga sanhi ng mga pangyayari.',
      'Nagbibigay linaw sa maaaring mangyari sa hinaharap.',
      'Itinataguyod ang nasyonalismo at pagkamakabayan; kasangkapan sa pag-unawa ng pambansang pagkakakilanlan.'
    ]}
  ], quiz:[
    {q:'Sino ang tinaguriang "Ama ng Kasaysayan"?', c:['Leopold Von Ranke','Herodotus','Teodoro Agoncillo','Zeus Salazar'], a:1, e:'Si Herodotus ng Gresya ang tinaguriang "Ama ng Kasaysayan," na nagpasimula ng pamamaraang tinawag niyang "historiya" (imbestigasyon).'},
    {q:'Ano ang tawag ni Herodotus sa kanyang pamamaraan ng pag-aaral ng nakaraan?', c:['Historiya (imbestigasyon)','Historiography','Archival study','Ethnography'], a:0, e:'Tinawag ni Herodotus na "historiya" ang kanyang pamamaraan, na ang ibig sabihin ay imbestigasyon.'},
    {q:'Ano ang kahinaan ng tradisyunal na kahulugan ng kasaysayan?', c:['Masyadong maraming batis','Batay lamang sa nakasulat na dokumento, hindi isinasaalang-alang ang oral history','Hindi kailanman ginamit sa paaralan','Wala itong kahinaan'], a:1, e:'Ang tradisyunal na kahulugan ay batay lamang sa nakasulat na dokumento — hindi isinasaalang-alang ang oral history o mga cultural artifact.'},
    {q:'Ang intensyonal na pagbabago sa tala ng kasaysayan sa personal na antas ay tinatawag na:', c:['Historical Revisionism','Historical Distortion','Historiography','Ethnography'], a:1, e:'Historical Distortion ang tawag sa MALING, intensyonal na pagbabago ng tala ng kasaysayan sa personal na antas — iba ito sa Revisionism na para sa accuracy.'},
    {q:'Sino ang kinikilalang "Ama ng Kasaysayang Siyentipiko"?', c:['Herodotus','Leopold Von Ranke','Renato Constantino','Teodoro Agoncillo'], a:1, e:'Si Leopold Von Ranke ang kinikilalang Ama ng Kasaysayang Siyentipiko.'},
    {q:'Alin ang HINDI kabilang sa kahalagahan ng kasaysayan?', c:['Gabay sa hinaharap','Pagpapalaganap ng nasyonalismo','Pagbibigay linaw sa mga kondisyon ng isang panahon','Pagbabawal sa pag-aaral ng ibang bansa'], a:3, e:'Ang kasaysayan ay nagsisilbing gabay, nagpapalaganap ng nasyonalismo, at nagbibigay linaw sa konteksto ng isang panahon — hindi ito nagbabawal ng pag-aaral ng ibang bansa.'}
  ], glossary:[
    {term:'Historia/Historie', def:'salitang Griyego na nangangahulugang pagkatuto/pagtatanong sa pag-aaral o pag-iimbestiga.'},
    {term:'Historical Revisionism', def:'pagbabago/pag-rerevise ng kasaysayan para maging mas accurate.'},
    {term:'Historical Distortion', def:'MALI — intensyonal na pagbabago ng tala sa personal na antas.'}
  ]},
  {id:'pk2', title:'2. Ika-19 na Siglo at Historiyograpiya', content:[
    {h:'Impluwensya ng Ika-19 na Siglo (1801-1900)', b:[
      'Positivist: diin sa scientific method/proseso. Empiricist: batay sa karanasan bilang pinagmumulan ng kaalaman — magkatulad ang dalawa.',
      'Ang kasaysayan ay naging isang agham — "walang dokumento, walang kasaysayan."',
      'Mga pangyayari noong ika-19 siglo: Industrial Revolution, pagsikat ni Karl Marx, pagkabuhay ni Jose Rizal, pagkabuo ng mga Ilustrado.',
      '3Gs ng kolonisasyon: God (kristiyanismo), Gold (spices/yaman), Glory (mas maraming kolonya, kapangyarihan).'
    ]},
    {h:'Batis at Historiyograpiya', b:[
      'Facts, Archives (koleksiyon ng batis), Historyador (sumusulat sa mga batis), Historical methodology (interpretasyon, pagsusuri, pagpili ng impormasyon).',
      'Historiography/Historiyograpiya: ang pag-aaral ng pagsulat ng kasaysayan; ika-16 siglo — mga salaysay ng mga Espanyol (Ethnography).',
      'Mga manunulat: Miguel de Loarca, Antonio de Morga, Francisco Alcina, Juan de Plasencia, Boxer Codex — lahat may kritisismo sa mga Pilipino.'
    ]},
    {h:'Mga Pananaw sa Pagsulat ng Kasaysayan', b:[
      'Teodoro Agoncillo: kasaysayan bilang interpretasyon, mula sa pananaw ng Pilipinong historyador.',
      'Marxist perspective: Renato Constantino.',
      'Pantayong pananaw (Zeus Salazar): gamit ang wikang Pilipino, "nagmula sa atin, para sa atin."',
      'Pangkaming pananaw: "kami, hindi kayo" — hindi kasama ang kausap.',
      'Paaralan ng Annales: inter-disciplinary, humantong sa iba\'t ibang sangay ng kasaysayan (pampulitika, ekonomiya, kultura, panlipunan, kapaligiran).'
    ]},
    {h:'Historical Methodology', b:[
      'Panlabas na kritisismo: sinusuri ang piskal na anyo ng dokumento (ano, saan, kailan, paano nakuha).',
      'Panloob na kritisismo: mas mataas na antas, sinusuri ang nilalaman at interpretasyon ng dokumento.',
      'Kasaysayan bilang agham: batay sa facts, may mahigpit na proseso. Kasaysayan bilang sining: binibigyang kahulugan ng mananalaysay ang katotohanan mula sa batis.'
    ]}
  ], quiz:[
    {q:'Ano ang ibig sabihin ng "positivist" na diwa noong ika-19 siglo?', c:['Diin sa scientific method/proseso','Diin sa personal na damdamin','Diin sa oral tradition','Diin sa relihiyon'], a:0, e:'Ang positivist na kaisipan ay nagbibigay-diin sa scientific method o proseso bilang batayan ng kaalaman.'},
    {q:'Ano ang 3Gs ng kolonisasyon?', c:['Gold, Guns, Government','God, Gold, Glory','Greed, Gold, Government','God, Guns, Glory'], a:1, e:'Ang 3Gs ay God (kristiyanismo), Gold (spices/yaman), at Glory (mas maraming kolonya at kapangyarihan).'},
    {q:'Sino ang nagbigay-diin sa "kasaysayan bilang interpretasyon" mula sa pananaw ng Pilipinong historyador?', c:['Renato Constantino','Teodoro Agoncillo','Zeus Salazar','Leopold Von Ranke'], a:1, e:'Si Teodoro Agoncillo ang lumikha ng bagong pananaw — kasaysayan bilang interpretasyon, sa pananaw ng mga Pilipinong historyador.'},
    {q:'Ang "Pantayong Pananaw" ni Zeus Salazar ay may sloganng:', c:['"Kami, hindi kayo"','"Nagmula sa atin, para sa atin"','"Walang kasaysayan kung walang dokumento"','"Kasaysayan bilang agham"'], a:1, e:'Ang Pantayong Pananaw ay gumagamit ng wikang Pilipino, may sloganng "nagmula sa atin, para sa atin."'},
    {q:'Ang "Pangkaming Pananaw" ay tumutukoy sa:', c:['Pagsasama ng kausap sa "kami"','Hindi pagsasama ng kausap sa "kami" ("kami, hindi kayo")','Isang uri ng batis','Isang teorya ng migrasyon'], a:1, e:'Sa Pangkaming Pananaw, ang "kami" ay hindi kasama ang taong kausap — "kami, hindi kayo."'},
    {q:'Alin ang mas mataas na antas ng kritisismo — sumusuri sa nilalaman at interpretasyon ng dokumento?', c:['Panlabas na kritisismo','Panloob na kritisismo','Historiography','Ethnography'], a:1, e:'Ang panloob na kritisismo ay mas mataas na antas, sumusuri sa nilalaman, interpretasyon, at mga salitang ginamit sa dokumento.'},
    {q:'Alin sa mga sumusunod ang HINDI isa sa mga manunulat na dumating sa Pilipinas noong ika-16 siglo?', c:['Miguel de Loarca','Antonio de Morga','Teodoro Agoncillo','Juan de Plasencia'], a:2, e:'Sina Miguel de Loarca, Antonio de Morga, at Juan de Plasencia ay mga Espanyol na manunulat noong ika-16 siglo; si Teodoro Agoncillo ay modernong Pilipinong historyador.'}
  ], glossary:[
    {term:'Historiography/Historiyograpiya', def:'ang pag-aaral ng pagsulat ng kasaysayan.'},
    {term:'Panlabas na kritisismo', def:'sinusuri ang piskal na anyo ng dokumento (ano, saan, kailan, paano nakuha).'},
    {term:'Panloob na kritisismo', def:'mas mataas na antas, sinusuri ang nilalaman at interpretasyon ng dokumento.'},
    {term:'Paaralan ng Annales', def:'inter-disciplinary na paraan, humantong sa paglikha ng iba pang sangay ng kasaysayan.'}
  ]},
  {id:'pk3', title:'3. Elemento ng Kasaysayan at Heograpiya', content:[
    {h:'Mga Elemento ng Kasaysayan', b:[
      'Tao: pinaka-importanteng elemento — siya ang gumaganap at gumagawa ng kasaysayan.',
      'Lokasyon: pambansa o lokal — malalaman dito ang kultura, tradisyon, pagkain, kasuotan.',
      'Konteksto: kailan, anong kultura, anong pilosopiya, sanhi at epekto.',
      'Batis (Sources): nakasulat (birth/death certificate, census) at artifacts (larawan, kasangkapan, armas).'
    ]},
    {h:'Mga Hamon sa Lokal na Kasaysayan', b:[
      'Kaunting materyales/batis sa lokal na kasaysayan; problema sa paglalapat ng dokumentong nakasulat sa dayuhang lengguwahe.',
      'Pagkiling (bias) ng mga dayuhang historyador.',
      'Kakulangan ng batis para irepresenta ang buong bansa; kakulangan ng sanay/tunay na historyador.'
    ]},
    {h:'Heograpiya ng Pilipinas', b:[
      'Matatagpuan sa Timog-Silangang Asya; bahagi ng Pacific Ring of Fire at Pacific Typhoon Belt.',
      'Nasa itaas ng ekwador (tropikal); may 7,641 na isla (archipelagic state).',
      'Iba\'t ibang wika/diyalekto = rehiyonalismo at sub-cultures; resulta: Oryentasyong Pandagat.',
      'Dalawang paraan ng pagtingin sa heograpiya: Deterministic (hindi nagbabago, hal. lokasyon sa Ring of Fire) at Possibilism (kaya nating gawin upang magbago ang paligid).'
    ]},
    {h:'Mga Teorya sa Pinagmulan ng Pilipinas (Heograpikal)', b:[
      'Continental Drift Theory (Alfred Wegener): malaking lupain na naghiwalay (Pangea); ebidensya — pagkakadugtong ng mga kontinente at fossils.',
      'Land Bridges Theory: Pilipinas konektado sa mainland Asia (Palawan) 25,000 taon nakalipas; napatunayang hindi totoong pinagmulan dahil may record na 70,000+ taon nang may naninirahan sa Pilipinas.',
      'Faulting at Folding: normal, reverse, at strike-slip fault — nabuo ang mga bulubundukin.',
      'Volcanic Origin Theory: maraming bulkan sa ilalim ng tubig na sumabog at bumuo ng lupa.',
      'Mga Labi ng Kontinente sa Pasipiko (Mu/Lemuria): hindi napatunayan; walang ebidensyang lupain.',
      'Mitolohiyang Pinagmulan: banal na paglikha, pag-aaway ng langit at dagat, "Giant Tale."'
    ]}
  ], quiz:[
    {q:'Alin ang pinaka-importanteng elemento ng kasaysayan?', c:['Lokasyon','Tao','Konteksto','Batis'], a:1, e:'Ang Tao ang pinaka-importanteng elemento — siya ang gumaganap at gumagawa ng kasaysayan.'},
    {q:'Ilang isla mayroon ang Pilipinas ayon sa notes?', c:['5,000','7,107','7,641','10,000'], a:2, e:'Ayon sa notes, may 7,641 na isla ang Pilipinas, kaya ito ay tinatawag na archipelagic state.'},
    {q:'Sino ang nagmungkahi ng Continental Drift Theory?', c:['Alfred Wegener','Felipe Landa Jocano','Bellwood','Herodotus'], a:0, e:'Si Alfred Wegener ang nagmungkahi ng Continental Drift Theory, na nagsasabing nagkahiwalay ang isang malaking lupain (Pangea).'},
    {q:'Ayon sa Land Bridges Theory, ilang taon na ang nakalipas nang konektado ang Pilipinas sa mainland Asia?', c:['5,000 taon','25,000 taon','100,000 taon','1 milyong taon'], a:1, e:'Ayon sa Land Bridges Theory, 25,000 taon na ang nakalipas nang konektado ang Pilipinas sa mainland Asia malapit sa Palawan.'},
    {q:'Bakit itinuturing na hindi totoong pinagmulan ng sinaunang Pilipino ang Land Bridges Theory?', c:['Dahil walang ebidensyang lupa noon','Dahil may record na 70,000+ taon nang may naninirahan sa Pilipinas','Dahil hindi kailanman umiral ang teoryang ito','Dahil napatunayang mali ang lahat ng datos'], a:1, e:'May ebidensyang 70,000+ taon nang may naninirahan sa Pilipinas — mas matanda kaysa sa 25,000-taong land bridge, kaya hindi ito ang tunay na pinagmulan.'},
    {q:'Aling pananaw sa heograpiya ang naniniwalang hindi ito nagbabago (hal. lokasyon sa Ring of Fire)?', c:['Possibilism','Deterministic','Historiography','Ethnography'], a:1, e:'Ang Deterministic na pananaw ay naniniwalang hindi nagbabago ang heograpikal na katangian, tulad ng lokasyon ng Pilipinas sa Pacific Ring of Fire.'},
    {q:'Ang "Oryentasyong Pandagat" ay resulta ng:', c:['Pagiging solidong lupain ng Pilipinas','Iba\'t ibang wika/diyalekto at pagiging arkipelago','Pananakop ng mga Espanyol','Pag-aaral ng Continental Drift'], a:1, e:'Ang iba\'t ibang wika/diyalekto at ang pagiging arkipelago ng Pilipinas ay nagresulta sa "oryentasyong pandagat" — pag-asa sa dagat bilang paraan ng koneksyon.'}
  ], glossary:[
    {term:'Batis', def:'sources — mga nakasulat na tala (birth/death certificate, census) at artifacts (larawan, kasangkapan, armas).'},
    {term:'Deterministic', def:'pananaw na hindi nagbabago ang heograpiya (hal. lokasyon sa Ring of Fire).'},
    {term:'Possibilism', def:'pananaw na may magagawa tayo upang baguhin ang ating kapaligiran.'},
    {term:'Continental Drift Theory', def:'ni Alfred Wegener — malaking lupain (Pangea) na naghiwalay.'}
  ]},
  {id:'pk4', title:'4. Mga Teorya ng Sinaunang Migrasyon', content:[
    {h:'Austronesian Out of Taiwan (Bellwood)', b:[
      'Ang mga Austronesian ay nanggaling sa Taiwan bago kumalat sa Timog-Silangang Asya at Karagatang Pasipiko (hanggang Madagascar).',
      'Mga Indigenous People ng Taiwan — kilalang maritime navigators; mula sa kanila ang kaalaman sa pagsasaka, pagtatanim, pangangaso.',
      'Dahilan ng migrasyon: kalapitan sa mga isla, kasanayan sa paglalayag/pagsasaka, prestihiyo sa pananakop, tumataas na densidad ng populasyon.',
      'Nagkaroon ng kalakalan sa mga Tsino (kabibe, perlas, ginto, pagkaing-dagat kapalit ng seda, porselana).'
    ]},
    {h:'Core Population Theory (Felipe Landa Jocano)', b:[
      'Pangunahing pangkat ng tao na unang nanirahan at nag-ugat sa isang lugar.',
      'Sila ang unang komunidad na bumuo ng kultura/tradisyon/paniniwalang naging pundasyon ng pagkakakilanlan ng isang lipunan.',
      'Lumalawak ang populasyon habang nadaragdagan ng bagong miyembro/impluwensya mula sa ibang grupo.',
      'Ebidensya: Tabon Cave (Palawan).'
    ]},
    {h:'Epekto ng Migrasyon at Heograpiya', b:[
      'Impluwensya sa kultura: pisikal na kapaligiran (iba\'t ibang wika), kapuluan (sub-kultura), kalakalan (Intsik, Indiyano, Arabo).',
      'Sosyo-politikal na epekto: diwa ng rehiyonalismo at seksyonalismo — mahirap bumuo ng nasyonalismo dahil sa arkipelago; heograpikal na paghihiwalay nagpahirap sa mga dayuhang mananakop (hal. Cordillera/Ifugao).',
      'Pag-angkop sa kabuhayan: pangingisda, pagsasaka sa terrace farms, pag-aalaga ng hayop na angkop sa lugar.',
      'Mga suliraning may kinalaman sa heograpiya: climate change, pagkawala ng likas na yaman, polusyon, erosion, urbanisasyon/overpopulation, migrasyon.'
    ]}
  ], quiz:[
    {q:'Sino ang nagmungkahi ng "Austronesian Out of Taiwan" theory?', c:['Bellwood','Felipe Landa Jocano','Alfred Wegener','Zeus Salazar'], a:0, e:'Si Bellwood ang nagmungkahi ng "Austronesian Out of Taiwan" theory, na nagsasabing mula sa Taiwan nanggaling ang mga Austronesian.'},
    {q:'Saan umabot ang pagkalat ng mga Austronesian people ayon sa teorya?', c:['Hawaii lamang','Madagascar','Australia lamang','Europa'], a:1, e:'Ang pagkalat ng mga Austronesian ay umabot hanggang Madagascar, mula sa Taiwan.'},
    {q:'Sino ang nagmungkahi ng Core Population Theory?', c:['Bellwood','Felipe Landa Jocano','Herodotus','Teodoro Agoncillo'], a:1, e:'Si Felipe Landa Jocano ang nagmungkahi ng Core Population Theory.'},
    {q:'Ano ang ebidensya para sa Core Population Theory?', c:['Tabon Cave (Palawan)','Banaue Rice Terraces','Boxer Codex','Pangea fossils'], a:0, e:'Ang Tabon Cave sa Palawan ang binanggit na ebidensya para sa Core Population Theory.'},
    {q:'Bakit mahirap bumuo ng diwa ng nasyonalismo sa Pilipinas ayon sa sosyo-politikal na epekto ng heograpiya?', c:['Dahil isang solidong lupain lamang ang Pilipinas','Dahil arkipelago ang Pilipinas — hiwa-hiwalay ang mga tao, iba-iba ang kultura','Dahil walang mga Pilipinong historyador','Dahil bawal pag-usapan ang nasyonalismo'], a:1, e:'Dahil arkipelago ang Pilipinas, hiwa-hiwalay ang mga tao at iba-iba ang paniniwala/kultura, mahirap magkaroon ng sense of unity.'},
    {q:'Alin ang HINDI kabilang sa mga dahilan ng migrasyon ng mga Austronesian?', c:['Kasanayan sa paglalayag','Prestihiyo sa pananakop ng lupain','Kakulangan ng interes sa pagsasaka','Tumataas na densidad ng populasyon'], a:2, e:'Ang mga Austronesian ay may kasanayan sa pagsasaka (hindi kakulangan ng interes) na naging bahagi ng dahilan ng kanilang paglipat.'}
  ], glossary:[
    {term:'Austronesian Out of Taiwan', def:'teorya ni Bellwood — nanggaling sa Taiwan ang mga Austronesian bago kumalat sa Timog-Silangang Asya.'},
    {term:'Core Population Theory', def:'ni Felipe Landa Jocano — pangunahing grupong unang nanirahan at nag-ugat sa isang lugar.'}
  ]},
  {id:'pk5', title:'5. Ilaya at Ilawod: Mga Katutubong Pamayanan', content:[
    {h:'Ilaya at Ilawod', b:[
      'Mandato ng 1987 Konstitusyon: pagyamanin ang wikang Filipino gamit ang mga katutubong wika.',
      '2 sinaunang pamayanan: Mga Taga-Ilaya at Mga Taga-Ilawod.',
      'Ilaya: upstream, bundok na pinagmulan ng ilog, source of water.',
      'Ilawod: downstream, lugar na binabaan ng ilog mula sa bundok.'
    ]},
    {h:'Mga Grupong Ilaya', b:[
      'Iraya Mangyan: Abra de Ilog, Mamburao, Paluan (Oriental Mindoro); kilala sa paghahabi (bayong, plato, baso).',
      'Panay-Bukidnon/Suludnon: kabundukan ng Panay Island; may tradisyong "Binukot" — kababaihang itinatago mula pagkabata para mapanatili ang kagandahan at maituro ang epiko/kasaysayan ng lahi.',
      'Igorot: Cordilleras, Hilagang Luzon; naniniwala sa Animism (Dios Adi Kaila, Kabunyan, Anitos); may 6 pangunahing ethno-linguistic groups (Bontoc, Ibaloi, Ifugao, Isneg, Kalinga, Kankana-ey); kilala sa Banaue Rice Terraces at Apo Whang-Od (mambabatok).'
    ]},
    {h:'Mga Grupong Ilawod', b:[
      'Moro: mga katutubong Muslim sa Mindanao, Sulu, Palawan; 13 ethnolinguistic groups; pangalan mula sa Espanyol na "Moor."',
      'Badjao: sea dwellers/sea gypsies; Zamboanga at Sulu; sustainable fishing methods; naniniwala sa Animism (espiritu ng karagatan).'
    ]},
    {h:'Lumad (Ilaya at Ilawod)', b:[
      'Bisayan word para sa "native/indigenous"; ginagamit para sa hindi-Muslim, hindi-Kristiyanong etnikong grupo sa Mindanao.',
      'Cotabato Congress (Hunyo 1986): kinilala ang mga Lumad group (Subanen, Blaan, Mandaya, Manobo, T\'boli, atbp.).',
      'Nakatuon sa agrikultura at kalikasan; naniniwala sa Animism; humaharap din sa diskriminasyon at pagkawala ng lupain.'
    ]}
  ], quiz:[
    {q:'Ano ang ibig sabihin ng "Ilaya"?', c:['Downstream','Upstream/bundok na pinagmulan ng ilog','Baybayin','Kapatagan'], a:1, e:'Ang Ilaya ay tumutukoy sa upstream — ang bundok na pinagmulan ng ilog, source of water.'},
    {q:'Ano ang tradisyong "Binukot" ng Panay-Bukidnon?', c:['Isang uri ng pagkain','Kababaihang itinatago mula pagkabata upang mapanatili ang kagandahan at kadalisayan','Isang uri ng bahay','Isang ritwal sa digmaan'], a:1, e:'Ang Binukot ay tradisyon kung saan itinatago ang kababaihan mula pagkabata upang mapanatili ang kagandahan at maituro sa kanila ang epiko/kasaysayan ng kanilang lahi.'},
    {q:'Alin sa mga sumusunod ang isa sa 6 pangunahing ethno-linguistic groups ng Igorot?', c:['Ifugao','Badjao','Moro','Lumad'], a:0, e:'Ang Ifugao ay isa sa 6 pangunahing ethno-linguistic groups ng Igorot, kilala sa Banaue Rice Terraces.'},
    {q:'Sino ang kilalang mambabatok (traditional tattoo artist) na binanggit sa notes?', c:['Lucia Caballero','Apo Whang-Od','Datu Mabanhaw','Zeus Salazar'], a:1, e:'Si Apo Whang-Od ang kilalang oldest mambabatok (pamamaraan ng paglalagay ng tattoo) na binanggit sa notes.'},
    {q:'Ang termino bang "Moro" ay nagmula saan?', c:['Salitang Tagalog','"Moor" (Espanyol) mula sa "Mauru" (Latin)','Salitang Ingles','Salitang Intsik'], a:1, e:'Ang "Moro" ay nagmula sa salitang Espanyol na "Moor," na nagmula naman sa Latin na "Mauru."'},
    {q:'Ang Badjao ay kilala rin bilang:', c:['Mountain dwellers','Sea gypsies/sea dwellers','Forest guardians','Urban settlers'], a:1, e:'Ang Badjao ay kilala bilang sea dwellers, sea tribes, fisher folks, sea gypsies, o sea guardians.'},
    {q:'Ang Cotabato Congress noong Hunyo 1986 ay ginanap para sa:', c:['Pagtatalaga ng bagong pangulo','Pagkilala at pagtala sa mga pangkat etniko (Lumad, Bangsa Moro, Mindanaon, Christian)','Pagbabawal sa Animism','Pagtatayo ng bagong lungsod'], a:1, e:'Ang Cotabato Congress ay para matukoy, maisa-isa, at maitala ang mga pangkat etniko sa Mindanao.'}

{id:'effcom1', name:'EffCom1: Effective Communication', lessons:[
  {id:'ec1', title:'1. Communication: An Overview', content:[
    {h:'Communication', b:[
      'A two-way process between a sender and a receiver.',
      'Sharing of meaning by sending and receiving social cues (e.g. someone waves at you).',
      'A dynamic process in which people attempt to share their internal states with other people through the use of symbols (letters/words).',
      '"Dynamic" means it varies from person to person, situation to situation.'
    ]},
    {h:'Basic Forms of Communication', b:[
      'Verbal: as long as you use words — speaking, writing, texting. Rule-specific (grammar) and almost always planned.',
      '4 macroskills of language (verbal): Speaking, Writing, Listening, Reading.',
      'Non-verbal: the total opposite of verbal — spontaneous and unstructured.',
      'Examples of non-verbal: Facial Expressions, Gestures, Body Language, Proxemics, Paralinguistics, Eye gaze, Haptics, Appearance.',
      'Proxemics zones: Intimate (1-1.5 ft), Personal (1.5-4 ft), Social (4-12 ft), Public (12+ ft).',
      'Paralinguistics: pitch, volume, tone, intonation, rhythm, silence — "it\'s not what you say, it\'s how you say it."'
    ]},
    {h:'Improving Verbal Communication', b:[
      'Appropriateness — right term at the right time, context is everything.',
      'Brevity — keep it short and simple.',
      'Clarity — be understandable.',
      'Ethics — apply G.R.E.P.S: Gender, Roles, Ethnicity, Preferences, Status.',
      'Vividness — try to use the exact/concrete words.'
    ]},
    {h:'The 9 C\'s of Communication', b:[
      'Congruency: verbal and non-verbal cues align, avoid mixed signals.',
      'Conciseness: brief but meaningful, remove unnecessary words.',
      'Clarity: avoid vagueness, make the message specific and direct.',
      'Consistency: repeat important messages the same way each time.',
      'Considering your Audience: know their background, adjust tone/vocabulary.',
      'Content: value the substance of your message.',
      'Checking for Understanding: verify the audience grasped the message.',
      'Choosing the Right Medium: select the best channel for the situation.',
      'Common Language: use language your audience understands, avoid unnecessary jargon.'
    ]}
  ], quiz:[
    {q:'Communication is best defined as a two-way process between a:', c:['Teacher and student only','Sender and a receiver','Writer and editor only','Boss and employee only'], a:1, e:'Communication is fundamentally a two-way process between a sender and a receiver (or speaker/listener, writer/reader).'},
    {q:'Which basic form of communication is "rule-specific" and "almost always planned"?', c:['Non-verbal','Verbal','Both equally spontaneous','Neither'], a:1, e:'Verbal communication is rule-specific (follows grammar rules) and almost always planned, unlike non-verbal communication.'},
    {q:'Which of the 4 macroskills of language is NOT typically classified as verbal in the notes?', c:['Speaking','Writing','Listening','Facial expression'], a:3, e:'The 4 macroskills of verbal language are Speaking, Writing, Listening, and Reading — facial expression is a non-verbal cue.'},
    {q:'Which proxemics zone covers 4 to 12 feet?', c:['Intimate','Personal','Social','Public'], a:2, e:'The Social Zone covers roughly 4 to 12 feet of distance.'},
    {q:'"It\'s not what you say, it\'s how you say it" best describes:', c:['Proxemics','Paralinguistics','Haptics','Appearance'], a:1, e:'Paralinguistics deals with pitch, volume, tone, intonation, rhythm, and silence — the "how" of spoken communication.'},
    {q:'The G.R.E.P.S. framework under Ethics in verbal communication stands for Gender, Roles, Ethnicity, Preferences, and:', c:['Status','Speed','Style','Structure'], a:0, e:'G.R.E.P.S. stands for Gender, Roles, Ethnicity, Preferences, and Status.'},
    {q:'Which of the 9 C\'s emphasizes that verbal and non-verbal cues should align?', c:['Congruency','Conciseness','Consistency','Content'], a:0, e:'Congruency specifically ensures verbal and non-verbal cues align, avoiding mixed signals.'},
    {q:'Which of the 9 C\'s involves verifying that the audience actually grasped your message?', c:['Clarity','Checking for Understanding','Considering your Audience','Common Language'], a:1, e:'Checking for Understanding involves verifying comprehension, often via clarifying questions or feedback.'}
  ], glossary:[
    {term:'Verbal Communication', def:'rule-specific, almost always planned; uses words (speaking, writing, texting).'},
    {term:'Non-verbal Communication', def:'spontaneous and unstructured; facial expressions, gestures, proxemics, paralinguistics, etc.'},
    {term:'G.R.E.P.S.', def:'Gender, Roles, Ethnicity, Preferences, Status — framework for ethical verbal communication.'},
    {term:'9 C\'s of Communication', def:'Congruency, Conciseness, Clarity, Consistency, Considering your Audience, Content, Checking for Understanding, Choosing the Right Medium, Common Language.'}
  ]},
  {id:'ec2', title:'2. Speech Styles', content:[
    {h:'The 5 Speech Styles (I Can Count Five Fingers)', b:[
      'Intimate: private relationship; interlocutors have their own way of communicating only they understand (e.g. pet names, code names for crushes).',
      'Casual: friends/acquaintances; relaxed grammar, possibly incomplete sentences (e.g. chatting with besties).',
      'Consultative: professional transaction; one party is the expert the other seeks advice from (e.g. doctor-patient, teacher-student consultation).',
      'Formal: follows conventions/structure/rules of grammar and politeness (e.g. thesis defense, court statement).',
      'Frozen: most rigid/formal; message is non-negotiable, lacks personal interaction (e.g. Miranda Rights, oaths, pageant mottos).',
      'Mnemonic: I Can Count Five Fingers = Intimate, Casual, Consultative, Formal, Frozen.',
      'You are not limited to one speech style per relationship — you can shift styles even with a formal/consultative relationship if rapport allows.'
    ]},
    {h:'Historical Linguistics (Language Change)', b:[
      'Language is a living organism — it\'s born, matures, and can eventually "die" or transform.',
      'Social prestige: people adopt words used by those they admire (e.g. mimicking influencers/celebrities).',
      'Inventions: new things need new words (e.g. "computer," "selfie," "groufie").',
      'Practicality: humans shorten words to make communication easier (e.g. refrigerator → fridge, television → TV).',
      'Imperfect learning: misinterpretation/misuse of a word that becomes standard (e.g. "salvage" in the Philippines during Martial Law came to mean "to kill," opposite of its dictionary meaning "to save").',
      'Language is forever fluid — the speech styles used today could change in the future.'
    ]}
  ], quiz:[
    {q:'Which speech style is used when interlocutors have developed their own private way of communicating that only they understand?', c:['Casual','Intimate','Consultative','Formal'], a:1, e:'The Intimate style is used in private relationships where the interlocutors have devised their own exclusive way of communicating.'},
    {q:'Which speech style is most rigid, non-negotiable, and often seen in rituals or legal ceremonies?', c:['Formal','Consultative','Frozen','Casual'], a:2, e:'The Frozen style is the most formal and rigid, used in contexts like religious rituals, oaths, and the Miranda Rights, where the message is non-negotiable.'},
    {q:'A doctor giving a diagnosis to a patient is an example of which speech style?', c:['Intimate','Casual','Consultative','Frozen'], a:2, e:'The Consultative style applies when one party (the doctor) is considered an expert that the other party seeks for advice.'},
    {q:'Which mnemonic is used to remember the 5 speech styles?', c:['CAVE B','I Can Count Five Fingers','G.R.E.P.S.','P-R-I-R'], a:1, e:'"I Can Count Five Fingers" stands for Intimate, Casual, Consultative, Formal, and Frozen.'},
    {q:'The word "salvage" taking on the meaning "to kill" in the Philippines during Martial Law is an example of language change through:', c:['Social prestige','Inventions','Imperfect learning','Practicality'], a:2, e:'This is a classic example of imperfect learning — a misuse/misinterpretation of a word (opposite of its dictionary meaning) that became standard usage.'},
    {q:'Shortening "refrigerator" to "fridge" is an example of language change through:', c:['Social prestige','Practicality','Imperfect learning','Inventions'], a:1, e:'Practicality drives humans to shorten words to make communication easier and faster.'},
    {q:'Adopting a new slang word because a favorite influencer uses it is an example of language change through:', c:['Social prestige','Practicality','Inventions','Imperfect learning'], a:0, e:'Social prestige reflects the human tendency to associate with and imitate people we admire, including their word choices.'}
  ], glossary:[
    {term:'Intimate Style', def:'private relationship; own exclusive way of communicating.'},
    {term:'Casual Style', def:'friends/acquaintances; relaxed grammar, possibly incomplete sentences.'},
    {term:'Consultative Style', def:'professional transaction; one party is the expert.'},
    {term:'Formal Style', def:'follows conventions, grammar rules, and politeness.'},
    {term:'Frozen Style', def:'most rigid; non-negotiable message, lacks personal interaction.'}
  ]},
  {id:'ec3', title:'3. Communication Functions', content:[
    {h:'The 5 Communication Functions', b:[
      'Regulation/Control: wanting others to manage their behavior or do things as we please (e.g. teacher giving instructions, referee\'s whistle).',
      'Social Interaction: wanting to form bonds/forge friendship (e.g. classmates sharing secrets, strangers forced to share a table).',
      'Motivation: wanting to persuade, convince, or inspire (e.g. sales agent, coach influencing an athlete).',
      'Emotional Expression: wanting to appeal to others\' emotions (e.g. student asking for a deadline extension, street child begging).',
      'Information: sharing facts, figures, statistics, or other reliable sources (e.g. DOH reporting Covid-19 casualties).'
    ]},
    {h:'Primary vs. Secondary Communication Function', b:[
      'Primary function: your real agenda/goal in the interaction.',
      'Secondary function: another function used to help achieve the primary function.',
      'Example: asking parents for money (Regulation/Control = primary) by first informing them about the graduation ball (Information = secondary).'
    ]},
    {h:'Other Named Functions', b:[
      'Informative: common when people involved are of EQUAL rank/status (e.g. classmate to classmate).',
      'Instructive: used when people involved are of UNEQUAL rank/status (e.g. teacher to student, doctor to patient).',
      'Persuasion: goal is to change the opinion of the other person.',
      'Aesthetic: achieved when there is a deeper connection between sender and receiver (e.g. pursuing a crush).',
      'Therapeutic: end goal is to make the other person\'s feelings much better (giving comfort/encouragement, distinct from just Emotional Expression which is about appealing to feelings).'
    ]}
  ], quiz:[
    {q:'A referee blowing a whistle as a go-signal for a player to serve the ball illustrates which communication function?', c:['Regulation/Control','Social Interaction','Motivation','Emotional Expression'], a:0, e:'This is Regulation/Control — managing/directing another person\'s behavior.'},
    {q:'Two strangers forced to share a table at a fast food chain and making small talk illustrates which communication function?', c:['Motivation','Social Interaction','Information','Regulation/Control'], a:1, e:'This illustrates Social Interaction — forming bonds even with people we\'re not close to, simply because we\'re thrown together.'},
    {q:'A credit card agent encouraging people to avail of a promo illustrates which communication function?', c:['Information','Emotional Expression','Motivation','Regulation/Control'], a:2, e:'This is Motivation — communicating to persuade, convince, or inspire someone toward an action.'},
    {q:'A street child begging for food from a passerby illustrates which communication function?', c:['Information','Emotional Expression','Motivation','Regulation/Control'], a:1, e:'This is Emotional Expression — appealing to the emotions of the other person.'},
    {q:'DOH reporting a decrease in Covid-19 casualties illustrates which communication function?', c:['Information','Motivation','Emotional Expression','Social Interaction'], a:0, e:'This is Information — sharing facts, figures, and statistics from reliable sources.'},
    {q:'In the example of asking parents for graduation ball money by first sharing details about the event, which is the PRIMARY function and which is SECONDARY?', c:['Primary: Information, Secondary: Regulation/Control','Primary: Regulation/Control, Secondary: Information','Both are Primary','Neither has a primary/secondary distinction'], a:1, e:'The real agenda (getting money) is Regulation/Control (primary); sharing details about the ball to persuade them is Information (secondary), used to achieve the primary goal.'},
    {q:'Communication between a teacher and student, where one has more knowledge/authority, is classified as:', c:['Informative','Instructive','Aesthetic','Persuasion'], a:1, e:'Instructive communication occurs between people of unequal rank/status, such as teacher to student or doctor to patient.'},
    {q:'Communication between classmates of equal status sharing information is classified as:', c:['Instructive','Informative','Therapeutic','Aesthetic'], a:1, e:'Informative communication is the common function between people of equal rank or status.'},
    {q:'Continuing to talk to your crush to build a deeper connection illustrates which communication function?', c:['Therapeutic','Aesthetic','Instructive','Regulation/Control'], a:1, e:'Aesthetic communication is achieved when pursuing a deeper, more intimate connection between sender and receiver.'},
    {q:'Telling a tired friend "it\'s okay, it\'s gonna be worth it" to make them feel better illustrates which function?', c:['Emotional Expression','Therapeutic','Information','Persuasion'], a:1, e:'Therapeutic communication aims to make the other person\'s feelings better — distinct from Emotional Expression, which is about appealing to/expressing feelings.'}
  ], glossary:[
    {term:'Primary Communication Function', def:'your real agenda/goal in an interaction.'},
    {term:'Secondary Communication Function', def:'another function used to help achieve the primary function.'},
    {term:'Informative', def:'common function between people of equal rank/status.'},
    {term:'Instructive', def:'function used between people of unequal rank/status.'},
    {term:'Therapeutic', def:'goal is to make the other person\'s feelings much better.'}
  ]},
  {id:'ec4', title:'4. Communication Models', content:[
    {h:'What Are Communication Models?', b:[
      'Conceptual frameworks to better understand the way of communicating; theories explaining our way of communicating with each other.',
      'Try to answer the 5 W\'s and 1 H (Who, What, When, Where, Why, How).',
      'Common elements: Source/Sender, Message, Channel, Receiver.',
      'Noise: communication barriers — internal (hungry, angry, stressed, headache) or external (cars honking, broken mic, loud people, heavy rain).'
    ]},
    {h:'Linear Models (No Feedback)', b:[
      'Aristotle\'s Model (before 300 BC): the father of communication models; Speaker → Speech → Occasion → Audience → Effect; uses ethos (credibility), pathos (emotional appeal), logos (logic); doesn\'t include direct feedback, only "effect."',
      'Laswell\'s Model (1948): Who (formulates message) → What (content) → Channel (medium) → Whom (receiver) → Effect (outcome); still linear, one-way arrow.',
      'Shannon-Weaver Model (1949): "Mother of Communication Models"; introduces sender, encoder, channel, decoder, receiver; the FIRST model to introduce the concept of noise.',
      'Berlo\'s Model (1960): 4 main components — Sender, Message, Channel, Receiver; each affected by many factors; still linear.'
    ]},
    {h:'Interactive & Transactional Models', b:[
      'Schramm\'s Model (1954): uses a Venn diagram; introduces "field of experience" — common experience between sender/receiver enables understanding; Interactive model — turn-taking to send/receive messages and feedback.',
      'Barnlund\'s Model (1970): Transactional — sending and receiving happen SIMULTANEOUSLY between people (you are both sender and receiver at once).',
      'Julia Wood\'s Model (2009): similar to Schramm but adds TIME (t1, t2, t3...) — the shared field of experience expands as communication continues over time.',
      'E-Mediated Communication Model (2016): uses cyberspace/technology (SNS, email, video calls) as the medium for communication.'
    ]}
  ], quiz:[
    {q:'Who is considered the "father of communication models"?', c:['Shannon-Weaver','Aristotle','Berlo','Schramm'], a:1, e:'Aristotle is considered the father of communication models, with the oldest and simplest model (before 300 BC).'},
    {q:'Which model uses the sequence: Speaker → Speech → Occasion → Audience → Effect?', c:['Laswell\'s Model','Aristotle\'s Model','Berlo\'s Model','Schramm\'s Model'], a:1, e:'Aristotle\'s Model uses this exact sequence to analyze effective communication, alongside ethos, pathos, and logos.'},
    {q:'Which model is described as the "mother of communication models" and first introduced the concept of noise?', c:['Aristotle\'s Model','Laswell\'s Model','Shannon-Weaver Model','Berlo\'s Model'], a:2, e:'The Shannon-Weaver Model (1949) is called the "mother of communication models" and was the first to introduce the role of noise.'},
    {q:'Which model introduces the concept of a shared "field of experience" using a Venn diagram?', c:['Berlo\'s Model','Schramm\'s Model','Laswell\'s Model','Aristotle\'s Model'], a:1, e:'Schramm\'s Model (1954) uses a Venn diagram to show the overlapping "field of experience" between communicators.'},
    {q:'Which model states that sending and receiving happen SIMULTANEOUSLY between people?', c:['Barnlund\'s Model (Transactional)','Shannon-Weaver Model (Linear)','Aristotle\'s Model (Linear)','Laswell\'s Model (Linear)'], a:0, e:'Barnlund\'s Model (1970) is Transactional — you are both sender and receiver at the same time.'},
    {q:'Julia Wood\'s Model (2009) is similar to Schramm\'s Model but adds which additional variable?', c:['Noise','Time','Channel','Effect'], a:1, e:'Julia Wood\'s Model adds time (t1, t2, t3...) — the shared field of experience expands as communicators continue interacting over time.'},
    {q:'Which model specifically involves cyberspace/technology like SNS, email, and video calls?', c:['Berlo\'s Model','E-Mediated Communication Model','Aristotle\'s Model','Shannon-Weaver Model'], a:1, e:'The E-Mediated Communication Model (2016) makes use of cyberspace/technology as the medium of communication.'},
    {q:'An example of INTERNAL noise (a communication barrier) is:', c:['Cars honking','Being hungry or stressed','A broken microphone','Heavy rain'], a:1, e:'Internal noise refers to barriers within the person, like being hungry, angry, stressed, or having a headache — as opposed to external noise like honking cars.'},
    {q:'Which of Aristotle\'s three persuasive appeals refers to logical arguments?', c:['Ethos','Pathos','Logos','Kairos'], a:2, e:'Logos refers to logical arguments, while ethos is credibility and pathos is emotional appeal.'}
  ], glossary:[
    {term:'Noise', def:'communication barriers — internal (hungry, stressed) or external (honking, broken mic).'},
    {term:'Aristotle\'s Model', def:'Speaker → Speech → Occasion → Audience → Effect; linear, uses ethos/pathos/logos.'},
    {term:'Shannon-Weaver Model', def:'"Mother of communication models"; first to introduce noise; sender-encoder-channel-decoder-receiver.'},
    {term:'Schramm\'s Model', def:'Venn diagram of shared "field of experience"; Interactive.'},
    {term:'Barnlund\'s Model', def:'Transactional — sending/receiving happens simultaneously.'}
  ]},
  {id:'ec5', title:'5. Communication Strategies', content:[
    {h:'Language as a Communication Barrier', b:[
      'Language can help (faster mutual understanding) or hinder (if interlocutors aren\'t skilled with it) communication.',
      'When language becomes a barrier, people use tactics called communication strategies to cope.'
    ]},
    {h:'The Communication Strategies', b:[
      'Message Abandonment: stopping mid-expression due to difficulty (e.g. "nevermind").',
      'Topic Avoidance: changing the topic instead of discussing the issue at hand.',
      'Use of All-Purpose Words: general expressions like "like this," "et cetera" to avoid using the exact word.',
      'Word Coinage: inventing a term (e.g. "shrinkinator" for a shrinking gun).',
      'Literal Translation: word-for-word translation that loses the essence (e.g. "Bumagsak ako sa math!" → "I fell in math!").',
      'Foreignizing: pronouncing a native-language word as if it were in the target language (e.g. "tusok-tusok" pronounced in English style).',
      'Code Switching: combining native and target language in one sentence (e.g. "conyo" speech, "so bastos").',
      'Use of (Gap) Fillers: unnecessary words to stall/avoid dead air (e.g. "actually," "um").',
      'Circumlocution: describing an idea vividly instead of naming it directly (e.g. asking "where\'s its mother?" instead of saying "chicken").',
      'Approximation: using a closely related word/synonym.',
      'Use of Non-Verbal Cues: using gestures/sounds/body language to express what you can\'t say.',
      'Appeal for Help: asking someone else to relay your message — should be a last resort.'
    ]}
  ], quiz:[
    {q:'When a speaker simply stops talking, saying "nevermind" because they struggle to express themselves, this is:', c:['Topic Avoidance','Message Abandonment','Circumlocution','Word Coinage'], a:1, e:'Message Abandonment happens when a speaker stops mid-expression due to difficulty communicating.'},
    {q:'Changing the topic when your mom asks about your grades is an example of:', c:['Message Abandonment','Topic Avoidance','Foreignizing','Approximation'], a:1, e:'Topic Avoidance is diverting the conversation away from an uncomfortable subject.'},
    {q:'Inventing the word "shrinkinator" for a gun that shrinks objects is an example of:', c:['Word Coinage','Literal Translation','Circumlocution','Code Switching'], a:0, e:'Word Coinage involves inventing a new term based on rules of word formation in a language.'},
    {q:'Translating "Bumagsak ako sa math!" directly as "I fell in math!" — losing the intended meaning — is an example of:', c:['Foreignizing','Literal Translation','Approximation','Code Switching'], a:1, e:'Literal Translation is word-for-word translation that compromises the essence/meaning of the original expression.'},
    {q:'Pronouncing the Filipino phrase "tusok-tusok" as if it were an English word/phrase is an example of:', c:['Foreignizing','Code Switching','Word Coinage','Circumlocution'], a:0, e:'Foreignizing is pronouncing a native word as if it belongs to the target language.'},
    {q:'Combining Filipino and English within one sentence, like "conyo" speech, is an example of:', c:['Literal Translation','Code Switching','Foreignizing','Message Abandonment'], a:1, e:'Code Switching involves combining words from two languages within a single sentence.'},
    {q:'Using the word "actually" as filler in a sentence where removing it wouldn\'t change the meaning is an example of:', c:['Use of Gap Fillers','Circumlocution','Approximation','Word Coinage'], a:0, e:'Gap Fillers are unnecessary words used to stall or avoid dead air, and removing them doesn\'t change the sentence\'s meaning.'},
    {q:'Asking "where\'s its mother?" instead of saying the word "chicken" is an example of:', c:['Word Coinage','Circumlocution','Foreignizing','Approximation'], a:1, e:'Circumlocution is describing an idea vividly instead of directly naming it, often because the speaker doesn\'t know the real name.'},
    {q:'Using a synonym or closely related word to refer to something you\'ve forgotten the exact term for is:', c:['Approximation','Word Coinage','Circumlocution','Message Abandonment'], a:0, e:'Approximation involves using a closely related word/synonym in place of the exact term.'},
    {q:'Which communication strategy should be considered a LAST RESORT, according to the notes?', c:['Use of Non-Verbal Cues','Appeal for Help','Approximation','Gap Fillers'], a:1, e:'Appeal for Help — asking someone else to relay your message — is explicitly noted as something that should be a last resort/option.'}
  ], glossary:[
    {term:'Message Abandonment', def:'stopping mid-expression due to difficulty communicating.'},
    {term:'Topic Avoidance', def:'changing the topic instead of discussing the issue at hand.'},
    {term:'Word Coinage', def:'inventing a new term based on word-formation rules.'},
    {term:'Circumlocution', def:'describing an idea vividly instead of naming it directly.'},
    {term:'Appeal for Help', def:'asking someone else to relay your message — a last resort.'}
  ]},
  {id:'ec6', title:'6. Listening', content:[
    {h:'The Listening Process (P-R-I-R)', b:[
      'Perceiving: hearing sounds/words with your ears.',
      'Receiving: noticing and deliberately paying attention to what is heard.',
      'Interpreting: understanding the meaning of what you heard.',
      'Responding: reacting based on what you understood.',
      'Listening is taught for 0 to a few hours yet used 45% of our lives — it is the LEAST developed macroskill.'
    ]},
    {h:'Different Types of Listening', b:[
      'Biased: taking in only what confirms your own opinion.',
      'Appreciative: listening for enjoyment (e.g. favorite band/podcast).',
      'Dialogic: learning through open conversation where both sides learn.',
      'Sympathetic: knowing what the speaker feels.',
      'Empathic: understanding what the speaker feels (putting yourself in their shoes).',
      'Therapeutic: doing something about the speaker\'s feelings (giving advice).',
      'Relationship: listening to build trust/connection with the speaker.',
      'Discriminative: identifying sound differences (e.g. paralinguistics, distinguishing instruments).',
      'Comprehension: making sense of what is heard.',
      'Critical: identifying truths from fallacies, assessing validity.',
      'Evaluative: choosing a stand after critical listening.'
    ]},
    {h:'Keys to Effective (Active) Listening', b:[
      'Stop talking, control your surroundings, keep an open mind, listen for main points.',
      'Provide feedback, capitalize on lag time, listen between the lines.',
      'Judge ideas not appearances, hold your fire, take selective notes.'
    ]},
    {h:'Importance of Feedback When Listening', b:[
      'Clarity and confirmation, active engagement, encouragement.',
      'Resolving misunderstandings, building rapport, enhancing problem-solving skills, encouraging empathic listening.'
    ]}
  ], quiz:[
    {q:'What does the "P" in the P-R-I-R listening process stand for?', c:['Processing','Perceiving','Prioritizing','Practicing'], a:1, e:'P stands for Perceiving — the act of hearing sounds or words with your ears.'},
    {q:'What does the "I" in the P-R-I-R listening process stand for?', c:['Informing','Interpreting','Investigating','Ignoring'], a:1, e:'I stands for Interpreting — understanding the meaning of what you heard.'},
    {q:'According to the notes, listening is used approximately what percentage of our lives, despite being the least taught skill?', c:['9%','25%','45%','75%'], a:2, e:'Listening is used approximately 45% of our lives, yet it is taught for 0 to a few hours — making it the least developed macroskill.'},
    {q:'Taking in only what confirms your own opinion describes which type of listening?', c:['Appreciative','Biased','Dialogic','Critical'], a:1, e:'Biased listening involves only hearing what you agree with or want to hear.'},
    {q:'Listening for pure enjoyment, like to your favorite band, describes which type of listening?', c:['Appreciative','Sympathetic','Discriminative','Therapeutic'], a:0, e:'Appreciative listening involves taking in anything that appeals to the listener\'s sense of beauty/enjoyment.'},
    {q:'Putting yourself in the speaker\'s shoes to understand how they feel describes which type of listening?', c:['Sympathetic','Empathic','Relationship','Comprehension'], a:1, e:'Empathic listening involves understanding what the speaker feels by putting yourself in their position — beyond just knowing (sympathetic).'},
    {q:'Giving sound advice to help improve the speaker\'s situation describes which type of listening?', c:['Empathic','Sympathetic','Therapeutic','Discriminative'], a:2, e:'Therapeutic listening involves doing something about the speaker\'s feelings, such as giving advice.'},
    {q:'Distinguishing between the sounds of different musical instruments describes which type of listening?', c:['Discriminative','Comprehension','Critical','Evaluative'], a:0, e:'Discriminative listening involves identifying sound differences, such as distinguishing instruments or detecting paralinguistic cues.'},
    {q:'Choosing a stand or making a decision after assessing information describes which type of listening?', c:['Critical','Evaluative','Biased','Dialogic'], a:1, e:'Evaluative listening involves choosing a stand or decision after critical listening has assessed the validity of information.'},
    {q:'"Capitalize on lag time" as a key to effective listening refers to using the time between:', c:['Speaking speed and thinking speed to process the message','Two separate conversations','Sleep cycles','Class periods'], a:0, e:'Capitalizing on lag time means using the gap between how fast someone speaks and how fast you can think to actively process their message.'}
  ], glossary:[
    {term:'P-R-I-R', def:'Perceiving, Receiving, Interpreting, Responding — the listening process.'},
    {term:'Empathic listening', def:'understanding what the speaker feels by putting yourself in their shoes.'},
    {term:'Critical listening', def:'identifying truths from fallacies, assessing validity.'},
    {term:'Discriminative listening', def:'identifying sound differences (e.g. paralinguistics, instruments).'}
  ]},
  {id:'ec7', title:'7. Intercultural Communication', content:[
    {h:'Intercultural Communication', b:[
      'Involves communicating with a person/group who may not share the same assumptions, values, allegiances, or symbol associations as you.',
      'Ethnocentrism: thinking your race/ethnicity is superior to others.',
      'Stereotyping: generalizing people (e.g. "Singaporeans = good at math").',
      'Lack of cultural knowledge promotes ethnocentrism/stereotyping; knowledge promotes tolerance.'
    ]},
    {h:'Ways People Differ in Culture', b:[
      'Social Values: group expectations (e.g. US independence at 18 vs. Asian familial living).',
      'Roles and Status: differences in societal contribution expectations (e.g. gender roles in the Middle East).',
      'Decision-Making Customs: time spent deciding (e.g. Canadians faster than Japanese).',
      'Concepts of Time: just-in-time vs. ahead-of-time vs. on-time.',
      'Personal Space: proximity preferences while communicating.',
      'Cultural Context: High-context (relies on non-verbal/shared meaning) vs. Low-context (meaning depends on what is said).',
