  glossary:[
    {term:'Biomolecules (macromolecules)', def:'Carbohydrates, Lipids, Proteins, Nucleic Acids — made of polymers (Greek: polys = many, meris = part).'},
    {term:'Polymer', def:'long molecule of many similar/identical monomers linked by covalent bonds. Not all biomolecules have a definite monomer (lipids don\'t).'},
    {term:'Monomers by type', def:'Carbohydrate → Monosaccharide; Lipid → Glycerol, fatty acid; Protein → Amino acid; Nucleic acid → Nucleotide.'},
    {term:'Dehydration reaction (synthesis)', def:'removes a water molecule to join monomers into a longer polymer.'},
    {term:'Hydrolysis (breakdown)', def:'adds a water molecule to break a bond, splitting a polymer into monomers. The body can only absorb monomers, so digestion (chewing + enzymes) breaks polymers down.'},
    {term:'Monomer', def:'Monosaccharide. Structure: CHO. Example: glucose (C6H12O6), used in ATP production; most common monosaccharide.'},
    {term:'Aldoses', def:'carbonyl group at the end of the molecule. Ketoses — carbonyl group embedded within the molecule.'},
    {term:'Storage polysaccharides', def:'Starch (plants, all-glucose, stored in plastids) and Glycogen (animals, stored in liver/muscle).'},
    {term:'Structural polysaccharides', def:'Cellulose (plant cell walls, polymer of β-glucose, indigestible fiber for humans) and Chitin (arthropod exoskeletons, fungal cell walls).'},
    {term:'Fats (triacylglycerol)', def:'glycerol + 3 fatty acids joined by ester linkages; major function is energy storage (stored in adipose cells).'},
    {term:'Saturated fats', def:'no double bonds, solid at room temperature, linked to cardiovascular disease. Unsaturated fats — have double bonds (cis bends the chain), liquid at room temperature.'},
    {term:'Phospholipids', def:'form the cell membrane\'s phospholipid bilayer; hydrophilic head faces water, hydrophobic tail faces inward.'},
    {term:'Steroids', def:'four fused carbon rings; Cholesterol is a key steroid that maintains membrane fluidity and is a precursor for steroid hormones (testosterone, estradiol, cortisol).'},
    {term:'Peptide bond', def:'links the carboxyl end (C-terminus) of one amino acid to the amino end (N-terminus) of another; a polypeptide is a chain of many amino acids.'},
    {term:'Denaturation', def:'loss of a protein\'s native structure/shape from heat, acids, bases, salts, or agitation, making it biologically inactive (primary structure itself stays unchanged).'},
    {term:'Protein functions', def:'hormonal (insulin), receptor, contractile/motor (actin/myosin), structural (keratin, collagen), enzymatic, defensive (antibodies), storage (casein, ovalbumin), transport (hemoglobin).'},
    {term:'Monomer: Nucleotide. Structure: CHONP', def:'a nitrogenous base (A/G/C/T/U), a pentose sugar (deoxyribose or ribose), and a phosphate group.'},
    {term:'Base pairing', def:'DNA A-T, C-G; RNA A-U, C-G. Purines (Adenine, Guanine) are double-ringed; Pyrimidines (Cytosine, Thymine, Uracil) are single-ringed.'},
    {term:'Types of RNA', def:'mRNA (carries DNA\'s message to ribosomes), rRNA (structural component of ribosomes), tRNA (brings amino acids to match mRNA codons).'}
  ]},
  {id:'bn2', title:'2. Cell Structure and Function', content:[
    {h:'Basic Features of All Cells', b:[
      'A cell is the structural and functional unit of life — the simplest collection of matter considered living.',
      'Plasma membrane — selective barrier controlling passage of oxygen, nutrients, and wastes.',
      'Cytoplasm — interior of the cell (between nucleus and plasma membrane in eukaryotes). Cytosol — the semifluid gel-like substance where organelles are suspended.',
      'Chromosomes carry genes in the form of DNA. Ribosomes are the site of protein synthesis.'
    ]},
    {h:'Prokaryotes vs Eukaryotes', b:[
      'Eukaryotes ("Eu" = true, "karyotes" = nucleus) — DNA enclosed in a double-membrane-bound nucleus; generally larger (about 10-100 µm).',
      'Prokaryotes — DNA concentrated in a nucleoid region, not enclosed by a membrane; smaller (about 1-5 µm).',
      'Small cell size is advantageous: smaller cells are more efficient, exchange materials faster, and have a higher surface-to-volume (S-to-V) ratio, which increases relative surface area for exchange.'
    ]},
    {h:'Animal vs Plant Cells', b:[
      'Animal cells uniquely contain: lysosomes, centrosomes, flagella.',
      'Plant cells uniquely contain: chloroplasts, a central vacuole, and a cell wall.'
    ]},
    {h:'The Nucleus', b:[
      'Contains most of the cell\'s genes; the "brain"/information center of the cell; site of mRNA synthesis.',
      'Nuclear envelope — a double membrane (lipid bilayer) perforated by nuclear pores; the pore complex regulates passage of RNA and macromolecules; outer membrane is continuous with the rough ER.',
      'Nuclear lamina — nuclear-side protein network that mechanically supports and maintains the shape of the nuclear envelope.',
      'Nucleolus — site where rRNA is synthesized and assembled with proteins into ribosomal subunits, which exit through nuclear pores to be assembled into ribosomes in the cytoplasm.',
      'DNA + Protein = Chromatin. DNA + Histone = Nucleosome. DNA packs progressively: DNA → nucleosomes → chromatin fiber → condensed chromosome.'
    ]},
    {h:'Ribosomes', b:[
      'Made of rRNA and proteins; carry out protein synthesis. NOT considered organelles because they are not membrane-bound.',
      'Free ribosomes — suspended in the cytosol. Bound ribosomes — attached to the rough ER or nuclear envelope.',
      'Cells with high rates of protein synthesis have large numbers of ribosomes and nucleoli.'
    ]},
    {h:'Endomembrane System', b:[
      'Includes: nuclear envelope, ER, Golgi apparatus, lysosomes, vesicles/vacuoles, plasma membrane. Functions: protein synthesis/transport, lipid metabolism/movement, detoxification of poisons.',
      'Endoplasmic Reticulum (ER) — made of cisternae (flattened sacs). Rough ER is studded with ribosomes, makes proteins/glycoproteins and phospholipids. Smooth ER lacks ribosomes; synthesizes lipids, metabolizes carbohydrates, detoxifies drugs/poisons, stores calcium. Transitional ER is where transport vesicles bud off.',
      'Golgi Apparatus — made of cisternae with a cis face (receives ER vesicles) and trans face (dispatches vesicles); the cisternal maturation model describes cisternae maturing from cis to trans.',
      'Golgi functions: modifies ER products (e.g., altering glycoprotein sugars), alters membrane phospholipids, manufactures macromolecules like polysaccharides (e.g. pectin in plants).',
      'Before dispatch, Golgi products are tagged with molecular identification tags (e.g. phosphate groups) — like zip codes — so vesicles can find "docking sites" on target membranes.'
    ]},
    {h:'Lysosomes & Vacuoles', b:[
      'Lysosome — a membranous sac of hydrolytic enzymes that digest macromolecules; works best in acidic pH; buds from the trans face of the Golgi, though its enzymes are products of the ER.',
      'Phagocytosis — engulfing smaller organisms/food particles, used by amoeba/unicellular eukaryotes and macrophages (a white blood cell) against bacteria.',
      'Autophagy — a cell recycles its own organic material (e.g. damaged organelles) using lysosomal hydrolytic enzymes.',
      'Vacuoles — large vesicles derived from the ER and Golgi. Central vacuole (plants) stores cell sap, holds ions like potassium/chloride, and drives cell growth by absorbing water. Food vacuole forms during phagocytosis. Contractile vacuole (unicellular eukaryotes) pumps out excess water to maintain ion/molecule concentration.'
    ]},
    {h:'Mitochondria & Chloroplasts', b:[
      'Mitochondria — powers the cell\'s biochemical reactions by generating chemical energy; found in nearly all eukaryotic cells; enclosed by two phospholipid-bilayer membranes (smooth outer, convoluted inner with cristae); the mitochondrial matrix holds mitochondrial DNA, ribosomes, and enzymes.',
      'Chloroplast — site of photosynthesis; contains chlorophyll; found in leaves and other green plant/algal organs; has thylakoids (flattened sacs stacked into grana) and stroma (contains chloroplast DNA, ribosomes, enzymes).',
      'Chloroplasts belong to a family of plant organelles called plastids: Amyloplast (stores starch in roots/tubers) and Chromoplast (gives fruits/flowers orange/yellow hues).'
    ]}

  {id:'bn3', title:'3. Microscopy', content:[
    {h:'Magnification vs. Resolution', b:[
      'Magnification is the ratio of an object\'s image size to its real size.',
      'Resolution is a measure of the clarity of the image — the minimum distance two points can be apart and still be distinguished as separate.',
      'A microscope can magnify an image a lot but still produce a blurry picture if its resolution is poor — magnification and resolution are not the same thing.'
    ]},
    {h:'Light Microscopy (LM)', b:[
      'Visible light is passed through the specimen and then through glass lenses, which refract the light so the image is magnified.',
      'Light microscopes can effectively magnify up to about 1,000x, with a resolution limit of about 0.2 micrometers (limited by the wavelength of visible light).',
      'Most organelles are too small to be resolved clearly by the LM.'
    ]},
    {h:'Electron Microscopy (EM)', b:[
      'Focuses a beam of electrons through the specimen or onto its surface; electrons have much shorter wavelengths than light, giving far better resolution (down to about 0.2 nanometers).',
      'Biologists use the term "ultrastructure" to refer to a cell\'s anatomy as revealed by an EM.',
      'Scanning Electron Microscope (SEM): beams electrons onto the surface of a specimen (often gold-coated) to produce detailed 3D images of surface topography.',
      'Transmission Electron Microscope (TEM): beams electrons through a very thin section of a specimen, used to study the internal ultrastructure of cells.'
    ]},
    {h:'Cell Fractionation', b:[
      'The goal of cell fractionation is to take cells apart and separate major organelles from one another, based on size and density.',
      'Uses a centrifuge, typically differential centrifugation — spinning at successively higher speeds, causing heavier/larger components to pellet first.',
      'Allows researchers to prepare specific cell components in bulk and identify their functions — a technique used together with microscopy, not a replacement for it.'
    ]}
  ], quiz:[
    {q:'What is the ratio of an object\'s image size to its real size called?', c:['Resolution','Magnification','Ultrastructure','Fractionation'], a:1, e:'Magnification is defined as the ratio of an object\'s image size to its real size — how much bigger the image appears.'},
    {q:'What term describes the measure of clarity or sharpness of an image?', c:['Magnification','Resolution','Refraction','Centrifugation'], a:1, e:'Resolution measures the clarity of an image — specifically, the minimum distance two points can be apart and still be seen as distinct.'},
    {q:'Which type of microscope passes visible light through a specimen and then through glass lenses?', c:['Scanning Electron Microscope','Transmission Electron Microscope','Light Microscope','Confocal microscope only'], a:2, e:'The Light Microscope (LM) uses visible light passed through the specimen and glass lenses, which refract the light to magnify the image.'},
    {q:'What is the approximate resolution limit of a standard light microscope?', c:['0.2 nanometers','0.2 micrometers','2 millimeters','20 micrometers'], a:1, e:'Light microscopes have a resolution limit of about 0.2 micrometers, limited by the wavelength of visible light — much coarser than electron microscopes.'},
    {q:'Why are most organelles too small to see clearly with a light microscope?', c:['They are transparent','Their size falls below the resolution limit of visible light-based microscopy','They move too fast','They only exist in plant cells'], a:1, e:'Most organelles are smaller than the ~0.2 micrometer resolution limit of light microscopes, so their fine detail cannot be resolved.'},
    {q:'Which type of microscope uses a beam of electrons instead of visible light?', c:['Light Microscope','Electron Microscope','Naked eye observation','Magnifying glass'], a:1, e:'Electron microscopes (EM) use a beam of electrons, which have much shorter wavelengths than visible light, achieving far higher resolution.'},
    {q:'What is the approximate resolution of an electron microscope?', c:['0.2 millimeters','2 micrometers','0.2 nanometers','20 nanometers only'], a:2, e:'Electron microscopes can achieve a resolution of about 0.2 nanometers — roughly 1,000 times better than light microscopes.'},
    {q:'The term "ultrastructure" refers to:', c:['A cell\'s anatomy as revealed by an electron microscope','A cell\'s anatomy visible to the naked eye','A type of cell fractionation','A type of cell transport'], a:0, e:'"Ultrastructure" specifically refers to a cell\'s fine anatomical detail as revealed by electron microscopy, beyond what light microscopy can show.'},
    {q:'Which type of electron microscope is best suited for studying a cell\'s internal, three-dimensional ultrastructure by passing electrons through a thin section?', c:['Scanning Electron Microscope (SEM)','Transmission Electron Microscope (TEM)','Light Microscope (LM)','Phase-contrast microscope'], a:1, e:'The Transmission Electron Microscope (TEM) beams electrons through a thin section of the specimen, making it ideal for studying internal cell ultrastructure.'},
    {q:'Which type of electron microscope is best suited for studying the detailed surface topography of a specimen?', c:['Transmission Electron Microscope (TEM)','Scanning Electron Microscope (SEM)','Light Microscope (LM)','Bright-field microscope'], a:1, e:'The Scanning Electron Microscope (SEM) scans a beam of electrons over the surface of a specimen, producing detailed three-dimensional images of surface features.'},
    {q:'A researcher wants to see the 3D surface texture of a pollen grain in fine detail. Which microscope should they use?', c:['TEM','SEM','LM','A magnifying glass'], a:1, e:'For surface topography and 3D texture, the Scanning Electron Microscope (SEM) is the appropriate tool.'},
    {q:'A researcher wants to see the internal organelles of a thinly sliced cell sample. Which microscope should they use?', c:['SEM','TEM','LM only','None of these'], a:1, e:'The Transmission Electron Microscope (TEM) is designed to reveal internal ultrastructure by passing electrons through thin specimen sections.'},
    {q:'What is the main goal of cell fractionation?', c:['To stain cells for viewing','To take cells apart and separate major organelles from one another','To kill the cell for observation only','To increase a cell\'s magnification'], a:1, e:'Cell fractionation aims to disassemble cells and separate their major organelles from one another, typically by centrifugation, so scientists can study each component.'},
    {q:'Cell fractionation typically separates organelles based on their:', c:['Color and taste','Size and density','Age and gender','Nationality of the researcher'], a:1, e:'Cell fractionation uses differential centrifugation, which separates cell components based on their size and density — heavier/larger components settle out at lower speeds.'},
    {q:'Which technique/instrument is central to performing cell fractionation?', c:['A telescope','A centrifuge','A light microscope only','A thermometer'], a:1, e:'A centrifuge, typically using differential centrifugation (spinning at successively higher speeds), is the key tool for cell fractionation.'},
    {q:'In differential centrifugation, which components typically settle out (pellet) FIRST at lower speeds?', c:['The smallest, lightest components','The largest, heaviest components','Only liquid components','Nothing settles at low speed'], a:1, e:'In differential centrifugation, larger and denser components (like whole cells and nuclei) pellet first at lower speeds, while smaller/lighter components require higher speeds.'},
    {q:'Why is cell fractionation often used alongside microscopy rather than as a replacement for it?', c:['Because fractionation lets researchers isolate and study organelle function in bulk, while microscopy lets them see structure directly','Because fractionation is exactly the same technique as microscopy','Because microscopy cannot be used on any biological sample','Because fractionation always destroys all organelles'], a:0, e:'Fractionation and microscopy are complementary: fractionation isolates organelles in bulk to study their biochemical function, while microscopy reveals their structure and location within the cell.'},
    {q:'Which of the following would be the correct order of resolving power, from WORST to BEST resolution?', c:['Electron Microscope < Light Microscope < Naked Eye','Naked Eye < Light Microscope < Electron Microscope','Light Microscope < Naked Eye < Electron Microscope','All three have identical resolution'], a:1, e:'Resolving power increases from the naked eye (worst) to the light microscope to the electron microscope (best), each revealing progressively finer detail.'},
    {q:'A cell biologist notices that increasing magnification on their microscope makes an image bigger, but it stays blurry. This most likely reflects a limitation of the microscope\'s:', c:['Magnification power only','Resolution','Color balance','Frame rate'], a:1, e:'Increasing magnification without improving resolution just produces a bigger, blurrier image — resolution (clarity) is the true limiting factor, not magnification alone.'},
    {q:'Which of these would NOT be a typical use of light microscopy in a school laboratory setting?', c:['Observing onion cells under low power','Observing cheek cells stained with iodine','Observing the internal ultrastructure of a mitochondrion at 0.2 nm resolution','Observing pond water organisms'], a:2, e:'Resolving the internal ultrastructure of a mitochondrion at 0.2 nm resolution requires an electron microscope — this is far beyond what a school light microscope can achieve.'},
    {q:'Which best explains why electron microscopes achieve much higher resolution than light microscopes?', c:['Electrons travel faster than light','Electron beams have much shorter wavelengths than visible light, allowing finer detail to be resolved','Electron microscopes use bigger lenses','There is no real difference in resolution'], a:1, e:'The resolving power of a microscope is related to the wavelength of what it uses to image — electrons have much shorter wavelengths than visible light, enabling far greater resolution.'},
    {q:'A biology student says, "The electron microscope image looks black and white because that\'s the true color of the cell." Is this correct?', c:['Yes, cells are naturally colorless','No — EM images are naturally grayscale because electrons don\'t have color; any color seen is artificially added afterward','Yes, but only for plant cells','No, EM images are always in full natural color'], a:1, e:'Electron microscope images are inherently grayscale because electrons don\'t carry color information; any color in EM images is digitally added afterward for visualization purposes.'},
    {q:'Which of the following is the best example of using magnification and resolution TOGETHER effectively?', c:['Using very high magnification with poor resolution to see fine detail','Using an appropriate magnification paired with sufficient resolution to clearly see the structure of interest','Ignoring resolution entirely and focusing only on magnification','Using no magnification and expecting to see organelles'], a:1, e:'Effective microscopy requires balancing magnification (how big the image appears) WITH resolution (how clear/sharp the fine details are) to actually see structures clearly.'}
  ], glossary:[
    {term:'Magnification', def:'the ratio of an object\'s image size to its real size.'},
    {term:'Resolution', def:'a measure of the clarity of an image — minimum distance two points can be apart and still be distinguished as separate.'},
    {term:'Light Microscope (LM)', def:'passes visible light through a specimen and glass lenses; resolution limit ~0.2 micrometers.'},
    {term:'Electron Microscope (EM)', def:'uses a beam of electrons; resolution down to ~0.2 nanometers; reveals a cell\'s ultrastructure.'},
    {term:'Scanning Electron Microscope (SEM)', def:'beams electrons onto a specimen\'s surface to produce detailed 3D surface images.'},
    {term:'Transmission Electron Microscope (TEM)', def:'beams electrons through a thin specimen section to reveal internal ultrastructure.'},
    {term:'Cell fractionation', def:'technique using a centrifuge to separate major organelles from one another based on size and density.'}
  ]},
  {id:'bn4', title:'4. Cells (Cell Theory & Prokaryotic vs. Eukaryotic)', content:[
    {h:'Cell Theory', b:[
      'All living organisms are composed of one or more cells.',
      'The cell is the basic unit of structure, function, and organization in all living things.',
      'All cells arise only from pre-existing cells (Omnis cellula e cellula).',
      'Historically credited to Schleiden, Schwann, and Virchow in the 19th century.'
    ]},
    {h:'Two Basic Types of Cells', b:[
      'Prokaryotic cells: found only in the domains Bacteria and Archaea; lack a true, membrane-bound nucleus (DNA is concentrated in a nucleoid region) and lack most membrane-bound organelles; generally smaller (about 1-5 µm).',
      'Eukaryotic cells: found in protists, fungi, animals, and plants; have a true membrane-bound nucleus and membrane-bound organelles; generally larger (about 10-100 µm).'
    ]},
    {h:'Cell Size and the Surface Area-to-Volume Ratio', b:[
      'As a cell increases in size, its volume grows faster than its surface area, lowering its surface-to-volume (S-to-V) ratio.',
      'A high S-to-V ratio is advantageous — it allows more efficient exchange of nutrients, gases, and wastes across the plasma membrane relative to the cell\'s needs.',
      'This is a major reason cells tend to stay small, and why large organisms are made of many small cells rather than a few giant ones.'
    ]},
    {h:'The Plasma Membrane', b:[
      'Every cell — prokaryotic or eukaryotic — is bounded by a plasma membrane, which acts as a selective barrier allowing sufficient passage of oxygen, nutrients, and wastes.',
      'This selective permeability is essential to maintaining a stable internal environment distinct from the outside.'
    ]}
  ], quiz:[
    {q:'According to Cell Theory, all living organisms are composed of:', c:['Only tissues','One or more cells','Only organs','Only DNA molecules'], a:1, e:'A core principle of Cell Theory is that all living organisms are composed of one or more cells.'},
    {q:'According to Cell Theory, the cell is considered:', c:['An unimportant structure','The basic unit of structure, function, and organization of life','Only found in animals','A type of molecule'], a:1, e:'Cell Theory establishes the cell as the basic unit of structure, function, and organization in all living things.'},
    {q:'According to Cell Theory, all cells arise from:', c:['Spontaneous generation','Pre-existing cells only','Non-living matter directly','Random chemical reactions with no prior cell'], a:1, e:'Cell Theory states that all cells arise only from pre-existing cells — a principle historically summarized as "Omnis cellula e cellula."'},
    {q:'Which domains of life consist of prokaryotic cells?', c:['Animals and Plants','Bacteria and Archaea','Fungi and Protists','Only Animals'], a:1, e:'Only organisms in the domains Bacteria and Archaea consist of prokaryotic cells.'},
    {q:'Which groups of organisms consist of eukaryotic cells?', c:['Only Bacteria','Only Archaea','Protists, fungi, animals, and plants','None of these'], a:2, e:'Protists, fungi, animals, and plants all consist of eukaryotic cells, which have a true nucleus and membrane-bound organelles.'},
    {q:'What is the key structural difference between prokaryotic and eukaryotic cells?', c:['Prokaryotic cells have a membrane-bound nucleus, eukaryotic cells do not','Eukaryotic cells have a membrane-bound nucleus and organelles; prokaryotic cells lack these','There is no structural difference','Prokaryotic cells are always larger'], a:1, e:'Eukaryotic cells have a true, membrane-bound nucleus and membrane-bound organelles, while prokaryotic cells lack these — their DNA is in an unbound nucleoid region.'},
    {q:'Roughly how large are typical prokaryotic cells?', c:['1-5 µm','10-100 µm','100-500 µm','1-2 mm'], a:0, e:'Prokaryotic cells are generally much smaller than eukaryotic cells, typically about 1-5 micrometers (µm) in size.'},
    {q:'Roughly how large are typical eukaryotic cells?', c:['0.1-0.5 µm','1-5 µm','10-100 µm','1-2 mm'], a:2, e:'Eukaryotic cells are generally larger than prokaryotic cells, typically ranging from about 10-100 micrometers (µm).'},
    {q:'As a cell increases in size, which grows FASTER — its surface area or its volume?', c:['Surface area grows faster','Volume grows faster','Both grow at exactly the same rate always','Neither changes with size'], a:1, e:'As a cell grows larger, its volume increases faster (as a cube of the radius) than its surface area (which increases as a square), lowering the surface-to-volume ratio.'},
    {q:'Why is a HIGH surface-area-to-volume ratio advantageous for a cell?', c:['It makes the cell heavier','It allows for more efficient exchange of nutrients, gases, and wastes relative to the cell\'s needs','It has no real biological advantage','It prevents the cell from dividing'], a:1, e:'A high surface-to-volume ratio means more membrane surface is available per unit of cell volume, allowing more efficient exchange of materials with the environment.'},
    {q:'Why do organisms tend to be made of many small cells rather than a few giant cells?', c:['Small cells are easier to see under a microscope only','Small cells maintain a more favorable (higher) surface-to-volume ratio for efficient exchange','Small cells require no energy','There is no biological reason for this'], a:1, e:'Small cells maintain a more favorable surface-to-volume ratio, allowing efficient exchange of materials — this is why large organisms are built from many small cells instead of few giant ones.'},
    {q:'The plasma membrane is present in which type(s) of cells?', c:['Only eukaryotic cells','Only prokaryotic cells','Both prokaryotic and eukaryotic cells','Only plant cells'], a:2, e:'Every cell, whether prokaryotic or eukaryotic, is bounded by a plasma membrane that regulates what enters and exits the cell.'},
    {q:'The plasma membrane\'s primary functional role is best described as:', c:['Producing all of the cell\'s energy','Acting as a selective barrier allowing appropriate passage of oxygen, nutrients, and wastes','Storing all of the cell\'s genetic material','Producing new cells through fission only'], a:1, e:'The plasma membrane acts as a selective barrier, controlling the passage of oxygen, nutrients, and waste products in and out of the cell.'},
    {q:'Which scientists are historically credited with formulating Cell Theory?', c:['Darwin and Mendel','Schleiden, Schwann, and Virchow','Watson and Crick','Pasteur and Koch'], a:1, e:'Cell Theory is historically credited to Matthias Schleiden, Theodor Schwann, and Rudolf Virchow in the 19th century.'},
    {q:'A student examines an organism under the microscope and sees no membrane-bound nucleus, but does see a nucleoid region. This organism is most likely:', c:['A plant','An animal','A prokaryote (Bacteria or Archaea)','A fungus'], a:2, e:'The absence of a membrane-bound nucleus, with DNA concentrated in a nucleoid region instead, is characteristic of prokaryotic cells (Bacteria and Archaea).'},
    {q:'A student compares two cells: Cell A has a 6 µm radius, Cell B has a 60 µm radius. Which cell likely has a MORE favorable surface-to-volume ratio for efficient exchange?', c:['Cell A (the smaller cell)','Cell B (the larger cell)','They are exactly equal','Cannot be determined from cell size'], a:0, e:'Smaller cells (like Cell A) have a higher surface-to-volume ratio than larger cells, making material exchange more efficient relative to their needs.'},
    {q:'Which of these best explains why "all cells arise from pre-existing cells" was a significant scientific conclusion?', c:['It disproved the idea of spontaneous generation of life from non-living matter','It proved that cells can form from nothing','It has no real scientific significance','It only applies to plant cells'], a:0, e:'This principle was historically significant because it helped disprove the older idea of "spontaneous generation" — that living cells could arise directly from non-living matter.'},
    {q:'Which is the correct comparison of general cell size between prokaryotic and eukaryotic cells?', c:['Prokaryotic cells are generally larger than eukaryotic cells','Eukaryotic cells are generally larger than prokaryotic cells','They are always exactly the same size','Size has no relationship to cell type'], a:1, e:'Eukaryotic cells (10-100 µm) are generally larger than prokaryotic cells (1-5 µm).'},
    {q:'Membrane-bound organelles, such as a true nucleus, mitochondria, and ER, are found in:', c:['Only prokaryotic cells','Only eukaryotic cells','Both cell types equally','Neither cell type'], a:1, e:'Membrane-bound organelles, including a true nucleus, are a hallmark feature of eukaryotic cells and are generally absent in prokaryotic cells.'},
    {q:'Which best summarizes the relationship between cell size limits and biological efficiency?', c:['Cells can grow infinitely large with no consequence','Cells are limited in size partly because larger cells have a lower surface-to-volume ratio, making exchange with the environment less efficient','Cell size has no connection to efficiency','Only prokaryotic cells are affected by this limit'], a:1, e:'Cell size is constrained because as cells grow, their surface-to-volume ratio decreases, making it harder to efficiently exchange nutrients and wastes — a key reason cells remain relatively small.'}
  ], glossary:[
    {term:'Cell Theory', def:'all organisms are composed of cells; the cell is the basic unit of life; all cells arise from pre-existing cells.'},
    {term:'Prokaryotic cell', def:'found in Bacteria and Archaea; no membrane-bound nucleus (DNA in a nucleoid region); ~1-5 µm.'},
    {term:'Eukaryotic cell', def:'found in protists, fungi, animals, plants; has a true nucleus and membrane-bound organelles; ~10-100 µm.'},
    {term:'Surface-to-volume (S-to-V) ratio', def:'as cells grow, volume increases faster than surface area, lowering this ratio and making exchange less efficient — a key limit on cell size.'},
    {term:'Plasma membrane', def:'the selective barrier bounding every cell, regulating passage of oxygen, nutrients, and wastes.'}
  ]},
  {id:'bn5', title:'5. Cell Transport', content:[
    {h:'The Fluid Mosaic Model', b:[
      'Cellular membranes are "fluid mosaics" of lipids and proteins — a fluid bilayer of phospholipids embedded with a mosaic of different proteins.',
      'Phospholipids are amphipathic (having both hydrophilic and hydrophobic regions); their hydrophilic heads face the watery environment on both sides, while hydrophobic tails cluster together in the interior.',
      'Membrane proteins are mostly mobile, drifting laterally within the bilayer, though many are anchored in place by the cytoskeleton.',
      'Cholesterol (in animal cell membranes) helps regulate membrane fluidity, preventing it from becoming too fluid at high temperatures or too rigid at low temperatures.'
    ]},
    {h:'Selective Permeability', b:[
      'The plasma membrane is selectively permeable — it allows some substances to cross more easily than others.',
      'Hydrophobic/nonpolar molecules (like O2 and CO2) and small uncharged polar molecules can pass through the lipid bilayer relatively easily.',
      'Ions and larger polar molecules require specific transport proteins to cross the membrane.'
    ]},
    {h:'Passive Transport', b:[
      'Passive transport is the diffusion of a substance across a membrane with NO energy investment by the cell.',
      'Diffusion is movement of particles down their concentration gradient — from an area of higher concentration to an area of lower concentration.',
      'Facilitated diffusion uses transport proteins (channel proteins or carrier proteins) to help specific substances diffuse across the membrane, still without using cellular energy.',
      'Aquaporins are channel proteins that facilitate the rapid passage of water molecules across the membrane.'
    ]},
    {h:'Osmosis', b:[
      'Osmosis is the diffusion of water across a selectively permeable membrane, from an area of lower solute concentration to an area of higher solute concentration.',
      'Isotonic: solute concentration is equal on both sides of the membrane — no net movement of water.',
      'Hypotonic: the surrounding solution has a lower solute concentration than inside the cell — water moves INTO the cell.',
      'Hypertonic: the surrounding solution has a higher solute concentration than inside the cell — water moves OUT of the cell.',
      'Osmoregulation is the control of water balance, essential for cells to avoid bursting (lysis) or shriveling (crenation/plasmolysis).'
    ]},
    {h:'Active Transport', b:[
      'Active transport moves substances AGAINST their concentration gradient (low to high), which requires the cell to expend energy, usually in the form of ATP.',
      'The sodium-potassium pump (Na+/K+ ATPase) is a classic example: it uses one ATP to move 3 Na+ out of the cell and 2 K+ into the cell.',
      'Because unequal charge is moved (3 out, 2 in), this pump is described as electrogenic — it contributes to the membrane potential (voltage difference across the membrane).',
      'The combination of the chemical concentration gradient and the electrical gradient is called the electrochemical gradient.'
    ]},
    {h:'Bulk Transport', b:[
      'Endocytosis: the cell takes in large molecules or particles by engulfing them in a vesicle formed from the plasma membrane. Includes phagocytosis ("cell eating"), pinocytosis ("cell drinking"), and receptor-mediated endocytosis.',
      'Exocytosis: the cell secretes large molecules by fusing a vesicle with the plasma membrane, releasing its contents outside the cell.'
    ]}
  ], quiz:[
    {q:'The fluid mosaic model describes the cell membrane as a fluid structure made of a "mosaic" of:', c:['Only carbohydrates','Lipids and proteins','Only DNA','Only water molecules'], a:1, e:'The fluid mosaic model describes the membrane as a fluid bilayer of phospholipids with a mosaic of different proteins embedded within it.'},
    {q:'A phospholipid molecule is described as "amphipathic," meaning it has:', c:['Only hydrophobic regions','Only hydrophilic regions','Both hydrophilic and hydrophobic regions','No charged regions at all'], a:2, e:'Amphipathic molecules like phospholipids have both a hydrophilic (water-loving) region and a hydrophobic (water-fearing) region.'},
    {q:'In a phospholipid bilayer, which part of the phospholipid faces the watery environment?', c:['The hydrophobic tail','The hydrophilic head','Neither part','Both parts equally'], a:1, e:'The hydrophilic (water-loving) heads of phospholipids face outward toward the watery environment on both sides of the membrane, while the hydrophobic tails cluster inward.'},
    {q:'Which molecule helps regulate membrane fluidity in animal cell membranes?', c:['Glucose','Cholesterol','Starch','Cellulose'], a:1, e:'Cholesterol is embedded in animal cell membranes and helps regulate fluidity — preventing the membrane from becoming too fluid at high temperatures or too rigid/stiff at low temperatures.'},
    {q:'The plasma membrane being "selectively permeable" means:', c:['It allows all substances to pass through equally','It allows some substances to cross more easily than others','It blocks all substances completely','It only allows water to pass'], a:1, e:'Selective permeability means the membrane regulates passage, allowing some substances (like small nonpolar molecules) to cross more easily than others (like large or charged molecules).'},
    {q:'Passive transport is defined as the diffusion of a substance across a membrane:', c:['Using large amounts of ATP','With no energy investment by the cell','Only during cell division','Only in plant cells'], a:1, e:'Passive transport is called "passive" because it requires no energy investment from the cell — molecules move down their own concentration gradient.'},
    {q:'Diffusion moves particles from an area of:', c:['Lower concentration to higher concentration','Higher concentration to lower concentration','Equal concentration on both sides only','No defined direction'], a:1, e:'Diffusion is the movement of particles down their concentration gradient — from higher concentration to lower concentration — until equilibrium is reached.'},
    {q:'Facilitated diffusion differs from simple diffusion in that it:', c:['Requires ATP energy','Uses transport proteins (channels or carriers) to help specific molecules cross the membrane, still without using cellular energy','Only moves substances against their gradient','Never actually happens in real cells'], a:1, e:'Facilitated diffusion uses specific transport proteins (channel or carrier proteins) to help substances diffuse across the membrane, but like simple diffusion, it does NOT require cellular energy.'},
    {q:'Aquaporins are channel proteins that specifically facilitate the passage of:', c:['Glucose','Water molecules','Sodium ions only','Oxygen gas'], a:1, e:'Aquaporins are specialized channel proteins that dramatically speed up the passage of water molecules across the membrane.'},
    {q:'Osmosis specifically refers to the diffusion of:', c:['Proteins across a membrane','Water across a selectively permeable membrane','Oxygen only','Glucose only'], a:1, e:'Osmosis is specifically the diffusion of water across a selectively permeable membrane, moving toward the side with higher solute concentration.'},
    {q:'If a cell is placed in a hypotonic solution, water will:', c:['Move out of the cell','Move into the cell','Not move at all','Instantly evaporate'], a:1, e:'In a hypotonic solution (lower solute concentration outside than inside), water moves INTO the cell, potentially causing it to swell or burst (lysis).'},
    {q:'If a cell is placed in a hypertonic solution, water will:', c:['Move into the cell','Move out of the cell','Not move at all','Convert to solute'], a:1, e:'In a hypertonic solution (higher solute concentration outside than inside), water moves OUT of the cell, potentially causing it to shrivel (crenation in animal cells, plasmolysis in plant cells).'},
    {q:'In an isotonic solution, what happens to net water movement across the cell membrane?', c:['Water moves rapidly into the cell','Water moves rapidly out of the cell','There is no net movement of water (equal exchange in both directions)','Water freezes instantly'], a:2, e:'In an isotonic solution, the solute concentration is equal on both sides of the membrane, so there is no net movement of water — the cell remains stable in size.'},
    {q:'A red blood cell placed in pure distilled water would most likely:', c:['Shrivel due to water loss','Swell and potentially burst due to water gain (the water is strongly hypotonic)','Remain exactly the same','Immediately turn into a solid'], a:1, e:'Distilled water has essentially no solutes, making it strongly hypotonic relative to the cell\'s interior — water rushes in, causing the cell to swell and potentially lyse (burst).'},
    {q:'Active transport requires the cell to expend energy because it moves substances:', c:['Down their concentration gradient','Against their concentration gradient (low to high)','In a completely random direction','Only during sleep'], a:1, e:'Active transport moves substances against their concentration gradient (from low to high concentration), which is energetically unfavorable and requires the cell to spend energy, usually ATP.'},
    {q:'The sodium-potassium pump moves how many Na+ ions OUT and K+ ions IN per cycle, using one ATP?', c:['1 Na+ out, 1 K+ in','2 Na+ out, 3 K+ in','3 Na+ out, 2 K+ in','No ions are moved'], a:2, e:'The Na+/K+ pump uses one ATP to move 3 sodium ions (Na+) out of the cell and 2 potassium ions (K+) into the cell per cycle.'},
    {q:'Why is the sodium-potassium pump described as "electrogenic"?', c:['It has no effect on charge','It moves unequal amounts of positive charge across the membrane, generating a voltage difference','It only moves negative ions','It generates light'], a:1, e:'Because the pump moves 3 positive charges out but only 2 positive charges in per cycle, it creates a net negative charge shift, making it electrogenic — it generates voltage (membrane potential).'},
    {q:'The voltage difference across a membrane caused by unequal ion distribution is called:', c:['Osmotic pressure','Membrane potential','Facilitated diffusion','Cell fractionation'], a:1, e:'Membrane potential is the voltage difference across a membrane resulting from an unequal distribution of ions on either side.'},
    {q:'The "electrochemical gradient" combines which two forces acting on an ion?', c:['Temperature and pressure','Chemical concentration gradient and electrical (charge) gradient','Light and sound','Mass and volume'], a:1, e:'The electrochemical gradient combines both the chemical concentration gradient and the electrical/charge-based gradient acting on an ion, together determining its net movement tendency.'},
    {q:'Which process describes a cell engulfing large particles or other cells by surrounding them with the plasma membrane?', c:['Exocytosis','Osmosis','Phagocytosis (a type of endocytosis)','Facilitated diffusion'], a:2, e:'Phagocytosis ("cell eating") is a type of endocytosis where the cell engulfs large particles or other cells by wrapping the plasma membrane around them, forming a vesicle.'},
    {q:'Which process describes a cell secreting substances by fusing a vesicle with the plasma membrane and releasing its contents outside?', c:['Endocytosis','Exocytosis','Osmosis','Diffusion'], a:1, e:'Exocytosis is the process by which a cell releases substances by fusing an internal vesicle with the plasma membrane, expelling its contents to the outside.'},
    {q:'Pinocytosis is best described as:', c:['"Cell eating" of large solid particles','"Cell drinking" — taking in droplets of extracellular fluid','A type of exocytosis','A type of active transport pump'], a:1, e:'Pinocytosis, meaning "cell drinking," is a form of endocytosis where the cell takes in small droplets of extracellular fluid, rather than large solid particles.'},
    {q:'Which type of endocytosis involves specific molecules binding to receptor proteins on the membrane before being taken into the cell?', c:['Phagocytosis','Pinocytosis','Receptor-mediated endocytosis','Simple diffusion'], a:2, e:'Receptor-mediated endocytosis involves specific molecules binding to receptor proteins on the cell surface before the region of membrane folds inward to bring them into the cell.'},
    {q:'Which of the following requires ATP energy: facilitated diffusion or active transport?', c:['Facilitated diffusion','Active transport','Both require equal ATP','Neither requires ATP'], a:1, e:'Active transport requires ATP because it moves substances against their concentration gradient; facilitated diffusion, though it uses proteins, does not require ATP since it still moves substances down their gradient.'},
    {q:'A plant cell placed in a hypertonic solution would likely undergo:', c:['Lysis (bursting)','Plasmolysis (the plasma membrane pulling away from the cell wall as water leaves)','No change whatsoever','Rapid cell division'], a:1, e:'In a hypertonic solution, water leaves the plant cell, causing the plasma membrane to shrink away from the rigid cell wall — a process called plasmolysis.'},
    {q:'A cell biologist observes that glucose crosses a membrane faster with a specific transport protein present than without it, but still moves down its concentration gradient with no ATP used. This describes:', c:['Active transport','Facilitated diffusion','Osmosis','Exocytosis'], a:1, e:'This scenario describes facilitated diffusion — a transport protein speeds up movement of a substance down its concentration gradient, without requiring ATP.'}
  ], glossary:[
    {term:'Fluid Mosaic Model', def:'the cell membrane is a fluid phospholipid bilayer embedded with a mosaic of different proteins.'},
    {term:'Amphipathic', def:'having both hydrophilic and hydrophobic regions, like a phospholipid.'},
    {term:'Passive transport', def:'diffusion of a substance across a membrane with no energy investment by the cell.'},
    {term:'Facilitated diffusion', def:'diffusion assisted by transport proteins (channels/carriers), still requiring no ATP.'},
    {term:'Osmosis', def:'diffusion of water across a selectively permeable membrane toward higher solute concentration.'},
    {term:'Hypotonic / Hypertonic / Isotonic', def:'lower / higher / equal solute concentration outside the cell relative to inside, determining the direction of net water movement.'},
    {term:'Active transport', def:'movement of substances against their concentration gradient, requiring ATP (e.g. the Na+/K+ pump).'},
    {term:'Electrogenic pump', def:'a pump (like the Na+/K+ pump) that generates voltage by moving unequal charge across the membrane.'},
    {term:'Endocytosis / Exocytosis', def:'bulk transport of substances into (endocytosis: phagocytosis, pinocytosis, receptor-mediated) or out of (exocytosis) the cell via vesicles.'}
  ]},
  {id:'bn6', title:'6. The Cell Cycle', content:[
    {h:'Overview of the Cell Cycle', b:[
      'The cell cycle is the ordered sequence of events, from a cell\'s formation to its own division into two daughter cells.',
      'It consists of Interphase (the majority of the cycle, ~90%) and the Mitotic (M) Phase (mitosis + cytokinesis).'
    ]},
    {h:'Interphase: G1, S, and G2', b:[
      'G1 phase (First Gap): the cell grows and carries out normal metabolic functions.',
      'S phase (Synthesis): the cell replicates its DNA — each chromosome is duplicated, forming two identical sister chromatids joined at the centromere.',
      'G2 phase (Second Gap): the cell continues to grow and prepares the proteins/structures needed for division.'
    ]},
    {h:'Mitosis (M Phase): PMAT', b:[
      'Prophase: chromatin condenses into visible chromosomes (each with two sister chromatids); the mitotic spindle begins to form; the nucleolus disappears.',
      'Metaphase: chromosomes line up along the metaphase plate (the cell\'s equator), attached to spindle fibers from opposite poles.',
      'Anaphase: sister chromatids separate and are pulled to opposite poles of the cell by the shortening spindle fibers.',
      'Telophase: two new nuclei form at opposite ends of the cell, chromosomes decondense back into chromatin, and the nuclear envelope reforms.'
    ]},
    {h:'Cytokinesis', b:[
      'Cytokinesis is the division of the cytoplasm, typically overlapping with telophase, producing two separate daughter cells.',
      'In animal cells, a cleavage furrow pinches the cell in two.',
      'In plant cells, a cell plate forms in the middle and develops into a new cell wall separating the two daughter cells.'
    ]},
    {h:'Control of the Cell Cycle', b:[
      'The cell cycle is regulated by a cell cycle control system, involving checkpoints at G1, G2, and M that verify conditions are right before the cycle proceeds.',
      'Progression through checkpoints is regulated by cyclins and cyclin-dependent kinases (CDKs) — cyclin levels rise and fall, activating CDKs at the right times.',
      'MPF (maturation-promoting factor), a cyclin-CDK complex, triggers the cell\'s passage past the G2 checkpoint into mitosis.',
      'Cancer can result from a loss of normal cell cycle control, allowing cells to divide uncontrollably despite failed checkpoints.'
    ]}
  ], quiz:[
    {q:'The cell cycle is best defined as:', c:['A single random event','The ordered sequence of events from a cell\'s formation to its own division into two daughter cells','Only the process of DNA replication','Only the final stage of cell death'], a:1, e:'The cell cycle is the ordered sequence of events a cell goes through from its formation until it divides into two daughter cells.'},
    {q:'The cell cycle is broadly divided into which two main parts?', c:['Prophase and Telophase','Interphase and the Mitotic (M) Phase','G1 and G2 only','Cytokinesis and Anaphase'], a:1, e:'The cell cycle consists of Interphase (growth and DNA replication) and the Mitotic Phase (mitosis + cytokinesis).'},
    {q:'Approximately what percentage of the cell cycle is spent in Interphase?', c:['About 10%','About 50%','About 90%','About 100%, with no mitosis at all'], a:2, e:'Interphase makes up the majority of the cell cycle, approximately 90%, while mitosis and cytokinesis take up a much smaller fraction.'},
    {q:'During which phase of interphase does the cell primarily replicate its DNA?', c:['G1 phase','S phase','G2 phase','M phase'], a:1, e:'The S phase (Synthesis phase) is when the cell replicates its DNA, duplicating each chromosome into two sister chromatids.'},
    {q:'What does "G1" stand for in the cell cycle?', c:['Growth 1 only, unrelated to gaps','First Gap phase, before DNA synthesis','Second Gap phase','Gamete phase 1'], a:1, e:'G1 stands for "First Gap" — the phase after cell division and before DNA synthesis (S phase), during which the cell grows and carries out normal functions.'},
    {q:'What does "G2" stand for in the cell cycle?', c:['Second Gap phase, after DNA synthesis and before mitosis','First Gap phase','Gamete phase 2','Growth phase only, unrelated to DNA'], a:0, e:'G2 stands for "Second Gap" — the phase after DNA synthesis (S phase) and before mitosis, during which the cell continues growing and prepares for division.'},
    {q:'Sister chromatids are formed during which phase?', c:['G1 phase','S phase (DNA replication)','Prophase','Anaphase'], a:1, e:'Sister chromatids are formed during S phase, when each chromosome is replicated into two identical copies joined at the centromere.'},
    {q:'What structure joins two sister chromatids together?', c:['The nucleolus','The centromere','The cell plate','The spindle pole'], a:1, e:'The centromere is the region where two sister chromatids are joined together after DNA replication.'},
    {q:'Which mitotic phase is characterized by chromatin condensing into visible chromosomes and the nucleolus disappearing?', c:['Metaphase','Prophase','Anaphase','Telophase'], a:1, e:'Prophase is the first stage of mitosis, marked by chromatin condensing into visible chromosomes, the nucleolus disappearing, and the mitotic spindle beginning to form.'},
    {q:'Which mitotic phase is characterized by chromosomes lining up along the metaphase plate (the cell\'s equator)?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:1, e:'Metaphase is characterized by chromosomes aligning along the metaphase plate, attached to spindle fibers from both poles.'},
    {q:'Which mitotic phase involves sister chromatids separating and moving to opposite poles of the cell?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:2, e:'Anaphase is when sister chromatids separate and are pulled by shortening spindle fibers to opposite poles of the cell.'},
    {q:'Which mitotic phase involves two new nuclei forming and the nuclear envelope reforming?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:3, e:'Telophase is the final stage of mitosis, during which two new nuclei form at opposite ends of the cell and the nuclear envelope reforms around each set of chromosomes.'},
    {q:'Which of the following correctly lists the phases of mitosis in order (using the PMAT mnemonic)?', c:['Prophase, Metaphase, Anaphase, Telophase','Metaphase, Prophase, Telophase, Anaphase','Anaphase, Telophase, Prophase, Metaphase','Telophase, Anaphase, Metaphase, Prophase'], a:0, e:'The correct order of mitosis, remembered by the mnemonic PMAT, is: Prophase, Metaphase, Anaphase, Telophase.'},
    {q:'Cytokinesis refers to:', c:['The replication of DNA','The division of the cytoplasm, producing two separate daughter cells','The condensation of chromatin','The formation of the spindle apparatus'], a:1, e:'Cytokinesis is the division of the cytoplasm, which typically overlaps with the end of mitosis (telophase), resulting in two distinct daughter cells.'},
    {q:'In ANIMAL cells, cytokinesis occurs through the formation of a:', c:['Cell plate','Cleavage furrow','Cell wall directly','Spindle fiber only'], a:1, e:'In animal cells, a cleavage furrow forms and pinches the cell into two separate daughter cells during cytokinesis.'},
    {q:'In PLANT cells, cytokinesis occurs through the formation of a:', c:['Cleavage furrow','Cell plate, which develops into a new cell wall','Nucleolus','Centromere'], a:1, e:'In plant cells, a cell plate forms in the middle of the dividing cell and develops into a new cell wall, separating the two daughter cells.'},
    {q:'Why can\'t plant cells use a cleavage furrow like animal cells do?', c:['Plant cells have a rigid cell wall that prevents pinching inward, so a cell plate forms instead','Plant cells never divide','Plant cells have no cytoplasm','There is no real reason; it is arbitrary'], a:0, e:'Because plant cells have a rigid cell wall, they cannot pinch inward like animal cells; instead, a cell plate forms and develops into a new dividing wall.'},
    {q:'What is the role of "checkpoints" in the cell cycle control system?', c:['They have no functional role','They verify that conditions are appropriate before allowing the cycle to proceed to the next stage','They only occur during interphase','They stop the cycle permanently once triggered'], a:1, e:'Checkpoints (at G1, G2, and M) act as quality-control points, verifying that conditions (like DNA integrity) are appropriate before the cell cycle is allowed to proceed.'},
    {q:'Which molecules work together with CDKs to regulate progression through the cell cycle?', c:['Cyclins','Only DNA polymerase','Only ATP synthase','Only ribosomes'], a:0, e:'Cyclins are regulatory proteins whose levels rise and fall throughout the cycle, binding to and activating cyclin-dependent kinases (CDKs) at the appropriate times.'},
    {q:'What does "CDK" stand for?', c:['Cell Division Kinetics','Cyclin-Dependent Kinase','Chromosomal DNA Karyotype','Cytoplasmic Division Key'], a:1, e:'CDK stands for Cyclin-Dependent Kinase — an enzyme that becomes active only when bound to its specific cyclin partner, driving the cell cycle forward.'},
    {q:'MPF (maturation-promoting factor) is best described as:', c:['A type of vitamin','A cyclin-CDK complex that triggers the cell\'s passage into mitosis','A structural protein in the cell wall','An enzyme that breaks down glucose'], a:1, e:'MPF is a specific cyclin-CDK complex that accumulates and triggers the cell\'s passage past the G2 checkpoint into mitosis.'},
    {q:'What can result from a loss of normal cell cycle control (failed checkpoints)?', c:['Immediate cell death only','Cancer — uncontrolled cell division','Permanent cell dormancy only','No significant consequence'], a:1, e:'A loss of normal cell cycle control, such as failed checkpoints, can allow cells to divide uncontrollably, which is a hallmark of cancer.'},
    {q:'A cell is observed with chromosomes lined up neatly at the cell\'s equator, each attached to spindle fibers from both poles. Which phase is this?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:1, e:'Chromosomes lining up at the equator (metaphase plate) is the defining feature of metaphase.'},
    {q:'A cell is observed with two clearly separating sets of chromosomes moving toward opposite ends of the cell. Which phase is this?', c:['Prophase','Metaphase','Anaphase','Telophase'], a:2, e:'Sister chromatids actively separating and moving toward opposite poles is the defining feature of anaphase.'},
    {q:'Which of the following would most directly halt the cell cycle if DNA damage were detected?', c:['A cyclin-CDK checkpoint mechanism','Cytokinesis','The plasma membrane','Osmosis'], a:0, e:'Checkpoints, regulated by cyclin-CDK activity, are the mechanism that can halt the cell cycle if problems like DNA damage are detected, preventing faulty division.'}
  ], glossary:[
    {term:'Interphase', def:'the majority of the cell cycle (~90%), consisting of G1 (growth), S (DNA synthesis), and G2 (growth/preparation) phases.'},
    {term:'Mitosis (PMAT)', def:'Prophase, Metaphase, Anaphase, Telophase — the division of the nucleus into two genetically identical nuclei.'},
    {term:'Cytokinesis', def:'division of the cytoplasm; cleavage furrow in animal cells, cell plate in plant cells.'},
    {term:'Sister chromatids', def:'two identical copies of a replicated chromosome, joined at the centromere.'},
    {term:'Cell cycle checkpoints', def:'G1, G2, and M checkpoints that verify conditions are right before the cycle proceeds.'},
    {term:'Cyclins and CDKs', def:'regulatory proteins (cyclins) that bind and activate cyclin-dependent kinases (CDKs) to drive cell cycle progression.'},
    {term:'MPF', def:'maturation-promoting factor — a cyclin-CDK complex that triggers passage into mitosis.'}
  ]}
]},

{id:'funfaith', name:'FunFaith: Religion', lessons:[
  {id:'ff1', title:'1. The Divine Revelation', content:[
    {h:'Key Concepts', b:[
      'Revelare = to lift the veil, to disclose, to uncover.',
      'God\'s self-disclosure is an act of friendship whose ultimate purpose is our salvation.',
      'Images of God are products of Anthropomorphism — signs pointing to a greater reality, never the perfect image.'
    ]},
    {h:'4 Types of Revelation', b:[
      'Natural: knowing God through creation/the world.',
      'Special: supernatural revelation, equated with the Bible.',
      'Private: apparitions, mystical experiences; examined by the Magisterium; imposes no obligation of faith.',
      'Public: revelation through Jesus Christ; final, complete, binds all — imposes obligation of faith.'
    ]}
  ], quiz:[
    {q:'What does "Revelare" mean in Latin?', c:['To hide','To lift the veil, disclose, uncover','To worship','To condemn'], a:1},
    {q:'Which type of revelation is equated with the Bible by St. Thomas?', c:['Natural','Special','Private','Public'], a:1},
    {q:'Which type of revelation imposes NO obligation of faith?', c:['Public','Natural','Private','Special'], a:2},
    {q:'The final and complete revelation of God is found in:', c:['Apparitions','Nature','Jesus Christ (Public Revelation)','Mystical experiences'], a:2},
    {q:'Attributing human qualities to God is called:', c:['Anthropomorphism','Anthropology','Theomorphism','Iconography'], a:0},
    {q:'Which type of revelation refers to knowing God through creation/the world?', c:['Special','Natural','Private','Public'], a:1},
    {q:'The ultimate purpose of God\'s self-disclosure to humanity is:', c:['Punishment','Salvation','Entertainment','Wealth'], a:1},
    {q:'God\'s self-disclosure is described as an act of:', c:['Friendship','Judgment','Indifference','Coercion'], a:0},
    {q:'Which type of revelation binds ALL believers with an obligation of faith?', c:['Private','Natural','Public','Special'], a:2},
    {q:'Images of God, according to the notes, point to a greater reality but are never:', c:['Useful','A perfect image of God','Symbolic','Meaningful'], a:1},
    {q:'Which type of revelation examined by the Magisterium includes apparitions and mystical experiences?', c:['Public','Private','Special','Natural'], a:1},
    {q:'St. Thomas equates "Special" revelation with:', c:['Nature','The Bible','Apparitions','Church buildings'], a:1},
    {q:'The final and complete revelation of God to humanity was made known through:', c:['Moses','Jesus Christ','The Prophets','Angels'], a:1},
    {q:'The word "Revelare" is derived from which language?', c:['Greek','Latin','Hebrew','Aramaic'], a:1, e:'"Revelare" is a Latin word meaning "to lift the veil, to disclose, to uncover" — the root of the English word "revelation."'},
    {q:'The hierarchy of beings mentioned in the notes places humans in which position relative to God and angels?', c:['God — Us — Angels','Angels — God — Us','God — Angels — Us','Us — God — Angels'], a:2, e:'The notes describe the hierarchy of beings as God, then Angels, then Us (humans) — reflecting a traditional understanding of spiritual order.'},
    {q:'What does CCC 143 emphasize about humanity\'s response to God\'s revelation?', c:['That humans have no free will in the matter','That man gives his assent (agreement) to God the revealer with his whole being','That revelation is forced upon humanity','That only priests can respond to revelation'], a:1, e:'CCC 143 teaches that with his whole being, man gives his assent to God the revealer — highlighting the freely chosen, relational nature of faith.'},
    {q:'The Sistine Chapel\'s "Creation of Adam" painting, referenced in the notes, symbolizes:', c:['The finality of human rejection of God','Humanity\'s choice to accept or reject the friendship offered by God (fingers not touching)','A historical battle','An unrelated artistic theme'], a:1, e:'The famous depiction shows the fingers of God and Adam not quite touching, symbolizing that it is up to humanity to accept the friendship being offered by God.'},
    {q:'Which "gift" do humans uniquely have, according to the notes, that other creatures lack?', c:['Gift of Flight','Gift of Intellect','Gift of Invisibility','Gift of Immortality'], a:1, e:'The notes describe the "Gift of Intellect" as something special that humans possess, enabling them to know and respond to God.'},
    {q:'According to St. Thomas Aquinas, what is the "human limitation" regarding knowledge?', c:['Humans can know everything without any senses','There is nothing in the mind that is not first in the senses','Humans have unlimited knowledge','Humans cannot know anything at all'], a:1, e:'St. Thomas Aquinas taught that there is nothing in the mind that is not first perceived through the senses — all human understanding is rooted in sensory experience.'},
    {q:'Which Bible verse is cited in the notes stating "No one has ever seen God"?', c:['John 3:16','1 John 4:12','Genesis 1:1','Psalm 23:1'], a:1, e:'1 John 4:12 states "No one has ever seen God," which the notes use to explain why God is described as a spirit and a mystery beyond direct sensory perception.'},
    {q:'Why can\'t God be perceived directly by the human senses, according to the notes?', c:['Because God does not exist','Because God is a spirit, and a mystery cannot be perceived by the senses','Because God chooses to hide from everyone','Because humans lack the gift of intellect'], a:1, e:'The notes explain that God is a spirit and a mystery — a spirit cannot be perceived by the senses, and a mystery transcends all human experience.'},
    {q:'Why is human language about God described as "analogical and symbolic"?', c:['Because language is a product of human experience, and humans must describe God using terms their senses can perceive','Because God has no real qualities','Because analogies are always false','Because symbols have no meaning'], a:0, e:'Since language is rooted in human experience and sensory perception, describing God requires analogy and symbolism — we borrow familiar concepts to point toward the transcendent reality of God.'},
    {q:'What does "Anthropos" mean in the term Anthropomorphism?', c:['Form','Man','God','Animal'], a:1, e:'"Anthropos" is the Greek root meaning "man," while "Morphe" means "form" — together forming "Anthropomorphism," the attribution of human qualities to non-human beings.'},
    {q:'What does "Morphe" mean in the term Anthropomorphism?', c:['Man','Form','Spirit','Mystery'], a:1, e:'"Morphe" is the Greek root meaning "form," combined with "Anthropos" (man) to form "Anthropomorphism" — attributing human form/qualities to non-human beings, including God.'},
    {q:'According to the notes, is there such a thing as a "perfect image" of God?', c:['Yes, several exist','No — images are signs pointing to a greater reality, not the reality itself','Only religious paintings qualify','Only descriptions in the Bible qualify'], a:1, e:'The notes state clearly: "No such thing as a perfect image" — images of God are signs that point toward a greater reality, but they are never God Himself.'},
    {q:'What example is used in the notes to show the "strengths and limitations" of images of God?', c:['The image of a soldier','The image of a farmer','The image of a king only','The image of an angel'], a:1, e:'The notes use the image of a "farmer" (maalaga, mapagmahal) to show both strengths (caring, loving qualities) and limitations (mortality, potential greed) of human images applied to God.'},
    {q:'The example of the Feast of the Black Nazarene in the notes illustrates that images can be:', c:['Perfectly accurate representations of God','Misleading if people form overly literal, physical devotion around them','Completely useless and should be banned','The only valid way to understand God'], a:1, e:'The notes describe how devotion to the image during the Feast of the Black Nazarene can become misleading if it turns into an overly literal or physically dangerous form of devotion (people trampling each other to touch the image).'},
    {q:'The example of the "Mama Mary crying blood tears" in the notes illustrates that images can be:', c:['Always completely trustworthy','Manipulated and distorted, requiring careful discernment','Proof that all apparitions are real','Irrelevant to Catholic teaching'], a:1, e:'The notes describe how the "crying blood tears" incident was tested and found to be human blood, showing that images/claims can be manipulated or distorted, requiring careful discernment.'},
    {q:'Despite the limitations of images, what does the Church still teach about their usefulness?', c:['Images should be completely abolished','We can do away with images, but they are "all we\'ve got" as imperfect but useful tools','Only Church-approved images may ever be viewed','Images have no spiritual value whatsoever'], a:1, e:'Even with their limitations, the notes conclude that "we can do away with images. They\'re all we\'ve got" — meaning they remain useful, though imperfect, tools for understanding God.'},
    {q:'God\'s revelation to humanity is described as unfolding:', c:['All at once, with no development over time','Gradually through time until the fullness of revelation in Christ','Only through natural disasters','Only through dreams'], a:1, e:'The notes describe God\'s loving communication as gradually unfolding through time until the fullness of His revelation is made known in Christ.'},
    {q:'Which Bible passage/document number states "we can know God by taking his creature\'s perfection as our starting point"?', c:['CCC 41','CCC 143','1 John 4:12','John 3:16'], a:0, e:'CCC 41 states that we can know God by taking his creature\'s perfection as our starting point — this is the basis for Natural Revelation.'},
    {q:'What is the "challenge" associated with Natural Revelation, according to the notes?', c:['To ignore creation entirely','To be stewards of God\'s creation, giving praise and glory to God for His generosity and constant care','To reject all knowledge of the natural world','To worship nature instead of God'], a:1, e:'Natural Revelation invites believers to be stewards of God\'s creation — caring for the world while giving praise and glory to God for His generosity.'},
    {q:'Special Revelation is described in the notes as requiring what for humanity to know it?', c:['Human reasoning alone','God\'s supernatural intervention through His chosen messengers','Scientific discovery','Philosophical debate'], a:1, e:'Special Revelation would be unknown to us without God\'s supernatural intervention through His chosen messengers, according to the notes.'},
    {q:'What habit does Special Revelation invite believers to develop?', c:['A habit of ignoring the Bible','A habit of reading the Bible and learning the history of salvation','A habit of avoiding religious history','A habit of relying only on apparitions'], a:1, e:'Special Revelation invites believers to develop a habit of reading the Bible and learning the history of our salvation.'},
    {q:'Which example of Private Revelation is specifically mentioned as occurring to "tatlong bata" (three children)?', c:['Our Lady of Lourdes','Our Lady of Fatima','Our Lady of Guadalupe','Our Lady of Mediatrix'], a:1, e:'The notes mention Our Lady of Fatima appearing to three children (tatlong bata) as an example of Private Revelation.'},
    {q:'Which saint experienced an apparition that later became known as Our Lady of Lourdes?', c:['St. Bernadette of Subirous','St. Thomas Aquinas','St. Jerome','St. Augustine'], a:0, e:'The notes mention that the Virgin Mary appeared again to St. Bernadette of Subirous, which became known as Our Lady of Lourdes.'},
    {q:'What phenomenon is Padre Pio associated with, as mentioned under Private Revelation?', c:['Speaking in tongues','Stigmata (experiencing the wounds of Christ)','Levitation only','Prophecy of the end times'], a:1, e:'Padre Pio is associated with stigmata — physically experiencing the wounds of Jesus, an example of a Church-recognized mystical phenomenon under Private Revelation.'},
    {q:'What is the "magisterium" responsible for regarding claims of Private Revelation?', c:['Ignoring all such claims automatically','Examining claims based on public revelation to authentically discern what leads to Christ\'s true calling','Automatically approving every claim','Banning all discussion of apparitions'], a:1, e:'The Magisterium (teaching authority of the Church exercised by the Pope) examines Private Revelation claims based on public revelation (CCC 67), to discern what authentically leads to the true calling of Christ.'},
    {q:'What controversial claim from Lipa, Batangas is mentioned in the notes regarding Private Revelation?', c:['A claim of the Virgin Mary appearing and rose petals forming the face of Jesus, later found not approved by the Magisterium','An officially approved miracle','A historical fact with no controversy','An event unrelated to Marian apparitions'], a:0, e:'The notes mention a nun in Lipa, Batangas claiming an apparition where petals formed the face of Jesus — a claim examined and not approved (di daw totoo) by the Magisterium, despite ongoing devotion by some.'},
    {q:'Which type of revelation "imposes no obligation of faith" upon believers?', c:['Public Revelation','Private Revelation','Natural Revelation only','Special Revelation only'], a:1, e:'Private Revelation, such as apparitions and mystical experiences, does not impose an obligation of faith — believers are invited to be discerning rather than required to believe.'},
    {q:'What does Private Revelation invite believers to be, according to the notes?', c:['Blindly accepting of all claims','Discerning and focused on the authentic expression of faith','Completely dismissive of all apparitions','Fearful of all religious experiences'], a:1, e:'Private Revelation invites believers to be discerning and focused on the authentic expression of their faith, rather than uncritically accepting every claim.'},
    {q:'Public Revelation is described as being final and complete in the person of:', c:['Moses','Jesus Christ','A specific Pope','An angel'], a:1, e:'Public Revelation is final and complete in the person of Jesus Christ — the fullness of God\'s self-revelation to humanity.'},
    {q:'Which Church document (referenced by "DV6") states that God chose to show forth and communicate Himself through Jesus Christ?', c:['Dei Verbum','Lumen Gentium','Gaudium et Spes','Nostra Aetate'], a:0, e:'"DV6" refers to Dei Verbum, section 6, which states that in Jesus Christ, God chose to show forth and communicate Himself and His eternal decisions regarding salvation.'},
    {q:'Public Revelation invites believers to be:', c:['Self-centered','Christ-centered','Indifferent to Jesus','Focused only on angels'], a:1, e:'Public Revelation, being complete in Jesus Christ, invites believers to be Christ-centered in their faith and life.'},
    {q:'According to the notes, what are the three challenges God\'s revelation invites us toward?', c:['Wealth, power, and fame','Know Him more clearly, love Him more deeply, worship sincerely','Ignore faith, reject tradition, avoid the Church','Only prayer, with no other action needed'], a:1, e:'The notes list three challenges: to know God more clearly (reading the Bible), love Him more deeply (charity/love in action), and worship sincerely (responding to His revelation).'},
    {q:'Which type of revelation is associated with the challenge of "reading the Bible"?', c:['Natural Revelation','Special Revelation','Private Revelation','None of these'], a:1, e:'Special Revelation, equated with the Bible, invites believers to develop the habit of reading Scripture and learning salvation history.'},
    {q:'Which type of revelation is associated with the challenge of being "stewards of creation"?', c:['Natural Revelation','Special Revelation','Private Revelation','Public Revelation'], a:0, e:'Natural Revelation — knowing God through creation — comes with the challenge of being good stewards of that creation, honoring God\'s generosity.'},
    {q:'A person witnesses what they believe to be a miraculous apparition. According to Catholic teaching on revelation, this experience would be classified under:', c:['Public Revelation, binding on all Catholics','Private Revelation, examined by the Magisterium, not binding on all','Natural Revelation','Special Revelation'], a:1, e:'Personal apparitions/mystical experiences fall under Private Revelation, which the Magisterium examines but which does not impose an obligation of faith on all believers.'},
    {q:'Which of the four types of revelation is described as being reflected in "the ultimate purpose of God\'s free act of self-disclosing" — namely, salvation?', c:['This purpose applies across ALL types of revelation, since all reveal God for the sake of our salvation','Only Natural Revelation','Only Private Revelation','Only Special Revelation'], a:0, e:'The overarching purpose of God\'s self-disclosure — our salvation — applies across all forms of revelation, whether natural, special, private, or public, since all ultimately point toward God\'s saving relationship with humanity.'},
    {q:'A theology student explains that God\'s revelation is "God reaching out to us in friendship, so we get to know and love Him." Which key concept does this reflect?', c:['The purpose of divine revelation','The definition of anthropomorphism','The role of the Magisterium','The definition of Special Revelation only'], a:0, e:'This directly reflects the notes\' description of the purpose of divine revelation — an act of friendship from God, inviting humanity to know and love Him, ultimately for our salvation.'},
    {q:'A person insists that a specific painting IS God, not just a representation pointing to God. According to the notes, this view would be considered:', c:['Theologically correct','A misunderstanding — images are signs, not the reality of God Himself','The official teaching of the Magisterium','Irrelevant to the discussion of revelation'], a:1, e:'The notes are clear that "images are signs" pointing toward a greater reality; they are never God Himself, so treating an image as literally being God would be a misunderstanding.'},
    {q:'Which revelation type would knowledge gained purely through scientific observation of nature\'s order and beauty fall under?', c:['Natural Revelation','Special Revelation','Private Revelation','Public Revelation'], a:0, e:'Observing and appreciating the order, beauty, and perfection of creation reflects Natural Revelation — knowing God through the world He made.'},
    {q:'The notes describe the ear as "the way to the heart" — which best reflects this idea in the context of revelation?', c:['Physical hearing has no spiritual significance','Listening/being receptive is central to responding to God\'s revelation and call','Only physical senses matter, with no spiritual dimension','This phrase is unrelated to faith'], a:1, e:'The phrase "the ear is the way to the heart" emphasizes that being receptive and listening is central to how humans respond to and internalize God\'s call and revelation.'},
    {q:'Which of the following is the correct order of "closeness to binding obligation," from LEAST binding to MOST binding?', c:['Private → Natural → Special → Public','Public → Special → Natural → Private','Natural/Special (informative) → Private (no obligation) → Public (full obligation)','All four types have equal obligation'], a:2, e:'While Natural and Special Revelation inform belief, Private Revelation explicitly imposes no obligation of faith, while Public Revelation (through Christ) is final, complete, and binding on all believers.'},
    {q:'A key reason the Church distinguishes between "Public" and "Private" revelation is to:', c:['Confuse believers','Clarify what beliefs are essential/binding (Public) versus optional/discerned (Private)','Eliminate the need for faith entirely','Reject all forms of revelation except Public'], a:1, e:'This distinction helps clarify which beliefs are essential and binding for all Catholics (Public Revelation through Christ) versus which are optional and require personal discernment (Private Revelation like apparitions).'},
    {q:'What best explains why "no such thing as a perfect image" matters for religious art and devotion?', c:['It means religious art should never be created','It reminds believers that any image, however beautiful or venerated, is only a sign pointing to God, not God Himself','It means all images are equally worthless','It only applies to non-Christian religions'], a:1, e:'This teaching reminds believers to maintain proper perspective — treating sacred images with respect and devotion while remembering they are signs, not literal replacements for the divine reality they represent.'},
    {q:'Which of the following BEST summarizes the "4 Types of Revelation" as a whole?', c:['Natural (creation), Special (Bible), Private (apparitions, non-binding), Public (Christ, binding)','All four types are identical in authority','Only two types actually exist','Public Revelation is the least important type'], a:0, e:'The four types are: Natural (through creation), Special (equated with the Bible), Private (apparitions/mystical experiences, non-binding), and Public (through Jesus Christ, binding on all believers).'},
    {q:'A believer prays before a beautiful sunset, feeling closer to God through the beauty of nature. This experience relates most to:', c:['Natural Revelation','Special Revelation','Private Revelation','Public Revelation'], a:0, e:'Experiencing a sense of God through the beauty and order of creation reflects Natural Revelation — knowing God through the world.'},
