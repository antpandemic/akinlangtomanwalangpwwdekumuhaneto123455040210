  {id:'ec5', title:'6. Communication Strategies', content:[
    {h:'Language as a Communication Barrier', b:[
      'Language can help (faster mutual understanding) or hinder (if interlocutors aren\'t skilled with it) communication.',
      'Communication strategies are techniques that a speaker resorts to in order to address difficulties in expressing himself/herself in a particular language.',
      'There are a total of twelve communication strategies.'
    ]},
    {h:'The 12 Communication Strategies', b:[
      'Message Abandonment: the speaker decides to just finish/stop the conversation in order to prevent himself/herself from saying something he/she would otherwise regret — "less talk, less mistake."',
      'Topic Avoidance: since message abandonment might feel too rude/obvious, the speaker instead considers changing the topic or talking about something else, hoping to redirect the other person\'s attention.',
      'Use of All-Purpose Words: the speaker is at a loss for the right words, so instead of being specific, they use general expressions like "etcetera," "and so on and so forth," hoping the listener gets what they mean.',
      'Word Coinage: the speaker decides to invent a word just to make sense, usually when they don\'t know the right word or aren\'t familiar with the term for a particular idea (e.g. "shrinkinator" for a shrinking gun).',
      'Literal Translation: happens when the speaker uses words in the original/native language while expressing themselves in the target language — necessary especially when they can\'t find the exact equivalent term (e.g. "Bumagsak ako sa math!" → "I fell in math!").',
      'Foreignizing: refers to when the speaker tries to pronounce native-language words as if they are actual words in the target language (e.g. pronouncing "tusok-tusok" in an English style).',
      'Code Switching: combining two languages WITHIN sentences — mixing the languages together in the same sentence.',
      'Code Shifting: also combines two languages, but with a smoother, more conscious transition — the speaker changes the language used from ONE SENTENCE TO ANOTHER, with no mixing of languages within the same sentence.',
      'Use of (Gap) Fillers: happens when the speaker excessively uses intensifiers, qualifiers, or exuberant expressions like "totally," "actually," "definitely." To check if a word is a gap filler, try removing it from the sentence — if the meaning doesn\'t change, the word is a gap filler.',
      'Circumlocution: instead of using the exact word for a single idea, the speaker uses more vivid descriptions, hoping to compensate for the word they could not use (e.g. asking "where\'s its mother?" instead of saying "chicken").',
      'Approximation: occurs when the speaker tries to look for a closely related word in order to refer to something (a synonym for the exact term).',
      'Use of Non-Verbal Cues: executing different non-verbal forms of communication or actions in place of words.',
      'Appeal for Help: as a LAST RESORT, the speaker simply asks for the assistance of another person in order to communicate their ideas.'
    ]}
  ], quiz:[
    {q:'Communication strategies are best defined as:', c:['Rules of grammar that must never be broken','Techniques a speaker resorts to in order to address difficulties expressing himself/herself in a language','A test used to measure vocabulary size','A type of non-verbal communication only'], a:1, e:'Communication strategies are techniques speakers use to cope with difficulties expressing themselves in a particular language.'},
    {q:'How many communication strategies are discussed in the notes?', c:['Ten','Eleven','Twelve','Fifteen'], a:2, e:'There are a total of twelve communication strategies discussed.'},
    {q:'When a speaker simply stops talking, saying "nevermind" because they struggle to express themselves, this is:', c:['Topic Avoidance','Message Abandonment','Circumlocution','Word Coinage'], a:1, e:'Message Abandonment happens when a speaker stops mid-expression due to difficulty communicating — "less talk, less mistake."'},
    {q:'Changing the topic when your mom asks about your grades is an example of:', c:['Message Abandonment','Topic Avoidance','Foreignizing','Approximation'], a:1, e:'Topic Avoidance is diverting the conversation away from an uncomfortable subject, since abandoning it outright might feel too rude.'},
    {q:'Using vague expressions like "etcetera" or "and so on and so forth" instead of being specific is an example of:', c:['Use of All-Purpose Words','Word Coinage','Circumlocution','Approximation'], a:0, e:'Use of All-Purpose Words involves general expressions used when the speaker is at a loss for the exact words.'},
    {q:'Inventing the word "shrinkinator" for a gun that shrinks objects is an example of:', c:['Word Coinage','Literal Translation','Circumlocution','Code Switching'], a:0, e:'Word Coinage involves inventing a new term, usually when the speaker doesn\'t know or isn\'t familiar with the right word.'},
    {q:'Translating "Bumagsak ako sa math!" directly as "I fell in math!" — losing the intended meaning — is an example of:', c:['Foreignizing','Literal Translation','Approximation','Code Switching'], a:1, e:'Literal Translation is word-for-word translation that compromises the essence/meaning of the original expression.'},
    {q:'Pronouncing the Filipino phrase "tusok-tusok" as if it were an English word/phrase is an example of:', c:['Foreignizing','Code Switching','Word Coinage','Circumlocution'], a:0, e:'Foreignizing is pronouncing a native word as if it belongs to the target language.'},
    {q:'Combining Filipino and English WITHIN one sentence, like "conyo" speech, is an example of:', c:['Literal Translation','Code Switching','Foreignizing','Message Abandonment'], a:1, e:'Code Switching involves combining words from two languages within a single sentence.'},
    {q:'A speaker who says one full sentence entirely in English, then the next full sentence entirely in Filipino, with no mixing within a sentence, is demonstrating:', c:['Code Switching','Code Shifting','Foreignizing','Literal Translation'], a:1, e:'Code Shifting is a smoother, more conscious transition where the language changes from one sentence to another, without mixing languages within the same sentence.'},
    {q:'What is the KEY difference between Code Switching and Code Shifting?', c:['Code Switching mixes languages within a sentence, while Code Shifting changes language from one sentence to the next','Code Switching only happens in writing, Code Shifting only in speech','Code Shifting is a made-up strategy that doesn\'t really exist','There is no difference — they are the same strategy'], a:0, e:'Code Switching mixes two languages within the same sentence; Code Shifting transitions between languages from one whole sentence to another.'},
    {q:'Using the word "actually" as filler in a sentence where removing it wouldn\'t change the meaning is an example of:', c:['Use of Gap Fillers','Circumlocution','Approximation','Word Coinage'], a:0, e:'Gap Fillers are unnecessary intensifiers/qualifiers used to stall or avoid dead air, and removing them doesn\'t change the sentence\'s meaning.'},
    {q:'How can you test whether a word in a sentence is a "gap filler"?', c:['Check if it is longer than 3 syllables','Remove it from the sentence — if the meaning doesn\'t change, it\'s a gap filler','Check if it starts with a vowel','See if it rhymes with another word in the sentence'], a:1, e:'If removing a suspected word from the statement doesn\'t change its meaning, the word is considered a gap filler.'},
    {q:'Asking "where\'s its mother?" instead of saying the word "chicken" is an example of:', c:['Word Coinage','Circumlocution','Foreignizing','Approximation'], a:1, e:'Circumlocution is describing an idea vividly instead of directly naming it, often because the speaker doesn\'t know or can\'t recall the exact term.'},
    {q:'Using a synonym or closely related word to refer to something you\'ve forgotten the exact term for is:', c:['Approximation','Word Coinage','Circumlocution','Message Abandonment'], a:0, e:'Approximation involves using a closely related word/synonym in place of the exact term.'},
    {q:'What is the main difference between Circumlocution and Approximation?', c:['Circumlocution uses vivid descriptions to compensate for a missing word, while Approximation uses a single closely related word/synonym','They are exactly the same strategy','Approximation only works with numbers','Circumlocution can only be used in writing'], a:0, e:'Circumlocution compensates with a more elaborate, vivid description, while Approximation simply substitutes a related word.'},
    {q:'Making hand gestures instead of saying a word you can\'t recall is an example of:', c:['Use of Non-Verbal Cues','Appeal for Help','Word Coinage','Gap Fillers'], a:0, e:'Use of Non-Verbal Cues means executing non-verbal forms of communication or actions in place of words.'},
    {q:'Which communication strategy should be considered a LAST RESORT, according to the notes?', c:['Use of Non-Verbal Cues','Appeal for Help','Approximation','Gap Fillers'], a:1, e:'Appeal for Help — asking someone else to relay your message — is explicitly noted as something that should be a last resort.'},
    {q:'Why might a speaker choose Topic Avoidance instead of Message Abandonment?', c:['Because Message Abandonment is grammatically incorrect','Because Message Abandonment might feel too rude or obvious','Because Topic Avoidance is faster to do','Because Topic Avoidance requires knowing two languages'], a:1, e:'The notes explain that some speakers find outright abandoning the message too rude/obvious, so they opt to change the topic instead.'},
    {q:'A student who doesn\'t know the English word for "kuya" and simply says "older brother-ish guy" is most likely using:', c:['Word Coinage','Circumlocution','Foreignizing','Code Switching'], a:1, e:'Describing the concept vividly instead of using the exact term is Circumlocution.'},
    {q:'A speaker who can\'t recall the word "sofa" and just says "couch" instead is demonstrating:', c:['Approximation','Circumlocution','Word Coinage','Literal Translation'], a:0, e:'Using a closely related/synonymous word is Approximation.'},
    {q:'A speaker unfamiliar with the exact English term for a local dish decides to just invent a new English-sounding name for it. This is:', c:['Word Coinage','Foreignizing','Literal Translation','Approximation'], a:0, e:'Inventing a brand-new term when the exact word is unknown is Word Coinage.'},
    {q:'A Filipino speaker says the word "salamat" but pronounces it with an exaggerated American accent as if it were an English word. This demonstrates:', c:['Code Switching','Foreignizing','Code Shifting','Literal Translation'], a:1, e:'Foreignizing is pronouncing a native word as if it were part of the target language.'},
    {q:'When all other strategies fail, a speaker hands their phone to a friend and asks them to text the message instead. This demonstrates:', c:['Approximation','Appeal for Help','Topic Avoidance','Use of Non-Verbal Cues'], a:1, e:'Asking someone else to relay the message is Appeal for Help, which should only be used as a last resort.'},
    {q:'Which pair of strategies BOTH involve combining two languages, but differ in whether the mixing happens within or between sentences?', c:['Code Switching and Code Shifting','Foreignizing and Literal Translation','Circumlocution and Approximation','Word Coinage and Gap Fillers'], a:0, e:'Code Switching mixes languages within a sentence, while Code Shifting changes languages between whole sentences.'},
    {q:'A speaker overusing words like "totally," "actually," and "definitely" throughout a conversation, without them adding real meaning, is demonstrating:', c:['Use of All-Purpose Words','Use of (Gap) Fillers','Circumlocution','Word Coinage'], a:1, e:'Excessive use of intensifiers/qualifiers like "totally," "actually," and "definitely" is the Use of (Gap) Fillers strategy.'},
    {type:'dual', s1:'Message Abandonment means the speaker stops talking mid-thought.', s2:'Topic Avoidance means the speaker changes the subject instead of stopping outright.', a:0, e:'Both statements are true — these are the correct definitions of Message Abandonment and Topic Avoidance.'},
    {type:'dual', s1:'Code Switching mixes two languages within one sentence.', s2:'Code Shifting also mixes two languages within one sentence.', a:2, e:'Statement 1 is true, but Statement 2 is false — Code Shifting changes language BETWEEN whole sentences, without mixing within one.'},
    {type:'dual', s1:'Circumlocution means describing an idea vividly instead of naming it directly.', s2:'Approximation means using a completely made-up word instead of the real one.', a:2, e:'Statement 1 is true, but Statement 2 is false — Approximation uses a closely related REAL word/synonym, not a made-up one (that\'s Word Coinage).'},
    {type:'dual', s1:'Appeal for Help should be used as a first resort when communicating.', s2:'There are twelve total communication strategies discussed.', a:3, e:'Statement 2 is true, but Statement 1 is false — Appeal for Help should be a LAST resort, not a first one.'},
    {type:'dual', s1:'Foreignizing is pronouncing a native word as if it were part of the target language.', s2:'Literal Translation is translating word-for-word in a way that can lose the intended meaning.', a:0, e:'Both statements are true — these are accurate descriptions of Foreignizing and Literal Translation.'}
  ], glossary:[
    {term:'Communication Strategies', def:'techniques a speaker resorts to in order to address difficulties expressing himself/herself in a particular language.'},
    {term:'Message Abandonment', def:'stopping mid-expression due to difficulty communicating.'},
    {term:'Topic Avoidance', def:'changing the topic instead of discussing the issue at hand.'},
    {term:'Word Coinage', def:'inventing a new term based on word-formation rules.'},
    {term:'Code Switching', def:'combining two languages WITHIN the same sentence.'},
    {term:'Code Shifting', def:'changing from one language to another BETWEEN sentences, without mixing within a sentence.'},
    {term:'Circumlocution', def:'describing an idea vividly instead of naming it directly.'},
    {term:'Approximation', def:'using a closely related word/synonym to refer to something.'},
    {term:'Appeal for Help', def:'asking someone else to relay your message — a last resort.'},
    {term:'Use of All-Purpose Words', def:'using vague general expressions ("etcetera," "and so on") instead of the specific word.'},
    {term:'Literal Translation', def:'translating word-for-word from the native language, even if the essence/meaning is compromised.'},
    {term:'Foreignizing', def:'pronouncing a native-language word as if it were a word in the target language.'},
    {term:'Use of (Gap) Fillers', def:'excessive intensifiers/qualifiers ("totally," "actually") that stall the message; removable without changing meaning.'},
    {term:'Use of Non-Verbal Cues', def:'using gestures or other non-verbal actions in place of the words you can\'t find.'}
  ], palace:[
    {stop:'Hallway Light Switch', image:'You reach for the switch, start to say something, then just shrug and walk away mid-sentence.', fact:'Message Abandonment: stopping mid-expression due to difficulty communicating.'},
    {stop:'Dinner Table', image:'Every time someone asks about your grades, you loudly point out the window and yell "look, a bird!"', fact:'Topic Avoidance: changing the topic instead of discussing the issue.'},
    {stop:'Workshop Bench', image:'A homemade gadget sits on the bench with a hand-painted label: "SHRINKINATOR" in bubble letters.', fact:'Word Coinage: inventing a new term.'},
    {stop:'Language Lab Booth', image:'One half of the booth speaks in a Filipino-English mashup mid-sentence; the other half calmly finishes one whole sentence in English before switching cleanly to a whole sentence in Filipino.', fact:'Code Switching mixes languages within a sentence; Code Shifting changes language between whole sentences.'},
    {stop:'Chicken Coop out Back', image:'You point at a chicken and ask, loudly, "where\'s its mother?" instead of just saying the word.', fact:'Circumlocution: describing an idea instead of naming it directly.'},
    {stop:'Phone on the Counter', image:'You hand your phone to a friend and beg them to text the awkward message FOR you.', fact:'Appeal for Help: asking someone else to relay your message — a last resort.'}
  ], summary:[
    {h:'12 Strategies at a Glance', b:[
      'Message Abandonment — stop talking mid-thought.',
      'Topic Avoidance — change the subject instead.',
      'Use of All-Purpose Words — vague terms like "etcetera."',
      'Word Coinage — invent a new word.',
      'Literal Translation — word-for-word, loses meaning.',
      'Foreignizing — pronounce a native word as if it\'s in the target language.',
      'Code Switching — mix two languages WITHIN one sentence.',
      'Code Shifting — switch languages BETWEEN whole sentences (no mixing).',
      'Use of (Gap) Fillers — overused words like "actually" (test: remove it — if meaning is unchanged, it\'s a filler).',
      'Circumlocution — describe an idea vividly instead of naming it.',
      'Approximation — use a closely related word/synonym.',
      'Use of Non-Verbal Cues — gestures instead of words.',
      'Appeal for Help — ask someone else to relay it — last resort.'
    ]}
  ]},
  {id:'ec6', title:'7. Listening', content:[
    {h:'Listening vs. Hearing', b:[
      'Listening is often wrongly assumed to be automatic just because your ears work — but Hearing and Listening are NOT the same thing.',
      'Hearing only involves the ear — the physical/biological act of sound entering it.',
      'Listening is making sense of the message being given — an active mental process, not just a passive biological one.'
    ]},
    {h:'The Listening Process (R-P-I-R)', b:[
      'Receiving: recognizing the fact that you are hearing sounds (this is also "Stage 4" of the overall communication process).',
      'Perceiving: understanding/perceiving that those sounds are actually communicating something.',
      'Interpreting: understanding the meaning of what you heard.',
      'Responding: reacting based on what you understood.',
      'Listening is taught for 0 to a few hours yet used 45% of our lives — it is the LEAST developed macroskill.'
    ]},
    {h:'Different Types of Listening', b:[
      'Discriminative: the very first type of listening we learn; identifying and recognizing what a sound is and where it comes from (e.g. a crying baby stops when they recognize their mom\'s voice).',
      'Comprehension: making sense of what is heard.',
      'Informative: listening specifically to learn something new.',
      'Critical: identifying truths from fallacies.',
      'Evaluative: choosing a stand/decision after critical listening.',
      'Biased: a BAD example of listening — taking in only what the listener already agrees with; close-mindedness.',
      'Appreciative: listening for enjoyment (e.g. favorite band/podcast) — anything that appeals to the listener\'s sense of beauty.',
      'Sympathetic: knowing what the speaker feels (simply acknowledging).',
      'Empathic: understanding what the speaker feels (putting yourself in their shoes) — a deeper level than sympathetic.',
      'Therapeutic: doing something about the speaker\'s feelings (giving advice/help), not just appealing to or acknowledging them.',
      'Dialogic: learning through open, casual conversation, listening to each other\'s point of view to formulate shared meaning.',
      'Relationship: listening specifically to form a deeper connection with another person.'
    ]},
    {h:'Keys to Effective (Active) Listening', b:[
      'Stop talking, control your surroundings, keep an open mind, listen for main points.',
      'Provide feedback, capitalize on lag time, listen between the lines.',
      'Judge ideas not appearances, hold your fire, take selective notes.'
    ]},
    {h:'Irritating Listener Behaviors to Avoid', b:[
      'Interrupting the speaker; not looking at the speaker; rushing the speaker.',
      'Showing interest in something other than the conversation; finishing the speaker\'s thoughts for them.',
      'Not responding to the speaker\'s requests; saying "Yes, but..."; topping the speaker\'s story with your own.',
      'Forgetting what was talked about previously; asking too many questions about minor details.'
    ]},
    {h:'Importance of Feedback When Listening', b:[
      'Clarity and confirmation, active engagement, encouragement.',
      'Resolving misunderstandings, building rapport, enhancing problem-solving skills, encouraging empathic listening.'
    ]},
    {h:'Benefits of Being a Good Listener', b:[
      'You are better able to help others, and you can understand things on a deeper level.',
      'You can understand more about different cultures, and gain more resources to make informed, rational decisions.',
      'You have the tools to avoid conflicts and reduce problems.',
      'You can participate more fully in life because you know more, and you can become a more effective leader.'
    ]}
  ], quiz:[
    {q:'What is the key difference between Hearing and Listening?', c:['They are the same thing','Hearing only involves the ear; Listening is actively making sense of the message','Listening only involves the ear; Hearing is making sense of the message','Hearing requires more effort than Listening'], a:1, e:'Hearing is the passive, physical act of sound entering the ear, while Listening is the active process of making sense of the message.'},
    {q:'What does the "R" (first letter) in the R-P-I-R listening process stand for?', c:['Responding','Receiving','Reflecting','Reacting'], a:1, e:'The first R stands for Receiving — simply recognizing that you are hearing sounds, which is also Stage 4 of the communication process.'},
    {q:'What does the "P" in the R-P-I-R listening process stand for?', c:['Processing','Perceiving','Prioritizing','Practicing'], a:1, e:'P stands for Perceiving — understanding/realizing that the sounds you\'re receiving are actually communicating something.'},
    {q:'What does the "I" in the R-P-I-R listening process stand for?', c:['Informing','Interpreting','Investigating','Ignoring'], a:1, e:'I stands for Interpreting — understanding the meaning of what you heard.'},
    {q:'According to the notes, listening is used approximately what percentage of our lives, despite being the least taught skill?', c:['9%','25%','45%','75%'], a:2, e:'Listening is used approximately 45% of our lives, yet it is taught for 0 to a few hours — making it the least developed macroskill.'},
    {q:'The very FIRST type of listening a person learns, used to identify and recognize sounds and where they come from, is:', c:['Comprehension','Discriminative','Critical','Informative'], a:1, e:'Discriminative listening is the very first type of listening we develop — e.g. a crying baby recognizing and calming down at their mom\'s voice.'},
    {q:'Listening specifically to learn something new describes which type of listening?', c:['Informative','Appreciative','Biased','Relationship'], a:0, e:'Informative listening is listening with the specific goal of learning something new.'},
    {q:'Taking in only what confirms your own opinion describes which type of listening?', c:['Appreciative','Biased','Dialogic','Critical'], a:1, e:'Biased listening involves only hearing what you agree with or want to hear — considered a BAD listening habit.'},
    {q:'Listening for pure enjoyment, like to your favorite band, describes which type of listening?', c:['Appreciative','Sympathetic','Discriminative','Therapeutic'], a:0, e:'Appreciative listening involves taking in anything that appeals to the listener\'s sense of beauty/enjoyment.'},
    {q:'Putting yourself in the speaker\'s shoes to understand how they feel describes which type of listening?', c:['Sympathetic','Empathic','Relationship','Comprehension'], a:1, e:'Empathic listening involves understanding what the speaker feels by putting yourself in their position — beyond just knowing (sympathetic).'},
    {q:'Giving sound advice to help improve the speaker\'s situation describes which type of listening?', c:['Empathic','Sympathetic','Therapeutic','Discriminative'], a:2, e:'Therapeutic listening involves doing something about the speaker\'s feelings, such as giving advice.'},
    {q:'Distinguishing between the sounds of different musical instruments describes which type of listening?', c:['Discriminative','Comprehension','Critical','Evaluative'], a:0, e:'Discriminative listening involves identifying sound differences, such as distinguishing instruments or detecting paralinguistic cues.'},
    {q:'Choosing a stand or making a decision after assessing information describes which type of listening?', c:['Critical','Evaluative','Biased','Dialogic'], a:1, e:'Evaluative listening involves choosing a stand or decision after critical listening has assessed the validity of information.'},
    {q:'"Capitalize on lag time" as a key to effective listening refers to using the time between:', c:['Speaking speed and thinking speed to process the message','Two separate conversations','Sleep cycles','Class periods'], a:0, e:'Capitalizing on lag time means using the gap between how fast someone speaks and how fast you can think to actively process their message.'},
    {q:'Which of the following is considered an IRRITATING listener behavior to avoid?', c:['Providing feedback','Finishing the speaker\'s thoughts for them','Keeping an open mind','Listening for main points'], a:1, e:'Finishing the speaker\'s thoughts for them is a classic irritating listener behavior — it interrupts and can misrepresent what they meant to say.'},
    {q:'Which is a BENEFIT of being a good listener, according to the notes?', c:['You become a more effective leader','You lose track of important details','You become more close-minded','You avoid learning about other cultures'], a:0, e:'Good listening skills help you become a more effective leader, among other benefits like better decisions and fewer conflicts.'}
  ], glossary:[
    {term:'R-P-I-R', def:'Receiving, Perceiving, Interpreting, Responding — the listening process.'},
    {term:'Hearing vs. Listening', def:'Hearing = passive, ear-only reception of sound; Listening = actively making sense of the message.'},
    {term:'Discriminative listening', def:'the first type of listening learned; identifying/recognizing sounds and their source.'},
    {term:'Informative listening', def:'listening specifically to learn something new.'},
    {term:'Empathic listening', def:'understanding what the speaker feels by putting yourself in their shoes.'},
    {term:'Critical listening', def:'identifying truths from fallacies, assessing validity.'},
    {term:'Biased listening', def:'a bad listening habit — only taking in what you already agree with; close-mindedness.'}
  ], palace:[
    {stop:'Front Door Buzzer', image:'A giant ear is glued above the doorbell, and every time it buzzes, four letters light up in sequence: R-P-I-R.', fact:'R-P-I-R: Receiving, Perceiving, Interpreting, Responding — the listening process.'},
    {stop:'Clock in the Hallway', image:'The clock hands are stuck, but a caption underneath reads "45% of your life," with a tiny mouth icon crossed out.', fact:'Listening is used ~45% of our lives, yet the least taught macroskill.'},
    {stop:'Cozy Armchair', image:'You sink into the armchair wearing someone else\'s shoes, feeling exactly what they feel.', fact:'Empathic listening: putting yourself in the speaker\'s shoes.'},
    {stop:'Music Room', image:'A row of instruments each play a different note, and you can tell them all apart with your eyes closed.', fact:'Discriminative listening: identifying sound differences.'}
  ]},
  {id:'ec7', title:'8. Intercultural Communication', content:[
    {h:'Intercultural Communication', b:[
      'Involves communicating with a person/group who may not share the same assumptions, values, allegiances, or symbol associations as you.',
      'Ethnocentrism: thinking your race/ethnicity is superior to others.',
      'Stereotyping: generalizing people (e.g. "Singaporeans = good at math").',
      'Lack of cultural knowledge promotes ethnocentrism/stereotyping; knowledge promotes tolerance.'
    ]},
    {h:'Ways People Differ in Culture', b:[
      'Social Values: group expectations (e.g. US independence at 18 vs. Asian familial living).',
      'Roles and Status: differences in societal contribution expectations (e.g. gender roles in the Middle East).',
      'Decision-Making Customs: time spent deciding (e.g. Canadians faster than Japanese).',
      'Concepts of Time: just-in-time vs. ahead-of-time vs. on-time.',
      'Personal Space: proximity preferences while communicating.',
      'Cultural Context: High-context (relies on non-verbal/shared meaning) vs. Low-context (meaning depends on what is said).',
      'Behavior and Manners: what is polite/rude varies (e.g. taking home leftovers is normal in PH, rude elsewhere).',
      'Gestures and Body Language: same gesture means different things across cultures (e.g. the "OK" sign).',
      'Legal and Ethical: differences in law (e.g. innocent until proven guilty in PH vs. reverse in Turkey).',
      'Corporate Cultural Differences: work culture differs between companies (e.g. Jollibee vs. McDonald\'s).'
    ]},
    {h:'World Englishes', b:[
      'A relatively new branch in linguistics; suggests any nation using English "owns" it.',
      'Philippine English: a recognized variety of English shaped by Filipino culture; e.g. Filipinos are often noted as weak in prepositions compared to other English varieties, since Filipino languages structure location/direction differently.',
      'Proverbs reflect culture: "The squeaky wheel gets the grease" (US — value on being vocal); "The nail that sticks up gets pounded down" (Japan — value on staying humble/blending in); "A man who waits for a roast duck to fly into his mouth must wait a very long time" (China — value on taking initiative/risks); plus Philippine proverbs/sayings reflecting local values.'
    ]},
    {h:'Developmental Model of Intercultural Sensitivity', b:[
      'Denial: does not recognize/acknowledge other cultures.',
      'Defense: acknowledges but thinks highly of one\'s own culture.',
      'Minimization: acknowledges but asserts universality (downplays differences).',
      'Acceptance: starts to appreciate other cultures.',
      'Adaptation: starts to imitate/mimic other cultures.',
      'Integration: starts to reflect and incorporate other cultures into one\'s own identity.'
    ]}
  ], quiz:[
    {q:'Believing your own race/ethnicity is superior to others is called:', c:['Stereotyping','Ethnocentrism','Tolerance','Minimization'], a:1, e:'Ethnocentrism is the belief that one\'s own race/ethnicity is superior to others.'},
    {q:'Generalizing that "Singaporeans are good at math" is an example of:', c:['Ethnocentrism','Stereotyping','Tolerance','Adaptation'], a:1, e:'This generalization about a group of people based on nationality is a classic example of stereotyping.'},
    {q:'High-context cultures rely mostly on:', c:['Explicit spoken words only','Non-verbal, contextual, and shared cultural meanings','Written contracts exclusively','Random behavior'], a:1, e:'High-context cultures rely heavily on non-verbal cues, context, and shared cultural meaning rather than explicit words.'},
    {q:'Low-context cultures convey meaning mainly through:', c:['What is said, rather than how it is said','Non-verbal gestures only','Silence','Random symbols'], a:0, e:'In low-context cultures, meaning depends primarily on the explicit content of what is said.'},
    {q:'Differences in whether one is expected to decide quickly or take time to consult others reflect differences in:', c:['Decision-Making Customs','Personal Space','Legal and Ethical norms','Gestures'], a:0, e:'Decision-Making Customs cover differences in the time and process cultures use to reach decisions (e.g. Canadians vs. Japanese).'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which stage involves NOT recognizing another culture at all?', c:['Defense','Denial','Minimization','Acceptance'], a:1, e:'Denial is the stage where a person does not acknowledge or recognize other people\'s culture.'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which stage involves a person starting to IMITATE another culture?', c:['Acceptance','Adaptation','Integration','Defense'], a:1, e:'Adaptation is when a person starts to imitate or mimic aspects of another culture.'},
    {q:'In the Developmental Model of Intercultural Sensitivity, which is the FINAL stage, involving reflection?', c:['Denial','Minimization','Adaptation','Integration'], a:3, e:'Integration is the final stage, where a person reflects on and incorporates cultural understanding into their identity.'},
    {q:'The idea that "any nation that uses the English language owns it" is associated with:', c:['World Englishes','Ethnocentrism','High-context culture','G.R.E.E.P.S.'], a:0, e:'World Englishes is a branch of linguistics suggesting that any nation using English has ownership/legitimacy over its own variety of the language.'},
    {q:'Filipino English speakers are often noted as weak in which grammatical element, compared to other English varieties?', c:['Adjectives','Prepositions','Conjunctions','Pronouns'], a:1, e:'Philippine English is often noted for weakness in prepositions, since Filipino languages structure location/direction differently.'},
    {q:'The Japanese proverb "The nail that sticks up gets pounded down" reflects a cultural value on:', c:['Being vocal and outspoken','Staying humble and blending in','Taking bold risks','Innocent until proven guilty'], a:1, e:'This Japanese proverb reflects a cultural value on humility and blending in rather than standing out.'}
  ], glossary:[
    {term:'Ethnocentrism', def:'thinking your race/ethnicity is superior to others.'},
    {term:'Stereotyping', def:'generalizing people based on group identity.'},
    {term:'High-context / Low-context culture', def:'High relies on non-verbal/shared meaning; Low relies on explicit spoken/written words.'},
    {term:'Developmental Model of Intercultural Sensitivity', def:'Denial → Defense → Minimization → Acceptance → Adaptation → Integration.'},
    {term:'World Englishes', def:'branch of linguistics suggesting any nation using English "owns" its own variety of it.'},
    {term:'Philippine English', def:'a recognized variety of English shaped by Filipino culture; often noted as weak in prepositions.'}
  ], palace:[
    {stop:'World Map on the Wall', image:'A flag from your own country is pinned proudly in the center, dwarfing all the tiny flags of other nations around it.', fact:'Ethnocentrism: thinking your race/ethnicity is superior to others.'},
    {stop:'Suitcase by the Door', image:'The suitcase is packed with labeled boxes: "Singaporeans = math," each box sealed shut without ever being opened.', fact:'Stereotyping: generalizing people based on group identity.'},
    {stop:'Dimmer Switch on the Wall', image:'A dimmer switch labeled "Context" — turn it up high and the room goes quiet with just gestures and glances; turn it down and everyone starts explaining everything out loud.', fact:'High-context relies on non-verbal/shared meaning; Low-context relies on explicit words.'},
    {stop:'Staircase Going Up', image:'Six steps lead upward, each labeled: Denial, Defense, Minimization, Acceptance, Adaptation, Integration — and at the top, someone is happily blending two flags together.', fact:'Developmental Model of Intercultural Sensitivity, from Denial to Integration.'}
  ]},
  {id:'ec8', title:'9. Defining Reading: Introduction & Psychological Process', content:[
    {h:'Reading as Participating in the Communication Process', b:[
      'Communication is a process of interaction involving at least two entities, where each takes turns being the sender and the receiver of a message.',
      'In the writer-reader relationship, the writer is the sender and the reader is the receiver — the reader\'s role is to get and process the writer\'s message.',
      'Even though reading may seem like an individual activity, it still counts as participating in communication: without the writer\'s message, there is nothing for the reader to receive and process.'
    ]},
    {h:'Reading is Not Just a Basic Skill', b:[
      'The most basic definition of reading is simply assigning names to symbols seen in print, but true reading goes far beyond this.',
      'Reading involves a continuous set of skills, with one set being more cognitively advanced than the last — similar to leveling up in an online game.',
      'Just like in a game, you start with the most basic skills (recognizing symbols) before you can unlock more advanced ones, like inferring details or making predictions about the text.'
    ]},
    {h:'Reading is a Complex Process', b:[
      'To undergo a "process" means to undergo a series of stages, since the way we arrive at understanding a text may differ from person to person, and text to text.',
      'We get an understanding of a text because of our schemata — the summation of everything we\'ve learned over time through experiences and other acquired information.',
      'A schemata is made up of individual schemas; collectively, our schemas form our background knowledge.',
      'When we read, we bring our schemata with us — this is our "weapon" for understanding the text: the ideas/meanings in the text are matched against the schemata of the reader to arrive at comprehension/meaning identification.'
    ]},
    {h:'The Psychological Process of Reading (Simplified)', b:[
      '1. Recognize the printed language.',
      '2. Assign meanings to symbols based on schemata.',
      '3. Relate schemata with the author\'s ideas.',
      '4. Create or modify knowledge about the text based on the combined schemata and the author\'s ideas.',
      'The brain is the tangible, physical organ; the mind is the abstract way of thinking — schemata lives in the mind.'
    ]},
    {h:'Reading is Situationally Bound', b:[
      'Being good at reading and understanding one type of text does not automatically mean you will be just as good at reading another type of text.',
      'Since the stages we go through vary from text to text, it\'s important for readers to expose themselves to a variety of text types.'
    ]},
    {h:'Reading is Not the Same as Decoding', b:[
      'Decoding refers to making sense of the text, and while it\'s part of the process of understanding, taking too long to decode is not a characteristic of proficient reading.',
      'This leads to the last definition: proficiency in reading requires certain characteristics.'
    ]},
    {h:'Proficiency = Accuracy + Fluency', b:[
      'Accuracy: the ability to read a text with understanding — reading without understanding is a futile activity.',
      'Fluency: the ability to read with very little or no obstacles/difficulties in between.',
      'Accuracy + Fluency = Proficiency.'
    ]},
    {h:'Characteristics of a Good Reader', b:[
      'Strategic in monitoring the interactive processes that assist comprehension — like a soldier going into battle, the more strategies you have, the better prepared you are. Effective readers don\'t rely on just one method, using a range of strategies such as Skimming (quickly reading to get the general idea/gist), Scanning (quickly searching for a specific piece of information), finding context clues, making inferences, summarizing, and monitoring their own understanding.',
      'Motivated to read and learn — always has an objective in mind before reading, which helps sustain them when they feel like stopping.',
      'Socially active around reading tasks — finds the relevance of what is read to daily life and shares insights with others.',
      'Mentally engaged — constantly asks themselves questions that help them understand the text as they read.'
    ]},
    {h:'Three Ways of Processing Information When Reading', b:[
      'Bottom-Up Theory (reader < text): relying heavily on the details in the text itself because there is little to no schema yet (e.g. reading Harry Potter for the first time with zero prior context).',
      'Top-Down Theory (reader > text): relying heavily on the reader\'s schema/background knowledge to construct meaning, used when there\'s already enough relevant background knowledge.',
      'Interactive Theory (reader = text): using BOTH the reader\'s schema and the information found in the text — happens when a text contains information that requires both approaches.'
    ]},
    {h:'Reading as Problem Solving', b:[
      'Reading should also be treated like solving a jigsaw puzzle or like problem solving.',
      'Every minute detail in a text contributes to the big picture, so readers must pay close attention to avoid missing important pieces of information.'
    ]}
  ], quiz:[
    {q:'Reading, when viewed as participating in the communication process, positions the reader in the role of the:', c:['Sender','Receiver','Speaker','Editor'], a:1, e:'In the writer-reader relationship, the reader takes on the role of receiver, getting and processing the message sent by the writer.'},
    {q:'Even though reading may seem like an individual activity, it still counts as participating in communication because:', c:['Readers always read aloud','Without the writer\'s message, there is nothing to receive and process','Reading requires a listener','Reading is always done in groups'], a:1, e:'Reading requires a message from a writer (sender) — without it, there is nothing for the reader (receiver) to process, which is why it still counts as communication.'},
    {q:'Comparing reading to leveling up in an online game illustrates which characteristic of reading?', c:['Reading is Situationally Bound','Reading is Not Just a Basic Skill','Reading is a Complex Process','Reading is Problem Solving'], a:1, e:'This analogy illustrates that reading is not just a basic skill — like a game, you must master basic skills first before unlocking more advanced ones.'},
    {q:'According to the notes, "proficiency" in reading requires the combination of:', c:['Speed and volume','Accuracy and Fluency','Memory and Vocabulary','Grammar and Spelling'], a:1, e:'Proficiency = Accuracy (understanding what is read) + Fluency (reading smoothly).'},
    {q:'"Being good at reading social media posts doesn\'t mean you\'ll be good at reading textbooks" illustrates which characteristic of reading?', c:['Not the Same as Decoding','Situationally Bound','A Complex Process','Not Just a Basic Skill'], a:1, e:'This illustrates that reading is Situationally Bound — skill in one type of text doesn\'t guarantee skill in another.'},
    {q:'Which characteristic of a good reader involves using varied strategies (like skimming, scanning, or summarizing) to comprehend a text?', c:['Motivated to read','Strategic in monitoring comprehension processes','Mentally engaged','Socially active'], a:1, e:'Being strategic in monitoring the interactive processes that assist comprehension means using varied strategies like skimming, scanning, and summarizing to understand better.'},
    {q:'Quickly reading a text to get its general idea or gist, without reading every word, is called:', c:['Scanning','Skimming','Decoding','Schemata activation'], a:1, e:'Skimming is quickly reading a text to grasp its general idea/gist.'},
    {q:'Quickly searching through a text to find one specific piece of information (like a date or name) is called:', c:['Skimming','Scanning','Top-Down reading','Bottom-Up reading'], a:1, e:'Scanning is quickly searching through a text for a specific piece of information, rather than reading for overall understanding.'},
    {q:'"Schemata" in the psychological process of reading refers to:', c:['The physical structure of the brain','Background knowledge','A type of reading disorder','The speed of reading'], a:1, e:'Schemata refers to a reader\'s background knowledge, which connects to new ideas being read.'},
    {q:'Reading Harry Potter for the first time with no prior knowledge, relying heavily on the text itself, illustrates which theory?', c:['Top-Down Theory','Bottom-Up Theory','Interactive Theory','Schema Theory'], a:1, e:'Bottom-Up Theory involves relying heavily on the text because there is no relevant schema/background knowledge yet.'},
    {q:'Constructing meaning primarily based on your existing background knowledge describes which theory?', c:['Bottom-Up Theory','Top-Down Theory','Interactive Theory','Discriminative Theory'], a:1, e:'Top-Down Theory relies heavily on the reader\'s schema/background knowledge to construct meaning.'},
    {q:'Using BOTH your schema and the information in the text describes which theory?', c:['Bottom-Up Theory','Top-Down Theory','Interactive Theory','None of these'], a:2, e:'Interactive Theory combines both schema (background knowledge) and information found directly in the text.'},
    {q:'The distinction between the brain and the mind, as discussed in the psychological process of reading, is that the brain is ___ while the mind is ___.', c:['Abstract; tangible','Tangible; abstract','Both tangible','Both abstract'], a:1, e:'The brain is the tangible physical organ, while the mind is the abstract way of thinking.'},
    {q:'What is the correct order of the simplified psychological process of reading?', c:['Assign meanings → Recognize printed language → Relate schemata → Create knowledge','Recognize printed language → Assign meanings based on schemata → Relate schemata with author\'s ideas → Create/modify knowledge','Relate schemata → Recognize printed language → Create knowledge → Assign meanings','Create knowledge → Assign meanings → Recognize language → Relate schemata'], a:1, e:'The process moves from recognizing printed language, to assigning meanings based on schemata, to relating schemata with the author\'s ideas, and finally creating or modifying knowledge.'},
    {q:'Decoding, as discussed in the notes, refers to:', c:['Memorizing a text word-for-word','Making sense of the text','Speed reading','Translating a text to another language'], a:1, e:'Decoding refers to making sense of the text; it is part of the process, but taking too long to decode is not a mark of proficient reading.'},
    {q:'A reader who treats a text like a jigsaw puzzle, paying close attention to every minute detail, is applying which view of reading?', c:['Reading as Decoding','Reading as Problem Solving','Reading as a Basic Skill','Reading as a Social Activity'], a:1, e:'Viewing reading as problem solving means treating every detail in a text as a piece contributing to the "big picture," similar to solving a jigsaw puzzle.'},
    {q:'Which characteristic of a good reader means having a clear objective in mind before reading?', c:['Mentally engaged','Motivated to read and learn','Socially active around reading tasks','Strategic in monitoring comprehension'], a:1, e:'Being motivated to read and learn means always having an objective in mind, which helps the reader push through when they feel like stopping.'},
    {q:'A schemata is best described as:', c:['A single memorized fact','The summation of learnings acquired through experiences and other sources of information','A grammar rule used in reading','A type of graphic organizer'], a:1, e:'Schemata is the summation of everything a person has learned over time, made up of individual schemas built from experiences and acquired information.'},
    {q:'Which of the following BEST completes the reading definition "reading is participating in the ___ process"?', c:['Communication','Decoding','Memorization','Evaluation'], a:0, e:'One of the key definitions of reading presented is that it is participating in the communication process, where the reader acts as the receiver of the writer\'s message.'},
    {q:'Why is it important for readers to build up their schemata?', c:['It makes reading faster regardless of the text','The wider the schemata, the higher the chances of understanding a text','It removes the need to read the text at all','It guarantees 100% comprehension of any text'], a:1, e:'The wider a reader\'s schemata, the higher their chances of understanding a text, since new information is connected to background knowledge.'},
    {q:'Being "socially active around reading tasks" as a characteristic of a good reader means:', c:['Only reading with other people present','Finding the relevance of what is read to daily life and sharing insights with others','Reading only social media content','Avoiding discussion of what was read'], a:1, e:'Being socially active around reading tasks means finding the relevance of a text to daily life and sharing insights gained from it with others.'},
    {q:'Which reading theory is most likely used when a six-paragraph text contains information that requires both relying on the text and relying on background knowledge?', c:['Bottom-Up Theory','Top-Down Theory','Interactive Theory','Schema Theory'], a:2, e:'When a text lends itself to needing both approaches — details from the text and background knowledge — the approach used is Interactive Theory.'}
  ], glossary:[
    {term:'Reading (as Communication)', def:'participating in the communication process; the reader is the receiver of the writer\'s (sender\'s) message.'},
    {term:'Schemata', def:'the summation of background knowledge acquired through experiences and other sources of information; made up of individual schemas.'},
    {term:'Accuracy + Fluency', def:'= Proficiency in reading.'},
    {term:'Bottom-Up Theory', def:'relying heavily on the text itself, with little/no schema (reader < text).'},
    {term:'Top-Down Theory', def:'relying heavily on schema/background knowledge (reader > text).'},
    {term:'Interactive Theory', def:'using both schema and information in the text (reader = text).'},
    {term:'Decoding', def:'making sense of the text; part of reading but not the same as full understanding.'},
    {term:'Reading as Problem Solving', def:'treating reading like a jigsaw puzzle — every detail contributes to the big picture.'},
    {term:'Skimming', def:'quickly reading a text to get its general idea/gist, without reading every word.'},
    {term:'Scanning', def:'quickly searching through a text for one specific piece of information.'}

    {h:'Quick Recap: What is Reading?', b:[
      'Reading = participating in the communication process (the reader is the receiver) + not just a basic skill + a complex process (schemata-driven) + situationally bound + not the same as decoding + problem solving.',
      'Proficiency = Accuracy + Fluency.',
      'A good reader is: Strategic, Motivated, Socially active, and Mentally engaged.',
      'Psychological process: Recognize printed language → Assign meaning based on schemata → Relate schemata with the author\'s ideas → Create/modify knowledge.',
      '3 processing theories: Bottom-Up (reader < text, little/no schema), Top-Down (reader > text, relies on schema), Interactive (reader = text, uses both).'
    ]}
  ]},
  {id:'ec9', title:'10. Characteristics of Academic and Professional Texts', content:[
    {h:'Overview: The ACADEMIC Framework', b:[
      'Academic and professional texts can be processed using the same reading approaches (bottom-up, top-down, interactive), but they also share common features that experts agree are present across these texts.',
      'These 8 key characteristics are: (A) Assumption, (C) Cited Sources, (A) Academic Grammar & Vocabulary, (D) Definite Conclusions, (E) Engineered Structure, (M) Measured Tone, (I) Intelligible Transitions, (C) Cautious Expressions — the initials spell "ACADEMIC."',
      'Since professional texts covered in this subject also count as academic texts, the same "ACADEMIC" framework is used to refer to both.'
    ]},
    {h:'A: Assumption', b:[
      'Academic texts always start with a clear assumption, expressed in the form of a thesis statement — the main idea or argument of the text.',
      'Unlike other text types, the thesis statement in academic writing is always explicitly stated (never merely implied or spread throughout), typically found early on in the introduction.',
      'In a research paper, the thesis statement often appears as research questions or objectives that define the driving force of the entire study.'
    ]},
    {h:'C: Cited Sources', b:[
      'Citing sources is crucial for establishing credibility and avoiding plagiarism, reinforcing academic integrity.',
      'Credible writers align their ideas with those of other knowledgeable individuals through in-text citations and a bibliography/reference list.',
      'Citing sources situates the writer\'s work within the broader academic conversation and shows claims are grounded in reliable research.'
    ]},
    {h:'A: Academic Grammar & Vocabulary', b:[
      'Academic texts use formal language to maintain credibility and authority — a text isn\'t automatically "academic" just because it has no grammar mistakes; it must follow academic writing\'s own formal grammar rules.',
      'Prefer expanded modal/negative forms over contractions (e.g. "cannot," "do not," "will not" instead of "can\'t," "don\'t," "won\'t").',
      'Avoid collocations/informal verb phrases in favor of precise single-word verbs (e.g. "malfunction" instead of "break down").',
      'Avoid abbreviations — spell out terms in full the first time, then use the acronym in parentheses (e.g. "as soon as possible (ASAP)").',
      'Avoid clichés — overused expressions that have lost their impact and fail to communicate ideas with clarity and precision.',
      'Other formal rules: use formal negative forms (no/few/little instead of not/not many/not much), avoid all-purpose expressions like "etc.", avoid second-person pronouns ("you/your"), place adverbs between helping and main verbs, avoid split infinitives, and keep word usage efficient (avoid wordy sentences).'
    ]},
    {h:'D: Definite Conclusions', b:[
      'Just as academic texts begin with a clear thesis, they must end with a well-defined conclusion.',
      'A valid conclusion (1) effectively summarizes the key points discussed, giving readers an overview of the main ideas, and (2) leaves a lasting impression — for example, by offering recommendations for future studies.'
    ]},
    {h:'E: Engineered Structure', b:[
      'Academic texts rely on a carefully engineered structure — this covers how words are formed and how paragraphs are developed.',
      'Nominalization: transforming verbs into nouns (e.g. create → creation, suggest → suggestion) to sound more formal and sophisticated.',
      'Passivization: shifting sentences from active to passive voice (e.g. "The Thomasian scientists conducted a study" → "A study was conducted by the Thomasian scientists") — the choice depends on what the writer wants to emphasize (the doer or the action/recipient).',
      'Patterns of paragraph development: Description (explains a concept, cued by "for instance/for example"), Sequence (narrates events in order, cued by "then/before/after"), Comparison (shows similarities/differences, cued by "on one hand/on the other hand/meanwhile"), Cause-and-Effect (shows how one thing leads to another, cued by "hence/as a result/therefore"), and Problem-Solution (identifies challenges and discusses solutions, often overlapping with cause-and-effect cues, plus "because/for this reason").'
    ]},
    {h:'M: Measured Tone', b:[
      'Academic texts maintain objectivity — presenting information in a manner that is unbiased and impartial, keeping a certain social distance between writer and reader.',
      'This is achieved by (1) avoiding personal pronouns like "I"/"we" (use third-person forms instead), (2) refraining from rhetorical questions in favor of declarative statements, and (3) eliminating emotive language that could introduce bias.',
      'Example: instead of "We can conclude that the study shows...", write "The study concludes that...".'
    ]},
    {h:'I: Intelligible Transitions', b:[
      'Academic texts guide readers using clear transitional devices (conjunctions and conjunctive adverbs) that create cohesion between ideas.',
      'Different transition types signal different relationships: To Add (and, furthermore, moreover), To Compare (but, however, on the other hand), To Prove (because, since, for), To Show Exception (yet, nevertheless, despite), To Show Time (immediately, thereafter, then), To Repeat (in brief, as previously noted), To Emphasize (definitely, undeniably), To Show Sequence (first, next, therefore), To Give an Example (for example, to illustrate), and To Summarize or Conclude (in conclusion, hence, accordingly).',
      'Recognizing these cues helps readers efficiently locate the most important information in a text.'
    ]},
    {h:'C: Cautious Expressions', b:[
      'Claims in academic texts should not be presented as absolute or definitive, even when evidence is compelling — overly assertive claims can undermine credibility.',
      'Hedging devices ("might," "could," "seem," "perhaps," modal verbs like "may/should/could") let writers express a measured degree of caution or reservation.',
      'Swales and Feak (2007) identify three types of claims by degree of certainty: Strong claims (no hedging, presented as absolute truths), Weak claims (excessive hedging, appears overly uncertain), and Soft claims (balanced use of hedging — the ideal for academic writing).',
      'Cautioning verbs (e.g. "appear to be," "tend to") and adverbs of frequency (e.g. "usually," "sometimes") also help soften claims appropriately.'
    ]}
  ], quiz:[
    {q:'The 8 characteristics of academic and professional texts spell out which word?', c:['CRITICAL','ACADEMIC','SCHOLARLY','FORMAL'], a:1, e:'The initials of the 8 characteristics — Assumption, Cited Sources, Academic Grammar & Vocabulary, Definite Conclusions, Engineered Structure, Measured Tone, Intelligible Transitions, Cautious Expressions — spell "ACADEMIC."'},
    {q:'In academic writing, the thesis statement is typically found:', c:['Scattered throughout the text','Only in the conclusion','Early on, in the introduction','Implied but never directly stated'], a:2, e:'The thesis statement in academic writing is always explicitly stated and typically found early on, in the introduction section.'},
    {q:'In a research paper, the thesis statement often takes the form of:', c:['A cliché','Research questions or objectives','A rhetorical question','A citation'], a:1, e:'In research papers, the thesis statement commonly appears as research questions or objectives that drive the entire study.'},
    {q:'Citing sources in academic texts primarily helps to:', c:['Make the text longer','Establish credibility and avoid plagiarism','Add emotional appeal','Replace the need for a conclusion'], a:1, e:'Citing sources establishes credibility, avoids plagiarism, and situates the writer\'s work within the broader academic conversation.'},
    {q:'Which of the following is preferred in formal academic grammar?', c:['"can\'t" and "don\'t"','"cannot" and "do not"','"gonna" and "wanna"','"etc." for lists'], a:1, e:'Academic writing favors expanded forms like "cannot" and "do not" over contractions like "can\'t" and "don\'t."'},
    {q:'Replacing the collocation "break down" with "malfunction" in an academic text is an example of:', c:['Avoiding second-person pronouns','Avoiding collocations for more precise single-word verbs','Avoiding split infinitives','Nominalization'], a:1, e:'Academic texts avoid common collocations like "break down" in favor of more precise, single-word verbs like "malfunction" or "failure."'},
    {q:'Which characteristic requires that a conclusion both summarize key points AND leave a lasting impression?', c:['Assumption','Definite Conclusions','Measured Tone','Cautious Expressions'], a:1, e:'Definite Conclusions requires a conclusion that (1) summarizes the key points and (2) leaves a lasting impression, such as through recommendations for future study.'},
    {q:'Turning the verb "suggest" into the noun "suggestion" is an example of:', c:['Passivization','Nominalization','Hedging','Cliché'], a:1, e:'Nominalization refers to transforming verbs into their noun equivalents, e.g. "suggest" → "suggestion."'},
    {q:'"A study was conducted by the Thomasian scientists" (instead of "The Thomasian scientists conducted a study") is an example of:', c:['Nominalization','Passivization','Hedging','Intelligible Transition'], a:1, e:'Passivization involves shifting a sentence from the active voice to the passive voice.'},
    {q:'A paragraph that explains how lack of exposure to different art forms limits cultural awareness is using which pattern of paragraph development?', c:['Description','Comparison','Cause-and-Effect','Problem-Solution'], a:2, e:'This paragraph explores how one factor (lack of exposure) leads to another (limited cultural awareness), which is the Cause-and-Effect pattern.'},
    {q:'Which pattern of paragraph development is most likely cued by words like "on one hand" and "meanwhile"?', c:['Sequence','Comparison','Description','Cause-and-Effect'], a:1, e:'Comparison is typically cued by phrases like "on one hand," "on the other hand," and "meanwhile," which highlight similarities or differences.'},
    {q:'Measured Tone in academic writing is best achieved by:', c:['Using more personal pronouns like "I" and "we"','Avoiding personal pronouns, rhetorical questions, and emotive language','Using more rhetorical questions','Adding more emotional appeals to persuade the reader'], a:1, e:'Measured tone/objectivity is achieved by avoiding personal pronouns, refraining from rhetorical questions, and eliminating emotive language.'},
    {q:'Rewriting "We can conclude that the study shows..." as "The study concludes that..." demonstrates:', c:['Cited Sources','Measured Tone','Intelligible Transitions','Cautious Expressions'], a:1, e:'Removing the personal pronoun "we" for a more objective, third-person phrasing demonstrates Measured Tone.'},
    {q:'Which transitional device type would the words "hence," "therefore," and "as a result" belong to?', c:['To Add','To Prove/Cause-Effect','To Show Exception','To Show Time'], a:1, e:'Words like "hence," "therefore," and "as a result" are used to prove or indicate cause-and-effect relationships between ideas.'},
    {q:'Transitional words like "and," "furthermore," and "moreover" are used to:', c:['Show contrast','Add more information or ideas','Indicate time','Show an exception'], a:1, e:'These transitional devices are used to add more information or ideas, showing that what follows is related or equally important.'},
    {q:'Which of the following is an example of a hedging device used for Cautious Expressions?', c:['"absolutely"','"definitely"','"might"','"undeniably"'], a:2, e:'"Might" is a hedging device that allows a writer to express a measured degree of caution or uncertainty about a claim.'},
    {q:'According to Swales and Feak (2007), a claim that makes NO use of hedging and presents ideas as absolute truths is called a:', c:['Soft claim','Weak claim','Strong claim','Cautious claim'], a:2, e:'Strong claims make no use of hedging and present ideas as absolute truths, which academic writing generally avoids in favor of soft claims.'},
    {q:'Which type of claim strikes the ideal balance in academic writing — using hedging to express caution without undermining the argument\'s validity?', c:['Strong claim','Weak claim','Soft claim','Absolute claim'], a:2, e:'Soft claims strike a balance between confidence and caution, making them the ideal type of claim in academic writing.'},
    {q:'Spelling out "as soon as possible" instead of using "ASAP" in an academic text (until the acronym is first introduced properly) reflects which characteristic?', c:['Academic Grammar & Vocabulary','Cited Sources','Engineered Structure','Cautious Expressions'], a:0, e:'Avoiding abbreviations, and spelling out terms fully before using their acronym, falls under Academic Grammar & Vocabulary.'},
    {q:'A paragraph that identifies challenges brought about by a phenomenon and then systematically discusses solutions is using which pattern of paragraph development?', c:['Sequence','Description','Comparison','Problem-Solution'], a:3, e:'The Problem-Solution pattern identifies challenges and systematically discusses solutions, often overlapping with cause-and-effect cues.'}
  ], glossary:[
    {term:'Assumption', def:'academic texts begin with a clear thesis statement, always explicitly stated, usually in the introduction.'},
    {term:'Cited Sources', def:'in-text citations and a reference list used to establish credibility and avoid plagiarism.'},

    {term:'Definite Conclusions', def:'a conclusion that summarizes key points and leaves a lasting impression.'},
    {term:'Engineered Structure', def:'careful word formation (nominalization, passivization) and paragraph patterns (description, sequence, comparison, cause-effect, problem-solution).'},
    {term:'Measured Tone', def:'objective, impartial tone achieved by avoiding personal pronouns, rhetorical questions, and emotive language.'},
