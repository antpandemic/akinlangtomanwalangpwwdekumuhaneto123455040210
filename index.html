  ]},
  {id:'pk3', title:'3. Elemento ng Kasaysayan at Heograpiya',   content: [
    {h:'Mga Elemento ng Kasaysayan', b:[
      'Tao: pinaka-importanteng elemento — siya ang gumaganap at gumagawa ng kasaysayan.',
      'Lokasyon: pambansa o lokal — malalaman dito ang kultura, tradisyon, pagkain, kasuotan; may kaugnayan din sa globalisasyon/pananaw ng lugar.',
      'Konteksto: kailan, anong kultura, anong pilosopiya, sanhi at epekto.',
      'Batis (Sources): nakasulat (birth/death certificate, census) at artifacts (larawan, kasangkapan, armas, mga labi ng kalansay, oral history, mga panayam).'
    ]},
    {h:'Mga Hamon sa Lokal na Kasaysayan', b:[
      'Kaunting materyales/batis sa lokal na kasaysayan; problema sa paglalapat ng dokumentong nakasulat sa dayuhang lengguwahe.',
      'Pagkiling (bias) ng mga dayuhang historyador.',
      'Kakulangan ng batis para irepresenta ang buong bansa; kakulangan ng sanay/tunay na historyador.'
    ]},
    {h:'Heograpiya ng Pilipinas', b:[
      'Ang heograpiya ay pag-aaral ng mga pisikal na katangian ng daigdig at atmospera nito, at ng aktibidad ng tao habang ito ay nakakaapekto at apektado ng mga ito. Kabilang dito ang pamamahagi ng populasyon at mapagkukunan, paggamit ng lupa, at mga industriya.',
      'Kahalagahan ng Heograpiya: tumutulong ito sa pag-unawa ng ating mundo (pisikal na sistema, natural na penomenon, pagkakaiba-iba ng kultura, at pandaigdigang isyu); tumutulong din itong saliksikin ang mga komplikadong isyu tulad ng pagbabago ng klima, heopolitikal na tensyon, at pagkakaiba-iba ng ekonomiya, habang pinalalakas ang pagpapahalaga sa mundo at sa mga naninirahan dito.',
      'Matatagpuan sa Timog-Silangang Asya; bahagi ng Pacific Ring of Fire (Seismic/Earthquake Belt) at Pacific Typhoon Belt.',
      'Nasa itaas ng ekwador (tropikal); may 7,641 na isla (archipelagic state).',
      'Iba\'t ibang wika/diyalekto = rehiyonalismo at sub-cultures; resulta: Oryentasyong Pandagat (kultura na may kinalaman sa pandagat).',
      'Dalawang paraan ng pagtingin sa heograpiya: Deterministic (hindi nagbabago, hal. lokasyon sa Ring of Fire) at Possibilism (kaya nating gawin upang magbago ang paligid).'
    ]},
    {h:'Mga Teoryang Siyentipiko: Heolohikal at Heograpiyang Pundasyon ng Kapuluan', svg:'<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Continental Drift and Land Bridges theories diagram"> <defs> <marker id="arrG1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <g font-family="system-ui,sans-serif"> <text x="200" y="24" text-anchor="middle" font-size="13" font-weight="bold" style="fill:var(--ink)">Continental Drift (Wegener)</text> <ellipse cx="90" cy="120" rx="70" ry="60" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="90" y="124" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Pangea</text> <line x1="175" y1="120" x2="230" y2="120" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrG1)"/> <ellipse cx="270" cy="95" rx="26" ry="20" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <ellipse cx="325" cy="105" rx="20" ry="16" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <ellipse cx="295" cy="140" rx="18" ry="14" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <ellipse cx="250" cy="150" rx="16" ry="12" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="200" y="235" text-anchor="middle" font-size="10" style="fill:var(--muted)">One landmass split into 7 continents</text> <line x1="420" y1="20" x2="420" y2="240" style="stroke:var(--border);stroke-width:1.5;stroke-dasharray:4,3"/> <text x="680" y="24" text-anchor="middle" font-size="13" font-weight="bold" style="fill:var(--ink)">Land Bridges (Suess)</text> <ellipse cx="530" cy="130" rx="65" ry="50" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="530" y="134" text-anchor="middle" font-size="10" font-weight="bold" style="fill:var(--ink)">Mainland Asia</text> <path d="M600,135 L790,135" style="stroke:var(--accent2);stroke-width:8;stroke-dasharray:10,6"/> <ellipse cx="850" cy="130" rx="55" ry="45" style="fill:var(--card);stroke:var(--accent);stroke-width:2"/> <text x="850" y="128" text-anchor="middle" font-size="10" font-weight="bold" style="fill:var(--ink)">Palawan/</text> <text x="850" y="141" text-anchor="middle" font-size="10" font-weight="bold" style="fill:var(--ink)">Pilipinas</text> <text x="690" y="235" text-anchor="middle" font-size="10" style="fill:var(--muted)">Bridge submerged ~25,000 yrs ago as ice melted</text> </g> </svg>', b:[
      'Continental Drift Theory (Alfred Wegener): malaking lupain na naghiwalay sa isa\'t isa; napatunayan sa pamamagitan ng iba\'t ibang gawain/earthquake; nabuo ang pitong kontinente.',
      'Land Bridges Theory (Edward Suess): Pilipinas konektado sa mainland Asia 25,000 taon nakalipas sa pamamagitan ng mga tulay-lupa na natunaw at lumubog; ang Palawan lamang ang direktang nakasama sa teoryang ito.',
      'Faulting at Folding: dalawang paraan kung paano gumagalaw ang lupa — Faulting (pagka-akma/pagbibitak ng lupa) at Folding (pagpapatupi/pagbabaluktot ng lupa); mga uri: Normal, Reverse, Strike-slip Fault.',
      'Volcanic Origin Theory: maraming bulkan na nakapaligid/nasa ilalim ng dagat na sumabog at bumuo ng lupa; ang Taal Volcano ay binanggit bilang unang malaking suliraning pangklima ng bansa bago pa man magkaroon ng pandemya.',
      'Mga Labi ng Kontinente sa Pasipiko (Mu/Lemuria): hindi napatunayan; walang ebidensyang lupain.',
      'Mitolohiyang Pinagmulan (hindi siyentipiko): banal na paglikha, pag-aaway ng langit at dagat, "Giant Tale."'
    ]}
  ],
  quiz: [
    {q:'Alin ang pinaka-importanteng elemento ng kasaysayan?', c:['Lokasyon','Tao','Konteksto','Batis'], a:1, e:'Ang Tao ang pinaka-importanteng elemento — siya ang gumaganap at gumagawa ng kasaysayan.'},
    {q:'Ilang isla mayroon ang Pilipinas ayon sa notes?', c:['5,000','7,107','7,641','10,000'], a:2, e:'Ayon sa notes, may 7,641 na isla ang Pilipinas, kaya ito ay tinatawag na archipelagic state.'},
    {q:'Sino ang nagmungkahi ng Continental Drift Theory?', c:['Alfred Wegener','Felipe Landa Jocano','Edward Suess','Herodotus'], a:0, e:'Si Alfred Wegener ang nagmungkahi ng Continental Drift Theory, na nagsasabing nagkahiwalay ang isang malaking lupain patungong pitong kontinente.'},
    {q:'Ilang kontinente ang nabuo ayon sa Continental Drift Theory?', c:['Lima','Anim','Pito','Walo'], a:2, e:'Ayon sa Continental Drift Theory, nagkahiwa-hiwalay ang isang malaking lupain hanggang sa mabuo ang pitong kontinente.'},
    {q:'Sino ang nagmungkahi ng Land Bridges Theory?', c:['Alfred Wegener','Edward Suess','Peter Bellwood','Felipe Landa Jocano'], a:1, e:'Si Edward Suess ang nagmungkahi ng Land Bridges Theory.'},
    {q:'Ayon sa Land Bridges Theory, ilang taon na ang nakalipas nang konektado ang Pilipinas sa mainland Asia?', c:['5,000 taon','25,000 taon','100,000 taon','1 milyong taon'], a:1, e:'Ayon sa Land Bridges Theory, 25,000 taon na ang nakalipas nang konektado ang Pilipinas sa mainland Asia.'},
    {q:'Aling isla ang binanggit bilang direktang nakasama/konektado sa Land Bridges Theory?', c:['Cebu','Palawan','Mindoro','Bohol'], a:1, e:'Ang Palawan ang binanggit bilang direktang nakasama sa Land Bridges Theory dahil sa kalapitan nito sa mainland Asia.'},
    {q:'Ano ang dalawang paraan ng paggalaw ng lupa sa Faulting at Folding?', c:['Pag-init at paglamig','Faulting (pagbibitak) at Folding (pagbabaluktot)','Pag-ikot at pag-taas','Pagtunaw at pagyelo'], a:1, e:'Ang Faulting ay pagka-akma/pagbibitak ng lupa, habang ang Folding ay pagpapatupi/pagbabaluktot ng lupa.'},
    {q:'Alin sa sumusunod ang HINDI isa sa mga uri ng fault na binanggit?', c:['Normal Fault','Reverse Fault','Strike-slip Fault','Diagonal Fault'], a:3, e:'Ang tatlong uri ng fault na binanggit ay Normal, Reverse, at Strike-slip Fault — walang "Diagonal Fault."'},
    {q:'Aling bulkan ang binanggit bilang unang malaking suliraning pangklima ng Pilipinas bago pa man ang pandemya?', c:['Mayon Volcano','Taal Volcano','Pinatubo','Kanlaon'], a:1, e:'Ang Taal Volcano ang binanggit bilang unang malaking suliraning pangklima ng bansa bago pa magkaroon ng pandemya.'},
    {q:'Bakit itinuturing na hindi totoong pinagmulan ng sinaunang Pilipino ang Mu/Lemuria?', c:['Dahil walang nakitang ebidensya ng nabuong malaking lupain', 'Dahil masyadong malapit ito sa Pilipinas', 'Dahil hindi ito kilalang teorya', 'Dahil napatunayang totoo ito'], a:0, e:'Napatunayang hindi totoo ang teorya ng Mu/Lemuria dahil walang nakitang ebidensya ng isang nabuong malaking lupaing ito.'},
    {q:'Aling pananaw sa heograpiya ang naniniwalang hindi ito nagbabago (hal. lokasyon sa Ring of Fire)?', c:['Possibilism','Deterministic','Historiography','Ethnography'], a:1, e:'Ang Deterministic na pananaw ay naniniwalang hindi nagbabago ang heograpikal na katangian, tulad ng lokasyon ng Pilipinas sa Pacific Ring of Fire.'},
    {q:'Ang "Oryentasyong Pandagat" ay resulta ng:', c:['Pagiging solidong lupain ng Pilipinas','Iba\'t ibang wika/diyalekto at pagiging arkipelago','Pananakop ng mga Espanyol','Pag-aaral ng Continental Drift'], a:1, e:'Ang iba\'t ibang wika/diyalekto at ang pagiging arkipelago ng Pilipinas ay nagresulta sa "oryentasyong pandagat" — kultura na may kinalaman sa pandagat.'},
    {q:'Ano ang kahulugan ng heograpiya ayon sa modyul?', c:['Pag-aaral lamang ng mga bundok', 'Pag-aaral ng pisikal na katangian ng daigdig at atmospera nito, at aktibidad ng tao', 'Pag-aaral ng mga wika sa mundo', 'Pag-aaral ng kasaysayan ng mga hari'], a:1, e:'Ang heograpiya ay pag-aaral ng pisikal na katangian ng daigdig at atmospera nito, kasama ang aktibidad ng tao na nakakaapekto at apektado nito.'},
    {q:'Bakit maaaring ituring na kahinaan ng nasyonalismong Pilipino ang pagiging arkipelago?', c:['Dahil walang mga isla ang Pilipinas', 'Dahil mas malaki ang pagkakawatak-watak ng mga tao dahil sa maraming isla', 'Dahil bawal pumunta sa ibang isla', 'Dahil isang isla lamang ang Pilipinas'], a:1, e:'Dahil sa pagiging arkipelago, mas malaki ang pagkakawatak-watak ng mga Pilipino, na nagpapahirap sa pagbuo ng nagkakaisang pambansang pagkakakilanlan.'},
    {q:'Alin sa sumusunod ang bahagi ng "Kahalagahan ng Heograpiya"?', c:['Pag-unawa ng kapaligiran, pag-ayon ng tao sa kalikasan, transportasyon', 'Pagbabawal sa paglalakbay', 'Pagsira sa kalikasan', 'Pagbabalewala sa klima'], a:0, e:'Kabilang sa kahalagahan ng heograpiya ang pag-unawa ng kapaligiran, ang pag-ayon (pag-adapt) ng tao sa kalikasan, at ang transportasyon.'},
    {q:'Ano ang ibig sabihin ng "Possibilism" sa heograpiya?', c:['Walang magagawa ang tao upang baguhin ang kanyang kapaligiran', 'May magagawa ang tao upang baguhin ang nakapaligid sa kanya', 'Ang heograpiya ay hindi nakakaapekto sa tao', 'Palaging kontrolado ng kalikasan ang tao'], a:1, e:'Ang Possibilism ay naniniwalang may magagawa ang tao upang baguhin/umangkop sa kanyang kapaligiran.'},
    {type:'dual', s1:'Ang Continental Drift Theory ay iminungkahi ni Alfred Wegener.', s2:'Sinasabi ng teoryang ito na nagkahiwalay ang malaking lupain patungong pitong kontinente.', a:0, e:'Parehong totoo — ito nga ang buod ng Continental Drift Theory ni Wegener.'},
    {type:'dual', s1:'Napatunayang totoo ang Land Bridges Theory bilang pinagmulan ng lahat ng sinaunang Pilipino.', s2:'Ang Land Bridges Theory ay iminungkahi ni Edward Suess.', a:3, e:'Mali ang Statement 1 (may ebidensyang mas matanda pang paninirahan sa Pilipinas kaysa sa teoryang ito), pero tama ang Statement 2 — si Edward Suess nga ang nagmungkahi nito.'},
    {type:'dual', s1:'Ang Deterministic na pananaw ay naniniwalang hindi nagbabago ang heograpiya.', s2:'Ang Possibilism ay naniniwalang may magagawa tayo upang baguhin ang paligid.', a:0, e:'Parehong totoo — ito ang pangunahing pagkakaiba ng Deterministic at Possibilism na pananaw sa heograpiya.'},
    {type:'dual', s1:'Ang Pilipinas ay matatagpuan sa Hilagang Asya.', s2:'Ang Pilipinas ay may 7,641 na isla.', a:3, e:'Mali ang Statement 1 (Timog-Silangang Asya ang Pilipinas), pero tama ang Statement 2 — mayroon nga itong 7,641 na isla.'},
    {type:'dual', s1:'Ang Taal Volcano ay binanggit bilang halimbawa ng Volcanic Origin Theory.', s2:'Ito rin ay binanggit bilang unang malaking suliraning pangklima ng Pilipinas bago ang pandemya.', a:0, e:'Parehong totoo — bahagi ang Taal Volcano ng talakayan sa Volcanic Origin Theory, at binanggit din ito bilang unang malaking suliraning pangklima.'},
    {q:'Alin sa mga sumusunod ang bahagi ng Kahalagahan ng Heograpiya?', c:['Tumutulong ito sa pag-unawa ng climate change at heopolitikal na tensyon', 'Wala itong kaugnayan sa kultura', 'Tanging ang mapa lamang ang pinag-aaralan nito', 'Hindi ito kaugnay sa ekonomiya'], a:0, e:'Ang heograpiya ay tumutulong sa pag-unawa ng mundo, kultura, at pandaigdigang isyu tulad ng climate change at heopolitikal na tensyon.'}
  ],
  glossary: [
    {term:'Batis', def:'sources — mga nakasulat na tala (birth/death certificate, census) at artifacts (larawan, kasangkapan, armas).'},
    {term:'Deterministic', def:'pananaw na hindi nagbabago ang heograpiya (hal. lokasyon sa Ring of Fire).'},
    {term:'Possibilism', def:'pananaw na may magagawa tayo upang baguhin ang ating kapaligiran.'},
    {term:'Continental Drift Theory', def:'ni Alfred Wegener — malaking lupain na naghiwalay patungong pitong kontinente.'},
    {term:'Land Bridges Theory', def:'ni Edward Suess — konektado umano ang Pilipinas sa mainland Asia sa pamamagitan ng tulay-lupa.'},
    {term:'Kahalagahan ng Heograpiya', def:'tumutulong sa pag-unawa ng mundo, kultura, at pandaigdigang isyu tulad ng climate change at heopolitikal na tensyon.'}
  ],

    {stop:'Bulkang Nakaukit sa Bakuran', image:'Isang maliit na bulkan-mainan na may label na "Taal" ang sumasabog sa gitna ng bakuran, itinutulak paitaas ang lupa sa palibot nito.', fact:'Volcanic Origin Theory: maraming bulkan (kasama ang Taal) na bumuo ng lupa ng Pilipinas.'},
    {stop:'Compass sa Bintana', image:'Dalawang karatula ang nakadikit sa bintana: "Deterministic — hindi nagbabago" sa isang bahagi, at "Possibilism — kaya nating baguhin" sa kabila.', fact:'Deterministic vs. Possibilism: dalawang pananaw sa heograpiya.'},
    {stop:'Lababo sa Kusina', image:'Tubig-alat mula sa gripo ang naghahalo sa fresh na tubig sa palanggana, kasama ang maliliit na bangkang naglalayag pabalik-balik.', fact:'Oryentasyong Pandagat: resulta ng iba\'t ibang wika/diyalekto at pagiging arkipelago.'}
  ]},
  {id:'pk4', title:'4. Mga Teorya ng Sinaunang Migrasyon',   content: [
    {h:'Austronesian Out of Taiwan (Peter Bellwood)', b:[
      'Ang mga Austronesian ay nanggaling sa Taiwan bago kumalat sa Timog-Silangang Asya at Karagatang Pasipiko (hanggang Madagascar).',
      'Mga Indigenous People ng Taiwan — kilalang maritime navigators; mula sa kanila ang kaalaman sa pagsasaka, pagtatanim, pangangaso.',
      'Ebidensya na galing ang mga Pilipino sa Austronesia: lengguwahe, at mga artifacts tulad ng pottery na makikita sa Taiwan, Pilipinas, at Malaysia.',
      'Dahilan ng migrasyon: kalapitan sa mga isla, kasanayan sa paglalayag/pagsasaka, prestihiyo sa pananakop, tumataas na densidad ng populasyon.',
      'Nagkaroon ng kalakalan sa mga Tsino (kabibe, perlas, ginto, pagkaing-dagat kapalit ng seda, porselana).'
    ]},
    {h:'Unti-unting Pag-unlad ng mga Austronesian', b:[
      'Sociological Progress: mula sa kani-kanyang pagtatanim (individual), naging horti-cultural — nagtanim para magkaroon ng permanenteng pagkain.',
      'Resources/Teknolohiya: pagdiskubre ng apoy; paggamit ng domestic animals para sa araw-araw na pangangailangan.',
      'Palayok: mahalagang imbensyon — ginamit sa pagluluto, pagtatago at pag-iimpok ng tubig at pagkain, at kalauna\'y sa paglilibing.',
      'Agrikultura: dumami ang ani, humantong sa ugnayang pangkalakalan sa Tsina, Arabo, at Islam.'
    ]},
    {h:'Core Population Theory (Felipe Landa Jocano Sr.)', svg:'<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core Population Theory timeline diagram"> <defs> <marker id="arrCP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"> <path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/> </marker> </defs> <g font-family="system-ui,sans-serif"> <circle cx="120" cy="110" r="42" style="fill:var(--card);stroke:var(--accent);stroke-width:3"/> <text x="120" y="106" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Core</text> <text x="120" y="120" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Population</text> <line x1="170" y1="110" x2="235" y2="110" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrCP)"/> <circle cx="290" cy="110" r="58" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="290" y="106" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Growing</text> <text x="290" y="120" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Community</text> <line x1="355" y1="110" x2="415" y2="110" style="stroke:var(--accent);stroke-width:3" marker-end="url(#arrCP)"/> <circle cx="480" cy="110" r="72" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="480" y="105" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Lipunan/</text> <text x="480" y="120" text-anchor="middle" font-size="11" font-weight="bold" style="fill:var(--ink)">Rehiyon</text> <rect x="555" y="150" width="130" height="45" rx="8" style="fill:var(--card);stroke:var(--warn);stroke-width:2"/> <text x="620" y="168" text-anchor="middle" font-size="10" font-weight="bold" style="fill:var(--warn)">Tabon Cave</text> <text x="620" y="182" text-anchor="middle" font-size="9" style="fill:var(--muted)">(Palawan — Jocano)</text> <rect x="555" y="20" width="130" height="45" rx="8" style="fill:var(--card);stroke:var(--warn);stroke-width:2;stroke-dasharray:4,3"/> <text x="620" y="38" text-anchor="middle" font-size="10" font-weight="bold" style="fill:var(--warn)">Callao Cave</text> <text x="620" y="52" text-anchor="middle" font-size="9" style="fill:var(--muted)">(Cagayan — older!)</text> <text x="120" y="175" text-anchor="middle" font-size="10" font-style="italic" style="fill:var(--muted)">Felipe Landa Jocano Sr.</text> </g> </svg>', b:[
      'Pangunahing pangkat ng tao na unang nanirahan at nag-ugat sa isang lugar.',
      'Sila ang unang komunidad na bumuo ng kultura/tradisyon/paniniwalang naging pundasyon ng pagkakakilanlan ng isang lipunan.',
      'Lumalawak ang populasyon habang nadaragdagan ng bagong miyembro/impluwensya mula sa ibang grupo.',
      'Tabon Cave (Palawan): sentro ng populasyon ng mga unang tao sa Pilipinas ayon kay Jocano; ebidensya ng mahabang proseso ng pag-unlad ng kultura at paglipat ng mga tao.',
      'Karagdagang punto/alternatibong pananaw: napatunayang mas matanda ang Callao Cave (Cagayan) kaysa sa Tabon Cave — hamon ito sa orihinal na teorya kung saan talaga nagmula ang unang populasyon.'
    ]},
    {h:'Epekto ng Migrasyon at Heograpiya', b:[
      'Impluwensya sa kultura: pisikal na kapaligiran (iba\'t ibang wika), kapuluan (sub-kultura), kalakalan (Intsik, Indiyano, Arabo); "there is no one culture in one society."',
      'Sosyo-politikal na epekto: diwa ng rehiyonalismo at seksyonalismo — mahirap bumuo ng nasyonalismo dahil sa arkipelago; heograpikal na paghihiwalay nagpahirap sa mga dayuhang mananakop (hal. Cordillera/Ifugao).',
      'Pag-angkop sa kabuhayan: pangingisda, pagsasaka sa terrace farms, pag-aalaga ng hayop na angkop sa lugar.',
      'Mga suliraning may kinalaman sa heograpiya: climate change, pagkawala ng likas na yaman, polusyon, erosion, urbanisasyon/overpopulation, hazard-prone areas, kakulangan sa transportasyon/imprastraktura, migrasyon.'
    ]}
  ],
  quiz: [
    {q:'Sino ang nagmungkahi ng "Austronesian Out of Taiwan" theory?', c:['Peter Bellwood','Felipe Landa Jocano','Alfred Wegener','Zeus Salazar'], a:0, e:'Si Peter Bellwood ang nagmungkahi ng "Austronesian Out of Taiwan" theory, na nagsasabing mula sa Taiwan nanggaling ang mga Austronesian.'},
    {q:'Saan umabot ang pagkalat ng mga Austronesian people ayon sa teorya?', c:['Hawaii lamang','Madagascar','Australia lamang','Europa'], a:1, e:'Ang pagkalat ng mga Austronesian ay umabot hanggang Madagascar, mula sa Taiwan.'},
    {q:'Ano ang ebidensyang ginagamit para patunayan na nagmula sa Austronesia ang mga Pilipino?', c:['Lengguwahe at mga artifacts tulad ng pottery', 'Larawan lamang', 'Pananamit ngayon', 'Musikang popular'], a:0, e:'Lengguwahe at mga artifacts tulad ng pottery na makikita sa Taiwan, Pilipinas, at Malaysia ang ebidensyang binanggit.'},
    {q:'Ano ang sumunod na hakbang matapos ang "kani-kanyang pagtatanim" sa unti-unting pag-unlad ng mga Austronesian?', c:['Pagiging horti-cultural — pagtatanim para sa permanenteng pagkain', 'Pagbabalik sa pangangaso', 'Pagtigil sa pagsasaka', 'Paglipat sa ibang planeta'], a:0, e:'Mula sa individual na pagtatanim, umunlad ang mga Austronesian tungo sa pagiging horti-cultural, kung saan nagtanim sila para sa permanenteng suplay ng pagkain.'},
    {q:'Anong imbensyon ang mahalaga sa pagluluto, pagtatago, at kalauna\'y sa paglilibing ng mga Austronesian?', c:['Palayok','Bangka','Tela','Kutsilyo'], a:0, e:'Ang palayok ay mahalagang imbensyon na ginamit sa pagluluto, pag-iimbak ng tubig/pagkain, at kalaunan ay sa paglilibing.'},
    {q:'Sino ang nagmungkahi ng Core Population Theory?', c:['Bellwood','Felipe Landa Jocano Sr.','Herodotus','Teodoro Agoncillo'], a:1, e:'Si Felipe Landa Jocano Sr. ang nagmungkahi ng Core Population Theory.'},
    {q:'Ano ang orihinal na ebidensya para sa Core Population Theory?', c:['Tabon Cave (Palawan)','Banaue Rice Terraces','Boxer Codex','Pangea fossils'], a:0, e:'Ang Tabon Cave sa Palawan ang orihinal na binanggit na ebidensya para sa Core Population Theory ni Jocano.'},
    {q:'Anong yungib ang napatunayang mas matanda kaysa sa Tabon Cave, na naghahamon sa orihinal na Core Population Theory?', c:['Callao Cave','Sagada Cave','Banaue Cave','Cordillera Cave'], a:0, e:'Napatunayang mas matanda ang Callao Cave (Cagayan) kaysa sa Tabon Cave, na nagbibigay ng alternatibong pananaw tungkol sa sentro ng unang populasyon.'},
    {q:'Bakit mahirap bumuo ng diwa ng nasyonalismo sa Pilipinas ayon sa sosyo-politikal na epekto ng heograpiya?', c:['Dahil isang solidong lupain lamang ang Pilipinas','Dahil arkipelago ang Pilipinas — hiwa-hiwalay ang mga tao, iba-iba ang kultura','Dahil walang mga Pilipinong historyador','Dahil bawal pag-usapan ang nasyonalismo'], a:1, e:'Dahil arkipelago ang Pilipinas, hiwa-hiwalay ang mga tao at iba-iba ang paniniwala/kultura, mahirap magkaroon ng sense of unity.'},
    {q:'Alin ang HINDI kabilang sa mga dahilan ng migrasyon ng mga Austronesian?', c:['Kasanayan sa paglalayag','Prestihiyo sa pananakop ng lupain','Kakulangan ng interes sa pagsasaka','Tumataas na densidad ng populasyon'], a:2, e:'Ang mga Austronesian ay may kasanayan sa pagsasaka (hindi kakulangan ng interes) na naging bahagi ng dahilan ng kanilang paglipat.'},
    {q:'Ang kasabihang "there is no one culture in one society" ay tumutukoy sa:', c:['Iisa lamang ang kultura sa buong Pilipinas', 'Maraming impluwensyang kultural (Intsik, Indiyano, Arabo, atbp.) ang bumubuo sa lipunan', 'Walang kultura ang Pilipinas', 'Pare-parehong kultura ang lahat ng bansa'], a:1, e:'Ipinapakita nito na ang isang lipunan ay hinuhubog ng maraming impluwensyang kultural mula sa iba\'t ibang bansa/grupo, hindi lang iisa.'},
    {q:'Ano ang naging epekto ng kalakalan sa mga Tsino, Arabo, at Islam sa mga sinaunang Pilipino?', c:['Wala itong naidulot na pagbabago', 'Nakatulong ito sa pag-unlad ng agrikultura at kultura ng mga sinaunang Pilipino', 'Ito ang dahilan ng paghina ng ekonomiya', 'Nagdulot lamang ito ng digmaan'], a:1, e:'Ang kalakalan sa mga Tsino, Arabo, at Islam ay nakatulong sa pag-unlad ng agrikultura at kultura ng mga sinaunang Pilipino.'},
    {q:'Ano ang tinutukoy ng "Sociological Progress" sa pag-unlad ng mga Austronesian?', c:['Ang pagbabago mula sa individual na pagsasaka tungo sa horti-cultural na komunidad', 'Ang pagbuo ng mga pamahalaan', 'Ang pagdating ng mga Espanyol', 'Ang modernisasyon ng lipunan'], a:0, e:'Tinutukoy ng Sociological Progress ang paglipat mula sa kani-kanyang pagtatanim (individual) tungo sa isang mas organisadong, horti-cultural na paraan ng pagsasaka.'},
    {q:'Alin sa sumusunod ang isang halimbawa ng pag-angkop sa kabuhayan ayon sa heograpiya?', c:['Pagsasaka sa terrace farms', 'Pagbili ng gadgets', 'Paggamit ng internet', 'Pagbabago ng relihiyon'], a:0, e:'Ang pagsasaka sa terrace farms ay isang paraan ng pag-angkop sa kabuhayan batay sa heograpiya ng lugar.'},
    {q:'Ano ang tinutukoy ng "Resources/Teknolohiya" na yugto sa pag-unlad ng mga Austronesian?', c:['Pagdiskubre ng apoy at paggamit ng domestic animals', 'Pagdating ng mga Espanyol', 'Paggamit ng kuryente', 'Pagbuo ng unang paaralan'], a:0, e:'Kabilang sa yugtong ito ang pagdiskubre ng apoy at ang paggamit ng domestic animals para sa araw-araw na pangangailangan.'},
    {type:'dual', s1:'Ang Austronesian Out of Taiwan theory ay iminungkahi ni Peter Bellwood.', s2:'Ang Core Population Theory ay iminungkahi ni Felipe Landa Jocano Sr.', a:0, e:'Parehong totoo — magkaiba ang dalawang teoryang ito ng pinagmulan, at magkaiba rin ang nagmungkahi sa bawat isa.'},
    {type:'dual', s1:'Ang Tabon Cave ay ang pinakamatandang ebidensya ng paninirahan ng tao sa Pilipinas.', s2:'Ang Callao Cave ay napatunayang mas matanda kaysa sa Tabon Cave.', a:3, e:'Mali ang Statement 1 (hindi na ito ang "pinakamatanda" dahil sa bagong ebidensya), pero tama ang Statement 2 — mas matanda nga ang Callao Cave.'},
    {type:'dual', s1:'Nagdala ang mga Austronesian ng wika at kultura sa mga lugar na kanilang narating.', s2:'Wala silang naidulot na impluwensya sa teknolohiya ng mga lokal na populasyon.', a:2, e:'Tama ang Statement 1, pero mali ang Statement 2 — nagdala rin sila ng teknolohiya na nakaimpluwensya sa maraming populasyon.'},
    {type:'dual', s1:'Ang palayok ay ginamit lamang para sa pagluluto.', s2:'Ginamit din ang palayok sa pag-iimbak ng tubig at kalaunan sa paglilibing.', a:3, e:'Mali ang Statement 1 (hindi lang pagluluto ang gamit nito), pero tama ang Statement 2 — ginamit din ito sa pag-iimbak at paglilibing.'},
    {type:'dual', s1:'Ang heograpikal na paghihiwalay ng Pilipinas ay nagpadali sa pananakop ng mga dayuhan.', s2:'Nakatulong ang kalakalan sa mga Tsino at Arabo sa pag-unlad ng kultura ng mga sinaunang Pilipino.', a:3, e:'Mali ang Statement 1 (nagpahirap ito, hindi nagpadali, tulad sa Cordillera/Ifugao), pero tama ang Statement 2 — nakatulong nga ang kalakalan sa pag-unlad ng kultura.'}
  ],
  glossary: [
    {term:'Austronesian Out of Taiwan', def:'teorya ni Peter Bellwood — nanggaling sa Taiwan ang mga Austronesian bago kumalat sa Timog-Silangang Asya.'},
    {term:'Core Population Theory', def:'ni Felipe Landa Jocano Sr. — pangunahing grupong unang nanirahan at nag-ugat sa isang lugar.'},
    {term:'Callao Cave', def:'yungib sa Cagayan na napatunayang mas matanda kaysa sa Tabon Cave — hamon sa orihinal na Core Population Theory.'},
    {term:'Horti-cultural', def:'yugto ng pag-unlad kung saan nagtanim ang mga tao para magkaroon ng permanenteng pagkain.'}
  ],
  palace: [
    {stop:'Daungan (Dock)', image:'Isang malaking bangkang Taiwanese ang nakadaong, may mga taong bumababa dala ang binhi ng palay at sanga ng tanim.', fact:'Austronesian Out of Taiwan (Bellwood): mula Taiwan nanggaling ang mga Austronesian, dala ang kaalaman sa pagsasaka.'},
    {stop:'Bakuran ng Palayok', image:'Napakaraming palayok ang nakahanay sa bakuran — ilan ay may pagkain, ilan ay may tubig, at isa ay may inilibing na buto sa ilalim.', fact:'Ang palayok ay ginamit sa pagluluto, pag-iimbak ng tubig/pagkain, at kalaunan sa paglilibing.'},
    {stop:'Yungib sa Palawan', image:'Isang madilim na yungib sa Palawan (Tabon), may mga buto at gamit na nakalatag sa sahig, tila pinabayaan nang matagal.', fact:'Tabon Cave, Palawan — orihinal na ebidensya ng Core Population Theory ni Felipe Landa Jocano Sr.'},
    {stop:'Yungib sa Cagayan', image:'Isang mas malalim at mas madilim na yungib (Callao) na may lumang buto na mas maalikabok pa kaysa sa nakita sa Palawan.', fact:'Callao Cave (Cagayan): napatunayang mas matanda kaysa sa Tabon Cave — hamon sa orihinal na teorya.'},
    {stop:'Krus-daanan (Crossroads)', image:'Maraming daan ang naghahalo-halo sa gitna ng bayan, at bawat isa\'y may ibang wika at bandila.', fact:'Ang arkipelago ay nagresulta sa rehiyonalismo at seksyonalismo — mahirap bumuo ng nasyonalismo.'},
    {stop:'Palengke ng mga Intsik', image:'Isang tindahan ang nagpapalitan ng kabibe at perlas kapalit ng seda at porselana mula sa mga mangangalakal na Tsino.', fact:'Kalakalan sa mga Tsino, Arabo, at Islam: nakatulong sa pag-unlad ng agrikultura at kultura.'},
    {stop:'Basurahan sa Kalye', image:'Mga basurang plastik at usok mula sa pabrika ang bumabara sa isang maliit na sapa.', fact:'Mga suliraning may kinalaman sa heograpiya: climate change, pagkawala ng likas na yaman, polusyon, urbanisasyon.'}
  ]},
  {id:'pk5', title:'5. Ilaya at Ilawod: Mga Katutubong Pamayanan', content:[
    {h:'Ilaya at Ilawod', b:[
      'Mandato ng 1987 Konstitusyon: pagyamanin ang wikang Filipino gamit ang mga katutubong wika.',
      '2 sinaunang pamayanan: Mga Taga-Ilaya at Mga Taga-Ilawod.',
      'Ilaya: upstream, bundok na pinagmulan ng ilog, source of water.',
      'Ilawod: downstream, lugar na binabaan ng ilog mula sa bundok.'
    ]},
    {h:'Mga Grupong Ilaya', b:[
      'Iraya Mangyan: Abra de Ilog, Mamburao, Paluan (Oriental Mindoro); kilala sa paghahabi (bayong, plato, baso).',
      'Panay-Bukidnon/Suludnon: kabundukan ng Panay Island; may tradisyong "Binukot" — kababaihang itinatago mula pagkabata para mapanatili ang kagandahan at maituro ang epiko/kasaysayan ng lahi.',
      'Igorot: Cordilleras, Hilagang Luzon; naniniwala sa Animism (Dios Adi Kaila, Kabunyan, Anitos); may 6 pangunahing ethno-linguistic groups (Bontoc, Ibaloi, Ifugao, Isneg, Kalinga, Kankana-ey); kilala sa Banaue Rice Terraces at Apo Whang-Od (mambabatok).'
    ]},
    {h:'Mga Grupong Ilawod', b:[
      'Moro: mga katutubong Muslim sa Mindanao, Sulu, Palawan; 13 ethnolinguistic groups; pangalan mula sa Espanyol na "Moor."',
      'Badjao: sea dwellers/sea gypsies; Zamboanga at Sulu; sustainable fishing methods; naniniwala sa Animism (espiritu ng karagatan).'
    ]},
    {h:'Lumad (Ilaya at Ilawod)', b:[
      'Bisayan word para sa "native/indigenous"; ginagamit para sa hindi-Muslim, hindi-Kristiyanong etnikong grupo sa Mindanao.',
      'Cotabato Congress (Hunyo 1986): kinilala ang mga Lumad group (Subanen, Blaan, Mandaya, Manobo, T\'boli, atbp.).',
      'Nakatuon sa agrikultura at kalikasan; naniniwala sa Animism; humaharap din sa diskriminasyon at pagkawala ng lupain.'
    ]}
  ], quiz:[
    {q:'Ano ang ibig sabihin ng "Ilaya"?', c:['Downstream','Upstream/bundok na pinagmulan ng ilog','Baybayin','Kapatagan'], a:1, e:'Ang Ilaya ay tumutukoy sa upstream — ang bundok na pinagmulan ng ilog, source of water.'},
    {q:'Ano ang ibig sabihin ng "Ilawod"?', c:['Upstream','Downstream — lugar na binabaan ng ilog mula sa bundok','Gitna ng bundok','Pinakamataas na bahagi ng bundok'], a:1, e:'Ang Ilawod ay tumutukoy sa downstream — lugar na dinadaanan/binabaan ng ilog mula sa bundok.'},
    {q:'Ano ang tradisyong "Binukot" ng Panay-Bukidnon?', c:['Isang uri ng pagkain','Kababaihang itinatago mula pagkabata upang mapanatili ang kagandahan at kadalisayan','Isang uri ng bahay','Isang ritwal sa digmaan'], a:1, e:'Ang Binukot ay tradisyon kung saan itinatago ang kababaihan mula pagkabata upang mapanatili ang kagandahan at maituro sa kanila ang epiko/kasaysayan ng kanilang lahi.'},
    {q:'Alin sa mga sumusunod ang isa sa 6 pangunahing ethno-linguistic groups ng Igorot?', c:['Ifugao','Badjao','Moro','Lumad'], a:0, e:'Ang Ifugao ay isa sa 6 pangunahing ethno-linguistic groups ng Igorot, kilala sa Banaue Rice Terraces.'},
    {q:'Sino ang kilalang mambabatok (traditional tattoo artist) na binanggit sa notes?', c:['Lucia Caballero','Apo Whang-Od','Datu Mabanhaw','Zeus Salazar'], a:1, e:'Si Apo Whang-Od ang kilalang oldest mambabatok (pamamaraan ng paglalagay ng tattoo) na binanggit sa notes.'},
    {q:'Ang termino bang "Moro" ay nagmula saan?', c:['Salitang Tagalog','"Moor" (Espanyol) mula sa "Mauru" (Latin)','Salitang Ingles','Salitang Intsik'], a:1, e:'Ang "Moro" ay nagmula sa salitang Espanyol na "Moor," na nagmula naman sa Latin na "Mauru."'},
    {q:'Ang Badjao ay kilala rin bilang:', c:['Mountain dwellers','Sea gypsies/sea dwellers','Forest guardians','Urban settlers'], a:1, e:'Ang Badjao ay kilala bilang sea dwellers, sea tribes, fisher folks, sea gypsies, o sea guardians.'},
    {q:'Ang Cotabato Congress noong Hunyo 1986 ay ginanap para sa:', c:['Pagtatalaga ng bagong pangulo','Pagkilala at pagtala sa mga pangkat etniko (Lumad, Bangsa Moro, Mindanaon, Christian)','Pagbabawal sa Animism','Pagtatayo ng bagong lungsod'], a:1, e:'Ang Cotabato Congress ay para matukoy, maisa-isa, at maitala ang mga pangkat etniko sa Mindanao.'},
    {q:'Saan matatagpuan ang mga Iraya Mangyan?', c:['Cordillera','Abra de Ilog, Mamburao, Paluan (Oriental Mindoro)','Zamboanga','Sulu'], a:1, e:'Ang mga Iraya Mangyan ay matatagpuan sa Abra de Ilog, Mamburao, at Paluan sa Oriental Mindoro.'},
    {q:'Ano ang pangunahing kabuhayan/kasanayan ng mga Iraya Mangyan?', c:['Paghahabi (bayong, plato, baso)','Pangingisda','Pagmimina','Paglalayag'], a:0, e:'Ang mga Iraya Mangyan ay kilala sa paghahabi ng bayong, plato, at baso.'},
    {q:'Ang Panay-Bukidnon/Suludnon ay matatagpuan sa:', c:['Kabundukan ng Panay Island','Cordilleras','Zamboanga','Palawan'], a:0, e:'Ang mga Panay-Bukidnon o Suludnon ay matatagpuan sa kabundukan ng Panay Island.'},
    {q:'Saan matatagpuan ang mga Igorot?', c:['Cordilleras, Hilagang Luzon','Visayas','Mindanao','Palawan'], a:0, e:'Ang mga Igorot ay matatagpuan sa Cordilleras, sa Hilagang Luzon.'},
    {q:'Ano ang paniniwala ng mga Igorot?', c:['Kristiyanismo lamang','Animism (Dios Adi Kaila, Kabunyan, Anitos)','Islam','Wala silang paniniwala'], a:1, e:'Naniniwala ang mga Igorot sa Animism — kabilang ang Dios Adi Kaila, Kabunyan, at Anitos.'},
    {q:'Saan matatagpuan ang mga Moro?', c:['Mindanao, Sulu, Palawan','Cordillera','Bicol','Visayas'], a:0, e:'Ang mga Moro ay matatagpuan sa Mindanao, Sulu, at Palawan.'},
    {q:'Ilang ethnolinguistic groups mayroon ang Moro?', c:['5','8','13','20'], a:2, e:'May 13 ethnolinguistic groups ang mga Moro.'},
    {q:'Saan matatagpuan ang mga Badjao?', c:['Zamboanga at Sulu','Ilocos','Bicol','Cordillera'], a:0, e:'Ang mga Badjao ay matatagpuan sa Zamboanga at Sulu, at kilala bilang sea dwellers.'},
    {q:'Ano ang paniniwala ng mga Badjao?', c:['Kristiyanismo','Animism (espiritu ng karagatan)','Islam lamang','Walang relihiyon'], a:1, e:'Naniniwala ang mga Badjao sa Animism — partikular sa mga espiritu ng karagatan.'},

  {
  id: 'pk6',
  title: '6. Pilosopiya ng Kasaysayan at Karagdagang Konsepto',
  content: [
    {h:'Mga Pananaw at Pilosopiya sa Pag-aaral ng Kasaysayan', b:[
      'Noong ika-19 siglo, malinaw ang "hati-hating gawain" (division of labor) sa pagitan ng mga historyador at pilosopo. Noong ika-20 siglo, nagkaroon ng pagkakaunawaan sa pagitan nila — layunin ay ang pag-unawa sa "konsepto at estruktura ng makasaysayang pagsusuri."',
      'Progressive/Linear: ipinapakita na ang kasaysayan ay umuunlad at sumusulong nang tuwid o diretsong linya; ginagamit upang ipaliwanag ang ideya ng pag-unlad.',
      'Cyclical: naniniwala na ang kasaysayan ay umiikot at inuulit, gaya ng siklo ng panahon — hal. ang pagbagsak at muling pag-angat ng mga imperyo/kaharian.',
      'Open-ended/Contingent: ipinapakita na ang kasaysayan ay hindi tiyak o nakatakda; nakadepende sa mga pangyayari, desisyon, at pagkakataon — maaaring magbago ang takbo nito dahil sa mga hindi inaasahang pangyayari.',
      'Interpretive/Hermeneutic: nakatuon sa pagbibigay-kahulugan at pagsusuri sa mga pangyayari at teksto; ginagamit ng mga historyador sa pagsusuri ng dokumento, akda, o testimonya upang maintindihan hindi lang ang nangyari kundi ang kahulugan nito.'
    ]},
    {h:'Historiograpiya: Higit pa sa "Ano ang Nangyari"', b:[
      'Ang Historiograpiya ay hindi lamang tungkol sa kung ano ang nangyari sa kasaysayan, kundi pati kung paano natin ito nalaman, at kung paano ito ipinaliwanag ng iba\'t ibang historyador.',
      'Tinutukoy nito kung paano isinusulat ang kasaysayan — kabilang ang mga pamamaraan, interpretasyon, at paggamit ng mga sanggunian.',
      'Sa madaling salita, sinasagot ng Historiograpiya ang: Ano ang nangyari? Bakit ito nangyari? Ano ang aral?'
    ]},
    {h:'Zeus Salazar: Tatlong Pananaw sa Pagsulat ng Kasaysayan', svg:'<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zeus Salazar\'s three pananaw diagram"> <g font-family="system-ui,sans-serif"> <text x="310" y="30" text-anchor="middle" font-size="14" font-weight="bold" style="fill:var(--ink)">Zeus Salazar: Tatlong Pananaw</text> <circle cx="310" cy="120" r="70" style="fill:var(--card);stroke:var(--accent);stroke-width:3"/> <text x="310" y="112" text-anchor="middle" font-size="13" font-weight="bold" style="fill:var(--ink)">Pantayong</text> <text x="310" y="130" text-anchor="middle" font-size="13" font-weight="bold" style="fill:var(--ink)">Pananaw</text> <text x="310" y="148" text-anchor="middle" font-size="9" style="fill:var(--muted)">lahat ng Pilipino</text> <circle cx="150" cy="290" r="60" style="fill:var(--card);stroke:var(--accent2);stroke-width:2"/> <text x="150" y="284" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Pangkaming</text> <text x="150" y="301" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Pananaw</text> <text x="150" y="317" text-anchor="middle" font-size="9" style="fill:var(--muted)">"kami, hindi kayo"</text> <circle cx="470" cy="290" r="60" style="fill:var(--card);stroke:var(--warn);stroke-width:2"/> <text x="470" y="284" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Pansilang</text> <text x="470" y="301" text-anchor="middle" font-size="12" font-weight="bold" style="fill:var(--ink)">Pananaw</text> <text x="470" y="317" text-anchor="middle" font-size="9" style="fill:var(--muted)">mga dayuhan</text> <line x1="270" y1="170" x2="190" y2="240" style="stroke:var(--border);stroke-width:2"/> <line x1="350" y1="170" x2="430" y2="240" style="stroke:var(--border);stroke-width:2"/> <line x1="210" y1="290" x2="410" y2="290" style="stroke:var(--border);stroke-width:2"/> </g> </svg>', b:[
      'Pantayong Pananaw: isinasangkot/isinasaalang-alang ang LAHAT ng Pilipino sa pagsulat ng kasaysayan — ito ang pinaka-nais na paraan ni Salazar; "para sa atin, ng atin, mula sa atin" (for us, by us, among us).',
      'Pangkaming Pananaw: iilan lamang ang kasama o isinasaalang-alang — "kami, hindi kayo."',
      'Pansilang Pananaw: mga dayuhan (outsiders) ang gumagawa/nagsusulat ng kasaysayan tungkol sa atin; kahit gamitin ito, dapat manatiling nasa loob ng pananaw na "Pansila" lamang (hindi ipinapalit sa Pantayo).'
    ]},
    {h:'Florentino Hornedo: Cognitive History', b:[
      'Cognitive History: isang teorya na nakabatay sa pananaw na ang tao ay nakikibahagi sa lipunan at kultura sa pamamagitan ng kanyang pag-iisip, pag-unawa, at pagbibigay-kahulugan.',
      'Ang kaalaman ay hindi lamang basta impormasyon, kundi isang pagpapakahulugan (meaning-making).',
      'Natututo ang tao hindi lamang dahil sa pag-iimbak ng datos, kundi dahil sa kanyang kakayahang magbigay ng kabuluhan sa mga karanasan at simbolo sa loob ng lipunan.',
      'Dahil dito, ang edukasyon at kultura ay hindi hiwalay — sa pamamagitan ng isip at wika, hinuhubog ng tao ang kanyang pagkatao at pagkakakilanlan.',
      'Kahalagahan: ipinapakita ni Hornedo na ang pagkatuto ay isang aktibong proseso na nakaugat sa kultura, tradisyon, at tao — ang tunay na edukasyon ay hindi lamang pagsasaulo ng datos, kundi pag-unawa at pagpapahalaga sa kabuluhan ng kaalaman sa buhay at lipunan.'
    ]},
    {h:'Araling Panlipunan at Critical Thinking', b:[
      'Araling Panlipunan (AP)/Social Studies: pag-aaral ng mga indibidwal, komunidad, sistema, at ang kanilang ugnayan sa paglipas ng panahon.',
      'Layunin: siyasatin ang malawak na karanasan ng sangkatauhan — pagsusuri sa nakaraan, pakikilahok sa kasalukuyan, at paghubog ng kinabukasan.',
      'Bilang mga mag-aaral at historyador, hinihikayat tayong linangin ang mga Key Critical Thinking Skills: Inference, Open-mindedness, Communication, Analysis, Problem-solving, at Evaluation.'
    ]}
  ],

{id:'effcom1', name:'EffCom1: Effective Communication', lessons:[
  {id:'ec1', title:'1. Communication: An Overview', content:[
    {h:'Communication', b:[
      'A two-way process between a sender and a receiver.',
      'Sharing of meaning by sending and receiving social cues (e.g. someone waves at you).',
      'A dynamic process in which people attempt to share their internal states with other people through the use of symbols (letters/words).',
      '"Dynamic" means it varies from person to person, situation to situation.'
    ]},
    {h:'Basic Forms of Communication', b:[
      'Verbal: as long as you use words — speaking, writing, texting. Rule-specific (grammar) and almost always planned.',
      '4 macroskills of language (verbal): Speaking, Writing, Listening, Reading.',
      'Non-verbal: the total opposite of verbal — spontaneous and unstructured.',
      'Examples of non-verbal: Facial Expressions, Gestures, Body Language, Proxemics, Paralinguistics, Eye gaze, Haptics, Appearance, and Chronemics.',
      'Proxemics zones: Intimate (1-1.5 ft), Personal (1.5-4 ft), Social (4-12 ft), Public (12+ ft).',
      'Paralinguistics: pitch, volume, tone, intonation, rhythm, silence — "it\'s not what you say, it\'s how you say it."',
      'Chronemics: how a culture uses time. Monochronic (M-time): time is linear/limited, punctuality = respect (e.g. US, Germany, Switzerland). Polychronic (P-time): time is fluid, relationships matter more than the clock, being "late" can be acceptable (e.g. Philippines, Latin America, Middle East).'
    ]},
    {h:'Improving Verbal Communication', b:[
      'Appropriateness — right term at the right time, context is everything.',
      'Brevity — keep it short and simple.',
      'Clarity — be understandable.',
      'Ethics — apply G.R.E.E.P.S: Gender, Roles, Ethnicity, Experience, Preferences, Status.',
      'Vividness — try to use the exact/concrete words.'
    ]},
    {h:'The 9 C\'s of Communication', b:[
      'Congruency: verbal and non-verbal cues align, avoid mixed signals.',
      'Conciseness: brief but meaningful, remove unnecessary words.',
      'Clarity: avoid vagueness, make the message specific and direct.',
      'Consistency: repeat important messages the same way each time.',
      'Considering your Audience: know their background/needs, adjust tone/vocabulary; ideally through Audience Analysis — gathering as much information as possible about your intended receivers.',
      'Content: value the substance of your message; be well-equipped with all the information needed for it to be complete, accurate, and substantial.',
      'Checking for Understanding: specifically the sender\'s job — verify the audience grasped the message, via clarifying questions or feedback.',
      'Choosing the Right Medium: select the best channel/medium for the situation and audience; can be evaluated using the Media Richness Theory — 5 criteria: (1) Permanence (how long the medium stores the exchange), (2) Urgency of Feedback (how fast the receiver can respond), (3) Privacy (how well it keeps the exchange private), (4) Formality (how seriously the message will be taken), (5) Cost (how expensive the medium is to use — the MORE expensive, the LESS effective it\'s perceived to be).',
      'Common Language: use language your audience understands, avoid unnecessary jargon — "express, not impress."'
    ]}

  {id:'ec2', title:'2. Speech Styles & Communication Styles', content:[
    {h:'The 5 Speech Styles (I Can Count Five Fingers)', b:[
      'Intimate: private relationship; interlocutors have their own way of communicating only they understand (e.g. pet names, code names for crushes).',
      'Casual: friends/acquaintances; relaxed grammar, possibly incomplete sentences (e.g. chatting with besties).',
      'Consultative: professional transaction; one party is the expert the other seeks advice from (e.g. doctor-patient, teacher-student consultation).',
      'Formal: follows conventions/structure/rules of grammar and politeness (e.g. thesis defense, court statement).',
      'Frozen: most rigid/formal; message is non-negotiable, lacks personal interaction (e.g. Miranda Rights, oaths, pageant mottos).',
      'Mnemonic: I Can Count Five Fingers = Intimate, Casual, Consultative, Formal, Frozen.',
      'You are not limited to one speech style per relationship — you can shift styles even with a formal/consultative relationship if rapport allows.'
    ]},
    {h:'Historical Linguistics (Language Change)', b:[
      'Language is a living organism — it\'s born, matures, and can eventually "die" or transform.',
      'Social prestige: people adopt words used by those they admire (e.g. mimicking influencers/celebrities).',
      'Inventions: new things need new words (e.g. "computer," "selfie," "groufie").',
      'Practicality: humans shorten words to make communication easier (e.g. refrigerator → fridge, television → TV).',
      'Imperfect learning: misinterpretation/misuse of a word that becomes standard (e.g. "salvage" in the Philippines during Martial Law came to mean "to kill," opposite of its dictionary meaning "to save").',
      'Language is forever fluid — the speech styles used today could change in the future.'
    ]},
    {h:'Communication Styles: How We Express Ourselves', b:[
      'Communication Styles are distinct from Speech Styles — they describe the WAY individuals express their thoughts, feelings, and intentions during interaction (what is said AND how it\'s delivered), rather than a level of formality.',
      'Assertive: clearly expresses opinions while remaining considerate of others; widely considered the MOST effective style. Mindset: "I win, you win."',
      'Passive: does not express one\'s own opinions, puts others first, to avoid conflict or maintain harmony. Mindset: "I lose, you win."',
      'Aggressive: direct in expressing opinions, but gives no thought to other people, often with a loud/forceful tone. Mindset: "I win, you lose."',
      'Passive-Aggressive: indirectly expresses opinions, shows no real respect for others; avoids direct confrontation but still communicates dissatisfaction (e.g. sarcasm, the silent treatment). Mindset: "I win (indirectly), you lose."'
    ]}

    {q:'The word "salvage" taking on the meaning "to kill" in the Philippines during Martial Law is an example of language change through:', c:['Social prestige','Inventions','Imperfect learning','Practicality'], a:2, e:'This is a classic example of imperfect learning — a misuse/misinterpretation of a word (opposite of its dictionary meaning) that became standard usage.'},
    {q:'Shortening "refrigerator" to "fridge" is an example of language change through:', c:['Social prestige','Practicality','Imperfect learning','Inventions'], a:1, e:'Practicality drives humans to shorten words to make communication easier and faster.'},
    {q:'Adopting a new slang word because a favorite influencer uses it is an example of language change through:', c:['Social prestige','Practicality','Inventions','Imperfect learning'], a:0, e:'Social prestige reflects the human tendency to associate with and imitate people we admire, including their word choices.'},
    {q:'Which of the following is different from a "Speech Style" in that it describes the WAY a person expresses thoughts/feelings, rather than a level of formality?', c:['Frozen Style','Communication Style','Consultative Style','Formal Style'], a:1, e:'Communication Styles (Assertive, Passive, Aggressive, Passive-Aggressive) describe HOW a person expresses themselves, distinct from the formality-based Speech Styles.'},

    {q:'Which communication style avoids expressing one\'s own opinions and puts others first to avoid conflict ("I lose, you win")?', c:['Assertive','Passive','Aggressive','Passive-Aggressive'], a:1, e:'The Passive style avoids expressing personal opinions, prioritizing others\' needs to maintain harmony, even at one\'s own expense.'},

  {id:'ec3', title:'3. Communication Functions', content:[
    {h:'The 5 Communication Functions', b:[
      'Regulation/Control: wanting others to manage their behavior or do things as we please. Examples: a teacher giving students instructions on what to do in a performance task, a referee blowing his whistle as a go-signal for a volleyball player to serve, a publisher reminding an author of her deadline for a book project, a child displaying tantrums in the mall so his parents would buy him his favorite toy, a doctor requiring the nurse to monitor a patient\'s heartbeat rate.',
      'Social Interaction: wanting to form bonds or forge a deeper connection with others. Examples: classmates sharing secrets about their new crushes, a coworker sitting with a newly hired employee to ask about their previous job, construction workers during lunchtime discussing last night\'s favorite shows, teachers in the faculty lounge sharing funny classroom experiences, two complete strangers forced to talk because they share the same table in a fastfood chain.',
      'Motivation: wanting to persuade, convince, or inspire someone. Examples: a credit card agent approaching random people in the mall to encourage them to avail of a promo, a pharmacist trying to make a customer buy a cheaper but better-quality medicine, a sales agent enticing a prospect customer into buying and trying their latest product, a coach influencing an athlete to continue his scholarship in the same university instead of transferring, a guidance counselor going to different schools to promote the university.',
      'Emotional Expression: wanting to appeal to someone\'s sense of sympathy. Examples: a student asking for an extension of deadline for a major requirement, a patient appealing to the doctor to waive his professional fee to lessen hospital expenses, street children begging for food from passersby, an accused pleading not guilty in court and using poverty as an excuse for committing a crime, an employee who has just been terminated requesting for another chance.',
      'Information (Referential): sharing pieces of information from verifiable sources. Examples: updating classmates about a new Zika virus threat in the Philippines, a president announcing in a press briefing the list of officials involved in an issue, the DOH reporting a decrease in casualties related to a holiday celebration, a teacher introducing a new concept in class, NASA announcing the discovery of a new habitable planet closest to Earth.'
    ]},
    {h:'Primary vs. Secondary Communication Function', b:[
      'Primary function: your real agenda or goal in the interaction.',
      'Secondary function: another function you use in order to achieve your primary function.',
      'Example 1: asking your parents for money (Regulation/Control = primary) by first informing them about the graduation ball (Information = secondary).',
      'Example 2: telling your teacher you qualified for a tournament abroad may look like the Information function at first; but if your real intent is to be excused for the time you were absent while applying, your primary function is actually Regulation/Control, and Information becomes your secondary function.',
      'In real-life conversations, we often engage people using more than one communication function at the same time.'
    ]},
    {h:'Other Named Functions', b:[
      'Informative: common when the people involved are of EQUAL rank/status (e.g. classmate to classmate).',
      'Instructive: used when the people involved are of UNEQUAL rank/status (e.g. teacher to student, doctor to patient).',
      'Persuasion: goal is to change the opinion of the other person.',
      'Aesthetic: achieved when there is a deeper connection between sender and receiver (e.g. pursuing a crush).',
      'Therapeutic: end goal is to make the other person\'s feelings much better (giving comfort/encouragement) — distinct from Emotional Expression, which is about appealing to feelings rather than soothing them.',
      'Discussion/Argumentation: a healthy exchange of ideas, working toward a solution (e.g. a debate, a group brainstorming session).',
      'Cultural Promotion: communicating in order to understand a person from a different cultural background.'
    ]}

    {q:'In the example of asking parents for graduation ball money by first sharing details about the event, which is the PRIMARY function and which is SECONDARY?', c:['Primary: Information, Secondary: Regulation/Control','Primary: Regulation/Control, Secondary: Information','Both are Primary','Neither has a primary/secondary distinction'], a:1, e:'The real agenda (getting money) is Regulation/Control (primary); sharing details about the ball to persuade them is Information (secondary).'},

    {q:'Communication between a teacher and student, where one has more knowledge/authority, is classified as:', c:['Informative','Instructive','Aesthetic','Persuasion'], a:1, e:'Instructive communication occurs between people of unequal rank/status.'},

    {type:'dual', s1:'Regulation/Control is about wanting others to manage their behavior.', s2:'Social Interaction is about wanting to form bonds or connections with others.', a:0, e:'Both statements are true — these are the correct definitions of Regulation/Control and Social Interaction.'},
    {type:'dual', s1:'A doctor requiring a nurse to monitor a patient\'s heartbeat is an example of Motivation.', s2:'A credit card agent encouraging people to avail of a promo is an example of Information.', a:1, e:'Both statements are false — the doctor/nurse example is Regulation/Control, and the credit card agent example is Motivation, not Information.'},
