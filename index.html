    {q:'Peroxisomes produce which byproduct when transferring hydrogen atoms to oxygen?', c:['Carbon dioxide','Hydrogen peroxide (H2O2)','Glucose','ATP'], a:1, e:'Peroxisomes remove hydrogen atoms from substrates and transfer them to O2, producing hydrogen peroxide (H2O2) as a byproduct.'},
    {q:'Which cytoskeleton component is described as the THICKEST, consisting of tiny hollow tubes?', c:['Microfilaments','Microtubules','Intermediate filaments','Cristae'], a:1, e:'Microtubules are the thickest cytoskeletal components, consisting of tiny hollow tubes.'},
    {q:'Which cytoskeleton component is described as the THINNEST, consisting of thin solid fibers?', c:['Microtubules','Intermediate filaments','Microfilaments','Cisternae'], a:2, e:'Microfilaments are the thinnest cytoskeletal components, made of thin solid fibers.'},
    {q:'Centrioles, used for microtubule assembly, are typically found in which type of cell?', c:['Plant cells only','Animal cells (plants usually lack centrioles)','Neither plant nor animal cells','Bacteria only'], a:1, e:'Centrioles are found in animal cells; plant cells have centrosome-like MTOCs but usually lack centrioles.'},
    {q:'Which structure for locomotion is LONGER and typically limited to just one or a few per cell, compared to the other?', c:['Cilia','Flagella','Microvilli','Fimbriae'], a:1, e:'Flagella are longer than cilia and are usually limited to just one or a few per cell, while cilia occur in large numbers.'}
  ], glossary:[
    {term:'Cell Theory (key figures)', def:'Hooke (named "cell"), Leeuwenhoek (animacules), Schwann & Schleiden (cells = basic unit), Virchow (cells from pre-existing cells).'},
    {term:'Nucleoid', def:'unenclosed region in prokaryotes where DNA is concentrated.'},
    {term:'Selective permeability', def:'the membrane allows some substances to cross more easily than others.'},
    {term:'Free vs. Bound Ribosomes', def:'Free — suspended in cytosol; Bound — attached to ER/nuclear envelope.'},
    {term:'Smooth ER / Rough ER', def:'Smooth: lipid synthesis, detoxification; Rough: studded with ribosomes, makes secretory proteins.'},
    {term:'Cis face / Trans face', def:'Golgi apparatus receiving side / dispatching side.'},
    {term:'Cristae', def:'folded inner mitochondrial membrane, increases surface area.'},
    {term:'Amyloplast / Chromoplast', def:'colorless starch-storing plastid / plastid giving fruits/flowers color.'},
    {term:'Cilia vs. Flagella', def:'Cilia: many, short, for locomotion. Flagella: few (1-2), longer, for locomotion.'}
  ]},
{id:'bn3', title:'3. Microscopy', content:[
    {h:'Types of Microscopes', b:[
      'Compound Light Microscope: has ocular lenses (binocular eyepiece) and objective lenses; max total magnification 1000x; BOTH objective and ocular lenses provide magnification.',
      'Stereoscope (Dissecting Microscope): capable of performing dissection; has bigger working space; specimen must be immobilized but can be the ACTUAL specimen; max total magnification 100x.',
      'Electron Microscope: uses a beam of electrons to magnify; high image resolution (magnifies in nanometers); specimens used must be preserved/dead.',
      'Transmission Electron Microscope (TEM): detects electrons that PASSED THROUGH the sample; gives a 2D image.',
      'Scanning Electron Microscope (SEM): detects REFLECTED electrons; gives more detailed images; gives a 3D image.',
      'Atomic Force Microscope: uses a stylus to detect the sample surface; sees the ACTUAL MOVEMENT of the specimen; can use both live AND preserved specimens.',
      'Confocal Microscope: produces an image of a thin plane on a thick specimen; couples a laser source to a fluorescent microscope; widely used in microbial ecology.'
    ]},
    {h:'Parts of a Compound Microscope: Mechanical Parts', b:[
      'Mechanical parts provide support and protection to the microscope.',
      'Base: supports the entire microscope.',
      'Arm: the vertical framework ascending from the base along the back of the microscope.',
      'Revolving nosepiece: holds the objectives in place, allows changing of objectives.',
      'Stage and stage clip: where the glass slide with the specimen is placed.',
      'Coarse adjustment knob: moves the objective closer so magnification can be achieved. Fine adjustment knob: moves the objective closer to the stage so BETTER RESOLUTION can be achieved.'
    ]},
    {h:'Magnifying & Illuminating Parts', b:[
      'Magnifying parts enlarge the produced image. Objective (lens): magnifies the specimen. Ocular/eyepiece: where the specimen is viewed; provides a SMALL amount of magnification (5x-10x).',
      'Illuminating parts transmit light. Iris diaphragm/mirror: adjusts the amount of light passing through the specimen. Light source: provides the light passing through the specimen.'
    ]},
    {h:'Care, Storage & Wet Mount Preparation', b:[
      'Caring for a microscope: hold with both hands (one on the arm, one on the base); clean in a circular motion; use only microscope-intended immersion oil; wipe off oil after using the objective.',
      'Storing a microscope: cover with a dust bag before storing; store in a cool, dry place.',
      'Making a Wet Mount: (1) Collect sample, (2) Add to slide, (3) Place cover slip on sample.'
    ]}
  ], quiz:[
    {q:'What is the maximum total magnification of a Compound Light Microscope?', c:['100x','1000x','10,000x','No limit'], a:1, e:'A Compound Light Microscope has a maximum total magnification of 1000x, achieved through both objective and ocular lenses.'},
    {q:'What is the maximum total magnification of a Stereoscope (dissecting microscope)?', c:['100x','1000x','10x','No limit'], a:0, e:'A Stereoscope has a maximum total magnification of 100x, but allows for dissection with a bigger working space.'},
    {q:'Which type of microscope can use the ACTUAL specimen for dissection?', c:['Compound Light Microscope','Stereoscope','Electron Microscope','Confocal Microscope'], a:1, e:'The Stereoscope allows the actual specimen (immobilized) to be used and dissected under it.'},
    {q:'Specimens used in an Electron Microscope must be:', c:['Alive and moving','Preserved/dead','Transparent only','Colored with dye'], a:1, e:'Electron microscopes require preserved/dead specimens, unlike light microscopes which can observe living samples.'},
    {q:'Which electron microscope detects electrons that PASS THROUGH the sample, giving a 2D image?', c:['SEM','TEM','Atomic Force Microscope','Confocal Microscope'], a:1, e:'The Transmission Electron Microscope (TEM) detects electrons passing through the sample, producing a 2D image.'},
    {q:'Which electron microscope detects REFLECTED electrons, giving a more detailed 3D image?', c:['TEM','SEM','Confocal Microscope','Stereoscope'], a:1, e:'The Scanning Electron Microscope (SEM) detects reflected electrons, giving a detailed 3D image of the surface.'},
    {q:'Which type of microscope uses a stylus to detect the sample surface and can see the ACTUAL MOVEMENT of a specimen?', c:['Confocal Microscope','Atomic Force Microscope','Compound Light Microscope','TEM'], a:1, e:'The Atomic Force Microscope uses a stylus and can observe the actual movement of a specimen, using either live or preserved samples.'},
    {q:'Which type of microscope couples a laser source to a fluorescent microscope, widely used in microbial ecology?', c:['Confocal Microscope','Stereoscope','TEM','Atomic Force Microscope'], a:0, e:'The Confocal Microscope couples a laser source with fluorescence and is widely used in microbial ecology to image thin planes of thick specimens.'},
    {q:'Which mechanical part of a compound microscope holds the objectives in place and allows for changing them?', c:['Base','Arm','Revolving nosepiece','Stage'], a:2, e:'The revolving nosepiece holds the objective lenses and allows the user to switch between them.'},
    {q:'Which adjustment knob moves the objective closer to achieve BETTER RESOLUTION, rather than just magnification?', c:['Coarse adjustment knob','Fine adjustment knob','Iris diaphragm','Ocular lens'], a:1, e:'The fine adjustment knob moves the objective closer to the stage to achieve better resolution, as opposed to the coarse knob which is used for basic magnification/focus.'},
    {q:'How much magnification does the ocular/eyepiece typically provide?', c:['1x-2x','5x-10x','100x-500x','1000x+'], a:1, e:'The ocular/eyepiece typically provides a small amount of magnification, around 5x to 10x.'},
    {q:'Which illuminating part allows the user to adjust the amount of light passing through the specimen?', c:['Light source','Iris diaphragm/mirror','Objective lens','Revolving nosepiece'], a:1, e:'The iris diaphragm/mirror is used to adjust the amount of light that passes through the specimen.'},
    {q:'When caring for a microscope, how should it be held?', c:['With one hand only, on the base','With both hands, one on the arm and one on the base','By the ocular lens only','By the stage clip only'], a:1, e:'Proper microscope handling requires both hands — one supporting the arm and one supporting the base.'},
    {q:'How should a microscope be stored when not in use?', c:['Uncovered, in direct sunlight','Covered with a dust bag, in a cool dry place','Submerged in immersion oil','Left on the stage with a slide in place'], a:1, e:'A microscope should be covered with a dust bag and stored in a cool, dry place to protect it from damage.'},
    {q:'What is the correct order of steps for making a wet mount?', c:['Place cover slip → Collect sample → Add to slide','Collect sample → Add to slide → Place cover slip on sample','Add to slide → Collect sample → Place cover slip','Place cover slip → Add to slide → Collect sample'], a:1, e:'The correct order for a wet mount is: Collect sample, Add to slide, then Place cover slip on sample.'}
  ], glossary:[
    {term:'Compound Light Microscope', def:'ocular + objective lenses; max 1000x magnification.'},
    {term:'Stereoscope (Dissecting Microscope)', def:'for dissection; can use the actual specimen; max 100x.'},
    {term:'TEM', def:'Transmission Electron Microscope — detects electrons passing through the sample; 2D image.'},
    {term:'SEM', def:'Scanning Electron Microscope — detects reflected electrons; 3D image.'},
    {term:'Atomic Force Microscope', def:'uses a stylus; sees actual specimen movement; live or preserved.'},
    {term:'Confocal Microscope', def:'laser + fluorescent microscope; images thin planes of thick specimens.'},
    {term:'Coarse vs. Fine adjustment knob', def:'Coarse — for magnification/focus; Fine — for better resolution.'}
  ]}
]},
{id:'funfaith', name:'FunFaith: Religion', lessons:[
  {id:'ff1', title:'1. Divine Revelation', content:[
    {h:'Revelation', b:[
      'Revelare: to lift the veil, to disclose, to uncover.',
      'God, out of His infinite love for humankind, decided to make Himself known to us (1 John 4:7-21).',
      'The ultimate purpose of God\'s free act of self-disclosing to us is nothing else but salvation.',
      'With his whole being, man gives his assent to God the revealer.',
      'God\'s Love in Revelation: God\'s personal loving communication of who He is and His plan to save us all in His love — God reaching out to us in friendship.'
    ]},
    {h:'Our Human Limitation & Language', b:[
      'St. Thomas Aquinas: "There is nothing in the mind that is not first in the senses" — all human knowledge originates from sensory experience.',
      '1 John 4:12: "No one has ever seen God..." — God is a Spirit, a Mystery, and cannot be perceived by the senses.',
      'God\'s love can be seen/experienced through the love shown between believers (love as reflection of God, evidence of His presence).',
      'Language about God is analogical and symbolic, since language is a product of human sensory experience.',
      'Anthropomorphism: Anthropos (man) + morphe (form) — attribution of human qualities to non-human beings, including God.'
    ]},
    {h:'Image of God', b:[
      'Images are signs that point to a greater reality; they have both strengths and limitations, and can be misleading or manipulated.',
      'We cannot do away with images — they\'re all we\'ve got.',
      'God is a Mother: Positive — makes God approachable, caring, loving. Negative — may weaken God\'s image due to negative feminine attributes from patriarchal cultural conditioning.',
      'God is a Friend: Positive — shows God\'s immanence, involvement in daily life. Negative — may cause over-familiarity, lack of reverence.'
    ]},
    {h:'4 Types of Revelation', b:[
      'Natural Revelation: knowing God through the created world; we are stewards of God\'s creation, invited to give praise and glory for His generosity.',
      'Special Revelation: "supernatural revelation," unknown without God\'s intervention through chosen messengers; St. Thomas equates this with the Bible.',
      'Private Revelation: apparitions/mystical experiences, examined by the Magisterium based on Public Revelation, offering guidance (e.g. Our Lady of Fatima, 1917, to three shepherd children).',
      'Public Revelation: revelation of God through Jesus Christ; imposes obligation of faith, final and complete; invites us to be Christ-centered.',
      'The Challenge Before Us: revelation invites us to KNOW Him more clearly (reading the Bible), LOVE Him more deeply (practicing Charity), WORSHIP Him more sincerely (responding to His revelation).'
    ]}
  ], quiz:[
    {q:'What does "Revelare" mean?', c:['To hide, to conceal','To lift the veil, to disclose, to uncover','To worship','To condemn'], a:1, e:'"Revelare" means to lift the veil, to disclose, to uncover — the root of the English word "revelation."'},
    {q:'According to St. Thomas Aquinas, all human knowledge and concepts originate from:', c:['Divine intervention alone','Sensory experience','Pure reason with no senses needed','Instinct'], a:1, e:'St. Thomas Aquinas taught "there is nothing in the mind that is not first in the senses" — knowledge originates from sensory experience.'},
    {q:'Which type of revelation is equated with the Bible by St. Thomas?', c:['Natural','Special','Private','Public'], a:1, e:'Special Revelation, described as "supernatural revelation," is equated by St. Thomas with the Bible.'},
    {q:'The apparition of the Virgin Mary at Fatima in 1917 is an example of which type of revelation?', c:['Natural','Special','Private','Public'], a:2, e:'The Fatima apparition to three shepherd children is a classic example of Private Revelation, examined by the Magisterium.'},
    {q:'Which type of revelation is described as "final and complete in the person of Jesus" and imposes an obligation of faith?', c:['Natural','Special','Private','Public'], a:3, e:'Public Revelation, through Jesus Christ, is final and complete, and imposes the obligation of faith on all believers.'},
    {q:'Attributing human qualities to non-human beings, including God, is called:', c:['Anthropomorphism','Theomorphism','Iconography','Personification only'], a:0, e:'Anthropomorphism (Anthropos = man, morphe = form) is the attribution of human qualities to non-human beings, including God.'},
    {q:'The "Positive" aspect of the "God is a Mother" image is that it:', c:['Makes God more approachable, caring, and loving','Weakens God\'s image entirely','Has no positive aspect','Only applies to non-Christians'], a:0, e:'Describing God as a Mother positively makes Him more approachable and presents Him as caring and loving.'},
    {q:'A potential negative of the "God is a Friend" image is that it may lead to:', c:['Increased reverence','Over-familiarity and a lack of reverence','Complete rejection of God','Better understanding of the Trinity'], a:1, e:'Describing God as a Friend can risk over-familiarity, potentially leading to a lack of reverence.'},
    {q:'The three-part challenge from Divine Revelation is to KNOW, LOVE, and:', c:['Fear Him','Worship Him more sincerely','Avoid Him','Question Him'], a:1, e:'The three challenges are to KNOW God more clearly, LOVE Him more deeply, and WORSHIP Him more sincerely.'},
    {q:'"KNOW" as part of the 3-part challenge specifically entails:', c:['Practicing Charity','Reading the Bible','Attending daily Mass only','Avoiding Church teaching'], a:1, e:'KNOW entails reading the Bible to grow in clearer knowledge of God.'}
  ], glossary:[
    {term:'Revelare', def:'Latin: to lift the veil, to disclose, to uncover.'},
    {term:'Anthropomorphism', def:'Anthropos (man) + morphe (form) — attribution of human qualities to non-human beings, including God.'},
    {term:'Natural Revelation', def:'knowing God through the created world.'},
    {term:'Special Revelation', def:'"supernatural revelation," equated with the Bible.'},
    {term:'Private Revelation', def:'apparitions/mystical experiences, examined by the Magisterium.'},
    {term:'Public Revelation', def:'revelation through Jesus Christ; final, complete, imposes obligation of faith.'}
  ]},
  {id:'ff2', title:'2. Transmission of Faith', content:[
    {h:'Faith', b:[
      '"Fides" (Latin): trust, loyalty. Ob-Audire: obedience, to hear or to listen.',
      'Faith is a virtue and a gift — submitting freely to the word as its truth is guaranteed by God.',
      'The nature of faith is in the conscience, but not coerced; unmerited, given from the goodness of the giver.',
      '5 Characteristics of Faith: Total and Absolute (like Christ\'s Passion/Death/Resurrection), Trinitarian (belief in Father, Son, Holy Spirit), Loving/Maturing/Missionary (bearing witness), Informed and Communitarian (via Scripture/Tradition), Inculturated (lived in daily relationships).'
    ]},
    {h:'The Great Commissioning', b:[
      'Matthew 28:16-20: "All authority in heaven and on earth has been given to me. Therefore, go make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit."',
      'St. Peter: "And I tell you that you are Peter, and on this rock, I will build my Church" — first Pope, commissioned the apostles to continue Christ\'s mission.',
      'Apostles fulfilled their mission through oral preaching, examples, and observances handed on by Christ.',
      'Lt. Tradare: to pass on, to hand over — initially shared through Oral Tradition, eventually some put into Written Tradition.'
    ]},
    {h:'Sacred Tradition: Deposit of Faith', b:[
      'Doctrinal Traditions: the LIVING and LIVED faith of the Church — can NEVER be changed/modified without harming the integrity of the Christian Faith.',
      'Dei Verbum: Sacred Tradition and Sacred Scripture form ONE sacred deposit of the Word of God, committed to the Church — they are inseparable.',
      'Sola Scriptura (Reformers): "scripture only" — the Bible, not tradition or the Church, is the final authority; the Bible itself (John 20:30) shows this is incomplete, since not everything Jesus did was recorded.',
      'Sacred Scripture originated from Oral Tradition; not all Tradition was written down — the Bible does not contain the entire revelation, and Tradition continues in the life of the Church.'
    ]},
    {h:'The Tripod of Catholic Faith', b:[
      'Sacred Tradition: the living transmission of the Gospel message, passed down through apostles/bishops.',
      'Sacred Scripture: the Bible, inspired by the Word of God.',
      'Magisterium: the Church\'s teaching authority, entrusted to the Pope and bishops, responsible for interpreting and safeguarding revealed truth.',
      'Interconnectedness: the three elements work together, supporting and enriching each other, guided by the Holy Spirit — e.g. Trinity, infant baptism, Bible inerrancy, purgatory, Mary\'s perpetual virginity are most clearly taught through Tradition, though implicitly present in the Bible.'
    ]}
  ], quiz:[
    {q:'What does the Latin word "Fides" mean?', c:['Fear','Trust, loyalty','Sacrifice','Command'], a:1, e:'"Fides" is Latin for trust, loyalty — the root of the word "faith."'},
    {q:'Which characteristic of faith describes belief in Father, Son, and Holy Spirit?', c:['Total and Absolute','Trinitarian','Inculturated','Informed and Communitarian'], a:1, e:'The Trinitarian characteristic describes faith as a personal conviction in God the Father, revealed by Jesus Christ, and present through the Holy Spirit.'},
    {q:'Which characteristic of faith describes it as lived in daily relationships like family and friends?', c:['Total and Absolute','Loving, Maturing, Missionary','Inculturated','Trinitarian'], a:2, e:'Inculturated faith is lived out in daily relationships — family, friends, classmates.'},
    {q:'Who is described as the first Pope of the Church?', c:['St. Paul','St. Peter','St. John','St. Thomas'], a:1, e:'St. Peter was the first Pope, commissioned by Christ to continue His mission of sharing the message of salvation.'},
    {q:'What does the Latin term "Tradare" mean?', c:['To pass on; to hand over','To write down','To baptize','To worship'], a:0, e:'"Tradare" means to pass on or hand over — the root of the word "tradition."'},
    {q:'According to Dei Verbum, Sacred Tradition and Sacred Scripture:', c:['Are two separate, competing sources','Form ONE sacred deposit of the Word of God','Have no relationship to each other','Are only relevant to bishops'], a:1, e:'Dei Verbum states that Sacred Tradition and Sacred Scripture together form one sacred deposit of the Word of God, committed to the Church.'},
    {q:'"Sola Scriptura" is the belief of the Reformers that:', c:['Only the Bible, not tradition or the Church, is the final authority','Tradition is more important than Scripture','The Church has no authority at all','The Bible was written entirely by one apostle'], a:0, e:'Sola Scriptura is the belief that the Bible alone is the final authority, not Tradition or the Church.'},
    {q:'Which of the following is NOT one of the "Tripod of Catholic Faith"?', c:['Sacred Tradition','Sacred Scripture','Magisterium','Sola Scriptura'], a:3, e:'The Tripod consists of Sacred Tradition, Sacred Scripture, and the Magisterium — Sola Scriptura is the Reformers\' opposing position.'},
    {q:'Which teaching authority is entrusted to the Pope and bishops to interpret and safeguard revealed truth?', c:['Sacred Tradition','Sacred Scripture','The Magisterium','Sola Scriptura'], a:2, e:'The Magisterium is the Church\'s teaching authority, entrusted to the Pope and bishops in communion with him.'},
    {q:'Which doctrines are given as examples of teachings most clearly taught through Tradition, though only implicit in the Bible?', c:['The Trinity, infant baptism, Bible inerrancy, purgatory, Mary\'s perpetual virginity','Only the Ten Commandments','Only the Beatitudes','None — everything is explicit in the Bible'], a:0, e:'The notes give the Trinity, infant baptism, biblical inerrancy, purgatory, and Mary\'s perpetual virginity as apostolic teachings most clearly taught through Tradition, though only implicitly present in Scripture.'}
  ], glossary:[
    {term:'Fides', def:'Latin for trust, loyalty — root of "faith."'},
    {term:'Tradare', def:'Latin: to pass on; to hand over — root of "tradition."'},
    {term:'Sola Scriptura', def:'Reformers\' belief that Scripture alone is the final authority.'},
    {term:'Tripod of Catholic Faith', def:'Sacred Tradition, Sacred Scripture, and the Magisterium — working together.'}
  ]},
  {id:'ff3', title:'3. Faith, Creed, and the Holy Trinity', content:[
    {h:'Faith: Fides Qua and Fides Quae', b:[
      'Faith is a free assent to the whole truth God has revealed — "I believe" = "We believe."',
      'Fides Qua ("the faith BY WHICH one believes") — the act of believing: Worship (going to Mass), Morals (charities), Doctrine (Bible study).',
      'Fides Quae ("the faith WHICH is believed") — the content of faith: Worship (Liturgical Creed), Morals (Decalogue and Beatitudes), Doctrine (Trinitarian and Christological Dogmas).'
    ]},
    {h:'Creed', b:[
      '"Credo" (Latin): I believe.',
      'Catholic beliefs (CFC 233): communicating the Christian message, grounding insight into Christ\'s truth, uniting Catholics in commitment to Christ, inter-religious dialogue.',
      'Apostles\' Creed: no single author, developed over time; an ancient Roman baptismal symbol; the oldest authoritative doctrinal formulation of belief in the Holy Trinity.'
    ]},
    {h:'The Most Holy Trinity', b:[
      'God the Father, God the Son (Jesus Christ), and God the Holy Spirit — the most fundamental mystery of the Catholic faith, revealed by Jesus Christ.',
      'In Sacred Scripture: Creation, The Annunciation, The Baptism of Jesus, The Advocate, The Great Commission, Peter\'s Epistle, Paul\'s Epistle.',
      'Dogma: truths revealed by God Himself, expressed by the Church\'s teaching authority — the Trinity is One, the divine persons are really distinct, the divine persons are relative to one another.'
    ]},
    {h:'The Trinity Is One', b:[
      'By nature: the Trinity does not "share" divine substance among themselves — they are co-equal, co-eternal, and consubstantial.',
      'By relation of origin: the Trinity has the same substance but with three distinct divine persons.',
      '3 Divine Persons: The Father (origin without an origin), The Son (begotten by the Father), Holy Spirit (proceeds from the Father and Son).'
    ]}
  ], quiz:[
    {q:'"Fides Qua" refers to:', c:['The content of what is believed','The act of believing','A type of dogma','A Church council'], a:1, e:'Fides Qua ("the faith by which one believes") refers to the act of believing itself.'},
    {q:'"Fides Quae" refers to:', c:['The act of believing','The content of what is believed (creeds, dogmas)','A type of Mass','The Magisterium'], a:1, e:'Fides Quae ("the faith which is believed") refers to the actual content of belief — such as the Liturgical Creed and Trinitarian Dogmas.'},
    {q:'Under Fides Qua, "Worship" is exemplified by:', c:['The Liturgical Creed','Going to Mass','The Decalogue','Trinitarian Dogmas'], a:1, e:'Under Fides Qua (the act of believing), Worship is exemplified by the act of going to Mass.'},
    {q:'Under Fides Quae, "Doctrine" is exemplified by:', c:['Bible study','Charities','Trinitarian and Christological Dogmas','Going to Mass'], a:2, e:'Under Fides Quae (the content believed), Doctrine is exemplified by Trinitarian and Christological Dogmas.'},
    {q:'What does the Latin word "Credo" mean?', c:['I doubt','I believe','I worship','I obey'], a:1, e:'"Credo" is Latin for "I believe" — the root of the word "creed."'},
    {q:'The Apostles\' Creed is described as:', c:['Written by a single identified author','An ancient Roman baptismal symbol, developed over time','A 21st-century document','Only used by Protestants'], a:1, e:'The Apostles\' Creed has no single author, developed over time, and is an ancient Roman baptismal symbol.'},
    {q:'The doctrine of the Trinity refers to:', c:['Three separate gods','God the Father, God the Son, and God the Holy Spirit as one God','Only Jesus Christ','A concept unrelated to Christianity'], a:1, e:'The Trinity is the Christian doctrine of God the Father, God the Son (Jesus), and God the Holy Spirit — three persons, one God.'},
    {q:'Which Trinitarian person is described as "the origin without an origin"?', c:['The Father','The Son','The Holy Spirit','None of these'], a:0, e:'The Father is described as the origin without an origin — not begotten or proceeding from anyone else.'},
    {q:'Which Trinitarian person is described as "begotten by the Father"?', c:['The Father','The Son','The Holy Spirit','All three equally'], a:1, e:'The Son is described as begotten by the Father.'},
    {q:'The Trinity being "co-equal, co-eternal, and consubstantial" reflects their unity by:', c:['Relation of origin','Nature','Physical appearance','Historical timeline'], a:1, e:'By nature, the three Persons of the Trinity are co-equal, co-eternal, and consubstantial (sharing the same substance).'}
  ], glossary:[
    {term:'Fides Qua', def:'the act of believing (Worship, Morals, Doctrine as lived practice).'},
    {term:'Fides Quae', def:'the content of what is believed (Creed, Decalogue, Dogmas).'},
    {term:'Credo', def:'Latin: "I believe" — root of "creed."'},
    {term:'Consubstantial', def:'sharing the same divine substance — describes the unity of the Trinity by nature.'}
  ]},
  {id:'ff4', title:'4. The Bible: Old and New Testament', content:[
    {h:'The Bible', b:[
      'A faith-book written by and for believers; records events seen as designed/influenced by God; an EVENT of community.',
      'Composed of: Narratives, Genealogies, Laws, Prophetic Oracles, Poetry, Epistles, Drama, Apocalypses, Sayings, Biographical-sketches.',
      'Greek: Byblos (papyrus). Codex: papyrus stacked and bound together. Biblion: scroll/book (plural: biblia).',
      'How to distinguish Catholic books: Nihil Obstat ("nothing hinders," given by a Censor Librorum), Imprimi Potest ("it may be printed," given by the major religious superior), Imprimatur ("let it be printed," given by the author\'s diocesan bishop).'
    ]},
    {h:'Biblical Inspiration and Inerrancy', b:[
      'Inspiration (Latin, "to breathe into"): NOT ecstatic, NOT verbal/mechanical dictation, NOT subsequent approbation, NOT simply negative assistance, NOT mere ideological — the authors were not possessed; God was involved in the entire writing process, and every word was inspired.',
      'Biblical Inspiration: special influence of the Holy Spirit upon human authors so they write what God wanted (Dei Verbum, CCC 104, Pope Leo XIII\'s Providentissimus Deus).',
      'Biblical Inerrancy: freedom from error — the Bible contains error but teaches NO error; it teaches only the SAVING TRUTH.'
    ]},
    {h:'Formation and Canon of Scripture', b:[
      'Formation: Events and Experiences → Oral Tradition → Written Tradition (oral continued alongside) → Edited Tradition (authors refined/combined stories) → Canon of Scriptures (Church discerned which writings to include via apostolic Tradition).',
      'Canon: the official list of inspired books; means "measuring stick."',
      'Roman Catholic Bible: 73 (72) books — 46 Old Testament (45 if Jeremiah & Lamentations counted as one), 27 New Testament.',
      'Non-Catholic Bible: 66 books — 39 Old Testament, 27 New Testament.',
      'Apocrypha (Greek: "veiled or secret"): did not pass criteria for canonicity, considered heretical/irrelevant, cannot be used as standards of faith/morality, no apostolic guarantee.',
      'Deuterocanonicals ("second canon"): Catholics consider these equally inspired as the Protocanonicals — finalized at the Council of Trent, after which the Canon was closed.'
    ]},
    {h:'Unity of the Old and New Testament', b:[
      'The "Testament" is a solemn agreement (covenant) between God and Israel, fulfilled and universalized by Jesus.',
      'Old Testament: lesson on faithfulness through laws, stories, prophecies, wisdom literature; sacrifice = lamb; written primarily in Hebrew (some Greek).',
      'New Testament: tells of Jesus\' passion, life, death, resurrection; sacrifice = Jesus; written primarily in Greek (some Aramaic).'
    ]}
  ], quiz:[
    {q:'The Greek word "Byblos," root of "Bible," originally referred to:', c:['A scroll','Papyrus','A book cover','A type of ink'], a:1, e:'"Byblos" is the Greek word for papyrus, the material from which early books/scrolls were made.'},
    {q:'Which certification means "nothing hinders" and is given by a Censor Librorum?', c:['Imprimatur','Imprimi Potest','Nihil Obstat','Deuterocanonical'], a:2, e:'Nihil Obstat ("nothing hinders") is given by a Censor Librorum, attesting a book contains nothing damaging to faith or morals.'},
    {q:'Which certification, meaning "let it be printed," is given by the author\'s diocesan bishop?', c:['Nihil Obstat','Imprimatur','Imprimi Potest','Canon'], a:1, e:'Imprimatur ("let it be printed") is given by the author\'s diocesan bishop or the bishop of the place where the book is published.'},
    {q:'What does the Latin word "Inspiration" literally mean?', c:['To write down','To breathe into','To translate','To canonize'], a:1, e:'"Inspiration" comes from Latin meaning "to breathe into" — giving life or evidence of life.'},
    {q:'Biblical inspiration is NOT which of the following?', c:['Special influence of the Holy Spirit','Verbal or mechanical dictation','Guided by God throughout the process','Every word inspired by God'], a:1, e:'Biblical inspiration is explicitly NOT verbal or mechanical dictation — the authors were not possessed and went through the normal writing process, guided by God.'},
    {q:'Biblical inerrancy means the Bible:', c:['Has never had any surface-level discrepancies','Contains no errors at all in any subject, including science','Contains error but teaches no error — it teaches only the saving truth','Was dictated word-for-word by an angel'], a:2, e:'Biblical inerrancy means the Bible may contain surface-level inconsistencies, but it teaches NO error in matters necessary for salvation — the saving truth.'},
    {q:'How many books are in the Roman Catholic Bible?', c:['39','66','73','80'], a:2, e:'The Roman Catholic Bible has 73 (or 72, if Jeremiah & Lamentations are counted as one) books — 46 Old Testament, 27 New Testament.'},
    {q:'How many books are in the Non-Catholic Bible?', c:['39','66','73','27'], a:1, e:'The Non-Catholic Bible has 66 books — 39 Old Testament, 27 New Testament.'},
    {q:'"Deuterocanonical" literally means:', c:['First canon','Second canon','No canon','Ancient canon'], a:1, e:'"Deuterocanonical" means "second canon," referring to the second set of canonized books that Catholics consider equally inspired.'},
    {q:'Which council formally closed the Canon of the Bible, meaning no other books would be added?', c:['Council of Nicaea','Council of Trent','Second Vatican Council','Council of Jerusalem'], a:1, e:'The Council of Trent finalized and closed the Canon of Scripture, after which no further books would be added.'},
    {q:'What symbolic sacrifice is associated with the Old Testament?', c:['Jesus','A lamb','Bread and wine','Incense'], a:1, e:'The Old Testament\'s symbolic sacrifice is the lamb, later fulfilled by Jesus\' sacrifice in the New Testament.'},
    {q:'The New Testament was written primarily in which language?', c:['Hebrew','Greek','Latin','Aramaic'], a:1, e:'The New Testament was written primarily in Greek, with some parts in Aramaic.'}
  ], glossary:[
    {term:'Nihil Obstat', def:'"nothing hinders" — given by a Censor Librorum.'},
    {term:'Imprimatur', def:'"let it be printed" — given by the author\'s diocesan bishop.'},
    {term:'Canon of Scripture', def:'the official list of inspired books; means "measuring stick."'},
    {term:'Deuterocanonical', def:'"second canon" — books Catholics consider equally inspired, finalized at the Council of Trent.'},
    {term:'Biblical Inerrancy', def:'freedom from error — the Bible teaches no error in the saving truth.'}
  ]}
]},
{id:'lcs', name:'LCS: Life Career Skills', lessons:[
{id:'lc1', title:'1. Human Development: Foundations', content:[
    {h:'Self-Concept & Development', b:[
      'Self-Concept: our cognition of ourselves — what we think/know about our identity, personality, individuality; a subjective description filtered by our own perceptions; purely/mostly informational.',
      'Ideal self and actual self are two broad categories of self-concept.',
      'Development: the pattern of change beginning at conception and continuing through the lifespan; involves both growth AND decline (e.g. morality may improve with age while physical ability declines).'
    ]},
    {h:'Nature vs. Nurture', b:[
      'Nature: biological/genetic predispositions (e.g. inheriting a parent\'s illness like diabetes or cancer).',
      'Nurture: influences of learning and environment (e.g. lifestyle, secondhand smoke exposure).',
      'Nature is largely uncontrollable, but a stable, supportive environment (nurture) can help manage genetic risk.'
    ]},
    {h:'Individual Differences & Factors Affecting Development', b:[
      'Age, Gender, and Ethnic Background may affect the developmental process.',
      'Risk Factors: internal and external conditions that NEGATIVELY affect development (e.g. smoking, poor sleep, not studying).',
      'Protective Factors: internal and external conditions that POSITIVELY affect development (e.g. friends who encourage studying).',
      'The same factor (like your social circle) can be protective or a risk factor depending on the influence it has on you.'
    ]},
    {h:'The 4 Domains of Developmental Stages', b:['Physical Development, Psycho-social Development, Cognitive Development, Moral Development.']}
  ], quiz:[
    {q:'Which term refers to our cognition of ourselves — what we think/know about our identity, personality, and individuality?', c:['Self-esteem','Self-concept','Self-regulation','Self-actualization'], a:1, e:'Self-concept is defined as a subjective description of who we think we are, filtered by our own perceptions.'},
    {q:'What are the two broad categories of self-concept?', c:['Ideal self and Actual self','Public self and Private self','Nature self and Nurture self','Physical self and Mental self'], a:0, e:'The two broad categories of self-concept are the ideal self and the actual self.'},
    {q:'Development is best described as:', c:['Only growth, with no decline','A pattern of change involving both growth and decline across the lifespan','A fixed state that never changes','Only relevant to childhood'], a:1, e:'Development is a pattern of change beginning at conception, involving both growth and decline (e.g. physical decline with age, even as morality/wisdom grows).'},
    {q:'Inheriting a parent\'s predisposition to a disease like diabetes is an example of:', c:['Nurture','Nature','A protective factor only','Individual differences only'], a:1, e:'This is an example of Nature — biological/genetic predispositions.'},
    {q:'Growing up exposed to secondhand smoke is an example of:', c:['Nature','Nurture','Neither nature nor nurture','A cognitive stage'], a:1, e:'This is an example of Nurture — the influence of environment and learning/exposure.'},
    {q:'Friends who encourage you to study are functioning as a:', c:['Risk factor','Protective factor','Nature factor','Individual difference'], a:1, e:'Friends who positively influence your development, like encouraging studying, act as a protective factor.'},
    {q:'Which of the following is NOT one of the 4 domains of developmental stages listed?', c:['Physical Development','Psycho-social Development','Financial Development','Moral Development'], a:2, e:'The 4 domains are Physical, Psycho-social, Cognitive, and Moral Development — "Financial Development" is not one of them.'}
  ], glossary:[
    {term:'Self-Concept', def:'our cognition of ourselves — what we think/know about our identity, personality, individuality.'},
    {term:'Nature', def:'biological/genetic predispositions.'},
    {term:'Nurture', def:'influences of learning and environment.'},
    {term:'Risk Factors', def:'internal/external conditions that negatively affect development.'},
    {term:'Protective Factors', def:'internal/external conditions that positively affect development.'}
  ]},
{id:'lc2', title:'2. Physical Development Across the Lifespan', content:[
    {h:'Prenatal Development (3 Stages)', b:[
      'Prenatal Development: the period from conception to birth, encompassing embryo/fetus formation.',
      'Germinal Stage (0-2 weeks): starts with the zygote; implantation occurs.',
      'Embryonic Stage (3-8 weeks): organs begin forming (not fully developed); the embryo is sensitive to teratogens (harmful substances like alcohol, smoke, chemicals that affect development).',
      'Fetal Stage (9 weeks to birth): the developing fetus, before birth.'
    ]},
    {h:'Infancy, Toddlerhood & Early Childhood', b:[
      'Infancy and Toddlerhood (birth-2 yrs): rapid physical growth, sensory-motor development, attachment forms.',
      'Babies\' Reflexes: Root Reflex (finding food when cheek/mouth is touched), Suck Reflex (taking in food), Moro Reflex (startle response).',
      'Toddler Milestones: kicks a ball, runs, walks, twists doorknobs, jumps with both feet, turns book pages.',
      'Early Childhood (2-6 yrs): steady growth, language/social/cognitive development, fine motor skills develop (e.g. coloring within lines, unbuttoning, jump rope).'
    ]},
    {h:'Middle Childhood & Adolescence', b:[
      'Middle Childhood (6-12 yrs): physical growth slows; improvement in BOTH gross motor skills (e.g. biking) and fine motor skills (e.g. nail clipping).',
      'Early Adolescence (12-18 yrs): growth spurts, secondary sexual characteristics, hormonal fluctuations; peer relationships become more important than family time; puberty usually begins ages 8-12.',
      'Late Adolescence: physical development mostly complete; relationships become more stable; better impulse control; more mature cognitive abilities (abstract thinking, planning); focus shifts to solidifying sense of self/identity.',
      'Late Adolescence Risk Factors: substance use, sexual risk behavior, aggressiveness/violence, self-harm, depressive/suicidal behavior.',
      'Risk-Prevention Factors: supportive family/peers/school/community, healthcare, healthy sleep, regular exercise, developing coping/problem-solving skills, building resilience.'
    ]},
    {h:'Adulthood', b:[
      'Early Adulthood (18-40): intimacy, career development, relationship establishment; PEAK of physical health, strength, stamina.',
      'Middle Adulthood (40-65): generativity vs. stagnation, career advancement, family responsibilities; gradual decline of physical abilities; Menopause and Andropause.',
      'Late Adulthood (65+): reflection on life accomplishments, adjustment to physical changes; pronounced decline, frailty, health vulnerabilities.'
    ]}
  ], quiz:[
    {q:'During which stage of prenatal development is the embryo MOST sensitive to teratogens?', c:['Germinal Stage','Embryonic Stage','Fetal Stage','None — sensitivity is constant'], a:1, e:'The Embryonic Stage (3-8 weeks) is when the embryo is most sensitive to teratogens, as organs are actively forming.'},
    {q:'What are teratogens?', c:['Beneficial nutrients for the fetus','Harmful substances that can affect embryo development (e.g. alcohol, smoke, chemicals)','A type of reflex','A stage of adolescence'], a:1, e:'Teratogens are harmful substances — like alcohol, smoke, and certain chemicals — that can negatively affect the development of the embryo.'},
    {q:'Which baby reflex describes the automatic turning of the head when the cheek/mouth is touched?', c:['Suck Reflex','Root Reflex','Moro Reflex','Grasp Reflex'], a:1, e:'The Root Reflex causes a baby to turn their head automatically when their cheek or mouth area is touched, helping them find food.'},
    {q:'Which baby reflex is described as their "startle response"?', c:['Root Reflex','Suck Reflex','Moro Reflex','Babinski Reflex'], a:2, e:'The Moro Reflex is the baby\'s startle response, a protective reaction when they are surprised or scared.'},
    {q:'During Middle Childhood (6-12 years), what generally happens to the rate of physical growth?', c:['It speeds up dramatically','It slows down, while motor skills improve','It stops completely','It reverses'], a:1, e:'During Middle Childhood, physical growth slows down, but there is a noticeable improvement in both gross and fine motor skills.'},
    {q:'According to the notes, puberty usually begins around what age range?', c:['Ages 2-6','Ages 8-12','Ages 18-25','Ages 40-65'], a:1, e:'Puberty usually happens from ages 8-12, marking the start of early adolescence\'s physical changes.'},
    {q:'What is the key distinction between "adolescence" and "puberty" according to the notes?', c:['They are exactly the same thing','Adolescence is the broader developmental stage; puberty is the specific physical change','Puberty is the broader stage; adolescence is the specific change','Neither term is related to development'], a:1, e:'Adolescence is the broader developmental stage encompassing this period of life, while puberty specifically refers to the physical/hormonal changes.'},
    {q:'Which life stage is described as the PEAK of physical health, strength, and stamina?', c:['Early Adolescence','Early Adulthood (18-40)','Middle Adulthood','Late Adulthood'], a:1, e:'Early Adulthood (18-40) is described as the peak of physical health, strength, and stamina.'},
    {q:'Menopause and Andropause are associated with which life stage?', c:['Early Adulthood','Middle Adulthood (40-65)','Late Adulthood','Early Adolescence'], a:1, e:'Middle Adulthood (40-65) is marked by Menopause and Andropause, along with gradual decline of physical abilities.'},
    {q:'Which life stage is described as having "pronounced decline, frailty, and health vulnerabilities"?', c:['Early Adulthood','Middle Adulthood','Late Adulthood (65+)','Early Adolescence'], a:2, e:'Late Adulthood (65+) is characterized by pronounced physical decline, frailty, and health vulnerabilities.'}
  ], glossary:[
    {term:'Teratogens', def:'harmful substances (alcohol, smoke, chemicals) that can affect embryo development.'},
    {term:'Root / Suck / Moro Reflex', def:'baby instincts: finding food, taking in food, startle response.'},
    {term:'Gross motor skills', def:'larger movements like biking. Fine motor skills — more intricate movements like nail clipping.'}
  ]},
{id:'lc3', title:'3. Erikson\'s Psychosocial Development', content:[
    {h:'Overview: Erikson\'s 8 Stages', b:[
      'Erik Erikson proposed 8 stages of psychosocial development, each with a social virtue and conflict.',
      'Erikson: "You cannot neglect the negative development because it is needed to have a healthier development" — both positive and negative experiences balance to build a stable sense of self.',
      'Epigenetic principle: each stage must be gone through in life; failing to resolve a conflict at one stage can affect the future adult self.'
    ]},
    {h:'Stages 1-4 (Childhood)', b:[
      'Stage 1 — Trust vs. Mistrust (0-2 yrs): "Can I trust the world?" Virtue: Hope. Caregivers consistently meeting needs builds trust; neglect leads to mistrust. A SMALL degree of mistrust helps develop healthy cautiousness (too much trust = gullibility/naivety).',
      'Stage 2 — Autonomy vs. Shame and Doubt (2-4 yrs): "Can I do things myself?" Virtue: Will. The "me do it" stage. A hint of shame/doubt teaches limits/safety and humility; too much unchecked autonomy can lead to recklessness.',
      'Stage 3 — Initiative vs. Guilt (4-5 yrs): "Is it ok for me to do things?" Virtue: Purpose. Freedom to choose builds initiative/decision-making; a little guilt builds a moral compass without losing initiative.',
      'Stage 4 — Industry vs. Inferiority (5-12 yrs): "How can I be good?" Virtue: Competence. Success builds competence; a touch of inferiority (e.g. losing a competition) can motivate growth if balanced.'
    ]},
    {h:'Stages 5-8 (Adolescence to Late Adulthood)', b:[
      'Stage 5 — Identity vs. Role Confusion (12-19 yrs): "Who am I?" Virtue: Fidelity. Teens develop a strong sense of self through exploration/experimentation before committing to a stable identity.',
      'Stage 6 — Intimacy vs. Isolation (20-40 yrs): "Can I love and be loved?" Virtue: Love. Intimacy isn\'t only romantic — includes friends/family. A little isolation/"me time" prepares a person for healthier intimacy.',
      'Stage 7 — Generativity vs. Stagnation (40-65 yrs): "What can I contribute to the world?" Virtue: Care. Contributing to the world builds a sense of accomplishment; some stagnation can still lead to finding new purpose/redirection.',
      'Stage 8 — Integrity vs. Despair (65-death): "Was my life a good one?" Virtue: Wisdom. Looking back with satisfaction (integrity) vs. regret/sorrow/bitterness (despair).'
    ]}
  ], quiz:[
    {q:'Who proposed the 8 stages of psychosocial development?', c:['Jean Piaget','Erik Erikson','Lawrence Kohlberg','Robert Havighurst'], a:1, e:'Erik Erikson proposed the Lifespan Model of Personality Development, consisting of 8 stages of social virtues and conflict.'},
    {q:'Which stage asks the major question "Can I trust the world?"', c:['Trust vs. Mistrust','Autonomy vs. Shame and Doubt','Identity vs. Role Confusion','Intimacy vs. Isolation'], a:0, e:'Trust vs. Mistrust (ages 0-2) centers on the question "Can I trust the world?" with the virtue of Hope.'},
    {q:'The "me do it" stage, where children develop independence, is:', c:['Trust vs. Mistrust','Autonomy vs. Shame and Doubt','Initiative vs. Guilt','Industry vs. Inferiority'], a:1, e:'Autonomy vs. Shame and Doubt (ages 2-4) is the "me do it" stage, where the virtue of Will develops through independence.'},
    {q:'Which stage\'s virtue is "Purpose," involving the question "Is it ok for me to do things?"', c:['Autonomy vs. Shame and Doubt','Initiative vs. Guilt','Industry vs. Inferiority','Identity vs. Role Confusion'], a:1, e:'Initiative vs. Guilt (ages 4-5) has the virtue of Purpose, centered on the question "Is it ok for me to do things?"'},
    {q:'A student joins a quiz bee and loses, but the resulting motivation to work harder for the next opportunity reflects healthy resolution of which stage?', c:['Trust vs. Mistrust','Industry vs. Inferiority','Generativity vs. Stagnation','Integrity vs. Despair'], a:1, e:'This reflects Industry vs. Inferiority (ages 5-12) — a touch of inferiority can motivate growth toward the virtue of Competence.'},
    {q:'The major question "Who am I?" belongs to which stage?', c:['Industry vs. Inferiority','Identity vs. Role Confusion','Intimacy vs. Isolation','Generativity vs. Stagnation'], a:1, e:'Identity vs. Role Confusion (ages 12-19) centers on "Who am I?" with the virtue of Fidelity.'},
    {q:'According to the notes, intimacy in the "Intimacy vs. Isolation" stage refers to:', c:['Only romantic relationships','Loving relationships broadly, including friends and family, not just romantic partners','Only family relationships','Isolation from all relationships'], a:1, e:'The notes clarify that intimacy isn\'t just about romantic relationships — it includes friends, family, and people around you.'},
    {q:'Which stage asks "What can I contribute to the world?" with the virtue of Care?', c:['Intimacy vs. Isolation','Generativity vs. Stagnation','Integrity vs. Despair','Industry vs. Inferiority'], a:1, e:'Generativity vs. Stagnation (ages 40-65) centers on contributing to the world, with the virtue of Care.'},
    {q:'The final stage, "Integrity vs. Despair" (65-death), has which virtue?', c:['Hope','Fidelity','Wisdom','Love'], a:2, e:'Integrity vs. Despair has the virtue of Wisdom, reflecting on whether one\'s life was lived well.'},
    {q:'The "epigenetic principle" in Erikson\'s theory means:', c:['Stages can be skipped freely','Each stage must be gone through, and unresolved conflicts can affect the future adult self','Only genetics matter, not experience','Development stops after childhood'], a:1, e:'The epigenetic principle states that each stage is like a blueprint that must be resolved — failing to do so can affect one\'s future adult self.'}
  ], glossary:[
    {term:'Epigenetic principle', def:'each psychosocial stage must be resolved; unresolved conflicts affect the future adult self.'},
    {term:'Trust vs. Mistrust', def:'0-2 yrs, virtue: Hope.'},
    {term:'Autonomy vs. Shame and Doubt', def:'2-4 yrs, virtue: Will.'},
    {term:'Initiative vs. Guilt', def:'4-5 yrs, virtue: Purpose.'},
    {term:'Industry vs. Inferiority', def:'5-12 yrs, virtue: Competence.'},
    {term:'Identity vs. Role Confusion', def:'12-19 yrs, virtue: Fidelity.'},
    {term:'Intimacy vs. Isolation', def:'20-40 yrs, virtue: Love.'},
    {term:'Generativity vs. Stagnation', def:'40-65 yrs, virtue: Care.'},
    {term:'Integrity vs. Despair', def:'65-death, virtue: Wisdom.'}
  ]},
{id:'lc4', title:'4. Piaget\'s Cognitive & Kohlberg\'s Moral Development', content:[
    {h:'Piaget: Cognitive Development Overview', b:[
      'Proposed by Jean Piaget; development is a product of children\'s efforts to understand and act on their world.',
      'Stage 1 — Sensorimotor (0-2 yrs): infants explore using senses/actions; develop object permanence (main milestone, e.g. peek-a-boo). No symbolic thought yet.',
      'Stage 2 — Preoperational (2-7 yrs): symbolic thinking emerges (language, pretend play — main milestone); egocentric. Key traits: Egocentrism, Animism, Centration, Lack of Conservation, Lack of Reversibility, Transductive Reasoning.',
      'Conservation example: a child chooses the "bigger-looking" flattened clay over the ball shape, even though both have equal amounts — reflecting a LACK of conservation understanding.',
      'Stage 3 — Concrete Operational (7-11 yrs): logical operations on concrete objects. Key traits: Decentring (egocentrism fades), Reversibility (e.g. knowing a Labrador is a dog, a dog is an animal), Conservation, Classification, Seriation. Still struggles with abstract/hypothetical thinking.',
      'Stage 4 — Formal Operational (12+ yrs): capable of abstract reasoning, hypothetical/deductive thinking. Key traits: Abstract reasoning (main milestone), Deductive reasoning, Working memory, Metacognition (thinking about thinking). Some individuals may never fully reach this stage.'
    ]},
    {h:'Piaget: Key Cognitive Concepts', b:[
      'Schema: mental "file folder" — categories of knowledge that help interpret/understand the world; building blocks of knowledge.',
      'Assimilation: integrating NEW information into an EXISTING schema (e.g. a child calls a cat a "dog" because it fits their existing dog schema).',
      'Accommodation: MODIFYING an existing schema or creating a new one to fit new information (e.g. being corrected: "That\'s not a dog, it\'s a cat").',
      'Equilibration: the balancing process between assimilation and accommodation as understanding develops.'
    ]},
    {h:'Kohlberg: Moral Development', b:[
      'Proposed by Lawrence Kohlberg; moral development is highly dependent on cognitive development — it is NOT absolute that aging automatically makes someone morally upright.',
      'Pre-Conventional Level (Childhood): Obedience and Punishment Orientation (avoiding punishment, deference to power) → Individualism and Exchange (self-interest, personal benefit/fairness for oneself).',
      'Conventional Level (Adolescence/Adulthood): Good Interpersonal Relationships (being seen as "good," maintaining social approval) → Maintaining Social Order (obeying laws, fulfilling duties, respecting authority).',
      'Post-Conventional Level (Advanced Moral Reasoning): Social Contract and Individual Rights (laws are beneficial but can be changed if they violate fundamental rights) → Universal Principles (justice, equality, human dignity/rights).'
    ]}
  ], quiz:[
    {q:'Who proposed the theory of Cognitive Development in stages?', c:['Erik Erikson','Jean Piaget','Lawrence Kohlberg','Robert Havighurst'], a:1, e:'Jean Piaget proposed the theory of cognitive development, viewing development as children\'s efforts to understand and act on their world.'},
    {q:'Object permanence, the main milestone of which stage, is best exemplified by a game of peek-a-boo?', c:['Sensorimotor','Preoperational','Concrete Operational','Formal Operational'], a:0, e:'Object permanence — understanding that objects continue to exist even when not seen — is the main milestone of the Sensorimotor stage (0-2 yrs).'},
    {q:'A child choosing a flattened piece of clay over a ball-shaped piece of equal size, believing it\'s "more," demonstrates a LACK of:', c:['Egocentrism','Conservation','Object permanence','Metacognition'], a:1, e:'This classic experiment shows a lack of conservation — the inability to understand that quantity stays the same despite a change in shape/appearance.'},
    {q:'Symbolic thinking, such as language and pretend play, is the main milestone of which stage?', c:['Sensorimotor','Preoperational','Concrete Operational','Formal Operational'], a:1, e:'Symbolic thinking is the main milestone of the Preoperational stage (2-7 yrs), alongside traits like egocentrism and animism.'},
    {q:'Understanding that a Labrador is a dog, and a dog is an animal, demonstrates which trait of the Concrete Operational stage?', c:['Egocentrism','Reversibility','Object permanence','Metacognition'], a:1, e:'This demonstrates Reversibility — the awareness that actions/relationships (categorization) can be reversed or reasoned through logically.'},
    {q:'"Thinking about thinking" describes which concept, associated with the Formal Operational stage?', c:['Assimilation','Metacognition','Conservation','Centration'], a:1, e:'Metacognition — thinking about one\'s own thinking — is a key characteristic of the Formal Operational stage (12+ years).'},
    {q:'A child calls a cat a "dog" because it has four legs and fur, matching their existing schema of a dog. This is an example of:', c:['Accommodation','Assimilation','Equilibration','Conservation'], a:1, e:'This is Assimilation — integrating new information (the cat) into an existing schema (dog) without modifying the schema.'},
    {q:'A child is corrected — "That\'s not a dog, it\'s a cat" — and adjusts their mental categories accordingly. This is an example of:', c:['Assimilation','Accommodation','Centration','Object permanence'], a:1, e:'This is Accommodation — modifying an existing schema or creating a new one to fit new information.'},
    {q:'Who proposed the theory of Moral Development in stages?', c:['Jean Piaget','Erik Erikson','Lawrence Kohlberg','Sigmund Freud'], a:2, e:'Lawrence Kohlberg proposed the theory of moral development, organized into Pre-Conventional, Conventional, and Post-Conventional levels.'},
    {q:'"Avoiding punishment" as a basis for moral decisions belongs to which level?', c:['Pre-Conventional','Conventional','Post-Conventional','None of these'], a:0, e:'"Obedience and Punishment Orientation" — avoiding punishment and deferring to power — belongs to the Pre-Conventional level (childhood).'},
    {q:'Moral reasoning based on maintaining social order, obeying laws, and respecting authority belongs to which level?', c:['Pre-Conventional','Conventional','Post-Conventional','None of these'], a:1, e:'"Maintaining Social Order" belongs to the Conventional level (adolescence/adulthood).'},
    {q:'Moral reasoning based on universal principles like justice, equality, and human dignity belongs to which level?', c:['Pre-Conventional','Conventional','Post-Conventional','None of these'], a:2, e:'"Universal Principles" is the most advanced stage, belonging to the Post-Conventional level.'},
    {q:'According to the notes, is it absolutely true that moral development automatically improves simply with age?', c:['Yes, always','No — moral development is highly dependent on cognitive development, not just age','Only for men','Only for people who study'], a:1, e:'The notes explicitly state that it is not absolute that aging alone makes someone morally upright — moral development depends heavily on cognitive development.'}
  ], glossary:[
    {term:'Sensorimotor (0-2)', def:'object permanence is the main milestone.'},
    {term:'Preoperational (2-7)', def:'symbolic thinking; egocentrism, animism, lack of conservation/reversibility.'},
    {term:'Concrete Operational (7-11)', def:'logical operations on concrete objects; decentring, reversibility, conservation.'},
    {term:'Formal Operational (12+)', def:'abstract reasoning, deductive reasoning, metacognition.'},
    {term:'Schema', def:'mental "file folder" — category of knowledge that helps interpret the world.'},
    {term:'Assimilation', def:'integrating new information into an existing schema.'},
    {term:'Accommodation', def:'modifying/creating a schema to fit new information.'},
    {term:'Pre-Conventional / Conventional / Post-Conventional', def:'Kohlberg\'s 3 levels of moral development, from punishment-avoidance to universal ethical principles.'}
  ]},
{id:'lc5', title:'5. Self-Concept and Identity', content:[
    {h:'Self-Concept', b:[
      'Self-Concept: our cognition of ourselves — identity, personality, individuality; a subjective, mostly informational description filtered by our own perception.',
      'Actual Self: who I believe I am now. Ideal Self: who I want to become.',
      'A healthy self-concept forms when the actual and ideal selves are CLOSE to each other — building self-acceptance, confidence, and motivation.'
    ]},
    {h:'Dimensions of Self-Concept', b:[
      'Private Self (Actual): how I ACTUALLY see myself. Private Self (Ideal): how I WOULD LIKE to see myself.',
      'Social Self (Actual): how others ACTUALLY see me. Social Self (Ideal): how I would like OTHERS to see me.',
      'Gaps between these dimensions (e.g. who I am vs. who I want to be) can affect self-esteem/motivation; closer alignment = more confidence and authenticity.'
    ]},
    {h:'Identity & Marcia\'s Identity Statuses', b:[
      'Identity: how individuals define themselves in relation to social roles, group memberships, cultural expectations — one\'s social definition/role in groups.',
      'James Marcia (1980) proposed 4 Identity Statuses based on EXPLORATION and COMMITMENT.',
      'Identity Diffusion: No exploration, No commitment. "#LostMode." Associated with very permissive parents; difficulty setting/maintaining career goals as adults; lack of direction/motivation.',
      'Identity Foreclosure: No exploration, YES commitment. "#PrePlannedLife." Maintains childhood goals (often set by authority figures like parents); associated with high authoritarianism and stereotypical thinking; dependent relationships.',
      'Identity Moratorium: YES exploration, No commitment. "#FindingMe." Actively exploring different possibilities (e.g. trying different extracurriculars); uncertain about the future but open to experimenting.',
      'Identity Achievement: YES exploration, YES commitment. "#ThisIsMe." Generally mature; demonstrates better decision-making skills.'
    ]},
    {h:'The MAMA Cycle', b:[
      'MAMA Cycle: Moratorium → Achievement → Moratorium → Achievement (James Marcia).',
      'Identity development doesn\'t move ONCE from moratorium to achievement and stay there permanently — people cycle back and forth as life changes/stressors challenge existing commitments.',
      'Why it matters: identity formation is a LIFELONG process (not one-time); going through cycles is HEALTHY, allowing adjustment to new roles/values; it also helps explain identity instability (e.g. in early adulthood) as normal and adaptive.',
      'Example — Identity as a Parent: Moratorium (unsure of parenting style, reading books) → Achievement (commits to gentle discipline) → Moratorium (approach stops working as child becomes teen) → Achievement (adopts a revised parenting philosophy).'
    ]}
  ], quiz:[
    {q:'"Who I believe I am now" describes the:', c:['Ideal Self','Actual Self','Social Self only','Private Self only'], a:1, e:'The Actual Self is who I believe I am right now, as opposed to the Ideal Self (who I want to become).'},
    {q:'A healthy self-concept is built when:', c:['The actual and ideal selves are very far apart','The actual and ideal selves are close to each other','A person has no ideal self at all','A person only considers others\' opinions'], a:1, e:'When the actual self and ideal self are close together, it builds self-acceptance, confidence, and motivation.'},
    {q:'"How others actually see me" describes which dimension of self-concept?', c:['Private Self (Actual)','Social Self (Actual)','Private Self (Ideal)','Social Self (Ideal)'], a:1, e:'Social Self (Actual) refers to how others actually perceive you, as opposed to Private Self which is your own self-perception.'},
    {q:'Who proposed the 4 Identity Statuses based on exploration and commitment?', c:['Erik Erikson','James Marcia','Jean Piaget','Lawrence Kohlberg'], a:1, e:'James Marcia (1980) proposed the 4 Identity Statuses, building on Erikson\'s identity concepts.'},
    {q:'Which identity status is characterized by NO exploration and NO commitment ("#LostMode")?', c:['Identity Diffusion','Identity Foreclosure','Identity Moratorium','Identity Achievement'], a:0, e:'Identity Diffusion has no exploration and no commitment — often linked to permissive parenting and lack of direction.'},
    {q:'Which identity status is characterized by NO exploration but YES commitment, often maintaining childhood goals set by parents?', c:['Identity Diffusion','Identity Foreclosure','Identity Moratorium','Identity Achievement'], a:1, e:'Identity Foreclosure involves committing to goals (often set by parents/authority figures) without ever exploring alternatives — "#PrePlannedLife."'},
    {q:'Which identity status involves actively exploring different possibilities without having committed yet ("#FindingMe")?', c:['Identity Diffusion','Identity Foreclosure','Identity Moratorium','Identity Achievement'], a:2, e:'Identity Moratorium involves active exploration (e.g. trying different extracurriculars) without having made a firm commitment yet.'},
    {q:'Which identity status involves BOTH exploration AND commitment, associated with maturity and better decision-making?', c:['Identity Diffusion','Identity Foreclosure','Identity Moratorium','Identity Achievement'], a:3, e:'Identity Achievement involves having explored options AND made a commitment — associated with maturity and better decision-making skills.'},
    {q:'What does the "MAMA cycle" stand for?', c:['Mistrust → Autonomy → Mistrust → Autonomy','Moratorium → Achievement → Moratorium → Achievement','Mother → Adolescent → Mother → Adolescent','Motivation → Ambition → Motivation → Achievement'], a:1, e:'The MAMA cycle stands for Moratorium → Achievement → Moratorium → Achievement, showing identity development cycles rather than a one-time path.'},
    {q:'According to the MAMA cycle concept, going back into moratorium after having achieved an identity commitment is:', c:['Always a sign of a serious problem','Normal and adaptive, part of healthy identity growth','Impossible according to the theory','Only relevant to teenagers'], a:1, e:'The MAMA cycle shows that returning to moratorium after achievement can be normal and adaptive — a healthy part of adjusting identity over a lifetime.'}
  ], glossary:[
    {term:'Self-Concept', def:'subjective, mostly informational description of who we think we are.'},
    {term:'Actual Self / Ideal Self', def:'who I believe I am now / who I want to become.'},
    {term:'Identity Diffusion', def:'No exploration, No commitment. "#LostMode."'},
    {term:'Identity Foreclosure', def:'No exploration, Yes commitment. "#PrePlannedLife."'},
    {term:'Identity Moratorium', def:'Yes exploration, No commitment. "#FindingMe."'},
    {term:'Identity Achievement', def:'Yes exploration, Yes commitment. "#ThisIsMe."'},
    {term:'MAMA Cycle', def:'Moratorium → Achievement → Moratorium → Achievement — identity development as an ongoing cycle.'}
  ]},
{id:'lc6', title:'6. Self-Esteem', content:[
    {h:'What is Self-Esteem?', b:[
      'Self-Esteem: our attitude toward ourselves (how we VALUE ourselves).',
      'Situational: shaped by success, failure, praise, or criticism — can go up/down with feedback.',
      'Emotionally inclined: linked to pride, confidence, shame, doubt.',
      'Matters because it affects mental health, relationships, and motivation.',
      'Research finding: self-esteem is an EFFECT, not a CAUSE, of academic performance.',
      'Self-Concept (informative, knowledge-based, cognitive — "what I know about myself") vs. Self-Esteem (evaluative, emotional, positive/negative feelings — "how I feel about what I know").'
    ]},
    {h:'Self-Esteem Across Adolescence', b:[
      'Early Adolescence (11-13 yrs): continuous DECLINE in self-esteem.',
      'Middle Adolescence (14-18 yrs): increase in self-esteem.',
      'Late Adolescence (19-20 yrs): continuous increase in self-esteem.',
      'Healthy self-esteem: knows their capabilities, effective learner, confident/ambitious, feels valued, builds healthy relationships, high resistance to peer/media pressure.',
      'Low self-esteem: doesn\'t know capabilities, feels unrespected, isolated, unable to control personal life/decisions, less resistant to peer pressure (more likely to smoke/abuse substances).'
    ]},
    {h:'Must We Aim for VERY High Self-Esteem? (3 Experimental Findings)', b:[
      '1. #KnowYourReach / #NotYourEgoGoals: threats to people with HIGH self-esteem can lead them to set inappropriate, risky goals beyond their capability, resulting in smaller rewards than people with lower self-esteem who set realistic goals.',
      '2. #PeaceOverPride: inflated/unstable/fragile self-esteem is most prone to feeling threatened — may lead to directing anger outward (aggression/violence) to avoid a downward revision of self-concept. Real confidence is steady/humble, not built on putting others down.',
      '3. #ConfidenceWithCare: high self-esteem fosters experimentation, which MAY increase early sexual activity/drinking, but overall effects of self-esteem on behavior are generally negligible.'
    ]},
    {h:'How to Boost Self-Esteem', b:[
      'Positive self-talk; avoid comparing yourself to others; movement and exercise; don\'t strive for perfection.',
      'Don\'t beat yourself up over mistakes; focus on things you can change; do things you enjoy; celebrate small wins.',
      'Be helpful and considerate; surround yourself with supportive people.'
    ]}
  ], quiz:[
    {q:'Self-esteem is best described as:', c:['Our attitude toward ourselves (how we value ourselves)','Purely factual knowledge about ourselves','A fixed trait that never changes','Unrelated to emotions'], a:0, e:'Self-esteem is our attitude toward ourselves — how we value ourselves, tied to feelings like pride, confidence, or shame.'},
    {q:'According to research mentioned in the notes, self-esteem is:', c:['A cause of academic performance','An effect, not a cause, of academic performance','Completely unrelated to academic performance','Only relevant in adulthood'], a:1, e:'Research shows self-esteem is an EFFECT (result) of academic performance, not necessarily a direct cause of it.'},
    {q:'During which stage of adolescence does self-esteem generally show a CONTINUOUS DECLINE?', c:['Early Adolescence (11-13)','Middle Adolescence (14-18)','Late Adolescence (19-20)','It never declines'], a:0, e:'Early Adolescence (11-13 years) is associated with a continuous decline in self-esteem.'},
    {q:'During which stage of adolescence does self-esteem show a CONTINUOUS INCREASE?', c:['Early Adolescence','Middle Adolescence','Late Adolescence (19-20)','It only increases in childhood'], a:2, e:'Late Adolescence (19-20 years) shows a continuous increase in self-esteem.'},
    {q:'Which of the following is a characteristic of HEALTHY self-esteem?', c:['Feels isolated','Knows their own capabilities and is confident/ambitious','Unable to make decisions','Less capable of forming relationships'], a:1, e:'Healthy self-esteem includes knowing one\'s capabilities, being confident/ambitious, and building healthy relationships.'},
    {q:'Which of the following is a characteristic of LOW self-esteem?', c:['High resistance to peer pressure','Feelings of being valued','Less capable of forming good, long-term relationships','More likely to succeed'], a:2, e:'Low self-esteem is linked to being less capable of forming good, long-term relationships, among other negative outcomes.'},
    {q:'According to the experimental findings, when people with HIGH self-esteem feel threatened, they tend to:', c:['Set overly cautious, easy goals','Set inappropriate, risky goals beyond their capabilities','Give up entirely','Always succeed regardless'], a:1, e:'Threatened high self-esteem can lead people to set risky, unrealistic goals beyond their actual capability, often resulting in worse outcomes.'},
    {q:'Fragile, inflated self-esteem being threatened may lead to which outcome, according to the notes?', c:['Increased humility','Directing anger outward (aggression/violence) to protect the ego','Immediate self-improvement','No effect at all'], a:1, e:'Inflated or unstable self-esteem, when threatened, may lead to directing anger outward as a way of avoiding a downward revision of self-concept.'},
    {q:'Which of the following best distinguishes self-concept from self-esteem?', c:['Self-concept is evaluative; self-esteem is informative','Self-concept is informative/cognitive (what you know); self-esteem is evaluative/emotional (how you feel about it)','They are identical concepts','Self-esteem is only relevant to adults'], a:1, e:'Self-concept is informative and cognitive — knowledge about yourself. Self-esteem is evaluative and emotional — how you feel about that knowledge.'},
    {q:'Which of the following is listed as a way to boost self-esteem?', c:['Compare yourself constantly to others','Strive for perfection at all times','Positive self-talk and celebrating small wins','Isolate yourself from supportive people'], a:2, e:'Positive self-talk and celebrating small wins are both listed as healthy ways to boost self-esteem — comparing to others and striving for perfection are discouraged.'}
  ], glossary:[
    {term:'Self-Esteem', def:'our attitude toward ourselves; situational, emotionally inclined.'},
    {term:'Self-Concept vs. Self-Esteem', def:'Self-concept = informative/cognitive (what you know); Self-esteem = evaluative/emotional (how you feel about it).'},
    {term:'#KnowYourReach', def:'threatened high self-esteem can lead to setting unrealistic, risky goals.'},
    {term:'#PeaceOverPride', def:'fragile/inflated self-esteem, when threatened, may lead to aggression.'}
  ]},
{id:'lc7', title:'7. Emotional Intelligence', content:[
    {h:'What is Emotional Intelligence?', b:[
      'Popularized by Daniel Goleman in his 1996 book "Emotional Intelligence" — challenged the idea that IQ alone determines life success.',
      'The ability to understand, use, and manage our emotions well — helps build relationships, make good decisions, cope with difficult situations.',
      'Bar-On (2005): the ability to understand/express oneself, relate well with others, and successfully cope with daily life demands.',
      'Key skill: managing our OWN and OTHERS\' emotions, especially under pressure.',
      'Emotionally intelligent people usually become effective leaders — they focus on relationships, not just tasks.'
    ]},
    {h:'The 5 Components of Emotional Intelligence (Goleman)', b:[
      '1. Self-Awareness: tuning in to one\'s feelings; recognizing emotions and their effects on others; accepting feelings (positive or negative) without judgment.',
      '2. Self-Regulation: controlling disruptive impulses from negative emotions. Includes: Trustworthiness (honesty/integrity), Conscientiousness (taking responsibility), Adaptability (flexibility with change), Innovation (openness to new ideas).',
      '3. Motivation: internal drive to work toward goals due to a positive attitude; reframes negative thoughts (e.g. "studying will help me reach my goals" instead of "I hate studying").',
      '4. Empathy: recognizing/understanding how others feel; discerning the feelings behind others\' needs/wants — more than just "feeling sorry," it means tuning in and responding.',
      '5. Social Skills ("people skills"): working well with others through collaboration/cooperation; being a good team player, resolving disagreements respectfully.'
    ]},
    {h:'Distinguishing Feelings from Thoughts', b:[
      'It\'s important to distinguish real FEELINGS from THOUGHTS disguised as feelings.',
      'Example: "I feel my teacher is unfair" is actually a THOUGHT, not a feeling — the real feeling underneath might be anger, hurt, or frustration.',
      'A feeling is usually NOT clearly expressed when "feel" is followed by: that, like, as if; pronouns (I, you, he, she, they, it); or nouns/names.',
      'Feelings Vocabulary — needs MET: absorbed, affectionate, alive, appreciated, cheerful, curious, delighted, excited, hopeful, proud, serene, trustful, etc.',
      'Feelings Vocabulary — needs NOT MET: afraid, angry, anxious, bewildered, confused, discouraged, frustrated, helpless, resentful, sad, scared, worried, etc.'
    ]}
  ], quiz:[
    {q:'Who popularized the concept of Emotional Intelligence in his 1996 book?', c:['Jean Piaget','Daniel Goleman','James Marcia','Lawrence Kohlberg'], a:1, e:'Daniel Goleman popularized Emotional Intelligence in his 1996 book of the same name, challenging the idea that IQ alone determines success.'},
    {q:'According to Bar-On (2005), emotional intelligence includes the ability to understand/express oneself, relate well with others, and:', c:['Achieve the highest IQ score','Successfully cope with the demands of daily life','Avoid all emotions','Only succeed academically'], a:1, e:'Bar-On (2005) defines EI as including the ability to understand/express oneself, relate well with others, AND successfully cope with daily life demands.'},
    {q:'How many key components of Emotional Intelligence did Goleman identify?', c:['3','5','7','10'], a:1, e:'Goleman identified 5 key components: Self-awareness, Self-regulation, Motivation, Empathy, and Social skills.'},
    {q:'Which EI component involves "tuning in to one\'s feelings" and accepting them without judgment?', c:['Self-Regulation','Self-Awareness','Motivation','Empathy'], a:1, e:'Self-Awareness involves tuning in to and recognizing one\'s own feelings, and accepting them whether positive or negative.'},
    {q:'Which EI component includes Trustworthiness, Conscientiousness, Adaptability, and Innovation?', c:['Self-Awareness','Self-Regulation','Motivation','Social Skills'], a:1, e:'Self-Regulation includes these four traits, controlling disruptive impulses from negative emotions.'},
    {q:'Which EI component involves an internal drive to reach goals, even reframing negative thoughts positively?', c:['Self-Awareness','Empathy','Motivation','Social Skills'], a:2, e:'Motivation is the internal drive to work toward goals, involving reframing negative thoughts into positive, goal-oriented ones.'},
    {q:'Which EI component involves recognizing and understanding how OTHER people feel?', c:['Self-Awareness','Self-Regulation','Empathy','Social Skills'], a:2, e:'Empathy involves recognizing and understanding the feelings and needs of other people.'},
    {q:'Which EI component is also referred to as "people skills"?', c:['Self-Awareness','Motivation','Empathy','Social Skills'], a:3, e:'Social Skills, or "people skills," involve working well with others through collaboration and cooperation.'},
    {q:'The statement "I feel my teacher is unfair" is actually an example of a:', c:['True feeling','Thought disguised as a feeling','Type of self-regulation','Type of empathy'], a:1, e:'This is a THOUGHT, not a true feeling — when "feel" is followed by "that" or a noun, it usually indicates a judgment/thought rather than a genuine emotion.'},
    {q:'Which of the following is a clue that "feel" is being followed by a THOUGHT rather than a true feeling?', c:['Being followed by "that," "like," or a noun/pronoun','Being a single simple word like "happy" or "sad"','Being expressed through body language','Being written down'], a:0, e:'When "feel" is followed by words like "that," "like," "as if," pronouns, or nouns/names, it usually signals a thought rather than a clear feeling.'}
  ], glossary:[
